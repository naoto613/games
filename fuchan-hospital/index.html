(()=>{"use strict";

// soft 3D shading

    c.beginPath();c.moveTo(-7.8,-35.6);c.lineTo(7.8,-35.6);c.lineTo(9.4,-2.4);c.quadraticCurveTo(0,-1.4,-9.4,-2.4);c.closePath();c.fill();c.stroke();
    c.save();c.clip();const P=C.pat||['#ff8cbc','#c9a2e6'];[[-5,-8],[4,-7],[-2,-31],[5,-30],[-6,-21],[1,-12],[7,-13],[-3,-16],[5,-20],[-7,-4],[2,-4]].forEach(([a,b],i)=>{c.fillStyle=P[i%2];for(let k=0;k<5;k++){const an=k/5*TAU;circ(c,a+Math.cos(an)*1.05,b+Math.sin(an)*1.05,.85);}c.fillStyle='#fff6b0';circ(c,a,b,.45);});c.restore();
    if(!back){c.beginPath();c.moveTo(-4.4,-35.6);c.lineTo(3.2,-2.4);c.stroke();c.fillStyle='#fff';c.beginPath();c.moveTo(-4.6,-35.8);c.lineTo(0,-29.6);c.lineTo(4.6,-35.8);c.lineTo(2.6,-35.8);c.lineTo(0,-32);c.lineTo(-2.6,-35.8);c.closePath();c.fill();c.stroke();}
    c.fillStyle=vfill(c,-27.6,-22.6,C.ribbon);rr(c,-8.1,-27.6,16.2,5,1.2);c.fill();c.stroke();c.strokeStyle=shade(C.ribbon,.45);c.lineWidth=.8;c.beginPath();c.moveTo(-8,-25.1);c.lineTo(8,-25.1);c.stroke();c.strokeStyle=L;c.lineWidth=.9;
    if(back){c.fillStyle=C.ribbon;for(const s of[-1,1]){c.beginPath();c.ellipse(s*5.8,-26,5.8,3.6,s*.25,0,TAU);c.fill();c.stroke();c.beginPath();c.moveTo(s*1.2,-23.5);c.lineTo(s*4.2,-14);c.lineTo(s*1.6,-15);c.closePath();c.fill();c.stroke();}c.fillStyle=shade(C.ribbon,-.1);circ(c,0,-25.6,2.2);c.stroke();}}
  else{const skc=mag?'#ff7ab8':C.dress;c.fillStyle=vfill(c,-25,-11,skc,.15,-.1);c.beginPath();c.moveTo(-6.4,-25);c.lineTo(6.4,-25);c.lineTo(11.6+sw*.4,-12);c.quadraticCurveTo(0,-10.4,-11.6+sw*.4,-12);c.closePath();c.fill();c.stroke();
    c.fillStyle=mag?'#fff':(C.skirt||'#fff');c.beginPath();c.moveTo(-11.3,-13.4);c.quadraticCurveTo(0,-11.8,11.3,-13.4);c.lineTo(11.6+sw*.4,-12);c.quadraticCurveTo(0,-10.4,-11.6+sw*.4,-12);c.closePath();c.fill();
    if(mag){c.fillStyle='#fff';for(let k=-10;k<=10;k+=2.5)circ(c,k,-11.4,1.3);}
    c.fillStyle=gfill(c,-1,-31,9,mag?'#ffffff':C.dress);rr(c,-6.6,-35.6,13.2,11,[3,3,1,1]);c.fill();c.stroke();c.fillStyle=mag?'#ff3d8a':C.ribbon;c.fillRect(-6.8,-26,13.6,1.8);
    if(!back){c.fillStyle='#fff';c.beginPath();c.moveTo(-3.6,-35.6);c.lineTo(0,-32.6);c.lineTo(3.6,-35.6);c.closePath();c.fill();c.stroke();if(mag){bow(c,0,-31,3.4,'#ff3d8a');c.fillStyle='#ffe36a';heartP(c,0,-30.8,1.3);c.fill();}else bow(c,0,-25.2,2,C.ribbon);}}

  if(coat&&!back){const cf=vfill(c,-36,-8,coat,.12,-.1);c.fillStyle=cf;for(const s of[-1,1]){c.beginPath();c.moveTo(s*2.2,-35.8);c.lineTo(s*7.9,-35.4);c.quadraticCurveTo(s*10.6,-22,s*11.8,-8.6);c.quadraticCurveTo(s*7,-7.6,s*2,-8.4);c.lineTo(s*1.6,-24);c.closePath();c.fill();c.stroke();

  let out=g;if(AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=pan;g.connect(p);out=p;}o.connect(g);out.connect(MG);o.start(t);o.stop(t+d+.05);}
function sfx(k){switch(k){
  case'siren':for(let i=0;i<3;i++){tone(960,.38,'square',.045,i*.8);tone(960,.38,'triangle',.12,i*.8);tone(770,.38,'square',.045,i*.8+.4);tone(770,.38,'triangle',.12,i*.8+.4);}break;
  case'siren1':tone(960,.3,'triangle',.1);tone(770,.3,'triangle',.1,.32);break;
  case'dokkun':tone(80,.14,'sine',.7,0,-30);tone(66,.2,'sine',.55,.17,-20);break;
  case'drill':tone(1700,.22,'sawtooth',.035,0,250);noise(.22,.06,5200);break;
  case'xray':tone(180,.5,'sine',.1,0,60);tone(360,.5,'sine',.04,0,120);break;
  case'ring':for(let k=0;k<2;k++)for(let i=0;i<6;i++)tone(i%2?1320:1100,.05,'square',.05,k*.5+i*.05);break;
  case'key':tone(1209,.13,'sine',.14);tone(770,.13,'sine',.14);break;
  case'wrap':noise(.2,.12,1800);tone(500,.12,'sine',.05,0,200);break;
  case'clip':tone(2400,.03,'square',.1);noise(.04,.3,3000);break;
  case'hooray':[784,988,1175,1568].forEach((f,i)=>tone(f,.2,'triangle',.18,i*.08));break;
  case'cheer':sfxBase('fanfare');break;
  case'car':tone(120,.2,'sawtooth',.03,0,40);break;
  case'bump':tone(140,.2,'sine',.35,0,-60);noise(.15,.2,400);break;
  case'roll':for(let i=0;i<8;i++)tone(900+i*60,.04,'square',.04,i*.06);break;
  case'fill':[1568,2093,2637].forEach((f,i)=>tone(f,.18,'sine',.12,i*.05));break;
  default:sfxBase(k);
}}

  enter(){const lv=lvOf('naika');const ds=shuffle(lv>=1?['cold','throat','tummy','vaccine']:['cold','throat','tummy']).slice(0,3);this.queue=ds;this.pi=0;this.miss=0;this.fin=0;this.lay();this.newPatient();},

  update(dt){const p=this.p;for(const t of this.tools)t.upd(dt);if(p.hop>0)p.hop-=dt*2;if(p.shake>0)p.shake-=dt;

    ORGANS.forEach(([id,ja,en])=>{const q=this.opos(id);if(this.learned.includes(id)&&this.ph==='in'){const side={brain:1,lungs:-1,heart:1,stomach:1,intestines:-1,bones:1}[id];const {cx,u}=this.O();const w=Math.max(ja.length*20+24,84);const lx=side>0?Math.min(cx+22*u,W-w-6):Math.max(6,cx-22*u-w);const ly=q.y-26;c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=2;c.beginPath();c.moveTo(q.x,q.y);c.lineTo(side>0?lx:lx+w,ly+26);c.stroke();c.fillStyle='rgba(255,255,255,.92)';rr(c,lx,ly,w,52,12);c.fill();txt(c,ja,lx+w/2,ly+16,18,'#3a3a6a');txt(c,en,lx+w/2,ly+38,13,'#3a88e8');}
      else if(this.ph==='in'&&!this.learned.includes(id)){c.strokeStyle=`rgba(255,240,120,${.5+Math.sin(T*5)*.4})`;c.lineWidth=3;c.setLineDash([8,6]);c.beginPath();c.arc(q.x,q.y,q.r*1.3,0,TAU);c.stroke();c.setLineDash([]);}});
    txt(c,this.ph==='in'?`からだの なか  ${this.learned.length} / ${ORGANS.length}`:`クイズ ${this.qi+1} / 3`,W/2,150,22,'#bfe0ff');},
  draw(c){if(this.ph==='out'){roomBg(c,'#fff0f0','#f4dcdc',H-60,'#fff8f8');fu(c,this.fx,this.fy,this.fs,{outfit:fuOutfit({coat:null}),steth:false,happy:this.hl&&this.hl.ok,oh:this.hl&&!this.hl.ok});
      if(this.hl&&this.hl.t<2){const q=BPARTS.find(b=>b[0]===this.hl.id);for(const [ux,uy] of q[3]){const p=this.P(ux,uy);c.strokeStyle=this.hl.ok?'#4cc86a':'#ff9a3a';c.lineWidth=6;c.beginPath();c.arc(p.x,p.y,q[4]*this.fs*.9+10,0,TAU);c.stroke();}}
      txt(c,`${Math.min(this.qi+1,5)} / 5`,W-40,160,22,'#ff5fa2','right');drawRikki(c,W-70,H-60,{sc:1.6,t:T,happy:1});this.rkPos={x:W-70,y:H-60,sc:1.6};}
    else{this.drawInside(c);drawRikki(c,W-60,H-30,{sc:1.4,t:T,happy:1});this.rkPos={x:W-60,y:H-30,sc:1.4};}},
  hitPart(x,y){let best=null,bd=1e9;for(const q of BPARTS)for(const [ux,uy] of q[3]){const p=this.P(ux,uy);const d=Math.hypot(x-p.x,y-p.y)/(q[4]*this.fs*.9+14);if(d<1&&d<bd){bd=d;best=q;}}return best;},
  hitOrgan(x,y){let best=null,bd=1e9;for(const o of ORGANS){const p=this.opos(o[0]);const d=Math.hypot(x-p.x,y-p.y)/(p.r*1.3+10);if(d<1&&d<bd){bd=d;best=o;}}return best;},
  down(x,y){if(this.fin)return;

        if(this.qi>=5){setTimeout(()=>{if(scene===this){this.ph='in';this.hl=null;say('ぜんもん せいかい！ つぎは レントゲンで からだの なかを のぞいてみよう。 ひかっている ところを タッチしてね');}},2200);}else setTimeout(()=>{if(scene===this)this.ask();},1800);}
      else{this.hl={id:hit[0],ok:0,t:0};this.miss++;sfx('no');hush();speak(`そこは ${hit[1]}`);speak(hit[2],'en');}return;}
    const o=this.hitOrgan(x,y);if(!o)return;
    if(this.ph==='in'){this.hl={id:o[0],t:0};sfx(o[0]==='heart'?'dokkun':'pop');hush();speak(o[1]);speak(o[2],'en');speak(o[3]);card={k:o[0]==='heart'?'heart':null,ja:o[1],en:o[2],t:0};if(!this.learned.includes(o[0]))this.learned.push(o[0]);

  hint(){if(this.fin)return null;if(this.ph==='out'){if(this.qi>=5)return null;const q=this.qs[this.qi];const p=this.P(...q[3][0]);return{x:p.x,y:p.y};}
    if(this.ph==='in'){const o=ORGANS.find(o=>!this.learned.includes(o[0]));if(!o)return null;const p=this.opos(o[0]);return{x:p.x,y:p.y};}
    if(this.ph==='quiz'&&this.oq&&this.qi<3){const p=this.opos(this.oq[this.qi][0]);return{x:p.x,y:p.y};}return null;},
  hintText(){if(this.ph==='out'&&this.qs[this.qi])return `${this.qs[this.qi][1]}を タッチしてね`;if(this.ph==='in')return 'ひかっている ところを タッチ';return '';}};
// ================= にゅういん ごはん（3しょくの えいよう） =================
const FOODG={red:['fish','egg','milk','cheese','meat'],yellow:['bread','onigiri','corn'],green:['carrot','tomato','apple','grapes','banana','broccoli']};
const GINFO={red:['あか','#ff4d6d','からだを つくる','red'],yellow:['きいろ','#f0b800','ちからに なる','yellow'],green:['みどり','#3cb85a','ちょうしを ととのえる','green']};
const GKEYS=['red','yellow','green'];
SCN.meal={bg:'#f0fff0',song:'fuwa',
  enter(){const lv=lvOf('meal');const per=lv<1?2:3;this.queue=shuffle(GKEYS.flatMap(g=>shuffle(FOODG[g]).slice(0,per).map(k=>({k,g}))));this.total=this.queue.length;this.placed={red:[],yellow:[],green:[]};this.told={};this.miss=0;this.fin=0;this.ph='sort';this.eat=0;this.k=pick(['bear','rabbit','panda','pig','cat','dog']);this.lay();
    say(`${WORDS[this.k][0]}さんは にゅういんちゅう。 げんきに なる ごはんを つくろう！ たべものを おなじ いろの おさらに のせてね`);setTimeout(()=>{if(scene===this)this.nextFood();},3800);},
  lay(){this.bedY=H*.4;this.plY=H*.64;},
  plate(i){return{x:W/2+(i-1)*190,y:this.plY};},
  nextFood(){const f=this.queue.shift();if(!f){this.cur=null;this.ph='eat';this.eat=.01;hush();speak(`ぜんぶで ${this.total}こ！ いただきます！`);speak(`${numEn(this.total)} foods!`,'en');return;}this.cur=new Dr({k:f.k,hx:W/2,hy:H-90,r:60});this.cur.g=f.g;},
  update(dt){if(this.cur)this.cur.upd(dt);
    if(this.ph==='eat'){this.eat+=dt;if(Math.random()<dt*3)sfx('munch');if(this.eat>4&&!this.cured){this.cured=1;sfx('fanfare');RK.clap=2;confetti(50);say('ごちそうさま！ すっかり げんきに なった！ たいいん おめでとう！');}if(this.eat>7&&!this.fin)this.fin=.01;}
    if(this.fin>0){this.fin+=dt;if(this.fin>.3&&this.fin<9){this.fin=9;celebrate('meal',starsFor(this.miss));}}},
  draw(c){roomBg(c,'#eaffea','#d8f0d0',this.bedY+60,'#f4fff4');const bx=W/2+40,by=this.bedY;
    // window
    c.fillStyle='#bfe8ff';rr(c,40,150,130,110,10);c.fill();c.strokeStyle='#fff';c.lineWidth=8;c.stroke();c.beginPath();c.moveTo(105,150);c.lineTo(105,260);c.stroke();c.fillStyle='#fff';circ(c,80,190,14);circ(c,96,184,16);
    // bed + patient
    const up=this.cured?Math.min(1,(this.eat-4)*1.5):0;
    c.fillStyle='#d8e4f4';rr(c,bx-170,by-150,20,180,8);c.fill();c.fillStyle='#fff';rr(c,bx-160,by-40,330,60,16);c.fill();c.strokeStyle='#b8c8e0';c.lineWidth=4;c.stroke();c.fillStyle='#9ab0d0';c.fillRect(bx-150,by+20,12,50);c.fillRect(bx+146,by+20,12,50);
    if(!this.cured){c.fillStyle='#fff';rr(c,bx-150,by-110,90,50,20);c.fill();drawAnimal(c,this.k,bx-20,by-6,1.05,{t:T,sad:this.ph==='sort',eat:this.ph==='eat'?1:0});c.fillStyle='#8ad0ff';rr(c,bx-110,by-54,280,52,16);c.fill();c.strokeStyle='#5aa8e8';c.lineWidth=3;c.stroke();c.fillStyle='rgba(255,255,255,.5)';for(let i=0;i<5;i++)circ(c,bx-80+i*56,by-28,8);}
    else{drawAnimal(c,this.k,bx-20+Math.sin(T*3)*30*up,by+60-up*20,1.05,{t:T,happy:1,dance:1});c.fillStyle='#8ad0ff';rr(c,bx-110,by-54,280,52,16);c.fill();}
    if(this.ph==='sort'){c.fillStyle='#fff';rr(c,W-120,by-230,100,60,14);c.fill();txt(c,`${this.total-this.queue.length-(this.cur?1:0)} / ${this.total}`,W-70,by-200,22,'#4cc86a');}
    // tray + plates
    c.fillStyle='#f4d8a8';rr(c,20,this.plY-100,W-40,200,24);c.fill();c.strokeStyle='#d8b078';c.lineWidth=4;c.stroke();
    GKEYS.forEach((g,i)=>{const p=this.plate(i),G=GINFO[g];c.fillStyle='#fff';circ(c,p.x,p.y,80);c.strokeStyle=G[1];c.lineWidth=10;c.beginPath();c.arc(p.x,p.y,76,0,TAU);c.stroke();c.fillStyle=G[1];rr(c,p.x-50,p.y-112,100,30,15);c.fill();txt(c,G[0],p.x,p.y-97,18,'#fff');txt(c,G[2],p.x,p.y+104,14,shade(G[1],-.3));
      this.placed[g].forEach((k,j)=>{const a=j/Math.max(1,this.placed[g].length)*TAU-Math.PI/2,r=this.placed[g].length>1?38:0;if(this.ph==='eat'&&this.eat>1+j*.5+i*.9)return;drawThing(c,k,p.x+Math.cos(a)*r,p.y+Math.sin(a)*r,this.placed[g].length>1?.72:.95);});});
    if(this.cur){tray(c,H-90,130);if(this.cur.held){const i=GKEYS.indexOf(this.cur.g);}this.cur.draw(c,1.5);}
    fu(c,80,this.bedY+150,2.1,{point:this.ph==='sort',cheer:!!this.cured});rk(this,c,W-50,H-160,1.4,{happy:!!this.cured});},
  down(x,y){if(this.cur&&this.cur.hit(x,y)){this.cur.held=true;sfx('tap');sayWord(this.cur.k);}},
  move(x,y){if(this.cur&&this.cur.held){this.cur.x=x;this.cur.y=y;}},
  up(x,y){const f=this.cur;if(!f||!f.held)return;f.held=false;const i=GKEYS.findIndex((g,i)=>{const p=this.plate(i);return Math.hypot(x-p.x,y-p.y)<95;});if(i<0)return;const g=GKEYS[i];
    if(g===f.g){this.placed[g].push(f.k);sfx('ding');burst(this.plate(i).x,this.plate(i).y,8,'star');const G=GINFO[g];if(!this.told[g]){this.told[g]=1;hush();speak(`${G[0]}の なかま！ ${G[2]} よ`);speak(G[3],'en');}this.cur=null;setTimeout(()=>{if(scene===this)this.nextFood();},this.told[g]===1?1300:500);this.told[g]=2;}
    else{sfx('no');this.miss++;const G=GINFO[f.g];hush();speak(`${WORDS[f.k][0]}は ${G[0]}の なかま。 ${G[2]}よ`);bub={text:`${WORDS[f.k][0]}は ${G[0]}の なかま`,t:0,life:2.6};}},
  hint(){if(!this.cur||this.cur.held)return null;const i=GKEYS.indexOf(this.cur.g);const p=this.plate(i);return{x:this.cur.hx,y:this.cur.hy,x2:p.x,y2:p.y};},
  hintText(){if(!this.cur)return'';const G=GINFO[this.cur.g];return`${WORDS[this.cur.k][0]}は ${G[0]}の おさらだよ`;}};
// ================= input =================
let idle=0,hintSaid=0;
function toV(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-OX)/SC,y:(e.clientY-r.top-OY)/SC};}
let ptrId=null;
const RKLINES=['りっきー！ きゃっきゃ！','ねえね がんばれー！','ばぶー！','りっきーも おてつだい！','あーうー！','ねえね だいすき！'];
cv.addEventListener('pointerdown',e=>{audioInit();if(ptrId!==null&&ptrId!==e.pointerId)return;ptrId=e.pointerId;try{cv.setPointerCapture(e.pointerId);}catch(_){}const p=toV(e);idle=0;hintSaid=0;ring(p.x,p.y,'rgba(255,255,255,.9)');
  if(tr)return;if(cel){celDown(p.x,p.y);return;}
  if(!scene.noHome&&hitC(p.x,p.y,56,60,46)){sfx('tap');go('lobby');return;}
  if(scene.rkPos&&!scene.noRk){const r=scene.rkPos;if(rkHit(p.x,p.y,r.x,r.y,r.sc)){RK.hop=1;rkCheer();say(pick(scene.rkLines||RKLINES));burst(r.x,r.y-40*r.sc,8,'heart');return;}}
  if(scene.down)scene.down(p.x,p.y);});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==ptrId)return;const p=toV(e);if(scene.move&&!tr&&!cel)scene.move(p.x,p.y);});
const up=e=>{if(e.pointerId!==ptrId)return;ptrId=null;const p=toV(e);if(scene.up&&!tr&&!cel)scene.up(p.x,p.y);};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden){hush();if(AC)AC.suspend();}else if(AC)AC.resume();});
// ================= loop =================
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  try{
  if(tr){tr.t+=dt;if(!tr.sw&&tr.t>=.35){tr.sw=true;scene=SCN[tr.next];scene.rkPos=null;parts.length=0;bub=null;card=null;scene.enter&&scene.enter();}if(tr.t>=.7)tr=null;}
  if(bub){bub.t+=dt;if(bub.t>bub.life)bub=null;}if(card){card.t+=dt;if(card.t>3)card=null;}
  if(cel)celUpdate(dt);if(RK.clap>0)RK.clap-=dt;if(RK.hop>0)RK.hop-=dt*2;
  if(!cel&&scene.update)scene.update(dt);
  updParts(dt);
  if(!cel&&!tr&&scene.hint){idle+=dt;if(idle>9&&!hintSaid&&scene.hintText){hintSaid=1;const ht=scene.hintText();if(ht)say(ht);}if(idle>24){idle=8;hintSaid=0;}}
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle=scene.bg||'#fff';c.fillRect(0,0,cv.width,cv.height);
  c.setTransform(DPR*SC,0,0,DPR*SC,DPR*OX,DPR*OY);
  scene.draw(c);
  drawParts(c);
  if(!cel&&!tr&&scene.hint&&idle>6){const h=scene.hint();if(h){const k=h.x2!=null?((T*.7)%1):0;const e=k<.8?k/.8:1;const hx=h.x2!=null?lerp(h.x,h.x2,ease(e)):h.x,hy=h.x2!=null?lerp(h.y,h.y2,ease(e)):h.y;drawHand(c,hx,hy,T);}}
  if(!scene.noHome)drawBtn(c,56,60,40,'#ff8cc0','home');
  drawCard(c);drawBubble(c);
  if(cel)drawCel(c);
  if(tr)drawTr(c);
  }catch(err){if(!frame.e){frame.e=1;console.error(err);}}
}
resize();scene=SCN.title;scene.enter();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{for(const k in SPR)delete SPR[k];});
requestAnimationFrame(frame);
window.__hosp={thumb(cv2){const c=cv2.getContext('2d');c.setTransform(cv2.width/800,0,0,cv2.height/500,0,0);drawThumb(c);},SCN,get scene(){return scene},go,SAVE,celebrate,get cel(){return cel},get H(){return H},celDown,parts};
})();
