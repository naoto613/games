(()=>{"use strict";

// soft 3D shading

    c.beginPath();c.moveTo(-7.8,-35.6);c.lineTo(7.8,-35.6);c.lineTo(9.4,-2.4);c.quadraticCurveTo(0,-1.4,-9.4,-2.4);c.closePath();c.fill();c.stroke();
    c.save();c.clip();const P=C.pat||['#ff8cbc','#c9a2e6'];[[-5,-8],[4,-7],[-2,-31],[5,-30],[-6,-21],[1,-12],[7,-13],[-3,-16],[5,-20],[-7,-4],[2,-4]].forEach(([a,b],i)=>{c.fillStyle=P[i%2];for(let k=0;k<5;k++){const an=k/5*TAU;circ(c,a+Math.cos(an)*1.05,b+Math.sin(an)*1.05,.85);}c.fillStyle='#fff6b0';circ(c,a,b,.45);});c.restore();
    if(!back){c.beginPath();c.moveTo(-4.4,-35.6);c.lineTo(3.2,-2.4);c.stroke();c.fillStyle='#fff';c.beginPath();c.moveTo(-4.6,-35.8);c.lineTo(0,-29.6);c.lineTo(4.6,-35.8);c.lineTo(2.6,-35.8);c.lineTo(0,-32);c.lineTo(-2.6,-35.8);c.closePath();c.fill();c.stroke();}
    c.fillStyle=vfill(c,-27.6,-22.6,C.ribbon);rr(c,-8.1,-27.6,16.2,5,1.2);c.fill();c.stroke();c.strokeStyle=shade(C.ribbon,.45);c.lineWidth=.8;c.beginPath();c.moveTo(-8,-25.1);c.lineTo(8,-25.1);c.stroke();c.strokeStyle=L;c.lineWidth=.9;
    if(back){c.fillStyle=C.ribbon;for(const s of[-1,1]){c.beginPath();c.ellipse(s*5.8,-26,5.8,3.6,s*.25,0,TAU);c.fill();c.stroke();c.beginPath();c.moveTo(s*1.2,-23.5);c.lineTo(s*4.2,-14);c.lineTo(s*1.6,-15);c.closePath();c.fill();c.stroke();}c.fillStyle=shade(C.ribbon,-.1);circ(c,0,-25.6,2.2);c.stroke();}}
  else{const skc=mag?'#ff7ab8':C.dress;c.fillStyle=vfill(c,-25,-11,skc,.15,-.1);c.beginPath();c.moveTo(-6.4,-25);c.lineTo(6.4,-25);c.lineTo(11.6+sw*.4,-12);c.quadraticCurveTo(0,-10.4,-11.6+sw*.4,-12);c.closePath();c.fill();c.stroke();
    c.fillStyle=mag?'#fff':(C.skirt||'#fff');c.beginPath();c.moveTo(-11.3,-13.4);c.quadraticCurveTo(0,-11.8,11.3,-13.4);c.lineTo(11.6+sw*.4,-12);c.quadraticCurveTo(0,-10.4,-11.6+sw*.4,-12);c.closePath();c.fill();
    if(mag){c.fillStyle='#fff';for(let k=-10;k<=10;k+=2.5)circ(c,k,-11.4,1.3);}
    c.fillStyle=gfill(c,-1,-31,9,mag?'#ffffff':C.dress);rr(c,-6.6,-35.6,13.2,11,[3,3,1,1]);c.fill();c.stroke();c.fillStyle=mag?'#ff3d8a':C.ribbon;c.fillRect(-6.8,-26,13.6,1.8);
    if(!back){c.fillStyle='#fff';c.beginPath();c.moveTo(-3.6,-35.6);c.lineTo(0,-32.6);c.lineTo(3.6,-35.6);c.closePath();c.fill();c.stroke();if(mag){bow(c,0,-31,3.4,'#ff3d8a');c.fillStyle='#ffe36a';heartP(c,0,-30.8,1.3);c.fill();}else bow(c,0,-25.2,2,C.ribbon);}}

  if(coat&&!back){const cf=vfill(c,-36,-8,coat,.12,-.1);c.fillStyle=cf;for(const s of[-1,1]){c.beginPath();c.moveTo(s*2.2,-35.8);c.lineTo(s*7.9,-35.4);c.quadraticCurveTo(s*10.6,-22,s*11.8,-8.6);c.quadraticCurveTo(s*7,-7.6,s*2,-8.4);c.lineTo(s*1.6,-24);c.closePath();c.fill();c.stroke();
      c.fillStyle=shade(coat,-.06);c.beginPath();c.moveTo(s*2.2,-35.8);c.lineTo(s*5.6,-35.6);c.lineTo(s*3.2,-28);c.closePath();c.fill();c.stroke();c.fillStyle=cf;}

  if(o.steth&&!back){c.strokeStyle='#5a6a8a';c.lineWidth=1.1;c.beginPath();c.moveTo(-4.4,-36.4);c.quadraticCurveTo(-6.4,-28,-2.4,-26);c.moveTo(4.4,-36.4);c.quadraticCurveTo(6.4,-28,2.4,-26);c.moveTo(-2.4,-26);c.quadraticCurveTo(0,-24.6,2.4,-26);c.moveTo(0,-25.2);c.quadraticCurveTo(-1,-21,1.6,-19.4);c.stroke();c.fillStyle=gfill(c,1.6,-18.4,2.6,'#c8d4e8');c.strokeStyle=L;c.lineWidth=.8;circ(c,1.8,-18.2,2.1);c.stroke();c.lineWidth=.9;}

    if(this.key==='ribbon'&&!hg){tray(c,H-84,110);this.ribs.forEach((col,i)=>{const x=W/2+(i-1)*150;bow(c,x,H-90,20,col);});}
    if(this.key==='wash'&&this.done.wash)txt(c,'',0,0,1,'#000');
    drawPt(c,this.owner,hg?150:70,H*.52,.75,{t:T,sad:!hg,cry:!hg&&this.si<0,happy:hg,dance:hg&&this.hug>1.2,hop:hg?Math.abs(Math.sin(T*6))*.4:0});
    fu(c,70,H-150,2,{point:!hg,cheer:hg});rk(this,c,W-54,H-150,1.4);
    if(this.tools.some(t=>!t.hidden)){tray(c,H-84,110);for(const t of this.tools)if(!t.held)t.draw(c,1.2);for(const t of this.tools)if(t.held)t.draw(c,1.45);}
    stepDots(c,this.steps.length,Math.max(0,this.si)+(hg?1:0));},
  down(x,y){if(this.fin||this.hug||this.si<0)return;const k=this.key;
    if(k==='armon'){const A=this.armX;if(A&&Math.hypot(x-A.x,y-A.y)<50){A.held=1;sfx('tap');}return;}
    if(k==='eyebtn'){this.btns.forEach((b,i)=>{const bx=W/2+(i-(this.btns.length-1)/2)*120;if(hitC(x,y,bx,H-84,40)){if(b===this.eyeC){this.newEye=b;this.btns=[];good(this.toyP(this.eyeMiss*13,-86).x,this.toyP(0,-86).y,2,'おなじ いろ！');hush();speak(`${b[1]}！`);speak(b[2],'en');this.next(1.4);}else{bad();this.miss++;hush();speak(`それは ${b[1]}。 ${this.eyeC[1]}を さがそう`);speak(b[2],'en');}}});return;}
    if(k==='ribbon'){this.ribs.forEach((col,i)=>{if(hitC(x,y,W/2+(i-1)*150,H-90,50)){this.bow=col;this.ribs=[];good(this.toyP(20,-118).x,this.toyP(0,-118).y,2,'かわいい！');this.next(1.2);}});return;}
    if(this.stitch&&this.tools.length===0){this.stitchHit(x,y);return;}
    for(const t of this.tools){if(t.hit(x,y)){if(t.k!==this.want){this.miss++;wrongTool(t);return;}
      if(k==='flat'||k==='cotton'){this.cottonTap(t);return;}
      if((k==='sewT'||k==='sewA'||k==='sewE')){sayWord('needle');this.tools=[];return;}
      t.held=true;t.px2=x;t.py2=y;sfx('tap');sayWord(t.k);return;}}},
  cottonTap(t){sfx('squish');const p=this.toyP(0,-40);parts.push({x:t.hx,y:t.hy,vx:(p.x-t.hx)*1.6,vy:(p.y-t.hy)*1.6,life:.6,t:0,kind:'puff',col:'#fff',r:16});
    if(this.key==='flat'){this.pumps++;this.flat=Math.min(1,.72+.28*this.pumps/this.pumpN);hush();speak(String(this.pumps));speak(numEn(this.pumps),'en');if(this.pumps>=this.pumpN){good(p.x,p.y,2,'ふっくら！');this.next();}}
    else{this.cottonIn++;hush();speak(String(this.cottonIn),'en');if(this.cottonIn>=this.cottonN){good(p.x,p.y,1,'もどった！');this.next();}}},
  stitchHit(x,y){const S=this.stitch,p=S.pts[S.i];if(!p)return;if(Math.hypot(x-p.x,y-p.y)<30){S.i++;sfx('snap');burst(p.x,p.y,4,'star');hush();speak(String(S.i),'en');if(S.i>=S.pts.length){const k=this.key;good(p.x,p.y,2,'チクチク かんせい！');if(k==='sewT'){this.done.sewT=1;this.tear=false;}if(k==='sewA')this.armOff=false;if(k==='sewE')this.eyeMiss=0;this.next(1.2);}}},
  move(x,y){const k=this.key;if(k==='armon'&&this.armX&&this.armX.held){this.armX.x=x;this.armX.y=y;return;}if(this.stitch&&this.tools.length===0&&ptrId!==null){this.stitchHit(x,y);return;}
    const t=this.tools.find(q=>q.held);if(!t)return;const d=Math.hypot(x-t.px2,y-t.py2);t.x=x;t.y=y;t.px2=x;t.py2=y;
    if(k==='wash'&&t.k==='sponge'){for(const q of this.stains){if(q.hp<=0)continue;const p=this.toyP(q.a,q.b);if(Math.hypot(x-p.x,y-20-p.y)<50){q.hp-=d/200;if(Math.random()<.4)this.bub.push({x:p.x+rand(-20,20),y:p.y+rand(-20,20),r:rand(6,12)});if(q.hp<=0)good(p.x,p.y,1,'ピカピカ');}}
      if(this.stains.every(q=>q.hp<=0)&&!this.done.wash){this.done.wash=1;t.held=false;this.bub=[];this.wet=1;say('きれいに なった！ でも びしょびしょ');this.next();}}},
  up(x,y){const k=this.key;if(k==='armon'&&this.armX&&this.armX.held){this.armX.held=0;const g=this.toyP(30,-50);if(Math.hypot(x-g.x,y-g.y)<60){this.armX=null;this.armOff=true;this.armOn=1;good(g.x,g.y,1,'くっついた！');this.armOff=false;this.armStitchPending=1;this.next(1);}return;}
    const t=this.tools.find(q=>q.held);if(t)t.held=false;},
  hint(){if(this.fin||this.hug||this.si<0)return null;const k=this.key;
    if(k==='armon'){const A=this.armX;if(!A)return null;const g=this.toyP(30,-50);return{x:A.x,y:A.y,x2:g.x,y2:g.y};}
    if(k==='eyebtn'){const i=this.btns.indexOf(this.eyeC);return i<0?null:{x:W/2+(i-(this.btns.length-1)/2)*120,y:H-84};}
    if(k==='ribbon')return this.ribs.length?{x:W/2-150,y:H-90}:null;
    if(this.stitch&&this.tools.length===0){const p=this.stitch.pts[this.stitch.i];return p?{x:p.x,y:p.y}:null;}
    const t=this.tools.find(q=>q.k===this.want);if(!t||t.hidden)return null;
    if(k==='flat'||k==='cotton'||k.startsWith('sew'))return{x:t.hx,y:t.hy};
    if(k==='wash'){const q=this.stains.find(q=>q.hp>0);if(!q)return null;const p=this.toyP(q.a,q.b);return{x:t.hx,y:t.hy,x2:p.x+rand(-8,8),y2:p.y+20};}
    if(k==='dry'){const p=this.toyP(0,-50);return{x:t.hx,y:t.hy,x2:p.x+90,y2:p.y};}return null;},
  hintText(){return{flat:'わたを タッチ',wash:'スポンジで シミを ごしごし',dry:'ドライヤーを あてよう',cotton:'わたを タッチして もどそう',sewT:'はりを えらんで 1から じゅんばんに',sewA:'はりを えらんで じゅんばんに',sewE:'はりを えらんで じゅんばんに',armon:'うでを かたへ',eyebtn:'おなじ いろの ボタン',ribbon:'リボンを えらんでね'}[this.key]||'';}};
// ================= input =================
let idle=0,hintSaid=0;
function toV(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-OX)/SC,y:(e.clientY-r.top-OY)/SC};}
let ptrId=null;
const RKLINES=['りっきー！ きゃっきゃ！','ねえね がんばれー！','ばぶー！','りっきーも おてつだい！','あーうー！','ねえね だいすき！'];
cv.addEventListener('pointerdown',e=>{audioInit();ttsUnlock();if(ptrId!==null&&ptrId!==e.pointerId)return;ptrId=e.pointerId;try{cv.setPointerCapture(e.pointerId);}catch(_){}const p=toV(e);idle=0;hintSaid=0;LOOK.x=p.x;LOOK.on=1;ring(p.x,p.y,'rgba(255,255,255,.9)');
  if(tr)return;if(cel){celDown(p.x,p.y);return;}
  if(!scene.noHome&&hitC(p.x,p.y,56,60,46)){sfx('tap');go('lobby');return;}
  if(scene.rkPos&&!scene.noRk){const r=scene.rkPos;if(rkHit(p.x,p.y,r.x,r.y,r.sc)){RK.hop=1;rkCheer();say(pick(scene.rkLines||RKLINES));burst(r.x,r.y-40*r.sc,8,'heart');return;}}
  if(scene.down)scene.down(p.x,p.y);});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==ptrId)return;const p=toV(e);LOOK.x=p.x;if(scene.move&&!tr&&!cel)scene.move(p.x,p.y);});
const up=e=>{ttsUnlockUp();if(e.pointerId!==ptrId)return;ptrId=null;LOOK.on=0;const p=toV(e);if(scene.up&&!tr&&!cel)scene.up(p.x,p.y);};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden){hush();if(AC)AC.suspend();}else if(AC)AC.resume();});
// ================= loop =================
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  try{
  if(tr){tr.t+=dt;if(!tr.sw&&tr.t>=.35){tr.sw=true;scene=SCN[tr.next];scene.rkPos=null;scene._rw=null;resetPlay();parts.length=0;bub=null;card=null;scene.enter&&scene.enter();}if(tr.t>=.7)tr=null;}
  if(bub){bub.t+=dt;if(bub.t>bub.life)bub=null;}if(card){card.t+=dt;if(card.t>3)card=null;}
  if(cel)celUpdate(dt);if(RK.clap>0)RK.clap-=dt;if(RK.hop>0)RK.hop-=dt*2;
  if(!cel&&scene.update)scene.update(dt);
  updParts(dt);updFx(dt);
  if(!cel&&!tr&&scene.hint){idle+=dt;if(idle>9&&!hintSaid&&scene.hintText){hintSaid=1;const ht=scene.hintText();if(ht)say(ht);}if(idle>24){idle=8;hintSaid=0;}}
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle=scene.bg||'#fff';c.fillRect(0,0,cv.width,cv.height);
  c.setTransform(DPR*SC,0,0,DPR*SC,DPR*OX,DPR*OY);
  c.save();if(SHAKE>0)c.translate(Math.sin(T*90)*SHAKE*24,Math.cos(T*70)*SHAKE*12);scene.draw(c);c.restore();
  if(!scene.noHome)vignette(c);drawParts(c);drawFly(c);drawBanner(c);
  if(!cel&&!tr&&scene.hint&&idle>6){const h=scene.hint();if(h){const k=h.x2!=null?((T*.7)%1):0;const e=k<.8?k/.8:1;const hx=h.x2!=null?lerp(h.x,h.x2,ease(e)):h.x,hy=h.x2!=null?lerp(h.y,h.y2,ease(e)):h.y;drawHand(c,hx,hy,T);}}
  if(!scene.noHome){drawBtn(c,56,60,40,'#ff8cc0','home');if(scene.hud!==false)drawHud(c);}
  drawCard(c);drawBubble(c);
  if(cel)drawCel(c);
  if(tr)drawTr(c);
  }catch(err){if(!frame.e){frame.e=1;console.error(err);}}
}
resize();scene=SCN.title;scene.enter();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{for(const k in SPR)delete SPR[k];});
window.__dbg={PLAY,SAVE,WARD,sayWord,sayNum,say,speak,hush};
requestAnimationFrame(frame);
window.__hosp={thumb(cv2){const c=cv2.getContext('2d');c.setTransform(cv2.width/800,0,0,cv2.height/500,0,0);drawThumb(c);},SCN,get scene(){return scene},go,SAVE,celebrate,get cel(){return cel},get H(){return H},celDown,parts};
})();
</script>
