<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#140c24">
<title>ふーモン ルビー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--shell:#3b2f8f;--shell2:#2a2070;--shellHi:#5a4cc0;--btn:#2b2440;--btnHi:#4a4166;--ab:#5b4a8a;--ruby:#e0204a;--cw:480px;--ch:320px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{background:radial-gradient(ellipse at 50% 30%,#2a1d4e 0%,#140c24 70%);font-family:"DotGothic16","Hiragino Sans",system-ui,sans-serif;color:#fff}
#shell{position:fixed;inset:0;display:grid;align-items:center;justify-items:center;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
#body{position:relative;display:grid;align-items:center;justify-items:center;gap:10px 18px;padding:16px 22px 14px;border-radius:38px;background:linear-gradient(160deg,var(--shellHi) 0%,var(--shell) 35%,var(--shell2) 100%);box-shadow:inset 0 3px 0 rgba(255,255,255,.25),inset 0 -6px 0 rgba(0,0,0,.3),0 18px 50px rgba(0,0,0,.6)}
body.land #body{grid-template-columns:auto auto auto;grid-template-areas:"dp scr ab" "dp ss ab"}
body.port #body{grid-template-columns:1fr 1fr;grid-template-areas:"scr scr" "dp ab" "ss ss";border-radius:28px 28px 60px 28px;padding:14px 14px 18px}
#scr{grid-area:scr;position:relative;padding:14px 26px 22px;background:#1c1830;border-radius:14px 14px 34px 14px;box-shadow:inset 0 2px 6px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.15)}
body.port #scr{padding:10px 12px 20px}
#c{display:block;width:var(--cw);height:var(--ch);image-rendering:pixelated;image-rendering:crisp-edges;background:#000;border-radius:2px;touch-action:none}
#led{position:absolute;left:9px;top:46%;width:8px;height:8px;border-radius:50%;background:#ff3d6a;box-shadow:0 0 8px #ff3d6a}
body.port #led{left:3px;top:auto;bottom:7px;width:6px;height:6px}
#logo{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:11px;letter-spacing:.25em;color:#a99fd6;font-family:system-ui,sans-serif;font-weight:800;font-style:italic}
#logo b{color:var(--ruby);font-style:normal}
#dp{grid-area:dp;position:relative;width:132px;height:132px;touch-action:none}
#dp .bar{position:absolute;background:var(--btn);box-shadow:inset 0 2px 0 var(--btnHi),0 3px 0 rgba(0,0,0,.45)}
#dp .h{left:0;right:0;top:44px;height:44px;border-radius:7px}
#dp .v{top:0;bottom:0;left:44px;width:44px;border-radius:7px}
#dp .ctr{position:absolute;left:52px;top:52px;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle,#211b33,#2b2440)}
#dp .ar{position:absolute;width:0;height:0;border:8px solid transparent;opacity:.55}
#dp .u{left:58px;top:10px;border-bottom-color:#9a90c0}
#dp .d{left:58px;bottom:10px;border-top-color:#9a90c0}
#dp .l{top:58px;left:10px;border-right-color:#9a90c0}
#dp .r{top:58px;right:10px;border-left-color:#9a90c0}
#dp.pu .u,#dp.pd .d,#dp.pl .l,#dp.pr .r{opacity:1;border-width:9px}
#ab{grid-area:ab;position:relative;width:150px;height:120px;touch-action:none}
.rb{position:absolute;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#7a68b0,var(--ab) 60%,#3e3166);box-shadow:inset 0 -3px 0 rgba(0,0,0,.3),0 4px 0 rgba(0,0,0,.45);color:#d9d1f5;font:900 22px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;touch-action:none}
.rb.on{transform:translateY(3px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.3),0 1px 0 rgba(0,0,0,.45);filter:brightness(1.2)}
#bA{right:0;top:4px}#bB{left:6px;bottom:4px}
#ss{grid-area:ss;display:flex;gap:26px;justify-content:center}
.pill{display:flex;flex-direction:column;align-items:center;gap:3px;font:700 10px system-ui,sans-serif;letter-spacing:.12em;color:#a99fd6;touch-action:none}
.pill i{display:block;width:46px;height:14px;border-radius:8px;background:var(--btn);box-shadow:inset 0 2px 0 var(--btnHi),0 2px 0 rgba(0,0,0,.45)}
.pill.on i{filter:brightness(1.6)}
#keys{position:fixed;right:10px;bottom:6px;font:11px system-ui,sans-serif;color:#7a6fa6;pointer-events:none}
body.touch #keys{display:none}
body.port #keys{display:none}
</style>
</head>
<body>
<div id="shell"><div id="body">
  <div id="scr"><div id="led"></div><canvas id="c" width="720" height="480"></canvas><div id="logo">FU-TAN <b>ADVANCE</b></div></div>
  <div id="dp"><div class="bar h"></div><div class="bar v"></div><div class="ctr"></div><i class="ar u"></i><i class="ar d"></i><i class="ar l"></i><i class="ar r"></i></div>
  <div id="ab"><div class="rb" id="bB">B</div><div class="rb" id="bA">A</div></div>
  <div id="ss"><div class="pill" id="bSel"><i></i>SELECT</div><div class="pill" id="bSt"><i></i>START</div></div>
</div></div>
<div id="keys">やじるし: いどう ／ Z・Enter: A ／ X・Esc: B（おしながら はしる） ／ Space: START ／ V: SELECT（いつも はしる）</div>
<script>
// ================================================================ core
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
const W = 240, H = 160, TS = 16;
const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
if (isTouch) document.body.classList.add('touch');
const DEBUG = /debug/.test(location.search);

// ---------------------------------------------------------------- canvas / layout
const cv = $('#c');
const ctx = cv.getContext('2d');
let S = 3;
function layout() {
  const vw = innerWidth, vh = innerHeight;
  const port = vh > vw * 1.05;
  document.body.classList.toggle('port', port);
  document.body.classList.toggle('land', !port);
  let cw;
  if (port) {
    cw = Math.min(vw - 16 - 28 - 24, (vh - 16 - 28 - 30 - 150 - 40 - 20) * 1.5);
  } else {
    const ch = Math.min(vh - 16 - 30 - 36 - 40, (vw - 16 - 44 - 132 - 150 - 36 - 52) / 1.5);
    cw = ch * 1.5;
  }
  cw = Math.max(240, Math.floor(cw));
  const ch = Math.round(cw / 1.5);
  document.documentElement.style.setProperty('--cw', cw + 'px');
  document.documentElement.style.setProperty('--ch', ch + 'px');
  S = clamp(Math.ceil(cw * (devicePixelRatio || 1) / W), 2, 6);
  cv.width = W * S; cv.height = H * S;
  ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', layout);
layout();
function resetTf() { ctx.setTransform(S, 0, 0, S, 0, 0); ctx.imageSmoothingEnabled = false; ctx.globalAlpha = 1; }

// ---------------------------------------------------------------- input
const IN = { held: {}, pend: new Set(), pressed: new Set(), hold: {}, tap: null, pendTap: null, any: false };
const KEYMAP = {
  ArrowUp: 'U', KeyW: 'U', ArrowDown: 'D', KeyS: 'D', ArrowLeft: 'L', KeyA: 'L', ArrowRight: 'R', KeyD: 'R',
  KeyZ: 'A', Enter: 'A', KeyJ: 'A', KeyX: 'B', Escape: 'B', Backspace: 'B', KeyK: 'B', ShiftLeft: 'B', ShiftRight: 'B',
  Space: 'ST', KeyC: 'ST', KeyV: 'SE', Tab: 'SE',
};
function press(b) { if (!IN.held[b]) IN.pend.add(b); IN.held[b] = true; AU.unlock(); }
function release(b) { IN.held[b] = false; }
addEventListener('keydown', e => {
  const b = KEYMAP[e.code]; if (!b) return;
  e.preventDefault(); if (e.repeat) return; press(b);
});
addEventListener('keyup', e => { const b = KEYMAP[e.code]; if (b) { e.preventDefault(); release(b); } });
addEventListener('blur', () => { for (const k in IN.held) IN.held[k] = false; });
function bindBtn(el, b) {
  const on = e => { e.preventDefault(); el.setPointerCapture && el.setPointerCapture(e.pointerId); el.classList.add('on'); press(b); };
  const off = e => { e.preventDefault(); el.classList.remove('on'); release(b); };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('lostpointercapture', off);
}
bindBtn($('#bA'), 'A'); bindBtn($('#bB'), 'B'); bindBtn($('#bSt'), 'ST'); bindBtn($('#bSel'), 'SE');
(function dpad() {
  const el = $('#dp'); let pid = null, cur = null;
  const set = d => {
    if (d === cur) return;
    if (cur) release(cur);
    cur = d; if (d) press(d);
    el.className = d ? 'p' + d.toLowerCase() : '';
  };
  const dir = e => {
    const r = el.getBoundingClientRect();
    const x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2);
    if (Math.hypot(x, y) < 10) return cur;
    return Math.abs(x) > Math.abs(y) ? (x > 0 ? 'R' : 'L') : (y > 0 ? 'D' : 'U');
  };
  el.addEventListener('pointerdown', e => { e.preventDefault(); pid = e.pointerId; el.setPointerCapture(pid); set(dir(e)); });
  el.addEventListener('pointermove', e => { if (e.pointerId === pid) set(dir(e)); });
  const up = e => { if (e.pointerId === pid) { pid = null; set(null); } };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
})();
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); AU.unlock();
  const r = cv.getBoundingClientRect();
  IN.pendTap = { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
});
for (const ev of ['touchend', 'click', 'keyup']) document.addEventListener(ev, () => AU.unlock(), { passive: true });
const btn = b => !!IN.held[b];
const btnp = b => IN.pressed.has(b);
// menu-style repeat
function btnr(b) {
  if (IN.pressed.has(b)) return true;
  const h = IN.hold[b] || 0;
  return h > 16 && h % 5 === 0;
}
function eatInput() { IN.pressed.clear(); IN.tap = null; }
const tapIn = (x, y, w, h) => IN.tap && IN.tap.x >= x && IN.tap.x < x + w && IN.tap.y >= y && IN.tap.y < y + h;
const okp = () => btnp('A') || !!IN.tap;

// ---------------------------------------------------------------- loop
let frame = 0;
const waiters = [];
const tick = () => new Promise(r => waiters.push(r));
async function wait(n) { for (let i = 0; i < n; i++) await tick(); }
const updaters = [];  // per-tick functions (sync)
let renderFn = () => { };
let lastT = 0, acc = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(100, t - (lastT || t)); lastT = t;
  acc += dt;
  if (acc < 1000 / 61) return;
  acc = Math.min(acc - 1000 / 60, 1000 / 60);
  // input snapshot
  IN.pressed = IN.pend; IN.pend = new Set();
  IN.tap = IN.pendTap; IN.pendTap = null;
  for (const k of ['U', 'D', 'L', 'R', 'A', 'B']) IN.hold[k] = IN.held[k] ? (IN.hold[k] || 0) + 1 : 0;
  frame++;
  const ws = waiters.splice(0);
  for (const f of updaters) f();
  for (const w of ws) w();
  resetTf();
  renderFn();
}
requestAnimationFrame(loop);

// ---------------------------------------------------------------- save helpers
const SAVE_KEY = 'fumon-ruby-save-v1';
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};
// ================================================================ audio (all synthesized chiptune)
const NOTE_I = { c: 0, 'c#': 1, d: 2, 'd#': 3, e: 4, f: 5, 'f#': 6, g: 7, 'g#': 8, a: 9, 'a#': 10, b: 11 };
const noteHz = n => 440 * Math.pow(2, (n - 69) / 12);
function parseNotes(s) {
  const out = [];
  for (const tok of s.trim().split(/\s+/)) {
    let [n, l] = tok.split(':'); l = l ? +l : 1;
    if (n === 'r') { out.push([null, l]); continue; }
    const m = n.match(/^([a-g]#?)(\d)$/);
    if (!m) { console.warn('bad note', tok); continue; }
    out.push([12 * (+m[2] + 1) + NOTE_I[m[1]], l]);
  }
  return out;
}
const CHORDS = {
  C: [0, 4, 7], Cm: [0, 3, 7], D: [2, 6, 9], Dm: [2, 5, 9], E: [4, 8, 11], Em: [4, 7, 11], F: [5, 9, 12], G: [7, 11, 14],
  A: [9, 13, 16], Am: [9, 12, 16], B: [11, 15, 18], Bb: [10, 14, 17], Ab: [8, 12, 15], Eb: [3, 7, 10],
};
function bassLine(ch, oct = 3) {
  const out = [];
  for (const c of ch.split(/\s+/)) {
    const t = CHORDS[c], r = 12 * (oct + 1) + t[0], f = r + (t[2] - t[0]);
    out.push([r, 1], [r + 12, 1], [f, 1], [r + 12, 1], [r, 1], [r + 12, 1], [f, 1], [r + 12, 1]);
  }
  return out;
}
function arpLine(ch, oct = 4) {
  const out = [];
  for (const c of ch.split(/\s+/)) {
    const t = CHORDS[c].map(x => x + 12 * (oct + 1));
    for (const k of [0, 1, 2, 1, 0, 1, 2, 1]) out.push([t[k], 1]);
  }
  return out;
}
const SONGS = {
  title: { bpm: 132, ch: 'C G Am F C G F G', lead: 'g4 c5 e5 g5:2 e5 g5 c6 b5:3 a5 g5:2 d5:2 a5:2 c6 a5 e5:2 a5 c6 c6:3 a5 f5:4 e5 g5 c6 e6:2 d6 c6 g5 d6:3 b5 g5:2 b5 d6 c6 a5 f5 a5 c6:2 a6:2 g6:4 f6 e6 d6 b5', drum: 'k.h.s.h.' },
  town: { bpm: 104, ch: 'F C Dm Bb F C Bb C', lead: 'a4 c5 f5:2 e5 f5 g5:2 e5:3 c5 g4:4 f5 e5 d5:2 a4 d5 f5:2 d5:4 r:2 a#4 c5 a4 c5 f5:2 g5 a5 c6:2 g5:3 e5 c5:4 d5 f5 a#5:2 a5 g5 f5 d5 e5:2 g5:2 c5:4', drum: 'k...h...' },
  route: { bpm: 144, ch: 'G C D G Em C D D', lead: 'd5 g5 g5 a5 b5:2 a5 g5 e5:2 g5 e5 c5:4 d5 f#5 a5 d6:2 c6 b5 a5 b5:3 g5 d5:4 e5 g5 b5 e6:2 d6 b5 g5 c6:2 e6 c6 g5:2 e5 g5 a5:2 f#5 a5 d6:2 c6 a5 f#5:4 a5:2 d5:2', drum: 'k.h.s.hh' },
  wild: { bpm: 168, ch: 'Am Am F G Am Am F E', lead: 'a4 c5 e5 a5 g5 e5 c5 e5 a5:2 b5 c6 b5 a5 e5:2 f5 a5 c6 f6 e6 c6 a5 c6 d6:2 b5 g5 d5:2 g5 b5 a5 e6 a5 e6 c6 b5 a5 e5 c6:2 d6 e6 d6 c6 b5:2 a5 f5 a5 c6 f6:2 e6 d6 e6:2 d6 c6 b5:2 g#5:2', drum: 'k.hsk.hs' },
  trainer: { bpm: 160, ch: 'Dm Dm Bb C Dm Dm Bb A', lead: 'd5:2 d5 f5 a5:2 g5 f5 e5 f5 g5 a5:3 d6 c6 a#5:2 a5 g5 f5:2 d5 f5 g5:3 e5 c5:2 e5 g5 d6:2 c6 a5 d6:2 e6 f6 e6 d6 c6 a5 c6:2 d6:2 a#5 a5 g5 f5 d6:2 a#5:2 a5:4 c#6:2 e6:2', drum: 'k.hsk.hs' },
  boss: { bpm: 176, ch: 'Em C D B Em C Am B', lead: 'e5 e5 g5 e5 b5:2 a5 g5 c6:2 b5 a5 g5:2 e5 g5 f#5 a5 d6 a5 f#6:2 e6 d6 d#6:3 b5 f#5:2 a5 b5 e6 b5 g5 e6 g6:2 f#6 e6 e6 c6 g5 e6 c6:2 d6 e6 c6 a5 e5 a5 c6:2 b5 a5 b5:4 d#6:2 f#6:2', drum: 'kkhskkhs' },
  center: { bpm: 112, ch: 'C Am F G C Am Dm G', lead: 'e5 g5 c6:2 b5 c6 g5:2 a5:3 g5 e5:4 f5 a5 c6:2 d6 c6 a5:2 g5:6 r:2 e5 g5 c6:2 e6 d6 c6:2 a5:3 c6 e6:4 f6 e6 d6:2 c6 a5 f5:2 g5:4 b5:2 d6:2', drum: '' },
  cave: { bpm: 96, ch: 'Am Em F E', lead: 'e5:2 r a4 c5:2 b4 a4 b4:4 g4:2 r:2 c5:2 r f4 a4:2 c5 e5 d#5:4 b4:4', drum: 'k.......' },
  kazan: { bpm: 150, ch: 'Cm Cm Ab G', lead: 'c5 c5 r c5 d#5:2 c5 g4 c5 d5 d#5 f5 g5:2 f5 d#5 g#5:2 g5 f5 d#5:2 c5 d#5 d5:2 b4 g4 b4:2 d5:2', drum: 'k.k.s.k.' },
  victory: { bpm: 140, ch: 'C F G C', lead: 'c5 e5 g5 c6:5 a5 c6 f6:2 e6 d6 c6:2 b5 d6 g6:2 f6 e6 d6:2 e6:4 c6:4', drum: 'k.h.s.h.' },
  ending: { bpm: 100, ch: 'F Am Bb C F Am Bb F', lead: 'c5 f5 a5 c6:5 e5:2 a5 c6 e6:4 d6 c6 a#5 a5 f5:4 g5:6 c5 e5 f5 a5 c6 f6:5 e6 c6 a5 c6 e6:4 d6 a#5 f5 d6 c6:4 f5:8', drum: 'k...h...' },
  legend: { bpm: 120, ch: 'Em Em C B', lead: 'e4:2 b4:2 e5:3 d5 c5:2 b4:2 a4:2 b4:2 c5:4 e5:2 g5:2 f#5:6 d#5:2', drum: 'k...k.s.' },
};
const JINGLES = {
  heal: { bpm: 150, lead: 'c5 e5 g5 c6:2 g5 c6:4', bass: 'c3:2 g3:2 c4:4' },
  level: { bpm: 170, lead: 'c5 e5 g5 c6 e6:2 g6:4', bass: 'c3 e3 g3 c4 e4:2 c4:4' },
  caught: { bpm: 150, lead: 'g5 g5 g5 c6:3 b5 a5 b5 c6:4', bass: 'c3:2 c3 e3:2 g3 f3 g3 c3:4' },
  badge: { bpm: 140, lead: 'c5 c5 c5 e5:2 d5 e5 g5:2 f5 g5 c6:6', bass: 'c3:3 e3:3 g3:3 c4:6' },
  evo: { bpm: 150, lead: 'c5 e5 g5 c6 d6 e6 g6:2 e6 c6:4', bass: 'c3:4 g3:4 c4:4' },
  item: { bpm: 160, lead: 'g5 a5 b5 d6:2 b5 d6:3', bass: 'g3:4 d4:5' },
};

const AU = {
  ctx: null, master: null, music: null, sfxG: null, cur: null, curName: '', timer: null, muted: false,
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.gain.value = 0.55; this.master.connect(this.ctx.destination);
    this.music = this.ctx.createGain(); this.music.gain.value = 0.32; this.music.connect(this.master);
    this.sfxG = this.ctx.createGain(); this.sfxG.gain.value = 0.7; this.sfxG.connect(this.master);
    const len = this.ctx.sampleRate; const b = this.ctx.createBuffer(1, len, len); const d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = b;
    this.waves = {};
    for (const duty of [0.125, 0.25, 0.5]) {
      const n = 32, re = new Float32Array(n), im = new Float32Array(n);
      for (let k = 1; k < n; k++) im[k] = 2 / (k * Math.PI) * Math.sin(k * Math.PI * duty) * 1.0;
      for (let k = 1; k < n; k++) { re[k] = im[k]; im[k] = 0; }
      this.waves[duty] = this.ctx.createPeriodicWave(re, im);
    }
    if (this.pending) { const p = this.pending; this.pending = null; this.bgm(p); }
  },
  tone(t, hz, dur, vol, type, dest, slide) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    if (typeof type === 'number') o.setPeriodicWave(this.waves[type]); else o.type = type;
    o.frequency.setValueAtTime(hz, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.005);
    g.gain.setValueAtTime(vol, t + Math.max(0.01, dur - 0.04)); g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(g); g.connect(dest || this.sfxG); o.start(t); o.stop(t + dur + 0.02);
  },
  nz(t, dur, vol, hp, dest, lp) {
    const c = this.ctx, s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
    s.buffer = this.noise; f.type = 'highpass'; f.frequency.value = hp || 800;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f);
    if (lp) { const l = c.createBiquadFilter(); l.type = 'lowpass'; l.frequency.value = lp; f.connect(l); l.connect(g); } else f.connect(g);
    g.connect(dest || this.sfxG); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  },
  // ---------------------------------------------------- music

const BUILD = {};
function roof(p, x, y, w, h, col, colD) {
  p.part(P(x - 2, y + h, x + 4, y, x + w - 4, y, x + w + 1, y + h), col, { ol: shade(col, 0.35), hiT: 0.9, loT: -0.9 });
  for (let yy = y + 3; yy < y + h; yy += 3) for (let xx = x; xx < x + w; xx++) if (((xx + yy) >> 1) % 4 === 0) p.px(xx, yy, colD);
  for (let yy = y + 3; yy < y + h; yy += 3) p.hline(x + 1 - Math.floor((yy - y) / h * 4), x + w - 2 + Math.floor((yy - y) / h * 3), yy, colD);
  p.hline(x - 1, x + w, y + h, shade(col, 0.35));
}
function wallBlock(p, x, y, w, h, col) {
  p.part(R(x, y, w, h), col, { ol: shade(col, 0.4), flat: true });
  p.hline(x, x + w - 1, y + h - 1, shade(col, 0.7));
  p.hline(x, x + w - 1, y, shade(col, 0.8));
}
function windowAt(p, x, y, w = 10, h = 8) {
  p.part(R(x, y, w, h), '#6ab8e8', { ol: '#304060', flat: true });
  p.hline(x, x + w - 1, y + (h >> 1), '#f0f0f0'); for (let yy = y; yy < y + h; yy++) p.px(x + (w >> 1), yy, '#f0f0f0');
  p.px(x + 1, y + 1, '#e0f8ff'); p.px(x + 2, y + 1, '#e0f8ff');
}
function doorAt(p, x, y, col = '#8a5a30') {
  p.part(R(x + 2, y + 1, 12, 15), col, { ol: '#3a2410', flat: true });
  p.rect(x + 4, y + 3, 8, 6, '#3a2a20'); p.px(x + 11, y + 10, '#f0d060');
}
function defBuild(name, w, h, doorDx, draw) {
  const p = new Pix(w * 16, h * 16); draw(p, w * 16, h * 16);
  BUILD[name] = { w, h, doorDx, img: p.canvas() };
}

const expFor = lv => Math.floor(lv * lv * lv * 0.6);
function calcStats(m) {
  const b = MON[m.sp].b, lv = m.lv;
  const hp = Math.floor(b[0] * 2 * lv / 100) + lv + 10;
  const s = i => Math.floor(b[i] * 2 * lv / 100) + 5;
  const dh = hp - (m.maxhp || hp);
  m.maxhp = hp; m.atk = s(1); m.def = s(2); m.spd = s(3);
  if (m.hp == null) m.hp = hp; else if (m.hp > 0) m.hp = Math.min(hp, m.hp + Math.max(0, dh));
}
function movesAt(sp, lv) {
  const list = MON[sp].mv.filter(([l]) => l <= lv).map(x => x[1]);
  return [...new Set(list)].slice(-4);
}
function makeMon(sp, lv, o = {}) {
  const m = { sp, lv, exp: expFor(lv), hp: null, st: null, moves: [] };
  calcStats(m);
  m.moves = (o.moves || movesAt(sp, lv)).map(id => ({ id, pp: MOVES[id].pp }));
  return m;
}

async function gymLeader(i) {
  const L = LEADERS[i];
  const who = L.name.replace('ジムリーダー ', '');
  if (G.badges[i]) { await say(L.after, { who }); return; }
  AU.bgm('boss');
  for (const s of L.pre) await say(s, { who });
  const won = await battle({ trainer: { name: L.name, ch: L.ch, party: L.party, money: L.money, music: 'boss', win: L.win } });
  if (!won) return;
  G.badges[i] = true;
  AU.stopBgm(); AU.jingle('badge');
  await say(`ふーたんは ${who}から ${L.badge}を もらった！`);
  await wait(30);
  for (const [k, n] of L.reward) { addItem(k, n); AU.fanfare('item'); await say(`${who}「これも もっていって！」 ……ふーたんは ${ITEMS[k].n} ×${n} を もらった！`); }
  AU.bgm(mapBgm());
  await say(L.after, { who });
}
function rivalStarter() { return { 1: 5, 3: 1, 5: 3 }[G.starter] || 5; }
function rivalParty(n) {
  const s = rivalStarter();
  if (n === 1) return [[s, 5]];
  return [[10, 29], [22, 30], [14, 30], [s + 1, 32]];
}

async function profIntro() {
  MODE = 'intro';
  let show = 'prof', monA = 0, prof = 1;
  const L = pushUnder(() => {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#182040'); g.addColorStop(1, '#402858'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,0.06)'; for (let i = 0; i < 12; i++) { ctx.beginPath(); ctx.ellipse(120, 96, 30 + i * 14, 8 + i * 4, 0, 0, 7); ctx.fill(); }
    ctx.fillStyle = '#c8b8e8'; ctx.beginPath(); ctx.ellipse(120, 96, 50, 10, 0, 0, 7); ctx.fill();

async function chooseStarter() {
  const opts = [1, 3, 5];
  let sel = 0;
  const L = pushLayer(() => {
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#a05828'; ctx.beginPath(); ctx.ellipse(120, 62, 100, 50, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#c87038'; ctx.beginPath(); ctx.ellipse(120, 58, 94, 44, 0, 0, 7); ctx.fill();
    opts.forEach((sp, i) => {
      const x = 52 + i * 68, y = 54;
      if (i === sel) { ctx.fillStyle = 'rgba(255,240,160,0.5)'; ctx.beginPath(); ctx.arc(x, y, 26, 0, 7); ctx.fill(); }
      const b = i === sel ? Math.floor(frame / 8) % 2 : 0;
      ctx.drawImage(monImg(sp), x - 26, y - 34 - b, 52, 52);
      drawBallIcon(x - 6, y + 18, 12);
    });
    const sp = opts[sel], m = MON[sp];
    win(36, 112, 168, 44, WS.menu);
    txt(m.name, 46, 118); ctx.fillStyle = TYPE_COL[m.t[0]]; ctx.fillRect(150, 119, 46, 12); txt(m.t[0], 173, 119, '#fff', 'rgba(0,0,0,.3)', 10, 'center');
    txt(['くさタイプ。 すばやくて げんき！', 'ほのおタイプ。 ちから もち！', 'みずタイプ。 がんばりやさん！'][sel], 46, 136, '#303038', '#d0d0d8', 10);
  });
  for (; ;) {
    await tick();
    const o = sel;
    if (btnr('R')) sel = (sel + 1) % 3;
    if (btnr('L')) sel = (sel + 2) % 3;
    let go = btnp('A');
    if (IN.tap) for (let i = 0; i < 3; i++) if (tapIn(52 + i * 68 - 30, 14, 60, 70)) { if (sel === i) go = true; sel = i; }
    if (o !== sel) { AU.sfx('sel'); AU.cry(opts[sel]); }
    if (go) {
      AU.sfx('ok');
      popLayer(L);
      await say(`${MON[opts[sel]].name}に きめる？`, { keep: true });
      const ok = await yesno(); closeMsg();
      if (ok) return opts[sel];
      pushLayer(L);
    }
  }
}

  for (cur = 0; cur < G.party.length; cur++) { AU.cry(G.party[cur].sp); UI.flash = 0.5; await wait(80); }
  all = true; UI.flash = 1;
  await say('ふーたんと ふーモンたちは でんどういりを はたした！ おめでとう！');

  popLayer(L);

}

// ================================================================ title / main
let titleT = 0;
function drawTitle() {
  titleT++;
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#2a0810'); g.addColorStop(0.6, '#801828'); g.addColorStop(1, '#f06030');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // rays
  ctx.save(); ctx.translate(120, 120);
  for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2 + titleT * 0.003; ctx.fillStyle = i % 2 ? 'rgba(255,200,120,0.07)' : 'rgba(255,120,80,0.05)'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 260, a, a + Math.PI / 16); ctx.fill(); }
  ctx.restore();
  // magma ground
  ctx.fillStyle = '#401010'; ctx.beginPath(); ctx.moveTo(0, 140); for (let x = 0; x <= W; x += 10) ctx.lineTo(x, 136 + Math.sin(x * 0.08) * 4); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
  for (let i = 0; i < 18; i++) { const x = (i * 37 + titleT * 0.6) % W, y = H - ((titleT * 0.8 + i * 29) % 70); ctx.fillStyle = i % 2 ? '#ffb040' : '#ff6020'; ctx.fillRect(x, y, 2, 2); }
  // legend
  const pulse = 0.5 + Math.sin(titleT * 0.05) * 0.5;
  ctx.globalAlpha = 0.35 + pulse * 0.3; ctx.fillStyle = '#ff4060'; ctx.beginPath(); ctx.ellipse(120, 112, 56 + pulse * 6, 40 + pulse * 4, 0, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  const img = monImg(24); ctx.drawImage(img, 120 - 46, 156 - 92 - Math.floor(Math.sin(titleT * 0.04) * 2), 92, 92);
  // logo
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.font = `30px ${FONT}`; ctx.lineJoin = 'round';
  ctx.strokeStyle = '#1a2a6a'; ctx.lineWidth = 6; ctx.strokeText('ふーモン', 120, 8);
  const lg = ctx.createLinearGradient(0, 10, 0, 40); lg.addColorStop(0, '#fff8a0'); lg.addColorStop(1, '#f8b820');
  ctx.fillStyle = lg; ctx.fillText('ふーモン', 120, 8);
  ctx.font = `22px ${FONT}`;
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 5; ctx.strokeText('ルビー', 120, 40);
  const rg = ctx.createLinearGradient(0, 40, 0, 62); rg.addColorStop(0, '#ff6080'); rg.addColorStop(1, '#a00828');
  ctx.fillStyle = rg; ctx.fillText('ルビー', 120, 40);
  ctx.restore();
  // gem sparkle
  const sx = 150 + Math.sin(titleT * 0.02) * 4; if ((titleT >> 4) % 3 === 0) { ctx.fillStyle = '#fff'; ctx.fillRect(sx, 44, 1, 5); ctx.fillRect(sx - 2, 46, 5, 1); }
  ctx.fillStyle = 'rgba(40,0,10,0.55)'; ctx.fillRect(56, 63, 128, 13); txt('〜ふーたんと だいちの ルビドン〜', 120, 64, '#ffe0c0', '#401010', 9, 'center');
  if (!TITLE.menu && (titleT >> 5) % 2 === 0) txt(isTouch ? 'A ボタンを おしてね' : 'PRESS START', 120, 146, '#ffffff', '#401010', 10, 'center');
  txt('©FU-TAN ADVANCE', 236, 150, 'rgba(255,255,255,0.4)', null, 6, 'right');
}
const TITLE = { menu: false };
async function titleScreen() {
  MODE = 'title'; TITLE.menu = false;
  AU.bgm('title');
  UI.fade = 1; await fadeIn(30);
  for (; ;) {
    await tick();
    if (btnp('A') || btnp('ST') || IN.tap) break;
  }
  AU.sfx('ok');
  for (; ;) {
    TITLE.menu = true;
    const save = store.get(SAVE_KEY);
    const items = []; if (save) items.push('つづきから'); items.push('はじめから', 'せってい');
    const r = await choose(items, { x: 70, y: 96, w: 100, cancel: false });
    const k = items[r];
    if (k === 'せってい') { await optionsMenu(); continue; }
    if (k === 'はじめから' && save) {
      await say('はじめから あそぶと、 まえの レポートは つぎに レポートを かいた ときに きえちゃうよ。 いい？', { keep: true });
      const ok = await yesno({ y: 76 }); closeMsg(); if (!ok) continue;
    }
    await fadeOut(24);
    TITLE.menu = false;
    if (k === 'つづきから') return loadGame(save);
    return newGame();
  }
}
function resetG() {
  for (const k of Object.keys(G)) delete G[k];
  Object.assign(G, { party: [], box: [], bag: {}, money: 3000, badges: [], flags: {}, seen: {}, caught: {}, repel: 0, center: { map: 'home1', x: 4, y: 4 }, time: 0, steps: 0 });
}
async function newGame() {
  resetG();
  F.pl = null;
  await profIntro();
  loadMap('truck', 3, 2, 'D');
  MODE = 'field';
  F.lock++;
  await fadeIn(30);
  F.lock--;
  await runScript(introTruck);
}
async function loadGame(s) {
  resetG();
  Object.assign(G, s.G);
  F.pl = null;
  loadMap(s.map, s.x, s.y, s.dir);
  MODE = 'field';
  await fadeIn(20);
}

renderFn = () => {
  if (MODE === 'field') drawField();
  else if (MODE === 'title') drawTitle();
  else { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }
  drawUI();
};
updaters.push(fieldUpdate);

// debug hooks (for testing)
window.__fm = { G, F, MAPS, MON, loadMap, makeMon, setFlag, battle, warp, get MODE() { return MODE; }, get B() { return B; }, get MSG() { return MSG; }, UI };

(async function boot() {
  try { await Promise.race([document.fonts.load(`11px ${FONT}`), new Promise(r => setTimeout(r, 2500))]); } catch (e) { }
  if (DEBUG && /warp=/.test(location.search)) {
    const m = location.search.match(/warp=(\w+),(\d+),(\d+)/);
    resetG(); G.party = [makeMon(1, 30), makeMon(3, 30), makeMon(5, 30)]; G.starter = 1;
    for (const f of ['momHome', 'arrived', 'starter', 'dex', 'truckStop', 'rival1']) setFlag(f);
    G.bag = { ball: 20, potion: 10, shoes: 1 };
    loadMap(m[1], +m[2], +m[3], 'D'); MODE = 'field'; UI.fade = 0;
    return;
  }
  await titleScreen();
})();
