<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ゲームあつめ</title>
<style>
  :root{color-scheme:light dark;--bg:#fff6fb;--card:#fff;--ink:#4a2a5a;--sub:#8a6a9a;--accent:#ff5fa2;--line:#ffd0e6;--tag:#fff0f7;}
  @media (prefers-color-scheme:dark){:root{--bg:#1e1624;--card:#2a2032;--ink:#f3e6f7;--sub:#bba8c6;--accent:#ff8cc0;--line:#4a3656;--tag:#3a2a44;}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;line-height:1.6}
  main{max-width:1080px;margin:0 auto;padding:24px 16px 40px}
  h1{font-size:24px;margin:0 0 4px}
  .lead{color:var(--sub);margin:0 0 18px;font-size:14px}
  ul{list-style:none;padding:0;margin:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr))}
  li{display:flex}
  a.game{display:flex;align-items:center;gap:12px;width:100%;padding:10px;background:var(--card);border:2px solid var(--line);border-radius:16px;color:inherit;text-decoration:none;transition:transform .12s,border-color .12s,box-shadow .12s}
  a.game:hover,a.game:focus-visible{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 16px rgba(255,95,162,.16)}
  .thumb{position:relative;flex:none;width:min(180px,50%);aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:var(--line)}
  .thumb img{display:block;width:100%;height:100%;object-fit:cover}
  .new{position:absolute;top:5px;left:5px;background:var(--accent);color:#fff;font-weight:800;font-size:11px;line-height:1.5;padding:0 7px;border-radius:99px}
  .body{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
  .name{font-weight:800;font-size:16px;color:var(--accent);line-height:1.35}
</style>
</head>
<body>
<main>
  <h1>ゲームあつめ</h1>
  <p class="lead">ブラウザで遊べるゲームの一覧です。あそびたい ゲームを えらんでね。</p>
  <ul id="games">
    <li><a class="game" href="./layerx-radar/">
      <div class="thumb"><img src="./thumbs/layerx-radar.jpg" alt="" width="800" height="500" loading="lazy"><span class="new">NEW</span></div>
      <div class="body"><div class="name">LayerX Radar</div></div>
    </a></li>
    <li><a class="game" href="./petapeta-town/">
      <div class="thumb"><img src="./thumbs/petapeta-town.jpg" alt="" width="800" height="500" loading="lazy"><span class="new">NEW</span></div>
      <div class="body"><div class="name">ぺたぺた！あそびタウン</div></div>
    </a></li>
    <li><a class="game" href="./monster-echoes/">
      <div class="thumb"><img src="./thumbs/monster-echoes.jpg" alt="" width="800" height="500" loading="lazy"><span class="new">NEW</span></div>
      <div class="body"><div class="name">モンスター・エコーズ 〜ルナフィアと ひかりのクリスタル〜</div></div>
    </a></li>
    <li><a class="game" href="./futan-sagase/">
      <div class="thumb"><img src="./thumbs/futan-sagase.jpg" alt="" width="800" height="500" loading="lazy"><span class="new">NEW</span></div>
      <div class="body"><div class="name">ふーたんを さがせ！</div></div>
    </a></li>
    <li><a class="game" href="./mori-itazura/">
      <div class="thumb"><img src="./thumbs/mori-itazura.jpg" alt="" width="800" height="500" loading="lazy"><span class="new">NEW</span></div>
      <div class="body"><div class="name">もりのいたずら日和</div></div>
    </a></li>
    <li><a class="game" href="./chokkai-snap/">
      <div class="thumb"><img src="./thumbs/chokkai-snap.jpg" alt="" width="800" height="500" loading="lazy"><span class="new">NEW</span></div>
      <div class="body"><div class="name">ちょっかいスナップ</div></div>
    </a></li>
    <li><a class="game" href="./cure-tantei/">
      <div class="thumb"><img src="./thumbs/cure-tantei.jpg" alt="" width="800" height="500" loading="lazy"><span class="new">NEW</span></div>
      <div class="body"><div class="name">キュアたんてい ふーちゃん</div></div>
    </a></li>
    <li><a class="game" href="./fuchan-hospital/">
      <div class="thumb"><img src="./thumbs/fuchan-hospital.jpg" alt="" width="800" height="500" loading="lazy"><span class="new">NEW</span></div>
      <div class="body"><div class="name">ふーちゃんと リッキーの キラキラびょういん</div></div>
    </a></li>
    <li><a class="game" href="./kossori-treasure/">
      <div class="thumb"><img src="./thumbs/kossori-treasure.jpg" alt="" width="800" height="500" loading="lazy"></div>
      <div class="body"><div class="name">こっそりトレジャー</div></div>
    </a></li>
  </ul>
</main>
</body>
</html>
