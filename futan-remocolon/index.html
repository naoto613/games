<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#262626">
<title>リモコロン ～ふーたんと リッキーの ちょっかいタウン～</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1a24;--cream:#fff3d6;--red:#e8483a;--blue:#2f6bff;--yel:#ffd800;--pink:#ff7eb6;--grn:#3ccf6e;
  --dela:"Dela Gothic One","M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;--maru:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#262626;color:var(--ink);font-family:var(--maru);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{position:relative;width:100%;height:100%;height:100dvh;overflow:hidden;background:#262626}
/* ベゼル と スクリーン */
#screen{position:absolute;left:8px;right:8px;top:calc(var(--st) + 50px);bottom:calc(var(--sb) + 58px);border-radius:26px;overflow:hidden;background:#000;box-shadow:0 0 0 3px #3e3e3e,0 0 0 7px #1b1b1b}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.cb{position:absolute;z-index:6;width:54px;height:54px;border-radius:15px;background:#2b2b2b;border:3px solid #707070;box-shadow:0 0 0 4px #1b1b1b;display:flex;align-items:center;justify-content:center;padding:0}
.cb svg{width:30px;height:30px}
.cb:active{transform:scale(.93)}
#bMenu{left:2px;top:calc(var(--st) + 26px)}
#bFit{right:2px;top:calc(var(--st) + 26px)}
#bDex{left:2px;bottom:calc(var(--sb) + 32px)}
#bClk{right:2px;bottom:calc(var(--sb) + 32px);background:var(--yel);border-color:#fff}
#bClk.ff{background:#ff8a00;animation:ffb .5s infinite}
@keyframes ffb{50%{box-shadow:0 0 0 4px #1b1b1b,0 0 12px 4px #ffd800}}
#topbar{position:absolute;left:64px;right:64px;top:calc(var(--st) + 4px);height:42px;z-index:5;display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;pointer-events:none}
#stName{font-family:var(--dela);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cnt{font-size:11px;font-weight:800;color:#bbb;white-space:nowrap}
#bHint{pointer-events:auto;flex:none;border:0;border-radius:99px;background:#ffd23f;color:#3a2a00;font-weight:900;font-size:11px;padding:4px 9px;font-family:inherit;box-shadow:0 2px 0 #b8901a;cursor:pointer}
#bHint.nudge{animation:hn .9s ease-in-out infinite}@keyframes hn{50%{transform:scale(1.18);background:#fff3a0}}
.htabs{display:flex;gap:6px;margin:4px 0 6px}.htab{flex:1;border:2px solid #ddd;background:#fff;border-radius:10px;padding:5px 2px;font-weight:900;font-family:inherit;font-size:13px;cursor:pointer}.htab small{display:block;font-size:10px;color:#888}.htab.on{border-color:#ffb400;background:#fff6cc}
.hl li.nx{background:#fff3c0;border:2px dashed #ffb400}.hl li.nx::before{content:"💡 "}.hl li.lk{color:#aaa}.hl li.lk::before{content:"・ ";color:#aaa}
#botbar{position:absolute;left:64px;right:64px;bottom:calc(var(--sb) + 6px);height:46px;z-index:5;display:flex;align-items:center;justify-content:center;gap:6px;color:#fff}
.zk{width:38px;height:34px;border-radius:10px;border:2px solid #707070;background:#3a3a3a;color:#fff;font-size:20px;font-weight:800;line-height:1;padding:0}
.zk:active{transform:translateY(2px)}
#zbar{width:52px;height:8px;border-radius:4px;background:#555;position:relative;overflow:hidden}
#zfill{position:absolute;left:0;top:0;bottom:0;background:var(--yel)}
#time{font-family:var(--dela);font-size:20px;margin-left:6px;min-width:58px;text-align:right}
#time small{display:block;font-family:var(--maru);font-size:9px;color:#bbb;text-align:right;margin-top:-2px}
#time.hurry{color:#ff6b5e}
#led{position:absolute;left:50%;top:calc(var(--st) + 44px);width:10px;height:4px;margin-left:-5px;border-radius:2px;background:#5a2222;z-index:7}
#led.on{background:#ff3b30;box-shadow:0 0 8px 3px #ff3b30}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:50;background:rgba(0,0,0,.8);color:#fff;font-weight:800;padding:5px 14px;border-radius:99px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#selbar{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:6px;max-width:calc(100% - 20px);background:rgba(20,18,26,.62);color:#fff;font-weight:800;font-size:11px;line-height:1.3;padding:4px 12px;border-radius:99px;pointer-events:none;transition:background .2s}
#selbar small{display:block;font-size:9.5px;opacity:.75}
#selbar button{display:none;pointer-events:auto;border:0;border-radius:50%;width:24px;height:24px;background:#3a2a00;color:#ffd23f;font-weight:900;font-size:13px;padding:0;flex:none}
#selbar.on{background:#ffd23f;color:#3a2a00;font-size:12.5px;padding:5px 6px 5px 14px;box-shadow:0 3px 0 #b8901a;animation:sbp 1s ease-in-out infinite}#selbar.on button{display:block}
@keyframes sbp{50%{transform:translateX(-50%) scale(1.04)}}
#screen.sel{box-shadow:0 0 0 3px #ffd23f,0 0 0 7px #1b1b1b,0 0 22px 6px rgba(255,210,63,.55)}
.achl li::before{content:none}.achl li.ng{opacity:.5}.rank{text-align:center;font-weight:900;font-size:22px;margin:-4px 0 4px;color:#e8483a}.rank.rS{color:#e8a800;text-shadow:0 0 8px #ffe680}.rank small{font-size:12px;color:#2a9a50}
#cap{position:absolute;left:50%;bottom:12px;transform:translate(-50%,30px);z-index:6;display:flex;align-items:center;gap:8px;max-width:calc(100% - 24px);background:rgba(20,18,26,.88);color:#ffe066;font-weight:800;font-size:13px;line-height:1.4;padding:7px 8px 7px 14px;border-radius:14px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
#cap.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#cap span::before{content:'▶ ';color:#fff}
#cap button{flex:none;border:none;border-radius:10px;background:#ffd800;color:#262626;font-weight:800;font-size:12px;padding:5px 9px}
/* がめん */
.scr{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.scr.show{display:flex}
#title{background:#f6c64a;overflow:hidden}
#tcv{position:absolute;inset:0;width:100%;height:100%}
.logo{position:relative;font-family:var(--dela);font-size:clamp(46px,14vw,110px);line-height:1;display:flex;margin-top:-26vh;gap:.04em}
.logo span{display:inline-block;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.25);animation:bob 1.4s ease-in-out infinite}
.logo span:nth-child(1){color:#e8483a}.logo span:nth-child(2){color:#2f6bff;animation-delay:.12s}.logo span:nth-child(3){color:#fff;animation-delay:.24s}.logo span:nth-child(4){color:#2a9a50;animation-delay:.36s}.logo span:nth-child(5){color:#ff7eb6;animation-delay:.48s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.tsub{position:relative;margin-top:14px;background:#262626;color:#fff;font-weight:800;font-size:clamp(14px,4.2vw,21px);padding:6px 16px;border-radius:999px}
.press{position:absolute;bottom:12%;left:50%;transform:translateX(-50%);font-family:var(--dela);font-size:clamp(20px,6vw,30px);background:#262626;color:#fff;border:none;border-radius:999px;padding:12px 32px 8px;animation:blink 1.1s steps(2) infinite;white-space:nowrap}
.press small{display:block;font-family:var(--maru);font-size:12px;color:var(--yel)}
@keyframes blink{50%{opacity:.6}}
@media (min-aspect-ratio:11/10){.logo{margin-top:-30vh}.press{bottom:8%}}
.copy{position:absolute;bottom:calc(var(--sb) + 8px);font-size:11px;font-weight:800;opacity:.75}
#ov{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(20,18,26,.66);padding:12px}
#ov.show{display:flex}
.panel{color:var(--ink);background:#fffaf0;border-radius:20px;box-shadow:0 0 0 4px #262626,0 10px 0 4px rgba(0,0,0,.3);padding:18px;width:min(100%,480px);max-height:100%;overflow:auto;text-align:left}
.panel h2{font-family:var(--dela);margin:0 0 8px;font-size:23px;font-weight:400}
.panel p{margin:6px 0;line-height:1.6;font-size:14px}
.btn{display:block;width:100%;margin:10px 0 0;border:none;border-radius:14px;box-shadow:0 4px 0 #262626;background:var(--yel);font-size:16px;font-weight:800;padding:10px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #262626}
.btn.w{background:#e9e4da}.btn.p{background:#e8483a;color:#fff}
.tag{display:inline-block;font-family:var(--dela);font-size:12px;background:#262626;color:var(--yel);border-radius:6px;padding:2px 8px;margin-bottom:4px}
.goal{background:#fff3c4;border-radius:12px;padding:10px 12px;font-weight:800;line-height:1.65;white-space:pre-line;font-size:14px}
.stamp{font-family:var(--dela);font-size:clamp(32px,10vw,48px);color:#e8483a;transform:rotate(-5deg);text-align:center;animation:stamp .5s cubic-bezier(.3,1.6,.5,1)}
.stamp.f{color:#5a7ad8}
@keyframes stamp{0%{transform:scale(3) rotate(-30deg);opacity:0}100%{transform:rotate(-5deg) scale(1)}}
.steps{margin:8px 0;padding:0;list-style:none}
.steps li{padding:5px 8px;margin:4px 0;background:#f1ece2;border-radius:8px;font-weight:800;font-size:13px}
.steps li::before{content:"✔ ";color:#2a9a50}
.rts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.rts span{font-size:11px;font-weight:800;border-radius:99px;padding:2px 9px;background:#ddd}
.rts span.ok{background:var(--yel)}
#select{background:#2f6bff;overflow:auto;justify-content:flex-start;padding:calc(var(--st) + 24px) 12px 24px}
#select h2{font-family:var(--dela);font-weight:400;color:#fff;font-size:clamp(28px,8vw,44px);margin:8px 0 12px;text-shadow:0 5px 0 rgba(0,0,0,.25)}
.stc{display:flex;align-items:center;gap:12px;width:min(100%,480px);margin:7px 0;text-align:left;border:none;border-radius:20px;box-shadow:0 6px 0 rgba(0,0,0,.3);padding:12px 14px;background:#fffaf0;flex:none}
.stc:active{transform:translateY(4px)}
.stc .no{font-family:var(--dela);font-size:30px;width:54px;height:54px;line-height:58px;text-align:center;border-radius:14px;color:#fff;flex:none}
.stc .tx{flex:1;min-width:0}.stc .tx b{display:block;font-size:17px}.stc .tx small{font-size:12px;color:#666}
.stc.lock{filter:grayscale(1);opacity:.7}
#loading{background:#111;color:#fff}
#loading .lt{font-family:var(--dela);font-size:22px;letter-spacing:.15em;margin-top:12px}
#lcv{width:180px;height:120px}
#ending{background:#241f5c;color:#fff;overflow:hidden}
#ecv{position:absolute;inset:0;width:100%;height:100%}
#crwrap{position:absolute;left:0;right:0;top:0;height:66%;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 12%,#000 85%,transparent);mask-image:linear-gradient(transparent,#000 12%,#000 85%,transparent)}
#credits{position:relative;font-size:18px;font-weight:800;line-height:2;animation:roll 24s linear forwards}
#credits h3{font-family:var(--dela);font-weight:400;font-size:28px;color:var(--yel);margin:26px 0 8px}
@keyframes roll{0%{transform:translateY(60vh)}100%{transform:translateY(-120%)}}
#endBtn{position:absolute;bottom:calc(var(--sb) + 20px);left:50%;transform:translateX(-50%);width:auto;padding:10px 26px;display:none}
.dexl{columns:2;font-size:13px;font-weight:800;margin:8px 0}
.dexl div{break-inside:avoid;padding:3px 0}
</style>
</head>
<body>
<div id="app">
  <div id="screen"><canvas id="cv"></canvas><div id="selbar"><span id="selTx"></span><button id="selX" aria-label="やめる">✕</button></div><div id="toast"></div><div id="cap"></div></div>
  <div id="led"></div>
  <div id="topbar"><span id="stName">STAGE</span><span id="cnt"></span><button id="bHint" aria-label="ヒント">💡ヒント</button></div>
  <div id="botbar"><button class="zk" id="bZout" aria-label="ちいさく">－</button><div id="zbar"><div id="zfill"></div></div><button class="zk" id="bZin" aria-label="おおきく">＋</button><div id="time">8:00<small>のこり</small></div></div>
  <button class="cb" id="bMenu" aria-label="メニュー"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3.5" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M9.5 7v4M14.5 7v4" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><path d="M8 11h8v1.5a4 4 0 0 1-8 0z" fill="#fff"/><path d="M12 16.5v4" stroke="#fff" stroke-width="2.2"/></svg></button>
  <button class="cb" id="bFit" aria-label="ぜんたい／ズーム"><svg viewBox="0 0 24 24"><path d="M7.5 13V6.5a1.4 1.4 0 0 1 2.8 0V12V4.6a1.4 1.4 0 0 1 2.8 0V12V5.6a1.4 1.4 0 0 1 2.8 0V12.5V8.6a1.4 1.4 0 0 1 2.8 0V15c0 4.2-2.8 7-6.8 7-3 0-4.8-1.6-6.3-4l-2.2-3.6a1.4 1.4 0 0 1 2.3-1.6z" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
  <button class="cb" id="bDex" aria-label="みつけた チョッカイ"><svg viewBox="0 0 24 24"><path d="M12 20.5s-8-5-8-10.6A4.4 4.4 0 0 1 12 7.2a4.4 4.4 0 0 1 8 2.7c0 5.6-8 10.6-8 10.6z" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/></svg></button>
  <button class="cb" id="bClk" aria-label="はやおくり"><svg viewBox="0 0 24 24"><rect x="2.5" y="2.5" width="19" height="19" rx="2" fill="none" stroke="#000" stroke-width="2.4"/><path d="M11 5.5v8h7" stroke="#000" stroke-width="3" fill="none"/></svg></button>
  <div id="ov"></div>
  <div id="title" class="scr show">
    <canvas id="tcv"></canvas>
    <div class="logo"><span>リ</span><span>モ</span><span>コ</span><span>ロ</span><span>ン</span></div>
    <div class="tsub">ふーたんと リッキーの ちょっかいタウン</div>
    <button class="press" id="bStart">PRESS START<small>タップで はじめる</small></button>
    <div class="copy">チョッカイを だして、ストーリーを すすめろ！</div>
  </div>
  <div id="select" class="scr"></div>
  <div id="loading" class="scr"><canvas id="lcv" width="360" height="240"></canvas><div class="lt">NOW LOADING<span id="ldots"></span></div></div>
  <div id="ending" class="scr"><canvas id="ecv"></canvas><div id="crwrap"><div id="credits"></div></div><button class="btn" id="endBtn">タイトルへ</button></div>
</div>
<script>
'use strict';
// =====================================================================
//  リモコロン ～ふーたんと リッキーの ちょっかいタウン～
//  まちの ひと・どうぶつ・どうぐに「チョッカイ」を だして、
//  じかん ないに ステージの ストーリーを すすめる。
// =====================================================================
const $=id=>document.getElementById(id);
const INK='#1d1a24';
const COL={red:'#e8483a',blue:'#2f6bff',yel:'#ffd23f',pink:'#ff7eb6',grn:'#3ccf6e',pur:'#8a5cff',org:'#ff9a1f',cream:'#fff3d6'};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const SKEY='remocolon_v3';
let SAVE={cleared:0,routes:{},dex:{},mute:false,mc:{},sec:{},ach:{},best:{},fl:{},ura:{}};
try{const s=JSON.parse(localStorage.getItem(SKEY)||'null');if(s){SAVE=Object.assign(SAVE,s);for(const k of['mc','sec','ach','best','fl','ura'])SAVE[k]=SAVE[k]||{};}}catch(e){}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(SAVE));}catch(e){}}

// =====================================================================
//  フラットな ベクター えがき（ふちどり なし）
// =====================================================================
let X=null,SEED=0,WOB=0,LW=2,OLK=0,BOIL=0;
function h1(n){const s=Math.sin(n)*43758.5453;return s-Math.floor(s);}
function jt(x,y){if(!WOB)return[x,y];const k=x*0.131+y*0.173+SEED*1.7+BOIL*3.31;return [x+(h1(k)-.5)*WOB,y+(h1(k+19.1)-.5)*WOB];}
function pSmooth(pts){const n=pts.length,q=pts.map(p=>jt(p[0],p[1]));X.beginPath();X.moveTo((q[n-1][0]+q[0][0])/2,(q[n-1][1]+q[0][1])/2);
  for(let i=0;i<n;i++){const a=q[i],b=q[(i+1)%n];X.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2);}X.closePath();}
function pPoly(pts){const q=pts.map(p=>jt(p[0],p[1]));X.beginPath();X.moveTo(q[0][0],q[0][1]);for(let i=1;i<q.length;i++)X.lineTo(q[i][0],q[i][1]);X.closePath();}
function fs(fill,lw){if(lw===undefined)lw=LW;if(fill){X.fillStyle=fill;X.fill();}if(lw&&OLK){X.lineWidth=lw*OLK;X.strokeStyle=INK;X.lineJoin='round';X.lineCap='round';X.stroke();}}
function ell(cx,cy,rx,ry,fill,lw){X.beginPath();X.ellipse(cx,cy,Math.max(.01,rx),Math.max(.01,ry),0,0,Math.PI*2);fs(fill,lw);}
function box(x,y,w,h,fill,lw){X.beginPath();X.rect(x,y,w,h);fs(fill,lw);}
function rbox(x,y,w,h,r,fill){X.beginPath();if(X.roundRect)X.roundRect(x,y,w,h,r);else X.rect(x,y,w,h);X.fillStyle=fill;X.fill();}
function poly(pts,fill,lw){pPoly(pts);fs(fill,lw);}
function blob(pts,fill,lw){pSmooth(pts);fs(fill,lw);}
function ln(x1,y1,x2,y2,lw,col){X.beginPath();X.moveTo(x1,y1);X.lineTo(x2,y2);X.lineWidth=lw||LW;X.strokeStyle=col||INK;X.lineCap='round';X.stroke();}
function crv(pts,lw,col){X.beginPath();X.moveTo(pts[0][0],pts[0][1]);
  if(pts.length===2)X.lineTo(pts[1][0],pts[1][1]);else{for(let i=1;i<pts.length-1;i++)X.quadraticCurveTo(pts[i][0],pts[i][1],(pts[i][0]+pts[i+1][0])/2,(pts[i][1]+pts[i+1][1])/2);X.lineTo(pts[pts.length-1][0],pts[pts.length-1][1]);}
  X.lineWidth=lw||LW;X.strokeStyle=col||INK;X.lineCap='round';X.lineJoin='round';X.stroke();}
function limb(x1,y1,x2,y2,col,w){X.lineCap='round';X.beginPath();X.moveTo(x1,y1);X.quadraticCurveTo((x1+x2)/2+.3,(y1+y2)/2,x2,y2);X.lineWidth=w;X.strokeStyle=col;X.stroke();}
function dot(x,y,r,col){X.beginPath();X.arc(x,y,Math.max(.05,r),0,Math.PI*2);X.fillStyle=col||INK;X.fill();}
function otxt(s,x,y,size,fill,rot){X.save();X.translate(x,y);if(rot)X.rotate(rot);X.font=`800 ${size}px "M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif`;X.textAlign='center';X.textBaseline='middle';
  X.lineJoin='round';X.lineWidth=size*.26;X.strokeStyle=INK;X.strokeText(s,0,0);X.fillStyle=fill||'#fff';X.fillText(s,0,0);X.restore();}
function wtxt(s,x,y,size,col,al){X.font=`800 ${size}px "M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif`;X.textAlign=al||'center';X.textBaseline='middle';X.fillStyle=col||INK;
  const ls=String(s).split('\n');ls.forEach((l,i)=>X.fillText(l,x,y+(i-(ls.length-1)/2)*size*1.25));}
function star(x,y,r,fill){const pts=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i/10*Math.PI*2,rr=i%2?r*.45:r;pts.push([x+Math.cos(a)*rr,y+Math.sin(a)*rr]);}poly(pts,fill||COL.yel);}

function bgmPlay(i){BGM.song=i;BGM.step=0;if(AC)BGM.next=AC.currentTime+.1;}
setInterval(()=>{
  if(!AC||BGM.song<0||SAVE.mute)return;const S=SONGS[BGM.song],sp=60/(S.bpm*BGM.rate)/2;
  if(BGM.next<AC.currentTime-.3)BGM.next=AC.currentTime+.05;
  while(BGM.next<AC.currentTime+.15){const i=BGM.step,t=BGM.next,bar=(i>>3)&3,b=i&7;
    const m=S.mel[i%32];if(m)tone(S.lead,mf(m),t,sp*1.6,S.lv,BGG,null,S.vib);
    const bp=S.bp[b];if(bp>=0)tone('triangle',mf(S.roots[bar]+bp),t,sp*.9,.2,BGG);
    const d=S.dr[b];if(d==='k')tone('sine',150,t,.16,.3,BGG,45);else if(d==='s')noise(t,.12,.2,1800,BGG,.8);else if(d==='h')noise(t,.04,.1,7000,BGG,1,'highpass');
    else if(d==='t'){tone('sine',120,t,.3,.35,BGG,60);}else if(d==='b'){tone('square',mf(96),t,.1,.04,BGG);}
    BGM.step=(i+1)%32;BGM.next+=sp;}
},30);

    cam.x=gest.cx-(mx-gest.mx)/cam.z;cam.y=gest.cy-(my-gest.my)/cam.z;zoomAt(mx-r.left,my-r.top,gest.z0*d/Math.max(10,gest.d0));gest.cx=cam.x;gest.cy=cam.y;gest.mx=mx;gest.my=my;gest.z0=cam.z;gest.d0=d;}});

function hitTest(wx,wy){let best=null,ba=1e12,bd=null,bda=1e12;
  for(const e of G.ents){if(e.hidden||!e.poke||(e.nohit&&e.nohit()))continue;const w=e.w,h=e.h;const ss=Math.min(w,h)*cam.z;
    if((e.tiny&&!SAVE.easy)?ss<6:ss<3)continue;
    const pad=e.decoy?2/cam.z:Math.max(6/cam.z,((SAVE.easy?40:30)/cam.z-Math.min(w,h))/2);
    const hx=e.x-w/2-pad,hy=e.y-h-pad;if(wx>=hx&&wx<=hx+w+pad*2&&wy>=hy&&wy<=hy+h+pad*2){const a=w*h;if(e.decoy){if(a<bda){bda=a;bd=e;}}else if(a<ba){ba=a;best=e;}}}
  return best||bd;}
// ---------------- ふたつ えらぶ チョッカイ ----------------
function PR(a,b,fn){for(const x of[].concat(a))for(const y of[].concat(b)){if(G.pairs[x+'|'+y])console.warn('PAIR DUP',stIdx,x,y);G.pairs[x+'|'+y]=fn;G.pairs[y+'|'+x]=fn;for(const id of[x,y]){const e=G.ents.find(q=>q.id===id);if(e&&!e.poke)e.poke=q=>narr(q,'('+q.name+')');}}}
function U(id,line){const e=G.ents.find(q=>q.id===id);if(!e){console.warn('U?',id);return;}e.use=e.poke;e.poke=q=>{q.react=Math.max(q.react,.5);if(line)say(q,line);else narr(q,'('+q.name+')');};return e;}
function fire(id){const e=G.ents.find(q=>q.id===id);if(e)(e.use||e.poke)(e);}
function pkeys(e){return[e.id,String(e.id).replace(/\d+$/,''),e.gk].filter(Boolean);}
function resolvePair(a,b){for(const ka of pkeys(a))for(const kb of pkeys(b)){const fn=G.pairs[ka+'|'+kb];if(fn){const r=fn(a,b);return r!==false;}}
  const sg=a.text?a:b.text?b:null,o=sg===a?b:a;if(sg&&o.k==='person'&&!o.decoy){say(o,'えーと…「'+sg.text.replace(/\n/g,' ')+'」だって',5);return true;}return false;}
function selSet(e){G.sel=e;sfx('tap');G.fx.push({k:'bang',e,life:.7});updSel();}
function selClear(){G.sel=null;updSel();}
function updSel(){const s=G.sel;$('screen').classList.toggle('sel',!!s);$('selbar').classList.toggle('on',!!s);
  $('selTx').innerHTML=s?`✋ <b>${s.name}</b> → なにに きづかせる？<small>べつの ものを タップ ／ おなじ ものを もういちど で チョッカイ</small>`:'👆 きになる ものを タップして えらぼう';}
function topOf(e){return e.k==='person'?e.look.h*(e.sit?.8:1.02):(e.bubY!=null?e.bubY:(e.h||20));}
function tap(sx,sy){
  if(mode!=='play'||G.over)return;const w=s2w(sx,sy);const e=hitTest(w[0],w[1]);
  $('led').classList.add('on');setTimeout(()=>$('led').classList.remove('on'),180);
  if(!e){if(G.sel){selClear();sfx('nope');}else{sfx('miss');G.fx.push({k:'ring',x:w[0],y:w[1],life:.4,miss:1});}return;}
  if(e.instant){G.pokes++;sfx('poke');try{e.poke(e);}catch(err){console.error(err);}updCnt();return;}
  if(!G.sel){selSet(e);return;}
  const a=G.sel;selClear();G.pokes++;
  if(a===e){sfx('poke');G.fx.push({k:'ring',x:w[0],y:w[1],life:.5});try{e.poke(e);}catch(err){console.error(err);}updCnt();return;}
  G.fx.push({k:'link',a,b:e,life:.9});sfx('poke');
  let ok=false;try{ok=resolvePair(a,e);}catch(err){console.error(err);}
  if(!ok){sfx('nope');for(const q of[a,e])G.fx.push({k:'q',e:q,life:1.5});}
  updCnt();
}

// ---------------- こうしん ----------------
function update(dt){
  T+=dt;
  if(camAnim){camAnim.t=Math.min(1,camAnim.t+dt*3.2);const k=1-Math.pow(1-camAnim.t,3);cam.z=camAnim.z0+(camAnim.z1-camAnim.z0)*k;cam.x=camAnim.x0+(camAnim.x1-camAnim.x0)*k;cam.y=camAnim.y0+(camAnim.y1-camAnim.y0)*k;clampCam();if(camAnim.t>=1)camAnim=null;}
  for(const f of G.fx){f.life-=dt;if(f.vx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=40*dt;}if(f.k==='pop')f.y-=14*dt;}
  G.fx=G.fx.filter(f=>f.life>0);
  if(mode!=='play')return;
  const gdt=dt*G.speed;
  if(G.over){G.endT-=dt;for(const e of G.ents)tickEnt(e,dt);if(G.endT<=0){G.endT=1e9;showResult();}return;}
  if(SAVE.easy)G.easyUsed=true;G.min+=gdt/ST.spm*(SAVE.easy?.6:1);
  while(G.tl.length&&G.tl[0].m<=G.min){const ev=G.tl.shift();try{ev.fn();}catch(err){console.error(err);}}
  for(const e of G.ents)tickEnt(e,gdt);
  if(G.sel&&G.sel.hidden)selClear();
  if(ST.update)ST.update(gdt);
  G.lastProg+=dt;if(G.steps.length!==G.lastN){G.lastN=G.steps.length;G.lastProg=0;}if(G.lastProg>70&&!G.nudged){G.nudged=true;$('bHint').classList.add('nudge');showToast('こまったら 💡ヒント を みてね');}
  if(G.min>=ST.t1&&!G.over){G.min=ST.t1;if(ST.timeUp)ST.timeUp();lose();}
}
function tickEnt(e,dt){
  e.t+=dt;if(e.react>0)e.react=Math.max(0,e.react-dt);
  if(e.bub){e.bub.t-=dt;if(e.bub.t<=0)e.bub=null;}

let dexCache=null;
function dexKeys(i){const src=STAGES[i].toString()+(EXTRAS[i]?EXTRAS[i].toString():'');const set=new Set();const re=/dex\(([^)]*?),/g;let m;while((m=re.exec(src))){const q=m[1].match(/'([^']+)'/g);if(q)q.forEach(x=>set.add(x.slice(1,-1)));}return set;}
function dexStat(i){if(!dexCache)dexCache=STAGES.map((_,k)=>dexKeys(k));const set=dexCache[i];let n=0;for(const k of set)if(SAVE.dex[i+':'+k])n++;return[n,set.size];}
function dexAll(){let a=0,b=0;for(let i=0;i<STAGES.length;i++){const[n,t]=dexStat(i);a+=n;b+=t;}return[a,b];}

function checkAch(){
  if(SAVE.cleared>=1)unlock('clear1');
  let rt=0;for(let i=0;i<NS;i++){const n=Object.keys(SAVE.routes[i]||{}).length;rt+=n;if(n>=3)unlock('st'+i);}if(rt>=NS*3)unlock('routes');
  let mc=0;for(let i=0;i<NS;i++)mc+=countMC(i);if(mc>=6)unlock('mc6');if(mc>=NS*3)unlock('mc18');
  const sc=Object.keys(SAVE.sec).length;if(sc>=1)unlock('sec1');if(sc>=NS)unlock('sec6');
  const[a,b]=dexAll();if(a>=b*.5)unlock('dex50');if(a>=b)unlock('dex100');
  if(Object.values(SAVE.best).some(r=>r==='S'))unlock('speed');if(SI.every(i=>SAVE.best[i]==='S'))unlock('allS');
  const un=Object.keys(SAVE.ura||{}).length;if(un>=1)unlock('ura1');if(un>=NS)unlock('uraAll');

}
