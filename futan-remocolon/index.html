<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffd23f">
<title>リモコロン ～ふーたんと リッキーの ちょっかいタウン～</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1a24;--cream:#fff3d6;--red:#ff4b3e;--blue:#2f6bff;--yel:#ffd23f;--pink:#ff7eb6;--grn:#3ccf6e;--pur:#8a5cff;--org:#ff9a1f;
  --dela:"Dela Gothic One","M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;--maru:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#ffd23f;color:var(--ink);font-family:var(--maru);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{background:repeating-linear-gradient(-45deg,#ffd23f 0 26px,#ffc61a 26px 52px)}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{position:relative;height:100%;height:100dvh;max-width:900px;margin:0 auto;display:flex;flex-direction:column;background:var(--cream);border-left:4px solid var(--ink);border-right:4px solid var(--ink)}
/* ---- HUD ---- */
#hud{flex:none;display:flex;align-items:center;gap:8px;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));background:var(--ink);color:#fff}
#bMenu{width:42px;height:42px;border:3px solid #fff;border-radius:12px;background:var(--red);color:#fff;font-size:22px;line-height:1;font-weight:800;flex:none}
#stName{font-family:var(--dela);font-size:13px;line-height:1.15;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stName small{display:block;font-family:var(--maru);font-size:10px;color:var(--yel);letter-spacing:.1em}
#smiles{display:flex;gap:2px;flex:none}
#smiles i{width:24px;height:24px;border-radius:50%;border:2.5px solid #fff;background:#55536a;font-style:normal;font-size:14px;line-height:19px;text-align:center;transition:transform .3s}
#smiles i.on{background:var(--yel);transform:scale(1.15) rotate(-8deg)}
#tapes{display:flex;gap:4px;flex:none}
.tape{width:46px;height:32px;border-radius:5px;border:2.5px solid #fff;background:#3a3850;position:relative;overflow:hidden}
.tape.full{background:#fff}
.tape canvas{position:absolute;left:3px;top:2px;width:36px;height:24px}
.tape.new{animation:tapeIn .6s}
@keyframes tapeIn{0%{transform:scale(2) rotate(20deg)}100%{transform:none}}
/* ---- stage ---- */
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#8fe0ff}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
/* ---- navi ---- */
#navi{flex:none;display:flex;align-items:center;gap:8px;padding:6px 8px;background:#fff;border-top:4px solid var(--ink);min-height:68px}
#naviFace{width:54px;height:54px;flex:none;border-radius:50%;border:3px solid var(--ink);background:#bdf0ff}
#naviTxt{flex:1;font-size:clamp(14px,4vw,18px);line-height:1.35;font-weight:800;min-height:2.7em;display:flex;align-items:center}
#bVoice{flex:none;width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);background:var(--cream);font-size:18px}
/* ---- remote ---- */
#remote{flex:none;position:relative;display:flex;justify-content:center;gap:clamp(8px,3vw,22px);padding:16px 10px;padding-bottom:max(14px,env(safe-area-inset-bottom));
  background:radial-gradient(circle at 12% 30%,#ffffff55 0 6px,transparent 7px) 0 0/22px 22px,var(--yel);border-top:4px solid var(--ink)}
#remote::before{content:"";position:absolute;left:50%;top:-12px;width:90px;height:18px;margin-left:-45px;background:var(--ink);border-radius:10px 10px 0 0}
#led{position:absolute;left:50%;top:-8px;width:14px;height:10px;margin-left:-7px;border-radius:50%;background:#7a2a24;z-index:2}
#led.on{background:#ff3b30;box-shadow:0 0 12px 4px #ff3b30}
.rb{position:relative;width:clamp(88px,27vw,128px);height:clamp(80px,22vw,100px);border:4px solid var(--ink);border-radius:26px;box-shadow:0 7px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .06s,box-shadow .06s;padding:0}
.rb:active,.rb.press{transform:translateY(6px);box-shadow:0 1px 0 var(--ink)}
.rb .ic{font-size:clamp(28px,8vw,38px);line-height:1}
.rb .lb{font-size:clamp(13px,3.8vw,17px);font-weight:800;color:#fff;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink)}
.rb.red{background:var(--red)}.rb.blue{background:var(--blue)}.rb.pink{background:var(--pink)}
.rb.hint{animation:hint .7s infinite}
.rb.hint::after{content:"👇";position:absolute;top:-38px;font-size:28px;animation:hintF .7s infinite}
@keyframes hint{50%{transform:translateY(-6px) scale(1.06);filter:brightness(1.15)}}
@keyframes hintF{50%{transform:translateY(6px)}}
.rb.dim{filter:grayscale(.6) brightness(.9)}
/* ---- screens ---- */
.scr{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.scr.show{display:flex}
#title{background:#ff7eb6;overflow:hidden}
#tcv{position:absolute;inset:0;width:100%;height:100%}
.logo{position:relative;font-family:var(--dela);font-size:clamp(46px,15vw,104px);line-height:1;display:flex;margin-top:-28vh}
.logo span{display:inline-block;color:#fff;-webkit-text-stroke:3px var(--ink);text-shadow:4px 6px 0 var(--ink);animation:bob 1.2s ease-in-out infinite}
.logo span:nth-child(1){color:var(--red);animation-delay:0s;transform:rotate(-8deg)}
.logo span:nth-child(2){color:var(--yel);animation-delay:.12s}
.logo span:nth-child(3){color:var(--blue);animation-delay:.24s}
.logo span:nth-child(4){color:var(--grn);animation-delay:.36s}
.logo span:nth-child(5){color:#fff;animation-delay:.48s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(5deg)}}
.tsub{position:relative;margin-top:12px;background:var(--ink);color:#fff;font-weight:800;font-size:clamp(14px,4.3vw,22px);padding:6px 16px;transform:rotate(-3deg);border-radius:6px}
.press{position:absolute;bottom:12%;left:50%;transform:translateX(-50%);font-family:var(--dela);font-size:clamp(20px,6vw,32px);background:#fff;border:4px solid var(--ink);border-radius:999px;padding:10px 30px 6px;box-shadow:0 6px 0 var(--ink);animation:blink 1.1s steps(2) infinite;white-space:nowrap}
.press small{display:block;font-family:var(--maru);font-size:13px}
@keyframes blink{50%{opacity:.55}}
@media (min-aspect-ratio:11/10){.logo{margin-top:-30vh}.press{bottom:8%}}
.copy{position:absolute;bottom:max(8px,env(safe-area-inset-bottom));font-size:11px;font-weight:800;color:var(--ink);opacity:.7}
.panel{color:var(--ink);background:#fff;border:4px solid var(--ink);border-radius:22px;box-shadow:8px 8px 0 var(--ink);padding:18px;width:min(92%,460px);max-height:88%;overflow:auto}
.panel h2{font-family:var(--dela);margin:0 0 10px;font-size:24px;font-weight:400}
.btn{display:block;width:100%;margin:10px 0 0;border:4px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);background:var(--yel);font-size:19px;font-weight:800;padding:10px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.sub{background:#fff}.btn.pink{background:var(--pink);color:#fff;text-shadow:0 2px 0 var(--ink)}
#select{background:repeating-conic-gradient(from 0deg at 50% 120%,#2f6bff 0 10deg,#3f7bff 10deg 20deg)}
#select h2{font-family:var(--dela);font-weight:400;color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:3px 4px 0 var(--ink);font-size:clamp(28px,8vw,44px);margin:0 0 12px}
.stc{display:flex;align-items:center;gap:12px;width:min(92%,460px);margin:7px 0;text-align:left;border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:10px 14px;background:#fff}
.stc:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.stc .no{font-family:var(--dela);font-size:38px;width:54px;height:54px;line-height:58px;text-align:center;border-radius:14px;border:3px solid var(--ink);color:#fff;flex:none}
.stc .tx{flex:1}.stc .tx b{display:block;font-size:19px}.stc .tx small{font-size:13px;color:#555}
.stc .st{font-size:26px}
.stc.lock{background:#ccc;filter:grayscale(1);opacity:.8}
#loading{background:#111;color:#fff}
#loading .lt{font-family:var(--dela);font-size:22px;letter-spacing:.15em;margin-top:12px}
#lcv{width:180px;height:120px}
#banner{position:absolute;left:-10%;right:-10%;top:38%;z-index:15;background:var(--ink);color:#fff;transform:rotate(-6deg) translateX(-120%);padding:10px 0;text-align:center;pointer-events:none;border-top:6px solid var(--yel);border-bottom:6px solid var(--pink)}
#banner b{display:block;font-family:var(--dela);font-weight:400;font-size:clamp(16px,5vw,24px);color:var(--yel);letter-spacing:.2em}
#banner span{font-family:var(--dela);font-size:clamp(28px,9vw,50px)}
#banner.go{animation:ban 2.6s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes ban{0%{transform:rotate(-6deg) translateX(-120%)}22%,78%{transform:rotate(-6deg) translateX(0)}100%{transform:rotate(-6deg) translateX(120%)}}
#ov{position:absolute;inset:0;z-index:18;display:none;align-items:center;justify-content:center;background:rgba(29,26,36,.55)}
#ov.show{display:flex}
.tpk{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.tpk button{border:4px solid var(--ink);border-radius:14px;background:var(--ink);padding:6px;box-shadow:0 5px 0 #000;display:flex;flex-direction:column;align-items:center;gap:4px}
.tpk button:active{transform:translateY(4px)}
.tpk canvas{width:120px;height:90px;border-radius:6px;background:#000;display:block}
.tpk .lab{width:50px;height:34px;background:#fff;border-radius:6px}
.stamp{font-family:var(--dela);font-size:clamp(34px,11vw,56px);color:var(--red);-webkit-text-stroke:2px var(--ink);transform:rotate(-8deg);animation:stamp .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes stamp{0%{transform:scale(3) rotate(-30deg);opacity:0}100%{transform:rotate(-8deg) scale(1)}}
.big{font-size:20px;font-weight:800;margin:6px 0}
#ending{background:#241f5c;color:#fff;overflow:hidden;pointer-events:auto}
#ecv{position:absolute;inset:0;width:100%;height:100%}
#crwrap{position:absolute;left:0;right:0;top:0;height:64%;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 12%,#000 85%,transparent);mask-image:linear-gradient(transparent,#000 12%,#000 85%,transparent)}
#credits{position:relative;font-size:20px;font-weight:800;line-height:2;animation:roll 22s linear forwards}
#credits h3{font-family:var(--dela);font-weight:400;font-size:34px;color:var(--yel);margin:30px 0 10px}
@keyframes roll{0%{transform:translateY(60vh)}100%{transform:translateY(-120%)}}
#endBtn{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:auto;padding:10px 26px;display:none}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <button id="bMenu" aria-label="メニュー">≡</button>
    <div id="stName"><small>STAGE 1</small>にこにこ こうえん</div>
    <div id="smiles"></div>
    <div id="tapes"></div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="banner"><b>STAGE 1</b><span>にこにこ こうえん</span></div>
    <div id="ov"></div>
  </div>
  <div id="navi"><canvas id="naviFace" width="108" height="108"></canvas><div id="naviTxt">…</div><button id="bVoice" aria-label="よみあげ">🔊</button></div>
  <div id="remote">
    <div id="led"></div>
    <button class="rb red" id="bPoke"><span class="ic">👉</span><span class="lb">つんつん</span></button>
    <button class="rb blue" id="bRec"><span class="ic">🎥</span><span class="lb">ビデオ</span></button>
    <button class="rb pink" id="bHeart"><span class="ic">💗</span><span class="lb">こころビーム</span></button>
  </div>

  <div id="title" class="scr show">
    <canvas id="tcv"></canvas>
    <div class="logo"><span>リ</span><span>モ</span><span>コ</span><span>ロ</span><span>ン</span></div>
    <div class="tsub">ふーたんと リッキーの ちょっかいタウン</div>
    <button class="press" id="bStart">PRESS START<small>タッチで はじめる</small></button>
    <div class="copy">ちょっかいを だして、まちを えがおに！</div>
  </div>
  <div id="select" class="scr"></div>
  <div id="loading" class="scr"><canvas id="lcv" width="360" height="240"></canvas><div class="lt">NOW LOADING<span id="ldots"></span></div></div>
  <div id="ending" class="scr"><canvas id="ecv"></canvas><div id="crwrap"><div id="credits"></div></div><button class="btn" id="endBtn">タイトルへ</button></div>
</div>
<script>
'use strict';
// =====================================================================
//  リモコロン ～ふーたんと リッキーの ちょっかいタウン～
//  まちの ひとに 「ちょっかい」を だして、ビデオで とった できごとを
//  こまっている ひとの こころに うつして えがおに する ゲーム。
// =====================================================================
const $=id=>document.getElementById(id);
const WH=600;              // ワールドの たかさ
const INK='#1d1a24';
const COL={red:'#ff4b3e',blue:'#2f6bff',yel:'#ffd23f',pink:'#ff7eb6',grn:'#3ccf6e',pur:'#8a5cff',org:'#ff9a1f',cream:'#fff3d6',sky:'#8fe0ff'};

// ---------------- セーブ ----------------
const SKEY='remocolon_v1';
let SAVE={cleared:0,z:{},voice:true,mute:false};
try{const s=JSON.parse(localStorage.getItem(SKEY)||'null');if(s)SAVE=Object.assign(SAVE,s);}catch(e){}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(SAVE));}catch(e){}}

// =====================================================================
//  てがき ふうの ゆらゆら せん（ボイリング ライン）
// =====================================================================
let X=null, SEED=0, WOB=2.2, LW=3.4, BOIL=0;
function h1(n){const s=Math.sin(n)*43758.5453;return s-Math.floor(s);}
function jt(x,y){const k=x*0.131+y*0.173+SEED*1.7+BOIL*3.31;return [x+(h1(k)-.5)*WOB,y+(h1(k+19.1)-.5)*WOB];}
function pSmooth(pts){const n=pts.length,q=pts.map(p=>jt(p[0],p[1]));X.beginPath();X.moveTo((q[n-1][0]+q[0][0])/2,(q[n-1][1]+q[0][1])/2);
  for(let i=0;i<n;i++){const a=q[i],b=q[(i+1)%n];X.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2);}X.closePath();}
function pPoly(pts){const q=pts.map(p=>jt(p[0],p[1]));X.beginPath();X.moveTo(q[0][0],q[0][1]);for(let i=1;i<q.length;i++)X.lineTo(q[i][0],q[i][1]);X.closePath();}
function fs(fill,lw){if(lw===undefined)lw=LW;if(fill){X.fillStyle=fill;X.fill();}if(lw){X.lineWidth=lw;X.strokeStyle=INK;X.lineJoin='round';X.lineCap='round';X.stroke();}}
function ell(cx,cy,rx,ry,fill,lw){const n=Math.max(8,Math.min(20,Math.round((rx+ry)/3.5))),pts=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;pts.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry]);}pSmooth(pts);fs(fill,lw);}
function box(x,y,w,h,fill,lw){pPoly([[x,y],[x+w,y],[x+w,y+h],[x,y+h]]);fs(fill,lw);}
function poly(pts,fill,lw){pPoly(pts);fs(fill,lw);}
function blob(pts,fill,lw){pSmooth(pts);fs(fill,lw);}
function ln(x1,y1,x2,y2,lw,col){const a=jt(x1,y1),b=jt(x2,y2),m=jt((x1+x2)/2,(y1+y2)/2);X.beginPath();X.moveTo(a[0],a[1]);X.quadraticCurveTo(m[0],m[1],b[0],b[1]);X.lineWidth=lw||LW;X.strokeStyle=col||INK;X.lineCap='round';X.stroke();}
function crv(pts,lw,col){const q=pts.map(p=>jt(p[0],p[1]));X.beginPath();X.moveTo(q[0][0],q[0][1]);
  if(q.length===2)X.lineTo(q[1][0],q[1][1]);else{for(let i=1;i<q.length-1;i++){X.quadraticCurveTo(q[i][0],q[i][1],(q[i][0]+q[i+1][0])/2,(q[i][1]+q[i+1][1])/2);}X.lineTo(q[q.length-1][0],q[q.length-1][1]);}
  X.lineWidth=lw||LW;X.strokeStyle=col||INK;X.lineCap='round';X.lineJoin='round';X.stroke();}
function limb(x1,y1,x2,y2,col,w){const a=jt(x1,y1),b=jt(x2,y2),m=jt((x1+x2)/2+.5,(y1+y2)/2);X.lineCap='round';
  X.beginPath();X.moveTo(a[0],a[1]);X.quadraticCurveTo(m[0],m[1],b[0],b[1]);X.lineWidth=w+LW*1.6;X.strokeStyle=INK;X.stroke();
  X.beginPath();X.moveTo(a[0],a[1]);X.quadraticCurveTo(m[0],m[1],b[0],b[1]);X.lineWidth=w;X.strokeStyle=col;X.stroke();}
function dot(x,y,r,col){X.beginPath();X.arc(x,y,r,0,Math.PI*2);X.fillStyle=col||INK;X.fill();}
function txt(s,x,y,size,fill,rot){X.save();X.translate(x,y);if(rot)X.rotate(rot);X.font=`800 ${size}px "M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif`;X.textAlign='center';X.textBaseline='middle';
  X.lineJoin='round';X.lineWidth=size*.28;X.strokeStyle=INK;X.strokeText(s,0,0);X.fillStyle=fill||'#fff';X.fillText(s,0,0);X.restore();}
function burst(x,y,r,fill,n){const pts=[];n=n||10;for(let i=0;i<n*2;i++){const a=i/(n*2)*Math.PI*2,rr=i%2?r*.62:r;pts.push([x+Math.cos(a)*rr,y+Math.sin(a)*rr]);}poly(pts,fill);}
function heart(x,y,s,fill){X.save();X.translate(x,y);X.scale(s/20,s/20);blob([[0,8],[-9,0],[-11,-7],[-6,-11],[0,-7],[6,-11],[11,-7],[9,0]],fill||COL.pink,LW*20/s*.8);X.restore();}
function star(x,y,r,fill){const pts=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i/10*Math.PI*2,rr=i%2?r*.45:r;pts.push([x+Math.cos(a)*rr,y+Math.sin(a)*rr]);}poly(pts,fill||COL.yel);}
function note(x,y,s,fill){ell(x,y,s*.55,s*.42,fill||INK,LW*.8);ln(x+s*.5,y,x+s*.5,y-s*1.5,LW);ln(x+s*.5,y-s*1.5,x+s*1.1,y-s*1.1,LW);}

// =====================================================================
//  かお
// =====================================================================
function face(cx,cy,r,mood,t,big){
  const ex=r*.38,ey=cy+r*.02,es=r*(big?.15:.12);
  const blink=(t%3.7)<.12;
  if(mood==='happy'){crv([[-ex-es*1.3,ey+es*.5],[-ex,ey-es*1.2],[-ex+es*1.3,ey+es*.5]],LW*.9);crv([[ex-es*1.3,ey+es*.5],[ex,ey-es*1.2],[ex+es*1.3,ey+es*.5]],LW*.9);}
  else if(mood==='cry'){crv([[-ex-es*1.2,ey-es],[-ex+es,ey],[-ex-es*1.2,ey+es]],LW*.9);crv([[ex+es*1.2,ey-es],[ex-es,ey],[ex+es*1.2,ey+es]],LW*.9);}
  else if(mood==='surp'){ell(-ex,ey,es*1.3,es*1.5,'#fff',LW*.8);ell(ex,ey,es*1.3,es*1.5,'#fff',LW*.8);dot(-ex,ey,es*.55);dot(ex,ey,es*.55);}
  else if(blink){ln(-ex-es,ey,-ex+es,ey,LW*.9);ln(ex-es,ey,ex+es,ey,LW*.9);}
  else{ell(-ex,ey,es,es*1.25,INK,0);ell(ex,ey,es,es*1.25,INK,0);dot(-ex+es*.35,ey-es*.4,es*.35,'#fff');dot(ex+es*.35,ey-es*.4,es*.35,'#fff');}
  if(mood==='sad'||mood==='cry'){ln(-ex-es*1.4,ey-es*2.6,-ex+es,ey-es*3.3,LW*.8);ln(ex+es*1.4,ey-es*2.6,ex-es,ey-es*3.3,LW*.8);}
  // ほっぺ
  X.globalAlpha=.55;ell(-ex*1.45,ey+r*.3,r*.16,r*.1,'#ff8fb0',0);ell(ex*1.45,ey+r*.3,r*.16,r*.1,'#ff8fb0',0);X.globalAlpha=1;
  const my=cy+r*.45;
  if(mood==='happy'){blob([[-r*.25,my-r*.05],[r*.25,my-r*.05],[r*.18,my+r*.18],[0,my+r*.26],[-r*.18,my+r*.18]],'#ff5a6e',LW*.8);}

function bgmPlay(i){BGM.song=i;BGM.step=0;if(AC)BGM.next=AC.currentTime+.1;}
setInterval(()=>{
  if(!AC||BGM.song<0||SAVE.mute)return;const S=SONGS[BGM.song],sp=60/S.bpm/2;
  if(BGM.next<AC.currentTime-.3)BGM.next=AC.currentTime+.05;
  while(BGM.next<AC.currentTime+.15){
    const i=BGM.step,t=BGM.next,bar=(i>>3)&3,b=i&7;
    const m=S.mel[i%32];if(m)tone(S.lead,mf(m),t,sp*1.6,S.lv,BGG,null,S.vib);
    const bp=S.bp[b];if(bp>=0)tone('triangle',mf(S.roots[bar]+bp),t,sp*.9,.22,BGG);
    const d=S.dr[b];
    if(d==='k'){tone('sine',150,t,.16,.35,BGG,45);}
    else if(d==='s'){noise(t,.12,.22,1800,BGG,.8);}
    else if(d==='h'){noise(t,.04,.12,7000,BGG,1,'highpass');}
    else if(d==='t'){tone('sine',120,t,.3,.4,BGG,60);noise(t,.08,.15,300,BGG);}
    else if(d==='b'){tone('square',mf(96),t,.12,.05,BGG);tone('square',mf(103),t,.1,.04,BGG);}
    BGM.step=(i+1)%32;BGM.next+=sp;
  }
},30);

function evActive(id){return ents.some(e=>e.ev===id&&e.evT>0);}
function personPose(e){
  const P={dx:0,jy:0,sx:1,rot:0,aL:.18,aR:.18,legA:0,mood:'n',cover:false};
  if(e.trouble&&!e.trouble.solved)P.mood=e.trouble.cry?'cry':'sad';else if(e.trouble)P.mood='happy';
  if(e.walk&&e.pause<=0&&!(e.danceT>0)){P.legA=Math.sin(e.wph)*.45;P.aL=.18+Math.sin(e.wph)*.4;P.aR=.18-Math.sin(e.wph)*.4;}
  if(e.trouble&&!e.trouble.solved){if(e.id==='ken'){P.hL=[-6,-e.look.h*.42];P.hR=[8,-e.look.h*.45];}else{P.aL=.1;P.aR=.1;}}
  if(e.look.bench&&!e.trouble.solved){P.rot=0;}
  const dance=(e.danceT>0)||(e.happyDance)||(celebrate>0);
  if(dance){const w=e.t*6+e.seed;P.dx=Math.sin(w)*6;P.jy=-Math.abs(Math.sin(w))*8;P.aL=2.3+Math.sin(w)*.6;P.aR=2.3-Math.sin(w)*.6;P.mood='happy';P.legA=Math.sin(w)*.25;}
  if(e.ev==='peekaboo'&&e.evT>0){const c=(e.dur-e.evT)%1.5;if(c<.85){P.cover=true;P.hL=[-e.look.h*.1,-e.look.h*.74];P.hR=[e.look.h*.1,-e.look.h*.74];P.mood='n';}else{P.aL=2.2;P.aR=2.2;P.mood='happy';P.jy=-6;}}
  if(e.ev==='balloons'&&e.evT>0){P.noBal=e.evT<e.dur-.2;P.aR=2.6;P.mood='surp';}
  if(e.react>0){const k=e.react;switch(e.rtype){
    case 'jump':P.jy=-Math.abs(Math.sin(k*6))*30;P.aL=P.aR=2.5;P.mood='surp';break;
    case 'spin':P.sx=Math.cos(k*14);break;
    case 'sneeze':P.rot=-Math.sin(k*3)*.15;P.mood='surp';break;
    case 'surp':P.jy=-Math.max(0,Math.sin(k*4))*14;P.mood='surp';P.aL=P.aR=1.9;break;
    case 'shake':P.dx=Math.sin(k*40)*5;break;
    case 'joy':P.jy=-Math.abs(Math.sin(k*7))*26;P.aL=P.aR=2.6;P.mood='happy';break;
    case 'flop':P.rot=Math.sin(Math.min(1,(1.6-k)*3)*1.57)*-1.2*(k>.4?1:k/.4);P.mood='surp';break;}}
  return P;
}
function babyPose(e){const P={dx:0,jy:0,kick:1,mood:'n'};
  if(e.trouble&&!e.trouble.solved){P.mood='cry';if(Math.floor(e.t*1.2)%3===0)P.txt='えーん';}
  else if(e.trouble)P.mood='happy';
  if(e.evT>0){P.mood='happy';P.kick=2;P.txt=Math.floor(e.t*3)%2?'きゃっきゃ':'';P.jy=-Math.abs(Math.sin(e.t*8))*5;}
  if(e.react>0){if(e.rtype==='shake')P.dx=Math.sin(e.react*40)*4;else{P.jy=-Math.abs(Math.sin(e.react*8))*10;if(!e.trouble||e.trouble.solved)P.mood='happy';}}
  if(celebrate>0){P.mood='happy';P.kick=2;}
  return P;}

function update(dt){
  T+=dt;BOIL=Math.floor(T*7);K.t+=dt;
  naviUpdate(dt);
  if(mode!=='play')return;
  const dance=evActive('dance');
  for(const e of ents){
    e.t+=dt;if(e.react>0)e.react=Math.max(0,e.react-dt);
    if(e.evT>0){e.evT-=dt;if(e.evT<=0){e.evT=0;onEvEnd(e);}}
    if(e.k==='person'&&e.walk&&!e.trouble){e.danceT=dance?1:0;}
    if(e.walk&&e.evT<=0&&e.react<=0&&!(e.danceT>0)&&celebrate<=0){
      if(e.pause>0)e.pause-=dt;else{e.x+=e.dir*e.spd*dt;e.wph+=dt*e.spd*.12;if(e.x<e.walk[0]){e.x=e.walk[0];e.dir=1;}if(e.x>e.walk[1]){e.x=e.walk[1];e.dir=-1;}if(Math.random()<dt*.15)e.pause=1+Math.random()*2;}}
    if(e.k==='cat'&&e.state==='jump'){e.jk+=dt/1.1;e.x+= (e.jx-e.x)*Math.min(1,dt*3);e.y+=(e.jy2-e.y)*Math.min(1,dt*3);if(e.jk>=1){e.state='awake';e.x=e.jx;e.y=e.jy2;e.zs=null;}}
  }
  if(sel&&!ents.includes(sel))sel=null;
  // コロン
  const dx=K.tx-K.x,dy=K.ty-K.y,d=Math.hypot(dx,dy);
  if(d>1){const sp=Math.min(d*3.2,650);K.x+=dx/d*sp*dt;K.y+=dy/d*sp*dt;if(Math.abs(dx)>4)K.dir=dx>0?1:-1;}
  if(K.poke>0)K.poke-=dt;
  if(remoteFx>0){remoteFx-=dt;if(remoteFx<=0)$('led').classList.remove('on');}
  // カメラ
  let cx=K.x;if(rec)cx=rec.cx;else if(beam)cx=(K.x+beam.e.x)/2;
  if(!camFree){const tx=cx-VW/2;camX+=(tx-camX)*Math.min(1,dt*3.5);}
  camX=ST.W>VW?Math.max(0,Math.min(ST.W-VW,camX)):(ST.W-VW)/2;
  // ろくが
  if(rec){rec.t+=dt;if(rec.t>=2.1)finishRec();}
  if(beam){beam.t+=dt;if(beam.t>=1&&!beam.shown){beam.shown=1;beam.e.clip={tape:beam.tape,t:0};sfx('sparkle');}
    if(beam.e.clip)beam.e.clip.t+=dt;if(beam.t>=3.4){judge(beam.e,beam.tape);beam.e.clip=null;beam=null;}}
  // パーティクル
  for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||0)*dt;p.rot=(p.rot||0)+(p.vr||0)*dt;}
  parts=parts.filter(p=>p.life>0);
  if(celebrate>0){celebrate-=dt;if(Math.random()<dt*30)confetti(camX+Math.random()*VW,-10);
    if(stIdx===2&&Math.random()<dt*2.2)launchFW();
    if(celebrate<=0)stageClear();}
  for(const f of fireworks){f.t+=dt;}fireworks=fireworks.filter(f=>f.t<2.4);
  if(hintEnt&&sel)hintEnt=null;
}

  for(const f of fireworks){const k=f.t/2.4;if(k<.25){dot(f.x,WH-(WH-f.y)*(k/.25),4,'#fff');}else{const kk=(k-.25)/.75;X.globalAlpha=1-kk;for(let i=0;i<16;i++){const a=i/16*6.28;let px,py;if(f.heart){const tt=a;px=16*Math.pow(Math.sin(tt),3);py=-(13*Math.cos(tt)-5*Math.cos(2*tt)-2*Math.cos(3*tt)-Math.cos(4*tt));px*=kk*6;py*=kk*6;}else{px=Math.cos(a)*kk*120;py=Math.sin(a)*kk*120+kk*kk*30;}
      dot(f.x+px,f.y+py,5,f.c);dot(f.x+px*.6,f.y+py*.6,3,'#fff');}X.globalAlpha=1;}}
  const list=ents.slice().sort((a,b)=>(a.zs!=null?a.zs:a.y)-(b.zs!=null?b.zs:b.y));
  for(const e of list){SEED=e.seed;eKind(e).draw(e);}
  // パーティクル（ビデオに うつる もの）
  for(const p of parts){if(p.type==='bal'){SEED=5;ln(p.x,p.y+16,p.x+Math.sin(T*3)*4,p.y+40,1.4);ell(p.x,p.y,13,16,p.c);}}
  // しょんぼり フィルター（えがおが ふえると いろが もどる）
  const prog=troubleN?solvedN/troubleN:1;
  if(prog<1){X.setTransform(1,0,0,1,0,0);X.fillStyle=`rgba(90,90,120,${.32*(1-prog)})`;X.fillRect(0,0,cv.width,cv.height);wSet(1);}
  captureFrame();
  // ここから UI（ビデオに うつらない）
  for(const e of ents){if(e.trouble&&!e.trouble.solved)drawThought(e);}
  for(const p of parts){
    if(p.type==='tsun'){const k=1-p.life/.7;X.save();X.translate(p.x,p.y);X.scale(.6+k*.6,.6+k*.6);SEED=1;burst(0,0,34,COL.yel,9);txt('つん！',0,0,20,COL.red);X.restore();}
    else if(p.type==='text'){X.globalAlpha=Math.min(1,p.life*2);txt(p.s,p.x,p.y,p.size,p.c);X.globalAlpha=1;}
    else if(p.type==='heart'){X.globalAlpha=Math.min(1,p.life*1.5);heart(p.x,p.y,p.s);X.globalAlpha=1;}
    else if(p.type==='conf'){X.save();X.translate(p.x,p.y);X.rotate(p.rot);X.fillStyle=p.c;X.fillRect(-5,-3,10,6);X.restore();}}
  // せんたく マーク
  if(sel){const h=eKind(sel).hit(sel);const cx=h[0]+h[2]/2,cy=h[1]+h[3]+2;X.save();X.translate(cx,cy);X.scale(1,.3);X.setLineDash([12,10]);X.lineDashOffset=-T*40;X.beginPath();X.arc(0,0,Math.max(40,h[2]*.55),0,7);X.lineWidth=6;X.strokeStyle=COL.red;X.stroke();X.restore();X.setLineDash([]);
    const ay=h[1]-24+Math.sin(T*6)*5;SEED=2;poly([[cx-12,ay-14],[cx+12,ay-14],[cx,ay]],COL.red,LW*.8);}
  if(hintEnt&&!sel){const e=ents.find(x=>x.id===hintEnt);if(e){const ay=eTop(e)-36+Math.sin(T*6)*6;SEED=2;poly([[e.x-14,ay-18],[e.x+14,ay-18],[e.x,ay]],COL.pink,LW*.8);}}
  // リモコン ビーム（ボタンを おしたとき）
  if(remoteFx>0){X.save();X.setLineDash([6,8]);X.lineDashOffset=-T*80;X.beginPath();X.moveTo(camX+VW/2,WH+10);X.lineTo(K.x,K.y+20);X.lineWidth=4;X.strokeStyle='rgba(255,75,62,.8)';X.stroke();X.restore();X.setLineDash([]);}
  // こころビーム
  if(beam){const e=beam.e,ty=eTop(e)+20,k=Math.min(1,beam.t);for(let i=0;i<6;i++){const kk=Math.max(0,Math.min(1,k*1.3-i*.06));const bx=K.x+(e.x-K.x)*kk,by=K.y+(ty-K.y)*kk-Math.sin(kk*Math.PI)*60;heart(bx,by,14+i%2*6);}
    if(beam.t<1.2){X.globalAlpha=.5;X.beginPath();X.moveTo(K.x,K.y);X.quadraticCurveTo((K.x+e.x)/2,Math.min(K.y,ty)-80,e.x,ty);X.lineWidth=10;X.strokeStyle=COL.pink;X.stroke();X.globalAlpha=1;}}
  // コロン
  const tl=Math.max(-.3,Math.min(.3,(K.tx-K.x)*.002));const pk=K.poke>0?Math.sin((K.poke/.3)*Math.PI)*24:0;
  const lookT=sel||(beam&&beam.e);drawColon(K.x+pk*K.dir,K.y+Math.sin(T*3)*6,T,{tilt:tl,dir:1,look:lookT?Math.sign(lookT.x-K.x):K.dir,mood:(celebrate>0||(beam&&beam.t>2.9))?'happy':null});
  // ろくが UI
  if(rec){const w=290,h=218;const x0=rec.cx-w/2,y0=rec.cy-h/2;X.lineWidth=5;X.strokeStyle='#fff';const c=30;
    for(const[cx,cy,sx,sy]of[[x0,y0,1,1],[x0+w,y0,-1,1],[x0,y0+h,1,-1],[x0+w,y0+h,-1,-1]]){X.beginPath();X.moveTo(cx,cy+sy*c);X.lineTo(cx,cy);X.lineTo(cx+sx*c,cy);X.stroke();}
    if(Math.floor(T*3)%2){dot(x0+22,y0+24,9,'#ff2020');}txt('REC',x0+62,y0+24,18,'#fff');
    X.fillStyle='#fff';X.fillRect(x0+20,y0+h-22,(w-40)*Math.min(1,rec.t/2.1),8);}
  // ろくが ふうの すみ
  X.setTransform(DPR,0,0,DPR,0,0);
  if(rec){X.fillStyle='rgba(0,0,0,.18)';for(let y=0;y<CH;y+=4)X.fillRect(0,y,CW,1.5);}
}
function drawThought(e){
  const top=eTop(e);const bx=e.x+38,by=top-62+Math.sin(T*2+e.seed)*4;SEED=e.seed+50;
  if(e.clip){ // こころに うつす
    const w=170,h=128,x0=e.x-w/2,y0=top-h-40;
    ell(e.x,top-14,8,6,'#fff',LW*.8);ell(e.x+10,top-28,12,9,'#fff',LW*.8);
    blob([[x0-18,y0+h/2],[x0,y0-8],[x0+w/2,y0-22],[x0+w,y0-8],[x0+w+18,y0+h/2],[x0+w,y0+h+8],[x0+w/2,y0+h+22],[x0,y0+h+8]],'#fff');
    const fr=e.clip.tape.frames;const im=fr[Math.floor(e.clip.t/.13)%fr.length];
    X.save();X.beginPath();X.rect(x0+8,y0+6,w-16,h-12);X.clip();X.drawImage(im,x0+8,y0+6,w-16,h-12);X.restore();
    X.lineWidth=3;X.strokeStyle=COL.pink;X.strokeRect(x0+8,y0+6,w-16,h-12);
    for(let i=0;i<4;i++)heart(x0+Math.cos(T*2+i*1.57)*w*.55+w/2,y0+h/2+Math.sin(T*2+i*1.57)*h*.6,14);
    return;}
  ell(e.x+14,top-12,6,5,'#e8eaf2',LW*.8);ell(e.x+24,top-28,9,7,'#e8eaf2',LW*.8);
  blob([[bx-48,by+6],[bx-40,by-22],[bx-12,by-36],[bx+20,by-34],[bx+46,by-18],[bx+50,by+10],[bx+26,by+30],[bx-20,by+30]],'#e8eaf2');
  icon(e.trouble.need,bx,by-2,44);
  // あめ
  for(let i=0;i<3;i++){const k=(T*1.2+i/3)%1;ln(bx-26+i*24,by+32+k*24,bx-29+i*24,by+40+k*24,2,'#5ab8ff');}
}

// =====================================================================
//  がめん せんい

function show(id){for(const s of['title','select','loading','ending'])$(s).classList.toggle('show',s===id);}
function goTitle(){mode='title';show('title');closePicker();bgmPlay(0);ST=null;resizeTitle();}
function goSelect(){mode='select';show('select');closePicker();
  const el=$('select');el.innerHTML='<h2>STAGE SELECT</h2>';
  const cols=[COL.grn,COL.org,COL.pur];const em=['🌳','🏪','🎆'];
  STAGES.forEach((s,i)=>{const lock=i>SAVE.cleared;const z=s.ents.filter(e=>SAVE.z[i+':'+e.id]).length;
    const b=document.createElement('button');b.className='stc'+(lock?' lock':'');
    b.innerHTML=`<div class="no" style="background:${cols[i]}">${i+1}</div><div class="tx"><b>${em[i]} ${s.name}</b><small>${lock?'まえの ステージを クリアしてね':'ちょっかい ずかん '+z+' / '+ZTOTAL[i]}</small></div><div class="st">${lock?'🔒':i<SAVE.cleared?'⭐':'▶'}</div>`;
    b.addEventListener('click',()=>{audioInit();if(lock){sfx('nope');return;}sfx('start');loadStage(i);});el.appendChild(b);});
  const back=document.createElement('button');back.className='btn sub';back.style.width='min(92%,460px)';back.textContent='タイトルへ';back.onclick=()=>{sfx('tap');goTitle();};el.appendChild(back);
}
function loadStage(i){mode='loading';show('loading');BGM.song=-1;let n=0;const iv=setInterval(()=>{n++;$('ldots').textContent='.'.repeat(n%4);if(n>=9){clearInterval(iv);show(null);startStage(i);}},150);}
function stageClear(){
  mode='clear';const first=stIdx>=SAVE.cleared;if(first)SAVE.cleared=Math.max(SAVE.cleared,stIdx+1);save();
  if(stIdx===2){setTimeout(goEnding,300);return;}
  const z=ST.ents.filter(e=>SAVE.z[stIdx+':'+e.id]).length;

    <div>ちょっかい ずかん <b>${z} / ${ZTOTAL[stIdx]}</b></div><div style="font-size:13px;color:#666">いろんな ものに つんつん すると ふえるよ</div>
    <div style="margin:8px 0;font-size:13px;color:#2f6bff">💾 メモリーカードに セーブしました</div>
    <button class="btn pink" id="bNext">つぎの ステージへ ▶</button><button class="btn sub" id="bAgain">もういちど あそぶ</button><button class="btn sub" id="bSel">ステージ セレクト</button></div>`;
  ov.classList.add('show');
  $('bNext').onclick=()=>{sfx('start');closePicker();loadStage(stIdx+1);};$('bAgain').onclick=()=>{sfx('tap');closePicker();loadStage(stIdx);};$('bSel').onclick=()=>{sfx('tap');goSelect();};
  say('ステージ クリア！ つぎの まちへ いこう！','happy');
}
// ---------------- エンディング ----------------
let ecx=null,endFW=[];
function goEnding(){
  mode='ending';closePicker();show('ending');bgmPlay(2);
  $('credits').innerHTML=`<h3>おしまい</h3>まちの みんなが えがおに なったよ！<br><br><h3>とうじょう じんぶつ</h3>コロン<br>ふーたん<br>あかちゃんの リッキー<br>おじいちゃん・おばあちゃん<br>みいちゃん・けんくん・たっくん<br>いぬの ポチ・ねこの タマ<br>おつきさま<br><br><h3>ちょっかい ずかん</h3>${Object.keys(SAVE.z).length} / ${ZTOTAL.reduce((a,b)=>a+b,0)}<br><br><h3>THANK YOU<br>FOR PLAYING!</h3>あそんでくれて ありがとう！`;
  const c=$('credits');c.style.animation='none';void c.offsetWidth;c.style.animation='';
  $('endBtn').style.display='none';setTimeout(()=>{if(mode==='ending')$('endBtn').style.display='block';},6000);
  speak('おしまい。まちの みんなが えがおに なったよ。あそんでくれて ありがとう！');

$('endBtn').onclick=()=>{sfx('tap');goTitle();};
function renderEnding(dt){
  const c=$('ecv');const r=c.getBoundingClientRect();if(c.width!==Math.round(r.width*DPR)){c.width=Math.round(r.width*DPR);c.height=Math.round(r.height*DPR);}
  const g=c.getContext('2d');X=g;g.setTransform(1,0,0,1,0,0);g.fillStyle='rgba(36,31,92,.35)';g.fillRect(0,0,c.width,c.height);
  if(Math.random()<dt*2.5){endFW.push({x:Math.random()*r.width,y:r.height*(.1+Math.random()*.4),t:0,c:WALK_COLS[Math.floor(Math.random()*7)]});if(Math.random()<.5)sfx('firework');}
  g.setTransform(DPR,0,0,DPR,0,0);
  for(const f of endFW){f.t+=dt;const k=f.t/2;X.globalAlpha=Math.max(0,1-k);for(let i=0;i<20;i++){const a=i/20*6.28;dot(f.x+Math.cos(a)*k*110,f.y+Math.sin(a)*k*110+k*k*30,4,f.c);}X.globalAlpha=1;}
  endFW=endFW.filter(f=>f.t<2);
  const s=Math.min(r.width,r.height*1.4)/620;g.setTransform(DPR*s,0,0,DPR*s,0,0);const H=r.height/s;
  const fu={look:LK.futanY,x:r.width/s*.3,y:H-30,t:T,seed:1,dir:1};drawPerson(fu,{dx:Math.sin(T*6)*6,jy:-Math.abs(Math.sin(T*6))*10,sx:1,aL:2.3+Math.sin(T*6)*.5,aR:2.3-Math.sin(T*6)*.5,legA:0,mood:'happy'});
  drawBaby({x:r.width/s*.55,y:H-30,t:T,dir:1,stroller:'goza'},{dx:0,jy:0,kick:2,mood:'happy'});
  drawColon(r.width/s*.75,H-120+Math.sin(T*3)*12,T,{mood:'happy'});
}

const tcv=$('tcv');let tg=null;
function resizeTitle(){const r=tcv.getBoundingClientRect();tcv.width=Math.max(1,Math.round(r.width*DPR));tcv.height=Math.max(1,Math.round(r.height*DPR));tg=tcv.getContext('2d');}

  tg.fillStyle='#ff7eb6';tg.fillRect(0,0,w,h);
  tg.save();tg.translate(w/2,h*.62);tg.rotate(T*.15);tg.fillStyle='#ff9ac8';for(let i=0;i<12;i++){tg.rotate(Math.PI/6);tg.beginPath();tg.moveTo(0,0);tg.lineTo(w*2,-w*.28);tg.lineTo(w*2,w*.28);tg.fill();}tg.restore();
  tg.fillStyle='#ffffff55';for(let i=0;i<30;i++){tg.beginPath();tg.arc((i*97+T*20)%(w+40)-20,(i*61)%h,6,0,7);tg.fill();}
  const land=w>h*1.1;const s=land?h/560:Math.min(w/420,h/640)*1.15;tg.setTransform(DPR*s,0,0,DPR*s,DPR*(land?w*.17:w/2),DPR*(land?h*.86:h*.78));
  SEED=4;ell(0,30,230,38,'#3ccf6e');
  const fu={look:LK.futan,x:-80,y:20,t:T,seed:1,dir:1};const w6=T*5;
  drawPerson(fu,{dx:0,jy:-Math.abs(Math.sin(w6))*8,sx:1,aL:.3,aR:2.5+Math.sin(w6)*.4,legA:0,mood:'happy'});

  // リモコン ビーム
  tg.save();tg.setLineDash([8,10]);tg.lineDashOffset=-T*60;tg.beginPath();tg.moveTo(-46,-80);tg.lineTo(kx,ky+20);tg.lineWidth=4;tg.strokeStyle=COL.red;tg.stroke();tg.restore();
  SEED=2;box(-58,-90,16,26,'#3a3850');dot(-50,-92,4,COL.red);
}

  const x=Math.sin(T*2)*60;g.save();g.translate(x,0);g.rotate(T*Math.cos(T*2)*2);drawColon(0,0,T,{});g.restore();SEED=1;ln(-100,34,100,34,3,'#fff');}

$('bVoice').onclick=()=>{audioInit();SAVE.voice=!SAVE.voice;save();updVoiceBtn();if(SAVE.voice)speak(naviTxt.textContent);else if(window.speechSynthesis)speechSynthesis.cancel();};

//  メインループ
// =====================================================================
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  try{
    update(dt);
    if(mode==='title')renderTitle();
    else if(mode==='loading')renderLoading();
    else if(mode==='ending')renderEnding(dt);
    if(ST&&(mode==='play'||mode==='clear'))render();
    drawNaviFace(T);
  }catch(err){console.error(err);}
  requestAnimationFrame(frame);
}
resize();resizeTitle();naviTxt.textContent='タッチで はじめてね！';
requestAnimationFrame(frame);
