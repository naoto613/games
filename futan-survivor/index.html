<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ff7ab8">
<title>キュアふーたん サバイバー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#2a1838;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif}
canvas{position:fixed;inset:0;display:block;touch-action:none}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box;z-index:10;color:#5b2c47;text-align:center;overflow-y:auto}
.ov.show{display:flex}
.dim{background:rgba(50,10,60,.55)}
.panel{background:rgba(255,255,255,.96);border:4px solid #ff8cc6;border-radius:26px;padding:18px 16px;max-width:520px;width:100%;box-sizing:border-box;box-shadow:0 8px 0 #e0579a}
h2{margin:0 0 6px;font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif;font-weight:400;font-size:28px;color:#ff4f9a;text-shadow:0 2px 0 #fff}
p{margin:6px 0;font-weight:800;font-size:17px;line-height:1.5}
.btn{appearance:none;border:0;border-radius:999px;background:linear-gradient(#ff9ccf,#ff5fa8);color:#fff;font:inherit;font-weight:900;font-size:22px;padding:14px 30px;box-shadow:0 5px 0 #c8387c;cursor:pointer;text-shadow:0 2px 0 rgba(160,30,90,.5);min-width:200px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c8387c}
.btn.sub{background:linear-gradient(#c3b2ff,#8f74f0);box-shadow:0 5px 0 #6147c0;font-size:17px;padding:10px 20px;min-width:0}
.btn.sub:active{box-shadow:0 2px 0 #6147c0}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#title{justify-content:space-between}
.logo{margin-top:6px;font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif;color:#fff;line-height:1.05;text-shadow:0 3px 0 #ff4f9a,3px 0 0 #ff4f9a,-3px 0 0 #ff4f9a,0 -3px 0 #ff4f9a,2px 2px 0 #ff4f9a,-2px 2px 0 #ff4f9a,2px -2px 0 #ff4f9a,-2px -2px 0 #ff4f9a,0 8px 0 rgba(120,20,80,.35)}
.logo .a{font-size:clamp(18px,5.5vw,28px);color:#fff6a8}
.logo .b{font-size:clamp(30px,11vw,72px);white-space:nowrap}
.logo .c{font-size:clamp(28px,9vw,50px);color:#bff4ff}
.stages{display:grid;gap:10px;width:100%;max-width:520px}
.st{display:flex;align-items:center;gap:12px;border:0;border-radius:20px;padding:12px 14px;font:inherit;text-align:left;color:#5b2c47;background:#fff;box-shadow:0 5px 0 #e0579a;border:3px solid #ff8cc6;cursor:pointer}
.st:active{transform:translateY(3px);box-shadow:0 2px 0 #e0579a}
.st .em{font-size:38px;width:50px;text-align:center}
.st b{display:block;font-size:20px}
.st small{font-weight:800;color:#9a6a8a;font-size:13px}
.st.lock{filter:grayscale(1);opacity:.55;pointer-events:none}
.st .ok{margin-left:auto;font-size:24px}
.cards{display:flex;flex-direction:column;gap:12px;width:100%;max-width:560px}
@media (min-aspect-ratio:5/4) and (min-width:720px){.cards{flex-direction:row;max-width:900px}.card{flex:1;flex-direction:column;text-align:center}}
.card{display:flex;align-items:center;gap:12px;border-radius:22px;padding:12px 14px;background:#fff;border:4px solid #ffc2e0;box-shadow:0 6px 0 #e0579a;font:inherit;color:#5b2c47;text-align:left;cursor:pointer;animation:pop .35s ease-out both}
.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}
.card:active{transform:translateY(3px);box-shadow:0 3px 0 #e0579a}
.card.off{pointer-events:none}
.card .ic{font-size:44px;width:62px;height:62px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:radial-gradient(#fff 40%,#ffe0f0);flex:none}
.card b{font-size:20px;display:block}
.card .bd{display:inline-block;font-size:13px;font-weight:900;color:#fff;background:#ff5fa8;border-radius:99px;padding:1px 10px;margin:2px 0}
.card .bd.new{background:#39c07a}
.card .ds{font-size:15px;font-weight:800;color:#8a5a7a}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.lvt{font-family:"Mochiy Pop One",sans-serif;font-size:34px;color:#fff;text-shadow:0 3px 0 #ff4f9a,2px 2px 0 #ff4f9a,-2px 2px 0 #ff4f9a,2px -2px 0 #ff4f9a,-2px -2px 0 #ff4f9a}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;display:none}
#hud.show{display:block}
#pauseBtn{position:absolute;right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:#ff7ab8;color:#fff;font-size:20px;font-weight:900;pointer-events:auto;box-shadow:0 3px 0 #c8387c}
#hisBtn{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(18px,calc(env(safe-area-inset-bottom) + 8px));width:96px;height:96px;border-radius:50%;border:0;padding:6px;pointer-events:auto;background:conic-gradient(#ff5fa8 0%,#ddd 0%);box-shadow:0 4px 0 rgba(120,20,80,.45)}
#hisBtn span{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;background:#fff;color:#c05090;font:900 15px/1.1 "M PLUS Rounded 1c",sans-serif}
#hisBtn span i{font-style:normal;font-size:30px}
#hisBtn.full{animation:glow .6s ease-in-out infinite alternate;background:conic-gradient(#ffd84a,#ff5fa8,#b98cff,#5ad0ff,#ffd84a)}
#hisBtn.full span{background:linear-gradient(#fff6fb,#ffd6ec);color:#ff3d8a}
@keyframes glow{from{transform:scale(1)}to{transform:scale(1.1)}}
#story{justify-content:flex-end}
.stars{font-size:44px;letter-spacing:6px}
.tog{font-size:15px}
</style>
</head>
<body>
<canvas id="c" aria-label="キュアふーたん サバイバー ゲーム画面"></canvas>

<div id="hud"><button id="pauseBtn" aria-label="ポーズ">Ⅱ</button><button id="hisBtn" aria-label="ひっさつわざ"><span><i>💖</i>ひっさつ</span></button></div>

<div id="title" class="ov show">
  <div class="logo"><div class="a">ひかりの せんし</div><div class="b">キュアふーたん</div><div class="c">サバイバー</div></div>
  <div style="display:flex;flex-direction:column;gap:12px;align-items:center">
    <button class="btn" id="startBtn">あそぶ！</button>
    <div class="row"><button class="btn sub tog" id="easyBtn"></button><button class="btn sub tog" id="muteBtn"></button></div>
  </div>
</div>

<div id="select" class="ov dim">
  <h2 style="color:#fff;text-shadow:0 3px 0 #ff4f9a">ステージを えらんでね</h2>
  <div class="stages" id="stageList"></div>
  <button class="btn sub" id="backTitle">もどる</button>
</div>

<div id="lvup" class="ov dim">
  <div class="lvt" id="lvTitle">レベルアップ！</div>
  <p style="color:#fff;margin:0" id="lvSub">ひとつ えらんでね</p>
  <div class="cards" id="cards"></div>
</div>

<div id="pause" class="ov dim">
  <div class="panel"><h2>ひとやすみ</h2><p>つかれたら おやすみしてね</p>
  <div style="display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:10px">
    <button class="btn" id="resumeBtn">つづける</button>
    <button class="btn sub" id="quitBtn">ステージを えらぶ</button>
  </div></div>
</div>

<div id="story" class="ov">
  <div class="panel"><p id="storyText"></p><button class="btn" id="storyBtn" style="margin-top:8px">うん！</button></div>
</div>

<div id="over" class="ov dim">
  <div class="panel"><h2>あとちょっと！</h2><p>やみの ちからに まけちゃった…<br>でも ふーたんは なんどでも たちあがる！</p>
  <div style="display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:10px">
    <button class="btn" id="retryBtn">もういちど！</button>
    <button class="btn sub" id="overSel">ステージを えらぶ</button>
  </div></div>
</div>

<div id="clear" class="ov dim">
  <div class="panel"><div class="stars">⭐⭐⭐</div><h2 id="clearTitle">ステージクリア！</h2><p id="clearText"></p>
  <div style="display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:10px">
    <button class="btn" id="nextBtn">つぎの ステージへ</button>
    <button class="btn sub" id="clearSel">ステージを えらぶ</button>
  </div></div>
</div>

<script>
'use strict';
// ================= basics =================
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
const TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0],clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const FONT='"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif';
const Q=new URLSearchParams(location.search),BOT=Q.has('bot'),SPEED=Math.max(1,+Q.get('speed')||1);
let W=0,H=0,DPR=1,Z=1,CLK=0;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR|0;cv.height=H*DPR|0;cv.style.width=W+'px';cv.style.height=H+'px';Z=clamp(Math.min(W,H)/430,.75,1.45);}
addEventListener('resize',resize);resize();
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
const SAVE={cleared:0,easy:false,mute:false};
try{Object.assign(SAVE,JSON.parse(localStorage.getItem('cureFutanSurv')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('cureFutanSurv',JSON.stringify(SAVE))}catch(e){}}

// ================= draw helpers =================
function ell(c,x,y,rx,ry){c.beginPath();c.ellipse(x,y,rx,ry,0,0,TAU);c.fill();}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,TAU);c.fill();}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function starP(c,x,y,R,r,n=5,rot=-Math.PI/2){c.beginPath();for(let i=0;i<n*2;i++){const a=rot+i*Math.PI/n,d=i%2?r:R;c.lineTo(x+Math.cos(a)*d,y+Math.sin(a)*d);}c.closePath();}
function heartP(c,x,y,s){c.beginPath();c.moveTo(x,y+s*.95);c.bezierCurveTo(x-s*1.5,y-s*.05,x-s*.8,y-s*1.25,x,y-s*.45);c.bezierCurveTo(x+s*.8,y-s*1.25,x+s*1.5,y-s*.05,x,y+s*.95);c.closePath();}
function flowerP(c,x,y,r,col,mid){c.fillStyle=col;for(let i=0;i<5;i++){const a=i/5*TAU;circ(c,x+Math.cos(a)*r*.62,y+Math.sin(a)*r*.62,r*.5);}c.fillStyle=mid||'#ffe066';circ(c,x,y,r*.38);}
function otext(c,s,x,y,size,fill='#fff',stroke='#ff4f9a',align='center',font){c.font=`900 ${size}px ${font||FONT}`;c.textAlign=align;c.textBaseline='middle';c.lineJoin='round';c.lineWidth=Math.max(3,size*.24);c.strokeStyle=stroke;c.strokeText(s,x,y);c.fillStyle=fill;c.fillText(s,x,y);}
function hexA(h,a){const n=parseInt(h.slice(1),16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
const glowCache={};
function glow(col){if(glowCache[col])return glowCache[col];const g=document.createElement('canvas');g.width=g.height=64;const c=g.getContext('2d');const gr=c.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,hexA(col,1));gr.addColorStop(.35,hexA(col,.5));gr.addColorStop(1,hexA(col,0));c.fillStyle=gr;c.fillRect(0,0,64,64);return glowCache[col]=g;}
function drawGlow(c,col,x,y,r,a=1){c.globalAlpha=a;c.drawImage(glow(col),x-r,y-r,r*2,r*2);c.globalAlpha=1;}
function bow(c,x,y,col,s=1){c.fillStyle=col;for(const k of[-1,1]){c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+k*8*s,y-7*s,x+k*8*s,y);c.quadraticCurveTo(x+k*8*s,y+6*s,x,y);c.fill();c.stroke();c.beginPath();c.moveTo(x,y);c.lineTo(x+k*4*s,y+7*s);c.lineTo(x+k*1.5*s,y+7.5*s);c.closePath();c.fill();c.stroke();}c.fillStyle='#ffd84a';heartP(c,x,y+.3*s,2.4*s);c.fill();c.stroke();}

// ================= characters =================
const HAIR='#2b1d22',SKIN='#ffe4d4',LN='#5b2c47';
// ふーたん (cure:true でキュアふーたん)
function drawFutan(c,x,y,o){
  const t=o.t||0,cure=o.cure!==false,pose=o.pose||'run',mv=o.moving;
  c.save();c.translate(x,y);c.scale(o.s||1,o.s||1);
  if(!o.noShadow){c.fillStyle='rgba(40,0,40,.18)';ell(c,0,0,14,4.5);}
  const bob=pose==='win'?Math.abs(Math.sin(t*6))*3:mv?Math.abs(Math.sin(t*13))*2.2:Math.sin(t*3)*.8;
  c.translate(0,-bob-(o.lift||0));if(o.dir<0)c.scale(-1,1);if(o.spin!=null)c.scale(Math.cos(o.spin),1);
  c.lineJoin='round';c.lineCap='round';c.strokeStyle=LN;c.lineWidth=1.5;
  const HY=-41,sw=mv?Math.sin(t*13):0;
  if(cure){for(const k of[-1,1]){const w=Math.sin(t*6+k)*3;c.fillStyle=k<0?'#ff5fa8':'#ff8cc6';c.beginPath();c.moveTo(k*3,-20);c.bezierCurveTo(k*10,-16,k*14+w,-10,k*18+w,-2);c.lineTo(k*12+w,-3);c.bezierCurveTo(k*9,-9,k*6,-14,k*1,-18);c.closePath();c.fill();c.stroke();}}
  // うしろ髪（ボブ）
  c.fillStyle=HAIR;c.beginPath();c.moveTo(-16.5,HY);c.bezierCurveTo(-18,HY-23,18,HY-23,16.5,HY);c.quadraticCurveTo(18.5,HY+11,15.5,HY+16);c.quadraticCurveTo(0,HY+19,-15.5,HY+16);c.quadraticCurveTo(-18.5,HY+11,-16.5,HY);c.closePath();c.fill();c.stroke();
  // あし
  for(const k of[-1,1]){const lf=Math.max(0,k*sw)*3,lx=k*4-2.5;c.fillStyle=SKIN;rr(c,lx,-11-lf,5,8,2);c.fill();c.stroke();
    if(cure){c.fillStyle='#fff';rr(c,lx-1,-6.5-lf,7,7,2.5);c.fill();c.stroke();c.fillStyle='#ff6fae';c.fillRect(lx-.6,-6-lf,6.2,1.8);}
    else{c.fillStyle='#ff9ac4';rr(c,lx-1,-4-lf,7,4.5,2);c.fill();c.stroke();}}
  // スカート
  if(cure){c.fillStyle='#fff';for(let i=0;i<7;i++)circ(c,-13.5+i*4.5,-8.4,2.9);
    const g=c.createLinearGradient(0,-23,0,-8);g.addColorStop(0,'#ffb0d8');g.addColorStop(1,'#ff5fa8');c.fillStyle=g;
    c.beginPath();c.moveTo(-7,-23);c.lineTo(7,-23);c.quadraticCurveTo(12,-16,15,-10);for(let i=0;i<5;i++){const x0=15-i*6;c.quadraticCurveTo(x0-3,-6.8,x0-6,-10);}c.quadraticCurveTo(-12,-16,-7,-23);c.closePath();c.fill();c.stroke();
    c.fillStyle='rgba(255,255,255,.85)';heartP(c,-7,-14,1.7);c.fill();heartP(c,7,-14,1.7);c.fill();heartP(c,0,-12,1.7);c.fill();}
  else{c.fillStyle='#7ea6d8';c.beginPath();c.moveTo(-7,-19);c.lineTo(7,-19);c.lineTo(10,-9);c.lineTo(-10,-9);c.closePath();c.fill();c.stroke();}
  // からだ
  if(cure){c.fillStyle='#fff';rr(c,-7.5,-29.5,15,9.5,4);c.fill();c.stroke();c.fillStyle='#ff8cc6';c.fillRect(-7,-22,14,2.2);}
  else{c.fillStyle='#fff';rr(c,-8.5,-29.5,17,12.5,4);c.fill();c.stroke();const cols=['#5ac8f0','#ff7ab0','#ffd84a','#3fae5a','#e84a4a','#3a5ac8'];for(let i=0;i<6;i++){c.fillStyle=cols[i];circ(c,-5+(i%3)*5,-26+(i/3|0)*4.5,1.7);}}
  const arm=(k,hx,hy)=>{const sx=k*7,sy=-27;c.strokeStyle=LN;c.lineWidth=5;c.beginPath();c.moveTo(sx,sy);c.lineTo(hx,hy);c.stroke();c.strokeStyle=SKIN;c.lineWidth=3;c.stroke();c.lineWidth=1.5;c.strokeStyle=LN;c.fillStyle=cure?'#fff':SKIN;circ(c,hx,hy,2.7);c.stroke();
    c.fillStyle=cure?'#ff8cc6':'#fff';circ(c,sx,sy+.5,cure?4.2:3.6);c.stroke();};
  const arms=()=>{if(pose==='win'){arm(-1,-21,HY-12+Math.sin(t*8)*1.5);arm(1,21,HY-12-Math.sin(t*8)*1.5);}
    else if(pose==='cast'){arm(-1,-10,-18);arm(1,17,-30);}
    else{arm(-1,-10,-17+sw*2.5);arm(1,10,-17-sw*2.5);}};
  arms();
  if(cure)bow(c,0,-26.5,'#ff4f9a',.9);
  // あたま
  c.fillStyle=SKIN;c.beginPath();c.ellipse(0,HY+2,14.5,13.5,0,0,TAU);c.fill();c.stroke();
  const blink=((t+.7)%3.6)<.13,lk=(o.look||0)*1.2;
  for(const k of[-1,1]){const ex=k*5.6+lk,ey=HY+5;
    if(blink||o.happy){c.lineWidth=1.9;c.beginPath();c.arc(ex,ey+1.5,3,Math.PI*1.1,Math.PI*1.9);c.stroke();c.lineWidth=1.5;}
    else if(o.ouch){c.lineWidth=1.8;c.beginPath();c.moveTo(ex-2.5*k,ey-2);c.lineTo(ex+2*k,ey);c.lineTo(ex-2.5*k,ey+2);c.stroke();c.lineWidth=1.5;}
    else{c.fillStyle='#3a1f2e';ell(c,ex,ey,3.2,4.1);const g=c.createLinearGradient(0,ey-1,0,ey+4);g.addColorStop(0,'#3a1f2e');g.addColorStop(1,cure?'#ee5aa6':'#8a5a3a');c.fillStyle=g;ell(c,ex,ey+1.1,2.4,2.8);
      c.fillStyle='#fff';ell(c,ex-1,ey-1.5,1.3,1.6);circ(c,ex+1.2,ey+2,.7);
      c.lineWidth=2;c.beginPath();c.ellipse(ex,ey,3.4,4.3,0,Math.PI*1.15,Math.PI*1.85);c.stroke();c.beginPath();c.moveTo(ex+k*3,ey-2.4);c.lineTo(ex+k*4.6,ey-3.6);c.stroke();c.lineWidth=1.5;}}
  c.fillStyle='rgba(255,110,150,.35)';ell(c,-9.2,HY+10,3,1.8);ell(c,9.2,HY+10,3,1.8);
  if(o.ouch){c.fillStyle='#e0506a';ell(c,0,HY+11.5,1.8,2.2);}
  else{c.fillStyle='#e0506a';c.beginPath();c.moveTo(-3,HY+10);c.quadraticCurveTo(0,HY+14.5,3,HY+10);c.closePath();c.fill();c.stroke();c.fillStyle='#fff';c.fillRect(-2,HY+10.2,4,.9);}
  // まえがみ
  c.fillStyle=HAIR;c.beginPath();c.moveTo(-15.5,HY+11);c.quadraticCurveTo(-17.5,HY-6,-10,HY-11);c.quadraticCurveTo(0,HY-15,10,HY-11);c.quadraticCurveTo(17.5,HY-6,15.5,HY+11);c.lineTo(13,HY+4);c.lineTo(11.5,HY+.5);
  [9,6,3,0,-3,-6,-9].forEach((bx,i)=>c.lineTo(bx,HY+(i%2?-.8:1)));c.lineTo(-11.5,HY+.5);c.lineTo(-13,HY+4);c.closePath();c.fill();c.stroke();
  // ぼうし
  const capC=cure?'#ff7ab8':'#c98aa6',capD=cure?'#e0508e':'#a86a86';
  c.fillStyle=capC;c.beginPath();c.moveTo(-15.8,HY-6);c.bezierCurveTo(-16.5,HY-25,16.5,HY-25,15.8,HY-6);c.closePath();c.fill();c.stroke();

    else{c.fillStyle='#9edb96';for(const a of[-1,0,1]){c.beginPath();c.moveTo(x+a*4,y);c.quadraticCurveTo(x+a*6,y-7,x+a*7,y-11);c.lineTo(x+a*4+1.5,y);c.fill();}}}
  else if(th===1){if(v<.3){c.save();c.translate(x,y);c.rotate(v*9);c.fillStyle=['#ff8cc6','#7fd8ff','#ffe066','#9fe0a0'][k%4];rr(c,-7,-5,14,10,4);c.fill();c.stroke();c.beginPath();c.moveTo(-7,0);c.lineTo(-13,-5);c.lineTo(-13,5);c.closePath();c.fill();c.stroke();c.beginPath();c.moveTo(7,0);c.lineTo(13,-5);c.lineTo(13,5);c.closePath();c.fill();c.stroke();c.restore();}
    else if(v<.55){c.strokeStyle='#e8d0b0';c.lineWidth=2.5;c.beginPath();c.moveTo(x,y);c.lineTo(x,y+16);c.stroke();c.fillStyle='#fff';circ(c,x,y,8);for(let i=0;i<3;i++){c.strokeStyle=['#ff5fa8','#7fd8ff','#ffd84a'][i];c.lineWidth=2;c.beginPath();c.arc(x,y,2+i*2,i,i+3.5);c.stroke();}}
    else{for(let i=0;i<5;i++){c.fillStyle=['#ff5fa8','#7fd8ff','#ffd84a','#9fe0a0','#b99cff'][(k+i)%5];c.save();c.translate(x+Math.cos(i*2.1)*12,y+Math.sin(i*2.7)*10);c.rotate(i);c.fillRect(-3,-1,6,2);c.restore();}}}
  else if(th===2){if(v<.5){const tw=.6+.4*Math.sin(t*3+k);c.globalAlpha=tw;c.fillStyle=k%3?'#fff':'#ffe88a';starP(c,x,y,6,2.4,4);c.fill();c.globalAlpha=1;}
    else if(v<.8){c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=1.5;c.beginPath();c.arc(x,y+Math.sin(t+k)*3,5+k%5,0,TAU);c.stroke();c.fillStyle='rgba(255,255,255,.5)';circ(c,x-2,y-2+Math.sin(t+k)*3,1.5);}
    else{c.fillStyle='#ffc2dc';c.beginPath();c.moveTo(x,y+6);for(let i=0;i<=5;i++){const a=Math.PI+i/5*Math.PI;c.lineTo(x+Math.cos(a)*9,y+Math.sin(a)*9);}c.closePath();c.fill();c.stroke();}}
  else{if(v<.35){c.fillStyle=['#ff9ad0','#b99cff','#7fe3ff'][k%3];c.beginPath();c.moveTo(x,y-16);c.lineTo(x+6,y-4);c.lineTo(x,y+2);c.lineTo(x-6,y-4);c.closePath();c.fill();c.stroke();c.fillStyle='rgba(255,255,255,.5)';c.beginPath();c.moveTo(x,y-14);c.lineTo(x+2,y-5);c.lineTo(x,y-2);c.closePath();c.fill();}
    else if(v<.6){c.strokeStyle='rgba(120,80,160,.35)';c.lineWidth=2;c.strokeRect(x-12,y-12,24,24);}
    else{c.fillStyle='#fff6d0';rr(c,x-3,y-8,6,10,1.5);c.fill();c.fillStyle='rgba(255,200,80,'+(.7+.3*Math.sin(t*9+k))+')';ell(c,x,y-12,2.5,4);}}}

let AC=null,MG=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.55;MG.connect(AC.destination);}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,d,type='sine',v=.15,f2=0,when=0){if(!AC||SAVE.mute)return;const t0=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.01);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(MG);o.start(t0);o.stop(t0+d+.03);}
const lastS={};function thr(k,ms){const n=performance.now();if(lastS[k]&&n-lastS[k]<ms)return false;lastS[k]=n;return true;}
let gemCombo=0,gemComboT=0;
const SFX={
  shot(){if(thr('shot',110))tone(1500,.05,'triangle',.025,2200);},
  pop(){if(thr('pop',40))tone(700+Math.random()*400,.08,'sine',.07,1600);},
  gem(){gemComboT=.9;if(thr('gem',38)){const n=[0,2,4,7,9,12,14,16,19,21,24][Math.min(10,gemCombo++)];tone(880*Math.pow(2,n/12),.07,'sine',.045);}},
  level(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.2,'triangle',.13,0,i*.07));},

  warn(){for(let i=0;i<3;i++)tone(440,.2,'square',.06,330,i*.3);},

function bgmTick(){if(!AC||SAVE.mute||!BGM.on)return;const m=BGM.mode,spb=60/(m?150:128)/2;if(BGM.next<AC.currentTime)BGM.next=AC.currentTime+.05;
  while(BGM.next<AC.currentTime+.25){const s=BGM.step%32,ch=PROG[m][(s/8|0)%4],base=261.63,when=BGM.next-AC.currentTime,fq=n=>base*Math.pow(2,n/12);
    if(s%4===0)tone(fq(ch[0]-24),spb*1.8,'triangle',.07,0,when);
    tone(fq(ch[s%3]),spb*.9,'sine',.025,0,when);
    const n=MEL[m][s];if(n!=null)tone(fq(n),spb*1.6,'square',.022,0,when);

function spawnMinion(type,a,dist){const P=G.P,sc=G.st.hpMul*(1+G.t/100);

function ebullet(x,y,a,spd,dmg=7,r=9){G.ebul.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r,dmg,life:7});}
function doPattern(e,p,ax,ay){const base=Math.atan2(ay,ax);
  switch(p){
    case'ring':{const n=e.kind==='mid'?10:10+Math.round(G.si*1.4),o=rnd(0,TAU);for(let i=0;i<n;i++)ebullet(e.x,e.y-20,o+i/n*TAU,e.kind==='mid'?100:110);break;}
    case'charge':e.state='wind';e.wt=1.05;e.dang=base;break;
    case'aim3':for(let i=-1;i<=1;i++)ebullet(e.x,e.y-20,base+i*.28,135);break;
    case'summon':for(let i=0;i<6&&G.enemies.length<190;i++){const a=i/6*TAU,m=spawnMinion(i%2?'fast':'walk',0,0);m.x=e.x+Math.cos(a)*60;m.y=e.y+Math.sin(a)*60;}break;
    case'spiral':e.spiral=2.4;e.spT=0;e.spA=base;break;
  }}
function bossAI(e,dt){const P=G.P,dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1;
  if(e.state==='wind'){e.wt-=dt;if(e.wt<=0){e.state='dash';e.dT=.55;e.dvx=Math.cos(e.dang)*430;e.dvy=Math.sin(e.dang)*430;}return;}
  if(e.state==='dash'){e.x+=e.dvx*dt;e.y+=e.dvy*dt;e.dT-=dt;if(e.dT<=0)e.state=null;return;}
  const want=e.kind==='boss'?130:0;if(d>want){e.x+=dx/d*e.spd*dt;e.y+=dy/d*e.spd*dt;}
  if(d>spawnR()*1.3){e.x=P.x-dx/d*spawnR()*.9;e.y=P.y-dy/d*spawnR()*.9;}
  e.face=dx<0?-1:1;
  e.atkT-=dt;if(e.atkT<=0&&d<spawnR()){doPattern(e,e.pats[e.pat++%e.pats.length],dx/d,dy/d);e.atkT=e.kind==='mid'?3.3:2.7;}
  if(e.spiral>0){e.spiral-=dt;e.spT-=dt;if(e.spT<=0){e.spT=.14;e.spA+=.42;for(let k=0;k<3;k++)ebullet(e.x,e.y-20,e.spA+k*TAU/3,95);}}}

function rollOptions(n){const P=G.P,list=[],wc=Object.keys(P.w).length;
  for(const k in WDEF){const l=P.w[k]||0;if(l>=WDEF[k].max||(!l&&wc>=6))continue;list.push({t:'w',k,l,wt:l?1.3:1.1});}
  for(const k in PDEF){const l=P.p[k]||0;if(l>=PDEF[k].max||(PDEF[k].req&&!PDEF[k].req()))continue;list.push({t:'p',k,l,wt:k==='ricky'?1.4:.8});}
  const out=[];while(out.length<n&&list.length){let s=list.reduce((a,b)=>a+b.wt,0),r=Math.random()*s,i=0;for(;i<list.length-1;i++){r-=list[i].wt;if(r<=0)break;}out.push(list.splice(i,1)[0]);}
  if(!out.length)out.push({t:'heal'},{t:'gauge'});
  return out;}
function applyOpt(o){const P=G.P;
  if(o.t==='w')P.w[o.k]=(P.w[o.k]||0)+1;
  else if(o.t==='p'){P.p[o.k]=(P.p[o.k]||0)+1;if(o.k==='life'){P.maxHp+=20;P.hp=P.maxHp;}if(o.k==='ricky')G.ricky.lv++;}
  else if(o.t==='heal')P.hp=P.maxHp;else if(o.t==='gauge')P.gauge=GMAX;
  for(let i=0;i<14;i++){const a=i/14*TAU;part({k:'spark',x:P.x,y:P.y-20,vx:Math.cos(a)*160,vy:Math.sin(a)*160,life:.5,max:.5,col:'#ffe066',sz:5});}}

  $('clearText').innerHTML=last?'やったね！ キュアふーたんと リッキーの おかげで<br>せかいに えがおが もどったよ！<br>'+stats():'ステージ'+(G.si+1)+'「'+G.st.name+'」を まもったよ！<br>'+stats();
  $('nextBtn').style.display=last?'none':'';$('clear').classList.add('show');$('hud').classList.remove('show');}
function stats(){const P=G.P;return`<span style="font-size:15px;color:#9a6a8a">やっつけた かず ${P.kills}・レベル ${P.lv}</span>`;}

// ================= render =================
function render(){const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);
  if(!G||state==='title'||state==='select'){drawTitle(c);return;}
  const P=G.P,cam=G.cam;cam.x+=(P.x-cam.x)*.2;cam.y+=(P.y-14-cam.y)*.2;
  const sx=G.shake?rnd(-G.shake,G.shake):0,sy=G.shake?rnd(-G.shake,G.shake):0;
  c.save();c.translate(W/2+sx,H/2+sy);c.scale(Z,Z);c.translate(-cam.x,-cam.y);
  const hw=W/2/Z+20,hh=H/2/Z+20,x0=cam.x-hw,x1=cam.x+hw,y0=cam.y-hh,y1=cam.y+hh;
  drawBG(c,G.th,x0,y0,x1,y1,CLK);
  // ほうせき・アイテム
  for(const g of G.gems){if(g.x<x0||g.x>x1||g.y<y0||g.y>y1)continue;drawGem(c,g);}
  for(const it of G.items)drawItem(c,it);
  // バリア
  if(P.w.aura&&state!=='transform'){const R=WS.aura.r[P.w.aura],pu=1+Math.sin(CLK*6)*.03;c.save();c.globalAlpha=.22;const g=c.createRadialGradient(P.x,P.y-14,R*.3,P.x,P.y-14,R*pu);g.addColorStop(0,'rgba(255,200,240,0)');g.addColorStop(1,'rgba(255,140,210,.9)');c.fillStyle=g;circ(c,P.x,P.y-14,R*pu);c.globalAlpha=.6;c.strokeStyle='#fff';c.lineWidth=2;c.setLineDash([6,8]);c.lineDashOffset=-CLK*30;c.beginPath();c.arc(P.x,P.y-14,R*pu,0,TAU);c.stroke();c.setLineDash([]);c.restore();}
  // ボムの まと
  for(const f of G.fx)if((f.k==='bomb'||f.k==='meteor')&&!f.done){c.globalAlpha=.35+.25*Math.sin(f.t*30);c.strokeStyle=f.k==='bomb'?'#ff5fa8':'#ffb000';c.lineWidth=2.5;c.beginPath();c.arc(f.x,f.y,f.r*(1-f.t/f.delay*.3),0,TAU);c.stroke();c.globalAlpha=1;}
  // とっしん よこく
  for(const e of G.enemies)if(e.state==='wind'){c.save();c.translate(e.x,e.y);c.rotate(e.dang);c.globalAlpha=.18+.15*Math.sin(e.wt*30);c.fillStyle='#ff2d6a';c.fillRect(0,-e.r,236+e.r,e.r*2);c.restore();c.globalAlpha=1;otext(c,'！',e.x,e.y-e.r*2.4,30,'#fff','#ff2d6a');}
  // キャラクター（y で ならべる）
  const ents=[];for(const e of G.enemies)if(e.x>x0-60&&e.x<x1+60&&e.y>y0-60&&e.y<y1+100)ents.push(e);
  if(state!=='transform')ents.push({isP:1,y:P.y});if(G.ricky.on)ents.push({isR:1,y:G.ricky.y});
  ents.sort((a,b)=>a.y-b.y);
  for(const e of ents){if(e.isP)drawPlayer(c);else if(e.isR)drawRicky(c,G.ricky.x,G.ricky.y,{t:CLK,dir:G.ricky.dir,happy:G.ricky.say>0});else drawEnemy(c,e);}
  if(G.ricky.on&&G.ricky.say>0)speech(c,G.ricky.x,G.ricky.y-62,'ばぶ！');
  // スター
  if(P.w.star&&state!=='transform'){const n=WS.star.n[P.w.star],R=74+P.w.star*6;c.globalCompositeOperation='lighter';for(let i=0;i<n;i++){const a=G.starAng+i/n*TAU;drawGlow(c,'#ffe066',P.x+Math.cos(a)*R,P.y-14+Math.sin(a)*R,22,.7);}c.globalCompositeOperation='source-over';
    for(let i=0;i<n;i++){const a=G.starAng+i/n*TAU,x=P.x+Math.cos(a)*R,y=P.y-14+Math.sin(a)*R;c.fillStyle='#ffe066';c.strokeStyle='#ff9a3a';c.lineWidth=2;starP(c,x,y,12,5.5,5,G.starAng*2);c.fill();c.stroke();c.fillStyle='#fff';circ(c,x-2,y-2,2);}}
  // たま
  for(const s of G.shots)drawShot(c,s);
  c.globalCompositeOperation='lighter';for(const b of G.ebul)drawGlow(c,'#b04ad0',b.x,b.y,b.r*2.4,.8);c.globalCompositeOperation='source-over';
  for(const b of G.ebul){c.fillStyle='#3a1050';circ(c,b.x,b.y,b.r);c.fillStyle='#e070ff';circ(c,b.x,b.y,b.r*.55);c.fillStyle='#fff';circ(c,b.x-b.r*.25,b.y-b.r*.25,b.r*.2);}
  for(const f of G.fx)drawFx(c,f);
  for(const p of G.parts)drawPart(c,p);
  for(const n of G.nums){c.globalAlpha=Math.min(1,n.life*3);otext(c,n.v,n.x,n.y,n.big?18:12,n.big?'#fff36a':'#fff','#c0306a');}c.globalAlpha=1;
  c.restore();
  drawHUD(c);
  if(G.flash>0){c.fillStyle=`rgba(255,240,250,${Math.min(.85,G.flash)})`;c.fillRect(0,0,W,H);}
  if(state==='transform')drawTransform(c);
  if(state==='hissatsu')drawCutin(c);
  if(state==='story')drawStory(c);
  if(G.banner)drawBanner(c);
  if(joy&&state==='play'){c.globalAlpha=.35;c.fillStyle='#fff';circ(c,joy.bx,joy.by,58);c.globalAlpha=.8;c.fillStyle='#ff8cc6';const dx=joy.x-joy.bx,dy=joy.y-joy.by,d=Math.hypot(dx,dy),m=Math.min(d,58)/(d||1);circ(c,joy.bx+dx*m,joy.by+dy*m,26);c.globalAlpha=1;}
  updHisBtn();$('hisBtn').style.visibility=state==='transform'?'hidden':'';}
function speech(c,x,y,s){c.fillStyle='#fff';c.strokeStyle='#39a0e0';c.lineWidth=2;rr(c,x-22,y-12,44,22,10);c.fill();c.stroke();c.beginPath();c.moveTo(x-4,y+10);c.lineTo(x+2,y+17);c.lineTo(x+6,y+10);c.fill();otext(c,s,x,y,13,'#39a0e0','#fff');}
function drawPlayer(c){const P=G.P;if(P.inv>0&&P.inv<2.5&&(CLK*20|0)%2&&state==='play')return;
  if(P.revived&&P.inv>0){c.globalCompositeOperation='lighter';drawGlow(c,'#7fe3ff',P.x,P.y-24,50,.6);c.globalCompositeOperation='source-over';}
  drawFutan(c,P.x,P.y,{t:CLK,dir:P.dir,moving:P.moving,pose:state==='clearing'?'win':P.castT>0?'cast':'run',ouch:P.hurtT>0,happy:state==='clearing',look:P.dir*.5});
  if(P.hp<P.maxHp&&state==='play'){const w=36;c.fillStyle='rgba(60,20,60,.5)';rr(c,P.x-w/2,P.y+6,w,6,3);c.fill();c.fillStyle=P.hp/P.maxHp<.3?'#ff4a4a':'#ff5fa8';rr(c,P.x-w/2+1,P.y+7,(w-2)*P.hp/P.maxHp,4,2);c.fill();}}
function drawEnemy(c,e){const bb=e.kind==='boss';
  if(e.kind==='mid'){c.globalCompositeOperation='lighter';drawGlow(c,'#b04ad0',e.x,e.y-e.r,e.r*2.6,.5+.2*Math.sin(e.t*5));c.globalCompositeOperation='source-over';}
  if(bb){c.globalCompositeOperation='lighter';drawGlow(c,e.v.orb,e.x,e.y-60,90,.35+.1*Math.sin(e.t*4));c.globalCompositeOperation='source-over';drawVillain(c,e.x,e.y+10,e,e.t);
    if(e.flash>0){c.globalCompositeOperation='lighter';drawGlow(c,'#ffffff',e.x,e.y-50,70,e.flash*5);c.globalCompositeOperation='source-over';}return;}
  const S=e.spr,sq=Math.sin(e.t*9)*.07,sz=S.size;c.fillStyle='rgba(40,0,50,.2)';ell(c,e.x,e.y+e.r*.85,e.r*.9,e.r*.3);
  c.save();c.translate(e.x,e.y-Math.abs(Math.sin(e.t*9))*e.r*.12);c.scale(1+sq,1-sq);c.drawImage(S.img,-sz/2,-sz/2,sz,sz);if(e.flash>0){c.globalAlpha=Math.min(1,e.flash*8);c.drawImage(S.wh,-sz/2,-sz/2,sz,sz);c.globalAlpha=1;}c.restore();
  if(e.kind==='mid'){const w=70;c.fillStyle='rgba(40,0,50,.6)';rr(c,e.x-w/2,e.y-e.r*1.6,w,8,4);c.fill();c.fillStyle='#c060ff';rr(c,e.x-w/2+1,e.y-e.r*1.6+1,(w-2)*Math.max(0,e.hp/e.maxHp),6,3);c.fill();}}
function drawGem(c,g){const big=g.val>=3,s=big?10:7.5,col=big?'#3cc8ff':'#ffd23a',dk=big?'#1a6ab0':'#d0700a',ph=CLK*5+g.x*.7+g.y*.3,y=g.y-4+Math.sin(ph)*2;
  c.globalCompositeOperation='lighter';drawGlow(c,big?'#7fe3ff':'#ffe680',g.x,y,s*2.6,.55+.25*Math.sin(ph*1.3));c.globalCompositeOperation='source-over';
  c.fillStyle='rgba(40,0,40,.18)';ell(c,g.x,g.y+s*.9,s*.7,s*.25);
  c.lineJoin='round';c.fillStyle=col;c.beginPath();c.moveTo(g.x,y-s*1.35);c.lineTo(g.x+s,y);c.lineTo(g.x,y+s*1.35);c.lineTo(g.x-s,y);c.closePath();c.fill();
  c.strokeStyle=dk;c.lineWidth=3;c.stroke();c.strokeStyle='#fff';c.lineWidth=1.3;c.stroke();
  c.fillStyle='rgba(255,255,255,.85)';c.beginPath();c.moveTo(g.x,y-s*1.05);c.lineTo(g.x+s*.45,y);c.lineTo(g.x,y);c.closePath();c.fill();
  const tw=Math.sin(ph*1.7);if(tw>.6){c.fillStyle='#fff';starP(c,g.x+s*.6,y-s*.9,s*.7*(tw-.4)*2,s*.15,4);c.fill();}}
function drawItem(c,it){const y=it.y-8+Math.sin(CLK*4)*3;c.globalCompositeOperation='lighter';drawGlow(c,it.k==='chest'?'#ffd84a':'#ffffff',it.x,y,it.k==='chest'?44:26,.6);c.globalCompositeOperation='source-over';c.strokeStyle=LN;c.lineWidth=1.6;
  if(it.k==='berry'){c.fillStyle='#ff3d5a';c.beginPath();c.moveTo(it.x,y+9);c.bezierCurveTo(it.x-11,y,it.x-8,y-8,it.x,y-7);c.bezierCurveTo(it.x+8,y-8,it.x+11,y,it.x,y+9);c.fill();c.stroke();c.fillStyle='#5ac85a';starP(c,it.x,y-7,5,2,5);c.fill();c.fillStyle='#ffe0a0';for(const[a,b]of[[-3,-2],[3,-2],[0,2],[-3,4],[3,4]])circ(c,it.x+a,y+b,.9);}
  else if(it.k==='magnet'){c.fillStyle='#ff5fa8';heartP(c,it.x,y,9);c.fill();c.stroke();c.fillStyle='#fff';otext(c,'N',it.x,y-1,10,'#fff','#c0306a');}
  else{c.fillStyle='#ffb84a';rr(c,it.x-15,y-10,30,20,4);c.fill();c.stroke();c.fillStyle='#ff7ab8';rr(c,it.x-16,y-15,32,9,4);c.fill();c.stroke();c.fillStyle='#ffe066';rr(c,it.x-3,y-9,6,8,2);c.fill();c.stroke();otext(c,'たからばこ',it.x,y-28,11,'#fff','#c07a00');}}
function drawShot(c,s){
  if(s.k==='heart'){c.globalCompositeOperation='lighter';drawGlow(c,'#ff5fa8',s.x,s.y,20,.7);c.globalCompositeOperation='source-over';c.fillStyle='#ff4f9a';c.strokeStyle='#fff';c.lineWidth=2;heartP(c,s.x,s.y,8);c.fill();c.stroke();}
  else if(s.k==='ribbon'){c.save();c.translate(s.x,s.y);c.rotate(CLK*14);c.strokeStyle=LN;c.lineWidth=1.5;bow(c,0,0,'#ff5fa8',1.5);c.restore();}
  else if(s.k==='towel'){c.save();c.translate(s.x,s.y);c.rotate(s.rot);c.fillStyle='#fff';c.strokeStyle='#8a9ac0';c.lineWidth=1.5;rr(c,-9,-7,18,14,3);c.fill();c.stroke();c.strokeStyle='#9aa6c0';c.beginPath();c.moveTo(-9,2);c.lineTo(9,2);c.stroke();c.restore();}}
function drawFx(c,f){
  if(f.k==='beam'){const a=Math.min(1,f.life/f.max*1.6),w=f.w*(f.t<.08?f.t/.08:1);c.save();c.translate(f.x,f.y);c.rotate(f.a);c.globalAlpha=a;
    const cols=['#ff5f7a','#ffb04a','#ffe84a','#5ad06a','#5ab4ff','#a07aff'];for(let i=0;i<6;i++){c.fillStyle=cols[i];c.fillRect(0,-w/2+i*w/6,f.len,w/6+.5);}
    c.fillStyle='rgba(255,255,255,.75)';c.fillRect(0,-w*.18,f.len,w*.36);c.fillStyle='#fff';circ(c,0,0,w*.6);c.restore();c.globalAlpha=1;}
  else if(f.k==='bomb'){if(!f.done){const h=(1-f.t/f.delay)*120;c.save();c.translate(f.x,f.y-h);c.rotate(f.t*10);flowerP(c,0,0,11,'#ff8cc6','#ffe066');c.restore();}
    else{const k=(f.t-f.delay)/(f.life+f.t-f.delay);c.globalAlpha=Math.max(0,1-k);c.globalCompositeOperation='lighter';drawGlow(c,'#ff8cc6',f.x,f.y,f.r*1.4,.9);c.globalCompositeOperation='source-over';c.strokeStyle='#fff';c.lineWidth=4;c.beginPath();c.arc(f.x,f.y,f.r*(.6+k*.6),0,TAU);c.stroke();c.globalAlpha=1;}}
  else if(f.k==='meteor'){if(!f.done){const k=1-f.t/f.delay;c.globalCompositeOperation='lighter';drawGlow(c,'#ffe066',f.x+k*90,f.y-k*200,30,.9);c.globalCompositeOperation='source-over';c.fillStyle='#ffe066';c.strokeStyle='#ff9a3a';c.lineWidth=2;starP(c,f.x+k*90,f.y-k*200,14,6);c.fill();c.stroke();}
    else{const k=(f.t-f.delay)/(f.life+f.t-f.delay);c.globalAlpha=Math.max(0,1-k);c.globalCompositeOperation='lighter';drawGlow(c,'#ffe066',f.x,f.y,f.r*1.5,1);c.globalCompositeOperation='source-over';c.globalAlpha=1;}}
  else if(f.k==='wave'){c.save();c.globalAlpha=Math.max(0,f.life/.8);c.strokeStyle='#ff8cc6';c.lineWidth=26;c.beginPath();c.arc(f.x,f.y,f.r,0,TAU);c.stroke();c.strokeStyle='#fff';c.lineWidth=10;c.stroke();
    for(let i=0;i<16;i++){const a=i/16*TAU+f.t;c.fillStyle=i%2?'#ff5fa8':'#ffe066';heartP(c,f.x+Math.cos(a)*f.r,f.y+Math.sin(a)*f.r,14);c.fill();}c.restore();}}
function drawPart(c,p){const a=Math.max(0,p.life/p.max);c.globalAlpha=a;c.fillStyle=p.col;
  if(p.k==='spark'){starP(c,p.x,p.y,p.sz,p.sz*.4,4,p.life*6);c.fill();}
  else if(p.k==='heart'){heartP(c,p.x,p.y,p.sz);c.fill();}
  else if(p.k==='flower'){flowerP(c,p.x,p.y,p.sz,p.col);}
  else if(p.k==='petal'){c.save();c.translate(p.x,p.y);c.rotate(p.rot+p.life*8);c.beginPath();c.ellipse(0,0,p.sz,p.sz*.5,0,0,TAU);c.fill();c.restore();}
  c.globalAlpha=1;}
function drawHUD(c){const P=G.P,top=10;
  // けいけんち
  const bx=12,bw=W-24-58,bh=16;c.fillStyle='rgba(255,255,255,.85)';rr(c,bx,top,bw,bh,8);c.fill();
  const g=c.createLinearGradient(bx,0,bx+bw,0);g.addColorStop(0,'#ff8cc6');g.addColorStop(1,'#b98cff');c.fillStyle=g;rr(c,bx+2,top+2,Math.max(12,(bw-4)*P.xp/P.next),bh-4,6);c.fill();
  c.strokeStyle='#ff5fa8';c.lineWidth=2;rr(c,bx,top,bw,bh,8);c.stroke();otext(c,'Lv.'+P.lv,bx+8,top+bh/2+1,14,'#fff','#c0306a','left');
  // たいりょく
  const hy=top+24,hw=Math.min(200,W*.45);otext(c,'💗',bx+10,hy+8,16,'#fff','rgba(0,0,0,0)');c.fillStyle='rgba(60,20,60,.45)';rr(c,bx+22,hy+1,hw,14,7);c.fill();
  c.fillStyle=P.hp/P.maxHp<.3?'#ff4a4a':'#ff5fa8';rr(c,bx+24,hy+3,Math.max(0,(hw-4)*P.hp/P.maxHp),10,5);c.fill();c.strokeStyle='#fff';c.lineWidth=2;rr(c,bx+22,hy+1,hw,14,7);c.stroke();
  otext(c,Math.ceil(P.hp)+'/'+P.maxHp,bx+24+hw/2,hy+8.5,11,'#fff','#8a2a5a');
  otext(c,'✨'+P.kills,W-70,hy+8,14,'#fff','#8a2a5a','right');
  // すすみぐあい / ボスHP
  const py=hy+26;
  if(G.boss){const w=Math.min(W-40,420),x=(W-w)/2;otext(c,G.boss.name,W/2,py+4,16,'#fff','#5a1a7a');c.fillStyle='rgba(40,0,50,.6)';rr(c,x,py+14,w,14,7);c.fill();const gg=c.createLinearGradient(x,0,x+w,0);gg.addColorStop(0,'#b04ad0');gg.addColorStop(1,'#ff4a8a');c.fillStyle=gg;rr(c,x+2,py+16,Math.max(0,(w-4)*G.boss.hp/G.boss.maxHp),10,5);c.fill();c.strokeStyle='#fff';c.lineWidth=2;rr(c,x,py+14,w,14,7);c.stroke();}
  else if(!G.bossSpawned){const w=Math.min(W-40,300),x=(W-w)/2,k=Math.min(1,G.t/T_BOSS);c.fillStyle='rgba(255,255,255,.6)';rr(c,x,py+6,w,8,4);c.fill();c.fillStyle='#b98cff';rr(c,x,py+6,w*k,8,4);c.fill();
    otext(c,'👾',x+w*T_MID/T_BOSS,py+10,16,'#fff','rgba(0,0,0,0)');otext(c,'👑',x+w,py+10,18,'#fff','rgba(0,0,0,0)');drawFutanMini(c,x+w*k,py+10);}}
function drawFutanMini(c,x,y){c.fillStyle='#ff7ab8';c.strokeStyle='#fff';c.lineWidth=2;circ(c,x,y,7);c.stroke();c.fillStyle='#ffe066';heartP(c,x,y,3.5);c.fill();}
function drawBanner(c){const b=G.banner,k=b.t<.25?b.t/.25:b.t>b.dur-.3?(b.dur-b.t)/.3:1,y=H*.3;c.save();c.globalAlpha=Math.max(0,k);

  if(t<1.3){drawFutan(c,cx,cy,{t:CLK,cure:false,s,pose:'win',spin:t*9,noShadow:1});otext(c,'プリキュア・ハートフル・へんしん！',cx,H*.14,Math.min(26,W/17),'#fff','#ff4f9a','center','"Mochiy Pop One",'+FONT);}
  else{drawFutan(c,cx,cy,{t:CLK,cure:true,s,pose:'win',happy:true,noShadow:1});if(G.ricky.on)drawRicky(c,cx+45*s,cy-5*s,{t:CLK,s:s*.8,happy:true,noShadow:1});
    otext(c,'ひかりの せんし',cx,H*.1,Math.min(22,W/18),'#fff','#ff4f9a','center','"Mochiy Pop One",'+FONT);otext(c,'キュアふーたん！',cx,H*.17,Math.min(42,W/10),'#fff36a','#ff3d8a','center','"Mochiy Pop One",'+FONT);}
  if(t>1.2&&t<1.6){c.fillStyle=`rgba(255,255,255,${1-Math.abs(t-1.4)/.2})`;c.fillRect(0,0,W,H);}
  otext(c,'タップで スキップ',cx,H-30,13,'#fff','#c0306a');}
function drawCutin(c){const t=G.hs,s=Math.min(W,H)/160,k=Math.min(1,t/.25);c.fillStyle='rgba(40,0,50,.55)';c.fillRect(0,0,W,H);
  c.save();c.translate(W/2,H/2);c.rotate(-.18);const bh=Math.min(H*.5,260);const g=c.createLinearGradient(0,-bh/2,0,bh/2);g.addColorStop(0,'#ff8cc6');g.addColorStop(.5,'#ffd6ec');g.addColorStop(1,'#b98cff');c.fillStyle=g;c.fillRect(-W*(1-k)-W,-bh/2,W*2+40,bh);
  c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=3;for(let i=0;i<14;i++){const y=-bh/2+((i*37)%bh),x=((CLK*1400+i*260)%(W*2))-W;c.beginPath();c.moveTo(x,y);c.lineTo(x+120,y);c.stroke();}c.restore();
  const px=lerp(-W*.4,W*.3,Math.min(1,t/.35));drawFutan(c,px,H/2+60*s*.9,{t:CLK,s:s*1.1,pose:'cast',happy:t>.6,noShadow:1});
  for(let i=0;i<12;i++){const a=i/12*TAU+t*4;c.fillStyle=i%2?'#ffe066':'#fff';heartP(c,px+100*s*.5+Math.cos(a)*50*s*.4,H/2+Math.sin(a)*40*s*.4-30,6);c.fill();}
  if(t>.3){const tx=Math.min(W*.66,W-40);otext(c,'キュアふーたん！',tx,H/2-50,Math.min(30,W/13),'#fff','#ff3d8a','center','"Mochiy Pop One",'+FONT);}
  if(t>.6){const sc=1+Math.max(0,.3-(t-.6))*2;c.save();c.translate(W/2,H/2+Math.min(H*.3,150));c.scale(sc,sc);otext(c,'スーパー ハートシャワー！',0,0,Math.min(34,W/11.5),'#fff36a','#ff3d8a','center','"Mochiy Pop One",'+FONT);c.restore();}}
function drawStory(c){const s=Math.min(W,H)/130;c.fillStyle='rgba(40,0,60,.45)';c.fillRect(0,0,W,H);
  c.globalCompositeOperation='lighter';drawGlow(c,'#7fe3ff',W/2,H*.35,160*s*.5,.8);c.globalCompositeOperation='source-over';
  for(let i=0;i<16;i++){const a=i/16*TAU+CLK;c.fillStyle=i%2?'#fff':'#ffe066';starP(c,W/2+Math.cos(a)*70*s*.6,H*.33+Math.sin(a)*60*s*.6,6,2.4,4,CLK*3);c.fill();}
  drawRicky(c,W/2,H*.42,{t:CLK,s,happy:(CLK%2)<1,noShadow:1});}
function updHisBtn(){const b=$('hisBtn');if(!G)return;const k=Math.round(G.P.gauge/GMAX*100);if(b._k===k)return;b._k=k;
  if(k>=100){b.classList.add('full');b.style.background='';b.querySelector('span').innerHTML='<i>💖</i>おして！';}
  else{b.classList.remove('full');b.style.background=`conic-gradient(#ff5fa8 ${k}%,rgba(255,255,255,.55) ${k}%)`;b.querySelector('span').innerHTML='<i>💖</i>ひっさつ';}}
// タイトル
function drawTitle(c){const s=Math.min(W,H)/150;c.save();const ox=CLK*20,oy=CLK*10;c.translate(-ox,-oy);drawBG(c,0,ox-20,oy-20,ox+W+20,oy+H+20,CLK);c.restore();
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(255,170,220,.75)');g.addColorStop(.5,'rgba(255,200,235,.2)');g.addColorStop(1,'rgba(185,140,255,.55)');c.fillStyle=g;c.fillRect(0,0,W,H);
  for(let i=0;i<24;i++){const x=(i*137+CLK*30*(1+i%3))%(W+40)-20,y=(i*89+Math.sin(CLK+i)*20+H*.1)%H;c.fillStyle=['#fff','#ffe066','#ff8cc6'][i%3];starP(c,x,y,5,2,4,CLK*2+i);c.fill();}
  const cy=H*.66;c.globalCompositeOperation='lighter';drawGlow(c,'#ffffff',W/2,cy-40*s,90*s,.7);c.globalCompositeOperation='source-over';
  drawFutan(c,W/2-8*s,cy,{t:CLK,s,pose:'win',happy:(CLK%4)>3});drawRicky(c,W/2+36*s,cy-4*s,{t:CLK,s:s*.8});
  const ex=[-1,1];for(const k of ex){const e={spr:getSprite(0,'walk',13),t:CLK+k,r:13,x:W/2+k*62*s,y:cy+10*s,kind:'minion',flash:0};c.save();c.translate(e.x,e.y);c.scale(s*.9,s*.9);c.translate(-e.x,-e.y);drawEnemy(c,e);c.restore();}}

// ================= flow =================
function refreshToggles(){$('easyBtn').textContent=SAVE.easy?'🍼 やさしい：ON':'🍼 やさしい：OFF';$('muteBtn').textContent=SAVE.mute?'🔇 おと：OFF':'🔊 おと：ON';}
function showSelect(){state='select';hideAll();$('select').classList.add('show');const L=$('stageList');L.innerHTML='';
  STAGES.forEach((st,i)=>{const b=document.createElement('button');const lock=i>SAVE.cleared;b.className='st'+(lock?' lock':'');
    b.innerHTML=`<span class="em">${lock?'🔒':st.emoji}</span><span><b>ステージ${i+1} ${st.name}</b><small>ボス：${st.boss.name}</small></span><span class="ok">${i<SAVE.cleared?'⭐':''}</span>`;
    b.onclick=()=>startStage(i);L.appendChild(b);});}
function hideAll(){for(const id of['title','select','lvup','pause','story','over','clear'])$(id).classList.remove('show');}
function startStage(i){audio();hideAll();newRun(i);state='transform';G.tf=0;$('hud').classList.add('show');$('hisBtn')._k=-1;BGM.on=true;BGM.mode=0;BGM.step=0;SFX.level();}
function pauseGame(){if(state!=='play')return;state='pause';joy=null;$('pause').classList.add('show');}
$('startBtn').onclick=()=>{audio();showSelect();};
$('backTitle').onclick=()=>{hideAll();state='title';$('title').classList.add('show');};
$('easyBtn').onclick=()=>{SAVE.easy=!SAVE.easy;save();refreshToggles();};
$('muteBtn').onclick=()=>{SAVE.mute=!SAVE.mute;save();refreshToggles();audio();};
$('pauseBtn').onclick=()=>pauseGame();
$('hisBtn').addEventListener('pointerdown',e=>{e.stopPropagation();audio();doHissatsu();});
$('resumeBtn').onclick=()=>{$('pause').classList.remove('show');state='play';};
const toSelect=()=>{G=null;BGM.on=false;$('hud').classList.remove('show');showSelect();};
$('quitBtn').onclick=toSelect;$('overSel').onclick=toSelect;$('clearSel').onclick=toSelect;
$('retryBtn').onclick=()=>startStage(G.si);
$('nextBtn').onclick=()=>startStage(Math.min(STAGES.length-1,G.si+1));
$('storyBtn').onclick=()=>{$('story').classList.remove('show');const R=G.ricky;R.on=true;R.x=G.P.x;R.y=G.P.y;R.say=1.5;state='play';banner('リッキーが なかまに！','タオルで こうげき＆ときどき かいふく','#39a0e0',2.2);};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame();});
refreshToggles();

let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
  for(let i=0;i<SPEED;i++)update(dt);render();bgmTick();}
requestAnimationFrame(frame);
window.__game={get G(){return G},get state(){return state},startStage,SAVE};
if(Q.has('stage')){startStage(+Q.get('stage')||0);}
</script>
