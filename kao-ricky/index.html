<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffe9f4">
<title>かお リッキー</title>
<style>
  :root{--ink:#4a2a5a;--accent:#ff5fa2;--btn:#ffffff;--line:#ffc7e1}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#ffe9f4;color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
  canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
  #bg{z-index:0}#gl{z-index:1;touch-action:none}#fx{z-index:2;pointer-events:none}
  #top{position:fixed;z-index:5;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 12px 0}
  .pill{border:3px solid var(--line);background:rgba(255,255,255,.92);color:var(--ink);font:inherit;font-weight:800;font-size:17px;border-radius:99px;padding:5px 14px;min-height:44px;cursor:pointer}
  .pill:active{transform:scale(.94)}
  #bar{position:fixed;z-index:5;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:8px 8px calc(env(safe-area-inset-bottom) + 10px)}
  .tool{flex:1;max-width:92px;border:3px solid var(--line);background:var(--btn);border-radius:20px;padding:4px 2px 5px;display:flex;flex-direction:column;align-items:center;font:inherit;color:var(--ink);cursor:pointer;touch-action:none;box-shadow:0 4px 0 #ffc7e1}
  .tool:active{transform:translateY(3px);box-shadow:0 1px 0 #ffc7e1}
  .tool b{font-size:32px;line-height:1.15}
  .tool span{font-size:12px;font-weight:800;white-space:nowrap}
  #toast{position:fixed;z-index:7;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translate(-50%,-30px);opacity:0;pointer-events:none;background:#fff;border:4px solid #ffd23f;border-radius:20px;padding:6px 18px;font-weight:800;font-size:18px;white-space:nowrap;transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .3s}
  #toast.on{transform:translate(-50%,0);opacity:1}
  #toast small{display:block;font-size:12px;color:#c9902a;text-align:center}
  .ov{position:fixed;z-index:8;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 24px) 16px calc(env(safe-area-inset-bottom) + 28px);transition:opacity .4s}
  .ov.hide{opacity:0;pointer-events:none}
  .ov.hide *{pointer-events:none!important}
  body.title #top,body.title #bar{opacity:0;pointer-events:none}
  #title{pointer-events:none}
  #title>*{pointer-events:auto}
  .logo{text-align:center;margin-top:4px}
  .logo .sub{display:inline-block;background:#fff;border:3px solid var(--line);border-radius:99px;padding:2px 14px;font-weight:800;font-size:15px;color:#d94a8c}
  .logo h1{margin:6px 0 0;font-size:clamp(40px,12vw,68px);line-height:1;letter-spacing:.04em;color:#ff5fa2;-webkit-text-stroke:2px #fff;paint-order:stroke fill;text-shadow:0 4px 0 #ffffff,0 7px 0 #ffb3d6,0 10px 14px rgba(160,60,110,.25)}
  .logo h1 i{font-style:normal;color:#5a8de0}
  .starts{display:flex;flex-direction:column;align-items:center;gap:14px}
  .start{font:inherit;font-weight:900;font-size:24px;color:#fff;background:linear-gradient(#ff7ab5,#ff4f98);border:4px solid #fff;border-radius:99px;padding:10px 30px;min-width:min(86vw,330px);box-shadow:0 6px 0 #d63a7f,0 10px 20px rgba(200,40,110,.3);cursor:pointer;animation:pulse 1.4s ease-in-out infinite}
  .start.iro{background:linear-gradient(#7ac8ff,#4a8de0);box-shadow:0 6px 0 #2f6ab8,0 10px 20px rgba(40,90,180,.3);animation-delay:.7s}
  .start:active{transform:translateY(4px)}
  .start small{display:block;font-size:13px;font-weight:800;opacity:.95}
  #mode{display:flex;border:3px solid var(--line);background:rgba(255,255,255,.92);border-radius:99px;padding:3px;gap:2px}
  #mode button{font:inherit;font-weight:800;font-size:15px;border:0;border-radius:99px;padding:4px 11px;min-height:36px;background:transparent;color:var(--sub,#8a6a9a);cursor:pointer}
  #mode button.on{background:#ff7ab5;color:#fff}
  #mode button.on[data-mode=color]{background:#4a8de0}
  #resetBtn{display:none}
  body.color #resetBtn{display:flex}
  body.color #buruBtn{display:none}
  @keyframes pulse{50%{transform:scale(1.06)}}
  #album{background:rgba(255,233,244,.94);justify-content:flex-start;gap:12px}
  #album h2{margin:4px 0 0;font-size:24px;color:#ff5fa2}
  #alist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;width:100%;max-width:640px;overflow:auto}
  #alist li{background:#fff;border:3px solid var(--line);border-radius:14px;padding:8px 10px;font-weight:800;font-size:15px;display:flex;gap:6px;align-items:center}
  #alist li.no{color:#c8b0c8;background:#fff7fb}
  #alist li em{font-style:normal;font-size:20px}
  #aclose{margin-top:auto}
  #nogl{display:none;position:fixed;inset:0;z-index:9;align-items:center;justify-content:center;text-align:center;padding:24px;font-weight:800;background:#ffe9f4}
</style>
</head>
<body class="title">
<canvas id="bg"></canvas>
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>
<div id="top">
  <button class="pill" id="star">⭐ 0/0</button>
  <div id="mode"><button data-mode="stretch" class="on">🤏 のばす</button><button data-mode="color">🎨 いろ</button></div>
  <button class="pill" id="snd">🔊</button>
</div>
<div id="bar">
  <button class="tool" data-tool="milk"><b>🍼</b><span>ミルク</span></button>
  <button class="tool" data-tool="rattle"><b>🎵</b><span>ガラガラ</span></button>
  <button class="tool" id="hatBtn"><b>👒</b><span>ぼうし</span></button>
  <button class="tool" id="glassBtn"><b>👓</b><span>めがね</span></button>
  <button class="tool" id="buruBtn"><b>💫</b><span>ぶるぶる</span></button>
  <button class="tool" id="resetBtn"><b>🔄</b><span>もとの いろ</span></button>
</div>
<div id="toast"></div>
<div class="ov" id="title">
  <div class="logo"><div class="sub">さわって ひっぱって あそぼう！</div><h1>かお<i>リッキー</i></h1></div>
  <div class="starts">
    <button class="start" id="start">🤏 ひっぱって あそぶ<small>のびる・ぷるぷる・いろんな はんのう</small></button>
    <button class="start iro" id="startColor">🎨 いろを かえて あそぶ<small>さわった ところの いろが かわる（かんたん）</small></button>
  </div>
</div>
<div class="ov hide" id="album">
  <h2>⭐ はっけん アルバム</h2>
  <ul id="alist"></ul>
  <button class="pill" id="aclose">とじる</button>
</div>
<div id="nogl">この ブラウザでは あそべません（WebGL が ひつようです）</div>
<script>
'use strict';
(() => {
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, k) => a + (b - a) * k;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (a) => a[(Math.random() * a.length) | 0];
const $ = (id) => document.getElementById(id);

/* ================= せってい ================= */
const SZ = 1024;              // かおの デザイン座標（テクスチャ全体 = 1024×1024）
const FX = 512, FY = 500;     // あたまの まんなか
const OL = '#3b2626';
const N = 32, NV = (N + 1) * (N + 1);
const SIGMA = 120;            // つまんだ ところの まわりが ついてくる ひろさ
const KSPR = 170, DAMP = 5.5, KLAP = 360;

const FINDS = [
  ['hoppe', 'ほっぺ ぷにっ', '🍑'], ['hana', 'おはな ぷっ', '👃'], ['me', 'おめめ ぱちくり', '👀'],
  ['paci', 'おしゃぶり ぽん', '🍭'], ['kami', 'かみのけ ぴょーん', '💇'], ['mimi', 'おみみ ぴこぴこ', '👂'],
  ['hane', 'はね ぱたぱた', '🪽'], ['ago', 'あご あぶー', '😮'], ['biyon', 'びよーーん', '🤪'],
  ['ryote', 'りょうてで びよーん', '🙌'], ['kocho', 'こちょこちょ', '🤭'], ['milk', 'ミルク ごくごく', '🍼'],
  ['gara', 'ガラガラ きゃっきゃ', '🎵'], ['nenne', 'ねんね', '💤'], ['boushi', 'ぼうし きせかえ', '👒'],
  ['megane', 'めがね きせかえ', '👓'], ['buru', 'ぶるぶる', '💫'],
];
// いろを かえる モード：ぶいごとの いろ（さいしょが もとの いろ）
const PAL = {
  skin: [['はだいろ', '#ffe0cc'], ['ピンク', '#ffc4dc'], ['きいろ', '#fff0a0'], ['みどり', '#c8f0b0'], ['みずいろ', '#c6e6ff'], ['むらさき', '#e2cdfa'], ['オレンジ', '#ffcf9e']],
  hair: [['くろ', '#2b1d22'], ['ちゃいろ', '#8a5530'], ['きいろ', '#f5c830'], ['ピンク', '#ff7ab5'], ['あお', '#3f6fd8'], ['みどり', '#3fae5a'], ['むらさき', '#8a52c8'], ['あか', '#e0403a'], ['しろ', '#f4f4f4']],
  cheek: [['ピンク', '#ff6e8c'], ['あか', '#ff3030'], ['オレンジ', '#ff9a2a'], ['むらさき', '#b060ff'], ['みずいろ', '#40b0ff'], ['きいろ', '#ffd000']],
  eye: [['くろ', '#2a1c1c'], ['あお', '#1f3f9a'], ['みどり', '#1f7a3a'], ['むらさき', '#5a2a8a'], ['ピンク', '#b02a6a'], ['ちゃいろ', '#6a3a1a']],
  paci: [['ピンク', '#ffd0e0', '#ff9ccf'], ['みずいろ', '#cfeaff', '#6ab8f5'], ['きいろ', '#fff2a8', '#f5c830'], ['みどり', '#d4f5c4', '#5ac85a'], ['むらさき', '#ead6ff', '#a86ae8'], ['オレンジ', '#ffe0c0', '#ff9a3a']],
  wing: [['みずいろ', '#cfe2ff'], ['ピンク', '#ffc8e4'], ['きいろ', '#fff0a0'], ['みどり', '#c8f5c0'], ['むらさき', '#dcc8ff'], ['にじいろ', 'rainbow']],
  body: [['しろ', '#ffffff', '#f3dc5a'], ['ピンク', '#ffd6e8', '#ff7ab5'], ['みずいろ', '#d6ecff', '#4a8de0'], ['きいろ', '#fff4b8', '#ff9a2a'], ['みどり', '#dcf5d0', '#3fae5a'], ['むらさき', '#ecdcff', '#8a52c8']],
  hat: [['もとの いろ', null], ['あか', '#ff6a6a'], ['あお', '#6a9cff'], ['みどり', '#7ad870'], ['むらさき', '#b88cff'], ['きいろ', '#ffd84a'], ['ピンク', '#ffa8cc']],
  glass: [['もとの いろ', null], ['あか', '#e0403a'], ['あお', '#3f6fd8'], ['きんいろ', '#e8a820'], ['ピンク', '#ff5fa2'], ['みどり', '#3fae5a']],
};
const CI = {}; for (const k in PAL) CI[k] = 0;
const pc = (k, i = 1) => PAL[k][CI[k]][i];
const HATS = ['none', 'bonnet', 'chick', 'bear', 'crown', 'party', 'bunny'];
const GLASSES = ['none', 'round', 'heart', 'star', 'hige'];

/* ================= じょうたい ================= */
const S = {
  started: false, now: 0, lastTouch: 0, firstGrab: false,
  lookX: 0, lookY: 0, tLookX: 0, tLookY: 0, wanderT: 0,
  paci: true, blush: 0, hat: 0, glasses: 0,
  blinkT: 0, nextBlink: 2, dblBlink: 0,
  exprUntil: 0, exprEyes: 'open', exprMouth: 'smile',
  noseSquish: 0, tuft: 0, tuftV: 0, flapUntil: 0,
  sleep: false, yawnUntil: 0, snoreT: 0,
  stretch: 0, bigSaid: false, drinking: false,
  muted: false, found: {}, mode: 'stretch', firstColor: false,
};
try { S.found = JSON.parse(localStorage.getItem('kao-ricky-found') || '{}') || {}; } catch (e) { S.found = {}; }

/* ================= おと（Web Audio） ================= */
const AU = { ctx: null, out: null, nb: null };
function auInit() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
  try {
    AU.ctx = new (window.AudioContext || window.webkitAudioContext)();
    AU.out = AU.ctx.createGain(); AU.out.gain.value = 0.8; AU.out.connect(AU.ctx.destination);
    const len = AU.ctx.sampleRate; AU.nb = AU.ctx.createBuffer(1, len, len);
    const d = AU.nb.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AU.ctx = null; }
}
const ok = () => AU.ctx && !S.muted;
function env(gn, t0, a, peak, dur) {
  gn.gain.setValueAtTime(0.0001, t0); gn.gain.exponentialRampToValueAtTime(peak, t0 + a);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
}
function tone(type, f0, f1, dur, vol, delay = 0, filt) {
  if (!ok()) return;
  const c = AU.ctx, t0 = c.currentTime + delay, o = c.createOscillator(), gn = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  env(gn, t0, Math.min(0.02, dur / 4), vol, dur);
  if (filt) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filt; o.connect(f); f.connect(gn); } else o.connect(gn);
  gn.connect(AU.out); o.start(t0); o.stop(t0 + dur + 0.05);
}
function noise(dur, vol, freq, q = 1, type = 'bandpass', delay = 0) {
  if (!ok()) return;
  const c = AU.ctx, t0 = c.currentTime + delay, s = c.createBufferSource(), f = c.createBiquadFilter(), gn = c.createGain();
  s.buffer = AU.nb; f.type = type; f.frequency.value = freq; f.Q.value = q;
  env(gn, t0, Math.min(0.02, dur / 3), vol, dur);
  s.connect(f); f.connect(gn); gn.connect(AU.out); s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.05);
}
const SFX = {
  boing(amt) {
    if (!ok()) return;
    const c = AU.ctx, t0 = c.currentTime, base = clamp(120 + amt * 0.35, 120, 300), dur = 0.6 + Math.min(0.5, amt / 600);
    const o = c.createOscillator(), lfo = c.createOscillator(), lg = c.createGain(), gn = c.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(base * 1.6, t0); o.frequency.exponentialRampToValueAtTime(base, t0 + 0.08);
    lfo.frequency.value = 13; lg.gain.setValueAtTime(base * 0.35, t0); lg.gain.exponentialRampToValueAtTime(1, t0 + dur);
    lfo.connect(lg); lg.connect(o.frequency); env(gn, t0, 0.01, 0.33, dur);
    o.connect(gn); gn.connect(AU.out); o.start(t0); lfo.start(t0); o.stop(t0 + dur + 0.05); lfo.stop(t0 + dur + 0.05);
  },
  stretch: null,
  stretchOn() {
    if (!ok() || SFX.stretch) return;
    const c = AU.ctx, o = c.createOscillator(), gn = c.createGain(), f = c.createBiquadFilter();
    o.type = 'triangle'; o.frequency.value = 160; f.type = 'lowpass'; f.frequency.value = 1200; gn.gain.value = 0;
    o.connect(f); f.connect(gn); gn.connect(AU.out); o.start();
    SFX.stretch = { o, gn };
  },
  stretchSet(len, speed) {
    const s = SFX.stretch; if (!s) return;
    const t = AU.ctx.currentTime;
    s.o.frequency.setTargetAtTime(150 + len * 1.1, t, 0.05);
    s.gn.gain.setTargetAtTime(S.muted ? 0 : clamp(speed * 0.05, 0, 0.09), t, 0.06);
  },
  stretchOff() {
    const s = SFX.stretch; if (!s) return; SFX.stretch = null;
    const t = AU.ctx.currentTime; s.gn.gain.setTargetAtTime(0, t, 0.03); s.o.stop(t + 0.2);
  },
  giggle() { const n = 4 + ((Math.random() * 3) | 0); for (let i = 0; i < n; i++) { const f = rnd(1050, 1350) * (1 - i * 0.04); tone('sine', f, f * 0.72, 0.09, 0.13, i * 0.12); tone('triangle', f / 2, f * 0.36, 0.09, 0.06, i * 0.12); } },
  pop() { tone('sine', 700, 180, 0.14, 0.3); noise(0.05, 0.15, 2500, 1); },
  chupa() { noise(0.04, 0.2, 3000, 2, 'highpass'); tone('sine', 500, 900, 0.1, 0.2, 0.04); },
  honk() { tone('square', 270, 200, 0.16, 0.09, 0, 1400); tone('sine', 280, 210, 0.16, 0.2); },
  puni() { tone('sine', 420, 240, 0.16, 0.28); },
  pyon() { tone('sine', 300, 1000, 0.2, 0.22); tone('triangle', 600, 1800, 0.14, 0.05, 0.03); },
  piko() { tone('square', 900, 900, 0.05, 0.07, 0, 3000); tone('square', 1200, 1200, 0.05, 0.07, 0.1, 3000); tone('square', 900, 900, 0.05, 0.07, 0.2, 3000); },
  sparkle() { [1568, 2093, 2637, 3136].forEach((f, i) => tone('triangle', f, f, 0.18, 0.07, i * 0.06)); },
  chu() { noise(0.035, 0.12, 2600, 3); tone('sine', 900, 500, 0.06, 0.08); },
  burp() { tone('sawtooth', 150, 85, 0.28, 0.2, 0, 700); },
  rattle() { for (let i = 0; i < 3; i++) noise(0.045, 0.22, rnd(2800, 4200), 4, 'bandpass', i * 0.035); },
  snore() { noise(1.1, 0.06, 380, 1.5, 'lowpass'); },
  bubble() { tone('sine', 1300, 300, 0.08, 0.2); },
  buru() {
    if (!ok()) return;
    const c = AU.ctx, t0 = c.currentTime, o = c.createOscillator(), lfo = c.createOscillator(), lg = c.createGain(), gn = c.createGain();
    o.type = 'sine'; o.frequency.value = 110; lfo.frequency.value = 22; lg.gain.value = 40; lfo.connect(lg); lg.connect(o.frequency);
    env(gn, t0, 0.02, 0.3, 0.8); o.connect(gn); gn.connect(AU.out); o.start(t0); lfo.start(t0); o.stop(t0 + 0.9); lfo.stop(t0 + 0.9);
  },
  find() { [523, 659, 784, 1047].forEach((f, i) => { tone('triangle', f, f, 0.22, 0.12, i * 0.09); tone('sine', f * 2, f * 2, 0.15, 0.04, i * 0.09); }); },
  tick() { tone('sine', 1500, 1200, 0.04, 0.08); },
  yawn() { tone('sine', 520, 300, 0.9, 0.08, 0, 900); },
};

/* こえ（よみあげ） */
const VO = { voice: null, last: 0, tried: false };
function pickVoice() { try { const vs = speechSynthesis.getVoices(); VO.voice = vs.find((v) => /^ja/i.test(v.lang)) || null; } catch (e) { VO.voice = null; } }
if ('speechSynthesis' in window) { pickVoice(); try { speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {} }
function say(text, force) {
  if (S.muted || !('speechSynthesis' in window)) return;
  if (!VO.voice) pickVoice(); if (!VO.voice) return;
  const now = performance.now(); if (!force && now - VO.last < 1300) return; VO.last = now;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'ja-JP'; u.voice = VO.voice; u.pitch = 2; u.rate = 1.05; u.volume = 0.9;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ================= キャンバス ================= */
const bgC = $('bg'), glC = $('gl'), fxC = $('fx');
const bg = bgC.getContext('2d'), fx = fxC.getContext('2d');
const tex = document.createElement('canvas');
const g = tex.getContext('2d');
let W = 0, H = 0, DPR = 1, TEX = 1024, TS = 1, scl = 1, ox = 0, oy = 0, Dsz = 0;

const gl = glC.getContext('webgl', { premultipliedAlpha: true, alpha: true, antialias: true });
if (!gl) { $('nogl').style.display = 'flex'; return; }
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, 'attribute vec2 p;attribute vec2 uv;varying vec2 v;void main(){v=uv;gl_Position=vec4(p,0.,1.);}'));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, 'precision mediump float;varying vec2 v;uniform sampler2D t;void main(){gl_FragColor=texture2D(t,v);}'));
gl.linkProgram(prog); gl.useProgram(prog);
const aP = gl.getAttribLocation(prog, 'p'), aUV = gl.getAttribLocation(prog, 'uv');

// メッシュ
const rx = new Float32Array(NV), ry = new Float32Array(NV), dx = new Float32Array(NV), dy = new Float32Array(NV);
const vx = new Float32Array(NV), vy = new Float32Array(NV), px = new Float32Array(NV), py = new Float32Array(NV);
const clip = new Float32Array(NV * 2), uvs = new Float32Array(NV * 2);
for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) {
  const k = j * (N + 1) + i; rx[k] = (i / N) * SZ; ry[k] = (j / N) * SZ; uvs[k * 2] = i / N; uvs[k * 2 + 1] = j / N;
}
const idx = new Uint16Array(N * N * 6);

        setTimeout(() => { SFX.burp(); talk('けぷっ'); found('milk'); laugh(1.6, 'まんま！'); const [hx, hy] = restToScreen(...P(0, 0)); burst('heart', hx, hy - Dsz * 0.2, 8, { up: true, sp: 260, size: 26 }); }, 350);
      }

  } else {

      t.x = lerp(t.x, hx + Math.sin(tt * 14) * 26, 0.2); t.y = lerp(t.y, hy, 0.2);

  }
}
function drawTool() {
  const t = tools.cur; if (!t) return;
  const s = Dsz / 1024;
  fx.save(); fx.translate(t.x, t.y); fx.rotate(t.ang); fx.scale(s, s); fx.lineJoin = 'round'; fx.lineCap = 'round';
  const o = (fill, lw = 8) => { fx.fillStyle = fill; fx.fill(); fx.lineWidth = lw; fx.strokeStyle = OL; fx.stroke(); };

    fx.beginPath(); fx.moveTo(-26, -118); fx.quadraticCurveTo(-30, -180, 0, -186); fx.quadraticCurveTo(30, -180, 26, -118); fx.closePath(); o('#f6c79a');

    fx.beginPath(); fx.roundRect ? fx.roundRect(-56, -94, 112, 196, 30) : fx.rect(-56, -94, 112, 196); o('rgba(255,255,255,.85)');
    const lv = Math.max(0, t.milk);
    fx.save(); fx.beginPath(); fx.roundRect ? fx.roundRect(-52, -90, 104, 188, 26) : fx.rect(-52, -90, 104, 188); fx.clip();
    fx.fillStyle = '#fffaf0'; fx.fillRect(-60, 98 - 180 * lv, 120, 200); fx.restore();
    fx.strokeStyle = '#7ac8ff'; fx.lineWidth = 5; for (let y = -50; y < 90; y += 34) { fx.beginPath(); fx.moveTo(20, y); fx.lineTo(44, y); fx.stroke(); }
    fx.fillStyle = 'rgba(255,255,255,.8)'; fx.fillRect(-40, -70, 12, 130);
  } else {
    fx.beginPath(); fx.moveTo(0, 30); fx.lineTo(0, 190); fx.lineWidth = 34; fx.strokeStyle = OL; fx.stroke(); fx.lineWidth = 18; fx.strokeStyle = '#ffd23f'; fx.stroke();
    fx.beginPath(); fx.arc(0, 200, 26, 0, TAU); o('#ff7ab5');
    fx.beginPath(); fx.arc(0, -50, 88, 0, TAU); o('#ffffff');
    fx.save(); fx.clip(); const cols = ['#ff7ab5', '#ffd23f', '#7ac8ff', '#9be08a'];
    for (let i = 0; i < 4; i++) { fx.fillStyle = cols[i]; fx.beginPath(); fx.moveTo(0, -50); fx.arc(0, -50, 100, (i / 4) * TAU + S.now, ((i + 0.5) / 4) * TAU + S.now); fx.fill(); } fx.restore();
    fx.beginPath(); fx.arc(0, -50, 88, 0, TAU); fx.lineWidth = 8; fx.strokeStyle = OL; fx.stroke();
    fx.beginPath(); fx.arc(-28, -80, 18, 0, TAU); fx.fillStyle = 'rgba(255,255,255,.7)'; fx.fill();
  }
  fx.restore();
}

/* いろを かえる モード */
const COLOR_PART = { me: 'eye', hana: 'skin', kao: 'skin', ago: 'skin', mimi: 'skin', hoppe: 'cheek', kuchi: 'paci', kami: 'hair', hat: 'hat', hane: 'wing', karada: 'body' };
function colorTap(rxp, ryp, sx, sy) {
  const x = rxp - FX, y = ryp - FY;
  let part = partAt(x, y);
  const gs = GLASSES[S.glasses];
  if (gs !== 'none' && (part === 'me' || (gs === 'hige' && (part === 'hana' || Math.hypot(x, y - 135) < 120)))) part = 'glass';
  const key = part === 'glass' ? 'glass' : COLOR_PART[part] || 'skin';
  if (key === 'paci' && !S.paci) S.paci = true;
  CI[key] = (CI[key] + 1) % PAL[key].length;
  const [name, col] = PAL[key][CI[key]];
  S.firstColor = true;
  const c = col && col !== 'rainbow' ? col : null;
  SFX.pop(); tone('triangle', 520 * Math.pow(2, CI[key] / 6), 520 * Math.pow(2, CI[key] / 6), 0.2, 0.1, 0.06); SFX.sparkle();
  talk(name + '！', 1.3, col || undefined); say(name, true);
  burst('star', sx, sy, 10, { sp: 260, size: 20, g: 60, col: c || undefined });
  impulse(rxp, ryp, 80, (ux, uy, w, dd) => [ux * 380 * w * Math.min(1, dd / 60), uy * 380 * w * Math.min(1, dd / 60)]);
  expr('happy', 'laugh', 0.9); S.blush = Math.min(1, S.blush + 0.2);
}
function setMode(m) {
  S.mode = m; document.body.classList.toggle('color', m === 'color');
  for (const b of document.querySelectorAll('#mode button')) b.classList.toggle('on', b.dataset.mode === m);
  try { localStorage.setItem('kao-ricky-mode', m); } catch (e) {}
}
for (const b of document.querySelectorAll('#mode button')) b.addEventListener('click', () => {
  if (S.mode === b.dataset.mode) return;
  auInit(); setMode(b.dataset.mode); SFX.sparkle(); wake(); S.lastTouch = S.now;
  talk(S.mode === 'color' ? 'いろを かえよう！' : 'ひっぱってね！', 1.6);
});
$('resetBtn').addEventListener('click', () => {

  SFX.sparkle(); SFX.pop(); talk('もとの いろ！'); laugh(1);
  const [hx, hy] = restToScreen(FX, FY); burst('star', hx, hy, 14, { sp: 380, size: 20 });
});

/* ボタン */
$('hatBtn').addEventListener('click', () => {

});
$('glassBtn').addEventListener('click', () => {
  if (!S.started) return; auInit(); S.lastTouch = S.now; wake();
  S.glasses = (S.glasses + 1) % GLASSES.length; SFX.pop();
  const [hx, hy] = restToScreen(...P(0, 10)); burst('star', hx, hy, 8, { sp: 280, size: 18, col: '#ffd23f' });
  impulse(...P(0, 10), 140, (ux, uy, w) => [ux * 400 * w, uy * 400 * w]);
  if (GLASSES[S.glasses] !== 'none') { found('megane'); talk(pick(['きらーん', 'みえる？', 'じゃじゃーん'])); laugh(1); } else talk('ぽん');
});
$('buruBtn').addEventListener('click', () => { if (!S.started) return; auInit(); S.lastTouch = S.now; shakeAll(); });
$('snd').addEventListener('click', () => { S.muted = !S.muted; $('snd').textContent = S.muted ? '🔇' : '🔊'; if (S.muted) { try { speechSynthesis.cancel(); } catch (e) {} SFX.stretchOff(); } else auInit(); });
$('star').addEventListener('click', () => {
  const ul = $('alist'); ul.innerHTML = '';
  for (const [id, name, em] of FINDS) { const li = document.createElement('li'); const f = S.found[id]; li.className = f ? '' : 'no'; li.innerHTML = '<em>' + (f ? em : '❔') + '</em>' + (f ? name : '？？？'); ul.appendChild(li); }

$('aclose').addEventListener('click', () => $('album').classList.add('hide'));
function startGame(mode) {

  SFX.sparkle(); talk('ばぶー！ リッキーだよ', 2); say('ばぶー！', true); laugh(1.5, 'ばぶー！');

}
$('start').addEventListener('click', () => startGame('stretch'));
$('startColor').addEventListener('click', () => startGame('color'));
updStar();

/* ================= まいフレーム ================= */
function updateState(dt) {
  const t = S.now;
  // みる ほうこう
  let tgt = null;
  if (tools.cur && !tools.cur.drop) tgt = [tools.cur.x, tools.cur.y];
  else if (grabs.size) { const gr = grabs.values().next().value; tgt = [gr.x, gr.y]; }
  else if (S.hover && t - (S.hoverT || 0) < 3) tgt = S.hover;
  const [cx, cy] = restToScreen(FX, FY);
  if (tgt) { S.tLookX = clamp((tgt[0] - cx) / (Dsz * 0.45), -1, 1); S.tLookY = clamp((tgt[1] - cy) / (Dsz * 0.45), -1, 1); }
  else if (t > S.wanderT) { S.wanderT = t + rnd(1.5, 3.5); S.tLookX = Math.random() < 0.4 ? 0 : rnd(-0.6, 0.6); S.tLookY = rnd(-0.3, 0.3); }
  if (S.sleep) { S.tLookX = 0; S.tLookY = 0.2; }
  const k = 1 - Math.exp(-dt * 7); S.lookX = lerp(S.lookX, S.tLookX, k); S.lookY = lerp(S.lookY, S.tLookY, k);
  // まばたき
  if (t > S.nextBlink) { S.blinkT = t; S.nextBlink = t + rnd(2.5, 5); }
  if (S.dblBlink && t > S.dblBlink) { S.blinkT = t; S.dblBlink = 0; }
  S.blush = Math.max(0, S.blush - dt * 0.25);
  S.noseSquish *= Math.exp(-dt * 8);
  // かみの け ばね
  S.tuftV += (-90 * S.tuft - 5 * S.tuftV) * dt; S.tuft += S.tuftV * dt;
  // ねんね
  if (S.started && !S.sleep && !grabs.size && !tools.cur && t - S.lastTouch > 22 && S.yawnUntil < t) {
    if (!S.yawnAt) { S.yawnAt = t; S.yawnUntil = t + 1.6; SFX.yawn(); talk('ふぁ〜'); say('ふぁー'); }
  }
  if (S.yawnAt && t > S.yawnUntil) { S.yawnAt = 0; if (t - S.lastTouch > 22) { S.sleep = true; found('nenne'); } }
  if (S.sleep) {
    S.snoreT -= dt;
    if (S.snoreT <= 0) { S.snoreT = 2.6; SFX.snore(); const [zx, zy] = restToScreen(...P(220, -260)); parts.push({ kind: 'z', x: zx, y: zy, vx: 40, vy: -60, life: 0, max: 2.4, size: 34, rot: 0, vr: 0, g: 0, text: 'Z' }); }
  }
  if (S.lastTouch > (S.yawnAt || 0) && S.yawnAt) { S.yawnAt = 0; S.yawnUntil = 0; }
}
function drawBG(t) {
  bg.setTransform(DPR, 0, 0, DPR, 0, 0);
  const gr = bg.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, S.sleep ? '#6a6ab8' : '#bfe3ff'); gr.addColorStop(1, S.sleep ? '#c9a8e0' : '#ffe0f0');
  bg.fillStyle = gr; bg.fillRect(0, 0, W, H);
  for (let i = 0; i < 14; i++) {
    const x = ((i * 137.5 + t * (6 + (i % 3) * 3)) % (W + 120)) - 60, y = ((i * 89) % Math.max(1, H - 100)) + 30;
    bg.globalAlpha = S.sleep ? 0.9 : 0.45;
    if (S.sleep || i % 2) { bg.fillStyle = S.sleep ? '#fff6c0' : '#ffffff'; bg.save(); bg.translate(x, y); bg.rotate(t * 0.3 + i); bg.beginPath(); starPath(bg, 0, 0, 9 + (i % 4) * 3 + Math.sin(t * 3 + i) * 2, 4 + (i % 4)); bg.fill(); bg.restore(); }
    else { bg.fillStyle = '#ffffff'; bg.beginPath(); bg.arc(x, y, 18 + (i % 3) * 8, 0, TAU); bg.arc(x + 24, y + 6, 14 + (i % 3) * 6, 0, TAU); bg.arc(x - 22, y + 8, 12 + (i % 3) * 5, 0, TAU); bg.fill(); }
  }
  bg.globalAlpha = 1;
  const [sx, sy] = [W / 2, oy + (FY + 460) * scl];
  bg.fillStyle = 'rgba(120,60,110,.13)'; bg.beginPath(); bg.ellipse(sx, sy, Dsz * 0.32, Dsz * 0.04, 0, 0, TAU); bg.fill();
}
function drawFX(t, dt) {
  fx.setTransform(DPR, 0, 0, DPR, 0, 0); fx.clearRect(0, 0, W, H);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life += dt; if (p.life > p.max) { parts.splice(i, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.kind !== 'paci') { p.vx *= Math.pow(0.3, dt); if (p.g < 200) p.vy *= Math.pow(0.4, dt); }
    const a = Math.min(1, (p.max - p.life) * 3, p.life * 12);
    fx.save(); fx.globalAlpha = a; fx.translate(p.x, p.y); fx.rotate(p.rot); fx.fillStyle = p.col;
    if (p.kind === 'heart') { heartPath(fx, 0, 0, p.size * 2); fx.fill(); }
    else if (p.kind === 'star') { starPath(fx, 0, 0, p.size, p.size * 0.45); fx.fill(); }
    else if (p.kind === 'drop') { fx.beginPath(); fx.arc(0, 0, p.size * 0.5, 0, TAU); fx.fill(); }
    else if (p.kind === 'confetti') { fx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); }
    else if (p.kind === 'note' || p.kind === 'z') {
      fx.font = '900 ' + p.size * (p.kind === 'z' ? 0.8 + p.life * 0.4 : 1) + 'px sans-serif'; fx.textAlign = 'center'; fx.textBaseline = 'middle';
      fx.lineWidth = 6; fx.strokeStyle = '#fff'; fx.fillStyle = p.kind === 'z' ? '#6a6ab8' : p.col; fx.strokeText(p.text, 0, 0); fx.fillText(p.text, 0, 0);
    } else if (p.kind === 'paci') {
      const s = p.size / 200; fx.scale(s, s); fx.lineWidth = 22; fx.strokeStyle = OL; fx.beginPath(); fx.arc(0, 48, 32, 0, TAU); fx.stroke(); fx.lineWidth = 12; fx.strokeStyle = pc('paci', 2); fx.stroke();
      fx.beginPath(); fx.ellipse(0, 0, 92, 56, 0, 0, TAU); fx.fillStyle = pc('paci'); fx.fill(); fx.lineWidth = 10; fx.strokeStyle = OL; fx.stroke();
      fx.beginPath(); fx.arc(0, 4, 24, 0, TAU); fx.fillStyle = pc('paci', 2); fx.fill(); fx.lineWidth = 8; fx.stroke();
    }
    fx.restore();
  }
  drawTool();
  // ふきだし
  if (bubble) {
    const e = t - bubble.t0; if (e > bubble.dur) bubble = null;
    else {
      const [hx, hy] = restToScreen(...P(250, -330));
      const pop = Math.min(1, e * 8), sc = 0.6 + 0.4 * pop + Math.sin(Math.min(1, e * 8) * Math.PI) * 0.12;
      const fs = clamp(Dsz * 0.055, 18, 34);
      fx.font = '900 ' + fs + 'px "Hiragino Maru Gothic ProN","Yu Gothic",sans-serif';
      const tw = fx.measureText(bubble.text).width + fs * 1.2, th = fs * 1.9;
      const bx = clamp(hx, tw / 2 + 8, W - tw / 2 - 8), by = clamp(hy, 70 + th / 2, H - 120);
      fx.save(); fx.translate(bx, by); fx.scale(sc, sc); fx.globalAlpha = Math.min(1, (bubble.dur - e) * 4);
      fx.beginPath(); if (fx.roundRect) fx.roundRect(-tw / 2, -th / 2, tw, th, th / 2); else fx.rect(-tw / 2, -th / 2, tw, th);
      fx.fillStyle = '#fff'; fx.fill(); fx.lineWidth = bubble.col ? 9 : 4; fx.strokeStyle = bubble.col && bubble.col !== 'rainbow' && bubble.col !== '#ffffff' && bubble.col !== '#f4f4f4' ? bubble.col : '#ff9cc6'; fx.stroke();
      fx.beginPath(); fx.moveTo(-tw * 0.25, th / 2 - 2); fx.lineTo(-tw * 0.38, th / 2 + fs * 0.6); fx.lineTo(-tw * 0.1, th / 2 - 2); fx.fillStyle = '#fff'; fx.fill();
      fx.fillStyle = '#e04a8c'; fx.textAlign = 'center'; fx.textBaseline = 'middle'; fx.fillText(bubble.text, 0, 2);
      fx.restore();
    }
  }
  // さいしょの ヒント（ほっぺを つまんで ひっぱる）
  const colorHint = S.mode === 'color';
  if (S.started && (colorHint ? !S.firstColor : !S.firstGrab)) {
    const [hx, hy] = restToScreen(...P(186, 128)), ph = (t * 0.8) % 1, k = colorHint ? Math.abs(Math.sin(t * 5)) * 0.15 : Math.sin(Math.min(1, ph * 1.4) * Math.PI / 2);
    fx.save(); fx.globalAlpha = colorHint || ph < 0.85 ? 1 : (1 - ph) / 0.15;
    fx.font = Math.round(Dsz * 0.1) + 'px sans-serif'; fx.textAlign = 'left'; fx.textBaseline = 'top';
    fx.fillText('👆', hx + k * Dsz * 0.12 - Dsz * 0.03, hy + k * Dsz * 0.06 - Dsz * 0.01);
    fx.restore();
    fx.font = '900 ' + clamp(Dsz * 0.045, 15, 24) + 'px "Hiragino Maru Gothic ProN",sans-serif'; fx.textAlign = 'center';
    fx.lineWidth = 6; fx.strokeStyle = '#fff'; fx.fillStyle = '#e04a8c';
    const ty = Math.min(H - 118, oy + 850 * scl);
    const msg = colorHint ? 'さわった ところの いろが かわるよ' : 'かおを つまんで ひっぱってみてね';
    fx.strokeText(msg, W / 2, ty); fx.fillText(msg, W / 2, ty);
  }
}

let last = performance.now(), acc = 0, slow = 0, frame = 0;
function loop(nowMs) {
  let dt = (nowMs - last) / 1000; last = nowMs; dt = Math.min(dt, 1 / 20);
  S.now += dt;
  slow = lerp(slow, dt, 0.05); frame++;
  updateGrabs();
  updateState(dt);
  updateTool(dt);
  acc += dt; const h = 1 / 240; let n = 0;
  while (acc >= h && n < 12) { step(h); acc -= h; n++; }
  if (n >= 12) acc = 0;
  computePositions(S.now);
  resolveExpr(S.now);
  if (slow < 0.024 || frame % 2 === 0) {
    drawTexture(S.now);
    gl.bindTexture(gl.TEXTURE_2D, glTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, tex);
  }
  drawBG(S.now);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindBuffer(gl.ARRAY_BUFFER, pBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, clip);
  gl.drawElements(gl.TRIANGLES, idx.length, gl.UNSIGNED_SHORT, 0);
  drawFX(S.now, dt);
  requestAnimationFrame(loop);
}
glC.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') S.hoverT = S.now; });
layout();
requestAnimationFrame(loop);
window.KAO = { S, grabs, tapPart, P, restToScreen, found, shakeAll };
})();
