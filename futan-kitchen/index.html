<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ff4f3a">
<title>ふーたんの はちゃめちゃ キッチン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--red:#ff4f3a;--red2:#d8321f;--yel:#ffcf2e;--yel2:#e9a90c;--teal:#17b3a3;--teal2:#0d8a7d;--blue:#3d8bff;--pur:#8a5ae0;--cream:#fff6e2;--ink:#2a1a12;--paper:#fffdf6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1a12;color:var(--ink);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;font-weight:800;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hide{display:none!important}
.dg{font-family:"Dela Gothic One","M PLUS Rounded 1c",sans-serif;font-weight:400}
button{font:inherit;color:inherit;cursor:pointer}
#fade{position:fixed;inset:0;background:#2a1a12;opacity:0;pointer-events:none;z-index:60;transition:opacity .35s}

/* sticker button */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:4px solid var(--ink);border-radius:18px;background:var(--yel);color:var(--ink);font-size:clamp(17px,2.6vw,24px);padding:10px 22px;box-shadow:0 6px 0 var(--ink);transition:transform .08s,box-shadow .08s;line-height:1.2;outline:none}
.btn:hover,.btn:focus-visible{transform:translateY(-2px) rotate(-1deg);box-shadow:0 8px 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn.red{background:var(--red);color:#fff}
.btn.teal{background:var(--teal);color:#fff}
.btn.white{background:#fff}
.btn.sm{font-size:15px;padding:6px 14px;border-width:3px;box-shadow:0 4px 0 var(--ink);border-radius:14px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* full screens */
.scr{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom))}
.gingham{background-color:#fff;background-image:linear-gradient(90deg,rgba(255,79,58,.55) 50%,transparent 50%),linear-gradient(rgba(255,79,58,.55) 50%,transparent 50%);background-size:56px 56px}
.card{background:var(--paper);border:5px solid var(--ink);border-radius:28px;box-shadow:0 10px 0 var(--ink);padding:20px 24px;max-width:min(94vw,760px);max-height:calc(100vh - 32px);overflow:auto;position:relative}

/* ---------- title ---------- */
#title{flex-direction:column;justify-content:space-between;background:linear-gradient(rgba(42,26,18,.0),rgba(42,26,18,.35))}
#logo{margin-top:min(4vh,30px);text-align:center;transform:rotate(-3deg);filter:drop-shadow(0 8px 0 rgba(42,26,18,.85))}
#logo .s1{display:inline-block;background:var(--teal);color:#fff;border:4px solid var(--ink);border-radius:999px;padding:2px 22px;font-size:clamp(18px,3.2vw,30px);transform:rotate(4deg) translateY(10px);position:relative;z-index:2}
#logo .s2{display:block;font-size:clamp(40px,9vw,96px);line-height:1.05;color:var(--yel);-webkit-text-stroke:clamp(6px,1vw,10px) var(--ink);paint-order:stroke fill;letter-spacing:.02em}
#logo .s2 span{color:var(--red)}
#logo .s3{display:inline-block;margin-top:4px;background:#fff;border:4px solid var(--ink);border-radius:12px;padding:0 14px;font-size:clamp(13px,2vw,18px)}
#tmenu{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:min(4vh,30px)}
#tmenu .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.opt{display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.92);border:3px solid var(--ink);border-radius:14px;padding:4px 6px 4px 12px;font-size:15px}
.opt button{border:3px solid var(--ink);border-radius:10px;background:#fff;padding:3px 10px;font-size:15px}
.opt button.on{background:var(--yel)}
#back{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));color:#fff;font-size:13px;text-decoration:none;background:rgba(42,26,18,.6);border-radius:10px;padding:4px 10px}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:8}
#orders{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));display:flex;gap:8px;align-items:flex-start;max-width:calc(100vw - 190px)}
.tk{width:clamp(78px,10vw,104px);background:var(--paper);border:3px solid var(--ink);border-radius:10px 10px 4px 4px;box-shadow:0 4px 0 rgba(42,26,18,.7);position:relative;padding:12px 4px 6px;text-align:center;animation:tkin .45s cubic-bezier(.3,1.6,.5,1);transform-origin:top center}
.tk:after{content:"";position:absolute;left:-3px;right:-3px;bottom:-9px;height:10px;background:linear-gradient(135deg,var(--paper) 33%,transparent 33%) 0 0/10px 10px,linear-gradient(225deg,var(--paper) 33%,transparent 33%) 0 0/10px 10px}
.tk .tb{position:absolute;left:4px;right:4px;top:4px;height:6px;border-radius:4px;background:#e5dccb;overflow:hidden}
.tk .tb i{display:block;height:100%;background:var(--teal);border-radius:4px}
.tk .tb i.mid{background:var(--yel2)}.tk .tb i.low{background:var(--red)}
.tk .dish{display:block;width:clamp(40px,5.4vw,58px);height:clamp(40px,5.4vw,58px);margin:0 auto}
.tk .nm{font-size:clamp(10px,1.2vw,13px);line-height:1.15;margin-top:1px}
.tk .cs{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;margin-top:3px}
.tk .cs .ci{width:clamp(20px,2.6vw,28px);height:clamp(20px,2.6vw,28px);position:relative;background:#f2ead8;border-radius:6px}
.tk .cs .ci img{width:100%;height:100%}
.tk .cs .ci b{position:absolute;right:-4px;bottom:-4px;width:58%;height:58%}
.tk .cs .ci b img{width:100%;height:100%}
.tk.shake{animation:tksh .5s infinite}
.tk.done{animation:tkok .5s forwards}
.tk.bad{animation:tkbad .6s forwards}
@keyframes tkin{from{transform:translateY(-120%) rotate(-8deg)}to{transform:none}}
@keyframes tksh{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
@keyframes tkok{to{transform:translateY(-140%) scale(1.2);opacity:0}}
@keyframes tkbad{30%{transform:rotate(8deg);background:#ffb0a0}to{transform:translateY(60%) rotate(20deg);opacity:0}}
#clock{position:absolute;right:max(70px,calc(env(safe-area-inset-right) + 62px));top:max(8px,env(safe-area-inset-top));width:clamp(74px,9vw,96px);height:clamp(74px,9vw,96px);border-radius:50%;border:4px solid var(--ink);background:var(--paper);box-shadow:0 5px 0 rgba(42,26,18,.75);display:flex;align-items:center;justify-content:center}
#clock .ring{position:absolute;inset:5px;border-radius:50%;background:conic-gradient(var(--teal) calc(var(--p)*1%),#eadfca 0)}
#clock .ring:after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--paper)}
#clockT{position:relative;font-size:clamp(18px,2.4vw,24px)}
#clock.low .ring{background:conic-gradient(var(--red) calc(var(--p)*1%),#eadfca 0)}
#clock.low{animation:tksh .6s infinite}
#bPause{position:absolute;pointer-events:auto;right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));width:50px;height:50px;border-radius:14px;border:4px solid var(--ink);background:#fff;font-size:18px;box-shadow:0 4px 0 var(--ink)}
#coin{position:absolute;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:6px;background:var(--yel);border:4px solid var(--ink);border-radius:999px;padding:2px 18px 2px 6px;box-shadow:0 5px 0 rgba(42,26,18,.75);font-size:clamp(22px,3vw,30px)}
#coin b{display:inline-flex;width:38px;height:38px;border-radius:50%;background:#ffe27a;border:3px solid var(--ink);align-items:center;justify-content:center;font-size:20px}
#coin.pop{animation:cpop .3s}
@keyframes cpop{50%{transform:scale(1.18)}}
#tips{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:calc(max(10px,env(safe-area-inset-bottom)) + 62px);font-size:15px;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill}
#boss{position:absolute;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 34px);transform:translateX(-50%);width:min(36vw,300px);text-align:center;font-size:13px;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill}
#boss .b{height:20px;border:4px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;margin-top:2px}
#boss .b i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,#ff8ac0 0 10px,#ff5fa2 10px 20px);transition:width .4s}
#hint{position:absolute;left:50%;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 8px);transform:translateX(-50%);background:rgba(255,253,246,.95);border:4px solid var(--ink);border-radius:16px;padding:4px 16px;font-size:clamp(15px,2.2vw,20px);white-space:nowrap;box-shadow:0 4px 0 rgba(42,26,18,.6)}
#hint:empty{display:none}
#big{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-family:"Dela Gothic One",sans-serif;font-size:clamp(46px,11vw,120px);color:var(--yel);-webkit-text-stroke:clamp(7px,1.2vw,12px) var(--ink);paint-order:stroke fill;white-space:nowrap;pointer-events:none;opacity:0}
#big.show{animation:bigin 1s cubic-bezier(.3,1.7,.5,1) forwards}
#big.red{color:var(--red)}
@keyframes bigin{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-10deg)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.08) rotate(-3deg)}80%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-3deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15) rotate(-3deg)}}
#who{position:absolute;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 2px);z-index:2;transform:translateX(-50%);font-size:14px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:1px 12px;opacity:0;transition:opacity .3s}
#who.on{opacity:1}

/* floating world-space widgets */
#floats{position:fixed;inset:0;pointer-events:none;z-index:7;overflow:hidden}
.fl{position:absolute;left:0;top:0;will-change:transform}
.fl.bar{width:46px;height:11px;margin:-6px 0 0 -23px;border:3px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden}
.fl.bar i{display:block;height:100%;background:#3fd06a}
.fl.bar.cook i{background:#ffb21e}.fl.bar.wash i{background:#4ab0ff}.fl.bar.fire i{background:#ff3b2a}
.fl.icons{display:flex;gap:1px;transform-origin:50% 100%}
.fl.icons img{width:26px;height:26px;background:#fff;border:2px solid var(--ink);border-radius:8px;margin-left:-2px}
.fl.warn{width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:3px solid var(--ink);background:var(--red);color:#fff;text-align:center;line-height:28px;font-size:22px;animation:blink .35s infinite alternate}
.fl.ok{width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid var(--ink);background:#3fd06a;color:#fff;text-align:center;line-height:24px;font-size:18px}
.fl.pts{font-family:"Dela Gothic One",sans-serif;font-size:30px;color:var(--yel);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;white-space:nowrap;transform-origin:center}
.fl.pts.bad{color:var(--red)}
.fl.say{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:1px 9px;font-size:15px;white-space:nowrap;margin:-14px 0 0 0;translate:-50% 0}
.fl.mark{font-size:22px;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;translate:-50% 0;white-space:nowrap}
@keyframes blink{to{transform:scale(1.2)}}

/* touch controls */
#tc{position:fixed;inset:0;z-index:9;pointer-events:none}
#stickZone{position:absolute;left:0;bottom:0;width:50%;height:70%;pointer-events:auto;touch-action:none}
#stickBase{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;border:4px solid rgba(255,255,255,.85);background:rgba(42,26,18,.25);pointer-events:none}
#stickKnob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:#fff;border:4px solid var(--ink)}
#stickHint{position:absolute;left:max(30px,env(safe-area-inset-left));bottom:max(40px,env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;border:4px dashed rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:13px;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;pointer-events:none}
.tb2{position:absolute;pointer-events:auto;touch-action:none;border:4px solid var(--ink);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0;box-shadow:0 5px 0 var(--ink);color:#fff}
.tb2 .i{font-size:30px}
.tb2 .l{font-size:12px;margin-top:2px;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;white-space:nowrap}
.tb2.on{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
#tPick{right:max(20px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));width:96px;height:96px;background:var(--teal)}
#tPick .i{font-size:40px}
#tAct{right:calc(max(20px,env(safe-area-inset-right)) + 108px);bottom:max(14px,env(safe-area-inset-bottom));width:80px;height:80px;background:var(--red)}
#tDash{right:calc(max(20px,env(safe-area-inset-right)) + 14px);bottom:calc(max(22px,env(safe-area-inset-bottom)) + 108px);width:66px;height:66px;background:var(--blue)}
#tDash .i,#tSwap .i{font-size:24px}
#tc.maponly .tb2{display:none}
#tSwap{right:calc(max(20px,env(safe-area-inset-right)) + 96px);bottom:calc(max(22px,env(safe-area-inset-bottom)) + 92px);width:66px;height:66px;background:var(--pur)}

/* ---------- map ---------- */
#mapUI{position:fixed;inset:0;z-index:8;pointer-events:none}
#mapTop{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));display:flex;gap:8px;pointer-events:auto}
#starTotal{background:var(--yel);border:4px solid var(--ink);border-radius:999px;padding:2px 16px;font-size:22px;box-shadow:0 4px 0 var(--ink)}
#mapHelp{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(255,253,246,.95);border:4px solid var(--ink);border-radius:16px;padding:4px 16px;font-size:clamp(14px,2vw,18px);white-space:nowrap}
#stage{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%) rotate(-1.5deg);pointer-events:auto;text-align:center;min-width:min(90vw,380px);padding:14px 20px 18px;animation:tkin .4s cubic-bezier(.3,1.6,.5,1)}
#stage .no{display:inline-block;background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:10px;padding:0 12px;font-size:18px}
#stage .nm{font-size:clamp(18px,2.6vw,26px);margin:4px 0 0}
#stage .st{font-size:28px;letter-spacing:4px;color:#d8ccb4;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
#stage .st b{color:var(--yel);font-weight:400}
#stage .rc{display:flex;gap:6px;justify-content:center;margin:4px 0 10px}
#stage .rc img{width:44px;height:44px;background:#f2ead8;border:3px solid var(--ink);border-radius:12px}
#stage .lock{font-size:16px;color:#8a7a6a;margin:6px 0}

/* intro (recipe card) */
#intro .card{text-align:center;transform:rotate(-1deg)}
#intro .no{display:inline-block;background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:10px;padding:0 12px;font-size:18px}
#intro h2{margin:6px 0 10px;font-size:clamp(22px,4vw,34px);font-family:"Dela Gothic One",sans-serif;font-weight:400}
.recipes{display:flex;flex-direction:column;gap:8px;margin:8px auto 10px;max-width:640px}
.rcp{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:6px 10px;flex-wrap:wrap;justify-content:center}
.rcp .dish{width:54px;height:54px}
.rcp .eq{font-size:22px}
.rcp .chain{display:flex;align-items:center;gap:2px;background:#f6efe0;border-radius:12px;padding:2px 6px}
.rcp .chain img{width:32px;height:32px}
.rcp .chain .ar{font-size:14px;color:#a08a70}
.rcp .nm{font-size:16px;min-width:90px;text-align:left}
.talk{display:flex;align-items:center;gap:10px;text-align:left;background:#fff3c4;border:3px solid var(--ink);border-radius:16px;padding:8px 12px;margin:6px 0 12px;font-size:clamp(14px,2.1vw,18px);line-height:1.5}
.talk img{width:64px;height:64px;border-radius:50%;border:3px solid var(--ink);background:#ffe9a8;flex:none}
.keys{font-size:13px;color:#7a6a5a;margin-top:10px;line-height:1.6}
.keys kbd{display:inline-block;background:#fff;border:2px solid var(--ink);border-radius:6px;padding:0 6px;font:inherit;font-size:12px}

/* pause & result */
#pauseM .card,#result .card{text-align:center}
#pauseM .card{display:flex;flex-direction:column;gap:14px;align-items:stretch;min-width:280px}
#pauseM h2,#result h2{margin:0 0 6px;font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:clamp(26px,5vw,44px)}
#rStars{display:flex;justify-content:center;gap:10px;margin:6px 0}
#rStars span{font-size:clamp(54px,10vw,84px);color:#e2d7c2;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;transform:scale(0);display:inline-block}
#rStars span.got{color:var(--yel)}
#rStars span.pop{animation:spop .5s cubic-bezier(.3,1.8,.5,1) forwards}
@keyframes spop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
#rTable{margin:6px auto 10px;font-size:18px;border-collapse:collapse;min-width:260px}
#rTable td{padding:3px 10px;border-bottom:2px dashed #d8ccb4}
#rTable td:last-child{text-align:right}
#rTable tr.tot td{font-size:26px;border:none}
#rNeed{font-size:14px;color:#8a7a6a;margin-bottom:10px}
#result .row,#pauseM .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* story */
#story{position:fixed;inset:0;z-index:20}
#story .bars:before,#story .bars:after{content:"";position:fixed;left:0;right:0;height:7vh;background:var(--ink)}
#story .bars:before{top:0}#story .bars:after{bottom:0}
#bub{position:absolute;left:50%;bottom:calc(7vh + 14px);transform:translateX(-50%);width:min(94vw,780px);min-height:110px;background:#fff;border:5px solid var(--ink);border-radius:30px;padding:16px 22px 16px 120px;font-size:clamp(17px,2.7vw,24px);line-height:1.55;box-shadow:0 8px 0 var(--ink);cursor:pointer}
#bub.nar{padding-left:22px;background:var(--ink);color:#fff;border-color:#fff;text-align:center}
#bub .pt{position:absolute;left:12px;bottom:12px;width:96px;height:96px;border-radius:50%;border:4px solid var(--ink);overflow:hidden;background:#ffe9a8}
#bub.nar .pt,#bub.nar .nm{display:none}
#bub .pt img{width:100%;height:100%}
#bub .nm{position:absolute;left:110px;top:-22px;background:var(--red);color:#fff;border:4px solid var(--ink);border-radius:12px;padding:0 14px;font-size:17px;line-height:32px}
#bub .nx{position:absolute;right:16px;bottom:6px;font-size:16px;animation:blink .5s infinite alternate}
#bub.boom{animation:boom .4s}
@keyframes boom{20%{transform:translateX(-52%) rotate(-2deg)}40%{transform:translateX(-48%) rotate(2deg)}60%{transform:translateX(-51%)}}
#skip{position:absolute;right:max(12px,env(safe-area-inset-right));top:calc(7vh + 10px);z-index:2}
#help .card h2{margin:0 0 8px;font-family:"Dela Gothic One",sans-serif;font-weight:400}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;text-align:left;margin:10px 0 14px}
.hgrid div{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 10px;font-size:15px;line-height:1.5}
.hgrid div b{display:block;font-size:17px}
@media (max-height:520px){#logo{margin-top:4px}#logo .s2{font-size:clamp(34px,7vw,70px)}.tk{width:72px}#tmenu{gap:8px}
 .card{padding:10px 14px;border-radius:20px;box-shadow:0 6px 0 var(--ink)}
 #intro h2{margin:2px 0 4px;font-size:22px}
 .recipes{gap:4px;margin:4px auto 6px}
 .rcp{padding:2px 8px;gap:4px}.rcp .dish{width:36px;height:36px}.rcp .chain img{width:24px;height:24px}.rcp .nm{font-size:14px;min-width:70px}
 .talk{padding:4px 8px;margin:4px 0 8px;font-size:13px;line-height:1.4}.talk img{width:42px;height:42px}
 .keys{display:none}

  saladL(x, S) { x.font = `${S * 0.66}px ${EMOJI_FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle'; ICON_DRAW.plate(x, S); x.fillText('🥬', 48, 46); },
};

// ================================================================ input
const Keys = {};
addEventListener('keydown', e => {
  if (e.repeat) { if (APP.mode === 'play' || APP.mode === 'map') e.preventDefault(); return; }

  if (/^(Arrow|Space|Tab|Enter)/.test(e.code) || ((APP.mode === 'play' || APP.mode === 'map') && /^(Shift|Control|Slash|Period)/.test(e.code))) e.preventDefault();
  if (e.code === 'Escape' || e.code === 'KeyP') Hooks.pause && Hooks.pause();
  Sound.unlock();
});
addEventListener('keyup', e => { Keys[e.code] = 0; });
addEventListener('blur', () => { for (const k in Keys) Keys[k] = 0; });
const KB = {
  all: { u: ['KeyW', 'ArrowUp'], d: ['KeyS', 'ArrowDown'], l: ['KeyA', 'ArrowLeft'], r: ['KeyD', 'ArrowRight'], pick: ['Space', 'Enter', 'KeyJ'], act: ['KeyE', 'KeyX', 'KeyK', 'ControlLeft', 'ControlRight'], dash: ['ShiftLeft', 'ShiftRight', 'KeyL'], swap: ['Tab', 'KeyQ'] },
  p1: { u: ['KeyW'], d: ['KeyS'], l: ['KeyA'], r: ['KeyD'], pick: ['Space'], act: ['KeyE'], dash: ['ShiftLeft'], swap: [] },
  p2: { u: ['ArrowUp'], d: ['ArrowDown'], l: ['ArrowLeft'], r: ['ArrowRight'], pick: ['Enter'], act: ['ShiftRight', 'Period'], dash: ['Slash', 'ControlRight'], swap: [] },
};
const anyK = a => a.some(k => Keys[k]);
const TouchCtl = { x: 0, y: 0, pick: 0, act: 0, dash: 0, swap: 0 };

  if (Math.hypot(x, y) < 0.22) x = y = 0;
  x += b(15) - b(14); y += b(13) - b(12);
  return { x, y, pick: b(0), act: b(2), dash: b(1) || b(5), swap: b(3) || b(4), start: b(9) };
}
const BTN = ['pick', 'act', 'dash', 'swap'];
class Ctl {
  constructor(srcs) { this.srcs = srcs; this.cur = {}; this.pressed = {}; this.x = 0; this.y = 0; }

    let x = 0, y = 0; const b = { pick: 0, act: 0, dash: 0, swap: 0 };
    for (const s of this.srcs) {
      if (KB[s]) { const k = KB[s]; x += (anyK(k.r) ? 1 : 0) - (anyK(k.l) ? 1 : 0); y += (anyK(k.d) ? 1 : 0) - (anyK(k.u) ? 1 : 0); for (const n of BTN) if (anyK(k[n])) b[n] = 1; }

// touch joystick + buttons
(() => {

    e.preventDefault(); Sound.unlock();

function animChef(P, s, dt) {
  P.t += dt; const t = P.t, mv = s.move || 0;

  P.armL.rotation.x = lerp(P.armL.rotation.x, aL, k); P.armR.rotation.x = lerp(P.armR.rotation.x, aR, k);

}

  const key = ing.st === 'chop' ? ing.id + '_c' : ing.id;

  const recs = (pot.pt === 'pot' ? POT_RECIPES : PAN_RECIPES).filter(r => levelUses(r.out));

}

        + `<div class="rc">${L.recipes.map(r => `<img src="${iconURL(RECIPES[r].ic)}" alt="${RECIPES[r].n}">`).join('')}</div>`
        + (best ? `<div style="font-size:14px;margin-bottom:8px">ベスト ${best}てん</div>` : '')
        + `<button class="btn red" id="stGo">▶ スタート${isTouch ? '' : '（スペース）'}</button>`
        : `<div class="lock">🔒 まえの ステージで ★を 1こ いじょう とってね</div>`);
    el.classList.remove('hide');
    el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
    const b = $('#stGo'); if (b) b.onclick = () => { Sound.unlock(); Sound.sfx('click'); Game.openIntro(i); };
  },
};
// ================================================================ views
function setView(v) {
  K.root.visible = K.env.visible = v === 'kitchen';
  MapW.root.visible = v === 'map';
  Story.root.visible = v === 'story';
  if (v !== 'kitchen') Floats.end();
  if (v === 'story') { scene.background.setHex(0x9fdcff); camera.fov = VW < VH ? 60 : 45; camera.updateProjectionMatrix(); aimSun(0, 0); }
}
const show = (id, on) => $(id).classList.toggle('hide', !on);
function blurAll() { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); }

// ================================================================ game flow
const Game = {
  lv: 0, menuCtl: new Ctl(['all', 'touch', 'pad0']), endT: 0, resultFor: null,
  toTitle() {
    APP.mode = 'title'; Voice.stop();
    for (const s of ['#hud', '#tc', '#intro', '#result', '#pauseM', '#mapUI', '#story', '#help']) show(s, false);
    MapW.leave();
    show('#title', true);
    buildKitchen(LEVELS[0]); setupPlayers(); K.phase = 'off'; K.easy = Save.d.diff === 'easy';
    setView('kitchen'); K.titleT = 0;
    Music.play('title');
  },
  start(twoP) {
    APP.twoP = twoP; Sound.unlock(); Sound.sfx('click');
    show('#title', false);
    if (!Save.d.seenIntro) Story.play('intro', () => { Save.d.seenIntro = 1; Save.write(); this.toMap(0); });
    else this.toMap();
  },
  toMap(focus) {
    for (const s of ['#hud', '#intro', '#result', '#pauseM', '#title']) show(s, false);
    show('#tc', false);
    Floats.clear(); clearKitchen();
    if (focus == null) { focus = 0; for (let i = 0; i < LEVELS.length; i++) if (MapW.unlocked(i)) focus = i; }
    MapW.enter(focus);
  },
  openIntro(i) {
    const L = LEVELS[i];
    if (L.boss && !Save.d.seenBoss) { MapW.leave(); Story.play('boss', () => { Save.d.seenBoss = 1; Save.write(); this.openIntro(i); }); return; }
    this.lv = i; MapW.leave(); show('#title', false);
    APP.mode = 'intro'; setView('kitchen');
    K.easy = Save.d.diff === 'easy';
    buildKitchen(L); setupPlayers(); K.phase = 'off'; K.t = 0;
    Music.play(K.th.music);
    fitKitchenCam(0, true);
    const chain = k => COMP[k].how.map(x => x.startsWith('×') ? `<b style="font-size:16px">${x}</b>` : `<img src="${iconURL(x)}" alt="">`).join('<span class="ar">▸</span>').replace(/<span class="ar">▸<\/span><b/g, '<b');
    const kb = isTouch ? '' : APP.twoP
      ? `<div class="keys">1P: <kbd>WASD</kbd> いどう <kbd>スペース</kbd> つかむ・おく <kbd>E</kbd> きる・あらう${L.throw ? '・なげる' : ''} <kbd>左Shift</kbd> ダッシュ<br>2P: <kbd>↑↓←→</kbd> いどう <kbd>Enter</kbd> つかむ・おく <kbd>右Shift</kbd> きる・あらう <kbd>/</kbd> ダッシュ　（ゲームパッドも OK）</div>`
      : `<div class="keys"><kbd>↑↓←→</kbd>/<kbd>WASD</kbd> いどう　<kbd>スペース</kbd> つかむ・おく　<kbd>E</kbd> きる・あらう${L.throw ? '・なげる' : ''}${L.fire || L.erupt ? '・けす' : ''}　<kbd>Shift</kbd> ダッシュ　<kbd>Tab</kbd> こうたい</div>`;
    $('#introC').innerHTML = `<div class="no">ステージ ${L.id}</div><h2>${L.name}</h2>
      <div class="recipes">${L.recipes.map(r => { const R = RECIPES[r]; return `<div class="rcp"><img class="dish" src="${iconURL(R.ic)}" alt=""><span class="nm">${R.n}</span><span class="eq">＝</span>${R.items.map(k => `<span class="chain">${chain(k)}</span>`).join('<span class="eq">＋</span>')}</div>`; }).join('')}</div>
      <div class="talk"><img src="${PORTRAIT.enchou}" alt=""><div>${L.talk}</div></div>
      <button class="btn red" id="goBtn">🍳 スタート！${isTouch ? '' : '（スペース）'}</button>${kb}`;
    show('#intro', true); blurAll();
    $('#goBtn').onclick = () => this.begin();
    Voice.say(L.talk, 0.9);
    this.menuCtl.poll(); this.menuCtl.clear(); this.inputLock = 0.4;
  },
  begin() {
    if (APP.mode !== 'intro') return;
    Sound.unlock(); Sound.sfx('click'); Voice.stop();
    show('#intro', false);
    APP.mode = 'play';
    const L = LEVELS[this.lv];
    K.score = 0; K.delivered = 0; K.failed = 0; K.tipSum = 0; K.time = 0; K.T = L.time + (K.easy ? 30 : 0);
    K.phase = 'ready'; K.readyT = 2.6; K.nextOrder = 0.5; K.eruptT = K.easy ? 16 : 12; K.meteor = null; K.t = 0;
    Tut.on = !!L.tut || K.easy;
    show('#hud', true); $('#hud').classList.add('hasOrders');
    show('#boss', !!L.boss);
    if (L.boss) { K.boss.fill = 0; bossCheck(); }
    if (isTouch) { show('#tc', true); $('#tc').classList.remove('maponly'); show('#tSwap', !APP.twoP); }
    $('#orders').innerHTML = ''; $('#tips').textContent = '';
    updHUD();
    bigText('よーい…'); Sound.sfx('count'); Voice.say('よーい');
    Music.fast = 1;
  },
  endRound(win) {
    if (K.phase !== 'run') return;
    K.phase = 'over'; this.endT = 2.6;
    Tut.target = null; Tut.text = '';
    const L = LEVELS[this.lv];
    if (L.boss) { if (win) { bigText('まんぷく！'); Sound.sfx('fanfare'); } else { bigText('タイムアップ！', true); Sound.sfx('whistle'); } }
    else { bigText('タイムアップ！'); Sound.sfx('whistle'); }
    Voice.say(L.boss && win ? 'まんぷく！' : 'タイムアップ！');
    for (const p of K.players) { p.task = null; p.cheer = true; }
    for (const o of K.orders) o.el.classList.remove('shake');
  },
  showResult() {
    APP.mode = 'result';
    show('#hud', false); show('#tc', false);
    const L = LEVELS[this.lv]; const mul = K.easy ? 0.75 : 1;
    const th = L.stars.map(s => Math.round(s * mul));
    let stars = th.filter(s => K.score >= s).length;
    const lose = L.boss && !(K.boss && K.boss.won);
    if (lose) stars = 0;
    const prev = Save.d.stars[L.id] || 0;
    if (stars > prev) Save.d.stars[L.id] = stars;
    if (K.score > (Save.d.best[L.id] || 0)) Save.d.best[L.id] = K.score;
    Save.write();
    const hasNext = this.lv + 1 < LEVELS.length && MapW.unlocked(this.lv + 1);
    const title = lose ? 'ざんねん…' : stars === 3 ? 'すごーい！' : stars === 2 ? 'じょうず！' : stars === 1 ? 'クリア！' : 'もう ちょっと！';
    $('#resultC').innerHTML = `<h2>${title}</h2>
      <div style="font-size:16px">ステージ ${L.id}　${L.name}</div>
      <div id="rStars"><span>★</span><span>★</span><span>★</span></div>
      <table id="rTable">
        <tr><td>🍽️ できた りょうり</td><td>${K.delivered} こ</td></tr>
        <tr><td>💰 チップ</td><td>${K.tipSum}</td></tr>
        <tr><td>⏰ まにあわなかった</td><td>${K.failed} こ</td></tr>
        ${L.boss ? `<tr><td>😋 ハラペコンの おなか</td><td>${lose ? 'まだ ペコペコ…' : 'まんぷく！'}</td></tr>` : ''}
        <tr class="tot"><td>とくてん</td><td class="dg">${K.score}</td></tr>
      </table>
      <div id="rNeed">★ ${th[0]}　★★ ${th[1]}　★★★ ${th[2]}${lose ? '<br>ハラペコンを まんぷくに すると クリアだよ！' : ''}</div>
      <div class="row">
        ${L.boss && !lose ? `<button class="btn red" id="rEnd">🎉 エンディングへ</button>` : ''}
        ${hasNext && !L.boss ? `<button class="btn red" id="rNext">▶ つぎの ステージ</button>` : ''}
        <button class="btn ${(!hasNext || stars === 0) && !(L.boss && !lose) ? 'red' : ''}" id="rRetry">↺ もういちど</button>
        <button class="btn white" id="rMap">🚌 ちずへ</button>
      </div>`;
    show('#result', true); blurAll();
    this.resDefault = $('#rEnd') ? 'end' : $('#rNext') && stars > 0 ? 'next' : 'retry';
    const sp = $$('#rStars span');
    sp.forEach((s, k) => { if (k < stars) s.classList.add('got'); setTimeout(() => { s.classList.add('pop'); if (k < stars) Sound.sfx('star'); }, 400 + k * 450); });
    setTimeout(() => { Sound.sfx(stars ? 'fanfare' : 'sad'); Voice.say(title + '。 ' + K.score + 'てん！'); }, 400 + 3 * 450);
    if ($('#rEnd')) $('#rEnd').onclick = () => this.ending();
    if ($('#rNext')) $('#rNext').onclick = () => { Sound.sfx('click'); show('#result', false); this.openIntro(this.lv + 1); };
    $('#rRetry').onclick = () => { Sound.sfx('click'); show('#result', false); this.openIntro(this.lv); };
    $('#rMap').onclick = () => { Sound.sfx('click'); this.toMap(this.lv); };
    this.menuCtl.poll(); this.menuCtl.clear(); this.inputLock = 1.2;
  },
  ending() {
    Sound.sfx('click'); show('#result', false); Floats.clear(); clearKitchen();
    Story.play('ending', () => { Save.d.cleared = 1; Save.write(); this.toMap(LEVELS.length - 1); });
  },
  pause() {
    if (APP.mode === 'play' && K.phase !== 'over') { APP.mode = 'pause'; show('#pauseM', true); syncOpts(); blurAll(); Voice.stop(); }
    else if (APP.mode === 'pause') this.resume();
  },
  resume() { if (APP.mode !== 'pause') return; show('#pauseM', false); APP.mode = 'play'; },
};
Hooks.pause = () => Game.pause();
$('#bPause').addEventListener('click', () => { Sound.sfx('click'); Game.pause(); });
$('#pRes').addEventListener('click', () => Game.resume());
$('#pRetry').addEventListener('click', () => { show('#pauseM', false); Floats.clear(); Game.openIntro(Game.lv); });
$('#pMap').addEventListener('click', () => { show('#pauseM', false); Game.toMap(Game.lv); });
$('#b1p').addEventListener('click', () => Game.start(false));
$('#b2p').addEventListener('click', () => Game.start(true));
$('#bMapTitle').addEventListener('click', () => { Sound.sfx('click'); MapW.leave(); Game.toTitle(); });
function syncOpts() {
  $$('[data-diff]').forEach(b => b.classList.toggle('on', b.dataset.diff === Save.d.diff));
  $$('[data-voice]').forEach(b => b.classList.toggle('on', +b.dataset.voice === (Voice.on ? 1 : 0)));
  $$('[data-snd]').forEach(b => b.classList.toggle('on', +b.dataset.snd === (Sound.on ? 1 : 0)));
}
$$('[data-diff]').forEach(b => b.addEventListener('click', () => { Save.d.diff = b.dataset.diff; Save.write(); K.easy = Save.d.diff === 'easy'; Sound.unlock(); Sound.sfx('click'); syncOpts(); }));
$$('[data-voice]').forEach(b => b.addEventListener('click', () => { Voice.setOn(b.dataset.voice === '1'); Sound.unlock(); Sound.sfx('click'); syncOpts(); if (Voice.on) Voice.say('よみあげ オン'); }));
$$('[data-snd]').forEach(b => b.addEventListener('click', () => { Sound.unlock(); Sound.setOn(b.dataset.snd === '1'); Sound.sfx('click'); syncOpts(); }));
$('#bHelp').addEventListener('click', () => {
  Sound.unlock(); Sound.sfx('click');
  $('#helpC').innerHTML = `<h2>あそびかた</h2>
  <div style="font-size:15px;line-height:1.6">ちゅうもん（うえの かみ）の りょうりを つくって 「うけとりぐち」🔔へ もっていこう！ はやく だすと チップが もらえるよ。</div>
  <div class="hgrid">
    <div><b>✋ つかむ・おく</b>はこから ざいりょうを とる・カウンターに おく・おさらに のせる・なべに いれる</div>
    <div><b>🔪 きる・あらう</b>まないたの まえで おすと トントン きるよ。 ながしでは おさらを あらう</div>
    <div><b>🍲 なべ・フライパン</b>いれると コンロで にえるよ。 ✓が でたら おさらに もりつけ。 ほっとくと こげる！</div>
    <div><b>🔄 こうたい</b>ひとりで あそぶ ときは ふーたんと リッキーを いれかえられるよ</div>
    <div><b>💨 ダッシュ</b>すばやく うごける！</div>
    <div><b>🧯 しょうかき</b>ひが ついたら もって 🔪ボタンで けそう</div>
    <div><b>⌨️ キーボード</b>いどう: ↑↓←→/WASD<br>つかむ: スペース　きる: E<br>ダッシュ: Shift　こうたい: Tab<br>ポーズ: Esc</div>
    <div><b>👭 ふたりで</b>1P: WASD・スペース・E・左Shift<br>2P: ↑↓←→・Enter・右Shift・/<br>ゲームパッド 2こ でも あそべるよ</div>
  </div>
  <button class="btn red" id="helpOk">わかった！</button>`;
  show('#help', true); $('#helpOk').onclick = () => { Sound.sfx('click'); show('#help', false); };
});

// ================================================================ main loop
function titleUpdate(dt) {
  K.t += dt; K.titleT += dt;
  const a = Math.sin(K.titleT * 0.18) * 0.35;
  const d = 14;
  camera.fov = VW < VH ? 55 : 36; camera.updateProjectionMatrix();
  camera.position.set(Math.sin(a) * d * 0.6, 9.5, Math.cos(a) * d * 0.75); camera.lookAt(0, 0.4, 0.5);
  // demo chefs wander a bit
  K.players.forEach((p, i) => {
    const tt = K.titleT * 0.5 + i * 2.5;
    const tx = Math.sin(tt) * 2.5 + (i ? 1.5 : -1.5), tz = Math.cos(tt * 1.3) * 0.6 + 0.6;
    const dx = tx - p.x, dz = tz - p.z, d2 = Math.hypot(dx, dz);
    if (d2 > 0.1) { p.face = dampAng(p.face, Math.atan2(dx, dz), 8, dt); p.x += dx / d2 * Math.min(d2, 1.6 * dt); p.z += dz / d2 * Math.min(d2, 1.6 * dt); }
    p.phase += dt * 8;
    animChef(p.P, { move: d2 > 0.1 ? 0.8 : 0, phase: p.phase, cheer: (K.titleT % 7) > 6 }, dt);
    p.P.g.position.set(p.x, 0, p.z); p.P.g.rotation.y = p.face;
    p.ring.visible = false; p.arrow.visible = false;
  });
  const c = Game.menuCtl; c.poll();
  if (c.pressed.pick && $('#help').classList.contains('hide')) Game.start(false);
}
function playUpdate(dt) {
  K.t += dt;
  if (K.phase === 'ready') {
    const before = K.readyT; K.readyT -= dt;
    if (before > 0.9 && K.readyT <= 0.9) { bigText('スタート！'); Sound.sfx('go'); Voice.say('スタート！'); }
    if (K.readyT <= 0) { K.phase = 'run'; if (!APP.twoP) showWho(); }
  } else if (K.phase === 'run') {
    K.time += dt; updOrders(dt); updFire(dt);
    const left = K.T - K.time;
    if (left < 30) Music.fast = 1.12;
    if (left < 10 && Math.floor(left + dt) !== Math.floor(left)) Sound.sfx('tick');
    if (K.time >= K.T) Game.endRound(false);
  } else if (K.phase === 'over') {
    Game.endT -= dt;
    if (Game.endT <= 0) { Game.showResult(); return; }
  }
  simPlayers(dt); simStations(dt); updFlying(dt); simMisc(dt);
  Tut.compute(); updHUD(); fitKitchenCam(dt); updFloats(); updPops(dt);
}
function idleKitchen(dt) {
  K.t += dt;
  for (const p of K.players) { animChef(p.P, { cheer: APP.mode === 'result' && p.cheer }, dt); p.hl.visible = false; }
  if (K.boss) animHarapekon(K.boss.P, {}, dt);
  fitKitchenCam(dt);
}
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  pollPadStart();
  Game.inputLock = Math.max(0, (Game.inputLock || 0) - dt);
  switch (APP.mode) {
    case 'title': titleUpdate(dt); break;
    case 'map': MapW.update(dt); break;
    case 'story': Story.update(dt); break;
    case 'play': playUpdate(dt); break;
    case 'intro': idleKitchen(dt); Game.menuCtl.poll(); if (Game.menuCtl.pressed.pick && !Game.inputLock) Game.begin(); break;
    case 'result': {
      idleKitchen(dt); const c = Game.menuCtl; c.poll();
      if (c.pressed.pick && !Game.inputLock) { const b = Game.resDefault === 'end' ? $('#rEnd') : Game.resDefault === 'next' ? $('#rNext') : $('#rRetry'); b && b.click(); }
      break;
    }
    case 'pause': break;
  }
  Parts.update(APP.mode === 'pause' ? 0 : dt);
  renderer.render(scene, camera);
}

// ================================================================ boot
resize();
makePortraits();
syncOpts();
Game.toTitle();
if (DEBUG) { window.step = (n, dt = 1 / 30) => { for (let i = 0; i < n; i++) { if (APP.mode === 'play') playUpdate(dt); else if (APP.mode === 'map') MapW.update(dt); Parts.update(dt); } }; window.K = K; window.Game = Game; window.Save = Save; window.MapW = MapW; window.Story = Story; window.LEVELS = LEVELS; }
requestAnimationFrame(frame);
</script>
