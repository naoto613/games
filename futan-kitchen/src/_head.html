<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b2a55">
<title>ふーたんの はちゃめちゃキッチン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1b2a55;--navy2:#2e4a8e;--sky:#4fa3ff;--yel:#ffd23a;--org:#ff8a1e;--red:#e8443a;--grn:#3fbf4a;--ink:#14182a;--paper:#fffaf0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#14182a;color:#fff;font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;font-weight:800;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hide{display:none!important}
.dg{font-family:"Dela Gothic One","M PLUS Rounded 1c",sans-serif;font-weight:400}
.ol{-webkit-text-stroke:5px var(--navy);paint-order:stroke fill}
button{font:inherit;color:inherit;cursor:pointer}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:60;transition:opacity .35s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:3px solid #fff;border-radius:14px;background:linear-gradient(#ffb63a,#ff7e14);color:#fff;font-size:clamp(16px,2.4vw,22px);padding:9px 22px;box-shadow:0 4px 0 #a2480a,0 8px 16px rgba(0,0,0,.35);transition:transform .08s,filter .08s;line-height:1.2;outline:none;-webkit-text-stroke:4px #8a3a00;paint-order:stroke fill}
.btn:hover,.btn:focus-visible{transform:translateY(-2px) scale(1.03);filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a2480a}
.btn.blue{background:linear-gradient(#6ab8ff,#2f7ee8);box-shadow:0 4px 0 #1a4a9a,0 8px 16px rgba(0,0,0,.35);-webkit-text-stroke-color:#123a7a}
.btn.grey{background:linear-gradient(#8a94b0,#5a6480);box-shadow:0 4px 0 #3a4258,0 8px 16px rgba(0,0,0,.35);-webkit-text-stroke-color:#2a3048}
.btn.sm{font-size:14px;padding:5px 12px;border-radius:11px;-webkit-text-stroke-width:3px}
.scr{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom))}
.dim{background:radial-gradient(ellipse at center,rgba(20,30,70,.45),rgba(8,12,30,.82));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.card{background:linear-gradient(#34539c,#1b2a55);border:4px solid #dfe9ff;border-radius:22px;box-shadow:0 0 0 4px var(--navy),0 14px 40px rgba(0,0,0,.5);padding:18px 24px;max-width:min(94vw,780px);max-height:calc(100vh - 32px);overflow:auto;position:relative}
.card h2{margin:0 0 6px;font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:clamp(24px,4.2vw,40px);color:var(--yel);-webkit-text-stroke:7px var(--navy);paint-order:stroke fill;letter-spacing:.02em}
.tagno{display:inline-block;background:var(--org);color:#fff;border:3px solid #fff;border-radius:10px;padding:0 12px;font-size:17px;-webkit-text-stroke:3px #8a3a00;paint-order:stroke fill}
/* title */
#title{flex-direction:column;justify-content:space-between;background:linear-gradient(rgba(8,12,30,.15),rgba(8,12,30,.55))}
#logo{margin-top:min(4vh,30px);text-align:center;transform:rotate(-2deg)}
#logo .s1{display:inline-block;font-size:clamp(20px,3.4vw,32px);color:#fff;-webkit-text-stroke:7px var(--navy);paint-order:stroke fill;transform:translateY(10px) rotate(3deg)}
#logo .s2{display:block;font-size:clamp(44px,9.5vw,104px);line-height:1.02;color:#fff;-webkit-text-stroke:clamp(9px,1.4vw,14px) var(--navy);paint-order:stroke fill;text-shadow:0 7px 0 var(--org),0 12px 18px rgba(0,0,0,.45)}
#logo .s2 span{color:var(--yel)}
#logo .s3{display:inline-block;margin-top:10px;color:var(--yel);font-size:clamp(14px,2vw,19px);-webkit-text-stroke:5px var(--navy);paint-order:stroke fill}
#tmenu{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:min(4vh,30px)}
#tmenu .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.opt{display:flex;gap:6px;align-items:center;background:rgba(27,42,85,.85);border:3px solid #dfe9ff;border-radius:12px;padding:4px 6px 4px 12px;font-size:14px}
.opt button{border:2px solid #dfe9ff;border-radius:8px;background:transparent;padding:2px 10px;font-size:14px}
.opt button.on{background:var(--org)}
#back{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));color:#fff;font-size:13px;text-decoration:none;background:rgba(8,12,30,.6);border-radius:10px;padding:4px 10px}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:8}
#orders{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));display:flex;gap:7px;align-items:flex-start;max-width:calc(100vw - 80px)}
.tk{width:clamp(84px,10.5vw,118px);background:#fff;border-radius:12px;box-shadow:0 0 0 3px var(--navy),0 6px 12px rgba(0,0,0,.35);position:relative;padding:10px 5px 6px;text-align:center;animation:tkin .4s cubic-bezier(.3,1.5,.5,1);color:var(--ink)}
.tk .tb{position:absolute;left:0;right:0;top:0;height:8px;border-radius:12px 12px 0 0;background:#d8dce6;overflow:hidden}
.tk .tb i{display:block;height:100%;background:#43c94e}
.tk .tb i.mid{background:#ffb21e}.tk .tb i.low{background:#e8443a}
.tk .dw{background:linear-gradient(#e8f2ff,#c8dcf4);border-radius:9px;margin:0 2px;padding:3px 0}
.tk .dish{display:block;width:clamp(44px,6vw,64px);height:clamp(44px,6vw,64px);margin:0 auto}
.tk .cs{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-top:4px}
.tk .cs .ci{width:clamp(20px,2.6vw,27px);height:clamp(20px,2.6vw,27px);position:relative;background:#eef1f6;border-radius:6px;border:2px solid #c4cad8}
.tk .cs .ci img{width:100%;height:100%}
.tk .cs .ci b{position:absolute;right:-5px;bottom:-5px;width:62%;height:62%;background:#fff;border-radius:50%;box-shadow:0 0 0 1px #9aa4b8}
.tk .cs .ci b img{width:100%;height:100%}
.tk.shake{animation:tksh .45s infinite}
.tk.done{animation:tkok .5s forwards}
.tk.bad{animation:tkbad .6s forwards}
@keyframes tkin{from{transform:translateX(-60px) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes tksh{25%{transform:translateX(-3px) rotate(-2deg)}75%{transform:translateX(3px) rotate(2deg)}}
@keyframes tkok{30%{transform:scale(1.15);background:#c8ffb8}to{transform:translateY(-120%) scale(.8);opacity:0}}
@keyframes tkbad{30%{transform:rotate(6deg);background:#ffb0a0}to{transform:translateY(80%) rotate(18deg);opacity:0}}
#clock{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));width:clamp(84px,10vw,108px);height:clamp(84px,10vw,108px);border-radius:50%;border:4px solid #fff;background:var(--navy);box-shadow:0 0 0 4px var(--navy),0 8px 16px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
#clock .ring{position:absolute;inset:4px;border-radius:50%;background:conic-gradient(#43c94e calc(var(--p)*1%),#3a4a78 0)}
#clock .ring:after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--navy)}
#clockT{position:relative;font-size:clamp(20px,2.6vw,27px);-webkit-text-stroke:4px var(--navy);paint-order:stroke fill}
#clock.mid .ring{background:conic-gradient(#ffb21e calc(var(--p)*1%),#3a4a78 0)}
#clock.low .ring{background:conic-gradient(#e8443a calc(var(--p)*1%),#3a4a78 0)}
#clock.low{animation:cpop .5s infinite}
#bPause{position:absolute;pointer-events:auto;right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));width:46px;height:46px;border-radius:12px;border:3px solid #fff;background:var(--navy);font-size:16px;box-shadow:0 0 0 3px var(--navy)}
#coin{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;background:var(--navy);border:4px solid #fff;border-radius:999px;padding:3px 22px 3px 4px;box-shadow:0 0 0 4px var(--navy),0 8px 16px rgba(0,0,0,.4);font-size:clamp(24px,3.2vw,34px)}
#coin b{display:inline-flex;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6a0,#ffc61e 45%,#d88a00);border:3px solid #fff;align-items:center;justify-content:center;font-size:20px;color:#8a5a00}
#coin span{-webkit-text-stroke:5px var(--navy);paint-order:stroke fill}
#coin.pop{animation:cpop .3s}
@keyframes cpop{50%{transform:scale(1.12)}}
#tips{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:calc(max(12px,env(safe-area-inset-bottom)) + 66px);font-size:22px;color:var(--yel);-webkit-text-stroke:6px var(--navy);paint-order:stroke fill;font-family:"Dela Gothic One",sans-serif}
#tips.pop{animation:cpop .35s}
#boss{position:absolute;left:50%;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 6px);transform:translateX(-50%);width:min(40vw,360px);text-align:center;font-size:14px;-webkit-text-stroke:4px var(--navy);paint-order:stroke fill}
#boss .b{height:20px;border:3px solid #fff;border-radius:999px;background:var(--navy);box-shadow:0 0 0 3px var(--navy);overflow:hidden;margin-top:2px}
#boss .b i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,#ff8ac0 0 10px,#ff5fa2 10px 20px);transition:width .4s}
#hint{position:absolute;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 150px);transform:translateX(-50%);background:rgba(27,42,85,.92);border:3px solid #fff;border-radius:14px;padding:3px 16px;font-size:clamp(14px,2vw,18px);white-space:nowrap}
#hint:empty{display:none}
#big{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-family:"Dela Gothic One",sans-serif;font-size:clamp(48px,11vw,124px);color:#fff;-webkit-text-stroke:clamp(8px,1.3vw,14px) var(--navy);paint-order:stroke fill;text-shadow:0 8px 0 var(--org);white-space:nowrap;pointer-events:none;opacity:0}
#big.show{animation:bigin 1s cubic-bezier(.3,1.7,.5,1) forwards}
#big.red{color:#ffd0c8;text-shadow:0 8px 0 var(--red)}
@keyframes bigin{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}
#who{position:absolute;left:50%;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 4px);transform:translateX(-50%);font-size:14px;background:rgba(27,42,85,.92);border:3px solid #fff;border-radius:999px;padding:2px 14px;opacity:0;transition:opacity .3s;z-index:2}
#who.on{opacity:1}
/* world-space widgets */
#floats{position:fixed;inset:0;pointer-events:none;z-index:7;overflow:hidden}
.fl{position:absolute;left:0;top:0;will-change:transform}
.fl.bar{width:48px;height:12px;margin:-6px 0 0 -24px;border:3px solid #fff;border-radius:8px;background:var(--navy);box-shadow:0 0 0 2px var(--navy);overflow:hidden}
.fl.bar i{display:block;height:100%;background:#43c94e}
.fl.bar.cook i{background:#43c94e}.fl.bar.wash i{background:#4ab0ff}
.fl.icons{display:flex;gap:2px;transform-origin:50% 100%}
.fl.icons img{width:26px;height:26px;background:#fff;border:2px solid var(--navy);border-radius:50%;padding:1px}
.fl.warn{width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;border:3px solid #fff;background:var(--red);box-shadow:0 0 0 2px var(--navy);color:#fff;text-align:center;line-height:30px;font-size:22px;animation:blink .3s infinite alternate}
.fl.ok{width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;border:3px solid #fff;background:#43c94e;box-shadow:0 0 0 2px var(--navy);color:#fff;text-align:center;line-height:26px;font-size:18px}
.fl.pts{font-family:"Dela Gothic One",sans-serif;font-size:28px;color:var(--yel);-webkit-text-stroke:6px var(--navy);paint-order:stroke fill;white-space:nowrap}
.fl.pts.bad{color:#ffb0a0;font-size:22px}
.fl.say{background:#fff;color:var(--ink);border:3px solid var(--navy);border-radius:12px;padding:1px 9px;font-size:14px;white-space:nowrap;margin:-14px 0 0 0;translate:-50% 0}
.fl.mark{font-size:22px;color:#fff;-webkit-text-stroke:5px var(--navy);paint-order:stroke fill;translate:-50% 0;white-space:nowrap}
@keyframes blink{to{transform:scale(1.18)}}
/* touch */
#tc{position:fixed;inset:0;z-index:9;pointer-events:none}
#stickZone{position:absolute;left:0;bottom:0;width:50%;height:70%;pointer-events:auto;touch-action:none}
#stickBase{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;border:4px solid rgba(255,255,255,.85);background:rgba(27,42,85,.35);pointer-events:none}
#stickKnob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:#fff;border:4px solid var(--navy)}
#stickHint{position:absolute;left:max(30px,env(safe-area-inset-left));bottom:max(110px,env(safe-area-inset-bottom));width:110px;height:110px;border-radius:50%;border:4px dashed rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;-webkit-text-stroke:3px var(--navy);paint-order:stroke fill;pointer-events:none}
.tb2{position:absolute;pointer-events:auto;touch-action:none;border:3px solid #fff;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0;box-shadow:0 0 0 3px var(--navy),0 6px 10px rgba(0,0,0,.35);color:#fff;opacity:.92}
.tb2 .i{font-size:28px}
.tb2 .l{font-size:12px;margin-top:2px;-webkit-text-stroke:3px var(--navy);paint-order:stroke fill;white-space:nowrap}
.tb2.on{transform:scale(.92)}
#tPick{right:calc(max(18px,env(safe-area-inset-right)) + 112px);bottom:calc(max(20px,env(safe-area-inset-bottom)) + 4px);width:88px;height:88px;background:var(--grn)}
#tPick .i{font-size:36px}
#tAct{right:calc(max(18px,env(safe-area-inset-right)) + 30px);bottom:calc(max(20px,env(safe-area-inset-bottom)) + 104px);width:78px;height:78px;background:var(--red)}
#tDash{right:calc(max(18px,env(safe-area-inset-right)) + 120px);bottom:calc(max(20px,env(safe-area-inset-bottom)) + 104px);width:62px;height:62px;background:var(--sky)}
#tDash .i,#tSwap .i{font-size:22px}
#tSwap{right:calc(max(18px,env(safe-area-inset-right)) + 200px);bottom:calc(max(20px,env(safe-area-inset-bottom)) + 30px);width:62px;height:62px;background:#8a5ae0}
#tc.play-on #clock{}
#tc.maponly .tb2{display:none}
/* map */
#mapUI{position:fixed;inset:0;z-index:8;pointer-events:none}
#mapTop{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));display:flex;gap:8px;pointer-events:auto;align-items:center}
#starTotal{background:var(--navy);border:3px solid #fff;border-radius:999px;padding:2px 16px;font-size:22px;box-shadow:0 0 0 3px var(--navy);color:var(--yel);-webkit-text-stroke:4px var(--navy);paint-order:stroke fill}
#mapHelp{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(27,42,85,.92);border:3px solid #fff;border-radius:14px;padding:3px 16px;font-size:clamp(13px,1.8vw,17px);white-space:nowrap}
#stage{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);pointer-events:auto;text-align:center;min-width:min(90vw,360px);padding:12px 18px 16px;animation:tkin .35s}
#stage .nm{font-size:clamp(18px,2.6vw,25px);margin:4px 0 0;-webkit-text-stroke:5px var(--navy);paint-order:stroke fill}
#stage .st{font-size:30px;letter-spacing:4px;color:#4a5a88}
#stage .st b{color:var(--yel);font-weight:400}
#stage .sc{font-size:13px;color:#c8d4f0}
#stage .rc{display:flex;gap:6px;justify-content:center;margin:4px 0 10px}
#stage .rc img{width:42px;height:42px;background:#fff;border:3px solid #c4d4f4;border-radius:10px}
#stage .lock{font-size:15px;color:#c8d4f0;margin:6px 0}
/* intro */
#intro .card{text-align:center}
.recipes{display:flex;flex-direction:column;gap:7px;margin:8px auto 10px;max-width:660px}
.rcp{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.95);color:var(--ink);border-radius:14px;padding:5px 10px;flex-wrap:wrap;justify-content:center;box-shadow:0 0 0 3px var(--navy)}
.rcp .dish{width:52px;height:52px}
.rcp .eq{font-size:20px;color:#5a6a98}
.rcp .chain{display:flex;align-items:center;gap:2px;background:#e8eef8;border-radius:10px;padding:2px 6px}
.rcp .chain img{width:30px;height:30px}
.rcp .chain .ar{font-size:13px;color:#8a9ac0}
.rcp .nm{font-size:15px;min-width:110px;text-align:left}
.starrow{display:flex;justify-content:center;gap:16px;margin:4px 0 8px;font-size:17px}
.starrow b{color:var(--yel);-webkit-text-stroke:4px var(--navy);paint-order:stroke fill}
.talk{display:flex;align-items:center;gap:10px;text-align:left;background:rgba(10,18,44,.55);border:2px solid rgba(223,233,255,.6);border-radius:14px;padding:7px 12px;margin:6px 0 12px;font-size:clamp(13px,1.9vw,16px);line-height:1.5}
.talk img{width:58px;height:58px;border-radius:50%;border:3px solid #fff;background:#ffe9a8;flex:none}
.keys{font-size:12px;color:#c8d4f0;margin-top:10px;line-height:1.7}
.keys kbd{display:inline-block;background:#fff;color:var(--ink);border-radius:5px;padding:0 6px;font:inherit;font-size:11px;box-shadow:0 2px 0 #8a94b0}
/* pause / result */
#pauseM .card,#result .card{text-align:center}
#pauseM .card{display:flex;flex-direction:column;gap:12px;align-items:stretch;min-width:280px}
#rStars{display:flex;justify-content:center;gap:10px;margin:4px 0}
#rStars span{font-size:clamp(56px,10vw,88px);color:#3a4a78;-webkit-text-stroke:6px var(--navy);paint-order:stroke fill;transform:scale(0);display:inline-block;line-height:1}
#rStars span.got{color:var(--yel);text-shadow:0 0 18px rgba(255,210,58,.7)}
#rStars span.pop{animation:spop .5s cubic-bezier(.3,1.8,.5,1) forwards}
#rStars span:nth-child(2){transform-origin:center;margin-top:-14px}
@keyframes spop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
#rTable{margin:6px auto 8px;font-size:17px;border-collapse:collapse;min-width:280px}
#rTable td{padding:3px 10px;border-bottom:2px solid rgba(223,233,255,.25);text-align:left}
#rTable td:last-child{text-align:right}
#rTable tr.tot td{font-size:28px;border:none;color:var(--yel);-webkit-text-stroke:5px var(--navy);paint-order:stroke fill}
#rNeed{font-size:14px;color:#c8d4f0;margin-bottom:10px}
#result .row,#pauseM .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
/* story */
#story{position:fixed;inset:0;z-index:20}
#story .bars:before,#story .bars:after{content:"";position:fixed;left:0;right:0;height:8vh;background:#000}
#story .bars:before{top:0}#story .bars:after{bottom:0}
#bub{position:absolute;left:50%;bottom:calc(8vh + 14px);transform:translateX(-50%);width:min(94vw,820px);min-height:108px;background:linear-gradient(#34539c,#1b2a55);border:4px solid #dfe9ff;box-shadow:0 0 0 4px var(--navy),0 10px 30px rgba(0,0,0,.5);border-radius:20px;padding:16px 22px 16px 126px;font-size:clamp(16px,2.4vw,22px);line-height:1.6;cursor:pointer}
#bub.nar{padding-left:22px;text-align:center;background:rgba(8,12,30,.85)}
#bub .pt{position:absolute;left:14px;bottom:10px;width:98px;height:98px;border-radius:50%;border:4px solid #fff;overflow:hidden;background:radial-gradient(#ffe9a8,#ffb84a)}
#bub.nar .pt,#bub.nar .nm{display:none}
#bub .pt img{width:100%;height:100%}
#bub .nm{position:absolute;left:118px;top:-20px;background:var(--org);border:3px solid #fff;border-radius:10px;padding:0 14px;font-size:16px;line-height:30px;-webkit-text-stroke:3px #8a3a00;paint-order:stroke fill}
#bub .nx{position:absolute;right:16px;bottom:6px;font-size:15px;animation:blink .5s infinite alternate}
#bub.boom{animation:boom .4s}
@keyframes boom{20%{transform:translateX(-52%) rotate(-1.5deg)}40%{transform:translateX(-48%) rotate(1.5deg)}60%{transform:translateX(-51%)}}
#skip{position:absolute;right:max(12px,env(safe-area-inset-right));top:calc(8vh + 10px);z-index:2}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;text-align:left;margin:10px 0 14px}
.hgrid div{background:rgba(10,18,44,.5);border:2px solid rgba(223,233,255,.5);border-radius:12px;padding:8px 10px;font-size:14px;line-height:1.55;font-weight:500}
.hgrid div b{display:block;font-size:16px;color:var(--yel);font-weight:800}
@media (max-height:520px){#logo{margin-top:2px}#logo .s2{font-size:clamp(34px,7vw,72px)}.tk{width:78px}.tk .dish{width:40px;height:40px}#tmenu{gap:8px}
 .card{padding:10px 14px}.card h2{font-size:22px}
 .recipes{gap:4px;margin:4px auto 6px}.rcp{padding:2px 8px;gap:4px}.rcp .dish{width:34px;height:34px}.rcp .chain img{width:22px;height:22px}.rcp .nm{font-size:13px;min-width:80px}
 .talk{padding:4px 8px;margin:4px 0 8px;font-size:12px;line-height:1.4}.talk img{width:40px;height:40px}.keys{display:none}.starrow{margin:0 0 4px;font-size:14px}
 #stage{padding:6px 12px 8px}#stage .rc img{width:32px;height:32px}#stage .rc{margin:2px 0 6px}#stage .st{font-size:22px}
 #bub{min-height:74px;padding:8px 16px 8px 92px;font-size:15px;bottom:calc(8vh + 8px)}#bub .pt{width:70px;height:70px;left:10px;bottom:4px}#bub .nm{left:86px;font-size:14px;line-height:24px;top:-17px}
 #rStars span{font-size:44px}#rTable{font-size:14px;margin:2px auto 4px}#rTable tr.tot td{font-size:20px}#rTable td{padding:1px 8px}#rNeed{margin-bottom:6px}
 #pauseM .card{gap:8px}#clock{width:76px;height:76px}#hint{top:120px}
}
body.touch #clock{bottom:auto;top:calc(max(8px,env(safe-area-inset-top)) + 4px);right:calc(max(10px,env(safe-area-inset-right)) + 58px);width:70px;height:70px}body.touch #clockT{font-size:18px}body.touch #hint{top:auto;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 70px)}
@media (min-aspect-ratio:1/1){#stage{left:auto;right:max(14px,env(safe-area-inset-right));transform:none;min-width:0;width:min(44vw,380px)}}
</style>
</head>
