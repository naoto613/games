<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ff7ab8">
<title>キュアふーたん ストライク</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#3a1848;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif}
canvas#c{position:fixed;inset:0;display:block;touch-action:none}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box;z-index:10;color:#5b2c47;text-align:center;overflow-y:auto}
.ov.show{display:flex}
.dim{background:rgba(50,10,60,.55)}
.panel{background:rgba(255,255,255,.97);border:4px solid #ff8cc6;border-radius:26px;padding:18px 16px;max-width:460px;width:100%;box-sizing:border-box;box-shadow:0 8px 0 #e0579a}
h2{margin:0 0 6px;font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif;font-weight:400;font-size:28px;color:#ff4f9a;text-shadow:0 2px 0 #fff}
p{margin:6px 0;font-weight:800;font-size:17px;line-height:1.5}
.btn{appearance:none;border:0;border-radius:999px;background:linear-gradient(#ff9ccf,#ff5fa8);color:#fff;font:inherit;font-weight:900;font-size:22px;padding:14px 30px;box-shadow:0 5px 0 #c8387c;cursor:pointer;text-shadow:0 2px 0 rgba(160,30,90,.5);min-width:200px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c8387c}
.btn.sub{background:linear-gradient(#c3b2ff,#8f74f0);box-shadow:0 5px 0 #6147c0;font-size:17px;padding:10px 20px;min-width:0}
.btn.sub:active{box-shadow:0 2px 0 #6147c0}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.col{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:10px}
#title{justify-content:space-between}
.logo{margin-top:6px;font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif;color:#fff;line-height:1.05;text-shadow:0 3px 0 #ff4f9a,3px 0 0 #ff4f9a,-3px 0 0 #ff4f9a,0 -3px 0 #ff4f9a,2px 2px 0 #ff4f9a,-2px 2px 0 #ff4f9a,2px -2px 0 #ff4f9a,-2px -2px 0 #ff4f9a,0 8px 0 rgba(120,20,80,.35)}
.logo .a{font-size:clamp(18px,5.5vw,28px);color:#fff6a8}
.logo .b{font-size:clamp(30px,11vw,72px);white-space:nowrap}
.logo .c{font-size:clamp(34px,11vw,64px);color:#bff4ff;letter-spacing:.04em}
.hint{color:#fff;font-weight:900;font-size:16px;line-height:1.4;background:rgba(255,79,154,.85);border:3px solid #fff;border-radius:18px;padding:6px 14px}
.team{background:rgba(255,255,255,.95);border:4px solid #ff8cc6;border-radius:22px;padding:8px 10px;width:100%;max-width:520px;box-sizing:border-box;box-shadow:0 5px 0 #e0579a}
.team .lv{font-weight:900;font-size:18px;color:#ff4f9a}
.team canvas{width:100%;height:auto;display:block}
.stages{display:grid;gap:10px;width:100%;max-width:520px}
.st{display:flex;align-items:center;gap:12px;border:0;border-radius:20px;padding:10px 14px;font:inherit;text-align:left;color:#5b2c47;background:#fff;box-shadow:0 5px 0 #e0579a;border:3px solid #ff8cc6;cursor:pointer}
.st:active{transform:translateY(3px);box-shadow:0 2px 0 #e0579a}
.st .em{font-size:36px;width:48px;text-align:center}
.st b{display:block;font-size:19px}
.st small{font-weight:800;color:#9a6a8a;font-size:13px}
.st.lock{filter:grayscale(1);opacity:.55;pointer-events:none}
.st .ok{margin-left:auto;font-size:20px;white-space:nowrap}
.stars{font-size:46px;letter-spacing:6px;min-height:56px}
.stars span{display:inline-block;animation:starIn .45s cubic-bezier(.3,1.8,.5,1) both}
.stars span.off{filter:grayscale(1);opacity:.35}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1) rotate(0)}}
.exp{margin:10px auto 4px;max-width:320px}
.exp .lbl{display:flex;justify-content:space-between;font-weight:900;font-size:16px}
.bar{height:20px;border-radius:99px;background:#ffe0f0;border:3px solid #ff8cc6;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd84a,#ff7ab8,#b98cff);border-radius:99px;transition:width .5s ease-out}
.lvup{font-family:"Mochiy Pop One",sans-serif;font-size:22px;color:#fff;text-shadow:0 3px 0 #ff4f9a,2px 2px 0 #ff4f9a,-2px 2px 0 #ff4f9a,2px -2px 0 #ff4f9a,-2px -2px 0 #ff4f9a;animation:pop .4s cubic-bezier(.3,1.8,.5,1) both}
.newc{margin-top:8px;border-radius:20px;background:linear-gradient(#fff8d0,#ffe0f0);border:3px dashed #ffb400;padding:8px;animation:pop .5s cubic-bezier(.3,1.8,.5,1) both}
.newc canvas{width:120px;height:120px}
.newc b{display:block;font-size:19px;color:#ff4f9a}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<canvas id="c" aria-label="キュアふーたん ストライク ゲーム画面"></canvas>

<div id="title" class="ov show">
  <div class="logo"><div class="a">プリキュア ひっぱりバトル</div><div class="b">キュアふーたん</div><div class="c">ストライク</div></div>
  <div style="display:flex;flex-direction:column;gap:12px;align-items:center">
    <div class="hint">ひっぱって はなすと びゅーん！<br>てきに ぶつけて やっつけよう</div>
    <button class="btn" id="startBtn">あそぶ！</button>
    <div class="row"><button class="btn sub" id="muteBtn"></button></div>
  </div>
</div>

<div id="select" class="ov dim">
  <div class="team"><div class="lv" id="teamLv"></div><canvas id="teamCv" width="520" height="150"></canvas></div>
  <div class="stages" id="stageList"></div>
  <button class="btn sub" id="backTitle">もどる</button>
</div>

<div id="pause" class="ov dim">
  <div class="panel"><h2>ひとやすみ</h2><p>つかれたら おやすみしてね</p>
  <div class="col"><button class="btn" id="resumeBtn">つづける</button><button class="btn sub" id="quitBtn">ステージを えらぶ</button></div></div>
</div>

<div id="over" class="ov dim">
  <div class="panel"><h2>あとちょっと！</h2><p>やみの ちからに まけちゃった…<br>でも みんなは なんどでも たちあがる！</p>
  <div class="exp" id="overExp"></div>
  <div class="col"><button class="btn" id="retryBtn">もういちど！</button><button class="btn sub" id="overSel">ステージを えらぶ</button></div></div>
</div>

<div id="clear" class="ov dim">
  <div class="panel"><div class="stars" id="clearStars"></div><h2 id="clearTitle">ステージクリア！</h2><p id="clearText"></p>
  <div class="exp" id="clearExp"></div><div id="clearNew"></div>
  <div class="col"><button class="btn" id="nextBtn">つぎの ステージへ</button><button class="btn sub" id="clearSel">ステージを えらぶ</button></div></div>
</div>

<script>
'use strict';
// ================= basics =================
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
const TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0],clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const FONT='"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif';
const Q=new URLSearchParams(location.search),BOT=Q.has('bot'),SPEED=Math.max(1,+Q.get('speed')||1);
// ろんりざひょう（たて 360×720）を がめんに あわせて かくだい
const LW=360,LH=720,FY=58,FB=600;
let W=0,H=0,DPR=1,SC=1,OX=0,OY=0,CLK=0;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR|0;cv.height=H*DPR|0;cv.style.width=W+'px';cv.style.height=H+'px';SC=Math.min(W/LW,H/LH);OX=(W-LW*SC)/2;OY=(H-LH*SC)/2;}
addEventListener('resize',resize);resize();
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
const SAVE={cleared:0,lv:1,exp:0,mute:false,stars:[0,0,0,0]};
try{Object.assign(SAVE,JSON.parse(localStorage.getItem('cureFutanStrike')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('cureFutanStrike',JSON.stringify(SAVE))}catch(e){}}

// ================= draw helpers =================
function ell(c,x,y,rx,ry){c.beginPath();c.ellipse(x,y,rx,ry,0,0,TAU);c.fill();}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,TAU);c.fill();}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function starP(c,x,y,R,r,n=5,rot=-Math.PI/2){c.beginPath();for(let i=0;i<n*2;i++){const a=rot+i*Math.PI/n,d=i%2?r:R;c.lineTo(x+Math.cos(a)*d,y+Math.sin(a)*d);}c.closePath();}
function heartP(c,x,y,s){c.beginPath();c.moveTo(x,y+s*.95);c.bezierCurveTo(x-s*1.5,y-s*.05,x-s*.8,y-s*1.25,x,y-s*.45);c.bezierCurveTo(x+s*.8,y-s*1.25,x+s*1.5,y-s*.05,x,y+s*.95);c.closePath();}
function flowerP(c,x,y,r,col,mid){c.fillStyle=col;for(let i=0;i<5;i++){const a=i/5*TAU;circ(c,x+Math.cos(a)*r*.62,y+Math.sin(a)*r*.62,r*.5);}c.fillStyle=mid||'#ffe066';circ(c,x,y,r*.38);}
function otext(c,s,x,y,size,fill='#fff',stroke='#ff4f9a',align='center',font){c.font=`900 ${size}px ${font||FONT}`;c.textAlign=align;c.textBaseline='middle';c.lineJoin='round';c.lineWidth=Math.max(3,size*.24);c.strokeStyle=stroke;c.strokeText(s,x,y);c.fillStyle=fill;c.fillText(s,x,y);}
function hexA(h,a){const n=parseInt(h.slice(1),16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
const glowCache={};
function glow(col){if(glowCache[col])return glowCache[col];const g=document.createElement('canvas');g.width=g.height=64;const c=g.getContext('2d');const gr=c.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,hexA(col,1));gr.addColorStop(.35,hexA(col,.5));gr.addColorStop(1,hexA(col,0));c.fillStyle=gr;c.fillRect(0,0,64,64);return glowCache[col]=g;}
function drawGlow(c,col,x,y,r,a=1){c.globalAlpha=a;c.drawImage(glow(col),x-r,y-r,r*2,r*2);c.globalAlpha=1;}
function bow(c,x,y,col,s=1){c.fillStyle=col;for(const k of[-1,1]){c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+k*8*s,y-7*s,x+k*8*s,y);c.quadraticCurveTo(x+k*8*s,y+6*s,x,y);c.fill();c.stroke();c.beginPath();c.moveTo(x,y);c.lineTo(x+k*4*s,y+7*s);c.lineTo(x+k*1.5*s,y+7.5*s);c.closePath();c.fill();c.stroke();}c.fillStyle='#ffd84a';heartP(c,x,y+.3*s,2.4*s);c.fill();c.stroke();}

// ================= characters =================
const HAIR='#2b1d22',SKIN='#ffe4d4',LN='#5b2c47';
// ふーたん (cure:true でキュアふーたん)
function drawFutan(c,x,y,o){
  const t=o.t||0,cure=o.cure!==false,pose=o.pose||'run',mv=o.moving;
  c.save();c.translate(x,y);c.scale(o.s||1,o.s||1);
  if(!o.noShadow){c.fillStyle='rgba(40,0,40,.18)';ell(c,0,0,14,4.5);}
  const bob=pose==='win'?Math.abs(Math.sin(t*6))*3:mv?Math.abs(Math.sin(t*13))*2.2:Math.sin(t*3)*.8;
  c.translate(0,-bob-(o.lift||0));if(o.dir<0)c.scale(-1,1);if(o.spin!=null)c.scale(Math.cos(o.spin),1);
  c.lineJoin='round';c.lineCap='round';c.strokeStyle=LN;c.lineWidth=1.5;
  const HY=-41,sw=mv?Math.sin(t*13):0;
  if(cure){for(const k of[-1,1]){const w=Math.sin(t*6+k)*3;c.fillStyle=k<0?'#ff5fa8':'#ff8cc6';c.beginPath();c.moveTo(k*3,-20);c.bezierCurveTo(k*10,-16,k*14+w,-10,k*18+w,-2);c.lineTo(k*12+w,-3);c.bezierCurveTo(k*9,-9,k*6,-14,k*1,-18);c.closePath();c.fill();c.stroke();}}
  // うしろ髪（ボブ）
  c.fillStyle=HAIR;c.beginPath();c.moveTo(-16.5,HY);c.bezierCurveTo(-18,HY-23,18,HY-23,16.5,HY);c.quadraticCurveTo(18.5,HY+11,15.5,HY+16);c.quadraticCurveTo(0,HY+19,-15.5,HY+16);c.quadraticCurveTo(-18.5,HY+11,-16.5,HY);c.closePath();c.fill();c.stroke();
  // あし
  for(const k of[-1,1]){const lf=Math.max(0,k*sw)*3,lx=k*4-2.5;c.fillStyle=SKIN;rr(c,lx,-11-lf,5,8,2);c.fill();c.stroke();
    if(cure){c.fillStyle='#fff';rr(c,lx-1,-6.5-lf,7,7,2.5);c.fill();c.stroke();c.fillStyle='#ff6fae';c.fillRect(lx-.6,-6-lf,6.2,1.8);}
    else{c.fillStyle='#ff9ac4';rr(c,lx-1,-4-lf,7,4.5,2);c.fill();c.stroke();}}
  // スカート
  if(cure){c.fillStyle='#fff';for(let i=0;i<7;i++)circ(c,-13.5+i*4.5,-8.4,2.9);
    const g=c.createLinearGradient(0,-23,0,-8);g.addColorStop(0,'#ffb0d8');g.addColorStop(1,'#ff5fa8');c.fillStyle=g;
    c.beginPath();c.moveTo(-7,-23);c.lineTo(7,-23);c.quadraticCurveTo(12,-16,15,-10);for(let i=0;i<5;i++){const x0=15-i*6;c.quadraticCurveTo(x0-3,-6.8,x0-6,-10);}c.quadraticCurveTo(-12,-16,-7,-23);c.closePath();c.fill();c.stroke();
    c.fillStyle='rgba(255,255,255,.85)';heartP(c,-7,-14,1.7);c.fill();heartP(c,7,-14,1.7);c.fill();heartP(c,0,-12,1.7);c.fill();}
  else{c.fillStyle='#7ea6d8';c.beginPath();c.moveTo(-7,-19);c.lineTo(7,-19);c.lineTo(10,-9);c.lineTo(-10,-9);c.closePath();c.fill();c.stroke();}
  // からだ
  if(cure){c.fillStyle='#fff';rr(c,-7.5,-29.5,15,9.5,4);c.fill();c.stroke();c.fillStyle='#ff8cc6';c.fillRect(-7,-22,14,2.2);}
  else{c.fillStyle='#fff';rr(c,-8.5,-29.5,17,12.5,4);c.fill();c.stroke();const cols=['#5ac8f0','#ff7ab0','#ffd84a','#3fae5a','#e84a4a','#3a5ac8'];for(let i=0;i<6;i++){c.fillStyle=cols[i];circ(c,-5+(i%3)*5,-26+(i/3|0)*4.5,1.7);}}
  const arm=(k,hx,hy)=>{const sx=k*7,sy=-27;c.strokeStyle=LN;c.lineWidth=5;c.beginPath();c.moveTo(sx,sy);c.lineTo(hx,hy);c.stroke();c.strokeStyle=SKIN;c.lineWidth=3;c.stroke();c.lineWidth=1.5;c.strokeStyle=LN;c.fillStyle=cure?'#fff':SKIN;circ(c,hx,hy,2.7);c.stroke();
    c.fillStyle=cure?'#ff8cc6':'#fff';circ(c,sx,sy+.5,cure?4.2:3.6);c.stroke();};
  const arms=()=>{if(pose==='win'){arm(-1,-21,HY-12+Math.sin(t*8)*1.5);arm(1,21,HY-12-Math.sin(t*8)*1.5);}
    else if(pose==='cast'){arm(-1,-10,-18);arm(1,17,-30);}
    else{arm(-1,-10,-17+sw*2.5);arm(1,10,-17-sw*2.5);}};
  arms();
  if(cure)bow(c,0,-26.5,'#ff4f9a',.9);
  // あたま
  c.fillStyle=SKIN;c.beginPath();c.ellipse(0,HY+2,14.5,13.5,0,0,TAU);c.fill();c.stroke();
  const blink=((t+.7)%3.6)<.13,lk=(o.look||0)*1.2;
  for(const k of[-1,1]){const ex=k*5.6+lk,ey=HY+5;
    if(blink||o.happy){c.lineWidth=1.9;c.beginPath();c.arc(ex,ey+1.5,3,Math.PI*1.1,Math.PI*1.9);c.stroke();c.lineWidth=1.5;}
    else if(o.ouch){c.lineWidth=1.8;c.beginPath();c.moveTo(ex-2.5*k,ey-2);c.lineTo(ex+2*k,ey);c.lineTo(ex-2.5*k,ey+2);c.stroke();c.lineWidth=1.5;}
    else{c.fillStyle='#3a1f2e';ell(c,ex,ey,3.2,4.1);const g=c.createLinearGradient(0,ey-1,0,ey+4);g.addColorStop(0,'#3a1f2e');g.addColorStop(1,cure?'#ee5aa6':'#8a5a3a');c.fillStyle=g;ell(c,ex,ey+1.1,2.4,2.8);
      c.fillStyle='#fff';ell(c,ex-1,ey-1.5,1.3,1.6);circ(c,ex+1.2,ey+2,.7);
      c.lineWidth=2;c.beginPath();c.ellipse(ex,ey,3.4,4.3,0,Math.PI*1.15,Math.PI*1.85);c.stroke();c.beginPath();c.moveTo(ex+k*3,ey-2.4);c.lineTo(ex+k*4.6,ey-3.6);c.stroke();c.lineWidth=1.5;}}
  c.fillStyle='rgba(255,110,150,.35)';ell(c,-9.2,HY+10,3,1.8);ell(c,9.2,HY+10,3,1.8);
  if(o.ouch){c.fillStyle='#e0506a';ell(c,0,HY+11.5,1.8,2.2);}
  else{c.fillStyle='#e0506a';c.beginPath();c.moveTo(-3,HY+10);c.quadraticCurveTo(0,HY+14.5,3,HY+10);c.closePath();c.fill();c.stroke();c.fillStyle='#fff';c.fillRect(-2,HY+10.2,4,.9);}
  // まえがみ
  c.fillStyle=HAIR;c.beginPath();c.moveTo(-15.5,HY+11);c.quadraticCurveTo(-17.5,HY-6,-10,HY-11);c.quadraticCurveTo(0,HY-15,10,HY-11);c.quadraticCurveTo(17.5,HY-6,15.5,HY+11);c.lineTo(13,HY+4);c.lineTo(11.5,HY+.5);
  [9,6,3,0,-3,-6,-9].forEach((bx,i)=>c.lineTo(bx,HY+(i%2?-.8:1)));c.lineTo(-11.5,HY+.5);c.lineTo(-13,HY+4);c.closePath();c.fill();c.stroke();
  // ぼうし
  const capC=cure?'#ff7ab8':'#c98aa6',capD=cure?'#e0508e':'#a86a86';
  c.fillStyle=capC;c.beginPath();c.moveTo(-15.8,HY-6);c.bezierCurveTo(-16.5,HY-25,16.5,HY-25,15.8,HY-6);c.closePath();c.fill();c.stroke();
  c.strokeStyle=hexA(capD,.8);c.lineWidth=1;c.beginPath();c.moveTo(0,HY-20);c.quadraticCurveTo(-6,HY-12,-8,HY-6);c.moveTo(0,HY-20);c.quadraticCurveTo(6,HY-12,8,HY-6);c.stroke();c.strokeStyle=LN;c.lineWidth=1.5;
  c.fillStyle=capD;c.beginPath();c.moveTo(-17,HY-6.5);c.quadraticCurveTo(0,HY-1,17,HY-6.5);c.quadraticCurveTo(0,HY-9.5,-17,HY-6.5);c.fill();c.stroke();
  c.fillStyle=capC;circ(c,0,HY-20.5,1.8);c.stroke();
  if(cure){c.fillStyle='#fff';for(const k of[-1,1]){c.beginPath();c.moveTo(k*3,HY-13);c.quadraticCurveTo(k*9,HY-19,k*11,HY-14);c.quadraticCurveTo(k*8,HY-13,k*9,HY-11);c.quadraticCurveTo(k*6,HY-11,k*3,HY-12);c.fill();c.stroke();}
    c.fillStyle='#ffd84a';heartP(c,0,HY-13,3.4);c.fill();c.stroke();c.fillStyle='rgba(255,255,255,.8)';circ(c,-1.2,HY-14,.9);
    bow(c,12,HY-16,'#ff4f9a',.75);}
  else{c.fillStyle='rgba(255,255,255,.85)';ell(c,0,HY-13,4.8,3.4);c.fillStyle='#8a6a7a';circ(c,-1.6,HY-13,.7);circ(c,1.6,HY-13,.7);}
  c.restore();}

// リッキー（あかちゃんの ようせい）

function update(dt){CLK+=dt;
  if(!G){return;}
  G.t+=dt;
  updFx(dt);
  if(G.banner){G.banner.t+=dt;if(G.banner.t>G.banner.dur)G.banner=null;}
  if(G.callout){G.callout.t+=dt;if(G.callout.t>1.1)G.callout=null;}
  G.shake=Math.max(0,G.shake-dt*40);G.flash=Math.max(0,G.flash-dt*1.5);
  G.dispHp+=(G.hp-G.dispHp)*Math.min(1,dt*6);
  for(const m of G.party){m.hurt=Math.max(0,m.hurt-dt);m.say=Math.max(0,m.say-dt);}
  for(const e of G.enemies){e.t+=dt;e.flash=Math.max(0,e.flash-dt);e.hurtT=Math.max(0,e.hurtT-dt);if(e.spawn<1)e.spawn=Math.min(1,e.spawn+dt*2.5);if(e.dead)e.dieT+=dt;}
  for(const it of G.items)it.t+=dt;
  if(state==='intro'){G.introT-=dt;if(G.introT<=0){state='aim';G.idle=0;}}
  else if(state==='aim'){G.idle+=dt;if(BOT)botAim(dt);}
  else if(state==='cutin'){G.cut.t+=dt;if(G.cut.t>1.25){const c=G.cut;G.cut=null;launch(c.dx,c.dy,c.pow,true);}}
  else if(state==='move')updMove(dt);
  else if(state==='enemy')updEnemy(dt);
  else if(state==='wclear'){G.endT-=dt;if(G.endT<=0){G.wave++;spawnWave();}}
  else if(state==='win'){G.endT-=dt;if(Math.random()<dt*30)G.parts.push({x:rnd(0,LW),y:FY-10,vx:rnd(-40,40),vy:rnd(60,160),life:2.5,max:2.5,col:pick(['#ff7ab8','#ffd84a','#7fe3ff','#b98cff','#7dffb0']),sz:rnd(4,7),shape:pick(['star','heart','dot']),g:1});if(G.endT<=0){state='done';showClear();}}
  else if(state==='lose'){G.endT-=dt;if(G.endT<=0){state='done';showOver();}}
}
function updMove(dt){

  if(b){const sp=Math.hypot(b.vx,b.vy),n=Math.max(1,Math.ceil(sp*dt/5)),h=dt/n;for(let i=0;i<n;i++)stepBall(b,h);
    b.m.x=b.x;b.m.y=b.y;b.trail.push({x:b.x,y:b.y});if(b.trail.length>14)b.trail.shift();
    const ns=Math.max(0,sp-(sp*.42+70)*b.fr*dt);if(ns<30){G.ball=null;b.m.r=22;b.m.x=clamp(b.x,22,LW-22);b.m.y=clamp(b.y,FY+22,FB-22);}

  for(const u of G.bubbles){u.life-=dt;const sp=Math.hypot(u.vx,u.vy),n=Math.max(1,Math.ceil(sp*dt/5)),h=dt/n;for(let i=0;i<n;i++)stepBall(u,h);const ns=Math.max(0,sp-(sp*.3+40)*dt);u.vx*=ns/(sp||1);u.vy*=ns/(sp||1);if(ns<30)u.life=Math.min(u.life,.3);}
  G.bubbles=G.bubbles.filter(u=>{if(u.life<=0){burst(u.x,u.y,'#bff4ff',4,80,'dot');return false;}return true;});
  if(G.starRain){const S=G.starRain;S.t+=dt;S.acc+=dt;while(S.acc>.2&&S.n>0){S.acc-=.2;S.n--;const live=G.enemies.filter(e=>!e.dead);if(live.length){const tg=pick(live);G.projs.push({k:'star',x:tg.x+rnd(-30,30),y:FY-20,vx:0,vy:700,tg,dmg:atkOf(G.party.find(p=>p.id==='ricky'))*1.6,t:0,col:'#ffd84a'});}}if(S.n<=0)G.starRain=null;}

  const cvs=$('teamCv');charCanvas(cvs,ids,{name:true});
  const L=$('stageList');L.innerHTML='';STAGES.forEach((st,i)=>{const b=document.createElement('button');const lock=i>SAVE.cleared;b.className='st'+(lock?' lock':'');
    const s=SAVE.stars[i]||0;b.innerHTML=`<span class="em">${lock?'🔒':st.emoji}</span><span><b>${i+1}. ${st.name}</b><small>ボス：${st.boss.name}</small></span><span class="ok">${s?'⭐'.repeat(s)+'<span style="opacity:.25">'+'⭐'.repeat(3-s)+'</span>':''}</span>`;
    b.onclick=()=>{audio();SFX.tap();start(i);};L.appendChild(b);});}
function start(si){newStage(si);show(null);}
function gainExp(n){const ups=[];SAVE.exp+=n;while(SAVE.exp>=expNeed(SAVE.lv)){SAVE.exp-=expNeed(SAVE.lv);SAVE.lv++;ups.push(SAVE.lv);}save();return ups;}
function expHTML(el,gain,before,ups){const b0=before.exp/expNeed(before.lv);el.innerHTML=`<div class="lbl"><span>チームレベル <span id="lvNum">${before.lv}</span></span><span>けいけんち +${gain}</span></div><div class="bar"><i></i></div><div id="lvMsg"></div>`;
  const bar=el.querySelector('i');bar.style.transition='none';bar.style.width=(b0*100)+'%';let step=0;
  const run=()=>{if(step<ups.length){bar.style.transition='width .5s ease-out';bar.style.width='100%';setTimeout(()=>{$('lvNum').textContent=ups[step];el.querySelector('#lvMsg').innerHTML='<div class="lvup">レベルアップ！ つよくなった！</div>';SFX.level?SFX.level():SFX.clear();bar.style.transition='none';bar.style.width='0%';step++;setTimeout(run,450);},550);}
    else{requestAnimationFrame(()=>{bar.style.transition='width .5s ease-out';bar.style.width=(SAVE.exp/expNeed(SAVE.lv)*100)+'%';});}};
  setTimeout(run,500);}
SFX.level=()=>{[523,659,784,1047,1319].forEach((f,i)=>tone(f,.2,'triangle',.13,0,i*.07));};
function showClear(){const si=G.si,before={lv:SAVE.lv,exp:SAVE.exp},stars=G.revived?1:G.hp/G.maxHp>=.5?3:2;
  const firstClear=si>=SAVE.cleared;const prevUnl=unlocked().length;
  if(firstClear)SAVE.cleared=si+1;SAVE.stars[si]=Math.max(SAVE.stars[si]||0,stars);
  const gain=[150,220,300,400][si]+(firstClear?0:0);const ups=gainExp(gain);
  $('clearStars').innerHTML=[0,1,2].map(i=>`<span class="${i<stars?'':'off'}" style="animation-delay:${.2+i*.25}s">⭐</span>`).join('');
  $('clearTitle').textContent=si===3?'ぜんぶ クリア！':'ステージクリア！';
  $('clearText').innerHTML=(si===3?'やったね！ みんなの おかげで<br>せかいに えがおが もどったよ！<br>':G.st.boss.name+' を やっつけた！<br>')+`<small>さいだい ${G.maxCombo} ヒット ／ ${G.kills} たい やっつけた</small>`;
  expHTML($('clearExp'),gain,before,ups);
  const nu=unlocked();$('clearNew').innerHTML='';
  if(nu.length>prevUnl){const id=nu[nu.length-1],C=CHARS[id];$('clearNew').innerHTML=`<div class="newc"><canvas id="newCv" width="240" height="240"></canvas><b>🎉 ${C.name} が なかまに なったよ！</b><small style="font-weight:800">${C.type==='reflect'?'はねかえる':'つらぬく'}タイプ ・ ひっさつ「${C.ss}」</small></div>`;
    setTimeout(()=>{const cc=$('newCv');if(cc)charCanvas(cc,[id],{pose:'win'});},30);}
  $('nextBtn').style.display=si<3?'':'none';show('clear');}
function showOver(){const before={lv:SAVE.lv,exp:SAVE.exp},gain=60,ups=gainExp(gain);expHTML($('overExp'),gain,before,ups);show('over');}

$('startBtn').onclick=()=>{audio();SFX.tap();bgmPlay(2);buildSelect();show('select');};
$('backTitle').onclick=()=>{SFX.tap();show('title');};
$('muteBtn').onclick=()=>{SAVE.mute=!SAVE.mute;save();updMute();audio();};
function updMute(){$('muteBtn').textContent=SAVE.mute?'🔇 おと なし':'🔊 おと あり';}
updMute();
$('resumeBtn').onclick=()=>{state=prevState;show(null);};
$('quitBtn').onclick=()=>{G=null;state='title';bgmPlay(2);buildSelect();show('select');};
$('retryBtn').onclick=()=>{start(G.si);};
$('overSel').onclick=()=>{G=null;state='title';bgmPlay(2);buildSelect();show('select');};
$('nextBtn').onclick=()=>{start(Math.min(3,G.si+1));};
$('clearSel').onclick=()=>{G=null;state='title';bgmPlay(2);buildSelect();show('select');};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&['aim','move','enemy','intro','cutin','wclear'].includes(state))pause();});

// ================= ループ =================
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  for(let i=0;i<SPEED;i++)if(state!=='pause')update(dt);
  render();bgmTick();
  if($('select').classList.contains('show')&&((CLK*10)|0)%2===0)charCanvas($('teamCv'),unlocked(),{name:true});
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);
if(BOT&&Q.has('stage')){start(+Q.get('stage')||0);}
</script>
</body>
