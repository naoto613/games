<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0b0d">
<title>GRAND CHIBIKKO AUTO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
:root{--ink:#f5f3ee;--sub:rgba(245,243,238,.7);--gold:#ffd23f;--money:#7ddc6a;--red:#e8433b;--blue:#3b8de8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0a0b0d;color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hide{display:none!important}
.gta{font-family:Anton,Impact,"Arial Black","Hiragino Sans",sans-serif;font-weight:400}
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 58%,rgba(0,0,0,.38) 100%)}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:30;transition:opacity .4s}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#tr{position:absolute;top:max(12px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));text-align:right}
#money{font-size:34px;color:var(--money);letter-spacing:.02em;-webkit-text-stroke:1.5px #0b2a07;text-shadow:2px 2px 0 #000;line-height:1}
#stars{font-size:26px;letter-spacing:2px;line-height:1.1;margin-top:2px}
#stars i{font-style:normal;color:rgba(255,255,255,.18);-webkit-text-stroke:1px rgba(0,0,0,.6)}
#stars i.on{color:#fff;text-shadow:0 0 8px rgba(255,255,255,.7)}
#stars.flash i.on{animation:sf .5s steps(2) infinite}
@keyframes sf{50%{color:var(--gold)}}
#timer{font-size:30px;color:#fff;-webkit-text-stroke:1px #000;text-shadow:2px 2px 0 #000;margin-top:4px}
#counter{font-size:20px;color:#fff;-webkit-text-stroke:1px #000;text-shadow:2px 2px 0 #000;font-weight:800}
#radarW{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));width:168px;height:168px;border-radius:50%;box-shadow:0 0 0 3px rgba(0,0,0,.55),0 4px 18px rgba(0,0,0,.45);overflow:hidden}
#radar{width:168px;height:168px;display:block}
#areaN,#vehN{position:absolute;right:max(18px,env(safe-area-inset-right));font-size:30px;color:#fff;-webkit-text-stroke:1.2px #000;text-shadow:2px 2px 0 #000;opacity:0;transition:opacity .6s;white-space:nowrap;font-weight:900;letter-spacing:.04em}
#areaN{bottom:calc(max(18px,env(safe-area-inset-bottom)) + 210px);font-style:italic}
#vehN{bottom:calc(max(18px,env(safe-area-inset-bottom)) + 250px);color:#cfe7ff}
#radioN{position:absolute;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .5s}
#radioN .rn{font-size:26px;color:#fff;-webkit-text-stroke:1px #000;text-shadow:2px 2px 0 #000;font-weight:900}
#radioN .rs{font-size:13px;color:#ffe9a8;text-shadow:1px 1px 0 #000;font-weight:700}
#sub{position:absolute;left:50%;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 150px);transform:translateX(-50%);width:min(92vw,820px);text-align:center;font-size:clamp(17px,2.6vw,24px);font-weight:800;color:#fff;text-shadow:0 0 4px #000,2px 2px 0 #000;line-height:1.45;letter-spacing:.04em}
#sub b{color:var(--gold)}
#sub .who{color:#8fd0ff}
#obj{position:absolute;left:50%;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 120px);transform:translateX(-50%);width:min(92vw,820px);text-align:center;font-size:clamp(15px,2.2vw,20px);font-weight:800;color:#fff;text-shadow:0 0 4px #000,2px 2px 0 #000}
#obj b{color:var(--gold)}
#help{position:absolute;left:50%;top:max(70px,calc(env(safe-area-inset-top) + 60px));transform:translateX(-50%);background:rgba(0,0,0,.72);border-radius:6px;padding:10px 16px;font-size:16px;font-weight:700;max-width:min(90vw,520px);text-align:center;opacity:0;transition:opacity .3s;line-height:1.5}
#help b{color:var(--gold)}
#big{position:absolute;left:0;right:0;top:34%;text-align:center;opacity:0;transition:opacity .5s}
#big .t1{font-size:clamp(40px,8vw,84px);line-height:1;color:var(--gold);-webkit-text-stroke:2px #000;text-shadow:4px 4px 0 #000;letter-spacing:.03em;font-weight:900}
#big .t2{font-size:clamp(20px,3.6vw,34px);color:#fff;-webkit-text-stroke:1px #000;text-shadow:2px 2px 0 #000;margin-top:10px;font-weight:900}
#big.pass .t1{color:var(--gold)}
#big.busted .t1{color:#ff5a4e}
#big.mission .t1{color:#fff;font-size:clamp(30px,5.6vw,60px)}
#big.mission .t2{color:var(--gold)}
#slowfx{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0;transition:opacity .3s;box-shadow:inset 0 0 160px rgba(0,0,0,.65);background:linear-gradient(180deg,#000 0,#000 9%,transparent 9%,transparent 91%,#000 91%)}
.bub{position:absolute;transform:translate(-50%,-100%);background:#fff;color:#222;border-radius:14px;padding:4px 10px;font-size:16px;font-weight:900;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.35);opacity:0;transition:opacity .2s}
.bub:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
#speedo{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:calc(max(18px,env(safe-area-inset-bottom)) + 296px);font-size:22px;color:#fff;-webkit-text-stroke:1px #000;text-shadow:2px 2px 0 #000;opacity:.9}

/* ---------- touch controls ---------- */
#tc{position:fixed;inset:0;z-index:6;pointer-events:none}
#stickBase{position:absolute;width:140px;height:140px;margin:-70px 0 0 -70px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(0,0,0,.18);pointer-events:none}
#stickKnob{position:absolute;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 2px 10px rgba(0,0,0,.4);pointer-events:none}
#stickHint{position:absolute;left:max(40px,env(safe-area-inset-left));bottom:max(40px,env(safe-area-inset-bottom));width:140px;height:140px;border-radius:50%;border:2px dashed rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:rgba(255,255,255,.7);text-shadow:1px 1px 0 #000;pointer-events:none}
.tb{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:3px solid rgba(255,255,255,.75);background:rgba(10,12,16,.45);color:#fff;font:inherit;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;text-shadow:1px 1px 0 #000;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);padding:0}
.tb .ic{font-size:30px}
.tb .lb{font-size:12px;margin-top:2px}
.tb.on{background:rgba(255,210,63,.6);border-color:#fff}
.tb.pulse{animation:pu 1s ease-in-out infinite}
@keyframes pu{50%{transform:scale(1.12);box-shadow:0 0 22px rgba(255,210,63,.9)}}
#bA{right:max(26px,env(safe-area-inset-right));bottom:max(30px,env(safe-area-inset-bottom));width:96px;height:96px}
#bB{right:calc(max(26px,env(safe-area-inset-right)) + 108px);bottom:max(22px,env(safe-area-inset-bottom));width:78px;height:78px}
#bC{right:calc(max(26px,env(safe-area-inset-right)) + 14px);bottom:calc(max(30px,env(safe-area-inset-bottom)) + 110px);width:78px;height:78px}
#bD{right:calc(max(26px,env(safe-area-inset-right)) + 110px);bottom:calc(max(22px,env(safe-area-inset-bottom)) + 92px);width:66px;height:66px}
#bD .ic{font-size:24px}
#bE{right:calc(max(26px,env(safe-area-inset-right)) + 190px);bottom:max(22px,env(safe-area-inset-bottom));width:66px;height:66px}
#bE .ic{font-size:24px}
#bPause{position:absolute;pointer-events:auto;top:max(12px,env(safe-area-inset-top));left:calc(max(14px,env(safe-area-inset-left)) + 180px);width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(0,0,0,.45);color:#fff;font-size:18px;font-weight:900}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
#loading{background:#0a0b0d;flex-direction:column;gap:18px;z-index:40}
#loading .lg{font-size:42px;letter-spacing:.04em;line-height:.95;text-align:center;-webkit-text-stroke:1.5px #000;text-shadow:3px 3px 0 #000}
#loading .bar{width:220px;height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
#loading .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
#loading .tip{font-size:14px;color:var(--sub);font-weight:700}
#title{background:linear-gradient(90deg,rgba(0,0,0,.62) 0,rgba(0,0,0,.25) 46%,rgba(0,0,0,0) 70%);justify-content:flex-start;align-items:center}
.logo{line-height:.86;letter-spacing:.01em;text-shadow:5px 5px 0 #000;-webkit-text-stroke:2.5px #000}
.logo .l1{font-size:clamp(48px,9vw,104px);color:#fff}
.logo .l2{font-size:clamp(58px,11vw,128px);color:var(--gold);display:block}
.logo .l3{font-size:clamp(48px,9vw,104px);color:#fff}
.tsub{margin:14px 0 22px;font-size:clamp(15px,2.3vw,19px);font-weight:900;color:#fff;text-shadow:2px 2px 0 #000;letter-spacing:.08em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.row .lab{font-size:13px;font-weight:800;color:var(--sub);width:86px}
.btn{appearance:none;font:inherit;font-weight:900;font-size:16px;color:#fff;background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.55);border-radius:8px;padding:9px 16px;cursor:pointer;text-shadow:1px 1px 0 #000}
.btn.on{background:var(--gold);color:#111;border-color:#fff;text-shadow:none}
.btn.big{font-size:24px;padding:14px 40px;background:#e8433b;border-color:#fff;border-radius:10px;box-shadow:0 6px 0 #7a1712,0 10px 24px rgba(0,0,0,.4)}
.btn.big:active{transform:translateY(4px);box-shadow:0 2px 0 #7a1712}
.keys{margin-top:18px;font-size:12px;color:var(--sub);font-weight:700;line-height:1.8}
.keys b{display:inline-block;border:1px solid rgba(255,255,255,.4);border-radius:4px;padding:0 6px;margin:0 3px;color:#fff;font-size:11px}
#back{position:fixed;z-index:21;top:max(12px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));font-size:13px;font-weight:800;color:#fff;text-decoration:none;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:7px 14px}
#pause{background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);flex-direction:column}
.pm{width:min(96vw,880px);max-height:100%;overflow:auto;display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.pm h2{margin:0 0 10px;font-size:34px;letter-spacing:.04em;color:#fff;-webkit-text-stroke:1px #000}
.pcol{flex:1 1 300px;min-width:280px}
#bigmap{width:100%;max-width:420px;aspect-ratio:1;border:3px solid rgba(255,255,255,.6);border-radius:8px;display:block;background:#123}
.mlist{display:flex;flex-direction:column;gap:7px}
.mi{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.22);border-radius:8px;padding:8px 12px;cursor:pointer;color:#fff;font:inherit;font-weight:800;font-size:16px;text-align:left}
.mi:hover{border-color:var(--gold)}
.mi .e{font-size:26px;width:34px;text-align:center}
.mi .d{margin-left:auto;font-size:13px;color:var(--gold)}
.stat{font-size:14px;font-weight:800;color:var(--sub);margin:10px 0;line-height:1.7}
.stat b{color:#fff}
</style>
</head>
<body>

</div>

  </div>
</div>

      <div class="mlist" id="mlist"></div>
      <div class="row" style="margin-top:14px"><button class="btn big" id="bResume" style="background:#2c8a3c;box-shadow:0 6px 0 #164d1f">つづける ▶</button></div>
      <div class="row"><button class="btn" id="bQuit">ミッションを やめる</button><button class="btn" id="bSnd">🔊 おと</button><a class="btn" href="../" style="text-decoration:none">ゲームいちらんへ</a></div>
    </div>
  </div>
</div>
<div id="fade"></div>

<script>
'use strict';
// ================================================================ core utils
const $ = s => document.querySelector(s);
const V3 = THREE.Vector3;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const angWrap = a => Math.atan2(Math.sin(a), Math.cos(a));
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const RND = mulberry(20261001);
const rr = (a, b) => a + (b - a) * RND();
const ri = (a, b) => Math.floor(rr(a, b + 1));
const pick = a => a[Math.floor(RND() * a.length)];
const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
const lowEnd = isTouch && Math.min(screen.width, screen.height) < 700;
const Q = { pr: Math.min(devicePixelRatio || 1, isTouch ? (lowEnd ? 1.25 : 1.6) : 2), shadow: lowEnd ? 1024 : 2048 };

// tileable value noise
function makeNoise2(seed, period) {
  const r = mulberry(seed), P = period, g = new Float32Array(P * P);
  for (let i = 0; i < g.length; i++) g[i] = r();
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
    const x0 = ((xi % P) + P) % P, y0 = ((yi % P) + P) % P, x1 = (x0 + 1) % P, y1 = (y0 + 1) % P;
    const u = smooth(fx), v = smooth(fy);
    return lerp(lerp(g[y0 * P + x0], g[y0 * P + x1], u), lerp(g[y1 * P + x0], g[y1 * P + x1], u), v);
  };
}
function fbm(n, x, y, oct) { let s = 0, a = 0.5, f = 1, t = 0; for (let k = 0; k < oct; k++) { s += a * n(x * f, y * f); t += a; f *= 2; a *= 0.5; } return s / t; }

// ================================================================ renderer / scene
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Q.pr);
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.78;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.physicallyCorrectLights = false;
const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.2, 6000);

// ================================================================ sun / sky
const SUN = new V3();
{ const el = 0.62, az = 2.35; SUN.set(Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az)).normalize(); }
const skyU = {
  sunPosition: { value: SUN.clone().multiplyScalar(4000) }, up: { value: new V3(0, 1, 0) },
  turbidity: { value: 2.6 }, rayleigh: { value: 1.3 }, mieCoefficient: { value: 0.003 }, mieDirectionalG: { value: 0.82 },
  hazeCol: { value: new THREE.Color(0x9fb4c8) }
};
const skyMat = new THREE.ShaderMaterial({
  uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `
uniform vec3 sunPosition; uniform float rayleigh; uniform float turbidity; uniform float mieCoefficient; uniform vec3 up;
varying vec3 vWorldPosition; varying vec3 vSunDirection; varying float vSunfade; varying vec3 vBetaR; varying vec3 vBetaM; varying float vSunE;
const float e = 2.718281828459045;
const vec3 totalRayleigh = vec3( 5.804542996261093E-6, 1.3562911419845635E-5, 3.0265902468824876E-5 );
const vec3 MieConst = vec3( 1.8399918514433978E14, 2.7798023919660528E14, 4.0790479543861094E14 );
const float cutoffAngle = 1.6110731556870734; const float steepness = 1.5; const float EE = 1000.0;
float sunIntensity( float c ) { c = clamp( c, -1.0, 1.0 ); return EE * max( 0.0, 1.0 - pow( e, -( ( cutoffAngle - acos( c ) ) / steepness ) ) ); }
vec3 totalMie( float T ) { float c = ( 0.2 * T ) * 10E-18; return 0.434 * c * MieConst; }
void main() {
  vec4 worldPosition = modelMatrix * vec4( position, 1.0 );
  vWorldPosition = worldPosition.xyz;
  gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
  gl_Position.z = gl_Position.w;
  vSunDirection = normalize( sunPosition );
  vSunE = sunIntensity( dot( vSunDirection, up ) );
  vSunfade = 1.0 - clamp( 1.0 - exp( ( sunPosition.y / 450000.0 ) ), 0.0, 1.0 );

      const tx = -dx, tz = -dz; // travel dir

      const px = x + tx * (RW + 1.0) + lx * (RW + 1.0), pz = z + tz * (RW + 1.0) + lz * (RW + 1.0);

const STARS = [];
function buildStars() {

  // in the air above the jump park & park ramp (needs a jump)

function fmtTime(t) { const m = Math.floor(t / 60), s = t - m * 60; return `${m}:${s < 10 ? '0' : ''}${s.toFixed(1)}`; }
// ================================================================ game state / HUD
const SAVE_KEY = 'chibikko-auto-v1';

// ================================================================ main loop
let last = performance.now(), tAcc = 0;
const DR = { acc: 0, n: 0, pr: Q.pr };
function frame(now) {
  requestAnimationFrame(frame);
  let rdt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!rdt) rdt = 1 / 60;
  const t = now / 1000;
  MAT.water.normalMap.offset.set(t * 0.004, t * 0.006);
  if (!GAME.playing) {
    // title flyover
    GAME.titleT += rdt;
    const a = GAME.titleT * 0.035 + 2.6, r = 250;
    camera.position.set(Math.sin(a) * r, 78 + Math.sin(GAME.titleT * 0.1) * 8, Math.cos(a) * r);
    camera.lookAt(Math.sin(a) * 40, 0, Math.cos(a) * 40);
    updateTrafficLights(rdt); updateTraffic(rdt); updatePeds(rdt);
    renderVehicles(rdt); renderPeds(); updateSun(camera.position.x * 0.5, camera.position.z * 0.5);
    sky.position.copy(camera.position);
    renderer.render(scene, camera);
    return;
  }
  if (GAME.paused) { renderer.render(scene, camera); IN.jumpE = IN.actE = IN.radioE = IN.hornE = false; return; }
  const dt = rdt * GAME.timeScale;
  // dynamic resolution: keep tablets smooth
  DR.acc += rdt; DR.n++;
  if (DR.acc > 2) {
    const avg = DR.acc / DR.n; DR.acc = 0; DR.n = 0;
    let pr = DR.pr;
    if (avg > 0.024) pr = Math.max(0.7, pr - 0.15); else if (avg < 0.0145) pr = Math.min(Q.pr, pr + 0.1);
    if (Math.abs(pr - DR.pr) > 0.01) { DR.pr = pr; renderer.setPixelRatio(pr); renderer.setSize(innerWidth, innerHeight); }
  }
  updateTrafficLights(dt);
  // player
  if (PLAYER.veh) updatePlayerDrive(dt); else updatePlayerFoot(dt);
  playerExtras(dt, t);
  updateTraffic(dt);
  updatePeds(dt);
  updateProps(dt);
  updateFires(dt, t);
  FXN.update(dt); FXA.update(dt);
  updateStars(dt, t);
  updateMarkers(dt, t);
  updateStunt(rdt);
  // missions
  if (GAME.cool > 0) GAME.cool -= rdt;
  if (GAME.mission) { try { GAME.mission.update(GAME.ms, dt); } catch (e) { console.error(e); GAME.endMission(); } }
  else if (!(GAME.cool > 0)) {
    for (const m of GAME.startMarkers) {
      const r = PLAYER.veh ? 3.2 : 1.6;
      if (m.hidden) continue;
      if (!inMarker(m, r + 2.5)) m.armed = true;
      if (m.armed && inMarker(m, r)) { m.armed = false; GAME.startMission(m.start); break; }
    }
  }
  if (!GAME.mission) { GAME.obj(GAME.wanted > 0 ? '<b>おまわりさん</b>から にげよう！ しばらく いたずら しないと あきらめるよ' : ''); }
  GAME.updateWanted(dt);
  AU.sirenTick(rdt); AU.radioTick();
  // temp peds cleanup
  for (let k = PEDS.length - 1; k >= 0; k--) { const p = PEDS[k]; if (p.temp) { p.life -= dt; if (p.life <= 0 && distToPlayer(p) > 25) removePed(p); } }
  renderVehicles(dt); renderPeds();
  updateCamera(rdt);
  updateBubbles(rdt);
  updateSun(PLAYER.x + Math.sin(CAM.yaw) * 30, PLAYER.z + Math.cos(CAM.yaw) * 30);
  sky.position.copy(camera.position);
  updateHUD(rdt);
  renderer.render(scene, camera);
  IN.jumpE = IN.actE = IN.radioE = IN.hornE = false;
  // autosave
  tAcc += rdt; if (tAcc > 10) { tAcc = 0; GAME.saveNow(); }
}
function playerExtras(dt, t) {
  const v = PLAYER.veh;
  const hornKey = IN.keys.has('KeyH');
  if (v) {
    const isFire = GAME.ms && GAME.ms.def.id === 'fire' && v === GAME.ms.veh;
    if (!isFire) {
      if (v.type === 'police' && !GAME.mission) {
        if (IN.hornE || (hornKey && !GAME._hk)) { v.siren = !v.siren; AU.siren(v.siren ? 'police' : null); if (v.siren) GAME.help('🚨 サイレン オン！ くるまが みちを あけてくれるよ', 2); }
        if (v.siren) {
          for (const o of VEH) if (o.ai === 'lane' && Math.hypot(o.x - v.x, o.z - v.z) < 28) o.bumpT = Math.max(o.bumpT, 0.5);
        }
      } else if (IN.hornE || (hornKey && !GAME._hk)) {
        AU.honk(1, v.T.mass > 1.5);
        for (const p of PEDS) if (!p.immune && Math.hypot(p.x - v.x, p.z - v.z) < 12 && p.state === 'walk' && RND() < 0.5) { bubble(pick(['こんにちは〜！', 'やあ！', 'いいくるまだね！', 'ブーブー！']), p, 1.4); }
      }
    }
    if (v.siren && AU.sirType !== v.T.siren && v.T.siren !== 'ice') AU.siren(v.T.siren);
    if (!v.siren && AU.sirType && AU.sirType !== 'ice' && !GAME.mission) AU.siren(null);
    if (IN.radioE) { AU.st = (AU.st + 1) % AU.stations.length; AU.setRadio(true, AU.st); GAME.showRadio(); }
  } else {
    if (IN.hornE || (hornKey && !GAME._hk)) {
      PLAYER.waveT = 1.2;
      let n = 0;
      for (const p of PEDS) if (!p.immune && Math.hypot(p.x - PLAYER.x, p.z - PLAYER.z) < 9 && n < 3 && p.state === 'walk') { n++; p.state = 'wave'; p.stateT = 0; p.face = PLAYER; p.waveBack = 2.2; bubble(pick(['こんにちは！', 'やっほー！', 'げんきだね！', 'おはよう！']), p, 1.8); }
      if (!n) bubble('こんにちは〜！', PLAYER, 1.2);
    }
    if (PLAYER.waveT > 0) { PLAYER.waveT -= dt; const u = PLAYER.model.userData; u.armR.rotation.x = -2.8 + Math.sin(t * 14) * 0.3; u.armR.rotation.z = -0.4; } else PLAYER.model.userData.armR.rotation.z = -0.15;
    if (GAME.nearCar && !GAME.mission && !GAME._carHint) { GAME._carHint = true; GAME.help(isTouch ? '🚗 <b>のる</b> ボタンで くるまに のれるよ！' : '🚗 <b>F</b> キーで くるまに のれるよ！', 3); }
  }
  GAME._hk = hornKey;
  // peds that waved go back to walking
  for (const p of PEDS) if (p.waveBack > 0) { p.waveBack -= dt; if (p.waveBack <= 0 && p.loop) { p.state = 'walk'; p.face = null; } }
  // fell into the sea? (shouldn't happen, but be safe)
  const o = v || PLAYER;
  if (Math.abs(o.x) > EDGE + 2 || Math.abs(o.z) > EDGE + 2 || o.y < -5) {
    o.x = clamp(o.x, -EDGE + 8, EDGE - 8); o.z = clamp(o.z, -EDGE + 8, EDGE - 8); o.y = groundY(o.x, o.z); if (v) { v.vx = v.vz = 0; v.vy = 0; v.air = false; }
  }
}
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && GAME.playing && !GAME.paused) GAME.togglePause(true); });
syncTitle();
boot().catch(e => { console.error(e); $('#ltip').textContent = 'エラー: ' + e.message; });
</script>
