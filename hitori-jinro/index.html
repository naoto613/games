<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>ひとり人狼 〜月影の村〜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700;900&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
:root{--bg:#efe3cc;--bg2:#e4d3b2;--panel:#fffaf0;--ink:#3a2e22;--sub:#7a6a55;--line:#d6c29e;--accent:#a8432a;--bubble:#ffffff;--me:#fde9c8;--sys:#6b5a45;--black:#c0392b;--white:#2471a3;--priv:#efe4ff;--privInk:#4b2a8a;--btn:#a8432a;--btnInk:#fff}
body.night{--bg:#121830;--bg2:#1a2242;--panel:#1c2444;--ink:#e8e6f2;--sub:#9aa0c0;--line:#2f3a66;--accent:#e6bd55;--bubble:#252e55;--me:#3a3560;--sys:#b8bede;--black:#ff7b6b;--white:#7cc0ff;--priv:#2c2456;--privInk:#d8c8ff;--btn:#e6bd55;--btnInk:#1a1630}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(var(--bg),var(--bg2));background-attachment:fixed;color:var(--ink);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;transition:background .8s,color .8s;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#app{display:none;flex-direction:column;height:100vh;height:100dvh;max-width:1100px;margin:0 auto}
#app.on{display:flex}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
#dayLabel{font-family:"Zen Old Mincho",serif;font-weight:900;font-size:18px;white-space:nowrap}
#myRole{font-size:12px;font-weight:800;padding:2px 10px;border-radius:99px;background:var(--accent);color:var(--btnInk);white-space:nowrap;cursor:pointer}
header .sp{flex:1}
.hb{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700;cursor:pointer}
#board{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px;padding:8px 10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;padding:5px 2px 4px;border-radius:12px;background:var(--panel);border:2px solid transparent;cursor:pointer;transition:transform .15s,border-color .2s;min-width:0}
.tile:hover{transform:translateY(-2px)}
.tile.speak{border-color:var(--accent)}
.tile.me{box-shadow:inset 0 0 0 1px var(--accent)}
.av{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none;background:#999}
.av svg{display:block;width:100%;height:100%}
.tile .nm{font-size:12px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile .st{font-size:10px;color:var(--sub);min-height:13px;line-height:13px;white-space:nowrap}
.tile.dead .av{filter:grayscale(1) brightness(.55)}
.tile.dead .nm{text-decoration:line-through;opacity:.6}
.tile.dead .st{color:var(--black);font-weight:700}
.bd{position:absolute;top:2px;left:2px;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.bd.r{left:auto;right:2px;align-items:flex-end}
.b{font-size:10px;line-height:14px;padding:0 4px;border-radius:5px;color:#fff;font-weight:800;background:#7a5cc4}
.b.seer{background:#7a4cc4}.b.medium{background:#2f8f7f}.b.knight{background:#3a6fb8}
.b.blk{background:#c0392b}.b.wht{background:#2471a3}.b.wolf{background:#8e1f1f}.b.memo1{background:#5a9bd5}.b.memo2{background:#8a8a8a}.b.memo3{background:#d35400}
.b.role{background:#555}.b.role.w{background:#8e1f1f}
#log{flex:1;overflow-y:auto;padding:8px 12px 16px}
.msg{display:flex;gap:8px;margin:7px 0;align-items:flex-start;animation:fin .25s ease-out}
.msg .av{width:34px;height:34px}
.msg .who{font-size:11px;color:var(--sub);font-weight:700}
.bub{background:var(--bubble);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:6px 11px;line-height:1.55;font-size:15px}
.msg.mine{flex-direction:row-reverse}
.msg.mine .bub{background:var(--me);border-radius:14px 4px 14px 14px}
.msg.mine .who{text-align:right}
.sys{text-align:center;color:var(--sys);font-size:13px;margin:10px 0;line-height:1.6;animation:fin .25s ease-out}
.sys.head{font-family:"Zen Old Mincho",serif;font-weight:900;font-size:17px;color:var(--ink);margin:18px 0 8px}
.sys.chief{font-style:italic}
.priv{margin:8px auto;max-width:520px;background:var(--priv);color:var(--privInk);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:700;text-align:center;animation:fin .25s ease-out}
.votes{margin:8px auto;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;animation:fin .25s ease-out}
.votes .row{display:flex;justify-content:space-between;gap:8px;padding:1px 0}
.votes .tot{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px;font-weight:800}
.k{color:var(--black);font-weight:800}.w{color:var(--white);font-weight:800}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#panel{border-top:1px solid var(--line);padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:var(--panel);min-height:58px}
#panel .q{font-size:13px;font-weight:800;color:var(--sub);margin-bottom:6px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:none;background:var(--btn);color:var(--btnInk);border-radius:10px;padding:9px 13px;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.opt:active{transform:translateY(1px)}
.opt.sub{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.opt.pl{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 5px}
.opt.pl .av{width:26px;height:26px}
.wait{color:var(--sub);font-size:13px;display:flex;align-items:center;gap:8px;justify-content:space-between}
@media (min-width:860px){
  #app.on{display:grid;grid-template-columns:290px 1fr;grid-template-rows:auto 1fr auto}
  header{grid-column:1/3}
  #board{grid-row:2/4;align-content:start;grid-template-columns:repeat(3,1fr);border-right:1px solid var(--line);overflow-y:auto}
  .av{width:56px;height:56px}
}
.sys.cue{font-style:italic;color:var(--sub);font-size:13px;margin:6px 0}
.cm{display:flex;gap:8px;align-items:flex-start;margin:8px 0;font-size:14px}
.cm .av{width:38px;height:38px}
.bar{display:grid;grid-template-columns:56px 1fr 40px;gap:8px;align-items:center;font-size:13px;margin:4px 0}
.bt{height:10px;background:var(--line);border-radius:99px;overflow:hidden}.bt i{display:block;height:100%;border-radius:99px}
.tells li{margin:3px 0}.tells.mine li{color:var(--black)}
/* title */
#title{position:fixed;inset:0;overflow-y:auto;background:radial-gradient(ellipse at 70% 15%,#3b4880 0%,#1a2140 45%,#0b0f20 100%);color:#efe9ff;display:flex;flex-direction:column;align-items:center;padding:24px 16px 32px}
#title.off{display:none}
.scene{display:block;width:min(560px,100%);aspect-ratio:560/220;flex:none;margin-top:4px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.ttl{position:relative;font-family:"Zen Old Mincho",serif;font-weight:900;text-align:center;margin-top:4px;line-height:1.2}
.ttl .t1{font-size:46px;letter-spacing:.08em;text-shadow:0 0 18px rgba(255,220,140,.35)}
.ttl .t2{font-size:18px;color:#e6bd55;letter-spacing:.2em;margin-top:6px}
.lead{max-width:460px;text-align:center;color:#b9bedb;font-size:14px;line-height:1.7;margin:14px 0 6px}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:14px;max-width:460px;width:100%;margin-top:10px}
.card label{font-size:13px;color:#b9bedb;font-weight:700;display:block;margin-bottom:6px}
.card input{width:100%;padding:9px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:#fff;font:inherit;font-size:16px}
.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rb{border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.2);color:#efe9ff;border-radius:10px;padding:7px 2px;font-size:13px;font-weight:800;cursor:pointer}
.rb.on{background:#e6bd55;color:#1a1630;border-color:#e6bd55}
.go{margin-top:16px;border:none;background:#e6bd55;color:#1a1630;font-family:"Zen Old Mincho",serif;font-weight:900;font-size:22px;padding:12px 44px;border-radius:99px;cursor:pointer;box-shadow:0 0 24px rgba(230,189,85,.45)}
.links{display:flex;gap:10px;margin-top:14px}
.links button{background:none;border:1px solid rgba(255,255,255,.25);color:#cfd3f0;border-radius:99px;padding:6px 14px;font-size:13px;cursor:pointer}
.rec{font-size:12px;color:#8f95ba;margin-top:12px;text-align:center}
.back{position:absolute;top:10px;left:12px;color:#cfd3f0;text-decoration:none;font-size:13px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(5,8,20,.65);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal.on{display:flex}
.mbox{background:var(--panel);color:var(--ink);border-radius:16px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:18px 18px 16px;box-shadow:0 10px 40px rgba(0,0,0,.4);animation:fin .25s ease-out}
.mbox h2{font-family:"Zen Old Mincho",serif;margin:0 0 8px;font-size:22px}
.mbox h3{font-size:15px;margin:14px 0 6px;border-left:4px solid var(--accent);padding-left:8px}
.mbox p,.mbox li{font-size:14px;line-height:1.7}
.mbox ul{padding-left:20px;margin:4px 0}
.mbox table{border-collapse:collapse;width:100%;font-size:13px}
.mbox td,.mbox th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
.mbox .close{margin-top:14px;display:flex;justify-content:flex-end;gap:8px}
.rolecard{text-align:center}
.rolecard .ic{font-size:64px;line-height:1.1}
.rolecard .rn{font-family:"Zen Old Mincho",serif;font-weight:900;font-size:34px;margin:4px 0}
.rolecard .tm{display:inline-block;font-size:12px;font-weight:800;padding:2px 12px;border-radius:99px;color:#fff;background:#2471a3}
.rolecard .tm.w{background:#8e1f1f}
.ph{display:flex;gap:12px;align-items:center}
.ph .av{width:64px;height:64px}
.memo{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.endlist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.endlist div{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:700;text-align:center}
.endlist .av{width:44px;height:44px}
.endlist .dead .av{filter:grayscale(1) brightness(.6)}
.big{font-family:"Zen Old Mincho",serif;font-weight:900;font-size:30px;text-align:center;margin:4px 0}
.big.win{color:#d4a017}.big.lose{color:#8e1f1f}
</style>
</head>

const rnd=Math.random;

/* ================= 状態 ================= */
let G=null;
let speed=1;
const P=i=>G.players[i];
const alive=i=>G.players[i].alive;
const aliveIds=()=>G.players.filter(p=>p.alive).map(p=>p.id);

const partnerOf=i=>{const q=G.players.find(p=>p.role==='wolf'&&p.id!==i);return q?q.id:null};
const col=b=>b?'人狼（黒）':'人間（白）';
const sty=i=>P(i).ch?P(i).ch.st:'logic';
function hon(s,t){
  const T=P(t);if(T.human)return T.name+'さん';
  const S=s==null?null:P(s);if(!S||S.human)return T.name+'さん';
  const h=S.ch.hon;return T.name+(h==='kc'?(T.ch.g==='m'?'くん':'ちゃん'):h);
}
function fmt(tpl,o){return tpl.replace(/\{(\w+)\}/g,(m,k)=>o[k]!=null?o[k]:m)}
function line(s,type,o){const a=P(s).ch.T[type];return fmt(Array.isArray(a)?pick(a):a,o||{})}
function moodOf(i){
  const p=P(i);if(p.human||!p.alive)return 'calm';const M=G.mood[i];
  if(M.s>0.5)return 'sad';if(M.a>0.55)return 'angry';if(M.n>0.45)return 'nervous';return 'calm';
}
const MOODTXT={calm:'落ち着いている',nervous:'そわそわしている',angry:'怒っている',sad:'悲しんでいる'};
function tell(who,text){if(!G.tells.some(x=>x.who===who&&x.text===text))G.tells.push({day:G.day,who,text})}

function newGame(name,roleChoice){
  const deck=shuffle(DECK.slice());
  if(roleChoice&&roleChoice!=='random'){deck.splice(deck.indexOf(roleChoice),1);deck.unshift(roleChoice)}
  const players=[{id:0,name,human:true,role:deck[0],alive:true}];
  CHARS.forEach((c,i)=>players.push({id:i+1,name:c.name,ch:c,role:deck[i+1],alive:true}));
  const n=players.length;
  G={day:0,players,claims:{},votes:[],execs:[],attacks:[],acc:[],seerRes:[],medRes:[],guards:[],
     g:players.map(()=>players.map(()=>gauss()*0.3)),
     aff:players.map(()=>players.map(()=>gauss()*0.3)),
     mood:players.map(p=>({n:p.ch&&p.ch.tm==='timid'?0.3:0,a:0,s:0})),
     intent:null,forced:{},sus:{},memo:{},spect:false,over:false,coDone:false,tells:[]};
  for(let i=0;i<n;i++){G.g[i][i]=0;G.aff[i][i]=0}
  for(const p of players){
    if(p.human)continue;
    if(p.role==='madman'){const r=rnd();p.plan=r<0.72?'seer':r<0.88?'medium':'none'}
  }
  const aiw=players.filter(p=>p.role==='wolf'&&!p.human);
  if(aiw.length===2&&rnd()<0.14)pick(aiw).plan='seer';
  else if(aiw.length===2&&rnd()<0.07)pick(aiw).plan='medium';
  const seer=players.find(p=>p.role==='seer');
  const c=players.filter(p=>p.role!=='wolf'&&p.id!==seer.id);
  G.seerRes.push({night:0,t:pick(c).id,black:false});
}

/* ================= 推理エンジン =================
 * 人狼2人の組み合わせ（36通り）を全列挙し、
 * 視点ごとの確定情報・CO・占い/霊媒結果・投票・かばい合い（ライン）・印象から
 * 「誰が人狼か」「どのCOが本物か」の確率を出す。 */
function persp(id,mode){
  const p=P(id);
  const o={id,g:G.g[id],notWolf:new Set(),res:[],role:null,isMad:false,fixedW:null,selfReal:false};
  if(p.role==='wolf'){
    const ws=G.players.filter(q=>q.role==='wolf').map(q=>q.id);
    if(mode==='truth'){o.fixedW=ws;return o}
    ws.forEach(w=>o.notWolf.add(w));o.selfReal=true;return o; // 村人のふり
  }
  o.notWolf.add(id);
  if(p.role==='madman'){o.isMad=true;return o}
  o.role=p.role;o.selfReal=true;
  if(p.role==='seer')o.res=G.seerRes;else if(p.role==='medium')o.res=G.medRes;
  return o;
}
function hiddenF(R){
  if(R==='seer')return G.coDone?0.25:1;
  if(R==='medium')return G.day>=3?0.35:G.day===2?0.7:1;
  return 1;
}
function claimLik(o,isW,cids){
  const nonW=cids.filter(c=>!isW(c));
  const base=Math.pow(0.3,cids.length-nonW.length);
  let opts;
  if(o.isMad)opts=[o.id];
  else{opts=[null];for(const c of nonW)if(!(o.selfReal&&c===o.id))opts.push(c)}
  let tot=0;const real={};
  for(const m of opts){
    let f=(m===null)?0.35:1;
    const rem=nonW.filter(c=>c!==m);
    const seen={};let ok=true;
    for(const c of rem){
      const cl=G.claims[c];
      if(seen[cl.role]){ok=false;break}
      seen[cl.role]=1;
      if(o.role&&cl.role===o.role&&c!==o.id){ok=false;break}
      for(const r of cl.results){if(r.black!==isW(r.t)){ok=false;break}}
      if(!ok)break;
      if(cl.role==='seer'&&cl.day>1)f*=0.5;
    }
    if(!ok)continue;
    for(const R of ['seer','medium'])if(!seen[R]&&o.role!==R)f*=hiddenF(R);
    f*=base;tot+=f;
    for(const c of rem)real[c]=(real[c]||0)+f;
  }
  return {tot,real};
}
const pkey=(a,b)=>a<b?a*16+b:b*16+a;
function analyze(o,ignoreClaims){
  const n=G.players.length,pw=new Array(n).fill(0),real={};let tot=0;
  const attacked=new Set(G.attacks.filter(a=>a.victim!=null).map(a=>a.victim));
  const cids=ignoreClaims?[]:Object.keys(G.claims).map(Number);
  const tp=new Set(),ap=new Set();
  for(const x of G.acc){if(x.from===x.to)continue;(x.kind==='acc'?ap:tp).add(pkey(x.from,x.to))}
  for(let a=0;a<n;a++)for(let b=a+1;b<n;b++){
    if(o.fixedW){if(!(o.fixedW.includes(a)&&o.fixedW.includes(b)))continue}
    else if(o.notWolf.has(a)||o.notWolf.has(b))continue;
    if(attacked.has(a)||attacked.has(b))continue;
    if(!G.players[a].alive&&!G.players[b].alive)continue;
    const isW=j=>j===a||j===b;
    let ok=true;for(const r of o.res)if(r.black!==isW(r.t)){ok=false;break}
    if(!ok)continue;
    let w=Math.exp((o.g[a]||0)+(o.g[b]||0));
    for(const rec of G.votes){if(rec.map[a]===b)w*=0.45;if(rec.map[b]===a)w*=0.45}
    const k=pkey(a,b);if(tp.has(k))w*=1.5;if(ap.has(k))w*=0.85;
    let cl=null;
    if(cids.length){cl=claimLik(o,isW,cids);if(cl.tot<=0)continue;w*=cl.tot}
    tot+=w;pw[a]+=w;pw[b]+=w;
    if(cl)for(const c in cl.real)real[c]=(real[c]||0)+w*cl.real[c]/cl.tot;
  }
  if(tot<=0){if(!ignoreClaims)return analyze(o,true);return {pw,real,used:false}}
  for(let i=0;i<n;i++)pw[i]/=tot;
  for(const c in real)real[c]/=tot;
  return {pw,real,used:cids.length>0};
}
const view=(id,mode)=>analyze(persp(id,mode||'talk'));
const avgOf=(V,s)=>{const o=aliveIds().filter(i=>i!==s);return o.reduce((a,i)=>a+V.pw[i],0)/Math.max(1,o.length)};

/* ================= 感情・人間関係 ================= */
function addG(L,t,v){G.g[L][t]=clamp(G.g[L][t]+v,-1.6,1.6)}
function addAff(a,b,v){if(a!==b)G.aff[a][b]=clamp(G.aff[a][b]+v,-1.5,1.5)}
function addMood(i,k,v){if(P(i).human)return;const M=G.mood[i];M[k]=clamp(M[k]+v,0,1)}
function stung(t,amt){
  const p=P(t);if(p.human||!p.alive)return;
  if(isWolf(t)){addMood(t,'n',0.28*amt);if(p.ch.tm==='hot')addMood(t,'a',0.2*amt)}
  else if(p.ch.tm==='hot'){addMood(t,'a',0.32*amt);addMood(t,'n',0.05*amt)}
  else if(p.ch.tm==='timid')addMood(t,'n',0.32*amt);
  else addMood(t,'n',0.16*amt);
  if(isWolf(t)){const pt=partnerOf(t);if(pt!=null&&alive(pt))addMood(pt,'n',0.16*amt)}
}
// 発言を聞いた全員の印象が動く。pow(L) は聞き手ごとの説得力倍率
function hear(from,to,kind,pow){
  G.acc.push({day:G.day,from,to,kind});
  if(kind==='acc'){stung(to,1);addAff(to,from,-0.35)}else addAff(to,from,0.25);
  for(const L of aliveAIs()){
    if(L===from)continue;
    if(L===to){if(kind==='acc')addG(L,from,0.15);continue}
    const V=view(L);const tr=clamp(1-V.pw[from]*1.6,0,1);
    const m=typeof pow==='function'?pow(L):(pow==null?1:pow);
    const af=1+0.25*G.aff[L][from];
    addG(L,to,kind==='acc'?(0.3*tr-0.04)*m*af:-0.22*tr*m*af);
  }
}
function sway(fn){for(const L of aliveAIs())addG(L,0,fn(L))}
const powBy=(type)=>L=>POW[type][sty(L)];

/* ================= AI の判断 ================= */
function madTarget(s,V){
  const cl=G.claims[s];const others=aliveIds().filter(i=>i!==s);
  if(cl){
    const bl=cl.results.filter(r=>r.black&&alive(r.t));if(bl.length)return bl[bl.length-1].t;
    const rivals=others.filter(i=>G.claims[i]&&G.claims[i].role===cl.role);
    if(rivals.length)return rivals.sort((a,b)=>(V.real[b]||0)-(V.real[a]||0))[0];
  }
  const c=others.filter(i=>!G.claims[i]);if(!c.length)return null;
  return softPick(c,i=>-V.pw[i],0.15);
}
function reason(s,t,V){
  const H=x=>hon(s,x),opts=[];
  for(const k in G.claims){
    const c=+k;if(c===s)continue;const cl=G.claims[c];
    if(cl.role==='seer'&&cl.results.some(r=>r.t===t&&r.black)&&(V.real[c]||0)>0.35)return {t:'evid',r:pick([`${H(c)}の占いで${H(t)}に黒が出ている`,`${H(c)}が${H(t)}を黒だと言っている。その結果は信じていい`,`占い師の${H(c)}が${H(t)}に黒を出した`])};
  }
  if(V.used&&G.claims[t]&&(V.real[t]||0)<0.3){const rn=ROLES[G.claims[t].role].n;return {t:'evid',r:pick([`${H(t)}の${rn}COは偽物だと見ている`,`${H(t)}の${rn}COは信用できない`,`${H(t)}の${rn}としての結果は、ほかの情報と食い違っている`,`本物の${rn}は${H(t)}じゃない`])}}
  // ライン：黒っぽい人をかばっている
  const df=G.acc.filter(x=>x.from===t&&x.kind!=='acc'&&x.to!==s&&x.to!==t&&V.pw[x.to]>0.45);
  if(df.length)opts.push({t:'line',r:`${H(t)}は、怪しい${H(df[df.length-1].to)}をかばっていた。ラインがあるように見える`});
  for(const a of G.attacks)if(a.victim!=null&&G.acc.some(x=>x.from===a.victim&&x.to===t&&x.kind==='acc'))opts.push({t:'evid',r:`襲われた${H(a.victim)}が、${H(t)}を疑っていた`});
  const lv=G.votes[G.votes.length-1];
  if(lv){const v=lv.map[t];if(v!=null&&v!==lv.exec&&v!==s)opts.push({t:'vote',r:`${H(t)}は昨日、${H(v)}に票を入れていた。あの票が引っかかる`})}
  const accs=G.acc.filter(x=>x.to===t&&x.kind==='acc'&&x.from!==s&&x.day===G.day&&V.pw[x.from]<0.22);
  if(accs.length)opts.push({t:'talk',r:`${H(accs[accs.length-1].from)}の指摘はもっともだと思う`});
  if(opts.length&&rnd()<0.75)return pick(opts);
  return {t:'gut',r:`${H(t)}は${pick(GUT)}`};
}
function accSt(s,t,V){const R=reason(s,t,V);return {type:'acc',t,rt:R.t,text:line(s,'accuse',{t:hon(s,t),r:R.r})}}
function grudgeTarget(s){
  const x=G.acc.filter(a=>a.to===s&&a.kind==='acc'&&a.day===G.day-1&&a.from!==s&&alive(a.from)&&G.aff[s][a.from]<-0.3);
  return x.length?x[x.length-1].from:null;
}
function aiStatement(s,o){
  o=o||{};
  const p=P(s),V=view(s),others=aliveIds().filter(i=>i!==s),cl=G.claims[s];
  if(cl&&cl.role==='seer'){
    const bl=cl.results.filter(r=>r.black&&alive(r.t));
    if(bl.length){const t=bl[bl.length-1].t;return {type:'acc',t,rt:'evid',text:line(s,'accuse',{t:hon(s,t),r:`${p.ch.me}の占いで、${hon(s,t)}は黒と出た`})}}
  }
  const ord=p.order;
  if(ord&&ord.type==='push'&&alive(ord.t)&&ord.t!==s)return accSt(s,ord.t,V);
  if(ord&&ord.type==='hide'&&!o.force&&rnd()<0.7)return {type:'none',text:line(s,'none')};
  if(p.role==='madman'&&rnd()<0.8){const t=madTarget(s,V);if(t!=null)return accSt(s,t,V)}
  const avg=avgOf(V,s);
  const pt=isWolf(s)?partnerOf(s):null;
  const sorted=others.slice().sort((a,b)=>V.pw[b]-V.pw[a]);
  const top=sorted[0];
  // 恨み：昨日疑ってきた相手を少し疑いやすい
  if(o.grudge!=null&&alive(o.grudge)&&V.pw[o.grudge]>=V.pw[top]*0.6)return accSt(s,o.grudge,V);
  if(!o.force&&V.pw[top]<avg*1.25+0.02){
    const lows=sorted.slice().reverse().filter(i=>i!==pt||rnd()<0.15);
    const lo=lows[0];
    if(lo!=null&&rnd()<0.35&&V.pw[lo]<avg*0.6)return {type:'trust',t:lo,text:line(s,'trust',{t:hon(s,lo)})};
    if(rnd()<0.5)return {type:'none',text:line(s,'none')};
  }
  let t=top;if(sorted[1]!=null&&V.pw[sorted[1]]>V.pw[top]*0.85&&rnd()<0.35)t=sorted[1];
  return accSt(s,t,V);
}
// 特定の人物についての意見
function opinion(s,t){
  const V=view(s),avg=avgOf(V,s);
  if(isWolf(s)&&t===partnerOf(s)){
    const r=rnd();
    if(r<0.45)return {type:'none',text:line(s,'none')};
    if(r<0.75){tell(s,`${nm(s)}（人狼）は、仲間の${nm(t)}について聞かれ、かばうような答えをした`);return {type:'defend',t,text:line(s,'soft',{t:hon(s,t)})}}
    return accSt(s,t,{pw:V.pw.map((x,i)=>i===t?avg*1.5:x),real:V.real,used:V.used});
  }
  if(V.pw[t]>avg*1.2)return accSt(s,t,V);
  if(V.pw[t]<avg*0.8)return {type:'trust',t,text:line(s,'trust',{t:hon(s,t)})};
  return {type:'none',text:line(s,'none')};
}
function tally(map){const c={};for(const k in map){const t=map[k];if(t!=null)c[t]=(c[t]||0)+1}return c}
function aiVote(s,cand,partial){
  const p=P(s),c=cand.filter(i=>i!==s);
  if(c.length===1)return c[0];
  if(G.forced[s]!=null&&c.includes(G.forced[s]))return G.forced[s];
  if(p.role==='wolf'){
    const partner=partnerOf(s);
    const cnt=tally(partial);
    if(p.order&&p.order.type==='push'&&c.includes(p.order.t))return p.order.t;
    if(partner!=null&&alive(partner)&&c.includes(partner)&&(cnt[partner]||0)>=Math.ceil(aliveIds().length/2)-1&&rnd()<0.5){
      return partner;
    }
    const V=view(s);const nw=c.filter(i=>!isWolf(i));if(!nw.length)return pick(c);
    const hide=p.order&&p.order.type==='hide';
    return softPick(nw,i=>V.pw[i]*(hide?0.3:1)+(hide?0.25:0.12)*(cnt[i]||0),0.08);
  }
  if(p.role==='madman'){const V=view(s);const t=madTarget(s,V);if(t!=null&&c.includes(t))return t;return softPick(c,i=>-V.pw[i],0.2)}
  const V=view(s,'self');
  return softPick(c,i=>V.pw[i]-0.03*G.aff[s][i],0.06);
}
function computeVotes(fixed,cand,useIntent){
  const map=Object.assign({},fixed);const ais=aliveAIs();
  for(const s of ais)if(!isWolf(s)){
    const it=G.forced[s]!=null?G.forced[s]:(useIntent&&G.intent?G.intent[s]:null);
    map[s]=(it!=null&&cand.includes(it)&&it!==s)?it:aiVote(s,cand,map);
  }
  for(const s of ais)if(isWolf(s))map[s]=aiVote(s,cand,map);
  return map;
}
function aiDivine(s){
  const V=view(s,'self');const done=new Set(G.seerRes.map(r=>r.t));
  let c=aliveIds().filter(i=>i!==s&&!done.has(i));if(!c.length)c=aliveIds().filter(i=>i!==s);
  return softPick(c,i=>V.pw[i]+(G.claims[i]?0.05:0),0.08);
}
function aiGuard(k){
  const V=view(k,'self');const c=aliveIds().filter(i=>i!==k);
  return softPick(c,i=>{let s=(1-V.pw[i])*0.6;const cl=G.claims[i];if(cl){const r=V.real[i]||0;if(cl.role==='seer')s+=0.5+2.5*r;else if(cl.role==='medium')s+=0.3+1.5*r}return s},0.25);
}
function aiAttack(){
  const ws=aliveIds().filter(isWolf);const lead=ws.find(i=>i!==0)??ws[0];
  const VT=view(lead,'truth');const c=aliveIds().filter(i=>!isWolf(i));
  return softPick(c,i=>{
    let s=0.5;const cl=G.claims[i];
    s-=1.1*G.attacks.filter(a=>a.victim==null&&a.tried===i).length;
    if(cl){const r=VT.real[i]||0;if(cl.role==='seer')s+=0.5+3*r;else if(cl.role==='medium')s+=0.3+1.8*r;else s+=0.5+2*r}
    else if(i===0)s+=0.4*G.acc.filter(x=>x.from===0&&x.kind==='acc'&&isWolf(x.to)).length;
    else{const Vi=view(i);s+=1.6*ws.reduce((a,w)=>a+Vi.pw[w],0)}
    return s+rnd()*0.4;
  },0.35);
}
function fakeSeerResult(s){
  const p=P(s),cl=G.claims[s];const done=new Set(cl?cl.results.map(r=>r.t):[]);
  let cand=aliveIds().filter(i=>i!==s&&!done.has(i));if(!cand.length)cand=aliveIds().filter(i=>i!==s);
  const night=G.day-1;const gray=cand.filter(i=>!G.claims[i]);
  if(p.order&&p.order.type==='fake'&&p.order.t!=null&&cand.includes(p.order.t)){const t=p.order.t;p.order.t=null;return {night,t,black:!isWolf(t)}}
  if(p.role==='wolf'){
    const vill=cand.filter(i=>!isWolf(i));
    if(vill.length&&rnd()<0.45){
      const rivals=vill.filter(i=>G.claims[i]);
      const vg=vill.filter(i=>!G.claims[i]);
      return {night,t:(rivals.length&&rnd()<0.4)||!vg.length?pick(rivals.length?rivals:vill):pick(vg),black:true};
    }
    const partner=cand.find(i=>isWolf(i));
    return {night,t:partner!=null&&rnd()<0.35?partner:pick(gray.length?gray:cand),black:false};
  }
  const blacks=cl?cl.results.filter(r=>r.black).length:0;
  return {night,t:pick(gray.length?gray:cand),black:rnd()<(blacks?0.2:0.38)};
}
function fakeMediumBlack(s,ex){
  if(isWolf(s))return isWolf(ex)?false:rnd()<0.25;
  return rnd()<0.3;
}

async function aiClaim(s,role){
  const prev=Object.keys(G.claims).map(Number).filter(c=>G.claims[c].role===role&&alive(c));
  const cl=G.claims[s]={role,day:G.day,results:[],guards:[]};
  renderBoard();
  await say(s,line(s,'co',{role:ROLES[role].n}));
  const real=P(s).role===role;
  if(role==='seer'){
    const rs=real?G.seerRes.slice():[fakeSeerResult(s)];
    for(const r of rs){cl.results.push(r);if(r.black)stung(r.t,1.4);await say(s,line(s,'res',{t:hon(s,r.t),c:col(r.black)}))}
  }else if(role==='medium'){
    if(real)for(const r of G.medRes){cl.results.push(r);await say(s,line(s,'mres',{t:hon(s,r.t),c:col(r.black)}))}
    else for(const e of G.execs){const r={day:e.day,t:e.pid,black:fakeMediumBlack(s,e.pid)};cl.results.push(r);await say(s,line(s,'mres',{t:hon(s,r.t),c:col(r.black)}))}
  }else if(role==='knight'){
    let g=real?G.guards[G.guards.length-1]:null;
    if(!real&&G.day>1){const c=aliveIds().filter(i=>i!==s);g={night:G.day-1,t:pick(c)}}
    if(g&&g.t!=null){cl.guards.push(g);await say(s,`昨夜は${hon(s,g.t)}を護衛していた。`)}
  }
  if(!real)tell(s,`${nm(s)}（${ROLES[P(s).role].n}）の${ROLES[role].n}COは騙りだった`);
  renderBoard();
  const c=prev.find(x=>x!==0);
  if(c!=null){await say(c,line(c,'fake',{a:hon(c,s),role:ROLES[role].n}));hear(c,s,'acc')}
}

// 疑われた人をかばう（人狼の仲間かばい／村人の善意、どちらもありうる）
async function coverScene(accused){
  const targets=Object.keys(accused).map(Number).filter(t=>accused[t].length>=2&&alive(t));
  let done=0;
  for(const t of shuffle(targets)){
    if(done>=2)break;
    const pt=isWolf(t)?partnerOf(t):null;
    if(pt!=null&&pt!==0&&alive(pt)){
      const r=rnd();
      if(r<0.35){await say(pt,line(pt,'soft',{t:hon(pt,t)}));hear(pt,t,'defend');tell(pt,`${nm(pt)}（人狼）が、疑われた仲間の${nm(t)}をかばった`);done++;continue}
      if(r<0.47){const V=view(pt);await say(pt,line(pt,'agree',{a:hon(pt,pick(accused[t])),t:hon(pt,t)}));hear(pt,t,'acc');tell(pt,`${nm(pt)}（人狼）が、仲間の${nm(t)}への疑いに乗って切り捨てにかかった`);done++;continue}
    }
    const fr=aliveAIs().filter(i=>i!==t&&!accused[t].includes(i)&&!isWolf(i));
    if(!fr.length)continue;
    const f=softPick(fr,i=>G.aff[i][t]*1.5-view(i).pw[t]*3,0.3);
    const V=view(f);
    if(V.pw[t]<avgOf(V,f)*0.85&&rnd()<0.5||G.aff[f][t]>0.5&&rnd()<0.5){await say(f,line(f,'soft',{t:hon(f,t)}));hear(f,t,'defend');done++}
  }
}

function reasonOpts(t){
  const o=[];

      }else if(q==='about'){

        if(st.type==='acc')hear(t,u,'acc');else if(st.type!=='none')hear(t,u,st.type);
      }else{
        const yv=G.votes.find(v=>v.day===G.day-1);
        await me(`${nm(t)}さん、昨日の投票の理由を聞かせてください。`);
        if(!yv||yv.map[t]==null){await say(t,line(t,'none'));continue}
        const v=yv.map[t];
        if(isWolf(t)&&rnd()<0.3){await say(t,`え？ ああ……${hon(t,v)}に入れたのは、なんとなく……みんなの流れで。`);addMood(t,'n',0.35);tell(t,`${nm(t)}（人狼）は、投票理由を聞かれて言葉を濁した`);for(const L of aliveAIs())if(L!==t)addG(L,t,0.06)}
        else{const V=view(t);const R=reason(t,v,V);await say(t,`${R.r}。だから${hon(t,v)}に入れた。`)}
      }
    }else if(c==='co'){
      const H=P(0);
      const ro=['seer','medium','knight'].map(r=>[r,`${ROLES[r].ic} ${ROLES[r].n}${H.role===r?'':'（嘘）'}`]);
      ro.push([null,'戻る','sub']);
      const r=await choose('何の役職をCOする？',ro);if(r==null){k--;continue}

}
async function preVote(){
  const proj=projectVotes();
  let top=null,mx=0;for(const k in proj)if(proj[k]>mx){mx=proj[k];top=+k}
  if(top!=null&&top!==0&&mx>=3&&!G.claims[top]&&alive(top)){
    const p=P(top);
    if(['seer','medium','knight'].includes(p.role)&&rnd()<0.9){await sys(`${p.name}に疑いが集まっている……`);await aiClaim(top,p.role)}
    else if((p.role==='wolf'||p.role==='madman')&&!Object.values(G.claims).some(c=>c.role==='knight')&&rnd()<0.35){await sys(`${p.name}に疑いが集まっている……`);await aiClaim(top,'knight')}
  }
  await sys('── 投票前の表明 ──');
  G.intent=null;G.intent=computeVotes({},aliveIds(),false);
  for(const s of shuffle(aliveAIs()).slice(0,3))await say(s,line(s,'vote',{t:hon(s,G.intent[s])}));
  if(alive(0))await persuade();
}
// 説得：信頼と仲の良さ、相手自身の疑いで成否が決まる
async function persuade(){
  const c=await choose('投票の前に、誰かを説得しますか？（1回）',[['p','💬 説得する'],['go','🗳 このまま投票へ','sub']]);
  if(c!=='p')return;
  const L=await chooseP('誰を説得する？',aliveAIs(),true);if(L==null)return;
  const t=await chooseP(`${nm(L)}さんに、誰へ投票してもらう？`,aliveIds().filter(i=>i!==L&&i!==0&&i!==G.intent[L]),true);if(t==null)return;
  await me(`${nm(L)}さん、今日は${nm(t)}さんに入れてくれませんか？`);
  const V=view(L,isWolf(L)?'talk':'self');
  const cur=G.intent[L];
  let p=0.12+0.5*clamp(1-V.pw[0]*2.2,0,1)+0.3*G.aff[L][0]+1.6*(V.pw[t]-(cur!=null?V.pw[cur]:0));
  if(isWolf(L))p=isWolf(t)?0:p+0.25;
  if(G.claims[L]&&G.claims[L].role==='seer'&&G.claims[L].results.some(r=>r.t===cur&&r.black))p-=0.4;
  p=clamp(p,0.03,0.9);
  if(rnd()<p){await say(L,line(L,'convinced',{t:hon(L,t)}));G.forced[L]=t;G.intent[L]=t;addAff(L,0,0.1)}
  else{await say(L,line(L,'refuse'));if(isWolf(L)&&isWolf(t))tell(L,`${nm(L)}（人狼）は、仲間の${nm(t)}への投票を頑なに拒んだ`)}
}
async function doVote(cand,q){
  const fixed={};
  if(alive(0)){const t=await chooseP(q,cand.filter(i=>i!==0));fixed[0]=t}
  return computeVotes(fixed,cand,true);
}
function voteCard(map,title){

  const c=tally(map);const rows=Object.keys(map).map(k=>`<div class="row"><span>${esc(nm(+k))}</span><span>→ ${esc(nm(map[k]))}</span></div>`).join('');
  const tot=Object.keys(c).sort((a,b)=>c[b]-c[a]).map(k=>`${esc(nm(+k))} ${c[k]}票`).join('　');
  add(`<div class="votes"><div style="font-weight:800;margin-bottom:4px">${title}</div>${rows}<div class="tot">${tot}</div></div>`);
}
async function votePhase(){
  if(alive(0))for(const i of aliveAIs())if(ROLES[P(i).role].team==='village')G.sus[i]=view(i,'self').pw[0];
  await sys('── 投票の時間 ──','head');
  let cand=aliveIds();
  let map=await doVote(cand,'処刑する人に投票してください');
  let c=tally(map),mx=Math.max(...Object.values(c)),top=Object.keys(c).filter(k=>c[k]===mx).map(Number);
  voteCard(map,'投票結果');await wait(1600/(speed||1));
  if(top.length>1){
    await sys(`${top.map(nm).join('、')} が同票。決選投票を行います。`);
    G.intent=null;G.forced={};
    map=await doVote(top,'決選投票：処刑する人を選んでください');
    c=tally(map);mx=Math.max(...Object.values(c));top=Object.keys(c).filter(k=>c[k]===mx).map(Number);
    voteCard(map,'決選投票の結果');await wait(1600/(speed||1));
    if(top.length>1){await sys('再び同票……くじ引きで決めることになった。');top=[pick(top)]}
  }
  const ex=top[0];
  G.votes.push({day:G.day,map,exec:ex});
  for(const k in map){const w=+k;if(w!==0&&isWolf(w)&&map[k]===partnerOf(w))tell(w,`${nm(w)}（人狼）は、処刑されそうな仲間の${nm(map[k])}に票を入れて切り捨てた`)}
  for(const k in map){const v=+k;if(map[k]!=null&&v!==ex&&map[k]!==v)addAff(map[k],v,-0.15)}
  await sys(`${nm(ex)} が処刑されることになった。`);
  if(ex!==0){addMood(ex,'s',1);await say(ex,line(ex,'last'))}
  else await me(pick(['……私は、人狼じゃないのに。','そんな……！','あとは頼みました……']));
  G.execs.push({day:G.day,pid:ex});
  kill(ex,'exec');
  if(ex===0)await sys('あなたは処刑された……。ここからは観戦モードです。全員の役職が公開されます。');
}
async function nightPhase(){

  for(const p of G.players)p.order=null;
  G.forced={};

  if(ex)G.medRes.push({day:G.day,t:ex.pid,black:isWolf(ex.pid)});
  const H=P(0);let guard=null,attack=null,hDiv=null;
  if(H.alive){
    if(H.role==='seer'){
      const done=new Set(G.seerRes.map(r=>r.t));let c=aliveIds().filter(i=>i!==0&&!done.has(i));if(!c.length)c=aliveIds().filter(i=>i!==0);
      hDiv=await chooseP('🔮 今夜は誰を占う？',c);

    }

  }
  const seer=G.players.find(p=>p.role==='seer'&&p.alive&&!p.human);
  if(seer){const t=aiDivine(seer.id);G.seerRes.push({night:G.day,t,black:isWolf(t)})}
  const kn=G.players.find(p=>p.role==='knight'&&p.alive&&!p.human);
  if(kn)guard=aiGuard(kn.id);

  if(attack==null)attack=aiAttack();

  }

  for(const p of G.players){if(p.human)continue;const M=G.mood[p.id];M.n*=0.45;M.a*=0.4;M.s*=0.55;if(p.ch.tm==='timid')M.n=Math.max(M.n,0.3)}
  G.day++;
  if(victim!=null){const p=P(victim);p.alive=false;p.death='attack';p.deathDay=G.day-1;if(victim===0)G.spect=true}
}
// 人狼プレイヤーの夜：相棒と相談して襲撃先と明日の作戦を決める
async function wolfNight(){
  const partner=G.players.find(p=>p.role==='wolf'&&!p.human&&p.alive);
  if(partner){
    const sug=aiAttack();
    // 相棒の状況報告
    const pub=aliveAIs().filter(i=>!isWolf(i));
    const susP=pub.reduce((a,i)=>a+view(i,'self').pw[partner.id],0)/Math.max(1,pub.length);
    const susH=pub.reduce((a,i)=>a+view(i,'self').pw[0],0)/Math.max(1,pub.length);
    const avg=2/Math.max(2,aliveIds().length-1);
    if(susP>avg*1.4)await priv(`🐺 ${partner.name}「まずいな……俺、だいぶ疑われてる」`);
    else if(susH>avg*1.4)await priv(`🐺 ${partner.name}「お前、かなり目をつけられてるぞ。気をつけろ」`);
    else await priv(`🐺 ${partner.name}「今のところ、うまく紛れ込めてる」`);
    const real=Object.keys(G.claims).map(Number).filter(c=>alive(c)&&!isWolf(c)&&G.claims[c].role==='seer');
    if(real.length>=2)await priv(`🐺 ${partner.name}「占い師が${real.length}人……どっちかは狂人のはずだ。結果を見れば本物がわかるかもな」`);
    await priv(`🐺 ${partner.name}「今夜は ${nm(sug)} を襲おうと思う。どうする？」`);
  }
  const attack=await chooseP('🐺 今夜は誰を襲う？',aliveIds().filter(i=>!isWolf(i)));
  await priv(`🐺 ${nm(attack)}を襲うことにした。`);
  if(partner){
    const opts=[['auto','おまかせ'],['hide','🤫 目立たず潜伏'],['push','🗣 ある人を疑う流れを作る']];
    if(!G.claims[partner.id])opts.push(['fake','🔮 占い師を騙って黒を出す']);
    const o=await choose(`${partner.name}への明日の作戦指示`,opts);
    const cand=aliveIds().filter(i=>!isWolf(i)&&i!==attack);
    if((o==='push'||o==='fake')&&cand.length){
      const t=await chooseP(o==='push'?'誰を疑わせる？':'誰に黒を出させる？',cand);
      partner.order={type:o,t};
      await priv(o==='push'?`🐺 ${partner.name}「了解。明日は${nm(t)}を責め立てる」`:`🐺 ${partner.name}「わかった。明日、占い師を名乗って${nm(t)}に黒を出す」`);
    }else if(o==='hide'){partner.order={type:'hide'};await priv(`🐺 ${partner.name}「わかった、明日はおとなしくしておく」`)}
  }
  return attack;
}

<h3>役職（9人）</h3><ul>
<li>🧑‍🌾 村人 ×3 … 能力なし</li><li>🔮 占い師 ×1 … 毎晩ひとりが人狼か分かる（初日は白のお告げ）</li><li>🕯️ 霊媒師 ×1 … 処刑した人が人狼か分かる</li><li>🛡️ 騎士 ×1 … 毎晩ひとりを襲撃から守る</li><li>🐺 人狼 ×2 … 夜にひとりを襲う。相棒に作戦を指示できる</li><li>🃏 狂人 ×1 … 人狼の味方をする人間。占いでは白</li></ul>
<h3>勝利条件</h3><ul><li>村人陣営：人狼を2匹とも処刑する</li><li>人狼陣営（人狼・狂人）：生きている人狼の数が、人間の数以上になる</li></ul>
<h3>1日の流れ</h3><ul><li>朝：昨夜の犠牲者の発表。占い師・霊媒師（を名乗る人）が結果を報告</li><li>議論：みんなが疑い、かばい、問い詰め合う。あなたも質問されたり、疑われて弁明を求められたりします</li><li>あなたの番：1日3回まで「指摘（理由つき）」「信用」「質問」「CO」</li><li>投票前：1回だけ誰かを説得できる</li><li>投票 → 処刑 → 夜</li></ul>
<h3>“人間らしさ”を読もう</h3><ul>
<li><b>表情</b>：汗（動揺）・怒り・涙が顔に出ます。人狼は仲間が疑われると動揺しがち。でも気弱な人や熱くなりやすい人もいます。</li>
<li><b>かばい合い（ライン）</b>：疑われた人をかばった人は、仲間かもしれません。📜情報で一覧できます。</li>
<li><b>口すべり</b>：護衛成功の朝、人狼がうっかり「襲うはずだった相手」を口にすることがあります。</li>
<li><b>人間関係</b>：疑われた相手を恨み、仲の良い人に同調します。村人をタップすると様子や関係が見られます。</li>
<li><b>説得力</b>：理由の種類で響く相手が違います。論理派（アキラ・レン）は証拠、感情派（ミサキ・ユイ・ハナ・ソウタ）は気持ち、直感派（ゲンジ・シズカ）は勘を重んじます。嘘の理由は見抜かれることも。</li></ul>
<p>ゲーム終了後の<b>感想戦</b>で、人狼陣営が出していたボロと、村人たちがあなたをどう見ていたかが分かります。</p>`);
$('#castBtn').onclick=()=>modal(`<h2>村人たち</h2>${CHARS.map(c=>`<div class="ph" style="margin:8px 0"><div class="av" style="width:48px;height:48px">${avatar({ch:c},'calm')}</div><div><b>${c.name}</b> <small style="color:var(--sub)">${{logic:'論理派',emotion:'感情派',intuition:'直感派'}[c.st]}</small><div style="font-size:13px;color:var(--sub)">${c.desc}</div></div></div>`).join('')}`);
try{const n=localStorage.getItem('hitori-jinro-name');if(n)$('#pname').value=n}catch(e){}
buildRolePick();showRec();updSpeed();

if(AUTO){
  window.runSim=async n=>{for(let i=0;i<n;i++){newGame('旅人',Q.get('role')||'random');await game()}return window.__sim};
}
</script>
</body>
