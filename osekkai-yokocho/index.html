<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6c98a">
<meta name="description" content="住人を観察して、物でちょっとした「きっかけ」を与える観察型アドベンチャー。">
<title>おせっかい横丁</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./styles/main.css">
</head>
<body>
<div id="app" class="app">

  <!-- SC-01 タイトル -->
  <section id="sc-title" class="screen screen-title" aria-labelledby="title-logo">
    <div class="title-sky" aria-hidden="true">
      <div class="title-sun"></div>
      <div class="title-roofs"><i style="--h:70%;--c:#9c5a3c"></i><i style="--h:92%;--c:#c8553d"></i><i style="--h:78%;--c:#4f6d8a"></i><i style="--h:100%;--c:#9c5a3c"></i><i style="--h:74%;--c:#7a4a35"></i><i style="--h:88%;--c:#c8553d"></i></div>
    </div>
    <div class="title-body">
      <p class="title-kicker">観察 × きっかけ × 連鎖</p>
      <h1 id="title-logo" class="title-logo"><span>おせっかい</span><span>横丁</span></h1>
      <div class="title-cast" aria-hidden="true"><span>👨‍🍳</span><span>🧒</span><span>👩‍🎤</span></div>
      <p class="title-lead">命令はできない。でも、<br>きっかけなら置ける。</p>
      <button type="button" class="btn btn-primary btn-big" data-action="start">はじめる</button>
      <p class="title-note">タップだけで遊べます・音は出ません</p>
    </div>
  </section>

  <!-- SC-02 ステージ導入 -->
  <section id="sc-intro" class="screen screen-intro" aria-labelledby="intro-title">
    <div class="intro-card">
      <p class="intro-stage">ステージ 1</p>
      <h2 id="intro-title" class="intro-title"></h2>
      <div id="intro-body" class="intro-body"></div>
      <div class="intro-dots" id="intro-dots" aria-hidden="true"></div>
      <div class="intro-actions">
        <button type="button" class="btn btn-ghost" data-action="intro-skip">スキップ</button>
        <button type="button" class="btn btn-primary" data-action="intro-next" id="intro-next">つぎへ</button>
      </div>
    </div>
  </section>

  <!-- SC-03 メインゲーム -->
  <section id="sc-game" class="screen screen-game" aria-label="メインゲーム">
    <header class="hud">
      <h1 class="hud-stage" id="hud-stage"></h1>
      <button type="button" class="btn btn-hud" data-action="goal" aria-label="目的とヒント">🎯 目的 <span id="goal-count" class="goal-count">0/4</span></button>
      <button type="button" class="btn btn-hud btn-icon" data-action="pause" aria-label="ポーズ">⏸</button>
    </header>

    <div class="town-wrap" id="town-wrap">
      <div class="town" id="town" role="group" aria-label="横丁の町並み">
        <div class="town-layer" id="town-layer"></div>
        <!-- SC-04 イベント表示 -->
        <div class="event-card" id="event-card" role="status" aria-live="polite" hidden>
          <div class="event-icon" id="event-icon"></div>
          <div class="event-text">
            <p class="event-msg" id="event-msg"></p>
            <p class="event-line" id="event-line"></p>
          </div>
          <div class="event-next" aria-hidden="true">タップで次へ ▶</div>
          <div class="event-bar"><i id="event-bar"></i></div>
        </div>
        <div class="fx" id="fx" aria-hidden="true"></div>
      </div>
    </div>

    <div class="panel">
      <section class="message" id="message" aria-live="polite">
        <div class="msg-head">
          <span class="msg-icon" id="msg-icon" aria-hidden="true">👀</span>
          <span class="msg-title" id="msg-title">横丁のようす</span>
          <span class="msg-sub" id="msg-sub"></span>
          <button type="button" class="msg-toggle" data-action="toggle-msg" aria-label="メッセージを折りたたむ" aria-expanded="true">▾</button>
        </div>
        <p class="msg-text" id="msg-text">住人や場所をタップして、ようすを観察してみよう。</p>
      </section>
      <div class="tray" id="tray" role="toolbar" aria-label="アイテム"></div>
      <p class="guide" id="guide"></p>
    </div>
  </section>

  <!-- SC-05 クリア結果 -->
  <section id="sc-clear" class="screen screen-clear" aria-labelledby="clear-title">
    <div class="clear-card">
      <div class="clear-burst" aria-hidden="true">🎻🎈🥐</div>
      <p class="clear-kicker">STAGE CLEAR</p>
      <h2 id="clear-title" class="clear-title">小さな演奏会が始まった！</h2>
      <p class="clear-story" id="clear-story"></p>
      <p class="clear-route" id="clear-route"></p>
      <dl class="clear-stats" id="clear-stats"></dl>
      <h3 class="clear-sub">見つけたきっかけ <span id="clear-found"></span></h3>
      <ul class="clear-list" id="clear-list"></ul>
      <p class="clear-tip">ほかのアイテムを、ほかの相手に。まだ見ていない反応があるかも。</p>
      <div class="clear-actions">
        <button type="button" class="btn btn-primary" data-action="retry-now">もう一度あそぶ</button>
        <button type="button" class="btn btn-ghost" data-action="to-title">タイトルへ</button>
      </div>
    </div>
  </section>

  <!-- SC-06 ポーズ -->
  <div class="overlay" id="ov-pause" role="dialog" aria-modal="true" aria-labelledby="pause-title" hidden>
    <div class="sheet">
      <h2 id="pause-title" class="sheet-title">ひとやすみ</h2>
      <div class="sheet-actions">
        <button type="button" class="btn btn-primary" data-action="resume">つづける</button>
        <button type="button" class="btn" data-action="retry">はじめからやり直す</button>
        <button type="button" class="btn btn-ghost" data-action="to-title-confirm">タイトルへ戻る</button>
      </div>
    </div>
  </div>

  <!-- 目的・ヒント -->
  <div class="overlay" id="ov-goal" role="dialog" aria-modal="true" aria-labelledby="goal-title" hidden>
    <div class="sheet">
      <h2 id="goal-title" class="sheet-title">🎯 このステージの目的</h2>
      <ul class="goal-list" id="goal-list"></ul>
      <div class="goal-hint" id="goal-hint"></div>
      <div class="sheet-actions">
        <button type="button" class="btn" data-action="more-hint" id="btn-more-hint">もっとヒント</button>
        <button type="button" class="btn btn-primary" data-action="close-goal">とじる</button>
      </div>
    </div>
  </div>

  <!-- 確認ダイアログ -->
  <div class="overlay" id="ov-confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-text" hidden>
    <div class="sheet">
      <p class="sheet-text" id="confirm-text"></p>
      <div class="sheet-actions sheet-actions-row">
        <button type="button" class="btn btn-ghost" data-action="confirm-no">やめる</button>
        <button type="button" class="btn btn-primary" data-action="confirm-yes">はい</button>
      </div>
    </div>
  </div>

  <!-- エラー -->
  <div class="overlay" id="ov-error" role="alertdialog" aria-modal="true" aria-labelledby="error-title" hidden>
    <div class="sheet">
      <h2 id="error-title" class="sheet-title">⚠ 問題が起きました</h2>
      <p class="sheet-text" id="error-text">ゲームの処理中にエラーが発生しました。</p>
      <div class="sheet-actions">
        <button type="button" class="btn btn-primary" data-action="error-retry">はじめからやり直す</button>
        <button type="button" class="btn btn-ghost" data-action="error-reload">ページを再読み込み</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>

<noscript><p class="noscript">このゲームを遊ぶには JavaScript を有効にしてください。</p></noscript>

<script src="./scripts/stage-data.js"></script>
<script src="./scripts/game-state.js"></script>
<script src="./scripts/game-rules.js"></script>
<script src="./scripts/event-engine.js"></script>
<script src="./scripts/ui-renderer.js"></script>
<script src="./scripts/input-controller.js"></script>
<script src="./scripts/main.js"></script>
</body>
</html>
