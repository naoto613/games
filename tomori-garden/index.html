<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>灯庭のともり</title><style>
:root{font-family:'Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;color:#293c34;background:#152f2b}*{box-sizing:border-box}body{margin:0;overflow:hidden}button,select,input{font:inherit}button{min-height:48px;border:1px solid #b5c5ac;border-radius:14px;background:#f7f1e5;color:#293c34;padding:9px 16px;cursor:pointer}button:hover{background:#dfe9cc}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:3px solid #e1ac48}canvas{display:block;width:100vw;height:100dvh;touch-action:none}header{position:fixed;inset:14px 18px auto;display:flex;justify-content:space-between;align-items:start;gap:10px;pointer-events:none}header>div{pointer-events:auto}.brand{background:#f7f1e5ed;border-radius:18px;padding:12px 20px;box-shadow:0 6px 30px #132b2422}.brand strong{font-size:21px;letter-spacing:3px}.brand small{display:block;font-size:12px;color:#647d6b;margin-top:4px}nav{display:flex;gap:6px}.goal{position:fixed;top:100px;left:18px;max-width:330px;background:#f7f1e5ed;border-radius:14px;padding:12px 16px;font-size:14px;pointer-events:none}.goal small{display:block;margin-top:5px;color:#647d6b}footer{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:18px;right:18px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}footer>div{pointer-events:auto}.actions{display:flex;flex-wrap:wrap;gap:6px;max-width:70%;justify-content:end}.hint{position:fixed;bottom:108px;left:50%;transform:translateX(-50%);background:#173c31de;color:#fff;border-radius:12px;padding:9px 16px;max-width:90%;text-align:center;pointer-events:none;font-size:14px}#stick{width:112px;height:112px;border:2px solid #ffffff88;border-radius:50%;background:#f7f1e544;touch-action:none;position:relative}#knob{position:absolute;left:34px;top:34px;width:40px;height:40px;border-radius:50%;background:#f7f1e5cc;pointer-events:none}dialog{border:0;border-radius:24px;background:#f7f1e5;color:#293c34;width:min(640px,94vw);max-height:84dvh;padding:26px;box-shadow:0 30px 100px #10291d66}dialog::backdrop{background:#10291d77;backdrop-filter:blur(5px)}h1,h2{font-weight:600;letter-spacing:3px}h1{font-size:40px}h2{margin-top:0}p{line-height:1.9}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:16px 0}.card{background:#e8ead9;border-radius:14px;padding:14px;line-height:1.8}.card button{margin-top:8px;width:100%}.muted{color:#6a7e6d;font-size:13px}.hero{text-align:center;padding:20px 0}.hero .eyebrow{letter-spacing:6px;color:#71895e;font-size:12px}.hero .leaf{font-size:64px;color:#728858}#toast{position:fixed;left:50%;top:25%;transform:translateX(-50%);background:#f7f1e5;color:#293c34;padding:14px 24px;border-radius:16px;box-shadow:0 5px 30px #13382a33;pointer-events:none;opacity:0;transition:opacity .2s;z-index:20}#saveStatus{font-size:11px;color:#c8ddc3;position:fixed;bottom:2px;right:12px}.badge{display:inline-block;background:#527957;color:white;border-radius:20px;padding:2px 9px;font-size:12px}.buildnote{color:#a44d32;font-size:13px}a{color:#527957}input[type=range]{width:130px}@media(max-width:600px){header{inset:10px}.brand{padding:9px 12px}.brand strong{font-size:17px}.brand small{font-size:10px}nav button{padding:8px;font-size:13px}.goal{top:90px;left:10px;max-width:270px;font-size:12px}.actions{max-width:65%}.actions button{font-size:12px;padding:8px;min-width:48px}footer{left:12px;right:12px}.hint{bottom:150px;font-size:12px}dialog{padding:20px}.cards{grid-template-columns:1fr 1fr}.hero h1{font-size:32px}}
</style><canvas id="world" aria-label="灯庭。WASDまたは左下のスティックで移動"></canvas><header><div class="brand"><strong>灯庭のともり</strong><small id="place">小さな手入れから、はじまる暮らし。</small></div><div><nav><button id="journal">手帳</button><button id="bag">バッグ</button><button id="settings">設定</button></nav></div></header><div class="goal" id="goal"></div><div class="hint" id="hint"></div><footer><div id="stick" aria-label="移動スティック"><div id="knob"></div></div><div class="actions"><button id="chooseAbility">選ぶ</button><button id="ability">手わざ</button><button id="build">建築 B</button><button id="act">調べる E</button><button id="confirm" hidden>ここに置く</button><button id="cancel" hidden>閉じる</button></div></footer><div id="saveStatus"></div><div id="toast" role="status" aria-live="polite"></div><dialog id="modal"><div id="content"></div><div class="row" id="modalFoot"><button id="close">庭へ戻る</button></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id), W=48, key=(x,y)=>y*W+x, dist=(a,b)=>Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y));
const names={branch:'枝',stone:'石',seed:'種',fiber:'繊維',resin:'樹脂',glow:'光片',board:'板',thread:'糸',marker:'よりどころの札',stoneDecor:'石飾り',bench:'腰掛け',flowerPot:'鉢花',windChime:'風鈴',lamp:'小灯り',table:'テーブル',hut:'小屋',paving:'敷石',fence:'柵',fountain:'水鉢',arch:'アーチ'};
const icons={branch:'枝',stone:'石',seed:'種',fiber:'束',resin:'滴',glow:'光',board:'板',thread:'糸',marker:'⚑',stoneDecor:'●',bench:'▰',flowerPot:'✿',windChime:'♧',lamp:'☀',table:'▦',hut:'⌂',paving:'▪',fence:'╫',fountain:'◉',arch:'∩'};
const recipes={board:{branch:2},thread:{fiber:2},marker:{branch:2},stoneDecor:{stone:2},bench:{board:2},flowerPot:{stone:1,seed:1},windChime:{branch:2,thread:1},lamp:{stone:1,resin:1,thread:1},table:{board:3},hut:{board:4,stone:2,thread:2},paving:{stone:1},fence:{branch:2},fountain:{stone:4,resin:1},arch:{board:4,thread:2}};
const residents=[
{id:'moss',name:'モフリ',color:'#86a65d',need:{grass:4,flower:2},cost:{seed:3},ability:'grow',greeting:'草のにおいに、ついてきたんだ。ここで少し、休んでもいい？',request:'種を3つ分けてくれる？ 芽の起こし方を教えるよ。',unlock:[]},
{id:'dew',name:'シズネ',color:'#8ac7cc',need:{water:3,stoneDecor:2,grass:2},cost:{stone:3},ability:'water',greeting:'水が見える場所は、落ち着くね。',request:'石を3つ、分けてもらえる？ 岸をきれいにしたいの。',unlock:['fountain']},
{id:'stone',name:'コロガ',color:'#a4a095',need:{stoneDecor:2,bench:1},cost:{board:2},ability:'break',greeting:'この石、いい座り心地だ。',request:'板が2枚ほしい。道具の柄を直すんだ。',unlock:['windChime','table']},
{id:'wind',name:'ヒララ',color:'#c3c970',need:{flower:3,windChime:1},cost:{thread:2},ability:'gust',greeting:'ここ、風が歌ってる！',request:'糸を2つもらえたら、風の通り道を見せるよ。',unlock:['lamp']},
{id:'ember',name:'ホノト',color:'#d98b5c',need:{lamp:2,bench:1},cost:{resin:3},ability:'light',greeting:'座る場所があると、話したくなるね。',request:'樹脂を3つ分けてくれる？ 消えにくい灯りを作ろう。',unlock:['hut','arch']},
{id:'dusk',name:'ヨルネ',color:'#9584b4',need:{shade:3,lamp:2,hut:1},cost:{glow:3},ability:null,greeting:'明かりの向こうに、庭が見えた。',request:'光片を3つ集めよう。灯樹が、みんなの光を覚える。',unlock:[]}];
const abilityNames={grow:'芽吹き',water:'潤し',break:'砕き',gust:'風払い',light:'灯し'};
const points={branch:[[5,34],[6,36],[12,35],[17,38],[30,35],[39,38]],stone:[[5,27],[13,29],[18,14],[29,34],[38,30],[41,13]],seed:[[4,31],[5,32],[12,31],[19,16],[32,39],[40,8]],fiber:[[9,7],[9,8],[18,9],[30,29],[39,32],[40,12]],resin:[[16,36],[18,37],[6,16],[28,38],[40,37],[30,13]],glow:[[30,7],[39,7],[41,15]]};
const cooldown={branch:30,stone:45,seed:30,fiber:30,resin:60,glow:60}, amount={branch:3,stone:3,seed:2,fiber:2,resin:2,glow:2};
const solid=id=>!['marker','flowerPot','windChime','paving','arch'].includes(id);
function initial(){
const s={version:1,time:0,player:{x:8.5,y:34.5,face:2,color:0},tiles:Array.from({length:2304},(_,i)=>({g:i%48===0||i%48===47||i<48||i>=2256?'wall':'soil',f:''})),objects:[],inventory:Object.fromEntries(Object.keys(names).map(x=>[x,0])),abilities:[],recipes:['board','thread','marker','paving','fence'],residents:residents.map(r=>({id:r.id,status:0,home:null,x:0,y:0,done:false,friend:0,day:-1})),habitats:[],gathered:0,q:0,next:1,project:0,finish:0,ending:false,settings:{volume:.25,reduced:false},obstacles:[]};
const rect=(x1,y1,x2,y2,g)=>{for(let y=y1;y<=y2;y++)for(let x=x1;x<=x2;x++)s.tiles[key(x,y)].g=g;};
[[3,28,16,41],[4,6,18,18],[28,28,41,41],[28,5,42,18]].forEach(a=>rect(...a,'grass'));rect(11,6,17,8,'water');
[[6,30],[7,30],[8,30],[6,31],[8,31],[7,9],[9,9],[29,30],[31,30]].forEach(([x,y])=>s.tiles[key(x,y)].f='flower');
[[14,12],[15,12],[16,12],[30,31],[32,31]].forEach(([x,y])=>s.tiles[key(x,y)].f='dried');
for(let y=10;y<=34;y++){s.tiles[key(8,y)]={g:'path',f:''};}for(let x=8;x<=36;x++)s.tiles[key(x,34)]={g:'path',f:''};
rect(24,1,24,46,'wall');rect(24,23,46,23,'wall');s.tiles[key(24,34)].g='path';s.tiles[key(34,23)].g='path';
const add=(type,x,y,extra={})=>s.objects.push({id:'fixed'+s.next++,type,x,y,fixed:true,...extra});
add('workbench',9,34);add('tree',36,5);[[35,8],[37,8],[38,12]].forEach(p=>add('oldTree',...p));[[29,10],[41,10],[35,16]].forEach(p=>add('pedestal',...p,{lit:false}));add('rockGate',24,34);add('branchGate',34,23);
Object.entries(points).forEach(([item,ps])=>ps.forEach(p=>add('resource',...p,{item,ready:0})));
return s;}
let state=initial(),mode='',selected='marker',rotation=0,cursor={x:8,y:33},target=null,keys={},stick={x:0,y:0},running=false,saveTimer=0,lastFocus=null,toastTimer,revision=0;
const canvas=$('world'),ctx=canvas.getContext('2d');let vw=0,vh=0,scale=48,cam={x:0,y:0},last=0,acc=0,audio;
function notify(t){$('toast').textContent=t;$('toast').style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.opacity=0,3000);}
function sound(f=500){try{if(!audio)audio=new AudioContext();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(state.settings.volume*.12,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.25);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.25);}catch{}}
const at=(x,y,s=state)=>s.objects.find(o=>o.x===x&&o.y===y);
function walkable(x,y,s=state){if(x<0||y<0||x>=48||y>=48)return false;const t=s.tiles[key(x,y)],o=at(x,y,s);return !['wall','water'].includes(t.g)&&(!o||(!o.fixed&&!solid(o.type)));}
function reachable(s=state){const p={x:Math.floor(s.player.x),y:Math.floor(s.player.y)},seen=new Set([key(p.x,p.y)]),q=[p];for(let i=0;i<q.length;i++){const a=q[i];for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const x=a.x+dx,y=a.y+dy,k=key(x,y);if(walkable(x,y,s)&&!seen.has(k)){seen.add(k);q.push({x,y});}}}return seen;}
function nearReach(o,set){return [[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>set.has(key(o.x+dx,o.y+dy)));}
function safePlacement(o){const before=reachable();const s={...state,objects:[...state.objects,o]},after=reachable(s);if(before.has(key(8,34))&&!after.has(key(8,34)))return false;for(const h of state.habitats)if(before.has(key(h.x,h.y))&&!after.has(key(h.x,h.y)))return false;for(const f of state.objects.filter(o=>['workbench','tree','rockGate','branchGate'].includes(o.type)))if(nearReach(f,before)&&!nearReach(f,after))return false;for(const item of Object.keys(points)){const ps=state.objects.filter(o=>o.item===item);if(ps.some(p=>nearReach(p,before))&&!ps.some(p=>nearReach(p,after)))return false;}return true;}
const afford=c=>Object.entries(c).every(([id,n])=>state.inventory[id]>=n);
function pay(c){if(!afford(c))return false;for(const [id,n]of Object.entries(c))state.inventory[id]-=n;return true;}
function craft(id,n=1){if(!state.recipes.includes(id)||!recipes[id]||![1,5,10].includes(n))return false;const c=Object.fromEntries(Object.entries(recipes[id]).map(([k,v])=>[k,v*n]));if(state.inventory[id]+n>999||!pay(c))return false;state.inventory[id]+=n;sound(700);changed();return true;}
function placementError(x,y,type){if(x<1||y<1||x>46||y>46)return 'ここには置けません';if(dist({x:Math.floor(state.player.x),y:Math.floor(state.player.y)},{x,y})>1)return '近づいてから置きましょう';const t=state.tiles[key(x,y)];if(['water','wall'].includes(t.g)||at(x,y)||t.f)return '空いている土か草の上を選んでください';if(!state.inventory[type])return 'バッグにありません。作業台で作れます';if(state.objects.filter(o=>!o.fixed).length>=512)return '配置数の上限です';if(solid(type)&&(Math.floor(state.player.x)===x&&Math.floor(state.player.y)===y||state.residents.some(r=>r.status&&Math.floor(r.x)===x&&Math.floor(r.y)===y)))return '誰かが立っています';if(type==='marker'){if(state.habitats.length>=6)return '札は6つまでです';if(x<3||y<3||x>44||y>44)return '周囲に5×5の広さが必要です';if(state.habitats.some(h=>Math.abs(h.x-x)<=4&&Math.abs(h.y-y)<=4))return '別のよりどころと重なります';}if(solid(type)&&!safePlacement({type,x,y,id:'candidate',fixed:false}))return '大切な場所への道がふさがります';return '';}
function place(x,y,type=selected){const err=placementError(x,y,type);if(err){notify(err);return false;}const o={id:'placed'+state.next++,type,x,y,rotation,fixed:false};state.inventory[type]--;state.objects.push(o);if(type==='marker')state.habitats.push({id:o.id,x,y,resident:null,candidate:null,since:null});sound(650);changed();return true;}
function recover(x,y){const o=at(x,y);if(!o||o.fixed)return notify('これは回収できません');if(o.type==='marker'&&state.habitats.find(h=>h.id===o.id)?.resident)return notify('ともりの居場所になった札は残しておこう');if(state.inventory[o.type]>=999)return notify('バッグがいっぱいです');state.inventory[o.type]++;state.objects=state.objects.filter(a=>a!==o);state.habitats=state.habitats.filter(h=>h.id!==o.id);changed();sound(400);}
function counts(h){const n={grass:0,flower:0,water:0,shade:0};for(let y=h.y-2;y<=h.y+2;y++)for(let x=h.x-2;x<=h.x+2;x++){const t=state.tiles[key(x,y)],o=at(x,y);if(t.g==='grass'&&!t.f&&!o)n.grass++;if(t.f==='flower')n.flower++;if(t.g==='water')n.water++;if(walkable(x,y)&&state.objects.some(o=>o.type==='oldTree'&&dist(o,{x,y})<=2))n.shade++;if(o)n[o.type]=(n[o.type]||0)+1;if(o?.type==='flowerPot')n.flower++;}return n;}
function validHabitat(h,i){const r=residents[i],n=counts(h);return(i===0||state.residents[i-1].done)&&Object.entries(r.need).every(([k,v])=>(n[k]||0)>=v);}
function tickHabitats(){for(const h of state.habitats){if(h.resident)continue;let i=residents.findIndex((r,i)=>!state.residents[i].status&&!state.habitats.some(a=>a!==h&&a.candidate===r.id)&&validHabitat(h,i));if(i<0){h.candidate=null;h.since=null;continue;}if(h.candidate!==residents[i].id){h.candidate=residents[i].id;h.since=state.time;}if(state.time-h.since>=(i===0?10:20)){const r=state.residents[i];h.resident=r.id;r.status=1;r.home=h.id;r.x=h.x+.5;r.y=h.y+.5;h.candidate=null;h.since=null;if(i===0)state.recipes.push(...['stoneDecor','bench','flowerPot'].filter(x=>!state.recipes.includes(x)));notify(residents[i].name+'が遊びに来た！ 近づいて話そう');sound(900);changed();}}}
function request(i){const r=state.residents[i],d=residents[i];if(!r.status||r.done||!pay(d.cost))return false;r.done=true;r.friend=Math.min(100,r.friend+30);if(d.ability&&!state.abilities.includes(d.ability))state.abilities.push(d.ability);for(const id of d.unlock)if(!state.recipes.includes(id))state.recipes.push(id);notify(d.ability?abilityNames[d.ability]+'を覚えた！':'灯樹を修繕できるようになった！');sound(1000);changed();return true;}
function progress(){if(state.q===0&&state.gathered>=3){state.inventory.marker++;state.q=1;notify('札を受け取った！ (7,32)の草花の近くに置こう');}const tests=[true,state.residents[0].status>0,state.residents[0].done,state.residents[1].done&&state.residents[2].done,state.obstacles.includes('rockGate'),state.residents[3].done&&state.residents[4].done,state.residents[5].done,state.project===2];while(state.q>0&&state.q<8&&tests[state.q])state.q++;}
const goals=['枝を3つ拾おう','草と花の居場所を作ろう','モフリに種を3つ渡そう','水辺と石場の仲間に会おう','岩を砕いて、東の庭へ','風と灯りの手わざを覚えよう','夜の仲間を迎えよう','灯樹をみんなで修繕しよう','灯りが戻った庭で、暮らしを続けよう'];
function changed(){progress();saveTimer=1;updateHud();}
function harvest(o){if(o.ready>state.time)return notify('あと'+Math.ceil(o.ready-state.time)+'秒で集められそう');const n=amount[o.item];if(state.inventory[o.item]+n>999)return notify('バッグがいっぱいです');state.inventory[o.item]+=n;o.ready=state.time+cooldown[o.item];if(o.item==='branch')state.gathered+=n;notify(names[o.item]+' +'+n);sound(450);changed();}
function useAbility(id,x,y){if(!state.abilities.includes(id))return false;const o=at(x,y),t=state.tiles[key(x,y)];let ok=false;if(id==='grow'&&t.g==='soil'&&!o&&!t.f){t.g='grass';ok=true;}if(id==='water'&&t.f==='dried'){t.f='flower';ok=true;}if(id==='break'&&o?.type==='rockGate'||id==='gust'&&o?.type==='branchGate'){state.obstacles.push(o.type);state.inventory[id==='break'?'stone':'branch']=Math.min(999,state.inventory[id==='break'?'stone':'branch']+4);state.objects=state.objects.filter(a=>a!==o);ok=true;}if(id==='light'&&o?.type==='pedestal'&&!o.lit){o.lit=true;ok=true;}if(ok){sound(750);changed();}else notify('この場所には使えません');return ok;}
function garden(action,x,y){const t=state.tiles[key(x,y)];if(at(x,y)||['wall','water'].includes(t.g))return notify('この場所は手入れできません');if(action==='plant'){if(t.f||!state.inventory.seed)return notify('種と空いた地面が必要です');state.inventory.seed--;t.g='grass';t.f='flower';}if(action==='pluck'){if(!t.f||state.inventory.seed>=999)return notify('回収する花がありません／バッグ上限');t.f='';state.inventory.seed++;}if(action==='soil'){if(t.f)return notify('先に花を回収してください');t.g='soil';}changed();sound(600);}
function front(){const p=state.player,v=[[0,-1],[1,0],[0,1],[-1,0]][p.face];return{x:Math.floor(p.x)+v[0],y:Math.floor(p.y)+v[1]};}
function nearestTarget(){const p={x:Math.floor(state.player.x),y:Math.floor(state.player.y)};if(target&&dist(p,target)<=1)return target;const f=front(),near=state.residents.find(r=>r.status&&dist(p,{x:Math.floor(r.x),y:Math.floor(r.y)})<=1);if(near)return{x:Math.floor(near.x),y:Math.floor(near.y)};if(at(f.x,f.y))return f;const o=state.objects.find(o=>dist(p,o)<=1);return o?{x:o.x,y:o.y}:f;}
function interact(){if(!running||$('modal').open)return;const t=nearestTarget(),r=state.residents.findIndex(r=>r.status&&Math.floor(r.x)===t.x&&Math.floor(r.y)===t.y);if(r>=0)return talk(r);const o=at(t.x,t.y);if(!o)return notify('調べるものがありません');if(o.type==='resource')return harvest(o);if(o.type==='workbench')return craftPanel();if(o.type==='tree')return finalPanel();if(o.type==='marker')return journal();if(o.type==='rockGate'||o.type==='branchGate')return notify(o.type==='rockGate'?'コロガの「砕き」で道を開けよう':'ヒララの「風払い」で道を開けよう');notify(o.type==='pedestal'?'「灯し」で古い台座に光を':'庭の静かな気配がする。');}
function openModal(html){keys={};stick={x:0,y:0};lastFocus=document.activeElement;$('content').innerHTML=html;if(!$('modal').open)$('modal').showModal();$('close').focus();}
function closeModal(){$('modal').close();npcPaths.clear();lastFocus?.focus?.();keys={};}

function checksum(str){let h=2166136261;for(const b of new TextEncoder().encode(str)){h^=b;h=Math.imul(h,16777619);}return(h>>>0).toString(16);}
function validate(s){if(!s||s.version!==1||!Array.isArray(s.tiles)||s.tiles.length!==2304)throw Error('対応していないセーブです');const base=initial(),finite=n=>typeof n==='number'&&Number.isFinite(n);if(!finite(s.time)||s.time<0||!s.player||!finite(s.player.x)||!finite(s.player.y)||!Number.isInteger(s.player.face)||s.player.face<0||s.player.face>3)throw Error('位置か時間が不正です');if(!s.inventory||Object.keys(s.inventory).length!==Object.keys(names).length||Object.keys(s.inventory).some(k=>!Object.hasOwn(names,k))||Object.keys(names).some(k=>!Number.isInteger(s.inventory[k])||s.inventory[k]<0||s.inventory[k]>999))throw Error('所持品が不正です');if(!Array.isArray(s.objects)||s.objects.length>570||new Set(s.objects.map(o=>o.id)).size!==s.objects.length||s.objects.some(o=>!Number.isInteger(o.x)||!Number.isInteger(o.y)||o.x<1||o.x>46||o.y<1||o.y>46||!['resource','workbench','tree','oldTree','pedestal','rockGate','branchGate',...Object.keys(recipes)].includes(o.type)||o.type==='resource'&&(!Object.hasOwn(points,o.item)||!finite(o.ready))))throw Error('配置物が不正です');if(new Set(s.objects.map(o=>key(o.x,o.y))).size!==s.objects.length)throw Error('配置が重複しています');if(!Array.isArray(s.obstacles)||s.obstacles.some(x=>!['rockGate','branchGate'].includes(x)))throw Error('障害データが不正です');for(const o of base.objects){if(s.obstacles.includes(o.type))continue;const a=s.objects.find(a=>a.id===o.id);if(!a||a.type!==o.type||a.x!==o.x||a.y!==o.y||!a.fixed||a.item!==o.item)throw Error('固定設備が不正です');}s.tiles.forEach((t,i)=>{if(!t||!['soil','grass','path','water','wall'].includes(t.g)||!['','flower','dried'].includes(t.f)||['wall','water'].includes(base.tiles[i].g)&&t.g!==base.tiles[i].g)throw Error('地形が不正です');});if(!Array.isArray(s.residents)||s.residents.length!==6||s.residents.some((r,i)=>r.id!==residents[i].id||!Number.isInteger(r.status)||r.status<0||r.status>2||!finite(r.x)||!finite(r.y)||!finite(r.friend)||r.friend<0||r.friend>100||typeof r.done!=='boolean'||r.done&&r.status!==2))throw Error('住人が不正です');if(!Array.isArray(s.habitats)||s.habitats.length>6||s.habitats.some(h=>!s.objects.some(o=>o.id===h.id&&o.type==='marker'&&o.x===h.x&&o.y===h.y)||h.x<3||h.y<3||h.x>44||h.y>44||h.since!==null&&!finite(h.since))||new Set(s.habitats.map(h=>h.id)).size!==s.habitats.length)throw Error('居場所が不正です');s.habitats.forEach((h,i)=>{if(s.habitats.some((a,j)=>j<i&&dist(a,h)<=4))throw Error('居場所が重複しています');if(h.resident&&!s.residents.some(r=>r.id===h.resident&&r.home===h.id&&r.status>0))throw Error('住人の居場所が不正です');});if(s.residents.some(r=>r.status>0&&!s.habitats.some(h=>h.id===r.home&&h.resident===r.id)))throw Error('住人の居場所がありません');if(!Array.isArray(s.abilities)||s.abilities.some(a=>!Object.hasOwn(abilityNames,a))||!Array.isArray(s.recipes)||s.recipes.some(a=>!Object.hasOwn(recipes,a))||!Number.isInteger(s.q)||s.q<0||s.q>8||!Number.isInteger(s.next)||s.next<1||!finite(s.gathered)||s.gathered<0||![0,1,2].includes(s.project)||!finite(s.finish)||typeof s.ending!=='boolean'||!s.settings||!finite(s.settings.volume)||s.settings.volume<0||s.settings.volume>1)throw Error('進行が不正です');for(let i=0;i<6;i++){if(s.residents[i].done&&residents[i].ability&&!s.abilities.includes(residents[i].ability))throw Error('能力が一致しません');}if(!walkable(Math.floor(s.player.x),Math.floor(s.player.y),s)){s.player.x=8.5;s.player.y=34.5;}return JSON.parse(JSON.stringify(s));}
function save(){try{const payload=JSON.stringify(state),env={revision:++revision,checksum:checksum(payload),payload},k='tomori.save.'+(revision%2?'a':'b');localStorage.setItem(k,JSON.stringify(env));if(localStorage.getItem(k)!==JSON.stringify(env))throw Error();$('saveStatus').textContent='保存済み '+new Date().toLocaleTimeString('ja-JP');return true;}catch{$('saveStatus').textContent='保存できません。設定から書き出してください';return false;}}
function load(){let candidates=[];for(const k of ['a','b'])try{const e=JSON.parse(localStorage.getItem('tomori.save.'+k));if(e&&checksum(e.payload)===e.checksum)candidates.push({rev:e.revision,s:validate(JSON.parse(e.payload))});}catch{}candidates.sort((a,b)=>b.rev-a.rev);if(!candidates.length)return false;state=candidates[0].s;revision=candidates[0].rev;return true;}
function settings(){openModal('<h2>庭の設定</h2><p>効果音 <input id="volume" aria-label="音量" type="range" min="0" max="1" step=".05" value="'+state.settings.volume+'"></p><p><label><input id="reduced" type="checkbox" '+(state.settings.reduced?'checked':'')+'> 動きを抑える</label></p><div class="row"><button id="save">保存</button><button id="export">書き出す</button><button id="import">読み込む</button><button id="return">入口へ戻る</button><button id="color">服の色を変える</button><button id="titleBtn">タイトルへ</button></div><p class="muted">WASD / 矢印：移動　E：調べる　B：建築<br>I：バッグ　J：手帳　1〜5：手わざ選択　Space：使用<br>建築中は矢印でマス選択、Enterで配置、Xで回収、Rで向き。<br>タッチは左スティックで移動、庭をタップして対象選択。<br>よりどころの札を中心に5×5を整えよう。時間は画面を開いている間だけ進みます。</p><input type="file" id="file" accept=".json" hidden>');$('volume').oninput=e=>{state.settings.volume=+e.target.value;changed();};$('reduced').onchange=e=>{state.settings.reduced=e.target.checked;changed();};$('save').onclick=()=>notify(save()?'保存しました':'保存できませんでした');$('export').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.href=url;a.download='tomori-garden-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2*1024*1024)throw Error('2MiBまでです');const next=validate(JSON.parse(await file.text()));openModal('<h2>庭を読み込みますか？</h2><p>住人 '+next.residents.filter(r=>r.status).length+'人 ／ プレイ '+Math.floor(next.time/60)+'分<br>現在の庭を置き換えます。</p><button id="acceptImport">この庭を読み込む</button>');$('acceptImport').onclick=()=>{state=next;running=true;save();closeModal();endBuild();notify('庭を読み込みました');};}catch(e){notify('読込できません：'+e.message);}};$('return').onclick=()=>{state.player.x=8.5;state.player.y=34.5;changed();closeModal();endBuild();};$('color').onclick=()=>{state.player.color=(state.player.color+1)%3;changed();};$('titleBtn').onclick=()=>{if(save())title();else{openModal('<h2>保存できませんでした</h2><button id="without">保存せずタイトルへ</button>');$('without').onclick=title;}};}
function title(){running=false;endBuild();openModal('<div class="hero"><div class="eyebrow">A LITTLE GARDEN, A NEW BEGINNING</div><div class="leaf">❧</div><h1>灯庭のともり</h1><p>草を育て、居場所をつくる。<br>小さな仲間と、灯りが戻る庭へ。</p><div class="row" style="justify-content:center"><button id="new">はじめから</button><button id="continue">つづきから</button><button id="titleSettings">設定・読込</button></div><p class="muted">移動：WASD / 矢印 / 左下のスティック<br>採集・会話：E / 調べるボタン</p><a href="../">ゲームあつめへ</a></div>');$('new').onclick=()=>{openModal('<h2>灯りの消えた庭へ</h2><p>季節風で荒れた共同庭園。<br>あなたは、修繕を頼まれた見習い庭師です。<br>まずは近くの枝を拾ってみましょう。<br>この庭には、小さな精霊が暮らしているそうです。</p><p class="muted">新しく始めると、保存済みの庭を置き換えます。</p><button id="begin">この庭ではじめる</button>');$('begin').onclick=()=>{state=initial();revision=0;running=true;pin=[5,34];closeModal();changed();save();};};$('continue').onclick=()=>{if(load()){running=true;closeModal();updateHud();}else notify('有効な保存データがありません。設定から読み込むこともできます。');};$('titleSettings').onclick=settings;}
function updateHud(){const p=state.player,area=p.x<24?(p.y>=24?'はじまりの庭':'しずく岸'):(p.y>=24?'風の段庭':'夕あかり林');$('place').textContent=area+' ・ '+['朝','昼','夕','夜'][Math.floor(state.time/180)%4]+' ・ '+Math.floor(p.x)+','+Math.floor(p.y);$('goal').innerHTML='<strong>'+goals[state.q]+'</strong><small>なかま '+state.residents.filter(r=>r.status).length+' / 6　｜　手帳で条件と場所を確認</small>';$('ability').textContent=currentAbility?abilityNames[currentAbility]+'を使う':'手わざ';if(mode==='build'){$('hint').textContent=(names[selected]||{recover:'回収',plant:'花を植える',pluck:'花を回収',soil:'土に戻す'}[selected])+'　('+cursor.x+','+cursor.y+') ・ '+(recipes[selected]?placementError(cursor.x,cursor.y,selected)||'✓ 配置できます':'近くのマスを選んで実行');}else{const t=nearestTarget(),o=at(t.x,t.y),r=state.residents.find(r=>r.status&&Math.floor(r.x)===t.x&&Math.floor(r.y)===t.y);$('hint').textContent=r?residents.find(a=>a.id===r.id).name+'：E はなす':o?.type==='resource'?names[o.item]+'：E 拾う'+(o.ready>state.time?'（あと'+Math.ceil(o.ready-state.time)+'秒）':''):o?.type==='workbench'?'作業台：E つくる':o?.type==='tree'?'灯樹：E 調べる':'草と花を整えて、ともりの居場所をつくろう';}}
function resize(){vw=innerWidth;vh=innerHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=vw*d;canvas.height=vh*d;ctx.setTransform(d,0,0,d,0,0);scale=vw<600?40:48;}
addEventListener('resize',resize);resize();

function flower(x,y,dead=false){ctx.strokeStyle=dead?'#998666':'#547b46';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y+8);ctx.lineTo(x,y-3);ctx.stroke();for(let i=0;i<5;i++){const a=i*Math.PI*2/5;ellipse(x+Math.cos(a)*5,y-6+Math.sin(a)*5,4,4,dead?'#b8a482':'#eac8aa');}ellipse(x,y-6,3,3,'#f6df86');}
function sprite(o,now){const x=(o.x+.5)*scale-cam.x,y=(o.y+.65)*scale-cam.y,s=scale/48;ctx.save();ctx.translate(x,y);ctx.scale(s,s);ellipse(0,9,17,6,'#25473425');const type=o.type;
if(type==='oldTree'||type==='tree'){ctx.fillStyle='#857253';ctx.fillRect(-6,-40,12,48);ellipse(0,-43,30,30,type==='tree'?'#859365':'#58795a');ellipse(-16,-46,22,24,'#6d8d61');ellipse(17,-50,20,26,'#7e995e');if(type==='tree'&&(state.project===2||state.project===1)){for(let i=0;i<7;i++){const a=i*2.4;ellipse(Math.sin(a)*23,-45+Math.cos(a)*23,4,5,'#f8db8a');}}}
else if(type==='resource'){if(o.ready>state.time){ellipse(0,4,8,3,'#77916a');}else if(o.item==='branch'||o.item==='fiber'){ctx.strokeStyle=o.item==='branch'?'#8e714b':'#aaae71';ctx.lineWidth=5;for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(-12+i*7,4);ctx.lineTo(-5+i*7,-17);ctx.stroke();}}else if(o.item==='resin'){ctx.fillStyle='#8b7757';ctx.fillRect(-4,-21,8,29);ellipse(0,-27,18,19,'#7d945d');ellipse(8,-8,4,6,'#e0ac52');}else if(o.item==='seed'){ellipse(0,-2,12,12,'#b7b97a');ellipse(-5,-7,3,3,'#f2deb0');ellipse(6,0,3,3,'#f2deb0');}else{ellipse(0,1,15,11,o.item==='glow'?'#c1b2d6':'#a2a998');ellipse(-5,-3,7,5,o.item==='glow'?'#ecdda9':'#bbc2af');}}
else if(type==='rockGate'){ellipse(0,-8,25,24,'#949a8a');ellipse(-9,-16,11,12,'#b1b7a3');}
