function tapField(clientX,clientY){if(!running||$('modal').open)return;const hit=screenTargets.filter(p=>Math.hypot(clientX-p.sx,clientY-p.sy)<p.r).sort((a,b)=>Math.hypot(clientX-a.sx,clientY-a.sy)-Math.hypot(clientX-b.sx,clientY-b.sy))[0];const p=hit?{x:hit.x,y:hit.y}:{x:Math.floor((clientX+cam.x)/scale),y:Math.floor((clientY+cam.y)/scale)};if(p.x<1||p.x>46||p.y<1||p.y>46)return;if(mode==='build'){stopWalking();buildTarget=p;updateHud();sound(420);return;}if(hit?.resident!==undefined)return routeTo(p,()=>talk(hit.resident),true);const o=hit?.object||at(p.x,p.y);if(o){routeTo(p,()=>{if(o.type==='resource'){harvest(o);celebrate(o.x+.5,o.y+.5);speak('みつけた！');}else if(o.type==='workbench')craftPanel();else if(o.type==='tree')finalPanel();else if(o.type==='rockGate'||o.type==='branchGate'){const ability=o.type==='rockGate'?'break':'gust';if(!state.abilities.includes(ability))childNotice('なかまと なかよくなると、とおれるよ。');else{useAbility(ability,o.x,o.y);celebrate(o.x,o.y);speak('すごい！ みちが ひらいたよ！');}}else if(o.type==='pedestal'&&state.abilities.includes('light')){useAbility('light',o.x,o.y);celebrate(o.x,o.y);}else childNotice('すてきな かざりだね！');},true);return;}const t=state.tiles[key(p.x,p.y)];if(t.f==='dried'&&state.abilities.includes('water'))return routeTo(p,()=>{useAbility('water',p.x,p.y);celebrate(p.x,p.y);},true);if(t.g==='soil'&&state.abilities.includes('grow'))return routeTo(p,()=>{useAbility('grow',p.x,p.y);celebrate(p.x,p.y);},true);routeTo(p);}

function ensureChapter(){const i=chapterIndex();if(i>=6||state.residents[i].done)return false;const seen=Array.isArray(state.storySeen)?state.storySeen:[];if(seen.includes(i))return false;const d=residents[i],ch=chapters[i];openModal('<div class="talk"><span class="badge">おにわ '+(i+1)+' / 6</span><h2>'+ch[0]+'</h2><div class="chapterpicture">'+img(i===0?'plant':Object.keys(d.need).find(x=>Object.hasOwn(recipes,x))||'lamp')+img(d.id)+'</div><div class="speech">'+ch[1]+'</div>'+(i===0?'<div class="storyflow"><div>'+img('plant')+'おにわを つくる</div>→<div>'+img('moss')+'なかまが くる</div>→<div>'+img('grow')+'ちからを おぼえる</div></div>':'<p>'+ch[2]+'</p>')+'<button class="primary" id="chapterStart">この おにわを つくろう！</button></div>');speak(ch[0]+'。'+ch[1]+'。'+ch[2]);$('chapterStart').onclick=()=>{state.storySeen=[...seen,i];saveTimer=1;closeModal();updateHud();speak(nextActivity().say);};return true;}
function flowerTint(t){return{pink:'#e9a5b4',yellow:'#eed17c',blue:'#a7c8d7'}[t]||'#e8b7be';}
function flowerChoice(a){openModal('<div class="talk"><h2>どの おはなに する？</h2><p>'+residents[a.i].name+'が すむ おにわだよ。<br>すきな いろを えらんでね。</p><div class="colorchoices">'+[['pink','ももいろ'],['yellow','きいろ'],['blue','みずいろ']].map(([id,name])=>'<button data-flower="'+id+'" style="--petal:'+flowerTint(id)+'"><i>✿</i>'+name+'</button>').join('')+'</div></div>');speak('どの おはなに する？ すきな いろを えらんでね。');document.querySelectorAll('[data-flower]').forEach(b=>b.onclick=()=>{closeModal();performActivity({...a,color:b.dataset.flower});});}
let chapterHudKey='';
function updateChapterHUD(){const el=$('chapterHUD');if(!el)return;const i=chapterIndex();let html;if(i===6){html='<div class="heading">'+img('tree')+'<div><small>みんなの おにわ</small><b>'+(state.project===2?'6にんの おにわが できたね！':'さいごに ひかるきを なおそう')+'</b></div></div>';}else{const d=residents[i],r=state.residents[i],h=habitatFor(i),n=h?counts(h):{},cost=r.status?d.cost:d.need;html='<div class="heading">'+img(d.id)+'<div><small>おにわ '+(i+1)+' / 6　'+(r.status?'なかよく なろう':'このこを よぼう')+'</small><b>'+chapters[i][0]+'</b></div></div><div class="recipechips">'+Object.entries(cost).map(([k,v])=>{const c=r.status?state.inventory[k]:(n[k]||0),id={grass:'grow',flower:'plant',water:'water',shade:'oldTree'}[k]||k;return '<span class="'+(c>=v?'ok':'')+'">'+img(id)+Math.min(c,v)+' / '+v+(c>=v?' ✓':'')+'</span>';}).join('')+'</div>'; }if(html!==chapterHudKey){el.innerHTML='<div class="chaptercard">'+html+'</div>';chapterHudKey=html;}}
function drawGardenBeds(){for(const h of state.habitats){const x=(h.x-2)*scale-cam.x,y=(h.y-2)*scale-cam.y,w=5*scale;if(x>vw||x+w<0||y>vh||y+w<0)continue;ctx.save();ctx.fillStyle=h.resident?'#d9d8aa22':'#f4e6bb18';ctx.beginPath();ctx.roundRect(x+7,y+7,w-14,w-14,24);ctx.fill();ctx.strokeStyle=h.resident?'#faf0c4bb':'#c9b98688';ctx.lineWidth=3;ctx.setLineDash([7,6]);ctx.stroke();ctx.setLineDash([]);for(let j=0;j<4;j++){const xx=x+(j%2?w-10:10),yy=y+(j>1?w-10:10);ctx.save();ctx.translate(xx,yy);ctx.scale(scale/64,scale/64);shaded(ctx,0,0,7,4,'#d8c195','#9f885f');bloom(ctx,0,-2,.65,h.resident?'#f0c5ad':'#e2d5aa');ctx.restore();}if(h.resident){const r=residents.find(r=>r.id===h.resident);ctx.font='bold 11px sans-serif';const label=r.name+'の おにわ',tw=ctx.measureText(label).width;ctx.fillStyle='#fff8e3ed';ctx.beginPath();ctx.roundRect(x+w/2-tw/2-10,y+w-4,tw+20,23,10);ctx.fill();ctx.fillStyle='#62754f';ctx.fillText(label,x+w/2-tw/2,y+w+12);}ctx.restore();}}

// Start after art, icons and touch controls have been initialized.
resize();updateHud();title();requestAnimationFrame(frame);

</script></body></html>
