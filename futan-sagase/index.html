<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ふーたんを さがせ！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{--paper:#fffaf2;--paper2:#f7efe2;--line:#ead9c2;--ink:#4b3427;--soft:#8c7462;--accent:#ff6f9f;--accent2:#ffb347;--good:#33a368;
  --display:"Mochiy Pop One","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;--body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#f3e9da;color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit;cursor:pointer}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.card{background:var(--paper);border:2.5px solid var(--line);border-radius:20px;box-shadow:0 3px 0 rgba(120,90,60,.14),0 8px 22px rgba(90,60,30,.12)}
#hud{position:fixed;inset:0;pointer-events:none;padding:calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom))}
#hud .tl{position:absolute;left:12px;top:calc(10px + env(safe-area-inset-top));display:flex;gap:10px;align-items:center;padding:8px 14px 8px 8px;pointer-events:auto}
#hud .tl canvas{width:58px;height:58px;border-radius:14px;background:#fff1f6;flex:none}
#hud .tl b{display:block;font-family:var(--display);font-weight:400;font-size:19px;line-height:1.2}
#hud .tl small{font-size:12px;font-weight:900;color:var(--soft)}#hud .tl small.feat{display:block;font-size:11px;color:#d2386e}
#hud .tr{position:absolute;right:12px;top:calc(10px + env(safe-area-inset-top));display:flex;gap:6px;padding:6px;pointer-events:auto}
.slot{width:50px;height:58px;border-radius:14px;background:var(--paper2);border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:var(--soft)}
.slot canvas{width:40px;height:40px}
.slot.got{border-style:solid;border-color:#ffc2d6;background:#fff1f6;color:var(--accent)}
.slot.got.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
#hud .bl{position:absolute;left:12px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;pointer-events:auto}
#hud .br{position:absolute;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;pointer-events:auto}
.pill{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--paper);border:2.5px solid var(--line);font-weight:900;font-size:15px;box-shadow:0 3px 0 rgba(120,90,60,.14)}
.pill.hint{background:#fff6d8;border-color:#f5d77a}
.pill.hint.ready{animation:wob 1.2s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.pill[disabled]{opacity:.45}
.overlay{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));background:rgba(255,246,236,.35);overflow-y:auto}
.panel{background:var(--paper);border:2.5px solid var(--line);border-radius:28px;box-shadow:0 5px 0 rgba(120,90,60,.15),0 22px 50px rgba(80,55,30,.2);padding:24px 22px;width:min(520px,100%);display:flex;flex-direction:column;gap:14px;align-items:stretch}
.logo{font-family:var(--display);font-size:clamp(36px,10vw,60px);line-height:1.05;text-align:center;color:var(--ink);text-shadow:3px 3px 0 #fff,-3px 3px 0 #fff,3px -3px 0 #fff,-3px -3px 0 #fff,0 7px 0 rgba(120,90,60,.18)}
.logo em{font-style:normal;color:var(--accent)}
.lede{text-align:center;color:var(--soft);font-weight:900;font-size:15px;line-height:1.7;margin:0}
.btn{padding:15px 18px;border-radius:18px;border:2.5px solid var(--line);background:var(--paper2);font-weight:900;font-size:17px;box-shadow:0 3px 0 rgba(120,90,60,.14)}
.btn.main{background:var(--accent);border-color:#e9558a;color:#fff;font-family:var(--display);font-weight:400;font-size:22px}
.btn:active{transform:translateY(2px)}
.row{display:flex;gap:10px}.row>*{flex:1}
h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;text-align:center}
.cast{display:flex;justify-content:center;gap:6px}
.cast figure{margin:0;text-align:center;font-size:12px;font-weight:900;color:var(--soft)}
.cast canvas{width:84px;height:96px;display:block}
.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;max-height:min(60vh,520px);overflow-y:auto;padding:2px}
.st{position:relative;border-radius:18px;border:2.5px solid var(--line);background:var(--paper2);padding:0 0 8px;overflow:hidden;text-align:center;font-weight:900;font-size:14px}
.st canvas{width:100%;aspect-ratio:3/2;display:block;margin-bottom:6px}
.st .stars{font-size:13px;letter-spacing:1px}
.st.lock{opacity:.5}
.st.lock canvas{filter:grayscale(1) brightness(1.1)}
.st .num{position:absolute;left:8px;top:6px;background:#fff;border-radius:999px;padding:1px 9px;font-size:13px;border:2px solid var(--line)}
.got-row{display:flex;justify-content:center;gap:4px;font-size:12px}
.got-row span{padding:1px 7px;border-radius:999px;background:#fff;border:1.5px solid var(--line);color:#c9b7a0}
.got-row span.on{color:var(--accent);border-color:#ffc2d6;background:#fff1f6}
#intro .panel{align-items:center;text-align:center}
#intro .where{font-family:var(--display);font-size:clamp(30px,8vw,44px);line-height:1.2}
#intro canvas{width:140px;height:133px;border-radius:18px;background:#fff1f6;border:2.5px solid #ffc2d6}
.bubble{position:absolute;transform:translate(-50%,-100%);background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:6px 12px;font-weight:900;font-size:15px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-7px;border:7px solid transparent;border-top-color:var(--ink);border-bottom:0}
.bubble.big{font-size:18px;padding:8px 16px;border-color:var(--accent);color:#d2386e}
.bubble.big::after{border-top-color:var(--accent)}
#toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(36px,10vw,64px);color:var(--accent);text-shadow:3px 3px 0 #fff,-3px 3px 0 #fff,3px -3px 0 #fff,-3px -3px 0 #fff,0 7px 0 rgba(120,90,60,.2);pointer-events:none;opacity:0;white-space:nowrap;text-align:center}
#toast.small{font-size:clamp(22px,6.5vw,38px)}
#toast.show{animation:toast 1.6s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}28%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%)}}
#wipe{position:fixed;inset:0;pointer-events:none;z-index:20}
.tstats{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.tstats span{font-size:13px;font-weight:900;padding:4px 12px;border-radius:999px;background:var(--paper2);border:1.5px solid var(--line);color:var(--soft)}
.links{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.link{background:none;border:0;font-weight:900;font-size:15px;padding:8px 10px;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--line)}
@media (max-width:640px){
  #hud .tl{padding:6px 10px 6px 6px}#hud .tl canvas{width:46px;height:46px}#hud .tl b{font-size:16px}
  .slot{width:42px;height:50px}.slot canvas{width:32px;height:32px}
  #hud .tr{top:calc(78px + env(safe-area-inset-top))}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="fx"></div>
<div id="hud" hidden>
  <div class="card tl"><canvas id="hudFutan" width="116" height="116"></canvas><div><small id="hudStage">ステージ 1</small><b>ふーたんは どこ？</b><small class="feat">みつあみ・ピンクの みずたま・<span style="color:#d9a400">ハートの ポシェット</span></small></div></div>
  <div class="card tr" id="slots"></div>
  <div class="bl"><button class="pill" id="menuBtn">ⅠⅠ</button><button class="pill" id="zoomBtn">ぜんたい</button></div>
  <div class="br"><button class="pill hint" id="hintBtn">ヒント</button></div>
</div>
<div id="title" class="overlay">
  <div class="panel">
    <div class="logo">ふーたんを<br><em>さがせ！</em></div>
    <div class="cast" id="cast"></div>
    <p class="lede">ひとが いっぱいの まちの どこかに ふーたんが かくれているよ。<br><span style="color:#d2386e">めじるしは みつあみと ピンクの みずたまの ふく、<br>きいろい ハートの ポシェット！</span><br>みつけたら つぎの ばしょへ ワープ！<br>ままや パパを みつけると ふーたんが みつけやすく なるよ。<br>リッキーを みつけると ステージに たのしい へんかが おこるよ！</p>
    <div class="tstats" id="titleStats"></div>
    <button class="btn main" id="playBtn">あそぶ</button>
    <div class="links"><button class="link" id="albumBtn">ステージ えらび</button><button class="link snd" id="sndBtn">おと：オン</button></div>
  </div>
</div>
<div id="intro" class="overlay" hidden style="background:rgba(255,246,236,.15)">
  <div class="panel">
    <small id="introNum" style="font-weight:900;color:var(--soft)">ステージ 1</small>
    <div class="where" id="introName">こうえん</div>
    <canvas id="introPic" width="200" height="190"></canvas>
    <p class="lede" style="color:#d2386e;margin-top:-6px">みつあみ・ピンクの みずたま・きいろい ハートの ポシェット<br>きらきらの め と にっこり おくち</p>
    <p class="lede" id="introText"></p>
    <button class="btn main" id="introGo">さがす！</button>
  </div>
</div>
<div id="album" class="overlay" hidden>
  <div class="panel" style="width:min(820px,100%)">
    <h2>ステージ えらび</h2>
    <div class="stages" id="stageList"></div>
    <button class="btn" id="albumClose">もどる</button>
  </div>
</div>
<div id="pause" class="overlay" hidden>
  <div class="panel">
    <h2>ひとやすみ</h2>
    <button class="btn main" id="resumeBtn">つづける</button>
    <div class="row"><button class="btn" id="skipBtn">つぎの ばしょへ</button><button class="btn" id="homeBtn">タイトルへ</button></div>
    <div class="links"><button class="link snd">おと：オン</button></div>
  </div>
</div>
<div id="clear" class="overlay" hidden>
  <div class="panel" id="clearPanel"></div>
</div>
<canvas id="wipe"></canvas>
<div id="toast"></div>
<script>
'use strict';
// ================= base: utils, rng, drawing helpers =================
const $=id=>document.getElementById(id);
const TAU=Math.PI*2;
const WW=2400,WH=1600;            // world size of every stage
const LN='#4b2e2a';               // outline ink
const SKIN='#ffe0cc',HAIR='#2b1d22';
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=rng(1);
const rnd=(a=1,b)=>b===undefined?R()*a:a+R()*(b-a);
const pick=arr=>arr[Math.floor(R()*arr.length)];
const chance=p=>R()<p;
function pickW(list){let s=0;for(const x of list)s+=x[1];let v=R()*s;for(const x of list)if((v-=x[1])<=0)return x[0];return list[list.length-1][0]}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c}
function shade(h,amt){const n=parseInt(h.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const t=amt<0?0:255,p=Math.abs(amt);r=Math.round(r+(t-r)*p);g=Math.round(g+(t-g)*p);b=Math.round(b+(t-b)*p);return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1)}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function ell(c,x,y,rx,ry,rot){c.beginPath();c.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot||0,0,TAU)}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,Math.abs(r),0,TAU)}
function F(c,col){c.fillStyle=col;c.fill()}
function FS(c,col){c.fillStyle=col;c.fill();c.stroke()}
function poly(c,pts){c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath()}
function star(c,x,y,r1,r2,n){c.beginPath();n=n||5;for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,r=i%2?r2:r1;c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}c.closePath()}
function heart(c,x,y,s){c.beginPath();c.moveTo(x,y+s*.9);c.bezierCurveTo(x-s*1.6,y-s*.2,x-s*.7,y-s*1.3,x,y-s*.45);c.bezierCurveTo(x+s*.7,y-s*1.3,x+s*1.6,y-s*.2,x,y+s*.9);c.closePath()}
function line(c,x1,y1,x2,y2){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()}
function ink(c,w){c.strokeStyle=LN;c.lineWidth=w||1.6;c.lineJoin='round';c.lineCap='round'}
const COLS={red:'#e8504a',blue:'#3f7bd6',green:'#4cad62',yellow:'#f6c63a',orange:'#f28b2f',purple:'#8d5cc8',pink:'#f28fb7',sky:'#7cc8ec',white:'#f7f4ee',black:'#3b3533',brown:'#a8703f',gray:'#9fa4ab',navy:'#2f4078',mint:'#7fd6b4',cream:'#f3e1b5'};
const CLIST=Object.values(COLS);
// colours that would look like ふーたん's smock or hat are kept rare for the crowd (set per stage as decoys)
const FUTAN_PINK='#ff8cc0',FUTAN_SMOCK=FUTAN_PINK,FUTAN_BAG='#ffd23f';
const SAFE_TOPS=['#e8504a','#3f7bd6','#4cad62','#f28b2f','#8d5cc8','#7cc8ec','#f7f4ee','#3b3533','#a8703f','#9fa4ab','#2f4078','#7fd6b4','#f3e1b5','#c44a6a','#5a8a6a','#e0a040'];
// ================= characters (drawn at the origin = feet) =================
const BODY={
  kid:{hr:12.5,hy:-34,sy:-23,hip:-11,arm:10},
  adult:{hr:11.5,hy:-50,sy:-38,hip:-19,arm:15},
  elder:{hr:11.5,hy:-46,sy:-35,hip:-17,arm:13}
};
// tall: longer (+) or shorter (-) legs
function bodyOf(o){const B=BODY[o.age||'adult'],T=o.tall||0;return T?{hr:B.hr,hy:B.hy-T,sy:B.sy-T,hip:B.hip-T,arm:B.arm}:B}
// o: {age, fem, skin, hair, hairCol, top, topCol, botCol, shoe, hat, hatCol, acc:{glasses,balloon,...}, pose, swim, s}
function drawPerson(c,o){
  const B=bodyOf(o),hr=B.hr,hy=B.hy,sy=B.sy,hip=B.hip;
  const top=o.top||'shirt',tc=o.topCol||'#e8504a',bc=o.botCol||'#4d5a78',sk=o.skin||SKIN;
  const A=o.acc||{};
  c.save();ink(c,1.6);
  if(o.s)c.scale(o.s,o.s);
  if(o.swim){c.translate(0,-hip+3);c.save();c.beginPath();c.rect(-60,-140,120,140+hip-3);c.clip()}
  // ---- back layer ----
  if(A.balloon){c.lineWidth=1;line(c,9,sy+6,16,hy-34);c.lineWidth=1.6;ell(c,16,hy-42,8,9.5);FS(c,A.balloon);ell(c,13.5,hy-45,2,3,-.4);F(c,'rgba(255,255,255,.7)')}
  if(top==='astro'||top==='diver'){rr(c,-11,sy-1,22,hip-sy+4,5);FS(c,top==='astro'?'#d8dde4':'#f2b233')}
  if(A.backpack){rr(c,-10,sy,20,hip-sy+1,5);FS(c,A.backpack)}
  if(top==='princess'||top==='knight'){c.beginPath();c.moveTo(-8,sy);c.lineTo(8,sy);c.lineTo(13,-3);c.lineTo(-13,-3);c.closePath();FS(c,top==='knight'?'#c9433a':shade(tc,-.15))}
  // back hair
  const hc=o.hairCol||HAIR,hs=o.hair||'short';
  if(hs==='long'||hs==='pattsun'){rr(c,-hr-1.5,hy-4,2*hr+3,hr+10,6);FS(c,hc)}
  if(hs==='bob'){c.beginPath();c.moveTo(-hr-1.5,hy);c.bezierCurveTo(-hr-2,hy-hr*1.7,hr+2,hy-hr*1.7,hr+1.5,hy);c.quadraticCurveTo(hr+3,hy+8,hr,hy+11);c.quadraticCurveTo(0,hy+13,-hr,hy+11);c.quadraticCurveTo(-hr-3,hy+8,-hr-1.5,hy);c.closePath();FS(c,hc)}
  if(hs==='pony'){ell(c,hr+1,hy+5,4.5,8,-.4);FS(c,hc)}
  if(hs==='twin'){ell(c,-hr-3,hy+4,4.5,7.5,.4);FS(c,hc);ell(c,hr+3,hy+4,4.5,7.5,-.4);FS(c,hc)}
  if(hs==='braid'){for(const k of[-1,1]){for(let i=0;i<3;i++){ell(c,k*(hr+.5+i*.6),hy+4+i*4.6,3.5-i*.3,3.1,k*.3);FS(c,hc)}const bx=k*(hr+1.8),by=hy+17;c.save();c.translate(bx,by);poly(c,[[0,0],[-3.4,-2.6],[-3.4,2.6]]);FS(c,o.ribbon||'#e8504a');poly(c,[[0,0],[3.4,-2.6],[3.4,2.6]]);FS(c,o.ribbon||'#e8504a');circ(c,0,0,1.2);FS(c,o.ribbon||'#e8504a');c.restore();c.lineWidth=1.1;line(c,bx,by+1,bx+k*.4,by+4.5);ink(c)}}
  // ---- legs ----
  const legC=o.legCol||(top==='astro'?'#eef1f5':top==='diver'?'#2c3a4e':top==='knight'?'#aab1bb':(o.fem&&!o.pants)||top==='swim'?sk:bc);
  const spread=o.pose==='walk'?3:0;
  for(const k of[-1,1]){rr(c,k*3.4-2.6+k*spread*.5,hip-1,5.2,-hip-1.5,2.4);FS(c,legC)}
  const shoe=o.shoe||'#5b4236';
  for(const k of[-1,1]){ell(c,k*3.6+k*spread*.5,-1.6,3.8,2.4);FS(c,top==='diver'?'#2f6fd0':shoe)}
  // ---- bottom & top ----
  const sw=o.age==='kid'?9:10;
  switch(top){
  case 'smock':
    c.beginPath();c.moveTo(-sw+1,sy);c.lineTo(sw-1,sy);c.quadraticCurveTo(sw+4,hip,sw+3.5,hip+4);c.lineTo(-sw-3.5,hip+4);c.quadraticCurveTo(-sw-4,hip,-sw+1,sy);c.closePath();FS(c,tc);
    c.beginPath();c.moveTo(-5,sy+.5);c.quadraticCurveTo(0,sy+6,5,sy+.5);c.closePath();FS(c,'#fff');
    for(let i=0;i<2;i++){circ(c,0,sy+7+i*5,1.1);F(c,'#fff')}break;
  case 'dress':case 'princess':{const lo=top==='princess'?-3:hip+5;

  o.topCol=pick(t.cols||SAFE_TOPS);o.botCol=pick(PANTS);o.shoe=pick(['#5b4236','#3b3533','#f7f4ee','#e8504a','#3f7bd6']);

// ---- background helpers ----
function bgFill(c,col){c.fillStyle=col;c.fillRect(0,0,WW,WH)}
function grad(c,y0,y1,stops){const g=c.createLinearGradient(0,y0,0,y1);stops.forEach((s,i)=>g.addColorStop(i/(stops.length-1),s));c.fillStyle=g;c.fillRect(0,y0,WW,y1-y0)}
function tufts(c,x0,y0,w,h,col,n){c.strokeStyle=col;c.lineWidth=2;for(let i=0;i<n;i++){const x=x0+R()*w,y=y0+R()*h;c.beginPath();c.moveTo(x-3,y);c.lineTo(x-1,y-6);c.moveTo(x,y);c.lineTo(x+1,y-8);c.moveTo(x+3,y);c.lineTo(x+4,y-5);c.stroke()}}
function speckle(c,x0,y0,w,h,cols,n,r){for(let i=0;i<n;i++){c.fillStyle=cols[i%cols.length];circ(c,x0+R()*w,y0+R()*h,(r||2)*(.5+R()));c.fill()}}
function cloud(c,x,y,s,col){c.fillStyle=col||'#fff';for(const[dx,dy,r]of[[0,0,30],[-34,8,22],[34,8,24],[-14,-16,22],[16,-14,20]]){circ(c,x+dx*s,y+dy*s,r*s);c.fill()}}
function pathStroke(c,pts,w,col,edge){c.lineCap='round';c.lineJoin='round';const go=()=>{c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++){const p=pts[i-1],q=pts[i];c.quadraticCurveTo(p[0],p[1],(p[0]+q[0])/2,(p[1]+q[1])/2)}c.lineTo(pts[pts.length-1][0],pts[pts.length-1][1]);c.stroke()};
  if(edge){c.strokeStyle=edge;c.lineWidth=w+10;go()}c.strokeStyle=col;c.lineWidth=w;go();ink(c)}
function sheet(c,x,y,w,h,c1,c2){const s=14;for(let i=0;i<w/s;i++)for(let j=0;j<h/s;j++){c.fillStyle=(i+j)%2?c1:c2;c.fillRect(x+i*s,y+j*s,s,s)}c.strokeStyle='rgba(0,0,0,.15)';c.strokeRect(x,y,Math.ceil(w/s)*s,Math.ceil(h/s)*s);ink(c)}
function inEll(x,y,e){const dx=(x-e.x)/e.rx,dy=(y-e.y)/e.ry;return dx*dx+dy*dy<1}
function scatter(L,w,k,n,area,opts,minD){const placed=[];for(let i=0,tries=0;i<n&&tries<n*40;tries++){const x=area[0]+R()*(area[2]-area[0]),y=area[1]+R()*(area[3]-area[1]);
  if(w.st.walk(x,y,w)!=='land')continue;if(placed.some(p=>Math.hypot(p.x-x,(p.y-y)*1.5)<(minD||120)))continue;if(w.foot.some(f=>x>f.x0-30&&x<f.x1+30&&y>f.y0-20&&y<f.y1+20))continue;
  const o=typeof opts==='function'?opts():Object.assign({},opts||{});L.prop(k,x,y,o);placed.push({x,y});i++}}

function openAlbum(){
  const el=$('stageList');el.innerHTML='';
  STAGES.forEach((st,i)=>{const rec=PROG.stages[st.id],open=i<=PROG.max+1;
    const d=document.createElement('button');d.className='st'+(open?'':' lock');
    const c=mk(240,160);if(rec&&rec.photo){const im=new Image();im.onload=()=>c.getContext('2d').drawImage(im,0,0,240,160);im.src=rec.photo}else stageThumb(st,c);
    d.appendChild(c);const n=document.createElement('span');n.className='num';n.textContent=i+1;d.appendChild(n);
    const t=document.createElement('div');t.textContent=open?st.name:'？？？';d.appendChild(t);
    const s=document.createElement('div');s.className='got-row';s.innerHTML=['futan','mama','papa','ricky'].map(k=>{const on=k==='futan'?rec&&rec.clear:rec&&rec.subs[k];return `<span class="${on?'on':''}">${{futan:'ふ',mama:'ま',papa:'パ',ricky:'リ'}[k]}</span>`}).join('');d.appendChild(s);
    if(open)d.onclick=()=>{$('album').hidden=true;audio();startStage(i)};el.appendChild(d)});
  $('album').hidden=false;
}
function stageThumb(st,c){const x=c.getContext('2d'),w={st};R=rng(3);if(st.geo)st.geo(w);x.scale(c.width/WW,c.height/WH);ink(x);st.bg(x,w)}
function showTitle(){
  G.state='title';$('hud').hidden=true;$('intro').hidden=true;$('clear').hidden=true;$('pause').hidden=true;$('title').hidden=false;clearBubbles();
  if(!W){W=buildWorld(STAGES[Math.floor(Math.random()*STAGES.length)],(Math.random()*1e9)>>>0);cam.z=zMin()*1.6;cam.x=WW/2-VW/2/cam.z;cam.y=WH/2-VH/2/cam.z;clampCam()}
  const cc=$('cast');if(!cc.children.length)for(const[k,n]of[['futan','ふーたん'],['mama','まま'],['papa','パパ'],['ricky','リッキー']]){const f=document.createElement('figure');f.appendChild(portraitOf(k,84));const cap=document.createElement('figcaption');cap.textContent=n;f.appendChild(cap);cc.appendChild(f)}
  $('playBtn').textContent=PROG.max>=0?'つづきから（'+(PROG.round>1?roundName(PROG.round)+' ':'')+'ステージ '+(PROG.next+1)+'）':'あそぶ';
  const recs=Object.values(PROG.stages),cl=recs.filter(r=>r.clear).length,subs=recs.reduce((n,r)=>n+Object.keys(r.subs||{}).length,0);
  $('titleStats').innerHTML=PROG.max>=0?`<span>クリア ${cl} / ${STAGES.length}</span><span>みつけた なかま ${subs} / ${STAGES.length*3}</span><span>しゃしん ${recs.filter(r=>r.photo).length}まい</span>`:'';
}
function pauseGame(){if(G.state!=='play'&&G.state!=='hunt')return;G.paused=G.state;G.state='paused';$('pause').hidden=false;bgmStop()}
function resumeGame(){if(G.state!=='paused')return;G.state=G.paused;$('pause').hidden=true;bgmStart()}
// ================= input, buttons, main loop =================
const ptrs=new Map();let gest=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});cam.anim=null;
  if(ptrs.size===1)gest={x0:e.clientX,y0:e.clientY,t0:performance.now(),moved:0,multi:false};else if(gest)gest.multi=true});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;
  if(G.state==='found'||G.state==='intro'){p.x=e.clientX;p.y=e.clientY;return}
  if(ptrs.size===1){const dx=e.clientX-p.x,dy=e.clientY-p.y;cam.x-=dx/cam.z;cam.y-=dy/cam.z;clampCam();if(gest)gest.moved+=Math.abs(dx)+Math.abs(dy)}
  else if(ptrs.size===2){const ids=[...ptrs.keys()],o=ptrs.get(ids[0]===e.pointerId?ids[1]:ids[0]);
    const d0=Math.hypot(p.x-o.x,p.y-o.y),d1=Math.hypot(e.clientX-o.x,e.clientY-o.y),mx=(e.clientX+o.x)/2,my=(e.clientY+o.y)/2,pmx=(p.x+o.x)/2,pmy=(p.y+o.y)/2;
    const wp=toWorld(pmx,pmy);if(d0>4&&d1>4)cam.z=clamp(cam.z*d1/d0,zMin(),zMax());cam.x=wp.x-mx/cam.z;cam.y=wp.y-my/cam.z;clampCam()}
  p.x=e.clientX;p.y=e.clientY});
function endPtr(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(ptrs.size===0&&gest){if(!gest.multi&&gest.moved<12&&performance.now()-gest.t0<650)onTap(e.clientX,e.clientY);gest=null}}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);gest=null});
cv.addEventListener('wheel',e=>{e.preventDefault();cam.anim=null;const wp=toWorld(e.clientX,e.clientY);cam.z=clamp(cam.z*Math.exp(-e.deltaY*(e.ctrlKey?.01:.0016)),zMin(),zMax());cam.x=wp.x-e.clientX/cam.z;cam.y=wp.y-e.clientY/cam.z;clampCam()},{passive:false});
window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(G.state==='paused')resumeGame();else pauseGame()}});

$('playBtn').onclick=()=>{audio();startStage(PROG.max>=0?PROG.next:0)};
$('albumBtn').onclick=openAlbum;$('albumClose').onclick=()=>{$('album').hidden=true};
$('introGo').onclick=go;
$('hintBtn').onclick=useHint;
$('zoomBtn').onclick=()=>{const v=viewRect(),cx=v.x+v.w/2,cy=v.y+v.h/2;if(cam.z>zMin()*1.3)lookAt(cx,cy,zMin(),.6);else lookAt(cx,cy,zMin()*2.6,.6)};
$('menuBtn').onclick=pauseGame;$('resumeBtn').onclick=resumeGame;
$('skipBtn').onclick=()=>{$('pause').hidden=true;G.state='clear';wipe(VW/2,VH/2,()=>startStage((G.si+1)%STAGES.length))};
$('homeBtn').onclick=()=>{$('pause').hidden=true;bgmStop();showTitle()};
document.querySelectorAll('.snd').forEach(b=>b.onclick=()=>{audio();setSound(!SOUND)});setSound(SOUND);

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;NOW=now/1000;
  if(W){
    if(G.state==='play'||G.state==='hunt'){G.t+=dt;if(Math.floor(G.t)!==Math.floor(G.t-dt))updateHintBtn()}
    if(G.state==='play'&&G.diff&&G.diff.assist){
      if(G.t>45){G.assistT-=dt;if(G.assistT<=0){G.assistT=5;const f=W.fam.futan;f.hop=1;addFx({k:'ring',x:f.x,y:f.y-20,r:8,grow:26,d:.6,col:'#ffd23f',w:3})}}
      if(G.t>75&&!G.autoHint&&G.hints===0){G.autoHint=true;toast('ヒントだよ！');useHint()}
    }
    if(G.futanGlow&&(G.state==='play')){G.glowT-=dt;if(G.glowT<=0){G.glowT=2.5;const f=W.fam.futan;burst(f.x+4,f.y-14,10,['#ffd23f','#fff6b0','#ff8cc0'],70)}}
    for(const it of W.items){if(it.hop>0)it.hop-=dt*1.8;it.walking=false}
    if(G.state!=='paused')stepWalkers(dt);
    if(G.state==='title'){cam.x=clamp(WW/2-VW/2/cam.z+Math.sin(NOW*.08)*300,0,WW);cam.y=clamp(WH/2-VH/2/cam.z+Math.sin(NOW*.05)*150,0,WH);clampCam()}
    stepCam(dt);
  }
  render(NOW);updateBubbles();stepWipe(dt);
  requestAnimationFrame(frame);
}
resize();
window.GAME={G,get W(){return W},startStage,go,onTap,toScreen,showClear,STAGES,useHint,foundSub};
showTitle();
requestAnimationFrame(frame);
</script>
</body>
