(()=>{"use strict";
// ================= キュアたんてい ふーちゃん : core =================
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const LW=400,LH=720,TAU=Math.PI*2;
let W=0,H=0,DPR=1,SC=1,OX=0,OY=0,VX0=0,VX1=LW,VY0=0,VY1=LH,T=0;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR|0;cv.height=H*DPR|0;cv.style.width=W+'px';cv.style.height=H+'px';
  SC=Math.min(W/LW,H/LH);OX=(W-LW*SC)/2;OY=(H-LH*SC)/2;VX0=-OX/SC;VX1=LW+OX/SC;VY0=-OY/SC;VY1=LH+OY/SC;}
addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rand=(a,b)=>a+Math.random()*(b-a),randi=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[Math.random()*a.length|0];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const ease=t=>t<0?0:t>1?1:t*t*(3-2*t),easeOut=t=>1-Math.pow(1-clamp(t,0,1),3),easeBack=t=>{t=clamp(t,0,1);const s=1.7;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2);};
const FONT='"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif',POP='"Mochiy Pop One","M PLUS Rounded 1c",sans-serif';
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}

// ---------- save ----------
const SAVE={cleared:0,words:[],cp:null,mute:false,stars:{},doc:0,wins:0};
try{Object.assign(SAVE,JSON.parse(localStorage.getItem('cureTantei')||'{}'));}catch(e){}
function save(){try{localStorage.setItem('cureTantei',JSON.stringify(SAVE));}catch(e){}}
function learn(k){if(k&&!SAVE.words.includes(k)){SAVE.words.push(k);save();}}

// ---------- draw helpers ----------
function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function ell(c,x,y,rx,ry,rot=0){c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot,0,TAU);c.fill();}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,Math.max(.1,r),0,TAU);c.fill();}
function starP(c,x,y,R,r,n=5,rot=-Math.PI/2){c.beginPath();for(let i=0;i<n*2;i++){const a=rot+i*Math.PI/n,d=i%2?r:R;c.lineTo(x+Math.cos(a)*d,y+Math.sin(a)*d);}c.closePath();}
function heartP(c,x,y,s){c.beginPath();c.moveTo(x,y+s*.95);c.bezierCurveTo(x-s*1.5,y-s*.05,x-s*.8,y-s*1.25,x,y-s*.45);c.bezierCurveTo(x+s*.8,y-s*1.25,x+s*1.5,y-s*.05,x,y+s*.95);c.closePath();}
function shade(hex,a){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=a<0?0:255,t=Math.abs(a);r=Math.round(r+(f-r)*t);g=Math.round(g+(f-g)*t);b=Math.round(b+(f-b)*t);return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function hexA(h,a){const n=parseInt(h.slice(1),16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
function gfill(c,x,y,r,col,hi=.38,lo=-.16){const g=c.createRadialGradient(x-r*.35,y-r*.45,r*.05,x,y,r*1.15);g.addColorStop(0,shade(col,hi));g.addColorStop(.6,col);g.addColorStop(1,shade(col,lo));return g;}
function vfill(c,y0,y1,col,hi=.18,lo=-.12){const g=c.createLinearGradient(0,y0,0,y1);g.addColorStop(0,shade(col,hi));g.addColorStop(1,shade(col,lo));return g;}
function vgrad(c,y0,y1,stops){const g=c.createLinearGradient(0,y0,0,y1);stops.forEach((s,i)=>g.addColorStop(i/(stops.length-1),s));return g;}
const glowCache={};
function glow(col){if(glowCache[col])return glowCache[col];const g=document.createElement('canvas');g.width=g.height=64;const c=g.getContext('2d');const gr=c.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,hexA(col,1));gr.addColorStop(.35,hexA(col,.5));gr.addColorStop(1,hexA(col,0));c.fillStyle=gr;c.fillRect(0,0,64,64);return glowCache[col]=g;}
function drawGlow(c,col,x,y,r,a=1){const o=c.globalAlpha;c.globalAlpha=o*a;c.drawImage(glow(col),x-r,y-r,r*2,r*2);c.globalAlpha=o;}
function bow(c,x,y,col,s=1){c.fillStyle=col;for(const k of[-1,1]){c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+k*8*s,y-7*s,x+k*8*s,y);c.quadraticCurveTo(x+k*8*s,y+6*s,x,y);c.fill();c.stroke();c.beginPath();c.moveTo(x,y);c.lineTo(x+k*4*s,y+7*s);c.lineTo(x+k*1.5*s,y+7.5*s);c.closePath();c.fill();c.stroke();}c.fillStyle='#ffd84a';heartP(c,x,y+.3*s,2.4*s);c.fill();c.stroke();}
function txt(c,s,x,y,size,col='#5b2c47',align='center',weight=800,font=FONT){c.font=`${weight} ${size}px ${font}`;c.textAlign=align;c.textBaseline='middle';c.fillStyle=col;c.fillText(s,x,y);}
function otext(c,s,x,y,size,fill='#fff',stroke='#ff4f9a',align='center',font=POP){c.font=`400 ${size}px ${font}`;if(font===FONT)c.font=`900 ${size}px ${font}`;c.textAlign=align;c.textBaseline='middle';c.lineJoin='round';c.lineWidth=Math.max(3,size*.24);c.strokeStyle=stroke;c.strokeText(s,x,y);c.fillStyle=fill;c.fillText(s,x,y);}
function wrap(c,s,maxW){const out=[];for(const para of String(s).split('\n')){let line='';for(const tk0 of para.split(' ')){const tk=line?' '+tk0:tk0;
    if(c.measureText(line+tk).width<=maxW){line+=tk;continue;}
    if(line){out.push(line);line='';}
    if(c.measureText(tk0).width<=maxW){line=tk0;continue;}
    for(const ch of tk0){if(c.measureText(line+ch).width>maxW&&line){out.push(line);line=ch;}else line+=ch;}}
  if(line)out.push(line);}return out;}
function para(c,s,x,y,maxW,size,col,lh=1.35,align='left',weight=800){c.font=`${weight} ${size}px ${FONT}`;const ls=wrap(c,s,maxW);c.textAlign=align;c.textBaseline='middle';c.fillStyle=col;ls.forEach((l,i)=>c.fillText(l,x,y+i*size*lh));return ls.length;}
const inR=(x,y,cx,cy,w,h)=>Math.abs(x-cx)<=w/2&&Math.abs(y-cy)<=h/2;
const inC=(x,y,cx,cy,r)=>(x-cx)*(x-cx)+(y-cy)*(y-cy)<=r*r;
// silhouette (for かげ クイズ)
const silCv=document.createElement('canvas');silCv.width=silCv.height=400;
function silhouette(c,fn,x,y,size,col='#2a1a3a'){const s=silCv.getContext('2d');s.setTransform(1,0,0,1,0,0);s.clearRect(0,0,400,400);s.globalCompositeOperation='source-over';s.save();s.translate(200,200);fn(s);s.restore();s.globalCompositeOperation='source-in';s.fillStyle=col;s.fillRect(0,0,400,400);s.globalCompositeOperation='source-over';c.drawImage(silCv,x-size/2,y-size/2,size,size);}
// ================= audio (sfx / original bgm / voice) =================
let AC=null,MG=null,BGG=null,NOISE=null;
let ttsUnlocked=false;
function audioInit(){if(!ttsUnlocked&&'speechSynthesis' in window){ttsUnlocked=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}catch(e){}}if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.6;MG.connect(AC.destination);BGG=AC.createGain();BGG.gain.value=1;BGG.connect(MG);}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,d,type='sine',v=.15,f2=0,when=0,dest){if(!AC||SAVE.mute)return;const t0=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.01);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(dest||MG);o.start(t0);o.stop(t0+d+.03);}
function noise(d,v,f,when=0,dest,type='highpass'){if(!AC||SAVE.mute)return;if(!NOISE){NOISE=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const a=NOISE.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
  const t0=AC.currentTime+when,src=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();src.buffer=NOISE;fl.type=type;fl.frequency.value=f;
  g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);src.connect(fl);fl.connect(g);g.connect(dest||MG);src.start(t0);src.stop(t0+d+.02);}
const lastS={};function thr(k,ms){const n=performance.now();if(lastS[k]&&n-lastS[k]<ms)return false;lastS[k]=n;return true;}
const NOTE=n=>261.63*Math.pow(2,n/12);
const SFX={
  ready(){[1319,1760,2093].forEach((f,i)=>tone(f,.15,'sine',.08,0,i*.08));},
  tap(){tone(900,.06,'sine',.06,1200);},
  pop(){tone(600,.08,'sine',.1,1200);},
  ok(){[784,988,1319].forEach((f,i)=>tone(f,.18,'triangle',.1,0,i*.07));},
  no(){tone(300,.18,'triangle',.08,220);tone(260,.2,'triangle',.07,200,.12);},
  find(){[1047,1319,1568,2093].forEach((f,i)=>tone(f,.22,'sine',.08,0,i*.06));},
  count(n=1){tone(NOTE(12+[0,2,4,5,7,9,11,12,14,16,17,19,21,23,24,26,28,29,31,33][clamp(n-1,0,19)]),.14,'triangle',.1);},
  whoosh(){noise(.3,.08,1200,0,null,'bandpass');tone(300,.3,'sine',.04,900);},
  henshin(){[523,659,784,1047,1319,1568,2093].forEach((f,i)=>tone(f,.5,'triangle',.08,0,i*.08));tone(200,1.4,'sawtooth',.03,2000);},
  shot(){if(thr('shot',40))tone(700+Math.random()*200,.1,'square',.035,1400);},
  hit(){if(thr('hit',40)){tone(380,.08,'square',.05,200);noise(.08,.06,3000);}},
  guard(){tone(1200,.2,'sine',.08,1800);tone(1600,.2,'sine',.05,2400,.05);},
  hurt(){tone(320,.2,'sawtooth',.06,130);noise(.15,.05,800);},
  warn(){for(let i=0;i<2;i++)tone(660,.14,'square',.05,520,i*.2);},
  boom(){tone(160,.5,'triangle',.14,40);noise(.5,.12,300);},
  beam(){tone(400,1.2,'sawtooth',.05,1800);noise(1.2,.06,2000);[1047,1319,1568].forEach((f,i)=>tone(f,.8,'triangle',.06,0,.4+i*.1));},
  fanfare(){[784,784,784,1047,988,1047,1319].forEach((f,i)=>tone(f,.28,'triangle',.12,0,[0,.14,.28,.42,.7,.84,1][i]));},
  heal(){tone(880,.15,'sine',.1,1320);tone(1320,.2,'sine',.08,1760,.1);},
  baby(){tone(1100,.12,'sine',.08,1500);tone(1300,.14,'sine',.07,1700,.13);},
  jump(){tone(400,.15,'sine',.08,900);},
  coin(){tone(1319,.07,'square',.04);tone(1760,.12,'square',.04,0,.06);},
  unlock(){tone(500,.06,'square',.06);tone(900,.08,'square',.06,0,.08);[1047,1319,1568].forEach((f,i)=>tone(f,.2,'triangle',.08,0,.2+i*.08));},
  click(){tone(1500,.03,'square',.04);},
  stamp(){tone(120,.2,'triangle',.18,60);noise(.12,.1,500);},
  ring(){for(let i=0;i<6;i++){tone(1300,.05,'square',.04,0,i*.09);tone(1000,.05,'square',.04,0,i*.09+.045);}},
  sparkle(){if(thr('sp',60))tone(1800+Math.random()*800,.12,'sine',.04);},
  drum(){tone(90,.15,'sine',.2,50);},
  gulp(){tone(300,.1,'sine',.1,150);tone(250,.12,'sine',.1,120,.12);},
  burp(){tone(140,.25,'sawtooth',.08,90);},
  sneeze(){noise(.3,.12,1500);tone(700,.2,'sine',.05,300);},
  scrub(){if(thr('scrub',110))noise(.08,.05,3000);},
};
function sfx(k,a){if(SFX[k])SFX[k](a);}
// ---------- original BGM ----------
const mel=t=>t.trim().split(/\s+/).map(x=>x==='.'?null:+x);
const SONGS={
  office:{bpm:116,lead:'triangle',vol:.05,len:1.6,prog:[[0,4,7],[9,12,16],[5,9,12],[7,11,14]],
    mel:mel(`12 . 16 . 19 . 16 .  21 . 19 . 16 . . .  17 . 16 . 14 . 12 .  14 . . . 19 . . .
             12 . 16 . 19 . 24 .  23 . 21 . 19 . . .  17 . 19 . 21 . 17 .  19 . 14 . 12 . . .`)},
  search:{bpm:128,lead:'square',vol:.022,len:.9,prog:[[9,12,16],[5,9,12],[7,11,14],[4,8,11]],
    mel:mel(`21 . 24 21 . . 19 .  17 . 21 17 . . 16 .  19 . 23 19 . . 17 .  16 . 20 . 23 . . .
             21 . 24 . 28 . 26 24  24 . 21 . 17 . 21 .  23 . 19 . 14 . 19 .  20 . . . 16 . . .`)},
  battle:{bpm:152,lead:'sawtooth',vol:.018,len:1.3,prog:[[0,4,7],[7,11,14],[9,12,16],[5,9,12]],
    mel:mel(`24 . 24 . 23 24 . 19  19 . 21 . 23 . 26 .  24 . 23 . 21 . 19 .  21 . . 17 . 21 24 .
             24 . 28 . 26 24 . 23  23 . 26 . 31 . 26 .  28 . 26 . 24 . 23 .  24 . . . 24 . . .`)},
  boss:{bpm:144,lead:'sawtooth',vol:.018,len:1.3,prog:[[2,5,9],[-2,2,5],[0,4,7],[-3,1,4]],
    mel:mel(`14 . 14 17 . 14 13 .  14 . . 10 . . 14 .  16 . 16 19 . 16 14 .  13 . 16 . 21 . . .
             26 . 24 . 22 . 21 .  22 . 21 . 17 . 14 .  19 . 17 . 16 . 19 .  21 . 20 . 21 . . .`)},
  doctor:{bpm:104,lead:'sine',vol:.06,len:1.8,prog:[[5,9,12],[0,4,7],[2,5,9],[-2,2,5]],
    mel:mel(`17 . 21 . 24 . . .  19 . 16 . 12 . . .  17 . 14 . 21 . 19 .  17 . . . . . . .
             24 . 22 . 21 . 19 .  19 . 21 . 22 . 24 .  26 . 24 . 21 . 17 .  17 . . . 12 . . .`)},
  night:{bpm:96,lead:'triangle',vol:.05,len:2,prog:[[9,12,16],[5,9,12],[0,4,7],[7,11,14]],
    mel:mel(`28 . . 26 24 . . .  21 . . 24 26 . . .  24 . . 23 21 . 19 .  23 . . . . . . .
             28 . 31 . 28 . 26 .  24 . 26 . 28 . . .  24 . 23 . 21 . 19 .  21 . . . . . . .`)},
};
const BGM={song:null,step:0,next:0};
function bgm(name){if(BGM.song!==name){BGM.song=name;BGM.step=0;}}
function bgmTick(){if(!AC||!BGG)return;const sp=speaking();BGG.gain.setTargetAtTime(sp?.35:1,AC.currentTime,.12);
  if(SAVE.mute||!BGM.song||AC.state!=='running')return;const S=SONGS[BGM.song];if(!S)return;
  if(BGM.next<AC.currentTime)BGM.next=AC.currentTime+.05;
  while(BGM.next<AC.currentTime+.25){const spb=60/S.bpm/2,s=BGM.step%S.mel.length,ch=S.prog[(s>>3)%S.prog.length],when=BGM.next-AC.currentTime;
    if(s%4===0)tone(NOTE(ch[0]-24),spb*3,'triangle',.07,0,when,BGG);
    if(s%2===1)tone(NOTE(ch[(s>>1)%3]),spb*1.2,'sine',.025,0,when,BGG);
    if((BGM.song==='battle'||BGM.song==='boss')&&s%2===0)noise(.04,s%8===4?.05:.02,6000,when,BGG);
    const n=S.mel[s];if(n!=null)tone(NOTE(n),spb*S.len,S.lead,S.vol,0,when,BGG);
    BGM.step++;BGM.next+=spb;}}
// ---------- voice (speechSynthesis) ----------
const hasTTS='speechSynthesis' in window;let JV=null,EV=null;
function loadVoices(){if(!hasTTS)return;const v=speechSynthesis.getVoices();JV=v.find(x=>/^ja[-_]JP/i.test(x.lang))||v.find(x=>/^ja/i.test(x.lang))||null;
  EV=v.find(x=>/^en[-_]US/i.test(x.lang)&&/Samantha|Google US|Aria|Jenny|Female/i.test(x.name))||v.find(x=>/^en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null;}
if(hasTTS){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}}
function speaking(){return hasTTS&&speechSynthesis.speaking;}
const VO={fu:[1.45,1.05],rk:[1.95,1.12],kuro:[.8,1.05],witch:[.55,.92],narr:[1.15,1],en:[1.25,.82]};
function speakOne(text,lang,who){if(SAVE.mute||!hasTTS||!text)return;try{const u=new SpeechSynthesisUtterance(text.replace(/[「」『』☆★♪♡・…]/g,' ').replace(/〜/g,'ー'));
  u.lang=lang==='en'?'en-US':'ja-JP';const v=lang==='en'?EV:JV;if(v)u.voice=v;
  const p=lang==='en'?VO.en:(VO[who]||(NPC[who]&&NPC[who].vo)||[1.25,1]);u.pitch=p[0];u.rate=p[1];speechSynthesis.speak(u);}catch(e){}}
function hush(){if(hasTTS)try{speechSynthesis.cancel();}catch(e){}}
let LASTSAY=null;
// say('にほんご', who, 'english')  /  say([['apple','en'],['は どれ？','ja']], who)
function say(parts,who='fu',en){hush();const list=typeof parts==='string'?[[parts,'ja']]:parts.map(p=>typeof p==='string'?[p,'ja']:p);if(en)list.push([en,'en']);
  LASTSAY=[list,who];for(const[t,l]of list)speakOne(t,l,who);}
function replay(){if(LASTSAY){hush();for(const[t,l]of LASTSAY[0])speakOne(t,l,LASTSAY[1]);}}
// ================= characters =================
const HAIR='#2b1d22',SKIN='#ffe4d4',LN='#5b2c47';
// ふーちゃん  o:{t,s,cure,doc,pose:'idle'|'run'|'win'|'cast'|'point'|'hold'|'think',moving,dir,happy,ouch,item:'lens',spin,look}
function drawFutan(c,x,y,o={}){
  const t=o.t??T,cure=!!o.cure,pose=o.pose||'idle',mv=o.moving;
  c.save();c.translate(x,y);c.scale(o.s||1,o.s||1);
  if(!o.noShadow){c.fillStyle='rgba(40,0,40,.18)';ell(c,0,0,14,4.5);}
  const bob=pose==='win'?Math.abs(Math.sin(t*6))*3:mv?Math.abs(Math.sin(t*13))*2.2:Math.sin(t*3)*.8;
  c.translate(0,-bob-(o.lift||0));if(o.dir<0)c.scale(-1,1);if(o.spin!=null)c.scale(Math.cos(o.spin)||.02,1);
  c.lineJoin='round';c.lineCap='round';c.strokeStyle=LN;c.lineWidth=1.5;
  const HY=-41,sw=mv?Math.sin(t*13):0;
  if(cure){for(const k of[-1,1]){const w=Math.sin(t*6+k)*3;c.fillStyle=k<0?'#ff5fa8':'#ff8cc6';c.beginPath();c.moveTo(k*3,-20);c.bezierCurveTo(k*10,-16,k*14+w,-10,k*18+w,-2);c.lineTo(k*12+w,-3);c.bezierCurveTo(k*9,-9,k*6,-14,k*1,-18);c.closePath();c.fill();c.stroke();}}
  // back hair
  c.fillStyle=HAIR;c.beginPath();c.moveTo(-16.5,HY);c.bezierCurveTo(-18,HY-23,18,HY-23,16.5,HY);c.quadraticCurveTo(18.5,HY+11,15.5,HY+16);c.quadraticCurveTo(0,HY+19,-15.5,HY+16);c.quadraticCurveTo(-18.5,HY+11,-16.5,HY);c.closePath();c.fill();c.stroke();

  down(x,y){const d=this.d;if(this.fin!=null)return;

function drawMonster(c,m,x,y,s,t,o={}){c.save();c.translate(x,y);const wob=Math.sin(t*3)*.04;

      c.fillStyle='#ff4d6d';c.fillRect(-110,24,220,12);for(const dx of[-60,0,60])drawIcon(c,'strawberry',dx,-92,1.3);for(const sd of[-1,1]){c.fillStyle=col;c.beginPath();c.ellipse(sd*136,10+Math.sin(t*5+sd)*10,22,34,sd*.5,0,TAU);c.fill();c.stroke();}ey=12;break;
    case'candy':for(const sd of[-1,1]){c.fillStyle=shade(col,.2);c.beginPath();c.moveTo(sd*90,0);c.lineTo(sd*160,-60+Math.sin(t*6)*10);c.lineTo(sd*150,0);c.lineTo(sd*160,60-Math.sin(t*6)*10);c.closePath();c.fill();c.stroke();}
      c.fillStyle=gfill(c,-30,-30,120,col);circ(c,0,0,110);c.stroke();c.strokeStyle='rgba(255,255,255,.8)';c.lineWidth=16;c.beginPath();for(let a=0;a<TAU*1.6;a+=.2){const r=12+a*18;c.lineTo(Math.cos(a+t)*r,Math.sin(a+t)*r);}c.stroke();c.strokeStyle='#3a1a3a';c.lineWidth=5;break;
    case'paint':c.fillStyle=gfill(c,-30,-30,140,col);c.beginPath();for(let i=0;i<=24;i++){const a=i/24*TAU,r=110+Math.sin(a*5+t*3)*12;c.lineTo(Math.cos(a)*r,Math.sin(a)*r*.9);}c.closePath();c.fill();c.stroke();

      c.save();c.translate(60,-100);c.rotate(.5+Math.sin(t*3)*.2);drawIcon(c,'brush',0,0,2.4);c.restore();break;
    case'germ':c.fillStyle=col;for(let i=0;i<12;i++){const a=i/12*TAU+t*.5;c.save();c.rotate(a);c.fillRect(-6,-150,12,50);circ(c,0,-150,16);c.restore();}c.fillStyle=gfill(c,-30,-30,130,col);circ(c,0,0,112);c.stroke();c.fillStyle='rgba(255,255,255,.25)';for(const[a,b,r]of[[-50,40,18],[60,50,14],[40,-60,12]])circ(c,a,b,r);break;

  update(dt){const d=this.d;this.t+=dt;if(this.stun>0)this.stun-=dt;
    if(this.fy>0||this.vy!==0){this.fy+=this.vy*dt;this.vy-=1600*dt;if(this.fy<=0){this.fy=0;this.vy=0;}}

      this.obs=this.obs.filter(o=>o.x>-60);this.stars=this.stars.filter(s=>s.x>-60&&!s.got);

  draw(c){const d=this.d;drawBG(c,this.bg);const p=clamp(this.t/this.len,0,1);

    for(const s of this.stars){drawGlow(c,'#fff6a0',s.x,s.y,26,.6);drawIcon(c,'star',s.x,s.y,.8);}
    for(const o of this.obs){c.save();c.translate(o.x,GY);if(o.k==='box'){c.fillStyle='#d8a060';rr(c,-22,-44,44,44,4);c.fill();c.strokeStyle=LN;c.lineWidth=2.5;c.stroke();c.beginPath();c.moveTo(-22,-22);c.lineTo(22,-22);c.stroke();}

      else if(o.k==='rock'){c.fillStyle='#8a8aa0';ell(c,0,-18,24,20);c.strokeStyle=LN;c.lineWidth=2.5;c.stroke();}
      else if(o.k==='sand'){c.fillStyle='#e8c070';rr(c,-22,-30,44,30,4);c.fill();c.strokeStyle=LN;c.lineWidth=2.5;c.stroke();c.fillRect(-8,-44,16,14);c.strokeRect(-8,-44,16,14);}
      else drawIcon(c,'crab',0,-20,1.1);c.restore();}
    const kx=this.ph==='catch'?lerp(330-p*110,160,Math.min(1,this.ct)):330-p*110+Math.sin(this.t*3)*8;

    c.fillStyle='rgba(255,255,255,.9)';rr(c,40,160,320,28,14);c.fill();c.fillStyle=vfill(c,160,188,'#ff8cc6');rr(c,44,164,312*p,20,10);c.fill();drawFutan(c,44+312*p,190,{s:.55,noShadow:1});drawKuro(c,356,196,.22,T);
    c.fillStyle='rgba(255,255,255,.9)';rr(c,290,200,90,40,20);c.fill();drawIcon(c,'star',312,220,.6);otext(c,String(this.got),350,221,22,'#ffb03a','#fff');

  down(){if(this.ph==='run'&&this.fy===0&&this.vy===0){this.vy=720;sfx('jump');}},
  hint(){const o=this.obs.find(o=>o.x>120&&o.x<260&&!o.hit);return o&&this.fy===0?{x:200,y:420}:null;},
};

function toL(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-OX)/SC,y:(e.clientY-r.top-OY)/SC};}
let ptrId=null;
cv.addEventListener('pointerdown',e=>{audioInit();if(ptrId!==null&&ptrId!==e.pointerId)return;ptrId=e.pointerId;try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const p=toL(e);IDLE=0;ripple(p.x,p.y);if(TR||!scene)return;
  if(scene.isStep){if(inC(p.x,p.y,36,34,30)){sfx('tap');go(SCN.office);return;}if(inC(p.x,p.y,364,34,30)){sfx('tap');replay();return;}if(INS&&inR(p.x,p.y,200,106,372,76)){replay();return;}}

cv.addEventListener('pointermove',e=>{if(e.pointerId!==ptrId||TR||!scene)return;const p=toL(e);if(scene.move)scene.move(p.x,p.y);});

  try{

    if(scene){if(scene.update)scene.update(dt);if(scene.fin!=null){scene.fin-=dt;if(scene.fin<=0){scene.fin=null;if(scene.isStep&&!scene._ended){scene._ended=true;stepDone();}}}}
    if(INS)INS.t+=dt;if(CARD){CARD.t+=dt;if(CARD.t>2.6)CARD=null;}IDLE+=dt;if(SHAKE>0)SHAKE-=dt;if(FLASH>0)FLASH-=dt*1.6;
