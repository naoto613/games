<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ff7ab8">
<title>キュアふーたんの キラキラカート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#ffd6ec;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif}
#gl,#hud{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
#hud{pointer-events:none;z-index:2}
#touch{position:fixed;inset:0;z-index:3;display:none;touch-action:none}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box;z-index:10;color:#5b2c47;text-align:center;overflow-y:auto}
.ov.show{display:flex}
.dim{background:rgba(50,10,60,.5)}
.panel{background:rgba(255,255,255,.96);border:4px solid #ff8cc6;border-radius:26px;padding:18px 16px;max-width:560px;width:100%;box-sizing:border-box;box-shadow:0 8px 0 #e0579a}
h2{margin:0 0 6px;font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif;font-weight:400;font-size:28px;color:#ff4f9a;text-shadow:0 2px 0 #fff}
p{margin:6px 0;font-weight:800;font-size:17px;line-height:1.5}
.btn{appearance:none;border:0;border-radius:999px;background:linear-gradient(#ff9ccf,#ff5fa8);color:#fff;font:inherit;font-weight:900;font-size:24px;padding:14px 34px;box-shadow:0 5px 0 #c8387c;cursor:pointer;text-shadow:0 2px 0 rgba(160,30,90,.5);min-width:220px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c8387c}
.btn.sub{background:linear-gradient(#c3b2ff,#8f74f0);box-shadow:0 5px 0 #6147c0;font-size:18px;padding:10px 20px;min-width:0}
.btn.sub:active{box-shadow:0 2px 0 #6147c0}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#title{justify-content:space-between}
.logo{margin-top:4px;font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif;color:#fff;line-height:1.05;text-shadow:0 3px 0 #ff4f9a,3px 0 0 #ff4f9a,-3px 0 0 #ff4f9a,0 -3px 0 #ff4f9a,2px 2px 0 #ff4f9a,-2px 2px 0 #ff4f9a,2px -2px 0 #ff4f9a,-2px -2px 0 #ff4f9a,0 8px 0 rgba(120,20,80,.35)}
.logo .a{font-size:clamp(18px,5vw,30px);color:#fff6a8}
.logo .b{font-size:clamp(34px,11vw,76px);white-space:nowrap}
.logo .c{font-size:clamp(30px,9vw,58px);color:#bff4ff}
.courses{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;width:100%;max-width:760px}
.cs{display:flex;align-items:center;gap:12px;border-radius:22px;padding:12px 14px;font:inherit;text-align:left;color:#5b2c47;background:#fff;box-shadow:0 5px 0 #e0579a;border:3px solid #ff8cc6;cursor:pointer}
.cs:active{transform:translateY(3px);box-shadow:0 2px 0 #e0579a}
.cs .em{font-size:44px;width:58px;height:58px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:radial-gradient(#fff 40%,#ffe0f0);flex:none}
.cs b{display:block;font-size:20px}
.cs small{font-weight:800;color:#9a6a8a;font-size:13px}
.cs .md{margin-left:auto;font-size:30px}
.cs.lock{filter:grayscale(1);opacity:.55;pointer-events:none}
#ctl{display:none}
.pad{position:fixed;z-index:4;bottom:max(16px,env(safe-area-inset-bottom));width:clamp(92px,19vmin,160px);height:clamp(92px,19vmin,160px);border-radius:50%;background:rgba(255,255,255,.28);border:5px solid rgba(255,255,255,.9);box-shadow:0 5px 0 rgba(200,56,124,.5);display:flex;align-items:center;justify-content:center;color:#fff;font-size:clamp(40px,8vmin,70px);font-weight:900;text-shadow:0 3px 0 #e0579a;pointer-events:none;transition:transform .06s,background .06s}
.pad.on{background:rgba(255,110,180,.7);transform:scale(.92)}
#padL{left:max(16px,env(safe-area-inset-left))}
#padR{right:max(16px,env(safe-area-inset-right))}
#bItem{position:fixed;z-index:6;right:max(16px,env(safe-area-inset-right));bottom:calc(max(16px,env(safe-area-inset-bottom)) + clamp(92px,19vmin,160px) + 18px);width:clamp(100px,20vmin,168px);height:clamp(100px,20vmin,168px);border-radius:50%;border:0;padding:6px;background:conic-gradient(#ffd84a,#ff5fa8,#b98cff,#5ad0ff,#ffd84a);box-shadow:0 6px 0 #c8387c;touch-action:none;cursor:pointer}
#bItem span{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;background:#fff;color:#c05090;font:900 clamp(15px,2.6vmin,22px)/1.1 "M PLUS Rounded 1c",sans-serif}
#bItem i{font-style:normal;font-size:clamp(36px,8vmin,70px);line-height:1.1}
#bItem.empty{filter:grayscale(1);opacity:.5}
#bItem.ready{animation:bounce .5s ease-in-out infinite alternate}
@keyframes bounce{from{transform:scale(1)}to{transform:scale(1.08)}}
#bPause{position:fixed;z-index:6;right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));width:50px;height:50px;border-radius:50%;border:3px solid #fff;background:#ff7ab8;color:#fff;font-size:20px;font-weight:900;display:none;cursor:pointer}
.rk{display:flex;flex-direction:column;gap:6px;margin:8px auto;max-width:360px}
.rk div{display:flex;align-items:center;gap:10px;background:#fff4fa;border-radius:14px;padding:4px 12px;font-weight:900;font-size:18px}
.rk div.me{background:linear-gradient(#ffe0f0,#ffc4e2);border:3px solid #ff5fa8}
.rk img{width:40px;height:40px}
.rk .n{width:44px;font-family:"Mochiy Pop One",sans-serif;color:#ff4f9a}
#resCv{width:220px;height:170px;display:block;margin:0 auto}
.big{font-family:"Mochiy Pop One",sans-serif;font-size:48px;color:#ff4f9a;margin:0;line-height:1.1;text-shadow:0 3px 0 #ffd6ec}
.tog{font-size:16px}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="touch"></div>
<div id="ctl">
  <div class="pad" id="padL">◀</div>
  <div class="pad" id="padR">▶</div>
  <button id="bItem" class="empty" aria-label="アイテムを なげる"><span><i id="bItemIc">？</i>なげる</span></button>
</div>
<button id="bPause" aria-label="ポーズ">Ⅱ</button>

<div id="title" class="ov show">
  <div class="logo"><div class="a">プリキュアレース！</div><div class="b">キュアふーたんの</div><div class="c">キラキラカート</div></div>
  <div style="display:flex;flex-direction:column;gap:12px;align-items:center">
    <button class="btn" id="playBtn">あそぶ！</button>
    <div class="row"><button class="btn sub tog" id="easyBtn"></button><button class="btn sub tog" id="muteBtn"></button></div>
  </div>
</div>

<div id="select" class="ov dim">
  <h2 style="color:#fff;text-shadow:0 3px 0 #ff4f9a">コースを えらんでね</h2>
  <div class="courses" id="courseList"></div>
  <button class="btn sub" id="backBtn">もどる</button>
</div>

<div id="howto" class="ov dim">
  <div class="panel"><h2>あそびかた</h2>
    <p>🚗 カートは かってに はしるよ！</p>
    <p>◀ ▶ の ほうを さわると まがるよ</p>
    <p>🎁 にじいろの はこで アイテムゲット！<br>「なげる」で なげよう</p>
    <p>⭐ スターで むてき！ 💖 ハートを あてると あいては くるくる</p>
    <button class="btn" id="howBtn" style="margin-top:8px">わかった！</button>
  </div>
</div>

<div id="pause" class="ov dim">
  <div class="panel"><h2>ひとやすみ</h2><p>つかれたら おやすみしてね</p>
  <div style="display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:10px">
    <button class="btn" id="resumeBtn">つづける</button>
    <button class="btn sub" id="retryBtn2">さいしょから</button>
    <button class="btn sub" id="quitBtn">コースを えらぶ</button>
  </div></div>
</div>

<div id="result" class="ov dim">
  <div class="panel">
    <canvas id="resCv" width="440" height="340"></canvas>
    <p class="big" id="resRank"></p>
    <p id="resMsg"></p>
    <div class="rk" id="resList"></div>
    <div style="display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:10px">
      <button class="btn" id="nextBtn">つぎの コースへ</button>
      <div class="row"><button class="btn sub" id="againBtn">もういちど</button><button class="btn sub" id="toSelBtn">コースを えらぶ</button></div>
    </div>
  </div>
</div>

<script src="./three.min.js"></script>
<script>
'use strict';
// ================= basics =================
const $=id=>document.getElementById(id);
const TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0],clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const FONT='"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif';
const Q=new URLSearchParams(location.search),BOT=Q.has('bot'),SPEED=Math.max(1,+Q.get('speed')||1);
let W=0,H=0,DPR=1,Z=1,CLK=0;
const SAVE={best:[0,0,0,0],easy:true,mute:false,how:false};
try{Object.assign(SAVE,JSON.parse(localStorage.getItem('cureFutanKart')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('cureFutanKart',JSON.stringify(SAVE))}catch(e){}}
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
// ================= draw helpers =================
function ell(c,x,y,rx,ry){c.beginPath();c.ellipse(x,y,rx,ry,0,0,TAU);c.fill();}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,TAU);c.fill();}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function starP(c,x,y,R,r,n=5,rot=-Math.PI/2){c.beginPath();for(let i=0;i<n*2;i++){const a=rot+i*Math.PI/n,d=i%2?r:R;c.lineTo(x+Math.cos(a)*d,y+Math.sin(a)*d);}c.closePath();}
function heartP(c,x,y,s){c.beginPath();c.moveTo(x,y+s*.95);c.bezierCurveTo(x-s*1.5,y-s*.05,x-s*.8,y-s*1.25,x,y-s*.45);c.bezierCurveTo(x+s*.8,y-s*1.25,x+s*1.5,y-s*.05,x,y+s*.95);c.closePath();}
function flowerP(c,x,y,r,col,mid){c.fillStyle=col;for(let i=0;i<5;i++){const a=i/5*TAU;circ(c,x+Math.cos(a)*r*.62,y+Math.sin(a)*r*.62,r*.5);}c.fillStyle=mid||'#ffe066';circ(c,x,y,r*.38);}
function otext(c,s,x,y,size,fill='#fff',stroke='#ff4f9a',align='center',font){c.font=`900 ${size}px ${font||FONT}`;c.textAlign=align;c.textBaseline='middle';c.lineJoin='round';c.lineWidth=Math.max(3,size*.24);c.strokeStyle=stroke;c.strokeText(s,x,y);c.fillStyle=fill;c.fillText(s,x,y);}
function hexA(h,a){const n=parseInt(h.slice(1),16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
const glowCache={};
function glow(col){if(glowCache[col])return glowCache[col];const g=document.createElement('canvas');g.width=g.height=64;const c=g.getContext('2d');const gr=c.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,hexA(col,1));gr.addColorStop(.35,hexA(col,.5));gr.addColorStop(1,hexA(col,0));c.fillStyle=gr;c.fillRect(0,0,64,64);return glowCache[col]=g;}
function drawGlow(c,col,x,y,r,a=1){c.globalAlpha=a;c.drawImage(glow(col),x-r,y-r,r*2,r*2);c.globalAlpha=1;}
function bow(c,x,y,col,s=1){c.fillStyle=col;for(const k of[-1,1]){c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+k*8*s,y-7*s,x+k*8*s,y);c.quadraticCurveTo(x+k*8*s,y+6*s,x,y);c.fill();c.stroke();c.beginPath();c.moveTo(x,y);c.lineTo(x+k*4*s,y+7*s);c.lineTo(x+k*1.5*s,y+7.5*s);c.closePath();c.fill();c.stroke();}c.fillStyle='#ffd84a';heartP(c,x,y+.3*s,2.4*s);c.fill();c.stroke();}

// ================= characters =================
const HAIR='#2b1d22',SKIN='#ffe4d4',LN='#5b2c47';
// ふーたん (cure:true でキュアふーたん)
function drawFutan(c,x,y,o){
  const t=o.t||0,cure=o.cure!==false,pose=o.pose||'run',mv=o.moving;
  c.save();c.translate(x,y);c.scale(o.s||1,o.s||1);
  if(!o.noShadow){c.fillStyle='rgba(40,0,40,.18)';ell(c,0,0,14,4.5);}
  const bob=pose==='win'?Math.abs(Math.sin(t*6))*3:mv?Math.abs(Math.sin(t*13))*2.2:Math.sin(t*3)*.8;
  c.translate(0,-bob-(o.lift||0));if(o.dir<0)c.scale(-1,1);if(o.spin!=null)c.scale(Math.cos(o.spin),1);
  c.lineJoin='round';c.lineCap='round';c.strokeStyle=LN;c.lineWidth=1.5;
  const HY=-41,sw=mv?Math.sin(t*13):0;
  if(cure){for(const k of[-1,1]){const w=Math.sin(t*6+k)*3;c.fillStyle=k<0?'#ff5fa8':'#ff8cc6';c.beginPath();c.moveTo(k*3,-20);c.bezierCurveTo(k*10,-16,k*14+w,-10,k*18+w,-2);c.lineTo(k*12+w,-3);c.bezierCurveTo(k*9,-9,k*6,-14,k*1,-18);c.closePath();c.fill();c.stroke();}}
  // うしろ髪（ボブ）
  c.fillStyle=HAIR;c.beginPath();c.moveTo(-16.5,HY);c.bezierCurveTo(-18,HY-23,18,HY-23,16.5,HY);c.quadraticCurveTo(18.5,HY+11,15.5,HY+16);c.quadraticCurveTo(0,HY+19,-15.5,HY+16);c.quadraticCurveTo(-18.5,HY+11,-16.5,HY);c.closePath();c.fill();c.stroke();
  // あし
  for(const k of[-1,1]){const lf=Math.max(0,k*sw)*3,lx=k*4-2.5;c.fillStyle=SKIN;rr(c,lx,-11-lf,5,8,2);c.fill();c.stroke();
    if(cure){c.fillStyle='#fff';rr(c,lx-1,-6.5-lf,7,7,2.5);c.fill();c.stroke();c.fillStyle='#ff6fae';c.fillRect(lx-.6,-6-lf,6.2,1.8);}
    else{c.fillStyle='#ff9ac4';rr(c,lx-1,-4-lf,7,4.5,2);c.fill();c.stroke();}}
  // スカート
  if(cure){c.fillStyle='#fff';for(let i=0;i<7;i++)circ(c,-13.5+i*4.5,-8.4,2.9);
    const g=c.createLinearGradient(0,-23,0,-8);g.addColorStop(0,'#ffb0d8');g.addColorStop(1,'#ff5fa8');c.fillStyle=g;
    c.beginPath();c.moveTo(-7,-23);c.lineTo(7,-23);c.quadraticCurveTo(12,-16,15,-10);for(let i=0;i<5;i++){const x0=15-i*6;c.quadraticCurveTo(x0-3,-6.8,x0-6,-10);}c.quadraticCurveTo(-12,-16,-7,-23);c.closePath();c.fill();c.stroke();
    c.fillStyle='rgba(255,255,255,.85)';heartP(c,-7,-14,1.7);c.fill();heartP(c,7,-14,1.7);c.fill();heartP(c,0,-12,1.7);c.fill();}
  else{c.fillStyle='#7ea6d8';c.beginPath();c.moveTo(-7,-19);c.lineTo(7,-19);c.lineTo(10,-9);c.lineTo(-10,-9);c.closePath();c.fill();c.stroke();}
  // からだ
  if(cure){c.fillStyle='#fff';rr(c,-7.5,-29.5,15,9.5,4);c.fill();c.stroke();c.fillStyle='#ff8cc6';c.fillRect(-7,-22,14,2.2);}
  else{c.fillStyle='#fff';rr(c,-8.5,-29.5,17,12.5,4);c.fill();c.stroke();const cols=['#5ac8f0','#ff7ab0','#ffd84a','#3fae5a','#e84a4a','#3a5ac8'];for(let i=0;i<6;i++){c.fillStyle=cols[i];circ(c,-5+(i%3)*5,-26+(i/3|0)*4.5,1.7);}}
  const arm=(k,hx,hy)=>{const sx=k*7,sy=-27;c.strokeStyle=LN;c.lineWidth=5;c.beginPath();c.moveTo(sx,sy);c.lineTo(hx,hy);c.stroke();c.strokeStyle=SKIN;c.lineWidth=3;c.stroke();c.lineWidth=1.5;c.strokeStyle=LN;c.fillStyle=cure?'#fff':SKIN;circ(c,hx,hy,2.7);c.stroke();
    c.fillStyle=cure?'#ff8cc6':'#fff';circ(c,sx,sy+.5,cure?4.2:3.6);c.stroke();};
  const arms=()=>{if(pose==='win'){arm(-1,-21,HY-12+Math.sin(t*8)*1.5);arm(1,21,HY-12-Math.sin(t*8)*1.5);}
    else if(pose==='cast'){arm(-1,-10,-18);arm(1,17,-30);}
    else{arm(-1,-10,-17+sw*2.5);arm(1,10,-17-sw*2.5);}};
  arms();
  if(cure)bow(c,0,-26.5,'#ff4f9a',.9);
  // あたま
  c.fillStyle=SKIN;c.beginPath();c.ellipse(0,HY+2,14.5,13.5,0,0,TAU);c.fill();c.stroke();
  const blink=((t+.7)%3.6)<.13,lk=(o.look||0)*1.2;
  for(const k of[-1,1]){const ex=k*5.6+lk,ey=HY+5;
    if(blink||o.happy){c.lineWidth=1.9;c.beginPath();c.arc(ex,ey+1.5,3,Math.PI*1.1,Math.PI*1.9);c.stroke();c.lineWidth=1.5;}
    else if(o.ouch){c.lineWidth=1.8;c.beginPath();c.moveTo(ex-2.5*k,ey-2);c.lineTo(ex+2*k,ey);c.lineTo(ex-2.5*k,ey+2);c.stroke();c.lineWidth=1.5;}
    else{c.fillStyle='#3a1f2e';ell(c,ex,ey,3.2,4.1);const g=c.createLinearGradient(0,ey-1,0,ey+4);g.addColorStop(0,'#3a1f2e');g.addColorStop(1,cure?'#ee5aa6':'#8a5a3a');c.fillStyle=g;ell(c,ex,ey+1.1,2.4,2.8);
      c.fillStyle='#fff';ell(c,ex-1,ey-1.5,1.3,1.6);circ(c,ex+1.2,ey+2,.7);
      c.lineWidth=2;c.beginPath();c.ellipse(ex,ey,3.4,4.3,0,Math.PI*1.15,Math.PI*1.85);c.stroke();c.beginPath();c.moveTo(ex+k*3,ey-2.4);c.lineTo(ex+k*4.6,ey-3.6);c.stroke();c.lineWidth=1.5;}}
  c.fillStyle='rgba(255,110,150,.35)';ell(c,-9.2,HY+10,3,1.8);ell(c,9.2,HY+10,3,1.8);
  if(o.ouch){c.fillStyle='#e0506a';ell(c,0,HY+11.5,1.8,2.2);}
  else{c.fillStyle='#e0506a';c.beginPath();c.moveTo(-3,HY+10);c.quadraticCurveTo(0,HY+14.5,3,HY+10);c.closePath();c.fill();c.stroke();c.fillStyle='#fff';c.fillRect(-2,HY+10.2,4,.9);}
  // まえがみ
  c.fillStyle=HAIR;c.beginPath();c.moveTo(-15.5,HY+11);c.quadraticCurveTo(-17.5,HY-6,-10,HY-11);c.quadraticCurveTo(0,HY-15,10,HY-11);c.quadraticCurveTo(17.5,HY-6,15.5,HY+11);c.lineTo(13,HY+4);c.lineTo(11.5,HY+.5);
  [9,6,3,0,-3,-6,-9].forEach((bx,i)=>c.lineTo(bx,HY+(i%2?-.8:1)));c.lineTo(-11.5,HY+.5);c.lineTo(-13,HY+4);c.closePath();c.fill();c.stroke();
  // ぼうし

const sideOf=x=>x<W*.42?-1:x>W*.58?1:0;
const tl=$('touch');
tl.addEventListener('pointerdown',e=>{e.preventDefault();audio();PTR.set(e.pointerId,sideOf(e.clientX));try{tl.setPointerCapture(e.pointerId);}catch(_){}updSteer();});
tl.addEventListener('pointermove',e=>{if(PTR.has(e.pointerId)){PTR.set(e.pointerId,sideOf(e.clientX));updSteer();}});
for(const ev of['pointerup','pointercancel','lostpointercapture'])tl.addEventListener(ev,e=>{PTR.delete(e.pointerId);updSteer();});
$('bItem').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();audio();useItem();});
addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key;if(k==='ArrowLeft'||k==='a'||k==='A')INPUT.kl=1;else if(k==='ArrowRight'||k==='d'||k==='D')INPUT.kr=1;else if(k===' '||k==='ArrowUp'||k==='Enter'){useItem();e.preventDefault();}else if(k==='Escape'||k==='p')pause();updSteer();});
addEventListener('keyup',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a'||k==='A')INPUT.kl=0;else if(k==='ArrowRight'||k==='d'||k==='D')INPUT.kr=0;updSteer();});
addEventListener('blur',()=>{PTR.clear();INPUT.kl=INPUT.kr=0;updSteer();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
addEventListener('contextmenu',e=>e.preventDefault());

// ================= update =================
function update(dt){CLK+=dt;BAN.t=Math.max(0,BAN.t-dt);SAY.t=Math.max(0,SAY.t-dt);RKspin=Math.max(0,RKspin-dt);
  if(state==='pause')return;
  if(state==='title'||state==='select'){for(const k of K){k.steerV=0;}syncKarts(dt);updObjects(dt);updParts(dt);
    const a=CLK*.25,P=PL;cam.position.set(P.x+Math.sin(a)*13,5,P.z+Math.cos(a)*13);cam.lookAt(P.x,1.4,P.z);return;}
  if(state==='intro'){RACE.t+=dt;const k=Math.min(1,RACE.t/2.6),e=k*k*(3-2*k),P=PL,a=P.h+.35+(Math.PI-.35)*e,r=lerp(5.5,8.4,e);
    cam.position.set(P.x+Math.sin(a)*r,lerp(2.3,3.7,e),P.z+Math.cos(a)*r);cam.lookAt(P.x,lerp(1.6,1.4,e),P.z);
    if(RACE.t>=2.6){state='count';RACE.ct=3.2;camH=P.h;}syncKarts(dt);updObjects(dt);updParts(dt);return;}
  if(state==='count'){RACE.ct-=dt;const n=Math.ceil(RACE.ct-.2);if(n<RACE.lastCt&&n>0){RACE.lastCt=n;SFX.beep();}
    if(RACE.ct<=.2){state='race';SFX.go();BGM.on=true;BGM.mode=0;BGM.step=0;say('いくよー！',1.2,false);}}
  for(const k of K)updKart(k,dt);interact(dt);places();updObjects(dt);updParts(dt);syncKarts(dt);
  if(PL.star<=0&&BGM.mode===1)BGM.mode=0;
  if(PL.star>0&&Math.random()<.5)spark(PL.x,1+Math.random(),PL.z,'#ffffff',1,3,1);
  if(PL.rocket>0)spark(PL.x-Math.sin(PL.h)*1.8,.8,PL.z-Math.cos(PL.h)*1.8,'#7ad8ff',2,2,1);
  if(PL.boost>0&&Math.random()<.6)spark(PL.x-Math.sin(PL.h)*1.8,.7,PL.z-Math.cos(PL.h)*1.8,'#ff9a40',1,2,1);
  if(state==='finish'||state==='result'){RACE.ft+=dt;if(state==='finish'&&RACE.ft>3.2)showResult();}
  // camera
  const P=PL;
  if(state==='finish'||state==='result'){const a=P.h+Math.PI*.85+RACE.ft*.3,r=8;cam.position.x=lerp(cam.position.x,P.x+Math.sin(a)*r,Math.min(1,dt*3));cam.position.z=lerp(cam.position.z,P.z+Math.cos(a)*r,Math.min(1,dt*3));cam.position.y=lerp(cam.position.y,3,dt*3);cam.lookAt(P.x,1.4,P.z);}
  else{camH+=angDiff(P.h,camH)*(1-Math.exp(-dt*5));const back=8.4,tx=P.x-Math.sin(camH)*back,tz=P.z-Math.cos(camH)*back,f=1-Math.exp(-dt*12);
    cam.position.x+=(tx-cam.position.x)*f;cam.position.z+=(tz-cam.position.z)*f;cam.position.y+=(3.7+P.body.position.y*.5-cam.position.y)*f;
    cam.lookAt(P.x+Math.sin(camH)*6,1.5,P.z+Math.cos(camH)*6);
    const fv=(W/H<1?80:66)+(P.boost>0||P.rocket>0?9:P.star>0?5:0);if(Math.abs(cam.fov-fv)>.1){cam.fov+=(fv-cam.fov)*Math.min(1,dt*4);cam.updateProjectionMatrix();}}}

// ================= HUD =================
const PORT={};
function portrait(id){if(PORT[id])return PORT[id];const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d');
  x.fillStyle=id==='futan'?'#ffe0f0':id==='ricky'?'#e0f4ff':'#efe0ff';x.beginPath();x.arc(48,48,46,0,TAU);x.fill();x.save();x.beginPath();x.arc(48,48,44,0,TAU);x.clip();
  if(id==='futan'){x.translate(48,56);x.scale(2.1,2.1);drawFutan(x,0,39,{t:0,s:1,noShadow:1,happy:false});}
  else if(id==='ricky'){x.translate(48,54);x.scale(2.2,2.2);drawRicky(x,0,42,{t:0,s:1,noShadow:1});}
  else if(id==='doku'){x.translate(48,62);x.scale(.72,.72);drawVillain(x,0,89,{v:STAGES[0].boss,face:1},0);}
  else{const rv=RIVALS.find(r=>r.id===id);x.translate(48,56);minionShape(x,rv.th,rv.type,26,false);}
  x.restore();x.lineWidth=4;x.strokeStyle='#fff';x.beginPath();x.arc(48,48,45,0,TAU);x.stroke();return PORT[id]=c;}
function speech(c,x,y,s,size){c.font=`900 ${size}px ${FONT}`;const w=c.measureText(s).width+size*1.2,h=size*1.7;c.fillStyle='#fff';c.strokeStyle='#39a0e0';c.lineWidth=3;rr(c,x-w/2,y-h,w,h,h/2);c.fill();c.stroke();
  c.beginPath();c.moveTo(x-6,y-1);c.lineTo(x,y+9);c.lineTo(x+6,y-1);c.closePath();c.fill();c.fillStyle='#2a7ac0';c.textAlign='center';c.textBaseline='middle';c.fillText(s,x,y-h/2+1);}
const _pv=new THREE.Vector3();
function drawHUD(){const c=hc;c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,W,H);
  if(state==='title'){const s=clamp(Math.min(W,H)/210,1.3,3.6),cy=H*.63;
    drawFutan(c,W/2-18*s,cy,{t:CLK,s,pose:'win',happy:(CLK%4)>3});drawRicky(c,W/2+34*s,cy-6*s,{t:CLK,s:s*.8});return;}
  if(!RACE||state==='select')return;
  const P=PL,top=Math.max(10,8),z=Z;
  // speed lines
  if((P.boost>0||P.rocket>0||P.star>0)&&state==='race'){c.save();c.strokeStyle=P.star>0?`hsla(${CLK*400%360},100%,80%,.5)`:'rgba(255,255,255,.55)';c.lineWidth=3;
    for(let i=0;i<22;i++){const a=hash(i,Math.floor(CLK*12))*TAU,r1=Math.max(W,H)*(.42+hash(i,3)*.1),r2=r1+60+hash(i,7)*80;c.beginPath();c.moveTo(W/2+Math.cos(a)*r1,H/2+Math.sin(a)*r1);c.lineTo(W/2+Math.cos(a)*r2,H/2+Math.sin(a)*r2);c.stroke();}c.restore();}
  if(state==='race'||state==='count'||state==='finish'){
    // rank
    const rk=P.place||6,rc=rk===1?'#ffb000':rk===2?'#7f8fb0':rk===3?'#d0703a':'#ff5fa8';
    otext(c,rk+'',16+30*z,top+42*z,64*z,rk===1?'#fff36a':'#fff',rc,'center','"Mochiy Pop One",'+FONT);otext(c,'い',16+66*z,top+56*z,28*z,'#fff',rc,'left','"Mochiy Pop One",'+FONT);
    otext(c,'ラップ '+Math.min(LAPS,RACE.lap)+'/'+LAPS,16,top+96*z,22*z,'#fff','#8f74f0','left');
    c.fillStyle='#ffd23a';c.strokeStyle='#fff';c.lineWidth=2;heartP(c,28,top+128*z,9*z);c.fill();c.stroke();otext(c,'×'+P.coins,40,top+128*z,20*z,'#fff','#e0a020','left');
    // rank list
    const pl=K.slice().sort((a,b)=>a.place-b.place),sz=clamp(H/17,24,44);let y=top+150*z;
    if(H>420)for(const k of pl){c.globalAlpha=k.isP?1:.85;c.drawImage(portrait(k.id),14,y,sz,sz);if(k.isP){c.strokeStyle='#ff4f9a';c.lineWidth=3;c.beginPath();c.arc(14+sz/2,y+sz/2,sz/2+1,0,TAU);c.stroke();}
      otext(c,k.place+'',14+sz+10,y+sz/2,sz*.45,'#fff',k.isP?'#ff4f9a':'#8a6a9a','center');c.globalAlpha=1;y+=sz+4;}
    // item slot
    const ix=W/2,iy=top+46*z,ir=40*z;c.fillStyle='rgba(90,40,110,.35)';rr(c,ix-ir,iy-ir,ir*2,ir*2,ir*.45);c.fill();c.lineWidth=5*z;c.strokeStyle=P.item&&P.roll<=0?`hsl(${CLK*300%360},90%,65%)`:'rgba(255,255,255,.9)';c.stroke();
    if(P.roll<=0&&!P.item)otext(c,'アイテム',ix,iy,13*z,'#fff','rgba(90,40,110,.6)');
    let ic=null;if(P.roll>0)ic=ITEMS[IKEYS[Math.floor(CLK*14)%IKEYS.length]].ic;else if(P.item)ic=ITEMS[P.item].ic;
    if(ic){c.font=`${44*z}px sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(ic,ix,iy+2*z);if(P.itemN>1&&P.roll<=0)otext(c,'×'+P.itemN,ix+ir*.7,iy+ir*.7,18*z,'#fff','#ff4f9a');}
    // minimap
    const ms=120*z,mx=H<560?W-ms-74:W-ms-14,my=H<560?top+6:top+62,bb=TR.bb,rg=Math.max(bb.mxx-bb.mnx,bb.mxz-bb.mnz),mp=(x0,z0)=>[mx+ms/2+(bb.cx-x0)/rg*ms,my+ms/2-(z0-bb.cz)/rg*ms];
    c.fillStyle='rgba(255,255,255,.35)';rr(c,mx-8,my-8,ms+16,ms+16,14);c.fill();c.lineJoin='round';c.strokeStyle='rgba(255,255,255,.9)';c.lineWidth=7*z;c.beginPath();for(let i=0;i<=TR.N;i+=4){const p=TR.P[i%TR.N],q=mp(p.x,p.z);i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]);}c.closePath();c.stroke();
    for(const k of K){if(k.isP)continue;const q=mp(k.x,k.z);c.fillStyle=k.rv.body;c.strokeStyle='#fff';c.lineWidth=2;c.beginPath();c.arc(q[0],q[1],5*z,0,TAU);c.fill();c.stroke();}
    {const q=mp(P.x,P.z);c.fillStyle='#ff4f9a';c.strokeStyle='#fff';c.lineWidth=2;heartP(c,q[0],q[1],8*z);c.fill();c.stroke();}
    if(P.wrongT>1&&state==='race')otext(c,'ぎゃくむき だよ！ ↩',W/2,H*.4,34*z,'#fff','#e04a4a');}
  // ricky bubble
  if(SAY.t>0&&RK){_pv.copy(RK.position);_pv.y+=1.3;_pv.project(cam);if(_pv.z<1)speech(c,(_pv.x+1)/2*W,(1-_pv.y)/2*H,SAY.text,20*z);}
  // countdown
  if(state==='count'){const n=Math.ceil(RACE.ct-.2),f=RACE.ct-.2-Math.floor(RACE.ct-.2);if(n>0){const sc=1+f*.5;otext(c,n+'',W/2,H*.42,110*z*sc,'#fff','#ff4f9a','center','"Mochiy Pop One",'+FONT);}}
  // banner
  if(BAN.t>0){const k=BAN.t>BAN.dur-.25?(BAN.dur-BAN.t)/.25:BAN.t<.3?BAN.t/.3:1;c.globalAlpha=clamp(k,0,1);const y=H*.3;
    otext(c,BAN.text,W/2,y,Math.min(52*z,W/Math.max(6,BAN.text.length)*1.1),'#fff',BAN.col,'center','"Mochiy Pop One",'+FONT);if(BAN.sub)otext(c,BAN.sub,W/2,y+46*z,24*z,'#fff',BAN.col);c.globalAlpha=1;}}
function drawResCv(){const cv=$('resCv'),c=cv.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,cv.width,cv.height);
  const g=c.createRadialGradient(220,200,20,220,200,220);g.addColorStop(0,'#fff6c0');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(0,0,440,340);
  for(let i=0;i<10;i++){const a=i/10*TAU+CLK*.6;c.fillStyle=['#ffd84a','#ff8cc6','#7ad8ff'][i%3];starP(c,220+Math.cos(a)*170,180+Math.sin(a)*120,10,4.5);c.fill();}
  drawFutan(c,200,300,{t:CLK,s:3.6,pose:'win',happy:true,noShadow:1});drawRicky(c,330,250,{t:CLK,s:2.6,happy:true,noShadow:1});}

// ================= flow =================
function hideAll(){for(const id of['title','select','howto','pause','result'])$(id).classList.remove('show');}
function showTitle(){hideAll();$('title').classList.add('show');state='title';BGM.on=false;$('ctl').style.display='none';$('touch').style.display='none';$('bPause').style.display='none';
  buildCourse(0);setupKarts();RACE=null;updToggles();}
function updToggles(){$('easyBtn').textContent=SAVE.easy?'🍼 かんたん：ON':'🔥 かんたん：OFF';$('muteBtn').textContent=SAVE.mute?'🔇 おと：OFF':'🔊 おと：ON';}
function unlocked(i){return i===0||SAVE.best[i-1]>0;}
function showSelect(){hideAll();state='select';const L=$('courseList');L.innerHTML='';
  COURSES.forEach((C,i)=>{const b=document.createElement('button');b.className='cs'+(unlocked(i)?'':' lock');const md=['','🥇','🥈','🥉'][SAVE.best[i]]||(SAVE.best[i]?'🎀':'');
    b.innerHTML=`<span class="em">${unlocked(i)?C.emoji:'🔒'}</span><span><b>${C.name}</b><small>${unlocked(i)?C.sub:'まえの コースを ゴールしてね'}</small></span><span class="md">${md}</span>`;
    b.onclick=()=>{audio();SFX.pop();if(!SAVE.how){SAVE.how=true;save();hideAll();$('howto').classList.add('show');$('howBtn').onclick=()=>startRace(i);}else startRace(i);};L.appendChild(b);});
  $('select').classList.add('show');}
function pause(){if(state!=='race'&&state!=='count'&&state!=='intro')return;prevState=state;state='pause';BGM.on=false;PTR.clear();updSteer();$('pause').classList.add('show');}
function resume(){$('pause').classList.remove('show');state=prevState;if(state==='race')BGM.on=true;}
function showResult(){state='result';const pl=places(),P=PL,f=P.fin;
  $('resRank').textContent=(['','🥇','🥈','🥉'][f]||'🎀')+' '+f+'い！';
  $('resMsg').innerHTML=f===1?'やったね！ いちばん だよ！<br>キュアふーたんと リッキーの だいしょうり！':f<=3?'すごい！ メダル ゲット！<br>つぎは 1ばんを めざそう！':'ゴール できたね！ えらい！<br>アイテムを つかって まえを めざそう！';
  const L=$('resList');L.innerHTML='';for(const k of pl){const d=document.createElement('div');if(k.isP)d.className='me';const im=document.createElement('img');im.src=portrait(k.id).toDataURL();d.innerHTML=`<span class="n">${k.place}い</span>`;d.appendChild(im);d.appendChild(document.createTextNode(k.name));L.appendChild(d);}
  $('nextBtn').style.display=CI<COURSES.length-1?'':'none';$('result').classList.add('show');}
$('playBtn').onclick=()=>{audio();SFX.pop();showSelect();};
$('backBtn').onclick=()=>{SFX.pop();showTitle();};
$('easyBtn').onclick=()=>{SAVE.easy=!SAVE.easy;save();updToggles();SFX.pop();};
$('muteBtn').onclick=()=>{audio();SAVE.mute=!SAVE.mute;save();updToggles();SFX.pop();};
$('bPause').onclick=()=>{pause();};
$('resumeBtn').onclick=()=>{audio();resume();};
$('retryBtn2').onclick=()=>{startRace(CI);};
$('quitBtn').onclick=()=>{showSelect();BGM.on=false;$('ctl').style.display='none';$('touch').style.display='none';$('bPause').style.display='none';};
$('againBtn').onclick=()=>{startRace(CI);};
$('nextBtn').onclick=()=>{startRace(Math.min(COURSES.length-1,CI+1));};
$('toSelBtn').onclick=()=>{showSelect();};

// ================= loop =================
buildCourse(0);setupKarts();updToggles();
if(Q.has('race'))startRace(clamp(+Q.get('race')||0,0,COURSES.length-1));
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
  for(let i=0;i<SPEED;i++)update(dt);R3.render(scene,cam);drawHUD();if(state==='result')drawResCv();bgmTick();}
requestAnimationFrame(frame);
window.__G={get state(){return state},get PL(){return PL},get K(){return K},get RACE(){return RACE}};
</script>
