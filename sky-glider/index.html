<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<title>SKY GLIDER</title>
<style>
:root{--ink:#f4f1ea;--sub:rgba(244,241,234,.66);--line:rgba(244,241,234,.28);--glass:rgba(12,14,20,.38);--warm:#ffcf8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0d12;color:var(--ink);font-family:"Helvetica Neue","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hide{display:none!important}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.42) 100%);z-index:1}
#glare{position:fixed;left:0;top:0;width:70vmax;height:70vmax;margin:-35vmax 0 0 -35vmax;pointer-events:none;z-index:1;opacity:0;mix-blend-mode:screen;background:radial-gradient(circle,rgba(255,236,200,.55) 0%,rgba(255,190,120,.22) 14%,rgba(255,150,80,.07) 34%,rgba(0,0,0,0) 62%)}
#fade{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8;transition:opacity .35s}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
#title{background:linear-gradient(90deg,rgba(5,6,10,.5) 0%,rgba(5,6,10,.18) 45%,rgba(5,6,10,0) 70%),linear-gradient(180deg,rgba(5,6,10,0) 35%,rgba(5,6,10,.55) 100%);align-items:flex-end;justify-content:flex-start}
.tbox{max-width:620px;width:100%;padding-bottom:2vh}
.kicker{font-size:12px;letter-spacing:.42em;color:var(--warm);font-weight:500;margin-bottom:6px}
h1{margin:0;font-weight:200;font-size:clamp(38px,7.5vw,96px);letter-spacing:.16em;line-height:1;text-shadow:0 2px 30px rgba(0,0,0,.35)}
.sub{margin:12px 0 22px;font-size:clamp(14px,2.2vw,17px);font-weight:300;letter-spacing:.12em;color:var(--sub)}
.opts{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gl{width:84px;font-size:11px;letter-spacing:.2em;color:var(--sub)}
.grp button,.pill{appearance:none;font:inherit;font-size:14px;letter-spacing:.1em;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .15s,border-color .15s,color .15s}
.grp button:hover,.pill:hover{border-color:rgba(244,241,234,.6)}
.grp button.on{background:var(--ink);color:#15161b;border-color:var(--ink)}
#modeDesc{margin:6px 0 20px;font-size:13px;color:var(--sub);letter-spacing:.06em;min-height:1.4em}
.primary{appearance:none;font:inherit;font-size:17px;letter-spacing:.32em;font-weight:500;color:#15161b;background:var(--ink);border:0;border-radius:999px;padding:15px 44px 15px 52px;cursor:pointer;box-shadow:0 10px 40px rgba(0,0,0,.35);transition:transform .12s}
.primary:hover{transform:translateY(-2px)}
.primary:active{transform:translateY(1px)}
.help{margin-top:22px;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--sub);letter-spacing:.06em}
.help b{font-weight:500;color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:0 6px;margin-right:4px;font-size:11px}
#best{margin-top:12px;font-size:12px;color:var(--warm);letter-spacing:.1em;min-height:1.3em}
#back{position:fixed;top:max(14px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));z-index:11;font-size:12px;letter-spacing:.15em;color:var(--sub);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#mute{position:fixed;top:max(14px,env(safe-area-inset-top));right:max(16px,env(safe-area-inset-right));z-index:12;font-size:12px;letter-spacing:.12em}

#loading{z-index:20;background:#0b0d12;flex-direction:column;gap:14px}
#loading .lt{font-weight:200;letter-spacing:.5em;font-size:22px}
#loading .lb{width:180px;height:1px;background:var(--line);overflow:hidden}
#loading .lb i{display:block;height:100%;width:40%;background:var(--ink);animation:ld 1.1s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

.card{background:rgba(10,12,18,.55);border:1px solid var(--line);border-radius:22px;padding:28px 30px;max-width:440px;width:100%;text-align:center;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.card h2{margin:0 0 6px;font-weight:200;letter-spacing:.3em;font-size:30px}
.card .row{display:flex;justify-content:space-between;border-bottom:1px solid rgba(244,241,234,.12);padding:10px 2px;font-size:15px;letter-spacing:.08em}
.card .row span:first-child{color:var(--sub)}
.card .stars{font-size:34px;letter-spacing:.2em;color:var(--warm);margin:6px 0 10px}
.card .stars .off{color:rgba(244,241,234,.18)}
.card .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.card .newrec{color:var(--warm);font-size:13px;letter-spacing:.2em;height:1.4em;margin-top:8px}
#pause,#result{background:rgba(5,6,10,.35)}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;text-shadow:0 1px 8px rgba(0,0,0,.45)}
.lab{font-size:10px;letter-spacing:.3em;color:var(--sub)}
.val{font-weight:200;font-size:30px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.val small{font-size:14px;color:var(--sub);margin-left:3px}
#tl{position:absolute;top:max(16px,env(safe-area-inset-top));left:max(20px,env(safe-area-inset-left))}
#tc{position:absolute;top:max(16px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center;width:min(46vw,420px)}
#prog{position:relative;height:2px;background:rgba(244,241,234,.22);border-radius:2px;margin:8px 0 8px}
#prog i{position:absolute;top:-2px;width:1px;height:6px;background:rgba(244,241,234,.45)}
#prog i.ok{background:var(--warm);height:8px;top:-3px;width:2px}
#prog i.ng{background:rgba(255,120,110,.6)}
#progDot{position:absolute;top:-4px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--ink);box-shadow:0 0 10px rgba(255,255,255,.6)}
#hTime{font-weight:200;font-size:22px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
#tr{position:absolute;top:max(16px,env(safe-area-inset-top));right:max(64px,calc(env(safe-area-inset-right) + 64px));text-align:right}
#tr .r{display:flex;align-items:baseline;justify-content:flex-end;gap:8px}
#tr .val{font-size:24px;min-width:3.2ch}
#vario{font-size:12px;letter-spacing:.1em;color:var(--sub);height:1.3em}
#vario.up{color:#9fe3a8}
#boost{position:absolute;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(52vw,320px);text-align:center}
#boost .bar{height:4px;border-radius:4px;background:rgba(244,241,234,.18);overflow:hidden;margin-top:6px}
#boost .bar i{display:block;height:100%;width:50%;background:linear-gradient(90deg,#8fd3ff,#e9f6ff);border-radius:4px;transition:width .12s}
#boost.on .bar i{background:linear-gradient(90deg,#ffd28f,#fff3dd)}
#msg{position:absolute;left:0;right:0;top:30%;text-align:center;font-weight:300;font-size:clamp(20px,4vw,34px);letter-spacing:.32em;opacity:0;transition:opacity .25s,transform .25s;transform:translateY(8px)}
#msg.show{opacity:1;transform:none}
#msg small{display:block;font-size:13px;letter-spacing:.3em;color:var(--warm);margin-top:6px}
#warn{position:absolute;left:0;right:0;top:62%;text-align:center;font-size:14px;letter-spacing:.4em;color:#ffb3a3;opacity:0;transition:opacity .2s}
#warn.show{opacity:1}
#count{position:absolute;left:0;right:0;top:38%;text-align:center;font-weight:100;font-size:clamp(70px,15vw,140px);letter-spacing:.1em}
#arrow{position:absolute;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;opacity:.9}
#arrow:before{content:"";position:absolute;left:8px;top:6px;border-left:22px solid var(--warm);border-top:11px solid transparent;border-bottom:11px solid transparent;filter:drop-shadow(0 0 6px rgba(255,190,110,.8))}
#ringTag{position:absolute;left:0;top:0;transform:translate(-50%,0);font-size:12px;letter-spacing:.15em;color:var(--warm);white-space:nowrap}
#bPause{position:fixed;z-index:6;top:max(14px,env(safe-area-inset-top));right:max(16px,env(safe-area-inset-right));width:38px;height:38px;border-radius:50%;padding:0;font-size:12px;letter-spacing:0;pointer-events:auto}
#stick{position:fixed;z-index:6;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;border:1px solid rgba(244,241,234,.45);background:rgba(255,255,255,.06);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(244,241,234,.55)}
#bBoost{position:fixed;z-index:6;right:max(24px,env(safe-area-inset-right));bottom:max(30px,env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;font:inherit;font-size:12px;letter-spacing:.2em;color:var(--ink);background:rgba(12,14,20,.35);border:1px solid rgba(244,241,234,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);touch-action:none}
#bBoost.on{background:rgba(255,220,170,.35)}
#rot{position:fixed;left:50%;bottom:max(140px,calc(env(safe-area-inset-bottom) + 140px));transform:translateX(-50%);font-size:11px;letter-spacing:.15em;color:var(--sub);z-index:6;pointer-events:none;white-space:nowrap}
@media (max-width:640px){
  .val{font-size:24px}#tr .val{font-size:19px}#hTime{font-size:17px}
  .gl{width:100%}
  .help{display:none}
  #tc{top:calc(max(16px,env(safe-area-inset-top)) + 62px);width:78vw}
  #tr{right:max(62px,calc(env(safe-area-inset-right) + 62px))}
}
@media (orientation:landscape){#rot{display:none}}
@media (max-height:620px){.help{display:none}.sub{margin:6px 0 12px}.opts{gap:6px}.grp button{padding:6px 14px;font-size:13px}#modeDesc{margin:4px 0 12px}.primary{padding:12px 36px 12px 44px}h1{font-size:clamp(34px,6.5vw,72px)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="glare"></div>
<div id="fade"></div>

<div id="hud" class="hide">
  <div id="tl"><div class="lab">RINGS</div><div class="val" id="hRing">0<small>/30</small></div></div>
  <div id="tc"><div class="lab">COURSE</div><div id="prog"><div id="progDot"></div></div><div id="hTime">0:00.0</div></div>
  <div id="tr">
    <div class="r"><span class="lab">たかさ</span><span class="val" id="hAlt">0</span><small class="lab">m</small></div>
    <div class="r"><span class="lab">スピード</span><span class="val" id="hSpd">0</span><small class="lab">km/h</small></div>
    <div id="vario"></div>
  </div>
  <div id="boost"><div class="lab">WIND BOOST</div><div class="bar"><i id="boostFill"></i></div></div>
  <div id="msg"></div>
  <div id="warn">PULL UP ・ じめんが ちかい</div>
  <div id="count"></div>
  <div id="arrow" class="hide"></div>
  <div id="ringTag" class="hide"></div>
  <div id="rot">よこむきが おすすめ</div>
</div>
<button id="bPause" class="pill hide" aria-label="ポーズ">II</button>
<div id="stick" class="hide"><div id="knob"></div></div>
<button id="bBoost" class="hide">BOOST</button>

<a id="back" href="../">← ゲームいちらん</a>
<button id="mute" class="pill">♪ ON</button>

<div id="title" class="ov hide">
  <div class="tbox">
    <div class="kicker">A GLIDING ADVENTURE</div>
    <h1>SKY GLIDER</h1>
    <p class="sub">かぜに のって、けいこくを すべるように とぼう</p>
    <div class="opts">
      <div class="grp" id="gTod"><span class="gl">じかん</span><button data-tod="0">あさ</button><button data-tod="1">ひる</button><button data-tod="2">ゆうがた</button></div>
      <div class="grp" id="gMode"><span class="gl">モード</span><button data-mode="easy">かんたん</button><button data-mode="hard">チャレンジ</button></div>
      <div class="grp" id="gInv"><span class="gl">うえ・した</span><button data-inv="0">↑で のぼる</button><button data-inv="1">↑で くだる（ひこうき）</button></div>
    </div>
    <p id="modeDesc"></p>
    <button id="bStart" class="primary">はじめる</button>
    <div class="help">
      <span><b>← →</b>まがる</span><span><b>↑ ↓</b>のぼる・くだる</span><span><b>SPACE</b>ブースト</span><span><b>ESC</b>ポーズ</span><span>スマホ：がめんを ドラッグ ＋ BOOST ボタン</span>
    </div>
    <div id="best"></div>
  </div>
</div>

<div id="pause" class="ov hide">
  <div class="card">
    <h2>PAUSE</h2>
    <div class="btns">
      <button class="primary" id="bResume">つづける</button>
    </div>
    <div class="btns">
      <button class="pill" id="bRetry1">さいしょから</button>
      <button class="pill" id="bTitle1">タイトルへ</button>
      <button class="pill" id="bMute2">♪ ON</button>
    </div>
  </div>
</div>

<div id="result" class="ov hide">
  <div class="card">
    <h2>GOAL</h2>
    <div class="stars" id="rStars"></div>
    <div class="row"><span>タイム</span><span id="rTime"></span></div>
    <div class="row"><span>くぐった リング</span><span id="rRings"></span></div>
    <div class="row" id="rCrashRow"><span>クラッシュ</span><span id="rCrash"></span></div>
    <div class="row"><span>ベストタイム</span><span id="rBest"></span></div>
    <div class="newrec" id="rNew"></div>
    <div class="btns">
      <button class="primary" id="bRetry2">もういちど</button>
      <button class="pill" id="bTitle2">タイトルへ</button>
    </div>
  </div>
</div>

<div id="loading" class="ov"><div class="lt">SKY GLIDER</div><div class="lb"><i></i></div><div class="lab" id="loadMsg">LOADING</div></div>

<script src="./three.min.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const V3 = THREE.Vector3;
const DEG = Math.PI / 180;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
const LOW = isTouch || /Android|iPhone|iPad/i.test(navigator.userAgent);
const Q = LOW
  ? { pr: Math.min(devicePixelRatio, 1.5), shadow: 1024, lat0: 9, latG: 1.034, row: 15, trees: 5000, rocks: 350, motes: 90 }
  : { pr: Math.min(devicePixelRatio, 2), shadow: 2048, lat0: 6, latG: 1.025, row: 10, trees: 11000, rocks: 900, motes: 160 };

// ================================================================ noise
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rand = mulberry(20260930);
const perm = new Uint8Array(512);
{ const p = []; for (let i = 0; i < 256; i++) p[i] = i; for (let i = 255; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) perm[i] = p[i & 255]; }
const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
function grad(h, x, y) { switch (h & 7) { case 0: return x + y; case 1: return -x + y; case 2: return x - y; case 3: return -x - y; case 4: return x * 1.4; case 5: return -x * 1.4; case 6: return y * 1.4; default: return -y * 1.4; } }
function noise2(x, y) {
  let X = Math.floor(x), Y = Math.floor(y); x -= X; y -= Y; X &= 255; Y &= 255;
  const u = fade(x), v = fade(y);
  const aa = perm[X + perm[Y]], ab = perm[X + perm[Y + 1]], ba = perm[X + 1 + perm[Y]], bb = perm[X + 1 + perm[Y + 1]];
  return lerp(lerp(grad(aa, x, y), grad(ba, x - 1, y), u), lerp(grad(ab, x, y - 1), grad(bb, x - 1, y - 1), u), v);
}
function pnoise(x, y, per) {
  const X = Math.floor(x), Y = Math.floor(y); const fx = x - X, fy = y - Y;
  const X0 = ((X % per) + per) % per, Y0 = ((Y % per) + per) % per, X1 = (X0 + 1) % per, Y1 = (Y0 + 1) % per;
  const h = (i, j) => perm[perm[i & 255] + (j & 255)];
  const u = fade(fx), v = fade(fy);
  return lerp(lerp(grad(h(X0, Y0), fx, fy), grad(h(X1, Y0), fx - 1, fy), u), lerp(grad(h(X0, Y1), fx, fy - 1), grad(h(X1, Y1), fx - 1, fy - 1), u), v);
}
function fbm(x, y, o) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * noise2(x * f + i * 31.7, y * f - i * 17.3); f *= 2.03; a *= 0.5; } return s; }
function ridged(x, y, o) {
  let s = 0, a = 0.5, f = 1, w = 1;
  for (let i = 0; i < o; i++) { let n = 1 - Math.abs(noise2(x * f + i * 13.1, y * f - i * 7.7)); n *= n; n *= w; w = clamp(n * 1.8, 0, 1); s += n * a; a *= 0.5; f *= 2.05; }
  return s;
}

// ================================================================ world shape
const L = 6000;            // course length (m)
const N_RINGS = 30;
function pathX(t) { return 380 * Math.sin(t * 0.00055 + 0.3) + 160 * Math.sin(t * 0.0013 + 1.1) + 60 * Math.sin(t * 0.0031); }
function pathDir(t) { const dx = (pathX(t + 5) - pathX(t - 5)) / 10; const l = Math.hypot(dx, 1); return new V3(dx / l, 0, -1 / l); }
function lakeK(t) { return smooth(L - 900, L - 100, t); }
function canyonK(t) { return smooth(0.35, 0.9, 0.5 + 0.5 * Math.sin(t * 0.0022 - 1.2)) * (1 - lakeK(t)); }
function floorH(t) {
  const k = clamp(t / (L - 500), -0.8, 1);
  return 20 + 280 * (1 - k) + 6 * Math.sin(t * 0.004) - 55 * smooth(L - 700, L + 100, t) + 320 * smooth(L + 1500, L + 2800, t);
}
function valleyW(t) { return lerp(150, 62, canyonK(t)) + 950 * lakeK(t) - 900 * smooth(L + 1500, L + 2800, t); }
function terrainH(x, z) {
  const t = -z, d = Math.abs(x - pathX(t));
  const F = floorH(t), c = canyonK(t), w = valleyW(t);
  const ww = lerp(650, 230, c);
  const r = ridged(x * 0.0011 + 3.1, z * 0.0011 - 1.7, 6);
  const m = fbm(x * 0.00042, z * 0.00042, 3);
  const mount = 170 + 950 * r + 260 * m;
  const e = smooth(w, w + ww, d);
  let prof = lerp(e, Math.pow(e, 0.6), c);
  if (c > 0.01) { const q = prof * 7 + fbm(x * 0.004, z * 0.004, 2) * 0.6, fq = Math.floor(q); prof = lerp(prof, Math.max(0, (fq + smooth(0.45, 1, q - fq)) / 7), c * 0.85); }
  let h = F + mount * prof + Math.min(750, Math.max(0, d - 1300) * 0.13);
  h += fbm(x * 0.006, z * 0.006, 4) * 16 * smooth(26, 80, d);
  h -= 8 * (1 - smooth(0, 24, d));
  return h;
}
function riverY(t) { return floorH(t) - 3.6; }
function groundAt(x, z) {
  let g = Math.max(terrainH(x, z), 0);
  const t = -z;
  if (Math.abs(x - pathX(t)) < 18) g = Math.max(g, riverY(t));
  return g;
}

// coarse heightmap for shadow baking
const HM = { x0: -5600, z0: -(L + 5200), d: 25, nx: 0, nz: 0, a: null };
function buildHM() {
  HM.nx = Math.round(11200 / HM.d) + 1; HM.nz = Math.round((L + 10400) / HM.d) + 1;
  HM.a = new Float32Array(HM.nx * HM.nz);
  for (let j = 0; j < HM.nz; j++) { const z = HM.z0 + j * HM.d; for (let i = 0; i < HM.nx; i++) HM.a[j * HM.nx + i] = terrainH(HM.x0 + i * HM.d, z); }
}
function hmAt(x, z) {

  camera.position.copy(camPos);
  shake = lerp(shake, clamp((P.speed - 50) / 45, 0, 1) * 0.12 + (P.boosting ? 0.08 : 0), 1 - Math.exp(-dt * 3));
  if (shake > 0.01) camera.position.add(new V3((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake, 0));
  camera.up.set(0, 1, 0); camera.lookAt(camLook);
  camRoll = lerp(camRoll, -P.bank * 0.42, 1 - Math.exp(-dt * 4));
  camera.rotateZ(camRoll);
  setFov(60 + clamp((P.speed - 30) * 0.32, -4, 18) + (P.boosting ? 4 : 0));
}
let curFov = 60;
function setFov(h) {
  curFov = lerp(curFov, h, 0.08);
  const a = camera.aspect;
  // treat value as vertical FOV in landscape; keep horizontal coverage in portrait
  let v = curFov;
  if (a < 1.2) { const hf = 2 * Math.atan(Math.tan(curFov * DEG / 2) * 1.2); v = clamp(2 * Math.atan(Math.tan(hf / 2) / a) / DEG, curFov, 100); }
  if (Math.abs(camera.fov - v) > 0.01) { camera.fov = v; camera.updateProjectionMatrix(); }
}

// ================================================================ effects update
function updateWorld(dt, time) {
  // shadow follows the player
  sunLight.target.position.copy(P.pos);
  sunLight.position.copy(P.pos).addScaledVector(SUN, 600);
  sunLight.target.updateMatrixWorld();
  sky.position.copy(camera.position);
  waterNrm.offset.set(time * 0.006, time * 0.011);
  // vegetation bins
  const ct = -camera.position.z;
  const fogFar = 4200 + (todIdx === 1 ? 1000 : 0);
  for (const b of vegBins) {
    const d = Math.abs(b.t - ct);
    const vis = d < fogFar; const sh = d < 520;
    for (const m of b.meshes) { m.visible = vis; m.castShadow = sh; }
  }
  // glider in mountain shadow
  if ((frame & 7) === 0) P.sunVis = sunVis(P.pos.x, P.pos.y - 3, P.pos.z);
  const gv = 0.42 + 0.58 * P.sunVis;
  for (const [m, c] of gMats) m.color.setHex(c).multiplyScalar(gv);
  // rings
  for (let i = 0; i < rings.length; i++) {
    const g = rings[i], m = g.mesh;
    if (g.state === 0) {
      const isNext = i === nextRing && (state === 'fly' || state === 'countdown' || state === 'crash');
      const pulse = isNext ? 2.4 + Math.sin(time * 6) * 0.8 : (i === nextRing + 1 ? 0.8 : 0.35);
      m.material.emissiveIntensity = pulse; m.material.emissive.setHex(isNext ? 0xffa040 : 0xff8a30);
      m.children[0].material.opacity = isNext ? 0.22 : 0.07;
      m.scale.setScalar(g.R);
    } else if (g.state === 1) {
      g.anim += dt; m.scale.setScalar(g.R * (1 + g.anim * 1.6)); m.material.emissive.setHex(0xfff0d0); m.material.emissiveIntensity = 3;
      m.children[0].material.opacity = Math.max(0, 0.3 - g.anim * 0.35); m.visible = g.anim < 0.8;
    } else {
      m.material.emissive.setHex(0x404858); m.material.emissiveIntensity = 0.3; m.children[0].material.opacity = 0.02;
    }
  }
  goal.mesh.material.emissiveIntensity = 1.6 + Math.sin(time * 3) * 0.5;
  goal.mesh.rotation.z = time * 0.1;
  // thermals
  for (const th of thermals) {
    const near = Math.abs(-th.z - ct) < 2500; th.pts.visible = near;
    for (const b of th.birds) b.grp.visible = near;
    if (!near) continue;
    const arr = th.pts.geometry.attributes.position.array, H = th.top - th.base;
    th.seed.forEach((s, i) => {
      s.h += dt * 0.035 * s.s; if (s.h > 1) s.h -= 1; s.a += dt * 0.4 * s.s;
      const rr = s.r * (0.6 + s.h * 0.7);
      arr[i * 3] = th.x + Math.cos(s.a) * rr; arr[i * 3 + 1] = th.base + 10 + s.h * H; arr[i * 3 + 2] = th.z + Math.sin(s.a) * rr;
    });
    th.pts.geometry.attributes.position.needsUpdate = true;
    for (const b of th.birds) {
      b.a += dt * b.sp; const x = th.x + Math.cos(b.a) * b.r, z = th.z + Math.sin(b.a) * b.r;
      b.grp.position.set(x, b.h + Math.sin(time * 0.5 + b.ph) * 4, z);
      b.grp.rotation.set(0, -b.a, 0.35);
      const flap = Math.sin(time * 9 + b.ph) * (Math.sin(time * 0.6 + b.ph) > 0.6 ? 0.6 : 0.05) + 0.1;
      b.l.rotation.z = flap; b.rr.rotation.z = -flap;
    }
  }
  // motes stay around the camera
  if (motes) {
    const a = motes.geometry.attributes.position.array, c = camera.position;
    for (let i = 0; i < a.length; i += 3) {
      for (let k = 0; k < 3; k++) { const cv = k === 0 ? c.x : k === 1 ? c.y : c.z; let d = a[i + k] - cv; if (d > 60) a[i + k] -= 120; else if (d < -60) a[i + k] += 120; }
    }
    motes.geometry.attributes.position.needsUpdate = true;
  }
  // trails
  if (trails.length) {
    const strength = (state === 'fly' || state === 'finish') ? clamp((Math.abs(P.bank) - 25 * DEG) / (25 * DEG), 0, 1) * 0.7 + clamp((P.speed - 48) / 30, 0, 0.6) + (P.boosting ? 0.4 : 0) : 0;
    const upW = new V3(0, 1, 0).applyQuaternion(glider.quaternion);
    trails[0].push(glider.localToWorld(tipL.clone()), upW, strength);
    trails[1].push(glider.localToWorld(tipR.clone()), upW, strength);
  }
  // sun glare overlay
  const sp = camera.position.clone().addScaledVector(SUN, 1000).project(camera);
  const camF = new V3(0, 0, -1).applyQuaternion(camera.quaternion);
  const facing = Math.max(0, camF.dot(SUN));
  const gl = $('#glare');
  if (sp.z < 1 && facing > 0) {
    gl.style.transform = `translate(${(sp.x * 0.5 + 0.5) * innerWidth}px,${(-sp.y * 0.5 + 0.5) * innerHeight}px)`;
    const camVis = (frame & 15) === 0 ? (glareVis = sunVis(camera.position.x, camera.position.y - 4, camera.position.z)) : glareVis;
    gl.style.opacity = (Math.pow(facing, 4) * camVis * (todIdx === 1 ? 0.35 : 0.6)).toFixed(3);
  } else gl.style.opacity = 0;
}
let glareVis = 1;

// ================================================================ audio update
function updateAudio(dt) {
  if (!AU.ctx) return;
  const flying = state === 'fly' || state === 'finish' || state === 'countdown';
  const sp = flying ? P.speed : 10;
  const t = AU.ctx.currentTime;
  AU.wf.frequency.setTargetAtTime(200 + sp * 14 + (P.boosting ? 500 : 0), t, 0.15);
  AU.wg.gain.setTargetAtTime((flying ? 0.05 + clamp((sp - 20) / 70, 0, 1) * 0.28 : 0.04) * (paused ? 0 : 1), t, 0.2);
}

// ================================================================ HUD
const H = { ring: $('#hRing'), time: $('#hTime'), alt: $('#hAlt'), spd: $('#hSpd'), vario: $('#vario'), boost: $('#boostFill'), boostBox: $('#boost'), dot: $('#progDot'), arrow: $('#arrow'), tag: $('#ringTag'), warn: $('#warn'), msg: $('#msg'), count: $('#count') };
let msgTimer = 0;
function showMsg(a, b) { H.msg.innerHTML = a + (b ? '<small>' + b + '</small>' : ''); H.msg.classList.add('show'); msgTimer = 1.6; }
function fmtTime(t) { const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); }
function buildProgTicks() {
  const pr = $('#prog'); pr.querySelectorAll('i').forEach(e => e.remove());
  for (const g of rings) { const i = document.createElement('i'); i.style.left = (g.t / goal.t * 100) + '%'; pr.appendChild(i); g.tick = i; }
}
function updateProgTicks() { for (const g of rings) g.tick.className = g.state === 1 ? 'ok' : g.state === 2 ? 'ng' : ''; }
let hudAcc = 0;
function updateHUD(dt) {
  if (msgTimer > 0) { msgTimer -= dt; if (msgTimer <= 0) H.msg.classList.remove('show'); }
  hudAcc += dt;
  if (hudAcc > 0.08) {
    hudAcc = 0;
    H.ring.innerHTML = passed + '<small>/' + rings.length + '</small>';
    H.time.textContent = fmtTime(raceT);
    H.alt.textContent = Math.max(0, Math.round(P.pos.y - groundAt(P.pos.x, P.pos.z)));
    H.spd.textContent = Math.round(P.speed * 3.6);
    if (P.inThermal > 0.15) { H.vario.textContent = 'じょうしょう きりゅう ↑'; H.vario.className = 'up'; }
    else { H.vario.textContent = (P.vs >= 0 ? '+' : '') + P.vs.toFixed(1) + ' m/s'; H.vario.className = P.vs > 0.5 ? 'up' : ''; }
    H.boost.style.width = (P.boost * 100).toFixed(1) + '%';
    H.boostBox.classList.toggle('on', P.boosting);
    H.dot.style.left = clamp(-P.pos.z / goal.t * 100, 0, 100) + '%';
    H.warn.classList.toggle('show', state === 'fly' && P.clear < 22 && mode === 'hard');
  }
  // next ring indicator
  const tgt = state === 'fly' || state === 'countdown' ? (nextRing < rings.length ? rings[nextRing] : goal) : null;
  if (!tgt) { H.arrow.classList.add('hide'); H.tag.classList.add('hide'); return; }
  const v = tgt.p.clone().project(camera);
  const camF = new V3(0, 0, -1).applyQuaternion(camera.quaternion);
  const front = tgt.p.clone().sub(camera.position).dot(camF) > 0;
  const W = innerWidth, Hh = innerHeight;
  const dist = Math.round(tgt.p.distanceTo(P.pos));
  if (front && Math.abs(v.x) < 0.92 && Math.abs(v.y) < 0.88) {
    H.arrow.classList.add('hide'); H.tag.classList.remove('hide');
    const sy = (-v.y * 0.5 + 0.5) * Hh;
    const pr = tgt.p.clone().add(new V3(0, tgt.R + 4, 0)).project(camera);
    H.tag.style.transform = `translate(${(v.x * 0.5 + 0.5) * W}px,${Math.min(sy, (-pr.y * 0.5 + 0.5) * Hh) - 22}px) translate(-50%,0)`;
    H.tag.textContent = (tgt === goal ? 'GOAL  ' : '') + dist + ' m';
  } else {
    H.tag.classList.add('hide'); H.arrow.classList.remove('hide');
    let x = v.x, y = v.y; if (!front) { x = -x; y = -y; }
    const ang = Math.atan2(-y, x);
    const rx = W * 0.42, ry = Hh * 0.38;
    H.arrow.style.transform = `translate(${W / 2 + Math.cos(ang) * rx}px,${Hh / 2 + Math.sin(ang) * ry}px) rotate(${ang}rad)`;
  }
}

// ================================================================ UI wiring
function showOnly(id) { for (const x of ['#title', '#pause', '#result']) $(x).classList.toggle('hide', x !== id); }
function setPause(p) {
  paused = p; $('#pause').classList.toggle('hide', !p);
  if (AU.ctx) { if (p) AU.ctx.suspend(); else AU.ctx.resume(); }
}
function selectBtns(grp, attr, val) { document.querySelectorAll(grp + ' button').forEach(b => b.classList.toggle('on', b.dataset[attr] === String(val))); }
const MODE_DESC = { easy: 'じめんに ぶつからない あんしんモード。リングも おおきめ。', hard: 'リングが ちいさく、ぶつかると リングから やりなおし。' };
function refreshTitle() {
  selectBtns('#gTod', 'tod', todIdx); selectBtns('#gMode', 'mode', mode); selectBtns('#gInv', 'inv', invertY ? 1 : 0);
  $('#modeDesc').textContent = MODE_DESC[mode];
  const b = loadBest(); $('#best').textContent = b ? 'ベスト ' + fmtTime(b.t) + '　リング ' + b.r + '/' + N_RINGS : '';
}
function bestKey() { return 'skyglider.best.' + mode; }
function loadBest() { try { return JSON.parse(localStorage.getItem(bestKey()) || 'null'); } catch (e) { return null; } }
function saveBest(o) { try { localStorage.setItem(bestKey(), JSON.stringify(o)); } catch (e) { } }
function savePrefs() { try { localStorage.setItem('skyglider.prefs', JSON.stringify({ tod: todIdx, mode, inv: invertY })); } catch (e) { } }

$('#gTod').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const i = +b.dataset.tod; if (i === todIdx) return;
  $('#loadMsg').textContent = 'LIGHTING'; $('#loading').classList.remove('hide');
  setTimeout(() => { applyTOD(i, true); $('#loading').classList.add('hide'); refreshTitle(); savePrefs(); }, 40);
});
$('#gMode').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; mode = b.dataset.mode; setRingSize(); refreshTitle(); savePrefs(); });
$('#gInv').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; invertY = b.dataset.inv === '1'; refreshTitle(); savePrefs(); });
$('#bStart').addEventListener('click', () => { initAudio(); startRace(); });
$('#bResume').addEventListener('click', () => setPause(false));
$('#bRetry1').addEventListener('click', () => { setPause(false); startRace(); });
$('#bRetry2').addEventListener('click', () => startRace());
$('#bTitle1').addEventListener('click', () => { setPause(false); toTitle(); });
$('#bTitle2').addEventListener('click', () => toTitle());
$('#bPause').addEventListener('click', () => setPause(true));
$('#mute').addEventListener('click', () => { initAudio(); setMute(AU.on); });
$('#bMute2').addEventListener('click', () => { initAudio(); setMute(AU.on); if (paused && AU.ctx) AU.ctx.suspend(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && (state === 'fly' || state === 'countdown')) setPause(true); });

function startRace() {
  resetRace(); setRingSize();
  state = 'countdown'; countT = 3.2; paused = false;
  showOnly(null); $('#hud').classList.remove('hide'); $('#bPause').classList.remove('hide'); $('#back').classList.add('hide'); $('#mute').classList.add('hide');
  $('#bBoost').classList.toggle('hide', !isTouch);
  $('#fade').style.opacity = 0;
}
function toTitle() {
  state = 'title'; titleT = 0; resetRace(); showOnly('#title'); refreshTitle();
  $('#hud').classList.add('hide'); $('#bPause').classList.add('hide'); $('#bBoost').classList.add('hide'); $('#stick').classList.add('hide'); $('#back').classList.remove('hide'); $('#mute').classList.remove('hide');
  $('#fade').style.opacity = 0;
}
function showResult() {
  state = 'result';
  const best = loadBest();
  const isNew = !best || raceT < best.t || (passed > best.r && raceT <= best.t + 5);
  if (!best || raceT < best.t) saveBest({ t: raceT, r: passed });
  const nb = loadBest();
  const stars = 1 + (passed >= Math.ceil(rings.length * 0.7) ? 1 : 0) + (passed === rings.length ? 1 : 0);
  $('#rStars').innerHTML = '★'.repeat(stars) + '<span class="off">' + '★'.repeat(3 - stars) + '</span>';
  $('#rTime').textContent = fmtTime(raceT); $('#rRings').textContent = passed + ' / ' + rings.length;
  $('#rCrash').textContent = crashes; $('#rCrashRow').classList.toggle('hide', mode === 'easy');
  $('#rBest').textContent = nb ? fmtTime(nb.t) : '-';
  $('#rNew').textContent = (!best || raceT < best.t) ? 'NEW RECORD' : (passed === rings.length ? 'ALL RINGS CLEAR' : '');
  showOnly('#result'); $('#hud').classList.add('hide'); $('#bPause').classList.add('hide'); $('#bBoost').classList.add('hide'); $('#back').classList.remove('hide'); $('#mute').classList.remove('hide');
}

// ================================================================ loop
let frame = 0, last = performance.now(), clockT = 0;
function tick(now) {
  requestAnimationFrame(tick);
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (paused) { renderer.render(scene, camera); return; }
  clockT += dt; frame++;
  if (state === 'title') {
    P.pos.y = startPos().y + Math.sin(clockT * 0.6) * 0.6; P.bank = Math.sin(clockT * 0.4) * 0.06; syncGlider();
  } else if (state === 'countdown') {
    countT -= dt;
    const n = Math.ceil(countT - 0.2);
    H.count.textContent = countT > 0.2 ? (n > 0 ? n : '') : 'GO';
    if (countT <= 0) { state = 'fly'; H.count.textContent = 'GO'; setTimeout(() => { if (H.count.textContent === 'GO') H.count.textContent = ''; }, 700); sfxWhoosh(1.0, 300, 1200, 0.35); }
  } else if (state === 'fly') {
    raceT += dt; updateFlight(dt);
  } else if (state === 'crash') {
    crashT += dt; if (crashT > 1.4) respawn();
  } else if (state === 'finish') {
    finishT += dt;
    P.bank = lerp(P.bank, 0, 1 - Math.exp(-dt * 2)); P.pitch = lerp(P.pitch, 0, 1 - Math.exp(-dt * 1.5)); P.speed = lerp(P.speed, 30, 1 - Math.exp(-dt * 0.5));
    P.prev.copy(P.pos); P.pos.addScaledVector(fwdOf(P.heading, P.pitch), P.speed * dt);
    P.pos.y = Math.max(P.pos.y, groundAt(P.pos.x, P.pos.z) + 12);
    syncGlider();
    if (finishT > 3.2) showResult();
  } else if (state === 'result') {
    P.prev.copy(P.pos); P.pos.addScaledVector(fwdOf(P.heading, 0), 30 * dt); P.pos.y = Math.max(P.pos.y, groundAt(P.pos.x, P.pos.z) + 12); syncGlider();
  }
  updateCamera(dt);
  updateWorld(dt, clockT);
  updateHUD(dt);
  updateAudio(dt);
  renderer.render(scene, camera);
}
function onResize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.fov = 0; setFov(curFov);
}
addEventListener('resize', onResize);

// ================================================================ boot
function boot() {
  try { const p = JSON.parse(localStorage.getItem('skyglider.prefs') || 'null'); if (p) { todIdx = p.tod ?? 2; mode = p.mode || 'easy'; invertY = !!p.inv; } } catch (e) { }
  try { if (localStorage.getItem('skyglider.mute') === '1') setMute(true); } catch (e) { }
  const steps = [
    ['TERRAIN', () => { buildHM(); buildTerrain(); }],
    ['WATER', () => buildWater()],
    ['FOREST', () => buildVegetation()],
    ['SKY', () => { buildClouds(); buildGlider(); trails = [new Trail(), new Trail()]; buildMotes(); buildCourse(); }],
    ['LIGHTING', () => { applyTOD(todIdx, true); }],
  ];
  let i = 0;
  const run = () => {
    if (i >= steps.length) {
      resetRace(); setRingSize(); toTitle(); $('#loading').classList.add('hide');
      requestAnimationFrame(t => { last = t; tick(t); });
      return;
    }
    $('#loadMsg').textContent = steps[i][0];
    setTimeout(() => { steps[i][1](); i++; run(); }, 30);
  };
  run();
}
boot();
</script>
</body>
</html>
