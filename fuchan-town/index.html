<script>
(()=>{"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const FONT='"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif',POP='"Mochiy Pop One","M PLUS Rounded 1c",sans-serif';
function rr(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);}
function ell(c,x,y,rx,ry){c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,TAU);c.fill();}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,Math.max(.1,r),0,TAU);c.fill();}
function shade(hex,a){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=a<0?0:255,t=Math.abs(a);r=Math.round(r+(f-r)*t);g=Math.round(g+(f-g)*t);b=Math.round(b+(f-b)*t);return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function yenJ(v){v=Math.floor(v);if(v>=1e8){const o=Math.floor(v/1e8),m=Math.floor(v%1e8/1e4);return o+'億'+(m?m+'万':'')+'円';}if(v>=1e4){const m=Math.floor(v/1e4),r=v%1e4;return m+'万'+(r?r.toLocaleString('ja-JP'):'')+'円';}return v.toLocaleString('ja-JP')+'円';}
function star(c,x,y,r1,r2,n=5,rot=-Math.PI/2){c.beginPath();for(let i=0;i<n*2;i++){const r=i%2?r2:r1,a=rot+i*Math.PI/n;c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}c.closePath();}
function heartP(c,x,y,s){c.beginPath();c.moveTo(x,y+s*.9);c.bezierCurveTo(x-s*1.3,y+s*.1,x-s*.8,y-s*.9,x,y-s*.3);c.bezierCurveTo(x+s*.8,y-s*.9,x+s*1.3,y+s*.1,x,y+s*.9);c.closePath();}
const HERO={hair:'#2a2230',hairH:'#6a5a80',iris:'#7a4a2a',skin:'#fff0e4',line:'#4a2a40'};
function bow(c,x,y,s,col){
  c.strokeStyle=HERO.line;c.lineWidth=1;c.fillStyle=col;
  c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x-s*1.4,y-s*1.1,x-s*1.5,y+s*.1);c.quadraticCurveTo(x-s*1.1,y+s*.9,x,y);c.fill();c.stroke();
  c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+s*1.4,y-s*1.1,x+s*1.5,y+s*.1);c.quadraticCurveTo(x+s*1.1,y+s*.9,x,y);c.fill();c.stroke();
  c.beginPath();c.moveTo(x-s*.2,y+s*.2);c.lineTo(x-s*.7,y+s*1.4);c.lineTo(x-s*.1,y+s*1.1);c.closePath();c.fill();c.stroke();
  c.beginPath();c.moveTo(x+s*.2,y+s*.2);c.lineTo(x+s*.7,y+s*1.4);c.lineTo(x+s*.1,y+s*1.1);c.closePath();c.fill();c.stroke();
  c.fillStyle=shade(col,-.15);circ(c,x,y,s*.42);c.stroke();c.lineWidth=1.1;
}

// ================= characters: ふーちゃん & りっきー =================
const FU={hair:'#3a2826',hairH:'#7a5a54',skin:'#fff0e6',line:'#5a3a44'};
function fluffEar(c,s,t){c.save();c.translate(s*8.5,-55);c.rotate(s*(.28+Math.sin(t*3+s)*.06));
  c.fillStyle='#ffb6d6';c.strokeStyle='#e57fae';c.lineWidth=1.2;c.beginPath();c.ellipse(0,-9,5.4,11.5,0,0,TAU);c.fill();c.stroke();
  for(let k=0;k<14;k++){const a=k/14*TAU;c.beginPath();c.arc(Math.cos(a)*5.2,-9+Math.sin(a)*11.2,1.8,0,TAU);c.fill();}
  c.fillStyle='#ffe2ef';ell(c,0,-8.5,2.6,7.5);c.fillStyle='rgba(255,255,255,.7)';circ(c,-2,-15,1.2);c.restore();}
function drawFuka(c,x,y,o){
  const C=o.outfit||OUTFIT0,L=FU.line,t=o.t||0;
  c.save();c.translate(x,y);const sc=o.sc||3;c.scale(sc,sc);if(o.alpha!=null)c.globalAlpha=o.alpha;
  const mv=o.moving,sw=mv?Math.sin(t*11):0;let bob=mv?Math.abs(Math.sin(t*11))*1.5:Math.sin(t*2.4)*.4;if(o.cheer)bob=Math.abs(Math.sin(t*6))*2.5;
  c.fillStyle='rgba(90,40,110,.2)';ell(c,0,0,13,4);
  const dir=o.dir||0,side=dir===1||dir===2,back=dir===3;if(dir===1)c.scale(-1,1);
  c.translate(0,-bob);c.lineJoin='round';c.lineCap='round';c.lineWidth=1.1;c.strokeStyle=L;
  const fx=side?3.5:0,yuk=C.style==='yukata';
  // back hair
  c.fillStyle=FU.hair;c.beginPath();c.ellipse(0,-39.5,18.6,18,0,0,TAU);c.fill();c.stroke();
  if(back){c.beginPath();c.moveTo(-17,-40);c.quadraticCurveTo(-17,-24,-9,-23);c.lineTo(9,-23);c.quadraticCurveTo(17,-24,17,-40);c.closePath();c.fill();c.stroke();}
  // feet
  const foot=(px,lift)=>{c.fillStyle=FU.skin;c.beginPath();c.ellipse(px,-2.6-lift,3.6,2.6,0,0,TAU);c.fill();c.stroke();c.fillStyle=C.boots||'#ff8cc0';
    if(yuk){c.fillStyle='#e8c89a';c.fillRect(px-3.8,-1-lift,7.6,1.9);c.strokeRect(px-3.8,-1-lift,7.6,1.9);c.strokeStyle=C.boots||'#ff5f9a';c.lineWidth=1.3;c.beginPath();c.moveTo(px-2.6,-3-lift);c.lineTo(px,-4.8-lift);c.lineTo(px+2.6,-3-lift);c.stroke();c.strokeStyle=L;c.lineWidth=1.1;}
    else{rr(c,px-3.9,-4.8-lift,7.8,4.8,2);c.fill();c.stroke();}};
  foot(-4.5+(side?sw*3:0),sw>0?sw*1.5:0);foot(4.5-(side?sw*3:0),sw<0?-sw*1.5:0);
  // body
  if(yuk){c.fillStyle=C.dress;c.beginPath();c.moveTo(-8,-27);c.lineTo(8,-27);c.lineTo(10.5,-5);c.quadraticCurveTo(0,-3.6,-10.5,-5);c.closePath();c.fill();c.stroke();
    c.save();c.clip();const P=C.pat||['#ff8cc0','#c8a0e8'];[[-6,-9],[4,-8],[-2,-24],[6,-23],[-7,-21],[1,-12],[8,-13],[-4,-15],[5,-17]].forEach(([a,b],i)=>{c.fillStyle=P[i%2];for(let k=0;k<5;k++){const an=k/5*TAU;circ(c,a+Math.cos(an)*1.3,b+Math.sin(an)*1.3,1.05);}c.fillStyle='#fff6b0';circ(c,a,b,.6);});c.restore();
    if(!back){c.beginPath();c.moveTo(-5,-27);c.lineTo(3.5,-5);c.stroke();c.fillStyle='#fff';c.beginPath();c.moveTo(-5.5,-27);c.lineTo(0,-20.5);c.lineTo(5.5,-27);c.lineTo(3,-27);c.lineTo(0,-23.2);c.lineTo(-3,-27);c.closePath();c.fill();c.stroke();}
    c.fillStyle=C.ribbon;rr(c,-9.3,-19.6,18.6,5.4,1.5);c.fill();c.stroke();c.fillStyle=shade(C.ribbon,.45);c.fillRect(-9,-17.4,18,1);
    if(back){c.fillStyle=C.ribbon;for(const s of[-1,1]){c.beginPath();c.ellipse(s*6.5,-19,6.5,4.2,s*.25,0,TAU);c.fill();c.stroke();c.beginPath();c.moveTo(s*1.5,-16);c.lineTo(s*5,-7);c.lineTo(s*2,-8);c.closePath();c.fill();c.stroke();}c.fillStyle=shade(C.ribbon,-.1);circ(c,0,-18.5,2.6);c.stroke();}
    else{c.fillStyle=C.ribbon;c.beginPath();c.ellipse(-3,-17,2.4,1.8,0,0,TAU);c.fill();c.stroke();c.beginPath();c.ellipse(3,-17,2.4,1.8,0,0,TAU);c.fill();c.stroke();}}
  else{c.fillStyle=C.dress;c.beginPath();c.moveTo(-7,-17);c.lineTo(7,-17);c.lineTo(12.5,-6);c.quadraticCurveTo(0,-3.5,-12.5,-6);c.closePath();c.fill();c.stroke();
    c.fillStyle=C.skirt||'#fff';c.beginPath();c.moveTo(-12,-7.5);c.quadraticCurveTo(0,-5,12,-7.5);c.lineTo(12.5,-6);c.quadraticCurveTo(0,-3.5,-12.5,-6);c.closePath();c.fill();
    c.fillStyle=C.dress;rr(c,-7,-27,14,11,[4,4,1,1]);c.fill();c.stroke();c.fillStyle=C.ribbon;c.fillRect(-7.5,-18.2,15,2.2);
    if(!back){c.fillStyle='#fff';c.beginPath();c.moveTo(-4,-27);c.lineTo(0,-24);c.lineTo(4,-27);c.closePath();c.fill();c.stroke();bow(c,0,-17.2,2.4,C.ribbon);}}
  // arms
  const armC=C.dress==='#ffffff'?'#f4f4ff':C.dress;
  const arm=(sx,hx,hy)=>{c.strokeStyle=L;c.lineWidth=6.4;c.beginPath();c.moveTo(sx,-24.5);c.lineTo(hx,hy);c.stroke();c.strokeStyle=armC;c.lineWidth=4.2;c.stroke();c.strokeStyle=L;c.lineWidth=1.1;c.fillStyle=FU.skin;c.beginPath();c.arc(hx,hy,2.5,0,TAU);c.fill();c.stroke();};
  const aw=mv?sw*2.5:0;
  if(o.cheer){arm(-7,-15,-47+Math.sin(t*8)*2);arm(7,15,-47-Math.sin(t*8)*2);c.fillStyle='#ffe36a';star(c,-16,-51,5,2.2);c.fill();c.stroke();star(c,16,-51,5,2.2);c.fill();c.stroke();}
  else if(o.wave){arm(-7,-10,-12);arm(7,15.5,-43+Math.sin(t*10)*3);}
  else if(o.hold){arm(-7,-11,-19);arm(7,11,-19);}
  else if(o.eat){arm(-7,-3,-30);arm(7,3,-30);}
  else if(side){arm(0,aw*2.2+2,-12);}
  else{arm(-7,-10.5,-12+aw);arm(7,10.5,-12-aw);}
  if(yuk&&!o.cheer&&!o.wave&&!o.eat&&!o.hold&&!side){c.fillStyle=C.dress;for(const s of[-1,1]){rr(c,s>0?7.5:-13.5,-22,6,9,[1,1,3,3]);c.fill();c.stroke();}}
  // head
  c.fillStyle=FU.skin;c.beginPath();c.arc(0,-40,16.5,0,TAU);c.fill();c.stroke();
  if(back){c.fillStyle=FU.hair;c.beginPath();c.arc(0,-40.5,17.6,0,TAU);c.fill();c.stroke();c.strokeStyle=FU.hairH;c.lineWidth=1.4;c.beginPath();c.arc(-2,-45,9,Math.PI*1.1,Math.PI*1.6);c.stroke();}
  else{const ex=6.3,ey=-37;
    if(o.happy||o.eat||o.cheer){c.strokeStyle=L;c.lineWidth=1.7;for(const s of[-1,1]){if(side&&s<0)continue;c.beginPath();c.arc(fx+s*ex,ey+1,2.8,Math.PI*1.1,Math.PI*1.9);c.stroke();}}
    else for(const s of[-1,1]){if(side&&s<0&&fx)continue;const xx=fx+s*ex;c.fillStyle='#2a1a22';c.beginPath();c.ellipse(xx,ey,2.8,3.6,0,0,TAU);c.fill();c.fillStyle='#fff';circ(c,xx-1,ey-1.4,1.15);circ(c,xx+1,ey+1.3,.55);}
    c.fillStyle='rgba(255,110,145,.5)';ell(c,fx-10.5,-32,3.3,2.1);ell(c,fx+10.5,-32,3.3,2.1);
    c.strokeStyle=L;c.lineWidth=1.1;
    if(o.cheer||o.eat||o.happy){c.fillStyle='#e0506a';c.beginPath();c.arc(fx,-31.2,2.9,0,Math.PI);c.closePath();c.fill();c.stroke();}else{c.beginPath();c.arc(fx,-31.8,2,.3,Math.PI-.3);c.stroke();}
    c.fillStyle=FU.hair;c.beginPath();c.moveTo(-17,-38);c.bezierCurveTo(-18.5,-60,18.5,-60,17,-38);c.lineTo(14,-43.5);c.lineTo(10,-41.5);c.lineTo(6,-44.5);c.lineTo(2,-42);c.lineTo(-2,-44.8);c.lineTo(-6,-42);c.lineTo(-10,-44.5);c.lineTo(-14,-42);c.closePath();c.fill();c.stroke();
    c.strokeStyle=FU.hairH;c.lineWidth=1.4;c.beginPath();c.arc(-3,-49,7,Math.PI*1.1,Math.PI*1.5);c.stroke();c.strokeStyle=L;c.lineWidth=1.1;
    c.fillStyle=FU.hair;for(const s of[-1,1]){c.beginPath();c.moveTo(s*16.6,-41);c.quadraticCurveTo(s*18.8,-30,s*14,-24.5);c.lineTo(s*13.2,-33);c.closePath();c.fill();c.stroke();}}
  // accessories
  c.strokeStyle=L;c.lineWidth=1.1;const top=-56;
  switch(C.acc){
    case'usamimi':fluffEar(c,-1,t);fluffEar(c,1,t);c.strokeStyle='#ffb6d6';c.lineWidth=3.2;c.beginPath();c.arc(0,-40,16.8,Math.PI*1.18,Math.PI*1.82);c.stroke();c.fillStyle='#ffd0e4';for(let k=0;k<7;k++){const a=Math.PI*(1.22+k*.093);circ(c,Math.cos(a)*16.8,-40+Math.sin(a)*16.8,1.3);}break;
    case'mbow':bow(c,side?-3:-8,-53,4.6,C.ribbon);bow(c,side?-3:8,-53,4.6,C.ribbon);break;
    case'tiara':c.fillStyle='#ffe36a';c.beginPath();c.moveTo(-9,top+2);c.lineTo(-6,top-5);c.lineTo(-3,top);c.lineTo(0,top-8);c.lineTo(3,top);c.lineTo(6,top-5);c.lineTo(9,top+2);c.closePath();c.fill();c.stroke();c.fillStyle='#ff4d8d';heartP(c,0,top-3,1.8);c.fill();break;
    case'crown':c.fillStyle='#ffd23a';c.beginPath();c.moveTo(-8,top+3);c.lineTo(-9,top-8);c.lineTo(-4,top-3);c.lineTo(0,top-10);c.lineTo(4,top-3);c.lineTo(9,top-8);c.lineTo(8,top+3);c.closePath();c.fill();c.stroke();c.fillStyle='#ff4d6d';circ(c,0,top-1,1.6);break;
    case'beret':c.fillStyle='#ff6f91';c.beginPath();c.ellipse(side?0:3,top+1,15,5.5,-.15,0,TAU);c.fill();c.stroke();circ(c,side?0:3,top-4.5,1.6);break;
    case'cap':c.fillStyle='#c98aa4';c.beginPath();c.arc(0,-44,17.5,Math.PI,TAU);c.closePath();c.fill();c.stroke();c.fillStyle=shade('#c98aa4',-.12);c.beginPath();c.ellipse(side?10:0,-44,side?10:18,4.5,0,0,Math.PI);c.fill();c.stroke();c.fillStyle='#fff';star(c,0,-51,3,1.3);c.fill();break;
    case'star':c.fillStyle='#ffd23a';star(c,side?4:9,top+3,4.5,2);c.fill();c.stroke();break;
    case'nurse':c.fillStyle='#fff';rr(c,-9,top-3,18,8,3);c.fill();c.stroke();c.fillStyle='#ff4d6d';c.fillRect(-1.3,top-2,2.6,6);c.fillRect(-3,top-.3,6,2.6);break;
  }
  c.restore();}
const RK={clap:0,hop:0};
function rkCheer(){RK.clap=1.4;sfx('giggle');}
function drawRikki(c,x,y,o={}){const sc=o.sc||2.5,t=o.t??T;c.save();c.translate(x,y);c.scale(sc,sc);const L=FU.line;c.lineJoin='round';c.lineCap='round';c.lineWidth=1.1;c.strokeStyle=L;
  c.fillStyle='rgba(90,40,110,.2)';ell(c,0,0,14,3.6);
  const hp=o.hop??RK.hop,hop=hp>0?Math.sin(hp*Math.PI)*10:0,mv=o.moving,bob=mv?Math.abs(Math.sin(t*9))*2:Math.sin(t*2)*.5;c.translate(0,-hop-bob);if(o.dir===1)c.scale(-1,1);
  c.fillStyle=FU.skin;for(const s of[-1,1]){c.beginPath();c.ellipse(s*7,-3.6,5.8,3.9,s*.15,0,TAU);c.fill();c.stroke();c.beginPath();c.arc(s*12,-3.4+(mv?Math.sin(t*9+s)*1.2:0),2.7,0,TAU);c.fill();c.stroke();}
  c.fillStyle='#fffaf0';c.beginPath();c.ellipse(0,-12.5,11,10.5,0,0,TAU);c.fill();c.stroke();
  c.save();c.clip();[[-5,-16,'#9ac8f0'],[4,-10,'#ffc86a'],[-2,-7,'#ffb3d6'],[6,-17,'#9ac8f0'],[-7,-9,'#ffc86a'],[1,-14,'#ffb3d6']].forEach(([a,b,cc])=>{c.fillStyle=cc;circ(c,a,b,1);});c.restore();
  c.fillStyle='#ffe0ec';c.beginPath();c.ellipse(0,-21.5,5.5,2.2,0,0,Math.PI);c.fill();
  const cl=o.clap??RK.clap;
  const arm=(s,hx,hy)=>{c.strokeStyle=L;c.lineWidth=5.6;c.beginPath();c.moveTo(s*8,-16);c.lineTo(hx,hy);c.stroke();c.strokeStyle='#fffaf0';c.lineWidth=3.6;c.stroke();c.lineWidth=1.1;c.strokeStyle=L;c.fillStyle=FU.skin;c.beginPath();c.arc(hx,hy,2.5,0,TAU);c.fill();c.stroke();};
  if(cl>0){const k=Math.abs(Math.sin(t*14));for(const s of[-1,1])arm(s,s*(2+k*4),-20);}
  else if(o.wave){arm(-1,-12,-9);arm(1,13,-26+Math.sin(t*10)*2);}
  else{const aw=mv?Math.sin(t*9)*3:0;arm(-1,-12,-9+aw);arm(1,12,-9-aw);}
  const hy=-30;c.fillStyle=FU.skin;c.beginPath();c.arc(0,hy,13.5,0,TAU);c.fill();c.stroke();
  c.fillStyle=FU.hair;c.beginPath();c.moveTo(-13,hy-2);c.bezierCurveTo(-14,hy-18,14,hy-18,13,hy-2);c.lineTo(9.5,hy-6);c.lineTo(5.5,hy-4.5);c.lineTo(1.5,hy-7);c.lineTo(-2.5,hy-5);c.lineTo(-6.5,hy-7);c.lineTo(-10,hy-4.5);c.closePath();c.fill();c.stroke();
  c.beginPath();c.moveTo(-1.5,hy-13.5);c.quadraticCurveTo(-.5,hy-20,4,hy-19);c.quadraticCurveTo(1,hy-17,1.8,hy-13.5);c.fill();c.stroke();
  const happy=o.happy||cl>0;
  if(happy){c.lineWidth=1.6;for(const s of[-1,1]){c.beginPath();c.arc(s*4.8,hy+1.5,2.3,Math.PI*1.1,Math.PI*1.9);c.stroke();}c.lineWidth=1.1;}
  else for(const s of[-1,1]){c.fillStyle='#2a1a22';c.beginPath();c.ellipse(s*4.8,hy+1,2.2,2.8,0,0,TAU);c.fill();c.fillStyle='#fff';circ(c,s*4.8-.8,hy,.9);}
  c.fillStyle='rgba(255,110,145,.55)';ell(c,-8.8,hy+5.5,3,2);ell(c,8.8,hy+5.5,3,2);
  if(happy){c.fillStyle='#e0506a';c.beginPath();c.arc(0,hy+6,2.4,0,Math.PI);c.closePath();c.fill();c.stroke();}else{c.fillStyle='#ff9ab0';circ(c,0,hy+6.5,1.3);}
  c.restore();}
function rkHit(x,y,rx,ry,sc){return Math.abs(x-rx)<16*sc&&y<ry+2*sc&&y>ry-46*sc;}

const SKEY='fuchan-town-v1';
const SAVE={stickers:[],outfit:{dress:'yukata',hat:'usamimi',shoes:'#ff5f9a'},sound:true};
try{Object.assign(SAVE,JSON.parse(localStorage.getItem(SKEY)||'{}'));}catch(e){}

// ================= outfits =================
const DRESSES=[
  {id:'yukata',style:'yukata',dress:'#fff3f8',pat:['#ff7aac','#c89af0'],ribbon:'#ff6fa3',boots:'#ff5f9a',sw:'#ffc8e0',ja:'ゆかた',en:'yukata'},
  {id:'yukata2',style:'yukata',dress:'#e8f2ff',pat:['#5aa8ff','#ff8cc0'],ribbon:'#ffc93c',sw:'#bcd8ff',ja:'みずいろの ゆかた',en:'blue yukata'},

// ================= letters school =================
const HIRA=[['あ','あひる','duck'],['い','いちご','strawberry'],['う','うさぎ','rabbit'],['お','おさかな','fish'],['く','くま','bear'],['ね','ねこ','cat'],['り','りんご','apple'],['に','にんじん','carrot'],['た','たまご','egg'],['ほ','ほね','bone'],['ぱ','ぱんだ','panda'],['け','けーき','cake']];
const ABC=[['A','apple','apple'],['B','banana','banana'],['C','cat','cat'],['D','dog','dog'],['E','egg','egg'],['F','fish','fish'],['G','grapes','grapes'],['M','milk','milk'],['P','panda','panda'],['R','rabbit','rabbit'],['S','star','starcandy'],['T','tomato','tomato']];
SCN.school={bg:'#fff6dc',mode:'hira',
  enter(){this.round=0;this.prev=null;this.lay();this.next();},
  lay(){this.box={x:100,y:H*.5-190,s:400};if(this.cur)this.build();},
  next(){const set=this.mode==='hira'?HIRA:ABC;let cur;do cur=pick(set);while(cur===this.prev);this.prev=this.cur=cur;this.ok=0;this.build();
    if(this.mode==='hira')say(`「${cur[0]}」を ゆびで なぞってね`);else{hush();speak('なぞってね');speak(cur[0],'en');bub={text:`「${cur[0]}」を なぞってね`,t:0,life:3};}},
  build(){const b=this.box,S=b.s;const oc=document.createElement('canvas');oc.width=oc.height=S;const g=oc.getContext('2d');g.fillStyle='#000';g.font=`800 ${S*.82}px ${FONT}`;g.textAlign='center';g.textBaseline='middle';g.fillText(this.cur[0],S/2,S*.54);
    const d=g.getImageData(0,0,S,S).data;const st=12;this.pts=[];this.grid=new Set();for(let y=0;y<S;y+=st)for(let x=0;x<S;x+=st)if(d[(y*S+x)*4+3]>120){this.pts.push({x:b.x+x,y:b.y+y,hit:false});this.grid.add((x/st|0)+','+(y/st|0));}
    this.strokes=[];this.inN=0;this.allN=0;this.cov=0;},
  nearLetter(x,y){const b=this.box,st=12;const gx=Math.floor((x-b.x)/st),gy=Math.floor((y-b.y)/st);for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++)if(this.grid.has((gx+dx)+','+(gy+dy)))return true;return false;},
  update(dt){if(this.ok>0){this.ok+=dt;if(this.ok>3.2&&this.ok<9){this.ok=9;this.round++;if(this.round>=3)celebrate('school');else this.next();}}},
  draw(c){const b=this.box;c.fillStyle='#fff0c8';c.fillRect(-400,0,W+800,H);c.fillStyle='#ffe4a0';for(let y=0;y<H;y+=44)c.fillRect(-400,y,W+800,3);
    // mode buttons
    for(const [m,lb,x] of [['hira','あいう',210],['abc','ABC',390]]){const sel=this.mode===m;c.fillStyle=sel?(m==='hira'?'#ff8cc0':'#5aa8ff'):'#fff';rr(c,x-78,122,156,64,32);c.fill();c.strokeStyle=m==='hira'?'#ff8cc0':'#5aa8ff';c.lineWidth=5;c.stroke();c.fillStyle=sel?'#fff':(m==='hira'?'#ff8cc0':'#5aa8ff');c.font=`800 30px ${FONT}`;c.textAlign='center';c.textBaseline='middle';c.fillText(lb,x,155);}
    // board
    c.fillStyle='rgba(90,40,110,.15)';rr(c,b.x-14,b.y-6,b.s+28,b.s+28,30);c.fill();c.fillStyle='#fff';rr(c,b.x-14,b.y-14,b.s+28,b.s+28,30);c.fill();c.strokeStyle=this.mode==='hira'?'#ffb3d6':'#9ac8ff';c.lineWidth=6;c.stroke();
    c.strokeStyle='#f0e0e8';c.lineWidth=2;c.setLineDash([10,10]);c.beginPath();c.moveTo(b.x+b.s/2,b.y);c.lineTo(b.x+b.s/2,b.y+b.s);c.moveTo(b.x,b.y+b.s/2);c.lineTo(b.x+b.s,b.y+b.s/2);c.stroke();c.setLineDash([]);
    c.font=`800 ${b.s*.82}px ${FONT}`;c.textAlign='center';c.textBaseline='middle';c.fillStyle=this.ok>0?(this.mode==='hira'?'#ff5fa2':'#3a88e8'):'#f2e6ee';c.fillText(this.cur[0],b.x+b.s/2,b.y+b.s*.54);
    if(!this.ok){c.fillStyle='#ffd23a';for(const p of this.pts)if(!p.hit&&((p.x+p.y)/12)%5===0){circ(c,p.x+6,p.y+6,2.6);}}
    const rain=['#ff5fa2','#ffb03a','#ffd23a','#6cd08a','#5aa8ff','#b86af0'];c.lineCap='round';c.lineJoin='round';
    if(!this.ok)this.strokes.forEach((s,si)=>{c.strokeStyle=rain[si%6];c.lineWidth=30;c.globalAlpha=.85;c.beginPath();s.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));if(s.length===1)c.lineTo(s[0].x+.1,s[0].y);c.stroke();});c.globalAlpha=1;
    // progress stars
    for(let i=0;i<3;i++){c.fillStyle=i<this.round?'#ffd23a':'#f0e0c8';star(c,W/2-60+i*60,b.y+b.s+60,20,9);c.fill();}
    // picture
    const py=b.y+b.s+150;drawThing(c,this.cur[2],150,py,1.6);c.fillStyle=this.mode==='hira'?'#ff5fa2':'#3a88e8';c.font=`800 40px ${FONT}`;c.textAlign='left';c.textBaseline='middle';
    const w=this.cur[1];c.fillText(w,220,py);const fw=c.measureText(w[0]).width;c.strokeStyle='#ffd23a';c.lineWidth=5;c.beginPath();c.moveTo(220,py+26);c.lineTo(220+fw,py+26);c.stroke();
    drawFuka(c,465,py+70,{outfit:outfit(),t:T,dir:0,sc:2.3,cheer:this.ok>0,wave:!this.ok});drawRikki(c,558,py+70,{sc:1.8,t:T,clap:this.ok>0?1:RK.clap});this.rkPos={x:558,y:py+70,sc:1.8};},
  down(x,y){if(hitC(x,y,210,154,80)&&this.mode!=='hira'){this.mode='hira';sfx('tap');this.round=0;this.next();return;}if(hitC(x,y,390,154,80)&&this.mode!=='abc'){this.mode='abc';sfx('tap');this.round=0;this.next();return;}
    const b=this.box;const py=b.y+b.s+150;if(hitC(x,y,150,py,60)){sfx('pop');this.sayWord();return;}
    if(this.ok||x<b.x-20||x>b.x+b.s+20||y<b.y-20||y>b.y+b.s+20)return;this.drawing=true;this.strokes.push([]);this.add(x,y);},
  move(x,y){if(this.drawing&&!this.ok)this.add(x,y);},
  up(){if(!this.drawing)return;this.drawing=false;if(this.ok)return;
    if(this.cov>=.78){if(this.inN/Math.max(1,this.allN)>=.5)this.success();else{sfx('no');say('もういちど ゆっくり なぞってね');this.build();}}},
  add(x,y){const s=this.strokes[this.strokes.length-1];const l=s[s.length-1];if(l&&Math.hypot(l.x-x,l.y-y)<5)return;s.push({x,y});this.allN++;if(this.nearLetter(x,y))this.inN++;if(this.allN%4===0)sfx('tap');
    let n=0;for(const p of this.pts){if(!p.hit&&Math.abs(p.x-x)<26&&Math.abs(p.y-y)<26)p.hit=true;if(p.hit)n++;}this.cov=n/Math.max(1,this.pts.length);},
  success(){this.ok=.01;sfx('fanfare');const b=this.box;for(let i=0;i<5;i++)burst(b.x+rand(40,b.s-40),b.y+rand(40,b.s-40),6,'star');this.sayWord();},
  sayWord(){const [ch,w,k]=this.cur;hush();if(this.mode==='hira'){speak(`${ch}！ ${w}の ${ch}！`);speak(WORDS[k]?WORDS[k][1]:'','en');card={k,ja:w,en:WORDS[k]?WORDS[k][1]:'',t:0};}
    else{speak(`${ch}! ${ch} is for ${w}!`,'en');speak(WORDS[k]?WORDS[k][0]:'');card={k,ja:WORDS[k]?WORDS[k][0]:'',en:w,t:0};}},
  hint(){if(this.ok)return null;const p=this.pts.find(p=>!p.hit);return p?{x:p.x+6,y:p.y+6}:null;},
  hintText(){return 'ゆびで もじを なぞってね';}};

// ================= sticker book =================
SCN.book={bg:'#fff4fa',
  enter(){this.wig={};say('シールちょう！ '+SAVE.stickers.length+'まい あつめたよ');},
  cell(pi,j){const top=150,rh=(H-190)/7;return{x:j<0?80:210+j*125,y:top+rh*pi+rh/2,s:Math.min(1,rh/104)};},
  update(dt){for(const k in this.wig)if(this.wig[k]>0)this.wig[k]-=dt;},
  draw(c){c.fillStyle='#ffe8f4';for(let y=0;y<H;y+=40)c.fillRect(-400,y,W+800,20);
    titleText(c,'シールちょう',W/2,70,40,'#ff5fa2');c.font=`800 22px ${FONT}`;c.fillStyle='#b88aa8';c.textAlign='center';c.fillText(`${SAVE.stickers.length} / ${STK.length}`,W/2,118);
    PLACES.forEach((p,pi)=>{const a=this.cell(pi,-1);c.fillStyle=p.wall;rr(c,20,a.y-48*a.s,W-40,96*a.s,24);c.fill();c.fillStyle='#fff';circ(c,a.x,a.y,38*a.s);drawThing(c,p.icon,a.x,a.y,.9*a.s);
      STK.filter(s=>s.place===p.id).forEach((s,j)=>{const q=this.cell(pi,j);const w=this.wig[s.id]>0?Math.sin(this.wig[s.id]*30)*.15:0;c.save();c.translate(q.x,q.y);c.rotate(w+(j-1)*.06);drawSticker(c,s.k,0,0,q.s,SAVE.stickers.includes(s.id));c.restore();});});},
  down(x,y){PLACES.forEach((p,pi)=>STK.filter(s=>s.place===p.id).forEach((s,j)=>{const q=this.cell(pi,j);if(hitC(x,y,q.x,q.y,46*q.s)){if(SAVE.stickers.includes(s.id)){this.wig[s.id]=.6;sfx('pop');sayWord(s.k);}else{sfx('tap');say(p.ja+'で あそぶと もらえるよ');}}}));}};


// ================= input =================
let idle=0,hintSaid=0;
function toV(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-OX)/SC,y:(e.clientY-r.top-OY)/SC};}
let ptrId=null;
cv.addEventListener('pointerdown',e=>{audioInit();if(ptrId!==null&&ptrId!==e.pointerId)return;ptrId=e.pointerId;try{cv.setPointerCapture(e.pointerId);}catch(_){}const p=toV(e);idle=0;hintSaid=0;
  if(tr)return;if(cel){celDown(p.x,p.y);return;}
  if(scene!==SCN.map&&scene!==SCN.title&&hitC(p.x,p.y,56,60,46)){sfx('tap');go('map');return;}
  if(scene.rkPos){const r=scene.rkPos;if(rkHit(p.x,p.y,r.x,r.y,r.sc)){RK.hop=1;rkCheer();say(pick(['りっきー！ きゃっきゃ！','ばぶー！','りっきー にこにこ！','ねえね だいすき！']));burst(r.x,r.y-40*r.sc,8,'heart');return;}}
  if(scene.down)scene.down(p.x,p.y);});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==ptrId)return;const p=toV(e);if(scene.move&&!tr&&!cel)scene.move(p.x,p.y);});
const up=e=>{if(e.pointerId!==ptrId)return;ptrId=null;const p=toV(e);if(scene.up&&!tr&&!cel)scene.up(p.x,p.y);};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden)hush();});
// ================= loop =================
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  try{
  if(tr){tr.t+=dt;if(!tr.sw&&tr.t>=.35){tr.sw=true;scene=SCN[tr.next];parts.length=0;bub=null;card=null;scene.enter&&scene.enter();}if(tr.t>=.7)tr=null;}
  if(bub){bub.t+=dt;if(bub.t>bub.life)bub=null;}if(card){card.t+=dt;if(card.t>3)card=null;}
  if(cel)cel.t+=dt;if(RK.clap>0)RK.clap-=dt;if(RK.hop>0)RK.hop-=dt*2;
  if(!cel&&scene.update)scene.update(dt);
  updParts(dt);
  if(!cel&&!tr&&scene.hint){idle+=dt;if(idle>9&&!hintSaid&&scene.hintText){hintSaid=1;const ht=scene.hintText();if(ht)say(ht);}if(idle>22){idle=8;hintSaid=0;}}
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle=scene.bg||'#fff';c.fillRect(0,0,cv.width,cv.height);
  c.setTransform(DPR*SC,0,0,DPR*SC,DPR*OX,DPR*OY);
  scene.draw(c);
  drawParts(c);
  if(!cel&&!tr&&scene.hint&&idle>6){const h=scene.hint();if(h){const k=h.x2!=null?((T*.7)%1):0;const e=k<.8?k/.8:1;const hx=h.x2!=null?lerp(h.x,h.x2,e*e*(3-2*e)):h.x,hy=h.x2!=null?lerp(h.y,h.y2,e*e*(3-2*e)):h.y;drawHand(c,hx,hy,T);}}
  if(scene!==SCN.map&&scene!==SCN.title)drawBtn(c,56,60,40,'#ff8cc0','home');
  drawCard(c);drawBubble(c);
  if(cel)drawCel(c);
  if(tr)drawTr(c);
  }catch(err){if(!frame.e){frame.e=1;console.error(err);}}
}
resize();scene=SCN.title;scene.enter();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(scene===SCN.school)SCN.school.build();});
requestAnimationFrame(frame);
window.__town={SCN,get scene(){return scene},go,SAVE,celebrate,get cel(){return cel},get H(){return H}};
})();

</script>
