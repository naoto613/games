<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>リッキー すくすく にっき</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#fbe9d8;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;color:#5b2c47}
canvas#c{position:fixed;inset:0;display:block;touch-action:none}
button{font:inherit;color:inherit}
#hud{position:fixed;left:0;right:0;top:0;padding:max(6px,env(safe-area-inset-top)) 10px 6px;z-index:5;pointer-events:none;background:linear-gradient(rgba(255,255,255,.92),rgba(255,255,255,.78));box-shadow:0 2px 0 rgba(255,140,198,.35);border-radius:0 0 18px 18px}
#hud .top{display:flex;align-items:center;gap:6px}
#who{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:900;font-size:15px}
#who b{font-family:"Mochiy Pop One",sans-serif;font-weight:400;color:#ff4f9a;font-size:18px}
#gen{background:#8f74f0;color:#fff;border-radius:99px;padding:0 8px;font-size:12px;margin-right:2px}
#stg{background:#ffe066;color:#7a4a00;border-radius:99px;padding:0 8px;font-size:12px;white-space:nowrap}
#coin{font-weight:900;font-size:16px;background:#fff6cc;border:2px solid #ffd84a;border-radius:99px;padding:0 10px;color:#7a4a00}
#opt{pointer-events:auto;border:0;background:#fff;border-radius:50%;width:32px;height:32px;font-size:17px;box-shadow:0 2px 0 #f0b8d4;cursor:pointer;padding:0}
#gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:5px}
.g{display:flex;align-items:center;gap:2px;font-size:13px;font-weight:900}
.g .gb{flex:1}
.gb{height:10px;background:#f3e1ea;border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
.gb i{display:block;height:100%;border-radius:99px;transition:width .4s}
#grow{display:flex;align-items:center;gap:5px;margin-top:5px;font-weight:900;font-size:12px}
#grow .gb{flex:1;height:12px}
#gfill{background:linear-gradient(90deg,#7fe07a,#3fbf6a)}
#tod{font-size:12px;font-weight:900;white-space:nowrap}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 8px max(8px,env(safe-area-inset-bottom));background:linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,.95));border-radius:18px 18px 0 0;box-shadow:0 -2px 0 rgba(255,140,198,.35)}
#bar button{border:0;border-radius:16px;background:linear-gradient(#fff,#ffeef6);box-shadow:0 4px 0 #f3a9cd;padding:5px 0 3px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-weight:900;font-size:12.5px;line-height:1.15}
#bar button span{font-size:25px;line-height:1.15}
#bar button:active{transform:translateY(3px);box-shadow:0 1px 0 #f3a9cd}
#bar button.hi{animation:hi 1s infinite;background:linear-gradient(#fffbd0,#ffe38a);box-shadow:0 4px 0 #e0b040}
@keyframes hi{50%{transform:scale(1.07)}}
.hide{display:none!important}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));box-sizing:border-box;z-index:20;text-align:center}
.ov.show{display:flex}
.ov.dim{background:rgba(70,30,60,.45)}
.ov.low{justify-content:flex-end}
.panel{background:rgba(255,255,255,.98);border:4px solid #ff8cc6;border-radius:24px;padding:14px 14px 16px;max-width:460px;width:100%;box-sizing:border-box;box-shadow:0 7px 0 #e0579a;animation:pop .28s ease-out both;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
h2{margin:0 0 4px;font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif;font-weight:400;font-size:24px;color:#ff4f9a;line-height:1.3}
.panel p{margin:6px 0;font-weight:800;font-size:16px;line-height:1.6}
.ic{font-size:54px;line-height:1.1;margin:2px 0}
.btn{appearance:none;border:0;border-radius:999px;background:linear-gradient(#ff9ccf,#ff5fa8);color:#fff;font-weight:900;font-size:19px;padding:10px 24px;box-shadow:0 5px 0 #c8387c;cursor:pointer;text-shadow:0 2px 0 rgba(160,30,90,.45);min-width:150px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c8387c}
.btn.sub{background:linear-gradient(#c3b2ff,#8f74f0);box-shadow:0 5px 0 #6147c0;font-size:16px;padding:8px 18px;min-width:0}
.btn.sub:active{box-shadow:0 2px 0 #6147c0}
.btn.yel{background:linear-gradient(#fff08a,#ffc93a);box-shadow:0 5px 0 #d79a10;color:#7a4a00;text-shadow:none}
.btn.gry{background:#ddd;box-shadow:0 5px 0 #aaa;color:#777;text-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.col{display:flex;flex-direction:column;gap:10px;align-items:stretch;margin-top:12px}
.logo{font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif;color:#fff;line-height:1.15;text-shadow:0 3px 0 #ff4f9a,3px 0 0 #ff4f9a,-3px 0 0 #ff4f9a,0 -3px 0 #ff4f9a,2px 2px 0 #ff4f9a,-2px 2px 0 #ff4f9a,2px -2px 0 #ff4f9a,-2px -2px 0 #ff4f9a,0 7px 0 rgba(80,20,90,.3)}
.logo .a{font-size:clamp(17px,5vw,24px);color:#fff6a8}
.logo .b{font-size:clamp(34px,11vw,60px);white-space:nowrap}
#title{justify-content:flex-start;padding-top:max(40px,env(safe-area-inset-top))}
#title .row{margin-top:auto;margin-bottom:max(24px,env(safe-area-inset-bottom))}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:8px -4px 6px;padding:0 4px 4px;touch-action:pan-x}
.tabs button{flex:0 0 auto;border:0;border-radius:99px;background:#ffe3f0;color:#b04a80;font-weight:900;font-size:14px;padding:6px 12px;cursor:pointer}
.tabs button.on{background:#ff5fa8;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px;text-align:center}
.it{position:relative;border:3px solid #ffd0e6;border-radius:14px;background:#fff;padding:5px 2px 4px;cursor:pointer;font-weight:900;font-size:11.5px;line-height:1.25;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.it .e{font-size:30px;line-height:1.2}
.it .pr{color:#b07a00;font-size:12px}
.it.sel{border-color:#ff4f9a;background:#fff0f7;box-shadow:0 0 0 2px #ff9ccf}
.it.own .pr{color:#3fae5a}
.it.lock{opacity:.45;filter:grayscale(1)}
.it .nw{position:absolute;top:-6px;right:-4px;background:#ff4f9a;color:#fff;font-size:10px;border-radius:99px;padding:0 5px}
.it .mk{position:absolute;top:2px;left:4px;font-size:13px}
.it.rare{border-color:#ffd84a;background:linear-gradient(#fffbe6,#fff)}
canvas.pc{display:block;margin:0 auto;border-radius:16px;background:#fff6ee}
.small{font-size:13px!important;color:#9a6a86}
.prog{height:14px;background:#f3e1ea;border-radius:99px;overflow:hidden;margin:6px 0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#ffb0d8,#ff5fa8)}
.alb{border:3px solid #ffd0e6;border-radius:16px;padding:8px;margin:8px 0;text-align:left;font-weight:800;font-size:13px}
.alb .nm{font-family:"Mochiy Pop One",sans-serif;font-size:17px;color:#ff4f9a}
.alb .looks{display:flex;gap:2px;overflow-x:auto;margin-top:4px;touch-action:pan-x}
.alb canvas{flex:0 0 auto;border-radius:10px;background:#fff6ee}
.tr{display:flex;align-items:center;gap:8px;text-align:left;font-weight:800;font-size:14px;border-bottom:2px dashed #ffe0ee;padding:6px 2px}
.tr .e{font-size:26px}
.tr.no{opacity:.45}
input.nm{font:inherit;font-weight:900;font-size:22px;text-align:center;border:3px solid #ff9ccf;border-radius:14px;padding:6px;width:70%;color:#ff4f9a;touch-action:auto;-webkit-user-select:text;user-select:text}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.chips button{border:2px solid #ffc0de;background:#fff;border-radius:99px;padding:4px 12px;font-weight:900;font-size:16px;color:#ff4f9a;cursor:pointer}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opts button{border:3px solid #ffd0e6;background:#fff;border-radius:16px;padding:8px 4px;font-weight:900;font-size:15px;cursor:pointer;color:#5b2c47}
.opts button .e{display:block;font-size:30px}
.opts button:active{background:#fff0f7}
#tip{position:fixed;left:50%;transform:translateX(-50%);z-index:6;background:rgba(255,255,255,.95);border:3px solid #ff9ccf;border-radius:99px;padding:5px 16px;font-weight:900;font-size:16px;white-space:nowrap;pointer-events:none;animation:pop .3s both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
#tip{animation:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hide">
  <div class="top"><div id="who"><span id="gen">1だいめ</span> <b id="nm">リッキー</b></div><span id="tod"></span><div id="coin">🪙 0</div><button id="opt" aria-label="せってい">⚙️</button></div>
  <div id="gauges"></div>
  <div id="grow"><span id="stg">あかちゃん</span><div class="gb"><i id="gfill"></i></div><span id="gnext"></span></div>
</div>
<div id="bar" class="hide">
  <button data-a="eat"><span>🍼</span>ごはん</button>
  <button data-a="bath"><span>🛁</span>おふろ</button>
  <button data-a="play"><span>🎈</span>あそぶ</button>
  <button data-a="sleep"><span>🌙</span>ねんね</button>
  <button data-a="out"><span>🚶</span>おでかけ</button>
  <button data-a="dress"><span>👕</span>おきがえ</button>
  <button data-a="shop"><span>🏪</span>おみせ</button>
  <button data-a="dex"><span>📖</span>ずかん</button>
</div>
<div id="tip" class="hide"></div>
<div id="title" class="ov show">
  <div class="logo"><div class="a">ふーたんと</div><div class="b">リッキー</div><div class="a" style="font-size:clamp(22px,7vw,34px)">すくすく にっき</div></div>
  <div class="row col" id="tbtn"></div>
</div>
<div id="ov" class="ov dim"><div class="panel" id="pn"></div></div>
<script>
const TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0],clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const FONT='"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif',POP='"Mochiy Pop One",'+FONT;
let W=0,H=0,DPR=1,CLK=0;

// ================= draw helpers (キュアふーたん サバイバーと おなじ) =================
function ell(c,x,y,rx,ry){c.beginPath();c.ellipse(x,y,rx,ry,0,0,TAU);c.fill();}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,TAU);c.fill();}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function starP(c,x,y,R,r,n=5,rot=-Math.PI/2){c.beginPath();for(let i=0;i<n*2;i++){const a=rot+i*Math.PI/n,d=i%2?r:R;c.lineTo(x+Math.cos(a)*d,y+Math.sin(a)*d);}c.closePath();}
function heartP(c,x,y,s){c.beginPath();c.moveTo(x,y+s*.95);c.bezierCurveTo(x-s*1.5,y-s*.05,x-s*.8,y-s*1.25,x,y-s*.45);c.bezierCurveTo(x+s*.8,y-s*1.25,x+s*1.5,y-s*.05,x,y+s*.95);c.closePath();}
function flowerP(c,x,y,r,col,mid){c.fillStyle=col;for(let i=0;i<5;i++){const a=i/5*TAU;circ(c,x+Math.cos(a)*r*.62,y+Math.sin(a)*r*.62,r*.5);}c.fillStyle=mid||'#ffe066';circ(c,x,y,r*.38);}
function otext(c,s,x,y,size,fill='#fff',stroke='#ff4f9a',align='center',font){c.font=`900 ${size}px ${font||FONT}`;c.textAlign=align;c.textBaseline='middle';c.lineJoin='round';c.lineWidth=Math.max(3,size*.24);c.strokeStyle=stroke;c.strokeText(s,x,y);c.fillStyle=fill;c.fillText(s,x,y);}
function hexA(h,a){const n=parseInt(h.slice(1),16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
const glowCache={};
function glow(col){if(glowCache[col])return glowCache[col];const g=document.createElement('canvas');g.width=g.height=64;const c=g.getContext('2d');const gr=c.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,hexA(col,1));gr.addColorStop(.35,hexA(col,.5));gr.addColorStop(1,hexA(col,0));c.fillStyle=gr;c.fillRect(0,0,64,64);return glowCache[col]=g;}
function drawGlow(c,col,x,y,r,a=1){c.globalAlpha=a;c.drawImage(glow(col),x-r,y-r,r*2,r*2);c.globalAlpha=1;}
function bow(c,x,y,col,s=1){c.fillStyle=col;for(const k of[-1,1]){c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+k*8*s,y-7*s,x+k*8*s,y);c.quadraticCurveTo(x+k*8*s,y+6*s,x,y);c.fill();c.stroke();c.beginPath();c.moveTo(x,y);c.lineTo(x+k*4*s,y+7*s);c.lineTo(x+k*1.5*s,y+7.5*s);c.closePath();c.fill();c.stroke();}c.fillStyle='#ffd84a';heartP(c,x,y+.3*s,2.4*s);c.fill();c.stroke();}

// ================= characters (キュアふーたん サバイバーと おなじ) =================
// ================= characters =================
const HAIR='#2b1d22',SKIN='#ffe4d4',LN='#5b2c47';
// ふーたん (cure:true でキュアふーたん)
function drawFutan(c,x,y,o){
  const t=o.t||0,cure=o.cure!==false,pose=o.pose||'run',mv=o.moving;
  c.save();c.translate(x,y);c.scale(o.s||1,o.s||1);
  if(!o.noShadow){c.fillStyle='rgba(40,0,40,.18)';ell(c,0,0,14,4.5);}
  const bob=pose==='win'?Math.abs(Math.sin(t*6))*3:mv?Math.abs(Math.sin(t*13))*2.2:Math.sin(t*3)*.8;
  c.translate(0,-bob-(o.lift||0));if(o.dir<0)c.scale(-1,1);if(o.spin!=null)c.scale(Math.cos(o.spin),1);
  c.lineJoin='round';c.lineCap='round';c.strokeStyle=LN;c.lineWidth=1.5;
  const HY=-41,sw=mv?Math.sin(t*13):0;
  if(cure){for(const k of[-1,1]){const w=Math.sin(t*6+k)*3;c.fillStyle=k<0?'#ff5fa8':'#ff8cc6';c.beginPath();c.moveTo(k*3,-20);c.bezierCurveTo(k*10,-16,k*14+w,-10,k*18+w,-2);c.lineTo(k*12+w,-3);c.bezierCurveTo(k*9,-9,k*6,-14,k*1,-18);c.closePath();c.fill();c.stroke();}}
  // うしろ髪（ボブ）
  c.fillStyle=HAIR;c.beginPath();c.moveTo(-16.5,HY);c.bezierCurveTo(-18,HY-23,18,HY-23,16.5,HY);c.quadraticCurveTo(18.5,HY+11,15.5,HY+16);c.quadraticCurveTo(0,HY+19,-15.5,HY+16);c.quadraticCurveTo(-18.5,HY+11,-16.5,HY);c.closePath();c.fill();c.stroke();
  // あし
  for(const k of[-1,1]){const lf=Math.max(0,k*sw)*3,lx=k*4-2.5;c.fillStyle=SKIN;rr(c,lx,-11-lf,5,8,2);c.fill();c.stroke();
    if(cure){c.fillStyle='#fff';rr(c,lx-1,-6.5-lf,7,7,2.5);c.fill();c.stroke();c.fillStyle='#ff6fae';c.fillRect(lx-.6,-6-lf,6.2,1.8);}
    else{c.fillStyle='#ff9ac4';rr(c,lx-1,-4-lf,7,4.5,2);c.fill();c.stroke();}}
  // スカート
  if(cure){c.fillStyle='#fff';for(let i=0;i<7;i++)circ(c,-13.5+i*4.5,-8.4,2.9);
    const g=c.createLinearGradient(0,-23,0,-8);g.addColorStop(0,'#ffb0d8');g.addColorStop(1,'#ff5fa8');c.fillStyle=g;
    c.beginPath();c.moveTo(-7,-23);c.lineTo(7,-23);c.quadraticCurveTo(12,-16,15,-10);for(let i=0;i<5;i++){const x0=15-i*6;c.quadraticCurveTo(x0-3,-6.8,x0-6,-10);}c.quadraticCurveTo(-12,-16,-7,-23);c.closePath();c.fill();c.stroke();
    c.fillStyle='rgba(255,255,255,.85)';heartP(c,-7,-14,1.7);c.fill();heartP(c,7,-14,1.7);c.fill();heartP(c,0,-12,1.7);c.fill();}
  else{c.fillStyle='#7ea6d8';c.beginPath();c.moveTo(-7,-19);c.lineTo(7,-19);c.lineTo(10,-9);c.lineTo(-10,-9);c.closePath();c.fill();c.stroke();}
  // からだ
  if(cure){c.fillStyle='#fff';rr(c,-7.5,-29.5,15,9.5,4);c.fill();c.stroke();c.fillStyle='#ff8cc6';c.fillRect(-7,-22,14,2.2);}
  else{c.fillStyle='#fff';rr(c,-8.5,-29.5,17,12.5,4);c.fill();c.stroke();const cols=['#5ac8f0','#ff7ab0','#ffd84a','#3fae5a','#e84a4a','#3a5ac8'];for(let i=0;i<6;i++){c.fillStyle=cols[i];circ(c,-5+(i%3)*5,-26+(i/3|0)*4.5,1.7);}}
  const arm=(k,hx,hy)=>{const sx=k*7,sy=-27;c.strokeStyle=LN;c.lineWidth=5;c.beginPath();c.moveTo(sx,sy);c.lineTo(hx,hy);c.stroke();c.strokeStyle=SKIN;c.lineWidth=3;c.stroke();c.lineWidth=1.5;c.strokeStyle=LN;c.fillStyle=cure?'#fff':SKIN;circ(c,hx,hy,2.7);c.stroke();
    c.fillStyle=cure?'#ff8cc6':'#fff';circ(c,sx,sy+.5,cure?4.2:3.6);c.stroke();};
  const arms=()=>{if(pose==='win'){arm(-1,-21,HY-12+Math.sin(t*8)*1.5);arm(1,21,HY-12-Math.sin(t*8)*1.5);}
    else if(pose==='cast'){arm(-1,-10,-18);arm(1,17,-30);}
    else{arm(-1,-10,-17+sw*2.5);arm(1,10,-17-sw*2.5);}};
  arms();
  if(cure)bow(c,0,-26.5,'#ff4f9a',.9);
  // あたま
  c.fillStyle=SKIN;c.beginPath();c.ellipse(0,HY+2,14.5,13.5,0,0,TAU);c.fill();c.stroke();
  const blink=((t+.7)%3.6)<.13,lk=(o.look||0)*1.2;
  for(const k of[-1,1]){const ex=k*5.6+lk,ey=HY+5;
    if(blink||o.happy){c.lineWidth=1.9;c.beginPath();c.arc(ex,ey+1.5,3,Math.PI*1.1,Math.PI*1.9);c.stroke();c.lineWidth=1.5;}
    else if(o.ouch){c.lineWidth=1.8;c.beginPath();c.moveTo(ex-2.5*k,ey-2);c.lineTo(ex+2*k,ey);c.lineTo(ex-2.5*k,ey+2);c.stroke();c.lineWidth=1.5;}
    else{c.fillStyle='#3a1f2e';ell(c,ex,ey,3.2,4.1);const g=c.createLinearGradient(0,ey-1,0,ey+4);g.addColorStop(0,'#3a1f2e');g.addColorStop(1,cure?'#ee5aa6':'#8a5a3a');c.fillStyle=g;ell(c,ex,ey+1.1,2.4,2.8);
      c.fillStyle='#fff';ell(c,ex-1,ey-1.5,1.3,1.6);circ(c,ex+1.2,ey+2,.7);
      c.lineWidth=2;c.beginPath();c.ellipse(ex,ey,3.4,4.3,0,Math.PI*1.15,Math.PI*1.85);c.stroke();c.beginPath();c.moveTo(ex+k*3,ey-2.4);c.lineTo(ex+k*4.6,ey-3.6);c.stroke();c.lineWidth=1.5;}}

function line(c,a,b,x,y){c.beginPath();c.moveTo(a,b);c.lineTo(x,y);c.stroke();}
function darker(h,t=.25){return mix(h,'#000000',t);}
function mix(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)),A=p(a),B=p(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');}
function wearOf(wear,st){const d=DEFW[st],r={};
  for(const k of['top','hat','acc']){const v=wear&&wear[k];r[k]=v==='none'?null:v&&ITEM[v]?ITEM[v]:(d[k]?ITEM[d[k]]:null);}
  if(!r.top)r.top=ITEM[d.top];return r;}
function kidTop(st){const B=BODY[st];return((B.sit?5:B.leg)+B.bh+B.R*1.85)*B.s;}
const RAIN=['#ff6b6b','#ffa94a','#ffe066','#6cd46a','#5ab0f0','#a07af0'];
function pattern(c,pat,pc,x,y,w,h){
  if(!pat||pat==='plain')return;c.save();c.lineWidth=1;
  if(pat==='dot'){c.fillStyle=pc;let r=0;for(let yy=y+3;yy<y+h;yy+=6,r++)for(let xx=x+(r%2?3:0);xx<x+w+3;xx+=6)circ(c,xx,yy,1.3);}
  else if(pat==='confetti'){const cols=['#8fb0f0','#f0a860','#e88ab0','#8ad0a0','#b890e0','#f0d060'];for(let i=0;i<40;i++){c.fillStyle=cols[i%6];const px=x+((i*37+11)%97)/97*w,py=y+((i*53+7)%89)/89*h;circ(c,px,py,1.1+(i%3)*.35);}}
  else if(pat==='stripe'){c.fillStyle=pc;for(let yy=y+2;yy<y+h;yy+=6)c.fillRect(x,yy,w,2.6);}
  else if(pat==='check'){c.fillStyle=hexA(pc,.45);for(let yy=y;yy<y+h;yy+=7)c.fillRect(x,yy,w,3);for(let xx=x;xx<x+w;xx+=7)c.fillRect(xx,y,3,h);}
  else if(pat==='star'){c.fillStyle=pc;let r=0;for(let yy=y+4;yy<y+h+3;yy+=8,r++)for(let xx=x+(r%2?4:0);xx<x+w+4;xx+=8){starP(c,xx,yy,2.2,1);c.fill();}}
  else if(pat==='bigstar'){c.fillStyle=pc;starP(c,x+w/2,y+h*.42,Math.min(w,h)*.26,Math.min(w,h)*.11);c.fill();c.stroke();}
  else if(pat==='heart'){c.fillStyle=pc;let r=0;for(let yy=y+4;yy<y+h+3;yy+=8,r++)for(let xx=x+(r%2?4:0);xx<x+w+4;xx+=8){heartP(c,xx,yy,1.8);c.fill();}}
  else if(pat==='flower'){let r=0;for(let yy=y+5;yy<y+h+4;yy+=10,r++)for(let xx=x+(r%2?5:0);xx<x+w+5;xx+=10)flowerP(c,xx,yy,3,pc,'#ffe066');}
  else if(pat==='rainbow'){const bh=h/6;RAIN.forEach((cl,i)=>{c.fillStyle=hexA(cl,.85);c.fillRect(x,y+i*bh,w,bh+.5);});}
  c.restore();}

function drawKid(c,x,y,o){
  const st=o.stage,B=BODY[st],R=B.R,t=o.t||0,sit=!!B.sit&&!o.stand;

  const jump=o.jump?Math.abs(Math.sin(t*7))*7:0;
  c.translate(0,-jump-(o.lift||0));if(o.dir<0)c.scale(-1,1);if(o.rot)c.rotate(o.rot);

  // ---- うしろ ----
  if(acc){
    if(acc.st==='cape'){c.fillStyle=acc.col;c.beginPath();c.moveTo(-bw*.45,shY+2);c.lineTo(bw*.45,shY+2);c.quadraticCurveTo(bw*.95+Math.sin(t*3)*2,hipY*.3,bw*.8,-3);c.quadraticCurveTo(0,1,-bw*.8,-3);c.quadraticCurveTo(-bw*.95-Math.sin(t*3)*2,hipY*.3,-bw*.45,shY+2);c.fill();c.stroke();}

      if(acc.st==='wings'){c.fillStyle='#fff';c.beginPath();c.moveTo(0,0);c.bezierCurveTo(k*14,-18,k*34,-16,k*34,-4);c.quadraticCurveTo(k*28,0,k*30,6);c.quadraticCurveTo(k*20,6,k*22,12);c.quadraticCurveTo(k*10,10,0,6);c.closePath();c.fill();c.stroke();c.strokeStyle='#cfe0f5';line(c,k*8,-2,k*26,-6);line(c,k*8,3,k*22,4);c.strokeStyle=LN;}
      else{c.fillStyle='rgba(190,232,255,.75)';c.beginPath();c.ellipse(k*14,-10,15,9,k*-.5,0,TAU);c.fill();c.stroke();c.beginPath();c.ellipse(k*11,6,10,6,k*.4,0,TAU);c.fill();c.stroke();c.fillStyle='rgba(255,255,255,.8)';circ(c,k*16,-12,2);}
      c.restore();}}
    if(acc.st==='rand'){c.fillStyle=acc.col;rr(c,-bw*.66,shY+1,bw*1.32,th*.85,5);c.fill();c.stroke();c.fillStyle=darker(acc.col,.2);rr(c,-bw*.66,shY+1,bw*1.32,5,3);c.fill();}
  }
  if(sty==='hoodie'){c.fillStyle=darker(col,.12);ell(c,0,shY-1,bw*.5,6);c.stroke();}
  if(sty==='kigu'){c.fillStyle=col;if(top.kg==='dino'){c.fillStyle=col;c.beginPath();c.moveTo(-bw*.2,hipY-4);c.quadraticCurveTo(-bw*.9,hipY,-bw*1.1,-2);c.quadraticCurveTo(-bw*.6,-4,-bw*.1,hipY+2);c.fill();c.stroke();}

  const cover=skirt?0:longLeg?1:(sty==='tee'||sty==='hoodie'||sty==='sailor'||sty==='smock')?.45:sty==='romper'?.35:0;
  if(sit){
    for(const k of[-1,1]){c.fillStyle=SKIN;c.save();c.translate(k*bw*.42,-6);c.rotate(k*.28);ell(c,0,0,11,6.8);c.stroke();c.restore();

    if(sty==='gown'){c.fillStyle='rgba(255,255,255,.55)';for(let i=0;i<5;i++){const a=t*2+i*1.3;starP(c,Math.sin(a)*hw*.6,wY+(hemY-wY)*(.3+.13*i),2.2,.9);c.fill();}

    if(sty==='smock'){c.fillStyle='#fff';rr(c,-tw*.18,shY+th*.3,tw*.36,th*.22,2);c.fill();c.stroke();flowerP(c,-tw*.08,shY+th*.41,2.4,'#ff8cc6');c.strokeStyle=LN;
      c.fillStyle='#fff';circ(c,0,shY+th*.75,1.3);circ(c,0,hipY+2,1.3);}
  }else if(sty==='kimono'){
    const hemY=-2,hw=tw*.62;
    const bodyP=()=>{c.beginPath();c.moveTo(-tw/2+1,shY);c.lineTo(tw/2-1,shY);c.lineTo(hw,hemY);c.lineTo(-hw,hemY);c.closePath();};
    clipBody(bodyP,col,top.pat,pc,-hw,shY,hw*2,hemY-shY);
    c.strokeStyle='#fff';c.lineWidth=2.4;c.beginPath();c.moveTo(-tw*.3,shY);c.lineTo(tw*.12,shY+th*.45);c.moveTo(tw*.3,shY);c.lineTo(0,shY+th*.3);c.stroke();
    c.strokeStyle=LN;c.lineWidth=1.5;line(c,tw*.12,shY+th*.45,hw*.55,hemY);
    c.fillStyle=top.id==='t_kimono'?'#ffd84a':'#ff8cc6';rr(c,-tw/2+1,shY+th*.45,tw-2,th*.25,2);c.fill();c.stroke();
  }else{
    const r=sit?10:7;const by=sty==='kigu'?hipY+2:hipY+2;
    const bodyP=()=>{rr(c,-tw/2,shY,tw,by-shY,r);};

    if(sty==='romper'){c.strokeStyle=hexA(darker(col,.3),.7);c.lineWidth=1;line(c,1,shY+3,1,hipY);c.lineWidth=1.3;
      const rc=['#5ab0d8','#f0a860','#e88ab0'];for(let i=0;i<3;i++){c.strokeStyle=rc[i];c.beginPath();c.arc(1,shY+th*(.25+i*.25),1.6,0,TAU);c.stroke();}
      c.strokeStyle=LN;c.lineWidth=1.5;c.beginPath();c.arc(0,shY,R*.34,.15*Math.PI,.85*Math.PI);c.stroke();}

      c.fillStyle='#fff';c.beginPath();c.moveTo(-tw*.18,shY+1);c.lineTo(0,shY+th*.4);c.lineTo(tw*.18,shY+1);c.closePath();c.fill();
      c.fillStyle=pc;c.beginPath();c.moveTo(-4,shY+th*.42);c.lineTo(4,shY+th*.42);c.lineTo(0,shY+th*.62);c.closePath();c.fill();c.stroke();}
    if(sty==='hoodie'){c.fillStyle=darker(col,.1);rr(c,-tw*.3,shY+th*.55,tw*.6,th*.3,4);c.fill();c.stroke();c.strokeStyle='#fff';c.lineWidth=1.2;line(c,-3,shY+2,-3.5,shY+th*.35);line(c,3,shY+2,3.5,shY+th*.35);c.strokeStyle=LN;c.lineWidth=1.5;}

      c.fillStyle='#ffd84a';circ(c,-tw*.28,shY+th*.42,1.6);circ(c,tw*.28,shY+th*.42,1.6);c.fillStyle=darker(col2,.15);rr(c,-tw*.16,shY+th*.52,tw*.32,th*.2,2);c.fill();}

      else if(pc==='bow'){c.fillStyle='#222';for(const k of[-1,1]){c.beginPath();c.moveTo(0,shY+3);c.lineTo(k*5,shY);c.lineTo(k*5,shY+6);c.closePath();c.fill();}}
      else{c.fillStyle=pc;c.beginPath();c.moveTo(-2,shY+1);c.lineTo(2,shY+1);c.lineTo(2.6,shY+th*.45);c.lineTo(0,shY+th*.52);c.lineTo(-2.6,shY+th*.45);c.closePath();c.fill();c.stroke();}
      c.strokeStyle=darker(col,.35);line(c,-tw*.22,shY,-tw*.08,shY+th*.6);line(c,tw*.22,shY,tw*.08,shY+th*.6);c.strokeStyle=LN;

  if(skirt){const hemY=hipY+(-hipY)*.42,hw=tw*.7;const sp=()=>{c.beginPath();c.moveTo(-tw/2+1,hipY-4);c.lineTo(tw/2-1,hipY-4);c.lineTo(hw,hemY);c.quadraticCurveTo(0,hemY+2,-hw,hemY);c.closePath();};

const SKY=[['#bfe6ff','#eef9ff'],['#7ec8ff','#d8f0ff'],['#ff9a6a','#ffd8a0'],['#141a48','#3a3a7a']];
function roomPat(c,r,x,y,w,h){c.save();c.beginPath();c.rect(x,y,w,h);c.clip();const s=Math.max(18,w/14);
  c.fillStyle=r.w2;c.strokeStyle=r.w2;c.globalAlpha=.55;let row=0;
  for(let yy=y+s/2;yy<y+h+s;yy+=s,row++)for(let xx=x+(row%2?s/2:0);xx<x+w+s;xx+=s){
    if(r.pat==='plain'){c.globalAlpha=.35;c.fillRect(xx,y,1.5,h);if(row)continue;}
    else if(r.pat==='heart'){heartP(c,xx,yy,s*.16);c.fill();}
    else if(r.pat==='cloud'){ell(c,xx,yy,s*.28,s*.14);ell(c,xx-s*.15,yy+s*.02,s*.14,s*.1);}
    else if(r.pat==='leaf'){c.save();c.translate(xx,yy);c.rotate(row);ell(c,0,0,s*.2,s*.09);c.restore();}
    else if(r.pat==='stripe'){if(row)continue;c.fillRect(xx,y,s*.35,h);}
    else if(r.pat==='fish'){c.save();c.translate(xx,yy);ell(c,0,0,s*.16,s*.09);c.beginPath();c.moveTo(-s*.12,0);c.lineTo(-s*.26,-s*.08);c.lineTo(-s*.26,s*.08);c.fill();c.restore();}
    else if(r.pat==='star'){starP(c,xx,yy,s*.12,s*.05);c.fill();}
    else if(r.pat==='crown'){c.beginPath();c.moveTo(xx-s*.14,yy+s*.07);c.lineTo(xx-s*.16,yy-s*.08);c.lineTo(xx-s*.06,yy);c.lineTo(xx,yy-s*.12);c.lineTo(xx+s*.06,yy);c.lineTo(xx+s*.16,yy-s*.08);c.lineTo(xx+s*.14,yy+s*.07);c.fill();}
  }c.restore();}
function drawRoom(c,x,y,w,h,fy,r,tod,t,mini){
  r=r||ITEM.r_home;c.fillStyle=r.wall;c.fillRect(x,y,w,fy-y);roomPat(c,r,x,y,w,fy-y);
  // まど
  const wx=x+w*.07,wy=y+(fy-y)*.14,ww=w*.3,wh=(fy-y)*.55;
  const g=c.createLinearGradient(0,wy,0,wy+wh);g.addColorStop(0,SKY[tod][0]);g.addColorStop(1,SKY[tod][1]);
  c.fillStyle='#fff';rr(c,wx-4,wy-4,ww+8,wh+8,6);c.fill();c.fillStyle=g;c.fillRect(wx,wy,ww,wh);
  c.save();c.beginPath();c.rect(wx,wy,ww,wh);c.clip();
  if(tod===3){c.fillStyle='#fff6c0';circ(c,wx+ww*.7,wy+wh*.3,ww*.12);c.fillStyle=SKY[3][0];circ(c,wx+ww*.76,wy+wh*.25,ww*.11);c.fillStyle='#fff';for(let i=0;i<7;i++){c.globalAlpha=.5+.5*Math.sin(t*2+i*2);starP(c,wx+ww*((i*.37)%1),wy+wh*((i*.53)%1)*.8+4,2.5,1);c.fill();}c.globalAlpha=1;}
  else{c.fillStyle=tod===2?'#ff7a3a':'#ffe066';circ(c,wx+ww*.72,wy+wh*(tod===2?.75:.3),ww*.11);c.fillStyle='rgba(255,255,255,.9)';const cx=wx+((t*6)%(ww+60))-30;ell(c,cx,wy+wh*.55,ww*.14,wh*.07);ell(c,cx+ww*.08,wy+wh*.52,ww*.1,wh*.07);}
  c.restore();c.fillStyle='#fff';c.fillRect(wx+ww/2-2,wy,4,wh);c.fillRect(wx,wy+wh/2-2,ww,4);
  c.fillStyle='#ffb3d6';for(const k of[0,1]){c.beginPath();const cx0=k?wx+ww+6:wx-6;c.moveTo(cx0,wy-8);c.quadraticCurveTo(cx0+(k?-ww*.18:ww*.18),wy+wh*.4,cx0+(k?4:-4),wy+wh+6);c.lineTo(cx0+(k?12:-12),wy+wh+6);c.lineTo(cx0+(k?12:-12),wy-8);c.closePath();c.fill();}
  // たな
  if(!mini){const sx=x+w*.7,sw=w*.25,sy=fy-(fy-y)*.42,shh=(fy-y)*.42;c.fillStyle='#fff';c.strokeStyle='#e0d0c0';c.lineWidth=2;rr(c,sx,sy,sw,shh,4);c.fill();c.stroke();c.fillRect(sx,sy+shh*.5-1,sw,3);
    c.font=`${Math.min(sw*.3,shh*.36)}px sans-serif`;c.textAlign='center';c.textBaseline='bottom';c.fillText('🧸',sx+sw*.3,sy+shh*.48);c.fillText('🎡',sx+sw*.72,sy+shh*.48);c.fillText('🚂',sx+sw*.3,sy+shh*.97);c.fillText('📚',sx+sw*.72,sy+shh*.97);
    c.font=`${(fy-y)*.14}px sans-serif`;c.fillText('🌻',x+w*.56,y+(fy-y)*.4);c.strokeStyle='#c8a070';c.lineWidth=3;c.strokeRect(x+w*.47,y+(fy-y)*.12,w*.18,(fy-y)*.32);}
  // ゆか
  c.fillStyle=r.fl;c.fillRect(x,fy,w,y+h-fy);c.fillStyle=darker(r.wall,.12);c.fillRect(x,fy-3,w,5);
  c.strokeStyle=r.fl2;c.lineWidth=1.5;for(let i=-9;i<=9;i++){line(c,x+w/2+i*w*.09,fy,x+w/2+i*w*.3,y+h);}
  for(let i=0;i<14;i++){const yy=fy+(y+h-fy)*((i*.37)%1),xx=x+w*((i*.61)%1);line(c,xx,yy,xx+w*.08,yy);}
  if(tod===3){c.fillStyle='rgba(20,20,70,.28)';c.fillRect(x,y,w,h);}
}

let parts=[],floats=[];
function burst(x,y,n,kind,opt={}){for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(opt.v0||40,opt.v1||140);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(opt.up||60),g:opt.g??160,life:rnd(.7,1.2)*(opt.life||1),t:0,kind,e:opt.e,col:opt.col||pick(['#ff6fae','#ffd84a','#5ac8f0','#7ad06a','#b890f0']),s:rnd(.7,1.3)*(opt.s||1),rot:rnd(0,TAU)});}}
function floatT(x,y,s,col='#ff4f9a'){floats.push({x,y,s,col,t:0});}
function updParts(dt){for(const p of parts){p.t+=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=dt*3;}parts=parts.filter(p=>p.t<p.life);for(const f of floats)f.t+=dt;floats=floats.filter(f=>f.t<1.4);}
function drawParts(c){for(const p of parts){const a=1-p.t/p.life;c.globalAlpha=Math.min(1,a*2);
  if(p.kind==='heart'){c.fillStyle=p.col;heartP(c,p.x,p.y,6*p.s*L.U);c.fill();}
  else if(p.kind==='star'){c.fillStyle=p.col;starP(c,p.x,p.y,7*p.s*L.U,3*p.s*L.U,5,p.rot);c.fill();}
  else if(p.kind==='conf'){c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=p.col;c.fillRect(-4*L.U,-2*L.U,8*L.U,4*L.U);c.restore();}
  else if(p.kind==='emoji'){c.font=`${22*p.s*L.U}px sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(p.e,p.x,p.y);}
  else if(p.kind==='drop'){c.fillStyle='rgba(120,190,255,.85)';ell(c,p.x,p.y,2.5*L.U,4*L.U);}
  else if(p.kind==='bub'){c.strokeStyle='rgba(120,170,230,.8)';c.lineWidth=1.5;c.fillStyle='rgba(255,255,255,.6)';c.beginPath();c.arc(p.x,p.y,5*p.s*L.U,0,TAU);c.fill();c.stroke();}
  else if(p.kind==='note'){c.font=`900 ${18*p.s*L.U}px ${FONT}`;c.fillStyle=p.col;c.textAlign='center';c.fillText(pick(['♪','♫'])&&p.e||'♪',p.x,p.y);}
  }c.globalAlpha=1;
  for(const f of floats){const a=f.t/1.4;c.globalAlpha=1-a*a;otext(c,f.s,f.x,f.y-a*50*L.U,20*L.U,'#fff',f.col);}c.globalAlpha=1;}

let mode='title',MT=0;// モードの けいか じかん
function addG(k,v){S.g[k]=clamp(S.g[k]+v,0,100);}
function applyFx(fx){if(!fx)return[];const out=[];
  for(const k of['hun','cln','moo','ene'])if(fx[k])addG(k,fx[k]);
  if(fx.coin){S.coin=Math.max(0,S.coin+fx.coin);out.push((fx.coin>0?'+':'')+fx.coin+'🪙');}
  if(fx.exp){S.exp+=fx.exp;out.push('🌱+'+fx.exp);}
  if(fx.item){const it=randomItem();if(it){S.own[it.id]=1;out.push(it.e+it.n);fx._item=it;}else{S.coin+=50;out.push('+50🪙');fx._item={e:'🪙',n:'コイン 50まい'};}}
  if(fx.lot){const v=pick([10,10,20,30,50,100,300]);S.coin+=v;fx._lot=v;out.push('+'+v+'🪙');}
  return out;}
function randomItem(){const c=ITEMS.filter(i=>(i.c==='top'||i.c==='hat'||i.c==='acc')&&!i.hid&&!i.g&&!S.own[i.id]&&i.p<=260);return c.length?pick(c):null;}
function mood(){const g=S.g,avg=(g.hun+g.cln+g.moo+g.ene)/4,lo=Math.min(g.hun,g.cln,g.moo,g.ene);return lo<20?.5:avg>=70?1.5:1;}
function fmt(s){return s.replace(/\{n\}/g,S.name);}

function finish(kind,o={}){mode='home';setTip(null);
  const dec={hun:-8,cln:-6,moo:-5,ene:-7};
  for(const k in dec)if(!(o.keep||[]).includes(k))addG(k,dec[k]);
  applyFx(o.fx);
  let e=Math.max(1,Math.round((o.exp||2)*mood()));if(TRAITS[S.trait][2]===kind)e+=1;
  S.exp+=e;const coin=o.coin??(3+(Math.random()*5|0));S.coin+=coin;
  const cx=L.rx,cy=L.gy-kidTop(S.stage)*L.KS-20*L.U;floatT(cx,cy,'🌱+'+e,'#3fae5a');if(coin)setTimeout(()=>floatT(cx+30*L.U,cy+10*L.U,'+'+coin+'🪙','#e0a000'),250);SFX.coin();
  if(kind!=='sleep'){S.acts++;if(S.acts>=2&&S.tod<3){S.tod++;S.acts=0;S.pets=0;}}
  save();updHUD();
  // イベント
  if(!o.noEvent&&Math.random()<(o.evRate??.3)){const ev=pickEvent(kind);if(ev)q(()=>showEvent(ev));}
  q(checkProgress);
  runQ();}
function pickEvent(kind){const pool=EVENTS.filter(e=>S.stage>=e.s[0]&&S.stage<=e.s[1]&&(e.on==='any'||e.on===kind));if(!pool.length)return null;
  const w=pool.map(e=>S.evGen[e.id]?1:4);let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<pool.length;i++){r-=w[i];if(r<0)return pool[i];}return pool[0];}
function showEvent(ev){S.evGen[ev.id]=1;const nw=!S.dex.ev[ev.id];S.dex.ev[ev.id]=(S.dex.ev[ev.id]||0)+1;SFX.baby();
  if(ev.ch){panel({icon:ev.e,title:ev.t,html:`<p>${fmt(ev.m)}</p>`+(nw?'<p class="small">✨ あたらしい イベント！</p>':''),col:1,btns:ev.ch.map(ch=>[ch[0],()=>{const fx=Object.assign({},ch[1]);const r=applyFx(fx);save();updHUD();
      q(()=>panel({icon:ev.e,title:'',html:`<p>${fmt(ch[2])}</p><p class="small">${r.join(' ')}</p>`}));exprR('happy',1.5,true);},'sub'])});return;}
  const fx=Object.assign({},ev.fx);const r=applyFx(fx);save();updHUD();
  let m=fmt(ev.m).replace('{item}',fx._item?fx._item.e+' '+fx._item.n:'');
  if(fx._lot)m+=`<br>${fx._lot>=100?'🎉 おおあたり！':''} ${fx._lot}コイン！`;
  panel({icon:ev.e,title:ev.t,html:`<p>${m}</p><p class="small">${r.join(' ')}</p>`+(nw?'<p class="small">✨ あたらしい イベント！</p>':'')});}

function checkProgress(){const need=STAGES[S.stage].need;
  if(S.exp>=need/2&&!S.miles[S.stage]){S.miles[S.stage]=1;save();milestone();return;}
  if(S.exp>=need){stageUp();return;}
  runQ();}
function milestone(){const st=S.stage;SFX.yay();exprR('happy',2,true);
  if(st===0){S.word=pick(FIRSTWORDS);S.coin+=30;save();panel({icon:'🗣️',title:'はじめて しゃべった！',html:`<p>{n}が「<b style="color:#ff4f9a;font-size:22px">${S.word}</b>」って いったよ！</p><p class="small">+30🪙</p>`.replace('{n}',S.name)});sayR(S.word,3);return;}

  else if(E&&(E.phase==='wait'||E.phase==='move')){const p=E.phase==='move'?Math.min(1,E.t/.45):0,e2=p*p*(3-2*p);

function drawMug(c,x,y,s,lv,sip){c.save();c.translate(x,y);c.scale(s,s);c.lineWidth=1.6;c.strokeStyle='#b8a898';

// ---------- おふろ ----------
let BT=null;
function startBath(){mode='bath';MT=0;showBar(false);BT={clean:0,foam:[],phase:'scrub',t:0,ducks:[{x:-.3,j:0},{x:.28,j:0},{x:.05,j:0}],last:null};setTip('リッキーを こすって あわあわ！'.replace('リッキー',S.name));sayF('ごしごし しようね！');}
function bathGeo(){const U=L.U,B=BODY[S.stage],tw=Math.min(W*.66,280*U),cx=W*.6,tx=cx-tw/2,ty=L.gy-70*U;return{U,tw,tx,ty,kx:cx,ky:ty+(B.sit?34*U:30*U+B.leg*B.s*L.KS*.95)};}
function drawBath(c){const g=bathGeo(),U=g.U;
  c.fillStyle='#dff3ff';c.fillRect(0,0,W,H);c.strokeStyle='#bfe0f5';c.lineWidth=2;const ts=34*U;for(let y=0;y<H;y+=ts)line(c,0,y,W,y);for(let x=0;x<W;x+=ts)line(c,x,0,x,L.gy-60*U);
  c.fillStyle='#bfe0f5';c.fillRect(0,L.gy-60*U,W,H);
  // シャワー
  const shx=W-50*U,shy=L.top+40*U;c.fillStyle='#c8d0d8';c.strokeStyle='#8a98a8';c.lineWidth=2;rr(c,shx-4*U,shy,8*U,60*U,4*U);c.fill();c.stroke();c.save();c.translate(shx,shy);c.rotate(-.5);rr(c,-18*U,-8*U,26*U,16*U,6*U);c.fill();c.stroke();c.restore();
  if(BT&&BT.phase==='rinse'){drawGlow(c,'#8fd0ff',shx-14*U,shy,30*U,.5+.4*Math.sin(CLK*8));}
  // よくそう（うしろ）
  c.fillStyle='#8fd0ff';rr(c,g.tx,g.ty,g.tw,24*U,12*U);c.fill();
  drawFutan(c,Math.min(W*.16,g.tx-10*U),L.gy+20*U,futOpts({s:L.FS*.95,pose:BT&&BT.phase==='scrub'&&BT.last?'cast':'run',look:1}));
  const kex=RK.exprT>0?RK.expr:(BT&&BT.phase==='rinse'?'wow':'happy');
  drawKid(c,g.kx,g.ky,kidOpts({s:L.KS*.95,expr:kex,wear:{top:'t_bath',hat:'none',acc:'none'},noShadow:true,pose:'up'}));
  if(BT){for(const f of BT.foam){c.globalAlpha=f.a;c.fillStyle='#fff';c.strokeStyle='rgba(150,190,230,.7)';c.lineWidth=1.2;c.beginPath();c.arc(g.kx+f.x*U,g.ky+f.y*U,f.r*U,0,TAU);c.fill();c.stroke();}c.globalAlpha=1;}
  // よくそう（まえ）
  
  c.fillStyle='#fff';c.strokeStyle='#f0a8c8';c.lineWidth=3;rr(c,g.tx,g.ty+18*U,g.tw,H-g.ty,20*U);c.fill();c.stroke();
  c.fillStyle='#ffd0e6';for(let i=0;i<6;i++)heartP(c,g.tx+g.tw*(.12+i*.15),g.ty+50*U,5*U),c.fill();
  c.fillStyle='#fff';for(let i=0;i<9;i++){circ(c,g.tx+g.tw*(i/8),g.ty+16*U+Math.sin(CLK*2+i)*2,(10+(i%3)*4)*U);}
  if(BT)for(const d of BT.ducks){const dx=g.kx+d.x*g.tw+Math.sin(CLK+d.x*9)*6*U,dy=g.ty+12*U-d.j*20*U;c.font=`${28*U}px sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText('🦆',dx,dy);d.px=dx;d.py=dy;}
  if(BT&&BT.phase!=='done'){const bw=180*U,bx=W/2-bw/2,by=L.top+22*U;c.fillStyle='#fff';c.strokeStyle='#8fd0ff';c.lineWidth=3;rr(c,bx,by,bw,18*U,9*U);c.fill();c.stroke();c.fillStyle='#5ac8f0';rr(c,bx+3,by+3,Math.max(0,(bw-6)*Math.min(1,BT.clean/100)),18*U-6,6*U);c.fill();otext(c,BT.phase==='scrub'?'あわあわ':'シャワー！',W/2,by+9*U,13*U,'#fff','#3a98c8');}
  if(RK.say)bubble(c,g.kx,g.ky-kidTop(S.stage)*L.KS*.95-8*U,RK.say,16*U);
  if(FU.say)bubble(c,Math.max(80,W*.2),L.gy-50*L.FS,FU.say,15*U);}
ITEMS.push({id:'t_bath',c:'top',hid:1,n:'',e:'',st:'tee',col:SKIN,col2:SKIN});ITEM.t_bath=ITEMS[ITEMS.length-1];
function bathMove(x,y){if(!BT||BT.phase!=='scrub')return;const g=bathGeo(),U=g.U;const dx=(x-g.kx)/U,dy=(y-g.ky)/U;const top=kidTop(S.stage)*1.5*.95;
  if(Math.abs(dx)<50&&dy<10&&dy>-top-10){if(BT.last){const d=Math.hypot(x-BT.last[0],y-BT.last[1])/U;BT.clean+=Math.min(d,30)*.35;if(d>6){BT.foam.push({x:dx+rnd(-6,6),y:dy+rnd(-6,6),r:rnd(5,10),a:1});if(BT.foam.length>70)BT.foam.shift();SFX.scrub();}}
    BT.last=[x,y];if(Math.random()<.04)sayR(talk('bath'),1.2);
    if(BT.clean>=100){BT.phase='rinse';BT.clean=100;setTip('シャワーを タップして ながそう！');sayF('シャワー するよ〜');}}
  else BT.last=null;}
function bathTap(x,y){if(!BT)return;for(const d of BT.ducks){if(d.px&&Math.hypot(x-d.px,y-d.py)<24*L.U){d.j=1;SFX.quack();return;}}
  if(BT.phase==='rinse'){BT.phase='shower';BT.t=0;SFX.splash();setTip(null);}}
function updBath(dt){if(!BT)return;BT.t+=dt;for(const d of BT.ducks)d.j=Math.max(0,d.j-dt*2.5);
  if(BT.phase==='shower'){const g=bathGeo();for(let i=0;i<3;i++)parts.push({x:g.kx+rnd(-50,50)*L.U,y:L.top+60*L.U,vx:rnd(-20,20),vy:rnd(200,300),g:400,life:.9,t:0,kind:'drop',s:1,rot:0});
    for(const f of BT.foam)f.a=Math.max(0,f.a-dt*.8);if(BT.t>1.6){BT.phase='done';BT.t=0;exprR('happy',1.8,true);sayR(talk('bath'),1.8);SFX.yay();burst(g.kx,g.ky-40*L.U,10,'star');}}
  if(BT.phase==='done'&&BT.t>1.8){BT=null;mode='home';finish('bath',{fx:{cln:100,moo:12},keep:['cln'],exp:2});}}

function startMini(id){mode='mini';MT=0;showBar(false);S.dex.mg[id]=1;const def=MGS[id];MG=Object.assign({id,t:0,score:0,done:0},def.init.call(def));setTip(MINIS.find(m=>m.id===id).d);setTimeout(()=>setTip(null),2600);}

function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;CLK+=dt;MT+=dt;
  RK.sayT-=dt;if(RK.sayT<=0)RK.say=null;RK.exprT-=dt;RK.jump-=dt;RK.poseT-=dt;FU.sayT-=dt;if(FU.sayT<=0)FU.say=null;FU.poseT-=dt;
  if(mode==='eat')updEat(dt);else if(mode==='bath')updBath(dt);else if(mode==='sleep')updSleep(dt);else if(mode==='out')updOut(dt);else if(mode==='mini')updMini(dt);
  updParts(dt);
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,W,H);
  if(mode==='home'||mode==='title')drawHome(c);else if(mode==='eat')drawEat(c);else if(mode==='bath')drawBath(c);else if(mode==='sleep')drawSleep(c);else if(mode==='out'&&OT)drawOut(c);else if(mode==='mini'&&MG)MGS[MG.id].draw(c,MG);else if(mode==='cere')drawCere(c);else drawHome(c);
  drawParts(c);drawPVs();bgmTick();
  requestAnimationFrame(loop);}

// ================= タイトル =================
function title(){mode='title';showUI(false);const has=load();const tb=$('tbtn');
  tb.innerHTML=has?`<button class="btn" id="bc">つづきから</button><button class="btn sub" id="bn">さいしょから</button>`:`<button class="btn" id="bn">はじめる</button>`;
  if(has)S=has;
  $('bn').onclick=()=>{au();SFX.tap();if(has){$('title').classList.remove('show');panel({icon:'⚠️',title:'さいしょから はじめる？',html:'<p>いまの データは きえちゃうよ</p>',btns:[['やめる',()=>{$('title').classList.add('show');},'sub'],['はじめる',()=>{S=newState();begin(true);},'gry']]});}else{S=newState();begin(true);}};
  if(has)$('bc').onclick=()=>{au();SFX.tap();begin(false);};}
function begin(fresh){$('title').classList.remove('show');if(fresh){S.name='リッキー';initGen();S.hs=1;S.started=true;save();}
  showUI(true);updHUD();mode='home';
  if(fresh){showBar(false);q(()=>panel({icon:'🍼',title:'ようこそ！',html:`<p>ふーたん（4さい）は、いもうと リッキーの おねえちゃん。</p><p>ミルクを あげたり、おふろに いれたり、いっしょに あそんで あかちゃんの リッキーを おおきく そだてよう！</p><p class="small">ほいくえん → ようちえん → しょうがっこう → … → けっこん → そして あかちゃんへ</p>`,btns:[['おせわ はじめる！']]}));
    q(()=>{sayF('リッキー、おねえちゃんだよ！',2.4);setTimeout(()=>sayR('あぶー！',1.8),900);runQ();});runQ();}
  else{sayF('おかえり！',1.6);}}
resize();title();requestAnimationFrame(loop);
</script>
