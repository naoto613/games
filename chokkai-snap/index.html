<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3c3c42">
<title>ちょっかいスナップ</title>
<style>
  :root{--ink:#2e2a30;--sub:#6e6872;--bezel:#45454b;--bezel2:#36363b;--btn:#8a8a90;--btn2:#cfcfd4;--yellow:#ffd21e;--yellow2:#e0a800;--pink:#ff5f8f;--blue:#3a8ad8;--panel:#f6f3ec;--line:#d9d2c4;--ok:#2f9e6a;--ng:#c94b4b;
    --st:max(8px,env(safe-area-inset-top));--sl:max(8px,env(safe-area-inset-left));--sr:max(8px,env(safe-area-inset-right));--sb:max(6px,env(safe-area-inset-bottom));--barh:50px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bezel);overflow:hidden;overscroll-behavior:none;color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #app{position:fixed;inset:0;width:100vw;height:100dvh;background:radial-gradient(120% 90% at 50% 0%,#55555c,var(--bezel) 55%,var(--bezel2))}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
  .hidden{display:none!important}
  /* 画面枠（ベゼル）と画面 */
  #view{position:absolute;top:var(--st);left:var(--sl);right:var(--sr);bottom:calc(var(--sb) + var(--barh));border-radius:20px;overflow:hidden;background:#1b1b20;
    box-shadow:0 0 0 3px #2c2c31,0 0 0 5px #6a6a70,inset 0 0 0 2px rgba(255,255,255,.15)}
  .game-root{position:absolute;inset:0;touch-action:none;overscroll-behavior:none;display:block}
  #view.off{bottom:var(--sb)}
  /* 四隅のボタン（35章 HUD） */
  .corner{position:absolute;z-index:5;width:64px;height:64px;background:var(--bezel);display:grid;place-items:center;pointer-events:auto}
  .corner.tl{top:var(--st);left:var(--sl);border-radius:20px 0 22px 0}
  .corner.tr{top:var(--st);right:var(--sr);border-radius:0 20px 0 22px}
  .corner.bl{bottom:calc(var(--sb) + var(--barh));left:var(--sl);border-radius:0 22px 0 20px}
  .corner.br{bottom:calc(var(--sb) + var(--barh));right:var(--sr);border-radius:22px 0 20px 0}
  .cbtn{width:50px;height:50px;border-radius:14px;background:linear-gradient(#9a9aa0,#77777d);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.25),0 2px 0 #2c2c31;display:grid;place-items:center;color:#fff;position:relative}
  .cbtn:active{transform:translateY(2px)}
  .cbtn svg{width:30px;height:30px}
  .cbtn.yellow{background:linear-gradient(#ffe25a,#f2b800);color:#3a2a00}
  .cbtn[disabled]{opacity:.45}
  #card .cbtn{background:linear-gradient(#ffffff,#dcdce2)}
  #card.empty .cbtn{background:linear-gradient(#9a9aa0,#77777d)}
  #card canvas{position:absolute;inset:3px;width:44px;height:44px;border-radius:11px}
  #card.empty canvas{display:none}
  #card:not(.empty) .hand{display:none}
  #card.pop .cbtn{animation:pop .3s}
  @keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
  #cardLabel{position:absolute;top:66px;right:4px;white-space:nowrap;background:#fff;border:3px solid var(--yellow2);border-radius:12px;padding:3px 10px;font-weight:900;font-size:14px;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.25);pointer-events:none}
  #card.empty #cardLabel{display:none}
  #cardDiscard{position:absolute;top:-6px;left:-6px;width:26px;height:26px;border-radius:50%;background:#e04848;color:#fff;font-size:14px;font-weight:900;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.3);z-index:2}
  #cardDiscard::before{content:"";position:absolute;inset:-10px}
  /* 下部バー：チョッカイ数・スコア・ノコリジカン */
  #bar{position:absolute;left:var(--sl);right:var(--sr);bottom:var(--sb);height:var(--barh);display:flex;align-items:center;gap:10px;padding:6px 4px 2px;color:#fff;pointer-events:none}
  .digits{display:flex;gap:3px;align-items:center}
  .digits b{width:26px;height:34px;border-radius:7px;background:#fff6c8;border:3px solid var(--yellow2);color:#d8434e;font-size:22px;font-weight:900;display:grid;place-items:center;font-variant-numeric:tabular-nums;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
  .digits small{font-size:11px;font-weight:900;line-height:1.05;color:var(--yellow);margin-left:4px;letter-spacing:.05em}
  #score{font-weight:900;font-size:13px;color:#ddd;white-space:nowrap}
  #stageName{font-weight:900;font-size:13px;color:#cfcfd4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
  #timer{position:relative;flex:0 1 46%;height:34px;border-radius:10px;background:#2a2a2e;border:3px solid #77777d;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
  #timer i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ffe25a,#f0b400);transition:width .3s linear}
  #timer span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:15px;color:#2e2600;letter-spacing:.15em;text-shadow:0 1px 0 rgba(255,255,255,.6)}
  #timer span em{font-style:normal;font-variant-numeric:tabular-nums;letter-spacing:0}
  #timer.low i{background:linear-gradient(#ff8a8a,#e04848);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.65}}
  #toast{position:absolute;left:50%;bottom:calc(var(--sb) + var(--barh) + 74px);transform:translateX(-50%);background:rgba(40,36,44,.88);color:#fff;padding:6px 14px;border-radius:12px;font-weight:800;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:min(64vw,560px);text-align:center;z-index:8;border:2px solid rgba(255,255,255,.25)}
  #toast.show{opacity:1}
  #tutorialBar{position:absolute;left:50%;top:calc(var(--st) + 10px);transform:translateX(-50%);width:min(70vw,620px);background:#fff8d6;border:3px solid var(--yellow2);border-radius:14px;padding:8px 14px;font-weight:800;font-size:15px;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.25);pointer-events:none;z-index:6}
  .scorepop{position:absolute;font-weight:900;color:#fff;font-size:22px;text-shadow:0 2px 0 #c2185b,0 0 6px #c2185b;pointer-events:none;animation:up 1.1s forwards;z-index:7}
  @keyframes up{to{transform:translateY(-50px);opacity:0}}
  /* スタート表示 */
  #banner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:6}
  #banner .big1{font-size:clamp(54px,14vmin,120px);font-weight:900;color:var(--yellow);letter-spacing:.06em;-webkit-text-stroke:4px #fff;paint-order:stroke fill;transform:skewX(-8deg);text-shadow:0 6px 0 rgba(0,0,0,.25);animation:bannerIn .5s cubic-bezier(.2,1.4,.4,1)}
  #banner .sub1{margin-top:6px;font-size:clamp(16px,4vmin,26px);font-weight:900;color:#fff;background:rgba(40,36,44,.75);padding:4px 16px;border-radius:99px}
  @keyframes bannerIn{from{transform:skewX(-8deg) scale(2.2);opacity:0}to{transform:skewX(-8deg) scale(1);opacity:1}}
  /* 画面（タイトル・ステージ選択・図鑑・設定・結果） */
  .screen{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;z-index:10;
    background:radial-gradient(120% 90% at 50% 0%,#55555c,var(--bezel) 55%,var(--bezel2));
    padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
  .screen.overlay{background:rgba(30,28,34,.6);display:flex;align-items:center;justify-content:center}
  .panel{background:var(--panel);border-radius:22px;border:4px solid #2c2c31;outline:3px solid #6a6a70;padding:16px;max-width:780px;margin:0 auto;box-shadow:0 10px 0 rgba(0,0,0,.25)}
  .overlay .panel{width:min(92vw,560px);max-height:90dvh;overflow:auto}
  h1{margin:4px 0 2px;font-size:clamp(30px,min(7.5vw,10vh),58px);font-weight:900;color:var(--yellow);letter-spacing:.06em;-webkit-text-stroke:3px #2e2a30;paint-order:stroke fill;transform:skewX(-6deg)}
  h2{margin:0 0 10px;font-size:22px;font-weight:900}
  h3{margin:14px 0 6px;font-size:17px;font-weight:900}
  .lead{color:var(--sub);font-weight:700;margin:0 0 14px;line-height:1.65}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 18px;border-radius:16px;background:linear-gradient(#ffe25a,#f2b800);color:#2e2600;font-weight:900;font-size:18px;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 4px 0 #a07800;width:100%}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a07800}
  .btn.sub{background:linear-gradient(#fff,#ebe8e2);color:var(--ink);box-shadow:0 4px 0 #b8b0a2;border:2px solid var(--line)}
  .btn.blue{background:linear-gradient(#6ab0f0,#3a8ad8);color:#fff;box-shadow:0 4px 0 #1f5f9e}
  .btn.small{min-height:44px;font-size:15px;padding:6px 12px}
  .grid{display:grid;gap:10px}
  .g2{grid-template-columns:1fr 1fr}
  .stages{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
  .stage{background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px;text-align:left;min-height:120px;display:flex;flex-direction:column;gap:4px;box-shadow:0 4px 0 #cfc6b6}
  .stage.locked{opacity:.5}
  .stage .no{font-size:13px;font-weight:900;color:#c08a00}
  .stage .tt{font-size:19px;font-weight:900}
  .stage .meta{font-size:13px;color:var(--sub);font-weight:700}
  .bar{display:block;height:8px;background:#e6e1d6;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd21e,#ff9f1e)}
  .tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
  .tabs button{min-height:44px;padding:6px 14px;border-radius:99px;background:#fff;border:2px solid var(--line);font-weight:800;white-space:nowrap}
  .tabs button.on{background:var(--yellow);border-color:var(--yellow2)}
  .elist{list-style:none;padding:0;margin:0;display:grid;gap:6px}
  .elist li{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;gap:10px;align-items:center;min-height:48px}
  .elist li.unk{color:#aaa}
  .elist .id{font-size:11px;color:var(--sub);font-weight:800;width:54px;flex:none}
  .elist .t{flex:1;font-weight:800}
  .elist .pt{font-size:12px;font-weight:900;color:#d8434e}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);min-height:52px}
  .row label{font-weight:800}
  .row select,.row input[type=range]{min-height:40px;font:inherit}
  .seg{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
  .seg button{min-height:42px;padding:4px 12px;font-weight:800;background:#fff}
  .seg button.on{background:var(--yellow)}
  .toggle{width:60px;height:34px;border-radius:99px;background:#ccc;position:relative;flex:none}
  .toggle.on{background:var(--ok)}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;transition:left .15s}
  .toggle.on::after{left:29px}
  .big{font-size:44px;font-weight:900;color:var(--yellow);text-align:center;margin:6px 0;-webkit-text-stroke:3px #2e2a30;paint-order:stroke fill;transform:skewX(-6deg)}
  .stats{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-weight:800;margin:10px 0}
  .stats span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
  .note{font-size:12px;color:var(--sub);font-weight:700;line-height:1.6}
  .preview{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:10px;border:2px solid var(--line)}
  .preview canvas{width:120px;height:120px;background:#f4eee6;border-radius:12px;flex:none}
  .preview .bub{position:relative;background:#fff;border:2px solid #444;border-radius:12px;padding:8px 10px;font-weight:800;animation:pop .35s}
  .titleart{width:min(100%,520px);aspect-ratio:2/1;border-radius:16px;border:4px solid #2c2c31;display:block;margin:4px auto 8px;background:#9fd4f5}
  /* デバッグ（44-46章） */
  #debugBtn{position:absolute;left:50%;top:0;transform:translateX(-50%);z-index:6;width:44px;height:24px;border-radius:0 0 10px 10px;background:var(--bezel);font-size:13px;pointer-events:auto}
  #inspector{position:absolute;right:0;top:0;bottom:0;width:min(46vw,340px);background:rgba(10,10,20,.82);color:#cfe;font:12px/1.45 ui-monospace,Menlo,monospace;padding:10px;padding-top:max(10px,env(safe-area-inset-top));overflow:auto;pointer-events:auto;white-space:pre-wrap;touch-action:pan-y;z-index:9}
  .dbg{font:13px/1.5 ui-monospace,Menlo,monospace}
  .dbg .ok{color:var(--ok)} .dbg .ng{color:var(--ng)}
  .dbg li{list-style:none}
  .status-COMPLETED{color:var(--ok)} .status-INVALIDATED{color:#999;text-decoration:line-through} .status-AVAILABLE,.status-ARMED{color:#d07a00} .status-LOCKED{color:#888}
  .graph{overflow:auto;max-height:70dvh;background:#fff;border-radius:12px;border:2px solid var(--line);touch-action:pan-x pan-y}
  @media (max-width:560px){#stageName{display:none}#timer{flex-basis:52%}#timer span{letter-spacing:.05em;font-size:13px}.digits b{width:22px;height:30px;font-size:19px}}
  @media (max-height:420px){:root{--barh:44px}.corner{width:58px;height:58px}.cbtn{width:46px;height:46px}#card canvas{width:40px;height:40px}#cardLabel{top:60px}}
  @media (orientation:landscape){.titleart{width:auto;height:min(42vh,260px)}}
  .hc #timer{border-color:#fff}.hc .cbtn{outline:2px solid #fff}
</style>
</head>
<body>
<div id="app">
  <div id="view"><canvas id="world" class="game-root"></canvas></div>
  <div id="hud" class="hidden">
    <div class="corner tl"><button id="pauseBtn" class="cbtn" aria-label="メニュー"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><rect x="3.5" y="6" width="17" height="13" rx="3"/><circle cx="12" cy="12.5" r="3.6"/><path d="M8.5 6l1.5-2.5h4L15.5 6"/></svg></button></div>
    <div class="corner tr" id="card"><button class="cbtn" id="cardBtn" aria-label="取りこんだ画像"><svg class="hand" viewBox="0 0 24 24" fill="currentColor"><path d="M8 11V4.5a1.5 1.5 0 013 0V10h.5V3a1.5 1.5 0 013 0v7h.5V4.5a1.5 1.5 0 013 0V11h.3V7.5a1.5 1.5 0 013 0V14c0 4.4-3 7.5-7.3 7.5-3 0-4.6-1.3-6-3.4L4.2 13.6a1.6 1.6 0 012.6-1.8L8 13.4z"/></svg><canvas id="cardThumb" width="104" height="104"></canvas><span id="cardDiscard" class="hidden" role="button" aria-label="画像を捨てる">✕</span></button><div id="cardLabel"></div></div>
    <div class="corner bl"><button id="hintBtn" class="cbtn" aria-label="ヒント"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"><path d="M12 20.5s-8-4.7-8-10.6A4.5 4.5 0 0112 7a4.5 4.5 0 018 2.9c0 5.9-8 10.6-8 10.6z"/></svg></button></div>
    <div class="corner br"><button id="zoomBtn" class="cbtn yellow" aria-label="全体を見る"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
    <div id="bar">
      <div class="digits" id="count"><b>0</b><b>0</b><b>0</b><small>チョッ<br>カイ</small></div>
      <div id="score">0点</div>
      <div id="stageName"></div>
      <div id="timer"><i></i><span>ノコリジカン <em></em></span></div>
    </div>
    <button id="debugBtn" class="hidden" aria-label="デバッグ">🐞</button>
  </div>
  <div id="banner" class="hidden"></div>
  <div id="tutorialBar" class="hidden"></div>
  <div id="toast"></div>
  <div id="inspector" class="hidden"></div>
  <div id="screen" class="screen"></div>
</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
