<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a2032">
<title>ちょっかいスナップ</title>
<style>
  :root{--ink:#3a2a44;--sub:#7a6a8a;--accent:#ff5fa2;--accent2:#5fb4ff;--panel:#fffaf3;--line:#e8d6c4;--dark:#2a2032;--ok:#2f9e6a;--ng:#c94b4b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--dark);overflow:hidden;overscroll-behavior:none;color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #app{position:fixed;inset:0;width:100vw;height:100dvh}
  .game-root{position:absolute;inset:0;touch-action:none;overscroll-behavior:none;display:block}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
  .hidden{display:none!important}
  /* HUD（35章） */
  .hud{position:absolute;inset:0;pointer-events:none;
    padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));
    padding-top:max(8px,env(safe-area-inset-top));padding-bottom:max(8px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:space-between}
  .hud > *{pointer-events:none}
  .hud button,.hud .card{pointer-events:auto}
  .top,.bottom{display:flex;align-items:center;gap:8px}
  .top{justify-content:space-between}
  .bottom{justify-content:space-between;align-items:flex-end}
  .pill{background:rgba(30,20,40,.72);color:#fff;border-radius:99px;padding:6px 14px;font-weight:800;font-size:15px;backdrop-filter:blur(4px);white-space:nowrap}
  .round{min-width:48px;min-height:48px;border-radius:50%;background:rgba(30,20,40,.72);color:#fff;font-size:22px;display:grid;place-items:center}
  #stageName{flex:1;overflow:hidden;text-overflow:ellipsis;text-align:left;max-width:50vw}
  #timer{font-variant-numeric:tabular-nums;font-size:18px}
  #timer.low{background:#c62f4b;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.6}}
  .card{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--accent);border-radius:16px;padding:6px 8px 6px 6px;min-height:64px;box-shadow:0 4px 0 rgba(0,0,0,.25);max-width:46vw;transition:transform .15s}
  .card.empty{border-style:dashed;border-color:#bbb;background:rgba(255,255,255,.85)}
  .card.pop{animation:pop .25s}
  @keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
  .card canvas{width:52px;height:52px;border-radius:10px;background:#f4eee6;flex:none}
  .card .lbl{font-weight:800;font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .card .lbl small{display:block;color:var(--sub);font-size:11px;font-weight:700}
  .card .x{min-width:44px;min-height:44px;font-size:18px;color:#999;margin-left:-6px}
  .bottom .right{display:flex;gap:8px;align-items:center}
  #hintBtn[disabled]{opacity:.35}
  #toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:rgba(30,20,40,.85);color:#fff;padding:8px 16px;border-radius:12px;font-weight:800;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:86vw;text-align:center}
  #toast.show{opacity:1}
  #tutorialBar{position:absolute;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 58px);transform:translateX(-50%);width:min(92vw,620px);background:#fff8d6;border:3px solid #f2b705;border-radius:14px;padding:8px 14px;font-weight:800;font-size:15px;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.2);pointer-events:none}
  .scorepop{position:absolute;font-weight:900;color:#fff;font-size:22px;text-shadow:0 2px 0 #c2185b,0 0 6px #c2185b;pointer-events:none;animation:up 1.1s forwards}
  @keyframes up{to{transform:translateY(-50px);opacity:0}}
  /* 画面（タイトル・ステージ選択・図鑑・設定・結果） */
  .screen{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:linear-gradient(160deg,#ffe9d6,#ffd6ea 60%,#e3dcff);
    padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  .screen.overlay{background:rgba(30,20,40,.55);display:flex;align-items:center;justify-content:center}
  .panel{background:var(--panel);border-radius:20px;border:3px solid var(--line);padding:16px;max-width:760px;margin:0 auto;box-shadow:0 8px 0 rgba(0,0,0,.12)}
  .overlay .panel{width:min(92vw,560px);max-height:92dvh;overflow:auto}
  h1{margin:6px 0 2px;font-size:clamp(28px,min(7vw,9vh),52px);color:var(--accent);letter-spacing:.04em;text-shadow:0 3px 0 #fff}
  h2{margin:0 0 10px;font-size:22px}
  h3{margin:14px 0 6px;font-size:17px}
  .lead{color:var(--sub);font-weight:700;margin:0 0 14px;line-height:1.6}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 18px;border-radius:16px;background:var(--accent);color:#fff;font-weight:900;font-size:18px;box-shadow:0 4px 0 #c2185b;width:100%}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c2185b}
  .btn.sub{background:#fff;color:var(--ink);box-shadow:0 4px 0 #cbb;border:2px solid var(--line)}
  .btn.blue{background:var(--accent2);box-shadow:0 4px 0 #2a7ac2}
  .btn.small{min-height:44px;font-size:15px;padding:6px 12px}
  .grid{display:grid;gap:10px}
  .g2{grid-template-columns:1fr 1fr}
  .stages{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
  .stage{background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px;text-align:left;min-height:120px;display:flex;flex-direction:column;gap:4px}
  .stage.locked{opacity:.5}
  .stage .no{font-size:13px;font-weight:900;color:var(--accent)}
  .stage .tt{font-size:19px;font-weight:900}
  .stage .meta{font-size:13px;color:var(--sub);font-weight:700}
  .bar{display:block;height:8px;background:#eee;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent)}
  .tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
  .tabs button{min-height:44px;padding:6px 14px;border-radius:99px;background:#fff;border:2px solid var(--line);font-weight:800;white-space:nowrap}
  .tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .elist{list-style:none;padding:0;margin:0;display:grid;gap:6px}
  .elist li{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;gap:10px;align-items:center;min-height:48px}
  .elist li.unk{color:#aaa}
  .elist .id{font-size:11px;color:var(--sub);font-weight:800;width:54px;flex:none}
  .elist .t{flex:1;font-weight:800}
  .elist .pt{font-size:12px;font-weight:800;color:var(--accent)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);min-height:52px}
  .row label{font-weight:800}
  .row select,.row input[type=range]{min-height:40px;font:inherit}
  .seg{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
  .seg button{min-height:42px;padding:4px 12px;font-weight:800;background:#fff}
  .seg button.on{background:var(--accent);color:#fff}
  .toggle{width:60px;height:34px;border-radius:99px;background:#ccc;position:relative;flex:none}
  .toggle.on{background:var(--ok)}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;transition:left .15s}
  .toggle.on::after{left:29px}
  .big{font-size:40px;font-weight:900;color:var(--accent);text-align:center;margin:6px 0}
  .stats{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-weight:800;margin:10px 0}
  .stats span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
  .note{font-size:12px;color:var(--sub);font-weight:700;line-height:1.6}
  .preview{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:10px;border:2px solid var(--line)}
  .preview canvas{width:120px;height:120px;background:#f4eee6;border-radius:12px;flex:none}
  .preview .bub{position:relative;background:#fff;border:2px solid #444;border-radius:12px;padding:8px 10px;font-weight:800;animation:pop .35s}
  /* デバッグ（44-46章） */
  #debugBtn{position:absolute;right:max(12px,env(safe-area-inset-right));top:calc(max(8px,env(safe-area-inset-top)) + 56px);pointer-events:auto}
  #inspector{position:absolute;right:0;top:0;bottom:0;width:min(46vw,340px);background:rgba(10,10,20,.82);color:#cfe;font:12px/1.45 ui-monospace,Menlo,monospace;padding:10px;padding-top:max(10px,env(safe-area-inset-top));overflow:auto;pointer-events:auto;white-space:pre-wrap;touch-action:pan-y}
  .dbg{font:13px/1.5 ui-monospace,Menlo,monospace}
  .dbg .ok{color:var(--ok)} .dbg .ng{color:var(--ng)}
  .dbg li{list-style:none}
  .status-COMPLETED{color:var(--ok)} .status-INVALIDATED{color:#999;text-decoration:line-through} .status-AVAILABLE,.status-ARMED{color:#d07a00} .status-LOCKED{color:#888}
  .graph{overflow:auto;max-height:70dvh;background:#fff;border-radius:12px;border:2px solid var(--line);touch-action:pan-x pan-y}
  #rotateHint{position:absolute;left:50%;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 84px);transform:translateX(-50%);font-size:12px;color:#fff;background:rgba(0,0,0,.5);padding:4px 10px;border-radius:99px;pointer-events:none}
  @media (orientation:landscape){#rotateHint{display:none}}
  @media (orientation:portrait){.card{max-width:52vw}}
  .hc .pill,.hc .round{background:#000;border:2px solid #fff}
  .big-text .card .lbl{font-size:16px}
</style>
</head>
<body>
<div id="app">
  <canvas id="world" class="game-root"></canvas>
  <div id="hud" class="hud hidden">
    <div class="top">
      <button id="pauseBtn" class="round" aria-label="一時停止">⏸</button>
      <div id="stageName" class="pill"></div>
      <div id="timer" class="pill">00:00</div>
    </div>
    <div class="bottom">
      <div id="score" class="pill">Score 0</div>
      <div class="right">
        <div id="card" class="card empty">
          <canvas id="cardThumb" width="104" height="104"></canvas>
          <div class="lbl" id="cardLabel"><small>画像</small>なし</div>
          <button class="x hidden" id="cardDiscard" aria-label="画像を捨てる">✕</button>
        </div>
        <button id="hintBtn" class="round" aria-label="ヒント">💡</button>
      </div>
    </div>
    <button id="debugBtn" class="round hidden" aria-label="デバッグ">🐞</button>
    <div id="rotateHint">横向きがおすすめ</div>
  </div>
  <div id="tutorialBar" class="hidden"></div>
  <div id="toast"></div>
  <div id="inspector" class="hidden"></div>
  <div id="screen" class="screen"></div>
</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
