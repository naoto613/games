<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 674" font-family="'Hiragino Maru Gothic ProN','Noto Sans JP',sans-serif">
  <!-- 独自に作図した略図。利用者提供の園内マップ画像からエリア・表記・番号の相対位置だけを読み取ったもの。縮尺・道・建物の形は正確ではない。 -->
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#CFE5B8"/></pattern>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#9C6A86" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1000" height="674" fill="#FFFDF8"/>
  <!-- 園地の輪郭（おおよそ） -->
  <path d="M0 130 C40 50 120 10 250 4 C330 20 370 110 430 160 C520 175 600 150 690 120 C780 95 900 100 960 160 C1000 230 1000 400 995 560 C980 630 930 674 880 674 L590 674 C560 640 530 620 500 674 L150 674 C70 640 20 560 0 430 Z" fill="#EEF7E2"/>
  <path d="M0 130 C40 50 120 10 250 4 C330 20 370 110 430 160 C520 175 600 150 690 120 C780 95 900 100 960 160 C1000 230 1000 400 995 560 C980 630 930 674 880 674 L590 674 C560 640 530 620 500 674 L150 674 C70 640 20 560 0 430 Z" fill="url(#dots)"/>

  <!-- エリア -->
  <g filter="url(#soft)" opacity=".95">
    <ellipse cx="160" cy="110" rx="165" ry="95" fill="#DCEEC6"/>
    <ellipse cx="250" cy="300" rx="135" ry="80" fill="#FFE2EF"/>
    <ellipse cx="445" cy="285" rx="85" ry="105" fill="#E2F1D2"/>
    <ellipse cx="760" cy="160" rx="170" ry="95" fill="#E3EEFF"/>
    <ellipse cx="770" cy="315" rx="130" ry="80" fill="#FFF0DC"/>
    <ellipse cx="660" cy="480" rx="160" ry="80" fill="#FDE5F1"/>
    <ellipse cx="280" cy="520" rx="210" ry="115" fill="#E7F5DC"/>
    <ellipse cx="715" cy="605" rx="95" ry="42" fill="#FFF3C6"/>
  </g>

  <!-- 水路（ボートライド付近・略図） -->
  <path d="M215 345 C250 360 300 360 330 335 C355 315 380 330 395 350" fill="none" stroke="#9FD3F0" stroke-width="14" stroke-linecap="round"/>

  <!-- ハーモニートレインの線路（略図） -->
  <path d="M228 273 C260 200 330 165 420 150 C500 140 600 140 640 175 C665 210 660 270 648 322 C630 380 580 420 520 455 C450 500 380 560 300 610 C230 640 160 610 130 540 C110 470 140 380 190 320 C205 300 215 285 228 273 Z"
        fill="none" stroke="#C99A6B" stroke-width="5" stroke-dasharray="12 7" stroke-linecap="round"/>

  <!-- 目印の建物（形は略図） -->
  <ellipse cx="705" cy="465" rx="72" ry="40" fill="#FFFFFF" stroke="#F0A9C9" stroke-width="5"/>
  <path d="M270 480 L320 430 L370 480 Z" fill="#FFD9A8" stroke="#F0B070" stroke-width="3"/>
  <rect x="505" y="408" width="56" height="34" rx="6" fill="#DCE3F5" stroke="#9AA9D6" stroke-width="2"/>
  <circle cx="825" cy="74" r="44" fill="none" stroke="#F0A9C9" stroke-width="5"/>
  <circle cx="825" cy="74" r="6" fill="#F0A9C9"/>

  <!-- 施設名と対応できていない地図上の番号（8〜14・15） -->
  <g font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <g fill="#A99CA4"><circle cx="850" cy="167" r="12"/><circle cx="830" cy="202" r="12"/><circle cx="650" cy="179" r="12"/><circle cx="697" cy="171" r="12"/><circle cx="780" cy="144" r="12"/><circle cx="748" cy="128" r="12"/><circle cx="730" cy="165" r="12"/><circle cx="257" cy="350" r="12"/></g>
    <text x="850" y="172">8</text><text x="830" y="207">9</text><text x="650" y="184">10</text><text x="697" y="176">11</text><text x="780" y="149">12</text><text x="748" y="133">13</text><text x="730" y="170">14</text><text x="257" y="355">15</text>
  </g>

  <!-- エリア名 -->
  <g font-size="21" font-weight="800" text-anchor="middle" fill="#7A3E5E" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">
    <text x="110" y="66">森林・竹林公園</text>
    <text x="165" y="245">カーニバルスクエア</text>
    <text x="440" y="290">ネイチャーエリア</text>
    <text x="680" y="70">ホワイトバーズスクエア</text>
    <text x="735" y="382">ハーモニーパーク</text>
    <text x="605" y="530">ハーモニービレッジ</text>
    <text x="260" y="566">ハーモニーガーデン</text>
    <text x="712" y="612">エントランス</text>
  </g>
  <g font-size="14" font-weight="700" text-anchor="middle" fill="#6E5D67" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">
    <text x="533" y="398">森の国ハーベストハウス</text>
    <text x="315" y="514">フェスティバルステージ</text>
  </g>
  <text x="990" y="664" font-size="12" text-anchor="end" fill="#9A8E96">独自に作図した略図（縮尺・道は正確ではありません）</text>
</svg>
