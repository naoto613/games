<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#141a33">
<title>STELLA NOCTIS ─宵星のレガリア─</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#e8c97a;--gold2:#b8913f;--navy:#121a36;--navy2:#1d2a52;--ink:#f4efe2;--sub:#b9c2dc;--hp:#7fe08a;--tp:#79b8ff;--red:#ff6a5a;--panel:rgba(14,20,44,.86)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0f22;color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hide{display:none!important}
.serif{font-family:"Shippori Mincho B1","Hiragino Mincho ProN",serif}
.cz{font-family:"Cinzel","Shippori Mincho B1",serif}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:60;transition:opacity .45s}
#fade.white{background:#fff}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30}
#shatter{position:fixed;inset:0;z-index:58;pointer-events:none;overflow:hidden}
#shatter i{position:absolute;inset:0;background-size:100% 100%;will-change:transform,opacity}
#bars{position:fixed;inset:0;pointer-events:none;z-index:9}
#bars:before,#bars:after{content:"";position:absolute;left:0;right:0;height:0;background:#000;transition:height .6s}
#bars:before{top:0}#bars:after{bottom:0}
#bars.on:before,#bars.on:after{height:10vh}
.frame{background:linear-gradient(180deg,rgba(28,40,82,.92),rgba(12,17,40,.92));border:1px solid rgba(232,201,122,.75);box-shadow:0 0 0 3px rgba(10,14,32,.8),0 0 0 4px rgba(232,201,122,.35),0 10px 30px rgba(0,0,0,.5);border-radius:6px}

/* ---------------- title ---------------- */
#title{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 120%,rgba(255,150,90,.0),rgba(0,0,0,0) 60%)}
#title .logo{text-align:center;transform:translateY(-6vh);animation:lgIn 2.4s ease-out both}
#title .en{font-family:"Cinzel",serif;font-weight:900;font-size:clamp(40px,8.6vw,104px);letter-spacing:.08em;line-height:1;background:linear-gradient(180deg,#fffaf0 0%,#f1dca0 45%,#b98a3a 55%,#f8e7b4 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #2a1a08) drop-shadow(0 0 18px rgba(255,220,150,.45))}
#title .en small{display:block;font-size:.26em;letter-spacing:.6em;margin-bottom:.4em;font-weight:700}
#title .jp{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:clamp(18px,3vw,32px);letter-spacing:.5em;color:#f4efe2;text-shadow:0 0 10px rgba(120,160,255,.8),0 2px 0 #000;margin-top:.5em}
#title .jp:before,#title .jp:after{content:"";display:inline-block;width:3em;height:1px;background:linear-gradient(90deg,transparent,#e8c97a);vertical-align:middle;margin:0 .8em}
#title .jp:after{transform:scaleX(-1)}
@keyframes lgIn{0%{opacity:0;filter:blur(12px);letter-spacing:.4em}100%{opacity:1}}
#tmenu{position:absolute;bottom:13vh;display:flex;flex-direction:column;gap:10px;align-items:center;animation:lgIn 1s 1.6s both}
#tmenu button{font:inherit;font-family:"Cinzel","Shippori Mincho B1",serif;font-size:clamp(16px,2.3vw,22px);letter-spacing:.2em;color:#f4efe2;background:none;border:0;padding:4px 30px;cursor:pointer;position:relative;text-shadow:0 2px 4px #000}
#tmenu button small{display:block;font-family:"Shippori Mincho B1",serif;font-size:.6em;letter-spacing:.3em;color:#c9cfe6}
#tmenu button.sel,#tmenu button:hover{color:#ffe7a8}
#tmenu button.sel:before{content:"";position:absolute;left:4px;top:50%;width:14px;height:14px;margin-top:-7px;background:radial-gradient(circle,#fff 0 20%,#ffd36a 40%,transparent 72%);animation:tw 1.2s ease-in-out infinite}
#tmenu button:disabled{opacity:.35;cursor:default}
@keyframes tw{50%{transform:scale(1.5) rotate(45deg);opacity:.6}}
#title .press{position:absolute;bottom:14vh;font-family:"Cinzel",serif;letter-spacing:.4em;font-size:clamp(14px,2vw,18px);animation:blink 2s ease-in-out infinite;text-shadow:0 0 8px #000}
@keyframes blink{50%{opacity:.25}}
#title .copy{position:absolute;bottom:max(10px,env(safe-area-inset-bottom));font-size:11px;color:#9aa3c4;letter-spacing:.15em}
#orient{position:fixed;inset:auto 0 0 0;z-index:70;background:rgba(0,0,0,.75);text-align:center;padding:8px;font-size:13px;color:#ffe7a8;display:none}
@media (orientation:portrait) and (pointer:coarse){#orient{display:block}}

/* ---------------- prologue ---------------- */
#prologue{position:fixed;inset:0;z-index:55;background:#000;display:flex;align-items:center;justify-content:center;text-align:center;font-family:"Shippori Mincho B1",serif;font-size:clamp(16px,2.6vw,24px);line-height:2.2;letter-spacing:.12em;padding:20px;cursor:pointer}
#prologue p{margin:0;opacity:0;transition:opacity 1.4s}
#prologue p.on{opacity:1}

/* ---------------- field HUD ---------------- */
#fhud{position:fixed;inset:0;pointer-events:none;z-index:6}
#areaName{position:absolute;left:0;top:18%;width:100%;text-align:center;opacity:0;transition:opacity 1.2s}
#areaName .n{display:inline-block;font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:clamp(26px,4.6vw,46px);letter-spacing:.3em;padding:6px 40px;text-shadow:0 0 14px rgba(0,0,0,.8),0 2px 0 #000;background:linear-gradient(90deg,transparent,rgba(10,14,32,.65) 20%,rgba(10,14,32,.65) 80%,transparent);border-top:1px solid rgba(232,201,122,.6);border-bottom:1px solid rgba(232,201,122,.6)}
#areaName .s{font-family:"Cinzel",serif;letter-spacing:.5em;color:var(--gold);font-size:clamp(11px,1.5vw,15px);margin-top:6px;text-shadow:0 1px 3px #000}
#gold{position:absolute;right:max(14px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));font-family:"Cinzel",serif;font-size:16px;padding:4px 14px;text-shadow:0 1px 2px #000}
#gold b{color:var(--gold);font-size:19px;margin-right:4px}
#objective{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));max-width:min(60vw,420px);padding:6px 14px 6px 12px;font-size:13px;line-height:1.5;text-shadow:0 1px 2px #000}
#objective:before{content:"OBJECTIVE";display:block;font-family:"Cinzel",serif;font-size:10px;letter-spacing:.3em;color:var(--gold)}
#objective:empty{display:none}
#skitNote{position:absolute;left:max(14px,env(safe-area-inset-left));top:calc(max(12px,env(safe-area-inset-top)) + 64px);display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;font-size:14px;animation:skn .5s ease-out;pointer-events:auto;cursor:pointer}
#skitNote .ic{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff7cf,#e8b84a 60%,#8a5a1a);display:flex;align-items:center;justify-content:center;color:#3a2200;font-weight:900;font-family:"Cinzel",serif;font-size:13px;box-shadow:0 0 12px rgba(255,210,120,.7);animation:pulse 1.4s ease-in-out infinite}
#skitNote .k{font-family:"Cinzel",serif;font-size:11px;color:var(--gold);letter-spacing:.15em}
@keyframes skn{from{transform:translateX(-120%)}}
@keyframes pulse{50%{transform:scale(1.12)}}
#prompt{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);padding:4px 16px;font-size:15px;white-space:nowrap}
#prompt b{display:inline-block;background:var(--gold);color:#1a1200;border-radius:4px;padding:0 6px;margin-right:6px;font-family:"Cinzel",serif;font-size:13px}
#toast{position:absolute;left:50%;top:30%;transform:translateX(-50%);padding:8px 26px;font-size:17px;opacity:0;transition:opacity .3s;white-space:nowrap;text-align:center}
#toast.on{opacity:1}

/* ---------------- dialog ---------------- */
#dlg{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(96vw,860px);min-height:128px;z-index:20;display:flex;gap:14px;padding:14px 22px 16px 14px;cursor:pointer;font-size:clamp(15px,2.2vw,20px);line-height:1.7}
#dlg .face{flex:0 0 auto;width:104px;height:120px;border:1px solid rgba(232,201,122,.6);border-radius:4px;overflow:hidden;background:radial-gradient(circle at 50% 30%,#3a4f8a,#141c3c)}
#dlg .face:empty{display:none}
#dlg .face svg{width:100%;height:100%;display:block}
#dlg .nm{font-family:"Shippori Mincho B1",serif;font-weight:800;color:var(--gold);font-size:.95em;letter-spacing:.1em;border-bottom:1px solid rgba(232,201,122,.35);margin-bottom:4px;padding-bottom:2px}
#dlg .nm:empty{display:none}
#dlg .tx{flex:1;min-width:0}
#dlg .tx b{color:#ffd88a}
#dlg .nx{position:absolute;right:16px;bottom:8px;color:var(--gold);animation:bob .8s ease-in-out infinite;font-size:14px}
@keyframes bob{50%{transform:translateY(4px)}}
#choice{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:22;padding:10px;display:flex;flex-direction:column;gap:4px;min-width:240px}
#choice button{font:inherit;font-size:17px;color:var(--ink);background:none;border:0;padding:8px 18px 8px 30px;text-align:left;cursor:pointer;position:relative;border-radius:3px}
#choice button.sel{background:linear-gradient(90deg,rgba(232,201,122,.35),transparent)}
#choice button.sel:before{content:"◆";position:absolute;left:10px;color:var(--gold);font-size:12px;top:11px}

/* ---------------- skit ---------------- */
#skit{position:fixed;inset:0;z-index:25;background:rgba(6,8,20,.55);backdrop-filter:blur(5px) saturate(.6);-webkit-backdrop-filter:blur(5px) saturate(.6);cursor:pointer}
#skit .ttl{position:absolute;left:max(18px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:clamp(16px,2.4vw,22px);letter-spacing:.15em;padding:4px 18px}
#skit .ttl small{font-family:"Cinzel",serif;color:var(--gold);font-size:11px;letter-spacing:.3em;display:block}
#skit .stage{position:absolute;left:0;right:0;top:12%;height:58%;display:flex;justify-content:center;align-items:flex-end;gap:2vw}
#skit .pf{position:relative;width:min(27vw,250px);height:min(32vw,300px);transition:transform .35s cubic-bezier(.3,1.6,.5,1),filter .3s,opacity .3s;filter:brightness(.55) saturate(.7);transform:scale(.92)}
#skit .pf .fr{position:absolute;inset:0;border:2px solid rgba(232,201,122,.85);background:linear-gradient(160deg,#3c5aa6,#1a2450 60%,#0e1430);clip-path:polygon(4% 0,100% 3%,96% 100%,0 97%);overflow:hidden}
#skit .pf svg{position:absolute;inset:0;width:100%;height:100%}
#skit .pf.on{filter:none;transform:scale(1.04) rotate(-1deg);z-index:2}
#skit .pf.in{animation:pfin .5s cubic-bezier(.3,1.5,.5,1) both}
#skit .pf.jump{animation:pfj .35s}
#skit .pf.shake{animation:pfs .4s}
@keyframes pfin{from{transform:translateY(40%) scale(.6);opacity:0}}
@keyframes pfj{40%{transform:translateY(-14%) scale(1.06)}}
@keyframes pfs{20%,60%{transform:translateX(-5%) scale(1.04)}40%,80%{transform:translateX(5%) scale(1.04)}}
#skit .pf .nm{position:absolute;left:-6px;bottom:-12px;font-family:"Shippori Mincho B1",serif;font-weight:800;background:var(--gold);color:#1c1300;padding:1px 14px;font-size:14px;letter-spacing:.1em;clip-path:polygon(6% 0,100% 0,94% 100%,0 100%)}
#skit .txt{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(94vw,820px);padding:14px 24px;font-size:clamp(15px,2.2vw,20px);line-height:1.7;min-height:92px}
#skit .txt .who{color:var(--gold);font-family:"Shippori Mincho B1",serif;font-weight:800;margin-right:.6em}
#skit .skip{position:absolute;right:max(18px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));font-size:12px;color:#c9cfe6;font-family:"Cinzel",serif;letter-spacing:.2em}

/* ---------------- battle HUD ---------------- */
#bhud{position:fixed;inset:0;pointer-events:none;z-index:6}
#party{position:absolute;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px}
.pp{width:clamp(130px,17vw,190px);padding:5px 10px 6px 54px;position:relative;background:linear-gradient(180deg,rgba(30,44,92,.88),rgba(10,14,34,.92));border:1px solid rgba(232,201,122,.6);border-radius:4px 18px 4px 4px;font-family:"Cinzel",serif;transition:transform .2s}
.pp .fc{position:absolute;left:0;top:-14px;width:50px;height:60px;overflow:hidden;clip-path:polygon(0 0,100% 0,100% 82%,82% 100%,0 100%)}
.pp .fc svg{width:100%;height:100%}
.pp .n{font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:12px;letter-spacing:.1em;color:#dfe4f5;line-height:1.2}
.pp .hp{font-size:clamp(17px,2.2vw,23px);font-weight:700;line-height:1.05;text-shadow:0 1px 0 #000}
.pp .hp small{font-size:.55em;color:#9aa6cc}
.pp .bar{height:4px;background:rgba(0,0,0,.6);margin-top:2px;position:relative}
.pp .bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#3fae5a,#9cf09c);transition:width .25s}
.pp .bar.t i{background:linear-gradient(90deg,#2f6fd6,#8fd0ff)}
.pp .tp{font-size:11px;color:var(--tp);margin-top:1px}
.pp.low .hp{color:#ffd166}.pp.crit .hp{color:var(--red)}
.pp.dead{filter:grayscale(1) brightness(.6)}
.pp.ctl{border-color:#ffe7a8;box-shadow:0 0 12px rgba(255,220,140,.45)}
.pp .cast{position:absolute;right:6px;top:-14px;font-size:11px;font-family:"Shippori Mincho B1",serif;color:#bfe1ff;text-shadow:0 0 4px #000}
#ol{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));width:96px;height:96px}
#ol svg{width:100%;height:100%;overflow:visible}
#ol .lbl{position:absolute;left:0;right:0;top:34px;text-align:center;font-family:"Cinzel",serif;font-weight:900;font-size:11px;letter-spacing:.1em;color:#ffe7a8;text-shadow:0 0 4px #000}
#ol .v{position:absolute;left:0;right:0;top:48px;text-align:center;font-family:"Cinzel",serif;font-size:15px;text-shadow:0 1px 2px #000}
#ol.ready .lbl{animation:blink .7s infinite}
#combo{position:absolute;right:max(16px,env(safe-area-inset-right));top:24%;text-align:right;font-family:"Cinzel",serif;opacity:0;transition:opacity .4s;text-shadow:0 2px 0 #000,0 0 10px rgba(0,0,0,.6)}
#combo .h{font-size:clamp(34px,5vw,56px);font-weight:900;line-height:1;color:#fff;font-style:italic}
#combo .h small{font-size:.42em;margin-left:6px;color:#ffe7a8}
#combo .d{font-size:clamp(14px,1.8vw,18px);color:#ffd27a;font-style:italic}
#combo.on{opacity:1}
#combo.pop .h{animation:cpop .15s}
@keyframes cpop{50%{transform:scale(1.18)}}
#arteName{position:absolute;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:clamp(18px,2.8vw,28px);letter-spacing:.25em;padding:2px 40px;background:linear-gradient(90deg,transparent,rgba(10,14,32,.75) 25%,rgba(10,14,32,.75) 75%,transparent);text-shadow:0 0 10px rgba(120,170,255,.8),0 2px 0 #000;opacity:0;transition:opacity .2s;white-space:nowrap}
#arteName.on{opacity:1}
#arteName.ally{font-size:clamp(14px,2vw,20px);top:calc(max(14px,env(safe-area-inset-top)) + 40px);color:#cfe3ff}
#arteName2{position:absolute;left:50%;top:calc(max(14px,env(safe-area-inset-top)) + 44px);transform:translateX(-50%);font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:clamp(13px,1.8vw,17px);letter-spacing:.2em;color:#cfe3ff;text-shadow:0 0 6px #000;opacity:0;transition:opacity .2s;white-space:nowrap}
#arteName2.on{opacity:1}
#tgt{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));padding:4px 12px 6px;min-width:200px;font-size:13px}
#tgt .n{font-family:"Shippori Mincho B1",serif;font-weight:700;letter-spacing:.1em}
#tgt .b{height:6px;background:rgba(0,0,0,.6);margin-top:3px;position:relative}
#tgt .b i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#c2302a,#ff8a6a);transition:width .2s}
#tgt .f{height:3px;background:rgba(0,0,0,.6);margin-top:3px;position:relative}
#tgt .f i{position:absolute;left:0;top:0;bottom:0;transition:width .2s}
#fsPrompt{position:absolute;left:50%;top:58%;transform:translateX(-50%);font-family:"Cinzel",serif;font-weight:900;font-size:clamp(18px,2.6vw,26px);letter-spacing:.2em;color:#fff;text-shadow:0 0 12px #f4c,0 2px 0 #000;animation:blink .5s infinite}
#banner{position:absolute;left:0;right:0;top:40%;text-align:center;font-family:"Cinzel",serif;font-weight:900;font-size:clamp(30px,6vw,64px);letter-spacing:.2em;font-style:italic;color:#fff;text-shadow:0 0 20px rgba(255,200,120,.9),0 3px 0 #000;opacity:0;pointer-events:none}
#banner.on{animation:bnr 1.6s ease-out both}
@keyframes bnr{0%{opacity:0;transform:scaleX(2.2) scaleY(.4)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateX(6%)}}
#dmg{position:fixed;inset:0;pointer-events:none;z-index:7;overflow:hidden}
#dmg div{position:absolute;font-family:"Cinzel",serif;font-weight:900;font-style:italic;color:#fff;text-shadow:0 0 3px #000,0 2px 0 #000,2px 0 0 #000,-2px 0 0 #000;white-space:nowrap;transform:translate(-50%,-50%);font-size:clamp(18px,2.4vw,26px)}
#dmg div.heal{color:#8dffa0}
#dmg div.crit{color:#ffd24a;font-size:clamp(22px,3vw,32px)}
#dmg div.ally{color:#ff9a8a}
#dmg div.small{font-size:13px;color:#cfe3ff;font-style:normal;letter-spacing:.1em}
#dmg div.big{font-size:clamp(28px,4vw,44px);color:#ffe7a8}

/* mystic cut-in */
#cutin{position:fixed;inset:0;z-index:28;pointer-events:none;overflow:hidden}
#cutin .bg{position:absolute;left:-10%;right:-10%;top:28%;height:44%;background:linear-gradient(90deg,#0a0518,#2a1050 30%,#5a1a6a 50%,#2a1050 70%,#0a0518);transform:skewY(-6deg);box-shadow:0 0 0 3px #e8c97a,0 0 40px rgba(180,80,255,.8);animation:ciBg 2.6s ease-in-out both}
#cutin .por{position:absolute;right:6%;top:18%;width:min(44vw,460px);height:64%;animation:ciPor 2.6s ease-out both}
#cutin .por svg{width:100%;height:100%;filter:drop-shadow(0 0 18px rgba(200,140,255,.9))}
#cutin .nm{position:absolute;left:6%;top:44%;font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:clamp(28px,5.6vw,64px);letter-spacing:.2em;color:#fff;text-shadow:0 0 18px #c8f,0 3px 0 #000;animation:ciNm 2.6s ease-out both;white-space:nowrap}
#cutin .nm small{display:block;font-family:"Cinzel",serif;font-size:.3em;letter-spacing:.6em;color:#e8c97a}
#cutin .ln{position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 40px,rgba(255,255,255,.07) 40px 42px);animation:ciLn .3s linear infinite}
@keyframes ciBg{0%{transform:skewY(-6deg) scaleY(0)}10%{transform:skewY(-6deg) scaleY(1)}88%{transform:skewY(-6deg) scaleY(1);opacity:1}100%{transform:skewY(-6deg) scaleY(0);opacity:0}}
@keyframes ciPor{0%{transform:translateX(60%);opacity:0}14%{transform:translateX(0);opacity:1}86%{transform:translateX(-6%);opacity:1}100%{transform:translateX(-30%);opacity:0}}
@keyframes ciNm{0%,14%{transform:translateX(-30%);opacity:0}28%{transform:none;opacity:1}86%{opacity:1;transform:translateX(4%)}100%{opacity:0}}
@keyframes ciLn{to{background-position:84px 0}}

/* ---------------- result ---------------- */
#result{position:fixed;inset:0;z-index:24;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(6,8,22,.2),rgba(6,8,22,.75));cursor:pointer}
#result .box{width:min(94vw,640px);padding:18px 24px 16px}
#result h2{margin:0 0 10px;font-family:"Cinzel",serif;font-size:clamp(24px,4vw,36px);letter-spacing:.3em;text-align:center;color:#ffe7a8;font-style:italic}
#result .row{display:flex;justify-content:space-between;border-bottom:1px solid rgba(232,201,122,.2);padding:3px 4px;font-size:15px}
#result .row b{font-family:"Cinzel",serif;color:#fff}
#result .pl{display:flex;gap:10px;margin-top:10px}

function makeTerrain(parent, size, seg, hf, cf, tex, rep = 40, cx = 0, cz = 0) {
  const g = new THREE.PlaneGeometry(size, size, seg, seg).rotateX(-Math.PI / 2);
  const p = g.attributes.position, col = new Float32Array(p.count * 3), c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i) + cx, z = p.getZ(i) + cz; p.setY(i, hf(x, z)); p.setX(i, x); p.setZ(i, z);
    cf(x, z, c); col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const uv = g.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * rep, uv.getY(i) * rep);
  g.computeVertexNormals();
  const t = tex.clone(); t.needsUpdate = true; t.wrapS = t.wrapT = THREE.RepeatWrapping;
  const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true, map: t }));
  parent.add(m);
  return m;
}

function heal(c, v) { if (c.hp <= 0) return false; const b = c.hp; c.hp = Math.min(c.mhp, Math.round(c.hp + v)); return c.hp > b || true; }
function healTP(c, v) { c.tp = Math.min(c.mtp, Math.round(c.tp + v)); return true; }

function initChar(id, lv = 1) {
  const st = statOf(id, lv);
  S.chars[id] = Object.assign({ id, lv, exp: 0, hp: st.mhp, tp: st.mtp }, st);
}
function totalExpFor(lv) { let s = 0; for (let i = 1; i < lv; i++) s += expNext(i); return s; }
function gainExp(id, n) {
  const c = S.chars[id]; let ups = 0;
  c.exp += n;
  while (c.exp >= expNext(c.lv)) {
    c.exp -= expNext(c.lv); c.lv++; ups++;
    const st = statOf(id, c.lv); const dh = st.mhp - c.mhp, dt = st.mtp - c.mtp;
    Object.assign(c, st); c.hp += dh; c.tp += dt;
  }
  return ups;
}

// ---------------------------------------------------------------- main update
Battle.update = function (rdt) {
  const B = Battle;
  if (!B.on) return;
  if (B.paused) { renderer.render(battleScene, camera); return; }
  let dt = rdt * B.ts;
  B.t += dt; B.stats.time += rdt;
  if (B.stop > 0) { B.stop -= rdt; dt = 0; }
  const sp = B.special;
  if (sp) {
    if (sp.kind === 'burst') tickBurst(rdt);
    else if (sp.kind === 'mystic') tickMystic(rdt);
    else if (sp.kind === 'fs') tickFS(rdt);
  }
  const frozen = sp && sp.kind !== 'fs';
  if (!B.end) {
    if (!frozen) {
      playerControl(B.player, dt);
      for (const f of B.fighters) {
        if (f.team === 'ally' && f !== B.player) allyAI(f, dt);
        if (f.team === 'enemy') enemyAI(f, dt);
        if (f.act && f.team === 'ally') tickAct(f, dt);
        if (f === B.player && f.casting) tickCast(f, dt);
        physics(f, dt);

      separate();
      updateProjs(dt);
    }
    if (B.ol.on && !sp) { B.ol.t -= rdt; if (B.ol.t <= 0) endOL(); }

  for (const f of B.fighters) syncModel(f, frozen && f !== B.player ? 0 : (f === B.player && sp ? rdt : dt));
  if (B.player.aura) { B.player.aura.position.copy(B.player.pos).setY(B.player.pos.y + 1); B.player.aura.material.opacity = 0.5 + Math.sin(B.t * 10) * 0.2; }
  B.arena.update(rdt);
  FX.update(rdt);
  battleCamera(rdt);
  bSky.update(rdt, camera);
  DMG.update(rdt, camera);
  battleHud(rdt);
  // end conditions
  if (!B.end && !sp) {
    if (B.enemies.every(e => e.dead)) { B.end = { kind: 'win', t: -1.0 }; }
    else if (B.allies.every(a => a.dead)) { B.end = { kind: 'lose', t: 0 }; }
  }
  if (B.end) tickEnd(rdt);

};

Field.updateCam = function (dt, snap) {
  const F = Field, c = F.cam;
  c.yaw -= Input.camDX * 0.006; c.pitch = clamp(c.pitch + Input.camDY * 0.004, 0.08, 1.0); Input.camDX = 0; Input.camDY = 0;
  // auto-follow when moving
  if (F.vel > 1 && !Input.drag && !snap) c.yaw = dampAng(c.yaw, F.face + Math.PI, 0.8, dt);
  const dist = c.dist * (camera.aspect < 1 ? 1.35 : 1);
  const tgt = new V3(F.pos.x, F.pos.y + 1.35, F.pos.z);
  const want = new V3(tgt.x + Math.sin(c.yaw) * Math.cos(c.pitch) * dist, tgt.y + Math.sin(c.pitch) * dist, tgt.z + Math.cos(c.yaw) * Math.cos(c.pitch) * dist);
  const gh = F.A.h(want.x, want.z) + 0.8; if (want.y < gh) want.y = gh;
  if (F.camOv) { want.copy(F.camOv.pos); tgt.copy(F.camOv.look); }
  if (snap) { c.pos.copy(want); c.look.copy(tgt); }
  const ck = F.camOv ? (F.camOv.k || 2.5) : 10;
  c.pos.lerp(want, 1 - Math.exp(-ck * dt)); c.look.lerp(tgt, 1 - Math.exp(-ck * 1.4 * dt));
  camera.position.copy(c.pos); camera.lookAt(c.look);
};
Field.collide = function (x, z, r = 0.45) {
  const A = Field.A;
  for (const [sx, sz, sr] of A.solids) { const dx = x - sx, dz = z - sz, d = Math.hypot(dx, dz), m = sr + r; if (d < m && d > 0.0001) { x = sx + dx / d * m; z = sz + dz / d * m; } }
  for (const b of A.boxes) {
    const c = Math.cos(b.ry), s = Math.sin(b.ry);
    let lx = (x - b.x) * c - (z - b.z) * s, lz = (x - b.x) * s + (z - b.z) * c;
    const hw = b.hw + r, hd = b.hd + r;
    if (Math.abs(lx) < hw && Math.abs(lz) < hd) {
      if (hw - Math.abs(lx) < hd - Math.abs(lz)) lx = Math.sign(lx) * hw; else lz = Math.sign(lz) * hd;
      x = b.x + lx * c + lz * s; z = b.z - lx * s + lz * c;
    }
  }
  const bd = Field.def.bounds;
  if (bd) { x = clamp(x, bd[0], bd[1]); z = clamp(z, bd[2], bd[3]); }
  if (A.walk) { const p = A.walk(x, z); if (p) { x = p[0]; z = p[1]; } }
  return [x, z];
};
Field.update = function (dt) {
  const F = Field;
  if (!F.A) return;
  const p = F.player;
  grassUniform.value += dt;
  F.grace = Math.max(0, F.grace - dt);
  let moving = 0;
  if (!F.lock && Game.mode === 'field' && !UI.stack.length) {
    // movement
    const cy = F.cam.yaw;
    const fwdX = -Math.sin(cy), fwdZ = -Math.cos(cy), rX = -fwdZ, rZ = fwdX;
    let mx = rX * Input.mx + fwdX * Input.my, mz = rZ * Input.mx + fwdZ * Input.my;
    const L = Math.hypot(mx, mz);
    if (L > 0.1) {
      const sp = (Input.held.free ? 4 : 7.5) * Math.min(1, L);
      mx /= L; mz /= L;
      let [nx, nz] = F.collide(F.pos.x + mx * sp * dt, F.pos.z + mz * sp * dt);
      F.pos.x = nx; F.pos.z = nz; F.face = dampAng(F.face, Math.atan2(mx, mz), 14, dt); F.vel = sp; moving = 1;
      F.stepT -= dt * sp; if (F.stepT < 0) { F.stepT = 2.4; Audio2.sfx('step'); }
    } else F.vel = 0;
    F.pos.y = damp(F.pos.y, F.A.h(F.pos.x, F.pos.z), 20, dt);
    // interactions
    let best = null, bd = 1e9;
    for (const it of F.inter) { if (it.cond && !it.cond()) continue; const d = Math.hypot(it.x - F.pos.x, it.z - F.pos.z); if (d < it.r && d < bd) { bd = d; best = it; } }
    const pr = $('#prompt');
    if (best) { pr.innerHTML = `<b>${keyLabel('ok')}</b>${best.label}`; pr.classList.remove('hide'); if (Input.pressed.ok) { clearPressed(); F.runEvent(best.fn); } }
    else pr.classList.add('hide');
    // exits
    for (const e of F.exits) { if (Math.hypot(e.x - F.pos.x, e.z - F.pos.z) < e.r) { if (e.cond && !e.cond()) { if (!e._warned) { e._warned = 1; F.runEvent(e.blocked); } } else { Game.goArea(e.to, e.spawn); return; } } else e._warned = 0; }
    // triggers
    for (const t of F.triggers) { if (t.done || (t.cond && !t.cond())) continue; if (Math.hypot(t.x - F.pos.x, t.z - F.pos.z) < t.r) { t.done = true; F.runEvent(t.fn); break; } }
    // skit / menu
    if (Input.pressed.skit && Game.skitReady) { clearPressed(); F.runEvent(() => playSkit(Game.skitReady)); }
    if (Input.pressed.menu) { clearPressed(); Game.openMenu(); }
  } else F.vel = 0;
  // player model
  p.root.position.copy(F.pos); p.root.rotation.y = F.face;
  p.update(dt, { speed: F.vel, groundY: F.pos.y });
  // npcs
  for (const n of F.npcs) {
    n.m.root.rotation.y = dampAng(n.m.root.rotation.y, n.face, 6, dt);
    if (n.walkTo) { const dx = n.walkTo[0] - n.x, dz = n.walkTo[1] - n.z, d = Math.hypot(dx, dz); if (d > 0.15) { const sp = n.walkSp || 5; n.x += dx / d * Math.min(d, sp * dt); n.z += dz / d * Math.min(d, sp * dt); n.face = Math.atan2(dx, dz); n.speed = sp; } else { n.walkTo = null; n.speed = 0; } }
    n.m.root.position.set(n.x, F.A.h(n.x, n.z), n.z);
    n.m.update(dt, { speed: n.speed || 0, groundY: F.A.h(n.x, n.z) });
  }
  // symbols
  for (let i = F.symbols.length - 1; i >= 0; i--) {
    const s = F.symbols[i];
    s.t -= dt; s.stun = Math.max(0, s.stun - dt);
    const dx = F.pos.x - s.x, dz = F.pos.z - s.z, d = Math.hypot(dx, dz);
    let sp = 0;
    if (s.stun > 0) sp = 0;
    else if (d < 13 && !F.lock && Game.mode === 'field' && F.grace <= 0 && s.spd > 0) { s.face = Math.atan2(dx, dz); sp = s.spd * 0.9; s.state = 'chase'; }
    else { if (s.t <= 0) { s.t = rnd(2, 5); s.face = Math.random() < 0.6 ? rnd(0, TAU) : Math.atan2(s.hx - s.x, s.hz - s.z); s.walk = Math.random() < 0.6; } sp = s.walk && s.spd > 0 ? 1.6 : 0; }
    if (sp) { let [nx, nz] = F.collide(s.x + Math.sin(s.face) * sp * dt, s.z + Math.cos(s.face) * sp * dt, 0.6); s.x = nx; s.z = nz; }
    const y = F.A.h(s.x, s.z);
    s.m.root.position.set(s.x, y, s.z); s.m.root.rotation.y = dampAng(s.m.root.rotation.y, s.face, 8, dt);
    s.m.update(dt, { speed: sp, groundY: y });
    if (d < 1.6 && !F.lock && Game.mode === 'field' && F.grace <= 0 && s.stun <= 0) { F.encounter(s); break; }
  }
  for (const u of F.A.upd) u.update(dt);
  F.updateCam(dt);
  fSky.update(dt, camera);
  renderer.render(fieldScene, camera);
};
Field.runEvent = async function (fn) {
  const F = Field; F.lock = true; F.inEvent = (F.inEvent || 0) + 1; $('#prompt').classList.add('hide');
  try { await fn(); } catch (e) { console.error(e); }
  F.inEvent--; F.lock = F.inEvent > 0; clearPressed();
};
Field.encounter = function (s) {
  const F = Field; F.lock = true;
  Audio2.sfx('encounter');
  Game.startBattle({ enemies: s.grp, area: F.area }, (res) => {
    if (res === 'win') { F.group.remove(s.m.root); F.symbols.splice(F.symbols.indexOf(s), 1); if (s.id) S.flags['sym_' + s.id] = 1; STORY.afterBattle && STORY.afterBattle(); }
    else { s.stun = 4; F.grace = 2.5; }
  });
};

const UI = {
  stack: [],
  top() { return this.stack[this.stack.length - 1]; },
  push(w) { this.stack.push(w); clearPressed(); return w; },
  pop(w) { const i = this.stack.indexOf(w); if (i >= 0) this.stack.splice(i, 1); clearPressed(); },
  update(dt) { const w = this.top(); if (w) { w.update(dt); return true; } return false; },
};

UI.say = function (who, text, expr = 'normal', o = {}) {
  return new Promise(res => {
    const el = $('#dlg'); el.classList.remove('hide');
    const id = WHO[who] ? WHO[who].p : null;
    el.querySelector('.face').innerHTML = id ? portrait(id, expr) : '';
    el.querySelector('.nm').textContent = WHO[who] ? WHO[who].n : (who || '');
    const T = el.querySelector('.t'); T.innerHTML = '';
    const full = text; let shown = 0;
    const w = {
      t: 0, done: false,
      update(dt) {
        this.t += dt;
        if (!this.done) { shown = Math.min(full.length, shown + dt * 55); T.innerHTML = render(full.slice(0, Math.floor(shown))); if (shown >= full.length) this.done = true; }
        if (Input.pressed.ok || Input.pressed.cancel || this.click) { this.click = false; if (!this.done) { shown = full.length; T.innerHTML = render(full); this.done = true; } else { UI.pop(w); el.classList.add('hide'); el.onclick = null; Audio2.sfx('cursor'); res(); } }
      }
    };
    const render = s => s.replace(/\{(.+?)\}/g, '<b>$1</b>').replace(/\n/g, '<br>');
    el.onclick = () => { w.click = true; };
    UI.push(w);
  });
};

function playSkit(sk) {
  return new Promise(res => {
    Game.skitReady = null; $('#skitNote').classList.add('hide'); $('#tK').classList.add('hide');
    S.skitsSeen[sk.id] = 1;
    Audio2.sfx('skit');
    const el = $('#skit'); el.classList.remove('hide');
    el.querySelector('.ttl span').textContent = sk.title;
    const stage = el.querySelector('.stage'); stage.innerHTML = '';
    const cast = [...new Set(sk.lines.map(l => l[0]))];
    const panels = {};
    cast.forEach((id, i) => {
      const d = document.createElement('div'); d.className = 'pf in'; d.style.animationDelay = (i * 0.12) + 's';
      d.innerHTML = `<div class="fr">${portrait(id, 'normal', i === 0 && cast.length > 1 ? false : i % 2 === 1)}</div><div class="nm">${WHO[id].n}</div>`;
      stage.appendChild(d); panels[id] = d;
    });
    const txt = el.querySelector('.txt');
    let i = -1, shown = 0, full = '', holdT = 0;
    const next = () => {
      i++;
      if (i >= sk.lines.length) { UI.pop(w); el.classList.add('hide'); el.onclick = null; res(); return; }
      const [who, ex, text, anim] = sk.lines[i];
      for (const id in panels) panels[id].classList.toggle('on', id === who);
      const p = panels[who];
      p.querySelector('.fr').innerHTML = portrait(who, ex, cast.indexOf(who) % 2 === 1);
      p.classList.remove('jump', 'shake', 'in'); void p.offsetWidth; if (anim) p.classList.add(anim); else p.classList.add('jump');
      full = text; shown = 0; txt.innerHTML = `<span class="who">${WHO[who].n}</span>`;
    };
    const w = {
      update(dt) {
        if (shown < full.length) { shown = Math.min(full.length, shown + dt * 50); txt.innerHTML = `<span class="who">${WHO[sk.lines[i][0]].n}</span>${full.slice(0, Math.floor(shown))}`; }
        if (Input.held.cancel) { holdT += dt; if (holdT > 0.6) { i = sk.lines.length; next(); return; } } else holdT = 0;
        if (Input.pressed.ok || w.click) { w.click = false; if (shown < full.length) shown = full.length; else next(); }
      }
    };
    el.onclick = () => { w.click = true; };
    UI.push(w); next();
  });
}

  const lines = ['<div class="cz" style="font-size:clamp(28px,6vw,60px);letter-spacing:.15em;color:#ffe7a8">STELLA NOCTIS</div><div style="letter-spacing:.4em">― 宵星のレガリア ―</div>', 'ジーク・ヴァルド ／ リュシア・エルフェン ／ ノア・ブリッツ', `最大コンボ ${S.maxCombo} HITS　／　フェイタルストライク ${S.fsCount} 回　／　戦闘 ${S.battles} 回`, '<span class="cz" style="letter-spacing:.3em">THE END</span><br><small>…and the tale of the evening star continues.</small>'];
  for (const l of lines) {
    el.innerHTML = `<p>${l}</p>`; const p = el.querySelector('p'); await wait(60); p.classList.add('on');
    await wait(3200); p.classList.remove('on'); await wait(1300);
  }
  el.classList.add('hide'); el.style.background = '';
}
// ================================================================ game flow
const S_DEFAULT = JSON.stringify(S);
const Game = { mode: 'boot', skitReady: null, openMenu: () => Game_openMenu() };

// ---------------------------------------------------------------- title scene
const titleScene = new THREE.Scene();
const Title = (() => {
  const sky = makeSky(titleScene); sky.set(SKY.title);
  const g = new THREE.Group(); titleScene.add(g);
  const nz = makeNoise(5);
  const hf = (x, z) => { const d = Math.hypot(x, z - 6); return Math.max(-6, 3.2 - d * d * 0.012) + nz(x * 0.05, z * 0.05) * 2 - (z < -20 ? (-20 - z) * 0.3 : 0); };
  makeTerrain(g, 400, 100, hf, (x, z, c) => { const n = nz(x * .07, z * .07); c.setRGB(0.36 + n * 0.12, 0.42 + n * 0.12, 0.42); }, TEX.grass, 60);
  grassField(g, 2500, () => { const x = rnd(-30, 30), z = rnd(-14, 30); return [x, hf(x, z), z, rnd(0.8, 1.6)]; }, 0x2a4a4a, 0x8aa0a0);
  cityBackdrop(g, -40, -320, 1.4);
  const rings = barrierRings(g, -40, 120, -330, 200, 3);
  mountains(g, 20, 500, 700, 0x4a4a7a);
  trees(g, [[-14, hf(-14, 4), 4, 1.6], [16, hf(16, 10), 10, 1.4], [-20, hf(-20, 16), 16, 1.8]], [0x2a5a50, 0x3a6a58]);
  const sieg = makeModel('sieg'); g.add(sieg.root);
  sieg.root.position.set(0, hf(0, 6), 6); sieg.root.rotation.y = Math.PI * 1.05;
  const lucia = makeModel('lucia'); g.add(lucia.root); lucia.root.position.set(-1.6, hf(-1.6, 7.4), 7.4); lucia.root.rotation.y = Math.PI * 1.1;
  const noa = makeModel('noa'); g.add(noa.root); noa.root.position.set(1.8, hf(1.8, 7.8), 7.8); noa.root.rotation.y = Math.PI * 0.95;
  const mo = motes(g, 60, 0, 0, 25, 0.5, 8, 0xffe7a8);
  let t = 0;
  return {
    update(dt) {
      t += dt; grassUniform.value += dt;
      for (const m of [sieg, lucia, noa]) m.update(dt, { speed: 0, groundY: m.root.position.y });
      rings.update(dt); mo.update(dt);
      const a = Math.sin(t * 0.05) * 0.25;
      camera.position.set(Math.sin(a) * 9 + 1, 4.2 + Math.sin(t * 0.1) * 0.3, 18 + Math.cos(a) * 2);
      camera.lookAt(-6, 9, -40);
      sky.update(dt, camera);
      renderer.render(titleScene, camera);
    }
  };
})();
Game.toTitle = function () {
  UI.stack.length = 0;
  ['#dlg', '#choice', '#skit', '#result', '#menu', '#tip', '#fhud', '#bhud', '#prologue'].forEach(s => $(s).classList.add('hide'));
  if (Battle.on) cleanupBattle();
  Game.mode = 'title'; Game.skitReady = null;
  $('#title').classList.remove('hide'); $('#title .press').classList.remove('hide'); $('#tmenu').classList.add('hide');
  $('#fade').style.opacity = 0; setTouchMode('none');
  Audio2.play('title');
  Game.titleStage = 0;
};
function titleMenu() {
  const tm = $('#tmenu'); tm.classList.remove('hide'); $('#title .press').classList.add('hide');
  const opts = [['NEW GAME', 'はじめから'], ['CONTINUE', 'つづきから'], ['CONTROLS', '操作説明']];
  const can = [true, hasSave(), true];
  let sel = can[1] ? 1 : 0;
  tm.innerHTML = opts.map((o, i) => `<button data-i="${i}" ${can[i] ? '' : 'disabled'}>${o[0]}<small>${o[1]}</small></button>`).join('');
  const btns = [...tm.querySelectorAll('button')];
  const paint = () => btns.forEach((b, i) => b.classList.toggle('sel', i === sel));
  paint();
  const go = (i) => {
    if (!can[i]) return;
    Audio2.sfx('ok');
    if (i === 2) { UI.pop(w); UI.controls(() => { titleMenu(); }); return; }
    UI.pop(w); tm.classList.add('hide');
    if (i === 0) newGame(); else continueGame();
  };
  btns.forEach((b, i) => { b.onclick = () => go(i); b.onmouseenter = () => { if (can[i]) { sel = i; paint(); } }; });
  const w = { update() { if (Input.pressed.u || Input.pressed.d) { do { sel = (sel + (Input.pressed.u ? 2 : 1)) % 3; } while (!can[sel]); paint(); Audio2.sfx('cursor'); } if (Input.pressed.ok) go(sel); } };
  UI.push(w);
}
async function newGame() {
  Object.keys(S).forEach(k => delete S[k]); Object.assign(S, JSON.parse(S_DEFAULT));
  S.chars = {}; initChar('sieg', 1);
  await fadeOut(800);
  $('#title').classList.add('hide');
  Audio2.play('title');
  const el = $('#prologue'); el.classList.remove('hide');
  const L = ['星核（アストラ）――', '古代文明が遺した、奇跡の結晶。', '人々はその力で街に「結界」を張り、<br>魔物の脅威から身を守って暮らしていた。', '帝都アウレリア。<br>空に結界の輪が輝く、世界でもっとも安全な都。', '――その片隅の下町で、<br>ひとつの小さな事件が起ころうとしていた。'];
  let skip = false; const onSkip = () => skip = true; el.addEventListener('pointerdown', onSkip);
  const w = { update() { if (Input.pressed.ok || Input.pressed.cancel) skip = true; } }; UI.push(w);
  $('#fade').style.opacity = 0;
  for (const l of L) {
    if (skip) break;
    el.innerHTML = `<p>${l}</p>`; const p = el.querySelector('p'); await wait(50); p.classList.add('on');
    for (let i = 0; i < 30 && !skip; i++) await wait(100);
    p.classList.remove('on'); for (let i = 0; i < 12 && !skip; i++) await wait(100);
  }
  UI.pop(w); el.removeEventListener('pointerdown', onSkip);
  $('#fade').style.transition = 'none'; $('#fade').style.opacity = 1; el.classList.add('hide');
  enterField('town', [-6, 14, Math.PI]);
  await wait(100); await fadeIn(1200);
}
async function continueGame() {
  await fadeOut(600);
  if (!loadGame()) { Game.toTitle(); return; }
  $('#title').classList.add('hide');
  enterField(S.area, S.pos || null);
  await fadeIn(800);
}
function enterField(area, spawn) {
  Game.mode = 'field';
  $('#fhud').classList.remove('hide');
  setTouchMode('field');
  Field.load(area, spawn || defaultSpawn(area));
}
function defaultSpawn(a) { return { town: [-6, 14, Math.PI], field: [134, 0, -Math.PI / 2], forest: [0, 97, Math.PI], ruins: [0, 84, Math.PI] }[a]; }
Game.goArea = async function (to, spawn) {
  Field.lock = true; Game.mode = 'trans';
  await fadeOut(400);
  Field.load(to, spawn);
  Game.mode = 'field'; Field.lock = false;
  await fadeIn(500);
};

// ---------------------------------------------------------------- encounter transition (glass shatter)
function shatter(url) {
  const host = $('#shatter'); host.innerHTML = '';
  const cols = 6, rows = 4, W = 100 / cols, H = 100 / rows;
  const pts = []; for (let r = 0; r <= rows; r++) { pts[r] = []; for (let c = 0; c <= cols; c++) pts[r][c] = [c * W + (c > 0 && c < cols ? rnd(-W * .3, W * .3) : 0), r * H + (r > 0 && r < rows ? rnd(-H * .3, H * .3) : 0)]; }
  const pieces = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const a = pts[r][c], b = pts[r][c + 1], d = pts[r + 1][c], e = pts[r + 1][c + 1];
    for (const tri of (Math.random() < 0.5 ? [[a, b, e], [a, e, d]] : [[a, b, d], [b, e, d]])) {
      const i = document.createElement('i');
      i.style.backgroundImage = `url(${url})`;
      i.style.clipPath = `polygon(${tri.map(p => p[0] + '% ' + p[1] + '%').join(',')})`;
      const cx = (tri[0][0] + tri[1][0] + tri[2][0]) / 3, cy = (tri[0][1] + tri[1][1] + tri[2][1]) / 3;
      i.style.transformOrigin = `${cx}% ${cy}%`;
      host.appendChild(i); pieces.push({ i, cx, cy });
    }
  }
  return {
    fly() {
      for (const p of pieces) {
        const dx = (p.cx - 50) * rnd(1.5, 3), dy = (p.cy - 50) * rnd(1.5, 3) + 30;
        p.i.style.transition = `transform ${rnd(0.7, 1.1)}s cubic-bezier(.4,.0,.8,.6), opacity 1s`;
        p.i.style.transform = `translate(${dx}vw, ${dy}vh) rotate(${rnd(-200, 200)}deg) scale(${rnd(0.6, 1)})`;
        p.i.style.opacity = 0;
      }
      setTimeout(() => host.innerHTML = '', 1300);
    }
  };
}
Game.startBattle = function (cfg, cb) {
  const prevMode = Game.mode;
  Game.mode = 'trans'; Field.lock = true;
  renderer.render(fieldScene, camera);
  let url = ''; try { url = canvas.toDataURL('image/jpeg', 0.75); } catch (_) { }
  flashScreen(0.6);
  Audio2.sfx('shatter');
  const sh = url ? shatter(url) : null;
  $('#fhud').classList.add('hide'); $('#prompt').classList.add('hide');
  setTimeout(() => {
    cfg.onEnd = async (res) => {
      Game.mode = 'trans';
      await fadeOut(350);
      Game.mode = 'field'; Field.lock = (Field.inEvent || 0) > 0;
      $('#fhud').classList.remove('hide'); setTouchMode('field'); updateGold();
      Audio2.play(S.flags.clear && Field.area === 'town' ? 'ending' : Field.def.music);
      Field.grace = 2.5;
      Field.snapCam();
      await fadeIn(400);
      cb && cb(res);
    };
    Battle.start(cfg);
    Game.mode = 'battle';
    if (sh) sh.fly();
    if (cfg.tutorial) battleTutorial();
  }, 380);
};
async function battleTutorial() {
  const T = [
    ['LINEAR MOTION BATTLE', `<kbd>←</kbd><kbd>→</kbd> で敵との<b>ライン上</b>を移動。<kbd>${keyLabel('atk')}</kbd> で通常攻撃（3連撃）。<br><kbd>${keyLabel('free')}</kbd> を押しっぱなしで<b>フリーラン</b>（自由に走る）。`, 6500],
    ['ARTES', `<kbd>${keyLabel('arte')}</kbd> で<b>術技</b>「${ARTES.souseninn.name}」！ <kbd>→</kbd>(敵の方向)＋<kbd>${keyLabel('arte')}</kbd> で「${ARTES.garou.name}」。<br>通常攻撃 → 術技 とつなげてコンボを狙え！ 術技は TP を消費する。`, 7000],
    ['DEFENSE', `<kbd>${keyLabel('guard')}</kbd> 押しっぱなしで<b>ガード</b>、<kbd>${keyLabel('jump')}</kbd> で<b>ジャンプ</b>。<kbd>${keyLabel('tgt')}</kbd> でターゲット切替。<br>左下の <b>OVER LIMIT</b> ゲージが溜まったら <kbd>${keyLabel('ol')}</kbd>！`, 7000],
  ];
  for (const [h, b, ms] of T) { if (!Battle.on) return; showTip(h, b, ms); await wait(ms + 300); }
}

// ---------------------------------------------------------------- main loop
let last = performance.now();
function frame(now) {
  const rdt = Math.min(0.05, Math.max(0.0001, (now - last) / 1000)); last = now;
  pollInput(rdt);
  if (UI.update(rdt)) clearPressed();
  if (Game.mode === 'title') {
    if (Game.titleStage === 0 && (Input.any || Input.pressed.ok)) { Game.titleStage = 1; Input.any = false; Audio2.unlock(); Audio2.play('title'); Audio2.sfx('ok'); titleMenu(); }
    Title.update(rdt);
  } else if (Game.mode === 'battle') { S.time += rdt; Battle.update(rdt); }
  else if (Game.mode === 'field' || Game.mode === 'menu') { S.time += rdt; Field.update(rdt); }
  else if (Game.mode === 'trans') { if (Battle.on) Battle.update(rdt); else if (Field.A) Field.update(rdt); else Title.update(rdt); }
  Input.any = false;
  requestAnimationFrame(frame);
}
// boot
(function boot() {
  Game.toTitle();
  // debug shortcuts: ?debug&area=forest&lv=8&party=sieg,lucia,noa&battle=bear
  if (DEBUG) {
    const q = new URLSearchParams(location.search);
    Object.keys(S).forEach(k => delete S[k]); Object.assign(S, JSON.parse(S_DEFAULT)); S.chars = {};
    const lv = +(q.get('lv') || 1);
    for (const id of (q.get('party') || 'sieg').split(',')) { S.party.includes(id) || S.party.push(id); initChar(id, lv); }
    S.party = (q.get('party') || 'sieg').split(',');
    for (const f of (q.get('flags') || '').split(',')) if (f) S.flags[f] = 1;
    if (q.get('ol')) Battle.ol.g = 100;
    if (q.get('area')) {
      $('#title').classList.add('hide');
      enterField(q.get('area'), q.get('pos') ? q.get('pos').split(',').map(Number) : null);
      if (q.get('battle')) setTimeout(() => Game.startBattle({ enemies: q.get('battle').split(','), area: q.get('arena') || q.get('area'), boss: !!q.get('boss') }, () => { }), 400);
    }
  }
  requestAnimationFrame(frame);
})();
</script>
