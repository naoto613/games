name: layerx-radar data update
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths: ['layerx-radar/data/sources.json', 'layerx-radar/scripts/**']
permissions:
  contents: write
concurrency:
  group: layerx-radar-update
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: layerx-radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect public feeds (no API key)
        run: python scripts/fetch_sources.py
      - name: Commit updated JSON when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "layerx-radar: 公開フィードからデータを更新"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
