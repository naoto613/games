<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2a7fd6">
<title>ふーたんと そよかぜの タクト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Yusei+Magic&display=swap" rel="stylesheet">
<style>
:root{--ink:#fffdf3;--gold:#ffd84a;--gold2:#f0a81c;--green:#46c23b;--red:#e2463a;--yellow:#f6c21c;--blue:#3a8de8;--box:rgba(18,22,40,.78)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2a7fd6;color:var(--ink);font-family:"Kiwi Maru","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hide{display:none!important}
.mg{font-family:"Yusei Magic","Kiwi Maru",sans-serif}
#fade{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40;transition:opacity .5s}
#fade.black{background:#000}
#bars{position:fixed;inset:0;pointer-events:none;z-index:4}
#bars:before,#bars:after{content:"";position:absolute;left:0;right:0;height:0;background:#000;transition:height .5s}
#bars:before{top:0}#bars:after{bottom:0}
#bars.on:before,#bars.on:after{height:9vh}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hearts{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));display:flex;flex-wrap:wrap;width:min(60vw,330px);gap:2px}
#hearts svg{width:30px;height:28px;filter:drop-shadow(1px 2px 0 rgba(0,0,0,.45))}
#hearts.hurt{animation:hb .35s}
@keyframes hb{50%{transform:scale(1.15)}}
#magic{margin-top:4px;width:120px;height:10px;border-radius:6px;background:rgba(0,0,0,.45);border:2px solid #fff8d8;overflow:hidden}
#magic i{display:block;height:100%;width:100%;background:linear-gradient(#9cf06a,#3fb02a)}
#leftcol{position:absolute;left:max(14px,env(safe-area-inset-left));top:calc(max(10px,env(safe-area-inset-top)) + 34px)}
#pearls{display:flex;gap:4px;margin-top:6px}
#pearls i{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(0,0,0,.25);display:block}
#pearls i.g.on{background:radial-gradient(circle at 35% 30%,#fff 0 18%,#5df05a 30%,#1a9a2a);border-color:#fff}
#pearls i.r.on{background:radial-gradient(circle at 35% 30%,#fff 0 18%,#ff7a5a 30%,#c42020);border-color:#fff}
#pearls i.b.on{background:radial-gradient(circle at 35% 30%,#fff 0 18%,#6ad0ff 30%,#1a5ad0);border-color:#fff}
#rupee{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:6px;font-size:26px;font-weight:500;color:#fff;text-shadow:2px 2px 0 #1a2a10,0 0 4px #1a2a10;background:rgba(0,0,0,.28);border-radius:20px;padding:2px 14px 2px 8px}
#rupee svg{width:22px;height:30px}
#obj{position:absolute;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);max-width:min(56vw,560px);background:rgba(10,30,60,.55);border:2px solid rgba(255,255,255,.5);border-radius:18px;padding:4px 16px;font-size:clamp(13px,2vw,17px);text-align:center;text-shadow:1px 1px 0 #000;line-height:1.4}
#obj:empty{display:none}
#obj b{color:var(--gold)}
#wind{position:absolute;right:max(14px,env(safe-area-inset-right));top:calc(max(10px,env(safe-area-inset-top)) + 56px);width:84px;height:84px}
#area{position:absolute;left:0;right:0;top:26%;text-align:center;opacity:0;transition:opacity 1s;pointer-events:none}
#area .n{display:inline-block;font-size:clamp(30px,6vw,56px);color:#fff;text-shadow:0 0 12px rgba(0,40,90,.7),3px 3px 0 rgba(0,30,70,.6);letter-spacing:.12em;padding:0 30px;position:relative}
#area .n:before,#area .n:after{content:"";position:absolute;top:52%;width:22vw;max-width:200px;height:3px;background:linear-gradient(90deg,transparent,#fff)}
#area .n:before{right:100%}#area .n:after{left:100%;transform:scaleX(-1)}
#area .s{font-size:clamp(14px,2.2vw,20px);color:#fff4c0;text-shadow:2px 2px 0 rgba(0,30,70,.7);margin-top:4px;letter-spacing:.2em}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:clamp(20px,3.6vw,32px);color:#fff;text-shadow:0 0 6px #0a2a5a,2px 2px 0 #0a2a5a;opacity:0;transition:opacity .3s;white-space:nowrap}
#counter{position:absolute;right:max(14px,env(safe-area-inset-right));top:calc(max(10px,env(safe-area-inset-top)) + 150px);font-size:22px;color:#fff;text-shadow:2px 2px 0 #000;background:rgba(0,0,0,.35);border-radius:12px;padding:2px 12px}
#counter:empty{display:none}
#bossbar{position:absolute;left:50%;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 6px);transform:translateX(-50%);width:min(60vw,460px);text-align:center;font-size:16px;text-shadow:1px 1px 0 #000}
#bossbar .b{height:14px;border-radius:8px;border:2px solid #fff;background:rgba(0,0,0,.5);overflow:hidden;margin-top:2px}
#bossbar .b i{display:block;height:100%;background:linear-gradient(#ff8a6a,#d02a2a);transition:width .3s}

/* ---------- touch / buttons ---------- */
#tc{position:fixed;inset:0;z-index:6;pointer-events:none}
#stickBase{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;border:3px solid rgba(255,255,255,.6);background:rgba(255,255,255,.12)}
#stickKnob{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 2px 8px rgba(0,0,0,.3)}
#stickHint{position:absolute;left:max(36px,env(safe-area-inset-left));bottom:max(70px,env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;border:3px dashed rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;color:#fff;text-shadow:1px 1px 0 #000}
.tb{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:4px solid #fff;color:#fff;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;text-shadow:1px 1px 0 rgba(0,0,0,.5);padding:0;box-shadow:0 4px 0 rgba(0,0,0,.25),inset 0 -6px 0 rgba(0,0,0,.15);cursor:pointer}
.tb .k{font-size:22px;font-family:"Yusei Magic",sans-serif}
.tb .lb{font-size:12px;margin-top:3px;white-space:nowrap}
.tb.on{transform:scale(.92)}
.tb.dim{opacity:.35}
.tb.pulse{animation:pu 1s ease-in-out infinite}
@keyframes pu{50%{box-shadow:0 0 0 6px rgba(255,255,255,.5),0 0 24px #fff}}
#bA{background:var(--green);right:max(22px,env(safe-area-inset-right));bottom:max(26px,env(safe-area-inset-bottom));width:92px;height:92px}
#bA .k{font-size:30px}
#bB{background:var(--red);right:calc(max(22px,env(safe-area-inset-right)) + 104px);bottom:max(14px,env(safe-area-inset-bottom));width:74px;height:74px}
#bY{background:var(--yellow);right:calc(max(22px,env(safe-area-inset-right)) + 18px);bottom:calc(max(26px,env(safe-area-inset-bottom)) + 104px);width:70px;height:70px}
#bMap{position:absolute;pointer-events:auto;right:max(14px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));width:50px;height:46px;border-radius:12px;border:3px solid #fff;background:#d9b06a;font-size:24px;box-shadow:0 3px 0 rgba(0,0,0,.25);cursor:pointer;padding:0}
#bSnd{position:absolute;pointer-events:auto;right:calc(max(14px,env(safe-area-inset-right)) + 58px);top:max(10px,env(safe-area-inset-top));width:46px;height:46px;border-radius:12px;border:3px solid #fff;background:rgba(0,0,0,.3);font-size:20px;cursor:pointer;padding:0;color:#fff}

/* ---------- dialog ---------- */
#dlg{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(94vw,760px);min-height:120px;background:var(--box);border:3px solid rgba(255,255,255,.85);border-radius:26px;padding:18px 26px 22px;z-index:12;font-size:clamp(18px,2.8vw,25px);line-height:1.6;box-shadow:0 8px 30px rgba(0,0,0,.35);cursor:pointer}
#dlg .nm{position:absolute;left:26px;top:-20px;background:#f6c21c;color:#4a2a00;border:3px solid #fff;border-radius:14px;padding:0 16px;font-size:18px;line-height:30px}
#dlg .nm:empty{display:none}
#dlg .tx b{color:var(--gold)}
#dlg .tx em{font-style:normal;color:#8fe0ff}
#dlg .nx{position:absolute;right:22px;bottom:8px;font-size:20px;color:var(--gold);animation:nx .6s ease-in-out infinite alternate}
@keyframes nx{to{transform:translateY(5px)}}
#choices{display:flex;gap:12px;justify-content:center;margin-top:10px;flex-wrap:wrap}
#choices button{font:inherit;font-size:20px;color:#fff;background:#2a6ad0;border:3px solid #fff;border-radius:16px;padding:6px 22px;cursor:pointer}

/* ---------- item get ---------- */
#get{position:fixed;left:50%;top:14%;transform:translateX(-50%) scale(.6);opacity:0;z-index:11;transition:all .35s cubic-bezier(.2,1.6,.4,1);text-align:center;pointer-events:none}
#get.on{opacity:1;transform:translateX(-50%) scale(1)}
#get .t{font-size:clamp(24px,4.4vw,40px);color:#fff;text-shadow:0 0 10px #f0a81c,3px 3px 0 #8a4a00;white-space:nowrap}
#get .ic{font-size:64px;filter:drop-shadow(0 0 14px #fff6a0)}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
#title{flex-direction:column;justify-content:space-between;background:linear-gradient(rgba(0,30,80,.28),rgba(0,0,0,0) 32%,rgba(0,0,0,0) 70%,rgba(0,30,80,.3))}
#title .tbot{display:flex;flex-direction:column;align-items:center}
.logo{text-align:center;margin-top:3vh;filter:drop-shadow(0 6px 0 rgba(10,40,90,.35))}
.logo .pre{font-size:clamp(20px,3.4vw,32px);color:#fff;letter-spacing:.2em;text-shadow:2px 2px 0 #1a4a8a}
.logo .main{white-space:nowrap;font-size:clamp(30px,9.4vw,100px);line-height:1.05;letter-spacing:.06em;background:linear-gradient(#fff9d0 10%,#ffd84a 45%,#e8960a 80%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #6a3a00;padding:0 .1em}
.logo .en{font-size:clamp(10px,2vw,18px);color:#e8f4ff;letter-spacing:clamp(.1em,1vw,.5em);margin-top:2px;text-shadow:1px 1px 0 #1a4a8a}
.tbtns{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;align-items:center}
.btn{appearance:none;font:inherit;font-size:22px;color:#fff;background:linear-gradient(#5ab0ff,#2a6ad0);border:4px solid #fff;border-radius:40px;padding:8px 42px;cursor:pointer;text-shadow:1px 1px 0 #0a3a80;box-shadow:0 5px 0 #1a4a90,0 10px 20px rgba(0,0,0,.25);min-width:240px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1a4a90}
.btn.g{background:linear-gradient(#7ae05a,#2a9a2a);box-shadow:0 5px 0 #1a6a1a,0 10px 20px rgba(0,0,0,.25);text-shadow:1px 1px 0 #1a5a1a}
.btn.s{font-size:16px;min-width:0;padding:5px 20px}
.keys{margin-top:1.4vh;font-size:13px;color:#fff;text-shadow:1px 1px 0 #1a4a8a;text-align:center;line-height:1.9}
.keys b{display:inline-block;background:rgba(255,255,255,.25);border-radius:5px;padding:0 6px;margin:0 2px}
#back{position:fixed;z-index:21;top:max(10px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));font-size:13px;color:#fff;text-decoration:none;background:rgba(0,30,80,.45);border:2px solid rgba(255,255,255,.6);border-radius:999px;padding:5px 14px}

#intro{background:#2a1a0a;z-index:25;flex-direction:column;cursor:pointer}
#intro .pg{width:min(92vw,720px);aspect-ratio:16/10;max-height:62vh;background:radial-gradient(ellipse at center,#f6e6bf 55%,#d9bf8a);border-radius:10px;box-shadow:0 0 0 6px #6a4a24,0 0 0 9px #3a2410,0 20px 60px rgba(0,0,0,.6);position:relative;overflow:hidden;transition:opacity .6s}
#intro svg{position:absolute;inset:0;width:100%;height:100%}
#intro .cap{margin-top:4vh;width:min(92vw,720px);font-size:clamp(18px,3vw,26px);line-height:1.7;color:#f6e6bf;text-align:center;min-height:3.4em;text-shadow:0 2px 0 #000}
#intro .skip{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));font-size:14px;color:#c9b080}

#song{z-index:15;background:radial-gradient(ellipse at center,rgba(20,40,90,.55),rgba(5,10,30,.82));flex-direction:column}
#song .t{font-size:clamp(20px,3.4vw,30px);text-shadow:2px 2px 0 #000;margin-bottom:12px;text-align:center}
#staff{display:flex;gap:16px;margin-bottom:18px}
#staff i{width:64px;height:64px;border-radius:50%;border:4px dashed rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:34px;color:rgba(255,255,255,.4)}
#staff i.ok{border-style:solid;border-color:#fff;background:#f6c21c;color:#fff;text-shadow:1px 1px 0 #8a5a00}
#pad{display:grid;grid-template-columns:repeat(3,84px);grid-template-rows:repeat(3,84px);gap:10px}
#pad button{font:inherit;font-size:40px;border-radius:50%;border:4px solid #fff;background:#3a8de8;color:#fff;cursor:pointer;box-shadow:0 4px 0 #1a4a90;padding:0}
#pad button:active{transform:translateY(3px)}
#pad .c{background:#f6c21c;font-size:16px;line-height:1.2;box-shadow:0 4px 0 #9a6a00}
#pad .x{visibility:hidden}
#song .cl{margin-top:16px}

#mapov{z-index:15;background:rgba(10,20,50,.7);flex-direction:column}
#mapc{width:min(92vw,78vh);aspect-ratio:1;border-radius:10px;box-shadow:0 0 0 6px #6a4a24,0 20px 50px rgba(0,0,0,.5);background:#e9d6a8}
#mapov .cl{margin-top:14px}

@media (max-width:640px){
  #obj{left:14px;transform:none;top:calc(max(10px,env(safe-area-inset-top)) + 38px);max-width:calc(100vw - 132px);text-align:left;font-size:12px;padding:3px 10px;border-radius:12px}
  #leftcol{top:auto;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 44px)}
  #hearts svg{width:26px;height:24px}
  .logo{margin-top:52px}
  #wind{width:72px;height:72px}
  #counter{top:calc(max(10px,env(safe-area-inset-top)) + 136px);font-size:16px}
}
#ending{z-index:22;flex-direction:column;background:linear-gradient(#ffb36b,#ff7a8a 50%,#6a4ab0);text-align:center}
#ending h1{font-size:clamp(40px,8vw,80px);margin:0;color:#fff;text-shadow:0 4px 0 #a03a6a}
#ending p{font-size:clamp(16px,2.6vw,22px);line-height:1.9;text-shadow:1px 1px 0 #a03a6a}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bars"></div>
<div id="hud" class="hide">
  <div id="hearts"></div>
  <div id="leftcol"><div id="magic" class="hide"><i></i></div><div id="pearls" class="hide"><i class="g"></i><i class="r"></i><i class="b"></i></div></div>
  <div id="rupee"><svg viewBox="0 0 22 30"><path d="M11 1 21 9v12L11 29 1 21V9z" fill="#3ee05a" stroke="#0c4a14" stroke-width="2"/><path d="M11 4 6 10v10l5 5z" fill="#b8ffb0" opacity=".8"/></svg><span id="rnum">0</span></div>
  <div id="obj"></div>
  <canvas id="wind" width="168" height="168" class="hide"></canvas>
  <div id="counter"></div>
  <div id="bossbar" class="hide"><div class="mg" id="bossname">ガルガ</div><div class="b"><i id="bosshp"></i></div></div>
  <div id="area"><div class="n mg"></div><div class="s"></div></div>
  <div id="toast" class="mg"></div>
</div>
<div id="tc" class="hide">
  <div id="stickHint">ここを ゆびで<br>うごかすと<br>あるくよ</div>
  <div id="stickBase" class="hide"></div><div id="stickKnob" class="hide"></div>
  <button class="tb" id="bA"><span class="k">A</span><span class="lb">きる</span></button>
  <button class="tb" id="bB"><span class="k">B</span><span class="lb">ジャンプ</span></button>
  <button class="tb" id="bY"><span class="k">Y</span><span class="lb"></span></button>
  <button id="bMap">🗺</button>
  <button id="bSnd">🔊</button>
</div>
<div id="dlg" class="hide"><div class="nm"></div><div class="tx"></div><div id="choices"></div><div class="nx">▼</div></div>
<div id="get"><div class="ic"></div><div class="t mg"></div></div>

<div id="title" class="ov hide">
  <div class="logo">
    <div class="pre mg">ふーたんと</div>
    <div class="main mg">そよかぜの タクト</div>
    <div class="en">FU-TAN AND THE BREEZE BATON</div>
  </div>
  <div class="tbot">
  <div class="tbtns">
    <button class="btn g mg" id="bNew">はじめから</button>
    <button class="btn mg hide" id="bCont">つづきから</button>
  </div>
  <div class="keys" id="keys">キーボード：<b>WASD</b>/<b>←↑↓→</b> いどう　<b>Z</b> A（きる・はなす）　<b>X</b> B（ジャンプ）　<b>C</b> Y（どうぐ）　<b>M</b> ちず　<b>マウスドラッグ</b> カメラ</div>
  </div>
</div>
<a id="back" href="../">← ゲームいちらん</a>

<div id="intro" class="ov hide"><div class="pg"><svg viewBox="0 0 640 400" id="isvg"></svg></div><div class="cap mg" id="icap"></div><div class="skip">タップで つぎへ ▶</div></div>

<div id="song" class="ov hide">
  <div class="t mg" id="songT">タクトを ふって かぜの うたを ひこう！</div>
  <div id="staff"><i>↑</i><i>←</i><i>→</i></div>
  <div id="pad">
    <button class="x"></button><button data-n="u">↑</button><button class="x"></button>
    <button data-n="l">←</button><button class="c" data-n="c">♪</button><button data-n="r">→</button>
    <button class="x"></button><button data-n="d">↓</button><button class="x"></button>
  </div>
  <button class="btn s cl mg" id="songX">やめる</button>
</div>

<div id="mapov" class="ov hide"><canvas id="mapc" width="900" height="900"></canvas><button class="btn s cl mg" id="mapX">とじる</button></div>

<div id="ending" class="ov hide">
  <h1 class="mg">おしまい</h1>
  <p class="mg" id="endtx"></p>
  <button class="btn g mg" id="endB">うみを ぼうけんする</button>
</div>
<div id="fade"></div>
<script src="./three.min.js"></script>
<script>
'use strict';
// ================================================================ utils
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const V3 = THREE.Vector3;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const angDiff = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));
const dampAng = (a, b, k, dt) => a + angDiff(a, b) * (1 - Math.exp(-k * dt));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const dist2 = (ax, az, bx, bz) => Math.hypot(ax - bx, az - bz);
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
const DEBUG = /debug/.test(location.search);

// ================================================================ renderer
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, isTouch ? 1.6 : 2));
renderer.setClearColor(0x8fd0ff);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xc4ecff, 260, 1150);
const camera = new THREE.PerspectiveCamera(55, 1, 0.3, 4000);
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w < h ? 70 : 55;
  camera.updateProjectionMatrix();

function say(who, html, o = {}) {
  return new Promise(res => {
    const sp = SPK[who] || [who, 300];
    Story.talker = who === 'futan' ? null : who; PL.talk = who === 'futan';
    dlgEl.classList.remove('hide'); dlgNm.textContent = sp[0]; dlgTx.innerHTML = ''; dlgNx.style.visibility = 'hidden'; choicesEl.innerHTML = '';
    // typewriter over text nodes (keeps tags)
    const tmp = document.createElement('div'); tmp.innerHTML = html;
    const full = tmp.innerHTML; let shown = 0; const plain = tmp.textContent.length;
    const D = { done: false, typing: true };
    function render(n) {
      // clone and truncate text
      const c = tmp.cloneNode(true); let left = n;
      (function walk(node) { for (const ch of [...node.childNodes]) { if (ch.nodeType === 3) { if (left <= 0) ch.textContent = ''; else if (ch.textContent.length > left) { ch.textContent = ch.textContent.slice(0, left); left = 0; } else left -= ch.textContent.length; } else walk(ch); } })(c);
      dlgTx.innerHTML = c.innerHTML;
    }
    const iv = setInterval(() => {
      shown += 2; render(shown);
      if (sp[1] && shown % 6 === 0) Audio2.voice(sp[1], 1);
      if (shown >= plain) { clearInterval(iv); D.typing = false; dlgTx.innerHTML = full; dlgNx.style.visibility = o.choices ? 'hidden' : 'visible'; if (o.choices) showChoices(); }
    }, 34);

    Story.dlg = {
      adv() {
        if (D.typing) { clearInterval(iv); D.typing = false; dlgTx.innerHTML = full; dlgNx.style.visibility = o.choices ? 'hidden' : 'visible'; if (o.choices) showChoices(); return; }
        if (!o.choices) { Audio2.sfx('click'); finish(0); }
      }

  });
}

function checkTriggers(dt) {
  if (Story.cut) return;
  const p = PL.pos;
  // intro handled by startGame
  if (F.sword && !F.taken && PL.mode === 'foot') { const r = W('home', -20, -24); if (Math.hypot(p.x - r.x, p.z - r.z) < 13) kidnap(); }

  // fire gate hint
  if (PL.mode === 'foot' && PL.island === ISL.fire && !S.items.leaf) { for (const f of Things.fires) if (f.on && Math.hypot(p.x - f.x, p.z - f.z) < 6 && (!Story.fhT || World.t - Story.fhT > 8)) { Story.fhT = World.t; toast('あつい！ ほのおを けす どうぐが ひつようだ'); } }

  if (PL.mode === 'foot' && PL.island === ISL.fortress && F.tower && !F.fortMet) { F.fortMet = 1; fortArrive(); }

}

// block push
function updateBlock(dt) {
  const B = Puzzle.block; if (!B || B.solved) { PL.push = 0; return; }
  const bx = B.I.x + B.lx, bz = B.I.z + B.lz;
  if (B.moving) {
    B.moving -= dt; const k = 1 - Math.max(0, B.moving) / 0.6;
    B.lz = lerp(B.from, B.to, smooth(0, 1, k)); B.g.position.z = B.lz; B.g.position.y = tH(B.I, B.lx, B.lz);
    B.col.x = B.I.x + B.lx; B.col.z = B.I.z + B.lz;
    if (B.moving <= 0) { B.moving = 0; B.lz = B.to; if (B.lz >= B.z1 - 0.01) solveGate(); }
    return;
  }
  if (PL.mode !== 'foot' || Story.cut) { PL.push = 0; return; }
  const dx = bx - PL.pos.x, dz = bz - PL.pos.z, d = Math.hypot(dx, dz);
  const mv = Math.hypot(Input.mx, Input.my) > 0.4;
  // must be pushing along z axis
  const fz = Math.cos(PL.face), fx = Math.sin(PL.face);
  if (d < 2.4 && mv && PL.onGround && Math.abs(dz) > Math.abs(dx) * 1.3 && (dx * fx + dz * fz) / d > 0.7) {
    PL.push += dt;
    if (PL.push > 0.45) {
      const dir = Math.sign(dz), to = clamp(B.lz + dir * 4, B.z0, B.z1);
      PL.push = 0;
      if (Math.abs(to - B.lz) > 0.1) { B.from = B.lz; B.to = to; B.moving = 0.6; Audio2.sfx('push'); }
      else Audio2.sfx('rock');
    }
  } else PL.push = Math.max(0, PL.push - dt * 2);
}
async function solveGate() {
  const B = Puzzle.block; B.solved = true; F.gate = 1; Audio2.sfx('click');

  renderer.render(scene, camera);
}

  const ctl = playing && !Story.cut && !Story.dlg && !Story.talking && !Song.isOpen;
  // actions

  if (ctl) {
    act = findAction();
    if (Input.pressed.A && act) {

    setBtn('B', PL.mode === 'boat' ? 'ジャンプ' : PL.swim ? '' : 'ジャンプ', PL.swim);
    let y = ''; if (PL.mode === 'foot' && S.items.leaf && !PL.swim) y = PL.onGround ? 'うちわ' : PL.glide ? 'やめる' : 'ふんわり'; else if (S.items.baton) y = 'タクト';
    setBtn('Y', y, !y);

  }
  // updates

    else { BOAT.P.g.position.y = waveH(BOAT.pos.x, BOAT.pos.z) * 0.8; BOAT.P.g.position.x = BOAT.pos.x; BOAT.P.g.position.z = BOAT.pos.z; BOAT.P.g.rotation.set(Math.sin(World.t * 1.3) * 0.04, BOAT.head, Math.sin(World.t * 1.1) * 0.05); animBoat(BOAT.P, dt, 0, Story.talker === 'leon'); Audio2.setWind(0); }

    checkTriggers(dt); updateAmbient(dt); updateIslandState(dt); updateBeacon();
    HUD.update(); drawWind();

  } else {
    // title: orbit the boat on the sea
    const a = World.t * 0.08;
    BOAT.pos.set(Math.sin(World.t * 0.1) * 6, 0, 90); BOAT.head = Math.PI + 0.25;
    BOAT.P.g.position.set(BOAT.pos.x, waveH(BOAT.pos.x, BOAT.pos.z) * 0.8, BOAT.pos.z); BOAT.P.g.rotation.set(Math.sin(World.t * 1.3) * 0.05, BOAT.head, Math.sin(World.t) * 0.05);
    animBoat(BOAT.P, dt, 1, false);
    PL.P.g.position.set(BOAT.pos.x - Math.sin(BOAT.head) * 0.9, BOAT.P.g.position.y + 0.5, BOAT.pos.z - Math.cos(BOAT.head) * 0.9); PL.P.g.rotation.y = a + 0.35; PL.P.g.position.y += 0.15; PL.P.baton.visible = true; PL.P.sword.visible = false; animFutan(PL.P, { conduct: true }, dt); PL.P.shadow.visible = false;
    camCut(BOAT.pos.x + Math.sin(a) * 10.5, 3.6 + Math.sin(World.t * 0.2) * 0.6, BOAT.pos.z + Math.cos(a) * 10.5, BOAT.pos.x, 2.9, BOAT.pos.z, 2, Game.firstTitle !== false); Game.firstTitle = false;
    World.wind.dir = BOAT.head; updateAmbient(dt); Enemies.update(dt);
  }
  updateCamera(dt);
  FX.update(dt);
  applyMood(dt);
  seaMat.uniforms.time.value = World.t;
  sea.position.set(Math.round(camera.position.x / 20) * 20, 0, Math.round(camera.position.z / 20) * 20);
  sky.position.copy(camera.position);
  const sd = new V3(0.45, 0.55, -0.7).normalize(); sunSpr.position.copy(camera.position).addScaledVector(sd, 1500);
  updateWind(dt, PL.mode === 'boat' ? BOAT.pos : PL.pos, playing ? (PL.mode === 'boat' ? 0.9 : 0.25) : 0.6);
}

// ================================================================ boot
initWorld();
setMood('day', true);
if (loadSave() && loadSave().flags && loadSave().flags.clothes) $('#bCont').classList.remove('hide');
$('#title').classList.remove('hide');
if (isTouch) $('#keys').classList.add('hide');
requestAnimationFrame(frame);
// debug helpers
if (DEBUG) {
  window.DBG = { Song, S, F, PL, BOAT, ISL, Story, Boss, Enemies, CAM, Puzzle, Race, World,
    warp(id, foot = true) { const I = ISL[id]; if (foot) { PL.mode = 'foot'; placePlayer(I.x + (I.spawn ? I.spawn.x : 0), I.z + (I.spawn ? I.spawn.z : I.R + 5), Math.PI); } else { PL.mode = 'boat'; const d = I.dock || { x: 0, z: I.R + 10 }; placeBoat(I.x + d.x, I.z + d.z + 12, Math.PI); } refreshGear(); camFollow(); },
    async sim(sec, keys) { const n = Math.round(sec * 30); for (let i = 0; i < n; i++) { if (keys) Object.assign(Input.keys, keys); step(1 / 30); for (let k = 0; k < 12; k++) await null; } if (keys) for (const k in keys) Input.keys[k] = 0; },
    async press(k) { Input.keys[k] = 1; step(1 / 30); for (let j = 0; j < 12; j++) await null; Input.keys[k] = 0; step(1 / 30); for (let j = 0; j < 12; j++) await null; },
    async talk(n, gap = 0.5) { for (let i = 0; i < n; i++) { await this.press('KeyZ'); await this.sim(gap); } },
    obj() { return document.querySelector('#obj').textContent; }, dlg() { return document.querySelector('#dlg').classList.contains('hide') ? '' : document.querySelector('#dlg .tx').textContent; },
    give() { Object.assign(S.items, { sword: 1, shield: 1, baton: 1, leaf: 1 }); Object.assign(F, { start: 1, clothes: 1, sword: 1, taken: 1, boat: 1 }); S.outfit = 'hero'; setOutfit(PL.P, 'hero'); placeBoat(ISL.home.x + 3.4, ISL.home.z + 58, Math.PI); refreshGear(); setObjective(); },
  };
