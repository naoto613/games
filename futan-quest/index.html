<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05070c">
<title>ふーたん クエスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Shippori+Mincho+B1:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff;--sub:#c9c9c9;--gold:#ffd45a;--hp:#7fe07a;--mp:#7ab8ff;--warn:#ffb23f;--dead:#ff5b4f;--win:rgba(4,6,14,.86)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation;margin:0;height:100%;overflow:hidden;background:#05070c;color:var(--ink);font-family:"DotGothic16","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hide{display:none!important}
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%)}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:60;transition:opacity .45s}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:59}
#swirl{position:fixed;inset:0;pointer-events:none;z-index:58;opacity:0}

/* ---------- DQ style windows ---------- */
.win{position:absolute;background:var(--win);border:3px solid #fff;border-radius:10px;box-shadow:0 0 0 2px rgba(0,0,0,.65),0 6px 22px rgba(0,0,0,.5);padding:12px 16px;font-size:clamp(17px,2.4vw,22px);line-height:1.6;letter-spacing:.06em;color:#fff;text-shadow:0 1px 0 #000}
.win .ttl{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:#05070c;padding:0 10px;font-size:.8em;white-space:nowrap;border-radius:4px}
.list{list-style:none;margin:0;padding:0}
.list li{position:relative;padding:2px 6px 2px 26px;cursor:pointer;white-space:nowrap;border-radius:4px}
.list li.dis{color:#777}
.list li.sel::before{content:"▶";position:absolute;left:2px;top:2px;font-size:.85em;animation:blink .8s steps(2) infinite}
.list li .r{float:right;margin-left:18px;color:var(--sub)}
.list.cols{display:grid;grid-template-columns:1fr 1fr;column-gap:6px}
@keyframes blink{50%{opacity:0}}
#msg{left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:min(94vw,860px);min-height:132px;z-index:40;cursor:pointer}
#msg .tx{white-space:pre-wrap;min-height:4.8em}
#msg .nx{position:absolute;right:14px;bottom:6px;animation:blink .7s steps(2) infinite;font-size:.8em}
#msg .who{color:var(--gold)}
.dmg{position:fixed;z-index:35;font-family:"DotGothic16",sans-serif;font-size:clamp(26px,4vw,40px);font-weight:900;color:#fff;-webkit-text-stroke:1.5px #000;text-shadow:0 3px 0 #000;pointer-events:none;transform:translate(-50%,-50%);white-space:nowrap}
.dmg.heal{color:#8dff8a}.dmg.miss{color:#ccc;font-size:22px}.dmg.crit{color:#ffd45a;font-size:clamp(34px,5vw,52px)}.dmg.hurt{color:#ff7a6a}

/* ---------- field HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#party{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));display:flex;gap:8px}
.pc{background:var(--win);border:2px solid #fff;border-radius:8px;padding:5px 9px 6px;min-width:118px;font-size:15px;line-height:1.25;box-shadow:0 0 0 2px rgba(0,0,0,.6)}
.pc .nm{display:flex;justify-content:space-between;gap:8px}
.pc .nm i{font-style:normal;color:var(--sub);font-size:13px}
.pc .bar{height:6px;background:rgba(255,255,255,.15);border-radius:3px;margin-top:3px;overflow:hidden}
.pc .bar b{display:block;height:100%;background:var(--hp);transition:width .3s}
.pc .bar.m b{background:var(--mp)}
.pc .nums{font-size:13px;color:var(--sub);display:flex;justify-content:space-between}
.pc.low{border-color:var(--warn)}.pc.low .nm{color:var(--warn)}
.pc.dead{border-color:var(--dead)}.pc.dead .nm{color:var(--dead)}
.pc.act{box-shadow:0 0 0 2px rgba(0,0,0,.6),0 0 14px 2px rgba(255,212,90,.8);border-color:var(--gold)}
#gold{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));background:var(--win);border:2px solid #fff;border-radius:8px;padding:4px 12px;font-size:17px;box-shadow:0 0 0 2px rgba(0,0,0,.6)}
#gold b{color:var(--gold);font-weight:400}
#area{position:absolute;left:50%;top:26%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity 1s;font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:clamp(28px,5vw,48px);color:#fff;text-shadow:0 0 12px rgba(0,0,0,.9),0 2px 3px #000;letter-spacing:.2em;white-space:nowrap}
#area small{display:block;font-size:.4em;letter-spacing:.4em;color:#e9dcb4;margin-top:4px}
#hint{position:absolute;left:50%;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 8px);transform:translateX(-50%);background:var(--win);border:2px solid #fff;border-radius:8px;padding:5px 14px;font-size:17px;opacity:0;transition:opacity .25s;white-space:nowrap}
#hint b{color:var(--gold);font-weight:400}
#quest{position:absolute;right:max(12px,env(safe-area-inset-right));top:calc(max(10px,env(safe-area-inset-top)) + 44px);max-width:min(44vw,300px);text-align:right;font-size:14px;color:#f3e7c2;text-shadow:0 1px 2px #000,0 0 6px #000;line-height:1.4}
#quest::before{content:"もくてき";display:block;font-size:11px;color:#bbb;letter-spacing:.3em}
#compass{position:absolute;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);width:220px;height:26px;overflow:hidden;background:linear-gradient(90deg,transparent,rgba(0,0,0,.55) 20%,rgba(0,0,0,.55) 80%,transparent);font-size:14px;color:#ddd;-webkit-mask-image:linear-gradient(90deg,transparent,#000 25%,#000 75%,transparent);mask-image:linear-gradient(90deg,transparent,#000 25%,#000 75%,transparent)}
#compass .strip{position:absolute;top:3px;left:0;white-space:nowrap}
#compass .strip span{position:absolute;transform:translateX(-50%)}
#compass .strip span.n{color:#ff8a7a}
#compass .strip span.goal{color:var(--gold);font-size:16px;top:-1px}
#compass::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(255,212,90,.8);transform:translateX(-1px)}

/* ---------- touch controls ---------- */
#touch{position:fixed;inset:0;pointer-events:none;z-index:20}
#stickBase,#stickKnob{position:absolute;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
#stickBase{width:120px;height:120px;border:3px solid rgba(255,255,255,.45);background:rgba(0,0,0,.18)}
#stickKnob{width:54px;height:54px;background:rgba(255,255,255,.55);box-shadow:0 2px 8px rgba(0,0,0,.4)}
#stickHint{position:absolute;left:max(40px,calc(env(safe-area-inset-left) + 30px));bottom:max(46px,calc(env(safe-area-inset-bottom) + 36px));width:110px;height:110px;border-radius:50%;border:3px dashed rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:13px;color:rgba(255,255,255,.7);text-align:center;line-height:1.3}
.tb{position:absolute;pointer-events:auto;border-radius:50%;background:var(--win);border:3px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;font-family:inherit;font-size:16px;box-shadow:0 0 0 2px rgba(0,0,0,.6);touch-action:none}
.tb.on{background:#3d3420;border-color:var(--gold)}
#bA{width:88px;height:88px;right:max(22px,calc(env(safe-area-inset-right) + 16px));bottom:max(40px,calc(env(safe-area-inset-bottom) + 30px));font-size:16px}
#bB{width:64px;height:64px;font-size:13px;letter-spacing:-.05em;right:max(122px,calc(env(safe-area-inset-right) + 118px));bottom:max(30px,calc(env(safe-area-inset-bottom) + 20px))}
#bRun{width:58px;height:58px;right:max(36px,calc(env(safe-area-inset-right) + 30px));bottom:max(146px,calc(env(safe-area-inset-bottom) + 136px));font-size:13px}
#bRun.pulse{border-color:var(--gold);color:var(--gold)}
#bA.glow{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 2px rgba(0,0,0,.6),0 0 20px 6px rgba(255,212,90,.85);border-color:var(--gold)}}
#bOpt{position:absolute;pointer-events:auto;right:max(12px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));font-family:inherit;font-size:12px;background:none;border:none;color:rgba(255,255,255,.6);padding:4px}

/* ---------- title ---------- */
#title{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,0),rgba(0,0,0,.55) 75%)}
#title .logo{font-family:"Shippori Mincho B1",serif;font-weight:800;text-align:center;line-height:1;filter:drop-shadow(0 4px 0 #3a2208) drop-shadow(0 8px 18px rgba(0,0,0,.8))}
#title .logo .l1{font-size:clamp(16px,2.6vw,24px);letter-spacing:.6em;color:#f2e2b0;margin-bottom:10px}
#title .logo .l2{font-size:clamp(54px,11vw,116px);letter-spacing:.06em;background:linear-gradient(180deg,#fff7d0 0%,#ffd76a 38%,#d89a2a 62%,#fff0a8 64%,#b87818 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1.5px #5a3608}
#title .logo .l3{font-size:clamp(15px,2.4vw,24px);color:#fff;letter-spacing:.24em;margin-top:16px;text-shadow:0 2px 6px #000}
#title .swd{width:min(70vw,520px);height:3px;margin:16px auto 0;background:linear-gradient(90deg,transparent,#ffe7a0,transparent)}
#tmenu{position:relative;margin-top:46px;min-width:230px}
#title .press{margin-top:38px;font-size:18px;letter-spacing:.3em;animation:blink 1.2s steps(2) infinite;text-shadow:0 2px 4px #000}
#title .cr{position:absolute;bottom:max(10px,env(safe-area-inset-bottom));font-size:12px;color:rgba(255,255,255,.6);letter-spacing:.2em}

/* ---------- battle ---------- */
#bwrap{position:fixed;inset:0;z-index:30;pointer-events:none}
#bwrap .win{pointer-events:auto}
#bparty{position:absolute;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);display:flex;gap:10px;pointer-events:none}
#bparty .pc{min-width:132px;font-size:17px}
#benemy{left:max(10px,env(safe-area-inset-left));bottom:calc(max(14px,env(safe-area-inset-bottom)) + 150px);min-width:220px}
#ending{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden}
#ending .roll{position:absolute;left:0;right:0;text-align:center;font-family:"Shippori Mincho B1",serif;font-weight:800;color:#fff;text-shadow:0 2px 8px #000;line-height:2.2;font-size:clamp(17px,2.6vw,24px);letter-spacing:.12em}
#ending .roll h2{font-size:1.8em;color:var(--gold);margin:1.2em 0 .4em;letter-spacing:.2em}
#ending .roll small{display:block;color:#e8d9b0;font-size:.75em;letter-spacing:.3em}
@media (max-width:640px){
  .win{font-size:16px;padding:10px 12px}
  #msg{min-height:116px}
  .pc{min-width:0;width:31vw;max-width:118px;font-size:13px;padding:4px 6px}
  #party{gap:4px}
  #bparty{gap:4px;width:96vw;justify-content:center}
  #bparty .pc{min-width:0;width:31vw;font-size:14px}
  #compass{top:calc(max(10px,env(safe-area-inset-top)) + 62px);width:180px}
  #quest{top:calc(max(10px,env(safe-area-inset-top)) + 92px);font-size:12px}
  #gold{top:calc(max(10px,env(safe-area-inset-top)) + 62px);left:max(10px,env(safe-area-inset-left));right:auto;bottom:auto;font-size:14px;padding:3px 9px}
  #hint{font-size:14px;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 216px);white-space:normal;width:max-content;max-width:92vw;text-align:center;line-height:1.45}
  #title .logo .l2{font-size:clamp(36px,12.5vw,116px);white-space:nowrap;letter-spacing:0}
  #title .logo .l1{letter-spacing:.3em}
}
#loading{position:fixed;inset:0;z-index:70;background:#05070c;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;font-size:18px;letter-spacing:.2em}
#loading .bar{width:220px;height:6px;border:1px solid #fff;border-radius:3px;overflow:hidden}
#loading .bar b{display:block;height:100%;width:0;background:#fff;transition:width .2s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="hud" class="hide">
  <div id="party"></div>
  <div id="compass"><div class="strip"></div></div>
  <div id="gold"><b>0</b> G</div>
  <div id="quest"></div>
  <div id="area"></div>
  <div id="hint"></div>
</div>
<div id="touch" class="hide">
  <div id="stickHint">ここを<br>ゆびで<br>うごかす</div>
  <div id="stickBase" class="hide"></div><div id="stickKnob" class="hide"></div>
  <button class="tb" id="bA">はなす</button>
  <button class="tb" id="bB">メニュー</button>
  <button class="tb" id="bRun">はしる</button>
</div>
<div id="bwrap" class="hide"><div id="bparty"></div></div>
<div id="ui" style="position:fixed;inset:0;z-index:52;pointer-events:none"></div>
<div id="title" class="hide">
  <div class="logo">
    <div class="l1">ゆうしゃ ふーたんの ぼうけん</div>
    <div class="l2">ふーたん クエスト</div>
    <div class="swd"></div>
    <div class="l3">〜 ねむれる おひさまと よふかし まおう 〜</div>
  </div>
  <div class="press" id="press">タップ または キーを おしてね</div>
  <div class="win hide" id="tmenu"><ul class="list"></ul></div>
  <div class="cr">© 2026 FUTAN QUEST</div>
</div>
<div id="ending" class="hide"><div class="roll"></div></div>
<div id="loading"><div>ぼうけんの じゅんびちゅう…</div><div class="bar"><b></b></div></div>
<div id="flash"></div>
<div id="fade"></div>
<script src="./three.min.js"></script>
<script>
"use strict";
// ================================================================ core utils
const $ = s => document.querySelector(s);
const V3 = THREE.Vector3;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const sstep = (a, b, x) => smooth(clamp((x - a) / (b - a), 0, 1));
const angWrap = a => Math.atan2(Math.sin(a), Math.cos(a));
const lerpAng = (a, b, t) => a + angWrap(b - a) * t;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const sleep = ms => new Promise(r => setTimeout(r, ms));
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let RND = mulberry(20261001);
const rr = (a, b) => a + (b - a) * RND();
const ri = (a, b) => Math.floor(rr(a, b + 1));
const pick = a => a[Math.floor(RND() * a.length)];
const mr = (a, b) => a + (b - a) * Math.random();
const mi = (a, b) => Math.floor(mr(a, b + 1));
const mpick = a => a[Math.floor(Math.random() * a.length)];
const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
const lowEnd = /low/.test(location.search) || (isTouch && Math.min(screen.width, screen.height) < 700);
const Q = {
  pr: Math.min(devicePixelRatio || 1, isTouch ? (lowEnd ? 1.3 : 1.7) : 2),
  shadow: lowEnd ? 1024 : 2048,
  terr: lowEnd ? 320 : 480,
  grass: lowEnd ? 26000 : 70000,
  trees: lowEnd ? 1100 : 2000,
};

// value noise (tileable) + fbm
function makeNoise2(seed, period) {
  const r = mulberry(seed), P = period, g = new Float32Array(P * P);
  for (let i = 0; i < g.length; i++) g[i] = r();
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
    const x0 = ((xi % P) + P) % P, y0 = ((yi % P) + P) % P, x1 = (x0 + 1) % P, y1 = (y0 + 1) % P;
    const u = smooth(fx), v = smooth(fy);
    return lerp(lerp(g[y0 * P + x0], g[y0 * P + x1], u), lerp(g[y1 * P + x0], g[y1 * P + x1], u), v);
  };
}
function fbm(n, x, y, oct) { let s = 0, a = 0.5, f = 1, t = 0; for (let k = 0; k < oct; k++) { s += a * n(x * f, y * f); t += a; f *= 2.03; a *= 0.5; } return s / t; }

// ================================================================ renderer / scene
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Q.pr);
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.82;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.15, 5000);
function fitView() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 1 ? clamp(55 / Math.pow(camera.aspect, 0.55), 55, 80) : 55; camera.updateProjectionMatrix(); }
fitView(); addEventListener('resize', fitView); addEventListener('orientationchange', () => setTimeout(fitView, 300));

// ================================================================ sun / sky
const SUN = new V3();
{ const el = 0.72, az = 2.6; SUN.set(Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az)).normalize(); }
const skyU = {
  sunPosition: { value: SUN.clone().multiplyScalar(4000) }, up: { value: new V3(0, 1, 0) },
  turbidity: { value: 2.4 }, rayleigh: { value: 1.25 }, mieCoefficient: { value: 0.003 }, mieDirectionalG: { value: 0.82 },
  hazeCol: { value: new THREE.Color(0xa9bccb) }, uNight: { value: 0 }, uTime: { value: 0 }, uCloud: { value: 1 }
};
const skyMat = new THREE.ShaderMaterial({
  uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `
uniform vec3 sunPosition; uniform float rayleigh; uniform float turbidity; uniform float mieCoefficient; uniform vec3 up;
varying vec3 vWorldPosition; varying vec3 vSunDirection; varying float vSunfade; varying vec3 vBetaR; varying vec3 vBetaM; varying float vSunE;
const float e = 2.718281828459045;
const vec3 totalRayleigh = vec3( 5.804542996261093E-6, 1.3562911419845635E-5, 3.0265902468824876E-5 );
const vec3 MieConst = vec3( 1.8399918514433978E14, 2.7798023919660528E14, 4.0790479543861094E14 );
const float cutoffAngle = 1.6110731556870734; const float steepness = 1.5; const float EE = 1000.0;
float sunIntensity( float c ) { c = clamp( c, -1.0, 1.0 ); return EE * max( 0.0, 1.0 - pow( e, -( ( cutoffAngle - acos( c ) ) / steepness ) ) ); }
vec3 totalMie( float T ) { float c = ( 0.2 * T ) * 10E-18; return 0.434 * c * MieConst; }
void main() {
  vec4 worldPosition = modelMatrix * vec4( position, 1.0 );
  vWorldPosition = worldPosition.xyz;
  gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
  gl_Position.z = gl_Position.w;
  vSunDirection = normalize( sunPosition );
  vSunE = sunIntensity( dot( vSunDirection, up ) );
  vSunfade = 1.0 - clamp( 1.0 - exp( ( sunPosition.y / 450000.0 ) ), 0.0, 1.0 );
  float rayleighCoefficient = rayleigh - ( 1.0 * ( 1.0 - vSunfade ) );
  vBetaR = totalRayleigh * rayleighCoefficient;
  vBetaM = totalMie( turbidity ) * mieCoefficient;
}`,
  fragmentShader: `
varying vec3 vWorldPosition; varying vec3 vSunDirection; varying float vSunfade; varying vec3 vBetaR; varying vec3 vBetaM; varying float vSunE;
uniform float mieDirectionalG; uniform vec3 up; uniform vec3 hazeCol; uniform float uNight; uniform float uTime; uniform float uCloud;
const float pi = 3.141592653589793;
const float rayleighZenithLength = 8.4E3; const float mieZenithLength = 1.25E3;
const float sunAngularDiameterCos = 0.99993;
const float THREE_OVER_SIXTEENPI = 0.05968310365946075; const float ONE_OVER_FOURPI = 0.07957747154594767;
float rayleighPhase( float cosTheta ) { return THREE_OVER_SIXTEENPI * ( 1.0 + pow( cosTheta, 2.0 ) ); }
float hgPhase( float cosTheta, float g ) { float g2 = pow( g, 2.0 ); float inverse = 1.0 / pow( 1.0 - 2.0 * g * cosTheta + g2, 1.5 ); return ONE_OVER_FOURPI * ( ( 1.0 - g2 ) * inverse ); }
float h21( vec2 p ) { p = fract( p * vec2( 123.34, 456.21 ) ); p += dot( p, p + 45.32 ); return fract( p.x * p.y ); }
void main() {
  vec3 direction = normalize( vWorldPosition - cameraPosition );
  float zenithAngle = acos( max( 0.0, dot( up, direction ) ) );

async function hurtParty(t, dmg) {

    AU.stop(0.3); await AU.jingle('bad');

}
async function levelUps(p) {
  while (p.lv < MAXLV && p.exp >= expFor(p.lv + 1)) {
    const before = pStats(p), oldSp = spellsOf(p);
    p.lv++;
    const after = pStats(p);
    p.hp += after.maxhp - before.maxhp; p.mp += after.maxmp - before.maxmp;
    await AU.jingle('lvup');
    setAct(partyModel(p.id), 'cheer'); fxBurst(partyModel(p.id).position.clone().add(new V3(0, 1, 0)), 0xffe08a, 30, 3, 0.3, 1);
    await UI.msg(`${pname(p)}は レベル${p.lv}に あがった！`, { append: true, voice: true });
    const parts = [];
    if (after.atk - before.atk) parts.push(`ちから +${after.atk - before.atk}`);
    if (after.maxhp - before.maxhp) parts.push(`HP +${after.maxhp - before.maxhp}`);
    if (after.maxmp - before.maxmp) parts.push(`MP +${after.maxmp - before.maxmp}`);
    if (after.def - before.def) parts.push(`まもり +${after.def - before.def}`);
    await UI.msg(parts.join('　'), { append: true, auto: 1100, voice: false });
    for (const s of spellsOf(p)) if (!oldSp.includes(s)) await UI.msg(`${pname(p)}は ${SPELLS[s].name}を おぼえた！`, { append: true, voice: true });
    drawBParty();
  }
}

function updateBattleCam(dt, time) {
  BT.camT += dt;
  const sway = Math.sin(BT.camT * 0.25) * 0.22;
  const f = BT.F.clone().applyAxisAngle(new V3(0, 1, 0), sway);
  const big = BT.en.some(e => e.def.boss) ? (BT.en.some(e => e.def.model === 'bigdragon') ? 1.6 : 1.25) : 1;
  let look = BT.C.clone().addScaledVector(BT.F, 4.2).add(new V3(0, 0.2 + 0.7 * big, 0));
  let pos = BT.C.clone().addScaledVector(f, -3.6 * big).add(new V3(0, 2.1 * big, 0)).addScaledVector(BT.R, (2.6 + 0.8 * Math.sin(BT.camT * 0.17)) * big);
  if (BT.focus && BT.focus.model) { const fp = midPos(BT.focus); look.lerp(fp, 0.35); pos.lerp(fp.clone().addScaledVector(BT.F, -5 * big).add(new V3(0, 1.6 * big, 0)), 0.25); }
  const k = BT.snap ? 1 : 1 - Math.exp(-3 * dt); BT.snap = false;
  CAM.x = lerp(CAM.x, pos.x, k); CAM.y = lerp(CAM.y, pos.y, k); CAM.z = lerp(CAM.z, pos.z, k);
  CAM.lx = CAM.lx == null ? look.x : lerp(CAM.lx, look.x, k); CAM.ly = CAM.ly == null ? look.y : lerp(CAM.ly, look.y, k); CAM.lz = CAM.lz == null ? look.z : lerp(CAM.lz, look.z, k);
  camera.position.set(CAM.x, CAM.y, CAM.z);
  if (CAM.shake > 0) { CAM.shake = Math.max(0, CAM.shake - dt * 2.5); camera.position.x += (Math.random() - 0.5) * CAM.shake * 0.25; camera.position.y += (Math.random() - 0.5) * CAM.shake * 0.25; }
  camera.lookAt(CAM.lx, CAM.ly, CAM.lz);
  for (const e of BT.en) if (!e.dead) animMonster(e.model, dt, !!e.model.userData.moving);
  for (const p of GAME.party) animChar(partyModel(p.id), dt, partyModel(p.id).userData.moving ? 1 : 0);
  if (ARROW && ARROW.userData.o && ARROW.userData.o.target) { const t = ARROW.userData.o.target; ARROW.position.copy(headPos(t)).add(new V3(0, 0.45 + Math.sin(time * 6) * 0.1, 0)); ARROW.rotation.y += dt * 3; }
}

async function openChest(id, c) {
  const m = c.model; AU.chest();
  for (let i = 0; i <= 10; i++) { m.userData.lid.rotation.x = -i / 10 * 1.9; await sleep(25); }
  GAME.save.chests[id + c.key] = 1;
  const [it, n] = c.item;
  fxBurst(m.position.clone().add(new V3(0, 0.6, 0)), 0xffe08a, 20, 2, 0.25, 0.8);
  await nar('ふーたんは たからばこを あけた！');

  GAME.persist();
}
// ---------------------------------------------------------------- cutscene camera helper
function camTo(pos, look, dur) {
  return new Promise(res => {
    const p0 = camera.position.clone(), l0 = CAM.look ? CAM.look.clone() : FIELD.P.model.position.clone().add(new V3(0, 1, 0)), t0 = performance.now();
    CAM.override = () => {
      const k = smooth(Math.min(1, (performance.now() - t0) / (dur * 1000)));
      camera.position.lerpVectors(p0, pos, k); CAM.look = l0.clone().lerp(look, k); camera.lookAt(CAM.look);
      CAM.x = camera.position.x; CAM.y = camera.position.y; CAM.z = camera.position.z;
      if (k >= 1 && !CAM._done) { CAM._done = true; res(); }
    };
    CAM._done = false;
  });
}
function camRelease() { CAM.override = null; CAM.look = null; }

async function bridgeEvent() {
  if (!GAME.bag.tsumiki) { await nar('はしの まんなかが こわれていて わたれない…。\n\nなにか なおす ほうほうは ないかな？'); return; }
  if (!await UI.yesno('はしが こわれている。 まほうの つみきを つかいますか？')) return;
  UI.hideMsg(); GAME.mode = 'event';
  await camTo(new V3(14, 9, PL.bridge.z + 14), new V3(0, 1.5, PL.bridge.z), 1.5);
  AU.magic(); setAct(FIELD.P.model, 'cast');
  // toy blocks fly into place
  const cols = [0xe84a3a, 0x3a8fe8, 0xf8c81c, 0x4ab84a, 0xa84ae8];
  const blocks = [];
  for (let i = 0; i < 24; i++) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshStandardMaterial({ color: cols[i % 5], roughness: 0.4 }));
    m.position.copy(FIELD.P.model.position).add(new V3(0, 1, 0)); m.castShadow = true; scene.add(m);
    blocks.push({ m, to: new V3((i % 6 - 2.5) * 0.8, bridgeDeckY(PL.bridge.z) - 0.4, PL.bridge.z - 2.6 + Math.floor(i / 6) * 1.6) });
  }
  const t0 = performance.now();
  while (true) {
    const k = (performance.now() - t0) / 1600; if (k > 1.2) break;
    blocks.forEach((b, i) => { const kk = clamp(k * 1.2 - i * 0.015, 0, 1); const from = FIELD.P.model.position.clone().add(new V3(0, 1, 0)); b.m.position.lerpVectors(from, b.to, smooth(kk)); b.m.position.y += Math.sin(kk * Math.PI) * 4; b.m.rotation.set(kk * 6, kk * 4, 0); });
    await sleep(16);
  }
  screenFlash('#fff', 0.8, 600); AU.bell();
  for (const b of blocks) { scene.remove(b.m); }
  fixBridge(false); BRIDGE.mesh.material.color.set(0xffffff);
  GAME.removeItem('tsumiki');
  await AU.jingle('key');
  await nar('つみきが ぴったり はまって、 はしが なおった！');
  F().bridge = 1; UI.hideMsg(); camRelease(); GAME.mode = 'field'; GAME.persist(); GAME.refreshHUD();
}

// ---------------------------------------------------------------- per-frame field logic
let trigBusy = false;
function updateTriggers() {
  const P = FIELD.P;

    if (t.area !== FIELD.area) { t.inside = false; continue; }
    const inside = Math.hypot(P.x - t.x, P.z - t.z) < t.r;
    if (inside && !t.inside) {
      t.inside = true;
      if (t.once && GAME.flags[t.once]) continue;
      if (t.silent) { t.fn(t); continue; }
      if (trigBusy) { t.inside = false; continue; }
      trigBusy = true; FIELD.frozen = true;
      Promise.resolve(t.fn(t)).catch(e => console.error(e)).finally(() => { trigBusy = false; FIELD.frozen = false; UI.hideMsg(); });
    } else if (!inside) t.inside = false;

}

  buildEnv(); setAtmos(0, true);
  buildNPCs(); buildAmbient();
  await prog(0.95);
  FIELD.P = null;
  initPlayer(SPOT.start.x, SPOT.start.z, Math.PI); FIELD.P.model.visible = false;
  camera.position.set(0, 20, 220); camera.lookAt(0, 0, 178);
  try { renderer.compile(scene, camera); } catch (e) { }
  await prog(1);
  $('#loading').style.transition = 'opacity .6s'; $('#loading').style.opacity = '0'; setTimeout(() => $('#loading').remove(), 700);
  GAME.title();
  GAME.onKey = (k) => { if (GAME.mode === 'title' && GAME._titleWait && k) { GAME.titleTap(); return true; } return false; };
  $('#title').addEventListener('pointerdown', () => { if (GAME._titleWait) GAME.titleTap(); });
}
requestAnimationFrame(frame);
boot().catch(e => { console.error(e); $('#loading').innerHTML = '<div style="padding:20px;text-align:center;line-height:1.8">よみこみに しっぱい しました…<br><small>' + esc(e.message) + '</small></div>'; });
</script>
</body>
</html>
