<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ひらめき スープ屋</title>
<style>
:root{
  --bg:#1b1a2e;--bg2:#24223d;--card:#2f2c4d;--card2:#3a3660;--ink:#f4efe4;--sub:#b9b2d6;--line:#4c4778;
  --gold:#f2c46d;--gold2:#ffdf9c;--yes:#5fd39a;--no:#ff7a8a;--irr:#9aa3c7;--part:#ffc36b;--key:#ffd75e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,#2e2a52 0%,var(--bg) 60%) fixed,var(--bg);color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;line-height:1.6;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{position:relative;max-width:620px;height:100%;margin:0 auto;display:flex;flex-direction:column}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}

/* ---- title ---- */
#title{align-items:center;justify-content:safe center;text-align:center;padding:24px 16px;gap:10px;overflow:auto}
.sign{position:relative;padding:18px 26px 16px;border:3px solid var(--gold);border-radius:18px;background:linear-gradient(#3a2f2a,#2a221f);
  box-shadow:0 0 0 6px #2a221f,0 0 30px rgba(242,196,109,.25)}
.sign h1{margin:0;font-size:clamp(30px,9vw,46px);letter-spacing:.06em;color:var(--gold2);text-shadow:0 0 12px rgba(255,200,100,.5)}
.sign p{margin:2px 0 0;color:#e6d3b0;font-size:14px;letter-spacing:.1em}
.master{flex:none;width:150px;height:150px;margin:8px auto 0;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.master.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.lead{color:var(--sub);font-size:14px;max-width:420px;margin:0}
@media (max-height:620px){#title{gap:6px;padding:12px 16px}#title .master{width:96px;height:96px;margin:0 auto}.big{padding:10px}}
.big{display:block;width:min(320px,90%);margin:6px auto 0;padding:14px;border-radius:16px;font-size:20px;font-weight:800;color:#2a1d10;
  background:linear-gradient(var(--gold2),var(--gold));box-shadow:0 4px 0 #a9813a,0 8px 18px rgba(0,0,0,.35);transition:transform .08s}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #a9813a}
.sub-btn{display:block;width:min(320px,90%);margin:4px auto 0;padding:11px;border-radius:14px;font-weight:700;background:var(--card);border:2px solid var(--line)}
.prog{font-size:13px;color:var(--sub)}

/* ---- menu ---- */
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(20,18,36,.85);border-bottom:1px solid var(--line);backdrop-filter:blur(6px);z-index:2}
.bar h2{flex:1;margin:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:18px;display:grid;place-items:center;flex:none}
.pts{font-weight:800;color:var(--gold2);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 10px;font-size:15px;white-space:nowrap}
.list{flex:1;overflow:auto;padding:14px 16px 30px;display:flex;flex-direction:column;gap:10px}
.stage{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:16px;background:var(--card);border:2px solid var(--line);transition:border-color .12s,transform .08s}
.stage:hover{border-color:var(--gold)}
.stage:active{transform:scale(.99)}
.stage .no{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;background:var(--bg2);color:var(--gold2)}
.stage .t{flex:1;min-width:0}
.stage .t b{display:block;font-size:16px}
.stage .t small{color:var(--sub);font-size:12px}
.stage .rk{flex:none;width:42px;text-align:center;font-weight:900;font-size:22px}
.rk.S{color:#ffd75e;text-shadow:0 0 10px rgba(255,215,94,.6)}.rk.A{color:#ff9fd0}.rk.B{color:#7fd8ff}.rk.C{color:#b9b2d6}.rk.G{color:#6b6690;font-size:13px}

/* ---- play ---- */
#play .problem{margin:10px 12px 0;padding:12px 14px;border-radius:16px;background:linear-gradient(#3b3226,#2d2620);border:2px solid #6b5636;position:relative;flex:none}
.problem .lbl{font-size:12px;color:var(--gold);font-weight:800;letter-spacing:.1em}
.problem .txt{font-size:15px;max-height:40vh;overflow:auto}
.problem.fold .txt{max-height:3.2em;overflow:hidden;-webkit-mask:linear-gradient(#000 55%,transparent)}
.problem .tog{position:absolute;right:8px;top:6px;font-size:12px;color:var(--sub);padding:2px 8px;border-radius:8px;background:rgba(0,0,0,.25)}
.log{flex:1;overflow:auto;padding:12px 12px 16px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%;animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.msg .av{flex:none;width:34px;height:34px}
.msg .bb{padding:8px 12px;border-radius:16px;font-size:15px;background:var(--card);border:1px solid var(--line)}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bb{background:#4a4380;border-color:#5f57a3;border-bottom-right-radius:4px}
.msg.mt .bb{border-bottom-left-radius:4px}
.ans{display:inline-block;font-weight:900;font-size:17px;margin-right:6px}
.ans.y{color:var(--yes)}.ans.n{color:var(--no)}.ans.x{color:var(--irr)}.ans.p{color:var(--part)}
.keytag{display:inline-block;margin-top:4px;font-size:12px;font-weight:800;color:#2a1d10;background:var(--key);border-radius:99px;padding:0 8px}
.flash{display:inline-block;font-size:12px;font-weight:800;color:#fff;background:#d65ad0;border-radius:99px;padding:0 8px;margin-left:4px}
.sys{align-self:center;font-size:12px;color:var(--sub);background:rgba(0,0,0,.25);padding:3px 10px;border-radius:99px;text-align:center;max-width:95%}
.hintmsg .bb{background:#3d3520;border-color:#7a6430}

.dock{flex:none;padding:8px 10px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:rgba(20,18,36,.92);border-top:1px solid var(--line)}
.ask{display:flex;gap:6px}
.ask input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:9px 12px;outline:none}
.ask input:focus{border-color:var(--gold)}
.ask button{flex:none;padding:0 16px;border-radius:14px;font-weight:800;background:var(--card2);border:2px solid var(--line)}
.acts{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.3fr;gap:6px;margin-top:7px}
.acts button{padding:9px 4px;border-radius:13px;font-weight:800;font-size:14px;background:var(--card);border:2px solid var(--line);position:relative;white-space:nowrap}
.acts .solve{background:linear-gradient(var(--gold2),var(--gold));color:#2a1d10;border-color:#a9813a}
.badge{position:absolute;top:-7px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--key);color:#2a1d10;font-size:12px;line-height:20px}
.badge.new{background:#ff6fb5;color:#fff}

/* ---- sheets ---- */
.veil{position:absolute;inset:0;background:rgba(6,5,15,.6);display:none;z-index:5;animation:fade .15s}
.veil.on{display:block}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:82%;display:flex;flex-direction:column;background:var(--bg2);border-top:2px solid var(--line);border-radius:22px 22px 0 0;
  padding-bottom:env(safe-area-inset-bottom);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.3}}
.sheet header{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.sheet header h3{flex:1;margin:0;font-size:17px}
.sheet .body{overflow:auto;padding:4px 14px 18px;display:flex;flex-direction:column;gap:7px}
.qbtn{text-align:left;padding:11px 13px;border-radius:13px;background:var(--card);border:1px solid var(--line);font-size:15px;transition:border-color .1s}
.qbtn:hover{border-color:var(--gold)}
.qbtn.new{border-color:#ff6fb5;box-shadow:inset 3px 0 0 #ff6fb5}
.qbtn.done{opacity:.55;cursor:default;font-size:14px}
.sec{font-size:12px;color:var(--sub);font-weight:800;margin:6px 2px 0}
.fact{padding:10px 12px;border-radius:12px;background:#3a3322;border:1px solid #6b5a2e;font-size:15px}
.fact::before{content:"🔑 "}
.empty{color:var(--sub);font-size:14px;text-align:center;padding:16px}
.choice{text-align:left;padding:13px 14px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-size:15px;font-weight:700}
.choice:hover{border-color:var(--gold)}
.choice.bad{opacity:.4;text-decoration:line-through;cursor:default;border-color:var(--no)}
.note{font-size:13px;color:var(--sub)}
.giveup{align-self:center;font-size:13px;color:var(--sub);text-decoration:underline;padding:6px}

/* ---- result ---- */
#result{overflow:auto;align-items:center;padding:20px 16px 30px;padding-top:max(20px,env(safe-area-inset-top));gap:12px;text-align:center}
.stamp{font-size:30px;font-weight:900;color:var(--gold2);letter-spacing:.12em;animation:pop .4s}
.rankbig{font-size:84px;font-weight:900;line-height:1;animation:zoom .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes zoom{from{transform:scale(2.5);opacity:0}}
.truth{text-align:left;width:100%;padding:14px 16px;border-radius:16px;background:linear-gradient(#3b3226,#2d2620);border:2px solid #6b5636}
.truth h4{margin:0 0 4px;color:var(--gold);font-size:13px;letter-spacing:.1em}
.truth p{margin:0;font-size:15px}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.stats span{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 10px;font-size:13px}
.row{display:flex;gap:8px;width:100%;max-width:420px}
.row button{flex:1}

/* ---- howto ---- */
.how p{margin:0 0 8px;font-size:15px}
.how .ex{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.how .ex span{font-size:13px;padding:2px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line)}

.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#d65ad0;color:#fff;font-weight:800;padding:6px 16px;border-radius:99px;z-index:9;
  box-shadow:0 6px 16px rgba(0,0,0,.4);animation:toast 1.6s forwards;pointer-events:none;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- タイトル -->
  <section class="screen on" id="title">
    <div class="sign"><h1>ひらめき スープ屋</h1><p>ひとりで あそべる 水平思考クイズ</p></div>
    <svg class="master bob" id="masterBig" viewBox="0 0 120 120"></svg>
    <p class="lead">「いらっしゃい。今夜も ふしぎな お話を ご用意しましたよ」<br>店主のカメ吉が「はい／いいえ」で答えてくれる。質問をかさねて、お話の<b>真相</b>を あばこう。</p>
    <button class="big" id="btnStart">あそぶ</button>
    <button class="sub-btn" id="btnHow">あそびかた</button>
    <div class="prog" id="titleProg"></div>
  </section>

  <!-- 問題えらび -->
  <section class="screen" id="menu">
    <div class="bar"><button class="icon-btn" data-go="title" aria-label="もどる">←</button><h2>本日の メニュー</h2><span class="pts" id="menuTotal"></span></div>
    <div class="list" id="stageList"></div>
  </section>

  <!-- プレイ -->
  <section class="screen" id="play">
    <div class="bar"><button class="icon-btn" id="btnBack" aria-label="もどる">←</button><h2 id="pTitle"></h2><span class="pts" id="pScore"></span></div>
    <div class="problem" id="problem"><div class="lbl">QUESTION</div><div class="txt" id="pText"></div><button class="tog" id="pTog">たたむ</button></div>
    <div class="log" id="log"></div>
    <div class="dock">
      <form class="ask" id="askForm" autocomplete="off">
        <input id="askInput" placeholder="自由に質問してみよう（例：男は背が低い？）" enterkeyhint="send">
        <button type="submit">聞く</button>
      </form>
      <div class="acts">
        <button id="btnQ">📋 質問リスト<span class="badge new" id="qBadge" hidden></span></button>
        <button id="btnMemo">🔑 メモ<span class="badge" id="memoBadge" hidden></span></button>
        <button id="btnHint">💡 ヒント</button>
        <button class="solve" id="btnSolve">🎯 答える</button>
      </div>
    </div>
  </section>

  <!-- けっか -->
  <section class="screen" id="result"></section>

  <div class="veil" id="veil"><div class="sheet" id="sheet"></div></div>
</div>

<script>
'use strict';
/* =========================================================
   問題データ
   a: y=はい n=いいえ x=関係ありません p=部分的にはい
   f: 重要な事実（メモに残る） id/r: r の質問をすると出てくる
   k: キーワード（グループごとに1つ以上ふくまれていれば一致）
   ========================================================= */
const PUZZLES = [
{
  id:'hair', title:'ぬれない髪', lv:1,
  q:'どしゃ降りの雨の中、ある男が 傘も帽子もなしに 30分間 外に立っていた。服は びしょぬれに なったのに、男の髪の毛は 1本も ぬれなかった。いったい なぜ？',
  truth:'男は スキンヘッド（はげ頭）で、そもそも 髪の毛が 1本も なかった。「1本も ぬれなかった」のは、ぬれる髪が なかったからなのです。',
  choices:['男には 髪の毛が 1本も なかったから','男は 屋根のある バス停の下に 立っていたから','髪に 強力な 防水スプレーを かけていたから','男は ずっと 逆立ちを していたから'],
  hints:['雨は ちゃんと 男の頭に 当たっていたよ。','「ぬれなかった」のは、髪のほうに 理由が あるのかも？','そもそも、ぬれる髪の毛は あったのかな？'],
  qs:[
    {q:'男は 屋根の下に いましたか？',a:'n',k:[['屋根','やね','軒','建物','屋内','室内','バス停']]},
    {q:'男は 何かで 頭を 守っていましたか？',a:'n',k:[['頭','あたま'],['守','まも','隠','かく','覆','おお','かぶ','被']]},
    {q:'雨は 男の頭に 当たっていましたか？',a:'y',f:'雨は 男の頭に ちゃんと 当たっていた',k:[['頭','あたま'],['当た','あた','かか','濡','ぬれ']]},
    {q:'髪に 特別な 薬や スプレーを 使っていましたか？',a:'n',k:[['薬','くすり','スプレー','ワックス','防水','撥水','整髪']]},
    {id:'style',q:'男の 髪型が 関係ありますか？',a:'y',f:'男の 髪型（頭）が 関係している',k:[['髪型','かみがた','ヘア','頭','あたま']]},
    {id:'few',r:'style',q:'男は 髪の毛が 少ないですか？',a:'y',f:'男は 髪の毛が 少ない…？',k:[['髪','かみ','毛'],['少な','すくな','うす','薄','ない','無','はげ','禿','ぼうず','坊主']]},
    {r:'few',q:'男には 髪の毛が 1本も ないのですか？',a:'y',f:'男には 髪の毛が 1本も ない！',k:[['1本','一本','いっぽん','まったく','全く','全然','ぜんぜん','はげ','禿','すきんへっど','ぼうず','坊主']]},
    {q:'男は 長いあいだ じっと 立っていましたか？',a:'y',k:[['立','たって','じっと']]},
    {q:'男は 人間ですか？',a:'y',k:[['人間','にんげん']]},
    {q:'男は ロボットや 人形ですか？',a:'n',k:[['ロボット','人形','にんぎょう','マネキン','像']]},
    {q:'雨は ふつうの 雨でしたか？',a:'y',k:[['雨','あめ'],['普通','ふつう','本物','ほんもの']]},
    {q:'男は かつらを かぶっていましたか？',a:'n',k:[['かつら','ウィッグ']]},
    {q:'男の 職業は 関係ありますか？',a:'x',k:[['職業','仕事','しごと']]},
    {q:'男は 逆立ちを していましたか？',a:'n',k:[['逆立','さかだち']]},
  ]
},
{
  id:'truck', title:'信号むし', lv:1,
  q:'大型トラックの 運転手が、一方通行の道を 逆向きに 進み、さらに 車用の信号が 赤なのに 交差点を わたった。すぐそばに パトカーが いたのに、警察官は 何も 注意しなかった。なぜ？',
  truth:'運転手は そのとき トラックを 運転しておらず、歩いていた。一方通行は 車の ルールなので 歩行者には 関係なし。交差点は 歩行者が どの方向にも わたれる スクランブル交差点で、歩行者用の信号は 青だったのです。',
  choices:['運転手は そのとき 歩いていたから','警察官が 居眠りを していたから','救急の 荷物を 運んでいて 特別に 許されていたから','信号が 故障していることを 警察も 知っていたから'],
  hints:['警察官は ちゃんと 運転手を 見ていたよ。','運転手は 何も ルール違反を していない。','運転手は そのとき「運転中」だったのかな？'],
  qs:[
    {id:'nodrive',q:'運転手は トラックを 運転していましたか？',a:'n',f:'運転手は そのとき トラックを 運転していなかった！',k:[['運転','うんてん','乗','のって','のり'],['トラック','車','くるま','中']]},
    {id:'walk',r:'nodrive',q:'運転手は 歩いていましたか？',a:'y',f:'運転手は 歩いていた',k:[['歩','ある','徒歩','とほ']]},
    {r:'walk',q:'歩行者用の 信号は 青でしたか？',a:'y',f:'歩行者用の信号は 青だった',k:[['歩行者','ほこうしゃ','横断歩道'],['青','あお','信号']]},
    {q:'警察官は 運転手を 見ていましたか？',a:'y',k:[['警察','けいさつ','パトカー','おまわり'],['見','気づ','きづ','知']]},
    {q:'警察官は 眠っていましたか？',a:'n',k:[['眠','ねむ','寝']]},
    {q:'特別な 許可が ありましたか？',a:'n',k:[['許可','きょか','特別','とくべつ','緊急','きんきゅう','救急']]},
    {q:'信号は 故障していましたか？',a:'n',k:[['故障','こしょう','壊','こわ']]},
    {q:'運転手は 何か ルール違反を しましたか？',a:'n',f:'運転手は 何も ルール違反を していない',k:[['法律','ルール','違反','いはん','破','やぶ','悪い','わるい']]},
    {q:'トラックは この話に 関係ありますか？',a:'n',f:'トラックは この話に 関係ない',k:[['トラック']]},
    {q:'運転手は 自転車や バイクに 乗っていましたか？',a:'n',k:[['自転車','じてんしゃ','バイク']]},
    {q:'交差点は 特別な 交差点でしたか？',a:'p',f:'交差点は どの方向にも 歩いて わたれる「スクランブル交差点」',k:[['交差点','こうさてん','スクランブル'],['特別','とくべつ','スクランブル','変わ','かわ','どんな']]},
    {q:'夜の 出来事ですか？',a:'x',k:[['夜','昼','朝','時間']]},
    {q:'運転手は 警察官と 知り合いですか？',a:'n',k:[['知り合い','しりあい','友達','ともだち','家族']]},
  ]
},
{
  id:'coffee', title:'コーヒーの指輪', lv:1,
  q:'彼女は うっかり、大切な指輪を コーヒーの中に 落としてしまった。あわてて すぐに 拾い上げたが、指輪は 少しも ぬれていなかった。なぜ？',

/* ---------------- 音 ---------------- */
let ac=null;
function tone(f,d=.09,type='sine',v=.08,delay=0){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}

function masterSvg(cls=''){return `<svg class="${cls}" viewBox="0 0 120 120">${MASTER_SVG}</svg>`}
document.getElementById('masterBig').innerHTML=MASTER_SVG;

/* ---------------- テキスト照合 ---------------- */
function norm(s){
  return s.normalize('NFKC').toLowerCase()
    .replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60))
    .replace(/[\s、。，．,.!！?？「」『』()（）・…〜~\-]/g,'');
}
function matchQ(text,list){
  const t=norm(text);if(!t)return null;
  let best=null,bestScore=0;
  for(const q of list){
    if(norm(q.q)===t)return q;
    let score=0,ok=true;
    for(const g of q.k){
      let m=0;for(const w of g){const n=norm(w);if(n&&t.includes(n))m=Math.max(m,n.length)}
      if(!m){ok=false;break}
      score+=100+m;
    }
    if(ok&&score>=bestScore){bestScore=score;best=q}
  }
  return best;
}

/* ---------------- 画面切り替え ---------------- */
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));closeSheet()}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{SFX.tap();go(b.dataset.go)});
function go(id){if(id==='menu')renderMenu();if(id==='title')renderTitle();show(id)}

function rankOf(s){return s>=85?'S':s>=70?'A':s>=50?'B':'C'}
function renderTitle(){
  const n=PUZZLES.filter(p=>save[p.id]&&save[p.id].best!=null).length;
  $('titleProg').textContent=n?`クリア ${n} / ${PUZZLES.length} 問`:`全 ${PUZZLES.length} 問`;
}
function renderMenu(){
  let total=0;
  $('stageList').innerHTML=PUZZLES.map((p,i)=>{
    const s=save[p.id];let rk='<span class="rk G">未</span>';
    if(s&&s.best!=null){const r=rankOf(s.best);total+=s.best;rk=`<span class="rk ${r}">${r}</span>`}
    else if(s&&s.gaveup)rk='<span class="rk G">真相<br>済</span>';
    return `<button class="stage" data-i="${i}"><span class="no">${i+1}</span><span class="t"><b>${p.title}</b><small>むずかしさ ${LV[p.lv]}${s&&s.best!=null?`　ベスト ${s.best}点`:''}</small></span>${rk}</button>`;
  }).join('');
  $('menuTotal').textContent=`合計 ${total}点`;
  $('stageList').querySelectorAll('.stage').forEach(b=>b.onclick=()=>{SFX.tap();startPuzzle(+b.dataset.i)});
}

/* ---------------- プレイ ---------------- */
let G=null;
function startPuzzle(i){
  const p=PUZZLES[i];
  G={i,p,asked:new Set(),facts:[],hints:0,wrong:new Set(),qCount:0,flash:0,newQ:new Set(),done:false};
  $('pTitle').textContent=`No.${i+1} ${p.title}`;
  $('pText').textContent=p.q;
  $('problem').classList.remove('fold');$('pTog').textContent='たたむ';
  $('log').innerHTML='';
  show('play');
  sys('「はい」「いいえ」で 答えられる 質問を してね');
  master(i===0&&!save.played?'ようこそ。まずは 下の「質問リスト」から 聞いてみるのが おすすめです。自由に 文章で 聞いても かまいませんよ。':'さあ、どこからでも どうぞ。');
  save.played=1;writeSave();
  updateHud();
}
function score(){
  if(!G)return 0;
  return Math.max(10,Math.min(100,100-G.qCount*2-hintCost()-G.wrong.size*15+G.flash*3));
}
function hintCost(){return [0,10,20,35][G.hints]}
function visibleQs(){return G.p.qs.filter(q=>!q.r||G.asked.has(G.p.qs.find(x=>x.id===q.r)))}
function updateHud(){
  $('pScore').textContent=score()+'点';
  const nb=$('qBadge'),mb=$('memoBadge');
  const fresh=[...G.newQ].filter(q=>!G.asked.has(q)).length;
  nb.hidden=!fresh;nb.textContent=fresh;
  mb.hidden=!G.facts.length;mb.textContent=G.facts.length;
  $('btnHint').textContent=G.hints>=G.p.hints.length?'💡 ヒント済':'💡 ヒント';
}
function addMsg(cls,html,av){
  const d=document.createElement('div');d.className='msg '+cls;
  d.innerHTML=(av?`<span class="av">${masterSvg()}</span>`:'')+`<div class="bb">${html}</div>`;
  $('log').appendChild(d);
  requestAnimationFrame(()=>{$('log').scrollTop=$('log').scrollHeight});
  return d;
}
function master(t,extra=''){return addMsg('mt'+extra,t,true)}
function sys(t){const d=document.createElement('div');d.className='sys';d.textContent=t;$('log').appendChild(d)}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function ask(q,typed){
  if(G.done)return;
  addMsg('me',esc(typed||q.q));
  if(G.asked.has(q)){
    setTimeout(()=>{master(`<span class="ans ${q.a}">${ANS[q.a]}</span>${typed?`<br><small>（「${esc(q.q)}」は もう 聞きましたね）</small>`:'（さっきも 聞きましたね）'}`)},250);
    return;
  }
  const hidden=q.r&&!G.asked.has(G.p.qs.find(x=>x.id===q.r));
  G.asked.add(q);G.qCount++;
  if(hidden){G.flash++;}
  if(q.id){G.p.qs.filter(x=>x.r===q.id).forEach(x=>{if(!G.asked.has(x))G.newQ.add(x)})}
  const isNewFact=q.f&&!G.facts.includes(q.f);
  if(isNewFact)G.facts.push(q.f);
  setTimeout(()=>{
    let h=`<span class="ans ${q.a}">${ANS[q.a]}</span>`;
    if(typed&&norm(typed)!==norm(q.q))h+=`<br><small style="color:var(--sub)">→「${esc(q.q)}」として 答えます</small>`;
    if(hidden)h+=`<span class="flash">✨ ひらめき！ +3</span>`;
    if(isNewFact)h+=`<br><span class="keytag">🔑 いい質問です！</span> ${esc(q.f)}`;
    master(h);
    (hidden?SFX.flash:isNewFact?SFX.key:SFX[q.a])();
    if(hidden)toast('✨ ひらめき！');
    const nq=q.id?G.p.qs.filter(x=>x.r===q.id&&!G.asked.has(x)).length:0;
    if(nq)sys(`📋 質問リストに 新しい 質問が ${nq}つ 増えました`);
    updateHud();
  },300);
}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;$('app').appendChild(d);setTimeout(()=>d.remove(),1700)}

$('askForm').onsubmit=e=>{
  e.preventDefault();
  const inp=$('askInput'),t=inp.value.trim();if(!t||G.done)return;
  inp.value='';
  const q=matchQ(t,G.p.qs)||matchQ(t,COMMON.map(c=>c));
  if(!q){
    addMsg('me',esc(t));
    setTimeout(()=>{master('うーん…その 質問には うまく 答えられません。<br><small>言い方を 変えるか、「📋 質問リスト」から 選んでみてください（回数には 数えません）</small>');SFX.x()},250);
    return;
  }
  ask(q,t);
};
$('pTog').onclick=()=>{const f=$('problem').classList.toggle('fold');$('pTog').textContent=f?'ひらく':'たたむ'};
$('btnBack').onclick=()=>{SFX.tap();go('menu')};

/* ---------------- シート ---------------- */
function openSheet(title,html,after){
  $('sheet').innerHTML=`<header><h3>${title}</h3><button class="icon-btn" id="sheetX" aria-label="とじる">✕</button></header><div class="body">${html}</div>`;
  $('veil').classList.add('on');$('sheetX').onclick=closeSheet;
  if(after)after($('sheet'));
}
function closeSheet(){$('veil').classList.remove('on')}
$('veil').onclick=e=>{if(e.target===$('veil'))closeSheet()};

$('btnQ').onclick=()=>{
  SFX.tap();
  const vis=visibleQs(),open=vis.filter(q=>!G.asked.has(q)),done=vis.filter(q=>G.asked.has(q));
  open.sort((a,b)=>(G.newQ.has(b)?1:0)-(G.newQ.has(a)?1:0));
  let h=`<div class="note">タップすると 質問します（1回 −2点）。リストに ない 質問も、下の 入力らんから 自由に 聞けます。かくれた 核心の 質問を 先に 当てると <b>ひらめき +3点</b>！</div>`;
  h+=open.length?open.map(q=>`<button class="qbtn${G.newQ.has(q)?' new':''}" data-q="${G.p.qs.indexOf(q)}">${G.newQ.has(q)?'🆕 ':''}${esc(q.q)}</button>`).join(''):'<div class="empty">リストの 質問は ぜんぶ 聞きました。自由入力も ためしてみて！</div>';
  if(done.length)h+=`<div class="sec">聞いた 質問</div>`+done.map(q=>`<div class="qbtn done"><span class="ans ${q.a}" style="font-size:14px">${ANS[q.a]}</span>${esc(q.q)}</div>`).join('');
  openSheet('📋 質問リスト',h,s=>s.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const q=G.p.qs[+b.dataset.q];G.newQ.delete(q);closeSheet();ask(q)}));
};
$('btnMemo').onclick=()=>{
  SFX.tap();
  const h=G.facts.length?G.facts.map(f=>`<div class="fact">${esc(f)}</div>`).join(''):'<div class="empty">まだ 手がかりは ありません。<br>「🔑 いい質問です！」と 言われた 事実が ここに たまります。</div>';
  openSheet('🔑 わかったこと',h+(G.hints?`<div class="sec">ヒント</div>`+G.p.hints.slice(0,G.hints).map(t=>`<div class="fact" style="background:#2f2a45;border-color:var(--line)">💡 ${esc(t)}</div>`).join(''):''));
};
$('btnHint').onclick=()=>{
  SFX.tap();if(G.done)return;
  if(G.hints>=G.p.hints.length){master('ヒントは もう ありません。あとは あなたの ひらめき しだい！');return}
  const cost=[10,10,15][G.hints];
  openSheet('💡 ヒント',`<div class="note">ヒント ${G.hints+1} / ${G.p.hints.length} を 見ますか？（−${cost}点）</div><button class="big" id="hintOk" style="width:100%">見る</button>`,()=>{
    $('hintOk').onclick=()=>{closeSheet();G.hints++;addMsg('mt hintmsg',`💡 ヒント${G.hints}：${esc(G.p.hints[G.hints-1])}`,true);SFX.p();updateHud()};
  });
};
let choiceOrder=[];
$('btnSolve').onclick=()=>{
  SFX.tap();if(G.done)return;
  if(!choiceOrder.length||choiceOrder.pid!==G.p.id){choiceOrder=G.p.choices.map((c,i)=>i).sort(()=>Math.random()-.5);choiceOrder.pid=G.p.id}
  const h=`<div class="note">真相は どれ？ まちがえると −15点。</div>`+choiceOrder.map(i=>`<button class="choice${G.wrong.has(i)?' bad':''}" data-c="${i}">${esc(G.p.choices[i])}</button>`).join('')+`<button class="giveup" id="giveup">ギブアップして 真相を 見る</button>`;
  openSheet('🎯 真相を 答える',h,s=>{
    s.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
      const c=+b.dataset.c;if(G.wrong.has(c))return;
      if(c===0){closeSheet();finish(true)}
      else{G.wrong.add(c);b.classList.add('bad');SFX.bad();updateHud();closeSheet();
        addMsg('me',esc(G.p.choices[c]));
        setTimeout(()=>master('<span class="ans n">ざんねん！</span>それは 真相では ありません。<small>（−15点）</small>'),250)}
    });
    $('giveup').onclick=()=>{closeSheet();finish(false)};
  });
};

function finish(win){
  G.done=true;
  const p=G.p,sc=win?score():null;
  const s=save[p.id]||(save[p.id]={});
  let best=false;
  if(win){if(s.best==null||sc>s.best){s.best=sc;best=true}}else s.gaveup=1;
  writeSave();
  const r=win?rankOf(sc):null;
  const next=G.i+1<PUZZLES.length;
  $('result').innerHTML=`
    <div class="stamp">${win?'せいかい！':'ギブアップ'}</div>
    ${win?`<div class="rankbig rk ${r}">${r}</div><div style="font-size:22px;font-weight:800">${sc}点${best?' <span class="flash">ベスト更新</span>':''}</div>`:''}
    ${masterSvg('master')}
    <div class="truth"><h4>QUESTION</h4><p>${esc(p.q)}</p></div>
    <div class="truth"><h4>真相</h4><p>${esc(p.truth)}</p></div>
    ${win?`<div class="stats"><span>質問 ${G.qCount}回</span><span>ヒント ${G.hints}回</span><span>まちがい ${G.wrong.size}回</span><span>ひらめき ${G.flash}回</span></div>`:''}
    <div class="row"><button class="sub-btn" id="rMenu">メニューへ</button>${next?'<button class="big" id="rNext" style="margin-top:4px">つぎの お話</button>':''}</div>`;
  show('result');$('result').scrollTop=0;
  win?SFX.win():SFX.n();
  $('rMenu').onclick=()=>{SFX.tap();go('menu')};
  if(next)$('rNext').onclick=()=>{SFX.tap();startPuzzle(G.i+1)};
}

/* ---------------- タイトル ---------------- */
$('btnStart').onclick=()=>{SFX.tap();go('menu')};
$('btnHow').onclick=()=>{
  SFX.tap();
  openSheet('あそびかた',`<div class="how">
    <p>🍲 店主の カメ吉が、ちょっと ふしぎな お話（QUESTION）を 出します。</p>
    <p>❓ あなたは「はい／いいえ」で 答えられる 質問を して、お話の 真相を 推理します。答えは 4しゅるい：</p>
    <div class="ex"><span><b class="ans y">はい</b></span><span><b class="ans n">いいえ</b></span><span><b class="ans x">関係ありません</b></span><span><b class="ans p">部分的には はい</b></span></div>
    <p>📋 <b>質問リスト</b>から 選ぶか、入力らんに <b>自由に 文章で</b> 聞こう。核心に せまる 質問をすると「🔑 いい質問です！」と 手がかりが <b>メモ</b>に たまり、リストに 新しい 質問が 出てきます。</p>
    <p>✨ まだ リストに 出ていない 核心の 質問を 自由入力で 当てると <b>ひらめきボーナス</b>！</p>
    <p>🎯 真相が わかったら「答える」で 4つの 中から 選ぼう。</p>
    <p>💯 100点から スタート。質問 −2点、ヒント −10〜15点、まちがい −15点。少ない 質問で 当てるほど 高ランク（S/A/B/C）！</p>
  </div>`);
};
renderTitle();
if(location.hash.startsWith('#p')){const n=parseInt(location.hash.slice(2))-1;if(PUZZLES[n])startPuzzle(n)}
